; translations/overrides/it.ini — traduzioni personalizzate per chiave (opzionale).
;
; Ogni riga sostituisce COMPLETAMENTE il testo generato per quella chiave nei
; file *_enhancements.ini, con priorità rispetto al glossario.
;
; Formato (uguale a global.ini — \n letterale per le interruzioni di riga):
;   Chiave_Del_Miglioramento=Testo completo personalizzato\ncon interruzioni\ndi riga
;
; Le chiavi disponibili si trovano in enhancements/italian/enhancements/*.ini.
