item_Desccrlf_consumable_adrenaline_01=Manufacturer: CureLife\nItem Type: Medical Consumable\n\nFrom the Empire’s most trusted medical company, the CureLife AdrenaPen can rapidly dispense doses of the synthetic adrenaline Demexatrine during emergency situations to help relieve muscle fatigue and symptoms related to being concussed. Use only as recommended.\n\n--- EFFECT ---\nReduces concussion symptoms, normalizes weapon handling and movement speed.
item_Desccrlf_consumable_healing_01=Manufacturer: CureLife\nItem Type: Medical Consumable\n\nFrom the Empire’s most trusted medical company, the CureLife MedPen can rapidly dispense doses of the coagulant Hemozal during emergency situations to help relieve bleeding and improve a patient’s overall vitals. Use only as recommended.\n\n--- EFFECT ---\nRestores health and stops bleeding. When used on another person recovers from incapacitated state.
item_Desccrlf_consumable_overdoseRevival_01=Manufacturer: CureLife\nItem Type: Medical Consumable\n\nFrom the Empire’s most trusted medical company, the CureLife DetoxPen can rapidly dispense doses of the detoxicant Resurgera during emergency situations to help relieve symptoms associated with high blood drug levels (BDL) and overdoses. Use only as recommended.\n\n--- EFFECT ---\nRevives an overdosed person (if not incapacitated), doubles decay rate of Blood Drug Level.
item_Desccrlf_consumable_oxygen_01=Manufacturer: CureLife\n\nThis easy-to-carry disposable first-aid system is designed to refill pressure suit oxygen reserves in emergency situations. Compatible with most standard suits, the Curelife OxyPen is an ideal solution for preventing hypoxia and providing immediate access to lifesaving oxygen.\n\n--- EFFECT ---\nRecharges Oxygen reserves of a suit.
item_Desccrlf_consumable_painkiller_01=Manufacturer: CureLife\nItem Type: Medical Consumable\n\nFrom the Empire’s most trusted medical company, the CureLife OpioPen can rapidly dispense doses of the pain reliever Roxaphen during emergency situations to help relieve symptoms associated with impaired mobility and partial paralysis. Use only as recommended.\n\n--- EFFECT ---\nReduces pain symptoms, normalizes movement ability.
item_Desccrlf_consumable_radiation_01=Manufacturer: CureLife\nItem Type: Medical Consumable\n\nThe DeconPen from CureLife delivers a rapid injection of Canoiodide, a proprietary medicinal compound that treats radiation exposure.\n\n--- EFFECT ---\nReduces injuries from radiation.
item_Desccrlf_consumable_steroids_01=Manufacturer: CureLife\nItem Type: Medical Consumable\n\nFrom the Empire’s most trusted medical company, the CureLife CorticoPen can rapidly dispense doses of the corticosteroid Sterogen during emergency situations to help relieve symptoms associated with muscle weakness and respiratory damage. Use only as recommended.\n\n--- EFFECT ---\nReduces vision and hearing symptoms, normalizes stamina.
