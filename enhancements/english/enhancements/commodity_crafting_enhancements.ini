items_commodities_aslarite_desc=Aslarite is a naturally-occurring mineral that is most commonly found on asteroids. Sought for its natural thermal insulation properties, it can be processed and used in the construction of personal armor to help the wearer withstand extreme temperatures.\n\n<EM3>Locations:</EM3>\n- Aaron Halo\n- ARC-L5\n- CRU-L4\n- Fuego\n- Ita\n- Magda\n- MIC-L4\n- Pyro Asteroid Clusters\n- Vuur\n\n<EM3>BLUEPRINT DATA</EM3>\n- 4 sets (Light Engineer)\n- 5 sets (Heavy Environment)\n- 5 sets (Light Stealth)\n- 6 sets (Light Combat)\n- 8 sets (Heavy Combat)\n- 9 sets (Medium Combat)\n- Antium, Morozov-CH, Morozov-SH (Heavy Hunter)\n- Arden-CL, Arden-SL (Light Hunter)\n- Aril (Medium Salvager)\n- Artimex (Medium Stealth)\n- Badami, Microid Battle, Piecemeal Armor (Light Explorer)\n- BUL-H4 (Combat $Templates)\n- Chiron (Medic Armour)\n- Corbel, Palatino (Heavy Engineer)\n- Dust Devil, Manticore (Heavy Explorer)\n- Horizon, MacFlex, Venture (Light Cosmonaut)\n- Inquisitor, Morningstar (Medium Hunter)\n- Stirling Exploration (Heavy Radiation)\n- Strata (Medium Miner)
