items_commodities_feynmaline_desc=The paramorphic crystalline structure of this mineral is extremely volatile. When extra energy is introduced, as is typical with modern mining, the ore will often explosively degrade into the more stably structured Janalite. This instability makes Feynamline very dangerous to acquire but also extremely valuable as an industrial anti-matter precursor if it can be properly harvested.\n\n<EM3>Locations:</EM3>\n- Pyro IV\n\n<EM3>BLUEPRINT DATA</EM3>\n- Shields: 9 items
