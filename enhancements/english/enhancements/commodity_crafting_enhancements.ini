items_commodities_beradom_desc=Formed when sap from the Beraber Fir is crystalized during forest fires, this transparent deep blue "gemstone" is often polished smooth and used in jewelry. While it can be manufactured by growing trees and then doing a controlled burn, the time investment for the trees to reach the proper maturity still make this a rare commodity.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Karna Rifle\n- Shields: 27 items
