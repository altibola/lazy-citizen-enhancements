items_commodities_goldenmedmon_desc=NDR: 39\nHEI: 19\nEffects: Energizing, Hydrating\n\nGrown in temperate climates on the Maru Ebony Tree, Golden Medmons are left to fall off the tree when ripe and collected. The fruit at that stage is extremely firm and astringent. They only become edible after being 'bletted' or softened through ethylene ripening.\n\n<EM3>Locations:</EM3>\n- ARC-L5\n- CRU-L4\n- Fairo\n- Ignis\n- MIC-L3\n- Pyro Asteroid Clusters\n- Terminus\n- Vatra\n\n<EM3>BLUEPRINT DATA</EM3>\n- Cannons (4 types)\n- Electron Ammo\n- Fresnel Energy LMG\n- NDB-26 Repeater, NDB-28 Repeater, NDB-30 Repeater\n- Parallax Energy Assault Rifle\n- Prism Laser Shotgun\n- Pulse Laser Pistol, Pulse Pistol\n- Quartz Energy SMG\n- Radars: 12 items\n- Scatters (4 types)\n- Shields: 11 items\n- Zenith Laser Sniper Rifle
