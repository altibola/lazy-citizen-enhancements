items_commodities_goldenmedmon_desc=NDR: 39\nHEI: 19\nEfeitos: Energizante, Hidratante\n\nCultivados em climas temperados na Maru Ebony Tree, os Golden Medmons são deixados para cair da árvore quando maduros e coletados. A fruta nesse estágio é extremamente firme e adstringente. Eles só se tornam comestíveis após serem "bletted" ou amolecidos por meio do amadurecimento do etileno.\n\n<EM3>Locations:</EM3>\n- ARC-L5\n- CRU-L4\n- Fairo\n- Ignis\n- MIC-L3\n- Pyro Asteroid Clusters\n- Terminus\n- Vatra\n\n<EM3>BLUEPRINT DATA</EM3>\n- Cannons (4 types)\n- Electron Ammo\n- Fresnel Energy LMG\n- NDB-26 Repeater, NDB-28 Repeater, NDB-30 Repeater\n- Parallax Energy Assault Rifle\n- Prism Laser Shotgun\n- Pulse Laser Pistol, Pulse Pistol\n- Quartz Energy SMG\n- Radars: 12 items\n- Scatters (4 types)\n- Shields: 11 items\n- Zenith Laser Sniper Rifle
