item_Desccrlf_consumable_adrenaline_01=Fabricante: CureLife\nTipo de Item: Consumível Médico\n\nA AdrenaPen da CureLife, a empresa médica mais confiável do Império, pode fornecer rapidamente doses de adrenalina sintética Demexatrina em situações de emergência para aliviar a fadiga muscular e sintomas relacionados a concussões. Use apenas conforme recomendado.\n\n--- EFFECT ---\nReduces concussion symptoms, normalizes weapon handling and movement speed.
item_Desccrlf_consumable_healing_01=Fabricante: CureLife\nTipo de Item: Consumível Médico\n\nA MedPen da CureLife, a empresa médica mais confiável do Império, pode fornecer rapidamente doses do coagulante Hemozal em situações de emergência para parar o sangramento e melhorar os sinais vitais gerais do paciente. Use apenas conforme recomendado.\n\n--- EFFECT ---\nRestores health and stops bleeding. When used on another person recovers from incapacitated state.
item_Desccrlf_consumable_overdoseRevival_01=Fabricante: CureLife\nTipo de Item: Consumível Médico\n\nA DetoxPen da CureLife, a empresa médica mais confiável do Império, pode fornecer rapidamente doses do desintoxicante Resurgera em situações de emergência para aliviar os sintomas associados a níveis elevados de medicamentos no sangue (BDL) e overdoses. Use apenas conforme recomendado.\n\n--- EFFECT ---\nRevives an overdosed person (if not incapacitated), doubles decay rate of Blood Drug Level.
item_Desccrlf_consumable_oxygen_01=Fabricante: CureLife\n\nEste sistema descartável e fácil de usar foi projetado para reabastecer as reservas de oxigênio de roupas pressurizadas em situações de emergência. Compatível com a maioria dos trajes padrão, o Curelife OxyPen é a solução ideal para prevenir a hipóxia e fornecer acesso imediato ao oxigênio que salva vidas.\n\n--- EFFECT ---\nRecharges Oxygen reserves of a suit.
item_Desccrlf_consumable_painkiller_01=Fabricante: CureLife\nTipo de Item: Consumível Médico\n\nO CureLife OpioPen da empresa médica mais confiável do Império pode fornecer rapidamente uma dose do analgésico Roxaphen em situações de emergência para aliviar os sintomas associados à mobilidade reduzida e paralisia parcial. Use apenas conforme recomendado.\n\n--- EFFECT ---\nReduces pain symptoms, normalizes movement ability.
item_Desccrlf_consumable_radiation_01=Fabricante: CureLife\nTipo de item: Consumíveis médicos\n\nA DeconPen da CureLife fornece uma injeção rápida de Canoiodide, um composto medicinal patenteado que trata a exposição à radiação.\n\n--- EFFECT ---\nReduces injuries from radiation.
item_Desccrlf_consumable_steroids_01=Fabricante: CureLife\nTipo de Item: Consumível Médico\n\nA CorticoPen da CureLife, a empresa médica mais confiável do Império, pode fornecer rapidamente doses do esterógeno corticosteroide em situações de emergência para aliviar sintomas associados a fraqueza muscular e danos respiratórios. Use apenas conforme recomendado.\n\n--- EFFECT ---\nReduces vision and hearing symptoms, normalizes stamina.
