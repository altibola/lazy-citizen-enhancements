items_commodities_dolivine_desc=Une pierre précieuse vert terne utilisée à des fins décoratives mais qui peut également être utilisée à des fins industrielles grâce à sa résistance aux intempéries et à sa haute densité.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Arclight Pistol, Yubarev Pistol\n- Atzkav Sniper Rifle\n- Cannons (23 types)\n- Devastator Shotgun\n- Gallant Rifle\n- Thlilye Laser Gatling\n- Tractorbeam: 12 items
