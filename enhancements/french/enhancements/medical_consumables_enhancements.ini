item_Desccrlf_consumable_adrenaline_01=Fabricant : CureLife\nType d'Objet : Consommable Médical\n\nFabriqué par la société médicale la plus réputée de l'Empire, le CureLife AdrenaPen permet de délivrer rapidement des doses d'adrénaline synthétique, la Demexatrine, dans les situations d'urgence, afin de soulager la fatigue musculaire et les symptômes liés à une commotion cérébrale. A n'utiliser que selon les recommandations.\n\n--- EFFECT ---\nReduces concussion symptoms, normalizes weapon handling and movement speed.
item_Desccrlf_consumable_healing_01=Fabricant : CureLife\nType d'Objet : Consommable médical\n\nCurelife et son Medpen ont gagnés toute la confiance de l'Empire. Ce petit objet permet l'injection rapide de coagulant Hemozal et rétablit la pression sanguine et les constantes du patient dans les situation d'urgence. À n'utiliser qu'en cas de besoin.\n\n--- EFFECT ---\nRestores health and stops bleeding. When used on another person recovers from incapacitated state.
item_Desccrlf_consumable_overdoseRevival_01=Fabricant : CureLife\nType d'objet : Consommable médical\n\nPar la société médicale la plus fiable de l'Empire, ce petit objet permet l'injection rapide de détoxifiant Resurgera et rétablit la pression sanguine et les constantes du patient dans les situation d'urgence pour aider à soulager les symptômes associés à des niveaux élevés de Taux de Toxine Sanguin (TTS) et à des surdoses. À n'utiliser qu'en cas de besoin.\n\n--- EFFECT ---\nRevives an overdosed person (if not incapacitated), doubles decay rate of Blood Drug Level.
item_Desccrlf_consumable_oxygen_01=Fabricant : CureLife\n\nCe système de premier secours jetable, facile à transporter, est conçu pour remplir les réserves d'oxygène des combinaisons pressurisées dans les situations d'urgence. Compatible avec la plupart des combinaisons standard, l'OxyPen Curelife est une solution idéale pour prévenir l'hypoxie et fournir un accès immédiat à l'oxygène nécessaire à la survie.\n\n--- EFFECT ---\nRecharges Oxygen reserves of a suit.
item_Desccrlf_consumable_painkiller_01=Fabricant : CureLife\nType d'Objet : Consommable Médical\n\nPar la société médicale la plus fiable de l'Empire, Le CureLife OpioPen permet l'injection rapide de doses d'anti douleur Roxaphen et rétablit la pression sanguine et les constantes du patient dans les situation d'urgence pour aider à soulager les symptômes associés à la mobilité réduite et à la paralysie partielle. À n'utiliser qu'en cas de besoin.\n\n--- EFFECT ---\nReduces pain symptoms, normalizes movement ability.
item_Desccrlf_consumable_radiation_01=Fabricant : CureLife\nType d'Objet : Consommable Médical\n\nLe DeconPen de CureLife permet une injection rapide de Canoiodide, un composé médical breveté qui traite l'exposition aux radiations.\n\n--- EFFECT ---\nReduces injuries from radiation.
item_Desccrlf_consumable_steroids_01=Fabricant : CureLife\nType d'Objet : Consommable Médical\n\nFabriqué par la société médicale la plus réputée de l'Empire, le CureLife CorticoPen permet de délivrer rapidement des doses de corticostéroïde Sterogen dans les situations d'urgence pour aider à soulager les symptômes associés à la faiblesse musculaire et aux lésions respiratoires. A utiliser uniquement selon les recommandations.\n\n--- EFFECT ---\nReduces vision and hearing symptoms, normalizes stamina.
