items_commodities_feynmaline=FEYNMALINE <EM4>[CF|SHLD|Collection]</EM4>
items_commodities_feynmaline_desc=A estrutura cristalina paramórfica desse mineral é extremamente volátil. Quando uma energia extra é introduzida, como é típico na mineração moderna, o minério geralmente se degrada de forma explosiva na estrutura mais estável da janalita. Essa instabilidade torna a aquisição de Feynamline muito perigosa, mas também extremamente valiosa como precursor industrial de antimatéria, se puder ser coletada adequadamente.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Shields: 9 items
