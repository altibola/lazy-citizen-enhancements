items_commodities_carinite=CARINITA <EM4>[CF|FPSW|Collection]</EM4>
items_commodities_carinite_desc=Um mineral raro porque a pressão extrema necessária para a sua formação é muito incomum, ele é muito procurado graças ao seu uso em processadores de computador avançados e outros componentes eletrônicos de ponta.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Parallax Energy Assault Rifle\n- Quartz Energy SMG
items_commodities_carinite_pure=CARINITA (PURA) <EM4>[CF|FPSW|Collection]</EM4>
items_commodities_carinite_pure_desc=Fontes típicas de carinita apresentam várias impurezas. No entanto, sob certas condições extremamente raras, podem se formar veias de carinita com mais de 90% de pureza. Hardware de computação que exige precisão rigorosa geralmente busca carinita pura.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Parallax Energy Assault Rifle\n- Quartz Energy SMG
