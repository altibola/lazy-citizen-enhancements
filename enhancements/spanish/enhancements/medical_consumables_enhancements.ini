item_Desccrlf_consumable_adrenaline_01=Fabricante: CureLife\nTipo de artículo: Consumible medico\n\nDe la compañia médica mas fiable del Imperio, CureLife AdrenaPen puede dispensar rapidamente dosis de adrenalina sintetica Demexatrina durante situaciones de emergencia para ayudar a aliviar la fatiga muscular y los sintomas relacionados con una conmocion cerebral. uselo solo según lo recomendado.\n\n--- EFFECT ---\nReduces concussion symptoms, normalizes weapon handling and movement speed.
item_Desccrlf_consumable_healing_01=Fabricante: CureLife\nTipo de artículo: Consumible medico\n\nDe la compañia médica mas fiable del Imperio, CureLife MedPen puede dispensar rapidamente dosis del coagulante Hemozal durante situaciones de emergencia para ayudar a aliviar el sangrado y mejorar los signos vitales generales del paciente. uselo solo según lo recomendado.\n\n--- EFFECT ---\nRestores health and stops bleeding. When used on another person recovers from incapacitated state.
item_Desccrlf_consumable_overdoseRevival_01=Fabricante: CureLife\nTipo de artículo: Consumible medico\n\nDe la compañia médica mas fiable del Imperio, CureLife DetoxPen puede dispensar rapidamente dosis del detoxicante Resurgera durante situaciones de emergencia para ayudar a aliviar los sintomas asociados con niveles altos de medicamentos en sangre (BDL) y sobredosis. uselo solo según lo recomendado.\n\n--- EFFECT ---\nRevives an overdosed person (if not incapacitated), doubles decay rate of Blood Drug Level.
item_Desccrlf_consumable_oxygen_01=Fabricante: CureLife\n\nEste sistema de primeros auxilios desechable y facil de transportar esta diseñado para rellenar las reservas de oxigeno del traje presurizado en situaciones de emergencia. Compatible con la mayoria de los trajes estandar, Curelife OxyPen es una solucion ideal para prevenir la hipoxia y proporcionar acceso inmediato a oxigeno que salva vidas.\n\n--- EFFECT ---\nRecharges Oxygen reserves of a suit.
item_Desccrlf_consumable_painkiller_01=Fabricante: CureLife\nTipo de artículo: Consumible medico\n\nDe la compañia médica mas fiable del Imperio, CureLife OpioPen puede dispensar rapidamente dosis del analgesico Roxaphen durante situaciones de emergencia para ayudar a aliviar los sintomas asociados con la movilidad reducida y la paralisis parcial. uselo solo según lo recomendado.\n\n--- EFFECT ---\nReduces pain symptoms, normalizes movement ability.
item_Desccrlf_consumable_radiation_01=Fabricante: CureLife\nTipo de Artículo: Consumible Médico\n\nEl DeconPen de CureLife suministra una inyección rápida de Canoiodide, un compuesto medicinal patentado que reduce las lesiones causadas por la exposición a la radiación.\n\n--- EFFECT ---\nReduces injuries from radiation.
item_Desccrlf_consumable_steroids_01=Fabricante: CureLife\nTipo de artículo: Consumible medico\n\nDe la compañia médica mas fiable del Imperio, CureLife CorticoPen puede dispensar rapidamente dosis del corticosteroide Sterogen durante situaciones de emergencia para ayudar a aliviar los sintomas asociados con la debilidad muscular y el daño respiratorio. uselo solo según lo recomendado.\n\n--- EFFECT ---\nReduces vision and hearing symptoms, normalizes stamina.
