vehicle_DescMISC_Freelancer=Fabricante: MISC\nEnfoque: Medium Freight\n\n Las grandes corporaciones utilizan los freelancers como naves mercantes de largo recorrido, pero capitanes independientes que desean operar en los margenes de la galaxia los reutilizan con la misma frecuencia como naves de exploracion dedicados.\n\n--- STATS ---\nSCM: 197 m/s  |  Max: 1,050 m/s\nBoost: +400 m/s  /  -205 m/s\nCrew: 4  |  Length: 38.0m  |  Class: Transporte  |  Role: Carga ligera\nTurrets: 1  |  MRacks: 2× S3  2× S4\nShields: 3× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 10,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 41  |  E 43  |  D 0  |  T 0\nInsurance: 12.99 min base  |  4.33 min express
vehicle_DescMISC_Freelancer_DUR=Fabricante: MISC\nEnfoque: Expedicion \n\nLa variante Freelancer DUR se especializa en exploracion. Sacrificar el 25% de la capacidad de carga del Freelancer estandar por un motor de salto mejorado, un escaner mas avanzado y un tanque de combustible ampliado puede parecer una mala decision para algunos, pero aquellos que valoran el descubrimiento por encima de las ganancias encontraran que es su nave preferido. .\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +403 m/s  /  -205 m/s\nCrew: 4  |  Length: 38.0m  |  Class: Exploración  |  Role: Expedición\nTurrets: 1  |  MRacks: 2× S3  2× S4\nShields: 3× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 10,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 41  |  E 43  |  D 0  |  T 0\nInsurance: 12.99 min base  |  4.33 min express
vehicle_DescMISC_Freelancer_MAX=Fabricante: MISC\nEnfoque: Medium Freight\n\nVariante independiente con capacidad de carga adicional a expensas de las armas. La variante Freelancer MAX sacrifica armamento por una mayor capacidad de carga, lo que la hace ideal para el transporte de equipos o materias primas.\n\n--- STATS ---\nSCM: 195 m/s  |  Max: 1,025 m/s\nBoost: +395 m/s  /  -205 m/s\nCrew: 4  |  Length: 38.0m  |  Class: Transporte  |  Role: Carga Media\nTurrets: 1  |  MRacks: 2× S3  2× S4\nShields: 3× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 10,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 41  |  E 43  |  D 0  |  T 0\nInsurance: 16.46 min base  |  5.49 min express
vehicle_DescMISC_Freelancer_MIS=Fabricante: MISC\nEnfoque: Gunship\n\nEl Freelancer MIS es una variante militarizada de edicion limitada del clasico nave mercante desarrollado por la UEE. Estos se produjeron en cantidades muy pequeñas debido a algunos incidentes iniciales con la carga util. Esta version sacrifica la mayor parte de la capacidad de carga para dar paso a los misiles.\n\n--- STATS ---\nSCM: 204 m/s  |  Max: 1,000 m/s\nBoost: +410 m/s  /  -205 m/s\nCrew: 4  |  Length: 38.0m  |  Class: Combate  |  Role: Cañonera\nTurrets: 1  |  MRacks: 4× S4  S5\nShields: 3× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 15,840\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 41  |  E 43  |  D 0  |  T 0\nInsurance: 15.59 min base  |  5.20 min express
vehicle_DescMISC_Hull_A=Fabricante: MISC\nEnfoque: Carga Mediana\n\nEl casco mas pequeño y asequible. El Hull A es ideal para aquellos que simplemente se aventuran solos en la galaxia. El Hull A es mas similar al Aurora y al Mustang, pero carece de la naturaleza de "experto en todos los oficios". Mientras que los demas intercambian capacidad de carga por potencia de fuego o velocidad, el Casco A es 100% transporte en mision.\n\n--- STATS ---\nSCM: 185 m/s  |  Max: 1,050 m/s\nBoost: +385 m/s  /  -195 m/s\nCrew: 1  |  Length: 30.0m  |  Class: Transporte  |  Role: Carga ligera\nShields: S2  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 4,840\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 18  |  E 19  |  D 0  |  T 0\nInsurance: 5.95 min base  |  1.98 min express
vehicle_DescMISC_Hull_C=Fabricante: MISC\nEnfoque: Carga Pesada\n\nA menudo llamada la nave más común en la galaxia, la Hull C es la más producida de la gama y es considerada por muchos como la más versátil. Diseñada para alcanzar el 'punto ideal' entre los transportes más pequeños de una sola persona y los masivos supercargueros que conforman el resto de la gama, la Hull C ofrece la modularidad expansiva de las naves más grandes mientras aún conserva una mínima maniobrabilidad permitida en el extremo inferior de la gama.\n\n--- STATS ---\nSCM: 110 m/s  |  Max: 890 m/s\nBoost: +290 m/s  /  -100 m/s\nCrew: 4  |  Length: 91.2m  |  Class: Transporte  |  Role: Carga Pesada\nShields: 3× S3  |  Power: S3\nArmor HP: 12,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 360  |  D 0  |  T 0\nInsurance: 45.00 min base  |  15.00 min express
vehicle_DescMISC_Prospector=Fabricante: MISC\nEnfoque: Mineria\n\nDurante años, el Prospector ha sido la nave minero preferido del universo para operadores solitarios. Con la sensibilidad de diseño elegante de MISC y un conjunto de herramientas de minería de alta tecnologia mejoradas, el 2947 Prospector equilibra perfectamente forma y funcionalidad.\n\n--- STATS ---\nSCM: 156 m/s  |  Max: 994 m/s\nBoost: +371 m/s  /  -160 m/s\nCrew: 1  |  Length: 26.5m  |  Class: Industrial  |  Role: Mineria ligera\nShields: 3× S1  |  Coolers: S2  |  Power: S2  |  QD: S1\nArmor HP: 8,228\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 18  |  E 19  |  D 0  |  T 0\nInsurance: 9.00 min base  |  3.00 min express
