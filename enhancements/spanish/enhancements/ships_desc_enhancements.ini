vehicle_DescANVL_Valkyrie_CitizenCon=Fabricante: Anvil Aerospace \nEnfoque: Militar/Industrial\n\nDurante mas de un siglo, las naves Anvil se han distinguido en innumerables operaciones de combate civiles y militares. Honre esa orgullosa tradicion de seguridad con el Liberator Edition Valkyrie limitado, que presenta un paquete de equipamiento exclusivo que conmemora el debut de la nave en CitizenCon 2948.\n\n--- STATS ---\nCrew: 5  |  Length: 48.0m  |  Class: Combate  |  Role: Nave de descenso\nTurrets: 7\nShields: 2× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 23,760\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 139  |  E 88  |  D 0  |  T 0\nInsurance: 19.82 min base  |  4.98 min express
