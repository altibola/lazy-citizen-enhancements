vehicle_DescDRAK_Cutlass_Blue=Fabricante: Drake Interplanetary\nEnfoque: Interdiction\n\nElegante, mezquino y real. El Cutlass Blue agrega misiles, un motor mas agresivo y celdas de retencion Durasteel en el compartimento de carga al modelo estandar. El Cutlass Blue es la nave estandar de la milicia exterior elegido para las patrullas.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,165 m/s\nBoost: +467 m/s  /  -230 m/s\nCrew: 3  |  Length: 37.5m  |  Class: Combate  |  Role: Interdiccion\nInsurance: 9.99 min base  |  3.33 min express
vehicle_DescDRAK_Cutlass_Red=Fabricante: Drake Interplanetary\nEnfoque: Médico\n\nEl Cutlass Red convierte el compartimiento de carga estándar en una instalación médica bien equipada, que incluye un Autodoc. Esta ambulancia estelar cuenta con el transpondedor de eco Nav-E7, un escáner de largo alcance y un collar de acoplamiento seguro Plus, lo que la hace ideal para operaciones de búsqueda y rescate. Este modelo también cuenta con una apariencia única de calaveras rojas.\n\n--- STATS ---\nSCM: 212 m/s  |  Max: 1,125 m/s\nBoost: +460 m/s  /  -230 m/s\nCrew: 2  |  Length: 37.5m  |  Class: Apoyo  |  Role: Médica\nInsurance: 14.99 min base  |  5.00 min express
vehicle_DescDRAK_Cutlass_Steel=Fabricante: Drake Interplanetary\nEnfoque: Caza mediano/Transporte de tropas mediano\n\nCon Cutlass Steel, Drake Interplanetary ha reinventado una vez mas su diseño clasico para crear una nave de transporte de combate de proxima generacion mediante la adicion de asientos especiales y un arsenal ampliado. Hay un verso peligroso ahi fuera, y Cutlass Steel esta listo para abrirse camino a traves de cualquier obstaculo que se interponga en tu camino y el de tu dedicado equipo.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +420 m/s  /  -240 m/s\nCrew: 3  |  Length: 37.5m  |  Class: Combate  |  Role: Nave de descenso\nInsurance: 11.99 min base  |  4.00 min express
vehicle_DescDRAK_Cutter=Fabricante: Drake Interplanetary\nEnfoque: Light Freight\n\nDiseñado para personas trabajadoras de todo tipo, el Cutter incluye 4 SCU de espacio de carga y un monton de golpes en un marco compacto y resistente. Es una nave que verdaderamente encarna el espiritu de Drake: que no importa quien seas o que hagas, puedes alcanzar las estrellas.\n\n--- STATS ---\nSCM: 180 m/s  |  Max: 1,010 m/s\nBoost: +380 m/s  /  -160 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Exploración  |  Role: Inicial / Exploración\nShields: S1  |  Coolers: S1  |  Power: S1  |  QD: S1\nArmor HP: 1,980\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 3.37 min base  |  1.12 min express
vehicle_DescDRAK_Cutter_Rambler=Fabricante: Drake Interplanetary\nEnfoque: Expedición\n\nLos directivos de Drake escucharon lo que tenías que decir, y su respuesta fue el Cutter Rambler. Basándose en el original, el Rambler conserva una capacidad completa de 2 SCU para carga mientras agrega comodidades solicitadas y suficiente espacio de almacenamiento personal para que incluso el viaje más largo pase volando.\n\n--- STATS ---\nCrew: 1  |  Length: 20.0m  |  Class: Exploración  |  Role: Expedición\nCoolers: S1  |  Power: S1  |  QD: S1\nArmor HP: 1,980\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 1.25 min base  |  0.00 min express
vehicle_DescDRAK_Cutter_Scout=Fabricante: Drake Interplanetary\nEnfoque: Reconocimiento\n\nReduciendo el robusto y compacto diseño del Cutter a lo esencial, Drake tomó una nave ya impresionante y la transformó en la nave de exploración ideal. Con capacidades mejoradas de radar y escaneo, junto con una mayor potencia y enfriamiento, el Cutter Scout está listo para volar por delante del grupo.\n\n--- STATS ---\nSCM: 180 m/s  |  Max: 1,010 m/s\nBoost: +380 m/s  /  -160 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Exploración  |  Role: Exploración\nCoolers: S2  |  Power: S2\nArmor HP: 1,980\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 3.87 min base  |  1.28 min express
vehicle_DescDRAK_Dragonfly=Fabricante: Drake Interplanetary\nEnfoque: Carreras\n\nEl Drake Dragonfly es la nave de corto alcance perfecta para cualquiera que busque vivir al límite. Sin nada que separe al piloto de los peligros del espacio, ¡el Dragonfly es tanto una aventura como una nave! La conversión de doble modo permite que el Dragonfly opere en tierra o en el espacio, ¡y un asiento trasero orientado hacia atrás significa que incluso puedes llevar a un pasajero!\n\n--- STATS ---\nSCM: 190 m/s  |  Max: 523 m/s\nBoost: +270 m/s  /  -120 m/s\nCrew: 1  |  Length: 7.0m  |  Class: Competición  |  Role: Carreras\nGuns: 2\nCoolers: S0  |  Power: S0\nArmor HP: 1,170\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.10 min base  |  0.00 min express
