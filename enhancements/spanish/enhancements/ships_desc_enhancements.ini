vehicle_DescANVL_Hurricane=Fabricante: Anvil Aerospace\nEnfoque: Heavy Fighter\n\nLas cosas grandes vienen en paquetes pequeños: el Hurricane es una nave espacial de combate que da un golpe mortal en un fuselaje ligero. La nave espacial compensa su falta de comodidades con su poderoso armamento: seis cañones capaces de atravesar casi cualquier cosa. Los pilotos de huracanes aun tienen que encontrar un escudo enemigo que no puedan derribar.\n\n--- STATS ---\nSCM: 214 m/s  |  Max: 1,125 m/s\nBoost: +480 m/s  /  -225 m/s\nCrew: 2  |  Length: 24.0m  |  Class: Combate  |  Role: Caza pesado\nShields: S2  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 54  |  E 29  |  D 0  |  T 0\nInsurance: 8.55 min base  |  2.85 min express
