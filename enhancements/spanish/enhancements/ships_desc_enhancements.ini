vehicle_DescKRIG_P52_Merlin=Fabricante: Kruger Intergalactic\nEnfoque: Caza de corto alcance\n\nDiseñado en conjunto con RSI, este elegante caza de corto alcance representa el primer nave producido bajo la marca Kruger Intergalactic. Utilizando siglos de experiencia en fabricacion, la precision compacta del casco Kruger se combina perfectamente con los fiables propulsores RSI para otorgar al Merlin un manejo y maniobrabilidad excepcionales, al tiempo que garantiza que sea capaz de cumplir una variedad de funciones, desde combate hasta exploracion y escaneo.\n\n--- STATS ---\nSCM: 275 m/s  |  Max: 1,450 m/s\nBoost: +605 m/s  /  -290 m/s\nCrew: 1  |  Length: 12.0m  |  Class: Combate  |  Role: Caza de corto alcance\nGuns: 1\nShields: S1  |  Coolers: 2× S1  |  Power: S1\nArmor HP: 360\nDmg Mult: P 0.85x  |  E 0.70x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 2.65 min base  |  0.88 min express
