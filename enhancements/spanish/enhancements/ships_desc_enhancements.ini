vehicle_DescARGO_MPUV_Transport=Fabricante: Argo Astronautics\nEnfoque: Transporte\n\nEl Argo Astronautics MPUV-1P (comunmente 'Personal Argo'). Esta version del Argo esta orientada a una responsabilidad simple pero increiblemente importante: trasladar terrenos de personas de un lugar a otro. La Armada de la UEE utiliza ampliamente los MPUV-1P, y cualquier nuevo recluta probablemente pueda recordar esos momentos aterradores en los que una nave asi los llevo a su primera mision espacial. En manos civiles, las naves Argo Personnel están adaptadas para todo, desde servicios de taxi estandar hasta su uso como naves de combate improvisadas. El Argo MPUV-1P es capaz de transportar hasta ocho personas y su equipo.\n\n--- STATS ---\nSCM: 170 m/s  |  Max: 890 m/s\nBoost: +360 m/s  /  -140 m/s\nCrew: 1  |  Length: 10.5m  |  Class: Transporte  |  Role: Pasajero\nShields: S1  |  Coolers: 2× S0  |  Power: S0\nArmor HP: 1,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.68 min base  |  0.23 min express
vehicle_DescARGO_Mole=Fabricante: Argo Astronautics\nEnfoque: Mineria\n\nEl iconico extractor laser multioperador de Argo, mas comunmente conocido como MOLE, le permite trabajar mas rápido y mas eficazmente que nunca, gracias a su sistema de minería trilateral patentado. Tres estaciónes de extraccion articuladas controladas independientemente permiten la maxima potencia y una versatilidad casi ilimitada. El MOLE se rige por el dicho "muchas manos hacen el trabajo mas ligero".\n\n--- STATS ---\nSCM: 140 m/s  |  Max: 960 m/s\nBoost: +340 m/s  /  -150 m/s\nCrew: 4  |  Length: 45.0m  |  Class: Industrial  |  Role: Mineria Media\nShields: S3  |  Coolers: S3  |  Power: S3  |  QD: S2\nArmor HP: 11,220\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 45  |  E 40  |  D 0  |  T 0\nInsurance: 13.50 min base  |  4.50 min express
