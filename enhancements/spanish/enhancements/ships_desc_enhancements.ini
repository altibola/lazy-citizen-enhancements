vehicle_DescRSI_Perseus=Fabricante: RSI\nEnfoque: Gunship\n\nCuando RSI se propuso hacer la declaracion moderna definitiva en prevencion persuasiva, miraron hacia su propio pasado, a las historicas cañoneras designadas Perseus. Capaz de destruir goliats de clase subcapital, la mera presencia de una cañonera Perseus en un escuadron de bloqueo o patrulla es suficiente para hacer que tus enemigos mas agresivos lo piensen dos veces antes de atacar, al igual que su homonimo clasico.\n\n--- STATS ---\nSCM: 150 m/s  |  Max: 1,050 m/s\nBoost: +350 m/s  /  -160 m/s\nCrew: 6  |  Length: 100.0m  |  Class: Combate\nInsurance: 38.00 min base  |  9.50 min express
