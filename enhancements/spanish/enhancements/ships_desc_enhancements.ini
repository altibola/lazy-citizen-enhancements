vehicle_DescANVL_Terrapin=Fabricante: Anvil Aerospace\nEnfoque: Pathfinder\n\nPresentacion de la nave de exploracion/exploracion clase Terrapin U4A-3 de Anvil Aerospace. El Terrapin se desarrollo a finales del siglo 28 para servir como el primer nave en la reestructuracion defensiva de la Armada del Imperio. La consigna del Terrapin es proteccion, con amplios sistemas de escudos y capas de armadura diseñadas para proporcionar la maxima defensa posible para el piloto y la tripulacion. Si bien carece de la maniobrabilidad de un caza dedicado, mantiene un conjunto avanzado y contundente de armas destinadas a mantener a raya al asaltante vanduul mas temible.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,150 m/s\nBoost: +320 m/s  /  -240 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Apoyo  |  Role: Exploración\nInsurance: 7.88 min base  |  2.62 min express
