vehicle_DescDRAK_Herald=Fabricante: Drake Interplanetary\nEnfoque: Medium Data\n\nEl Drake Herald es una pequeña nave blindada diseñada para llevar información de forma segura del punto A al punto B. Con un potente motor central (para transito a alta velocidad y generacion de la energía necesaria para un cifrado/contencion de datos eficaz), Con un software de encriptacion avanzado y un núcleo de computadora blindado, el Herald es único entre las naves espaciales personales porque esta diseñado para ser "limpiado" facilmente cuando esta en peligro de ser capturado.\n\n--- STATS ---\nSCM: 245 m/s  |  Max: 1,450 m/s\nBoost: +670 m/s  /  -260 m/s\nCrew: 1  |  Length: 24.8m  |  Class: Transporte  |  Role: Hackeo\nInsurance: 2.02 min base  |  0.68 min express
