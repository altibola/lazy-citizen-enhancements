vehicle_DescESPR_Talon=Fabricante: Esperia\nEnfoque: Light Fighter\n\nEl Talon representa el esfuerzo continuo de Esperia por preservar diseños de naves Tevarin de importancia historica. Una nave de combate maniobrable de un solo asiento con armadura ligera pero poderosos escudos direccionales "Phalanx", el Talon esta hecho para atacar primero y golpear con fuerza antes de usar los escudos para cubrir su escape.\n\n--- STATS ---\nSCM: 225 m/s  |  Max: 1,190 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 24.0m  |  Class: Combate  |  Role: Caza ligero\nCoolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 8  |  E 10  |  D 0  |  T 0\nInsurance: 11.34 min base  |  3.78 min express
