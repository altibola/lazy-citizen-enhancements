vehicle_DescMISC_Razor=Fabricante: Mirai \nEnfoque: Racing\n\nEste corredor avanzado cuenta con una estructura espacial compuesta avanzada que antepone la velocidad pura a todo lo demas... es la nave para pilotos que quieren dejar la competencia en el polvo.\n\n--- STATS ---\nSCM: 265 m/s  |  Max: 1,450 m/s\nBoost: +595 m/s  /  -290 m/s\nCrew: 1  |  Length: 12.5m  |  Class: Competición  |  Role: Carreras\nInsurance: 6.08 min base  |  2.02 min express
vehicle_DescMISC_Razor_EX=Fabricante: Mirai\nEnfoque: Stealth\n\nEquipado con materiales reductores de firmas, el Razor EX fue una construccion especial para la Fiscalia de la UEE para su uso en operaciones de vigilancia y extraccion. Aunque finalmente se rechazo el uso generalizado del EX, se lanzo una variacion del modelo para el público que buscaba mantener un perfil mas bajo.\n\n--- STATS ---\nSCM: 265 m/s  |  Max: 1,450 m/s\nBoost: +595 m/s  /  -290 m/s\nCrew: 1  |  Length: 12.5m  |  Class: Combate  |  Role: Caza sigilo\nShields: S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 5.91 min base  |  1.97 min express
vehicle_DescMISC_Razor_LX=Fabricante: Mirai\nEnfoque: Lujo\n\nLa Razor se sobrealimenta. El LX cuenta con un motor overclockeado para alcanzar velocidades maximas increibles. Esta potencia tiene un coste de maniobrabilidad y armamento reducidos, lo que la hace ideal para carreras directas. Pero, ¿quien necesita armas cuando estas dejando a tu competencia en el polvo?\n\n--- STATS ---\nSCM: 275 m/s  |  Max: 1,525 m/s\nBoost: +490 m/s  /  -290 m/s\nCrew: 1  |  Length: 12.5m  |  Class: Competición  |  Role: Carreras\nInsurance: 6.08 min base  |  2.02 min express
vehicle_DescMISC_Reliant=Fabricante: MISC\nEnfoque: Light Freight\n\nCon el Reliant Kore, MISC agrega a su ya impresionante linea de naves, una nave espacial mas pequeña de clase introductoria. Utilizando diseños Xi'An avanzados, el Reliant presenta alas amplias y elegantes, propulsores omnidireccionales y una cabina de dos asientos totalmente articulada que admite modos de vuelo horizontal y vertical. Todo esto se combina con una mayor capacidad de carga que muchos naves de su clase para hacer del Kore una opción natural para transporte de corto alcance, o con la simple adicion de algunos componentes opcionales, este nave capaz de hacer cualquier cosa que sueñes. .\n\n--- STATS ---\nCrew: 2  |  Length: 14.8m  |  Class: Transporte  |  Role: Inicial / ligero\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,200\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 0.68 min base  |  0.00 min express
vehicle_DescMISC_Reliant_Mako=Fabricante: MISC\nEnfoque: Reporting\n\nEl Imperio depende de información actualizada, razon por la cual los reporteros deben poder ir donde suceden las noticias: donde sea y cuando sea. Ingrese el Mako, toda la flexibilidad y confiabilidad de un MISC Reliant combinadas con un paquete de camara Cernan de última generacion para capturar cada momento tal como sucede con la claridad y precision que aparecen en los titulares.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 2  |  Length: 14.8m  |  Class: Apoyo  |  Role: Informes\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,200\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 5.36 min base  |  1.79 min express
vehicle_DescMISC_Reliant_Sen=Fabricante: MISC\nEnfoque: Light Science\n\nMagellan, Pierce, Croshaw, nombres que resuenan en la historia gracias a su espiritu aventurero, una naturaleza curiosa y una nave fiable. El Reliant Sen es una plataforma cientifica movil versatil; equipado con capacidades de largo alcance para llevarlo mas lejos, por mas tiempo y el avanzado conjunto de sensores Samos. Perfecto para el aspirante a explorador que quiere susurrar su nombre en los pasillos de la historia.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 2  |  Length: 14.8m  |  Class: Industrial  |  Role: Ciencia ligera\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,200\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 4.82 min base  |  1.61 min express
vehicle_DescMISC_Reliant_Tana=Fabricante: MISC\nEnfoque: Light Fighter\n\nCon la humanidad en constante  expansión por el universo, la necesidad de un caza ligero y versatil se ha ampliado con ella. Facil de mantener y con una construccion robusta, el Reliant Tana es una opción ideal para la defensa de fronteras y puestos avanzados gracias a su planta de energía personalizada de alto rendimiento, escudos mas fuertes y soportes de armas adicionales.\n\n--- STATS ---\nSCM: 222 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 2  |  Length: 14.8m  |  Class: Combate  |  Role: Caza ligero\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 4.82 min base  |  1.61 min express
vehicle_DescMISC_Starfarer=Fabricante: MISC\nEnfoque: Reabastecimiento de combustible pesado\n\nEl Starfarer se diferencia de los cargueros a granel tradicionales en una forma clave: es una plataforma de combustible dedicada. El Starfarer esta diseñado no solo para cargar, almacenar y proteger unidades de estasis de combustible, sino que tambien esta diseñado para absorber gases espaciales y refinarlos para su uso sin aterrizar. Y si bien destaca en esto, el Starfarer tambien se puede utilizar para transportar capsulas de carga a granel tradicionales.\n\n--- STATS ---\nSCM: 106 m/s  |  Max: 845 m/s\nBoost: +295 m/s  /  -106 m/s\nCrew: 8  |  Length: 102.0m  |  Class: Apoyo  |  Role: Reabastecimiento pesado\nTurrets: 1\nShields: 3× S3  |  Coolers: 2× S3  |  Power: S3  |  QD: S3\nArmor HP: 12,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 360  |  D 0  |  T 0\nInsurance: 18.00 min base  |  6.00 min express
vehicle_DescMISC_Starfarer_Gemini=Fabricante: MISC\nEnfoque: Reabastecimiento pesado\n\nEl ejercito del Imperio Unido de la Tierra utiliza una variante adaptada del Starfarer para sus operaciones de primera linea. El G2M Gemini, mas comunmente el Starfarer Gemini o 'Star G', intercambia cierta capacidad de carga y maniobrabilidad a cambio de un blindaje reforzado, mayor blindaje, motores mas potentes y versiones mas potentes de las tres torretas tripuladas.\n\n--- STATS ---\nSCM: 106 m/s  |  Max: 845 m/s\nBoost: +295 m/s  /  -106 m/s\nCrew: 2  |  Length: 102.0m  |  Class: Apoyo  |  Role: Reabastecimiento pesado\nTurrets: 1\nShields: 3× S3  |  Coolers: 2× S3  |  Power: S3  |  QD: S3\nArmor HP: 18,150\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 331  |  E 378  |  D 0  |  T 0\nInsurance: 35.34 min base  |  11.78 min express
