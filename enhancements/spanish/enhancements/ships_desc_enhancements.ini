vehicle_DescVNCL_Scythe=Fabricante: Esperia\nEnfoque: Caza Mediano\n\nRápidamente convirtiéndose en el símbolo de la raza Vanduul, el Scythe es el soldado de a pie en cada incursión y el objetivo de cada piloto de caza humano. Con una carga de armas robusta, el verdadero activo del Scythe es su maniobrabilidad, presente en los dos propulsores principales y los doce propulsores de maniobra. Este Scythe hecho por los Vanduul y capturado ha sido modificado por Esperia para ser pilotado por pilotos humanos.\n\n--- STATS ---\nSCM: 222 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -230 m/s\nCrew: 1  |  Length: 33.0m  |  Class: Combate  |  Role: Datos medio\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 6,600\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 22  |  E 14  |  D 0  |  T 0\nInsurance: 5.91 min base  |  1.97 min express
