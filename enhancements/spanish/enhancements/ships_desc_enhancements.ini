vehicle_DescRSI_Zeus_CL=Fabricante: Roberts Space Industries\nEnfoque: Carga Mediana\n\nListo para transportar a toda una nueva generación de viajeros a través del universo, Roberts Space Industries se enorgullece en presentar una nave estelar ocho siglos en desarrollo: la completamente nueva nave espacial Zeus Mk II. Rindiendo homenaje al diseño clásico que lanzó a la humanidad a las estrellas en 2140, el Zeus Mk II ha sido actualizado para superar los estándares modernos mientras conserva el corazón de este amado ícono espacial. Con un enfoque en el comercio, la edición Zeus Mk II CL cuenta con espacio de carga adicional y un rayo tractor ideal para manejar grandes volúmenes de carga.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,000 m/s\nBoost: +400 m/s  /  -210 m/s\nCrew: 3  |  Length: 46.0m  |  Class: Transporte  |  Role: Carga Media\nShields: 3× S2\nInsurance: 10.67 min base  |  2.67 min express
