vehicle_DescDRAK_Buccaneer=Fabricante: Drake Interplanetary\nEnfoque: Interdiction\n\nEl Buccaneer ha sido diseñado desde cero para volar y luchar como tu vives. aquí no hay interiores de cuero ni hiperalmohadas: el Bucc es un chatarra diseñado para maniobrar y luchar por encima de su categoria de peso. Este turbulento caza fronterizo se puede mantener en las peores condiciones para mantener con vida a tripulaciones espaciales reales y en funcionamiento.\n\n--- STATS ---\nSCM: 240 m/s  |  Max: 1,400 m/s\nBoost: +600 m/s  /  -260 m/s\nCrew: 1  |  Length: 15.2m  |  Class: Combate  |  Role: Caza ligero\nShields: S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,160\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 5.40 min base  |  1.80 min express
