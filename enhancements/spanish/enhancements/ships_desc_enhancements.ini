vehicle_DescCRUS_Starlifter_A2=Fabricante: Crusader Industries\nEnfoque: Transporte mediano / Cañonera\n\nLa cañonera A2 se ha utilizado con efectos devastadores en asaltos aereos, operaciones de busqueda y rescate e iniciativas de aterrizaje. Con mas del doble de potencia de fuego que el M2 y un compartimiento de bombas personalizado capaz de entregar una carga util asombrosa, el A2 esta dirigido a cualquiera que transporte cantidades masivas de carga a traves de cielos potencialmente hostiles.\n\n--- STATS ---\nSCM: 160 m/s  |  Max: 950 m/s\nBoost: +320 m/s  /  -170 m/s\nCrew: 8  |  Length: 70.0m  |  Class: Combate  |  Role: Bombardero pesado\nTurrets: 12\nInsurance: 39.24 min base  |  13.08 min express
