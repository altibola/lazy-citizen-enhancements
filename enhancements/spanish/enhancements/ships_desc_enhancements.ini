vehicle_DescCNOU_Mustang_Delta=Fabricante: Consolidated Outland \nEnfoque: Light Fighter\n\nSi bien es posible que no pueda competir cara a cara con algunos de las naves militares especificos, al reforzar la ya solida construccion del casco del Mustang con la propia linea de armadura de reduccion masiva de clase de caballeria de Consolidated Outland, el Delta tiene un firma transversal reducida que iguala el campo de juego.\n\n--- STATS ---\nSCM: 226 m/s  |  Max: 1,195 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Combate  |  Role: Caza ligero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 4.01 min base  |  1.34 min express
vehicle_DescCNOU_Mustang_Gamma=Fabricante: Consolidated Outland \nEnfoque: Racing\n\nLos equipos de diseño e ingenieria de Consolidated Outland han logrado modificar y perfeccionar el Mustang para convertirlo en un corredor admirable. El resultado final, el Mustang Gamma, tiene una aceleracion suave y potencia según demanda gracias a un paquete innovador que incluye tres potentes motores Magma Jet para un maximo empuje.\n\n--- STATS ---\nSCM: 244 m/s  |  Max: 1,230 m/s\nBoost: +533 m/s  /  -273 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Competición  |  Role: Carreras\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 7.28 min base  |  2.43 min express
vehicle_DescCNOU_Mustang_Omega=Fabricante: Consolidated Outland \nEnfoque: Racing\n\nConsolidated Outland se asocio con la empresa de tuning personalizado Accelerated Mass Design para crear un corredor de edicion limitada que presenta un consumo de combustible aumentado para un reciclaje mas rápido del ya impresionante sistema de propulsión de la nave. Para culminar la colaboracion, AMD recluto al artista underground residente Sektor8 para diseñar el trabajo de pintura dinamico.\n\n--- STATS ---\nSCM: 244 m/s  |  Max: 1,230 m/s\nBoost: +533 m/s  /  -273 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Competición  |  Role: Carreras\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 7.28 min base  |  2.43 min express
