vehicle_DescAEGS_Vanguard=Fabricante: Aegis Dynamics\nEnfoque: Heavy Fighter\n\nUn caza bulldog de carga dura que cuenta con un amplio armamento montado en la parte delantera diseñado para atravesar los escudos y armaduras de otras naves espaciales. Llamados asi porque su rango de saltos multiples les permite formar la vanguardia de cualquier expedicion militar, los Vanguards han prestado un amplio servicio contra los vanduul.\n\n--- STATS ---\nSCM: 210 m/s  |  Max: 1,075 m/s\nBoost: +458 m/s  /  -220 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combate  |  Role: Caza pesado\nGuns: 5  |  Turrets: 1  |  MRacks: 4× S4\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 18.22 min base  |  6.07 min express
vehicle_DescAEGS_Vanguard_Harbinger=Fabricante: Aegis Dynamics\nEnfoque: Bombardero\n\nEl Vanguard Harbinger es el caza/bombardero estandar de la Tierra, que convierte la capsula de escape estandar del Warden en una potente bahia de bombas. El alcance extendido del Vanguard y el perfil relativamente pequeño significan que puede ir donde las naves con base en portaaviones o los bombarderos estrategicos mas grandes no llegan, atacar con fuerza y luego regresar a la base.\n\n--- STATS ---\nSCM: 212 m/s  |  Max: 1,085 m/s\nBoost: +462 m/s  /  -224 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combate\nGuns: 5  |  Turrets: 1  |  MRacks: 4× S4  S5\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 16.39 min base  |  5.46 min express
vehicle_DescAEGS_Vanguard_Hoplite=Fabricante: Aegis Dynamics\nEnfoque: Dropship \n\nEl Vanguard Hoplite es un cruce entre el caza espacial Vanguard ganador y una nave de abordaje dedicada. Adaptado de diseños probados de naves de asalto, el Hoplite es la herramienta perfecta para insertar un equipo de ataque blindado con suficiente potencia de fuego para sacarlos de nuevo.\n\n--- STATS ---\nSCM: 209 m/s  |  Max: 1,115 m/s\nBoost: +435 m/s  /  -246 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combate  |  Role: Nave de descenso\nGuns: 5  |  Turrets: 1  |  MRacks: 2× S4\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 14,850\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 13.25 min base  |  4.42 min express
vehicle_DescAEGS_Vanguard_Sentinel=Fabricante: Aegis Dynamics\nEnfoque: Interdiction \n\nEl Vanguard Sentinel es una nave diseñado para luchar de forma inteligente en lugar de enfrentarse a los enemigos. La conversion cuenta con una cabina AR, una capsula e-War externa, misiles señuelo y un conjunto de cargas EMP. Los Vanguard Sentinels a menudo brindan el apoyo de combate necesario para operaciones combinadas. Un Sentinel solitario suele ser emparejado con bombarderos Harbinger y escoltas Warden para grandes misiones de ataque.\n\n--- STATS ---\nSCM: 217 m/s  |  Max: 1,075 m/s\nBoost: +462 m/s  /  -224 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combate\nGuns: 5  |  Turrets: 1  |  MRacks: 4× S4\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 18.22 min base  |  6.07 min express
