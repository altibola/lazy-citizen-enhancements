vehicle_DescAEGS_Avenger_Stalker=Fabricante: Aegis Dynamics\nEnfoque: Interdiction\n\nInicialmente diseñado como la nave de transporte de primera linea de Aegis para el ejercito, el Avenger Stalker tomo un camino diferente y finalmente tuvo una larga e historica carrera como patrullero estandar de la Fiscalia de la UEE. Utilizando su bodega de carga para el transporte de prisioneros, el Avenger presenta un casco robusto y fiable y capacidad para soportes de motor mas grandes de lo esperado.\n\n--- STATS ---\nSCM: 262 m/s  |  Max: 1,425 m/s\nBoost: +610 m/s  /  -280 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Combate  |  Role: Interceptor\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,232\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.86 min base  |  1.62 min express
vehicle_DescAEGS_Avenger_Titan=Fabricante: Aegis Dynamics\nEnfoque: Light Freight \n\n Al carecer de las celdas de prisioneros del Stalker o del generador EMP del Warlock, la bodega del Titan es libre para transportar carga. Combine ese espacio disponible con las probadas y verdaderas habilidades de combate del Avenger y obtendra un transporte de carga liviano que es mas que capaz de manejarse solo en una pelea.\n\n--- STATS ---\nSCM: 262 m/s  |  Max: 1,425 m/s\nBoost: +610 m/s  /  -280 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Transporte  |  Role: Carga ligera\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,640\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.05 min base  |  1.35 min express
vehicle_DescAEGS_Avenger_Titan_Renegade=Fabricante: Aegis Dynamics\nEnfoque: Carga Ligera\n\nCreado como parte de la serie 'Masters of Flight' en conjunto con el simulador de vuelo Arena Commander, el Renegade rinde homenaje al famoso piloto Danny Solomon por su destacado trabajo con la Advocacy para llevar justicia a Bremen. Este Avenger Titan viene equipado con una carga de combate enfocada en combates aéreos y una pintura de edición especial personalizada que honra a esta icónica nave.\n\n--- STATS ---\nCrew: 1  |  Length: 20.0m  |  Class: Transporte  |  Role: Carga ligera\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,640\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.05 min base  |  1.35 min express
vehicle_DescAEGS_Avenger_Warlock=Fabricante: Aegis Dynamics\nEnfoque: Interdiction\n\nEl Avenger Warlock se construyo con una unica filosofia de diseño: detener las naves, no destruirlos. Probablemente el mas cercano a un caza no letal, el Warlock esta equipado con un generador EMP Behring REP-8, capaz de emitir una poderosa onda electromagnetica para desactivar cualquier dispositivo electronico que tenga la mala suerte de estar dentro del radio de explosion.\n\n--- STATS ---\nSCM: 262 m/s  |  Max: 1,425 m/s\nBoost: +610 m/s  /  -280 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Combate  |  Role: Interdiccion\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,640\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.86 min base  |  1.62 min express
