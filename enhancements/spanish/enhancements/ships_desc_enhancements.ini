vehicle_DescORIG_100i=Fabricante: Origin Jumpworks\nEnfoque: Starter / Touring\n\nRecorre el universo con la combinación perfecta de lujo y rendimiento. El 100i cuenta con el sistema de combustible AIR patentado de Origin Jumpworks, lo que lo convierte en la nave mas eficiente y ecologico del mercado. Capaz de realizar vuelos de larga distancia para los que la mayoria de las naves de su tamaño no están equipados, el 100i es perfecto para pilotos solitarios que buscan llamar la atencion sin sacrificar la funcionalidad o la confiabilidad.\n\n--- STATS ---\nSCM: 223 m/s  |  Max: 1,230 m/s\nBoost: +610 m/s  /  -290 m/s\nCrew: 1  |  Length: 19.0m  |  Class: Exploración  |  Role: Inicial / Exploración\nGuns: 2\nShields: S1  |  Coolers: 2× ?  2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 3.36 min base  |  1.12 min express
vehicle_DescORIG_125a=Fabricante: Origin Jumpworks\nEnfoque: Starter / Light Fighter\n\nLos riesgos estaban destinados a tomarse, pero ¿por que arriesgarse a quedarse sin combustible en el fragor de la batalla? Con el sistema de combustible AIR, un paquete de armas mejorado y todo el lujo y refinamiento que esperas de Origin Jumpworks, el 125a ha sido diseñado para el inconformista exigente.\n\n--- STATS ---\nSCM: 230 m/s  |  Max: 1,260 m/s\nBoost: +610 m/s  /  -300 m/s\nCrew: 1  |  Length: 19.0m  |  Class: Combate  |  Role: Caza ligero\nGuns: 2\nShields: S1  |  Coolers: 2× ?  2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 4.54 min base  |  1.51 min express
vehicle_DescORIG_135c=Fabricante: Origin Jumpworks\nEnfoque: Motor de arranque/Carguero ligero\n\nCon una cantidad engañosa de espacio de almacenamiento en su marco elegante y con estilo, y el sistema de combustible AIR patentado de Origin, el modelo 135c es la opción obvia para musicos, mensajeros y cualquiera que intente comenzar la fiesta. Llevalo allí rápido y luce bien mientras lo haces.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,250 m/s\nBoost: +610 m/s  /  -290 m/s\nCrew: 1  |  Length: 19.0m  |  Class: Transporte  |  Role: Carga ligera\nGuns: 2\nShields: S1  |  Coolers: 2× ?  2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 3.78 min base  |  1.26 min express
vehicle_DescORIG_300i=Fabricante: Origin Jumpworks\nEnfoque: Turismo\n\nSi vas a viajar por las estrellas... ¿por que no hacerlo con estilo? El 300i es la principal nave espacial de lujo de Origin Jumpworks. Es un asesino plateado y elegante que envia tanto mensaje con su silueta como con sus cañones de particulas.\n\n--- STATS ---\nSCM: 258 m/s  |  Max: 1,440 m/s\nBoost: +550 m/s  /  -270 m/s\nCrew: 1  |  Length: 27.0m  |  Class: Exploración  |  Role: Turismo de lujo\nMRacks: 2× S2\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 7.76 min base  |  2.59 min express
vehicle_DescORIG_315p=Fabricante: Origin Jumpworks\nEnfoque: Pathfinder\n\nLa exploracion es la vocacion mas importante del hombre. Preparese para trazar horizontes lejanos con la tecnologia mas sofisticada del hombre, el Origin 315p. Con una planta de energía mas robusta y un paquete de escaneo personalizado, diseñado exclusivamente por Chimera Communications.\n\n--- STATS ---\nSCM: 258 m/s  |  Max: 1,460 m/s\nBoost: +550 m/s  /  -270 m/s\nCrew: 1  |  Length: 27.0m  |  Class: Exploración  |  Role: Exploración\nMRacks: 2× S2\nShields: 2× S1  |  Coolers: 2× S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 5.18 min base  |  1.73 min express
vehicle_DescORIG_325a=Fabricante: Origin Jumpworks\nEnfoque: Interdiction\n\nEl hecho de que sea una galaxia accidentada no significa que debas sacrificar tu comodidad: el 325a puede salir victorioso en cualquier pelea de perros. El 325a presenta una carga util de arma avanzada, asi como un sistema de orientacion personalizado diseñado especialmente para el 325a por WillsOp.\n\n--- STATS ---\nSCM: 260 m/s  |  Max: 1,430 m/s\nBoost: +600 m/s  /  -270 m/s\nCrew: 1  |  Length: 27.5m  |  Class: Combate  |  Role: Interceptor\nMRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 6.21 min base  |  2.07 min express
