vehicle_DescXIAN_Railen=Fabricante: Gatac Manufacture\nEnfoque: Cargo\n\n La primera incursion de Gatac en el mercado humano, el Railen es una elegante embarcacion interespecies perfecta para cualquier piloto humano o Xi'an que busque una solucion segura y fiable para el transporte de carga mediana de nivel comercial, y es un excelente ejemplo de por que el Imperio Xi'an ha confiado a la Casa Gatac la produccion de sus embarcaciones industriales durante siglos.\n\n--- STATS ---\nSCM: 170 m/s  |  Max: 1,000 m/s\nBoost: +340 m/s  /  -190 m/s\nCrew: 4  |  Length: 52.0m  |  Class: Transporte  |  Role: Carga Media\nInsurance: 17.00 min base  |  5.00 min express
vehicle_DescXIAN_Scout=Fabricante: Aopoa\nEnfoque: Light Fighter\n\nLa corporacion Xi'an Aopoa fabrica un modelo de exportacion del Qhire Khartu, el Khartu-al, para venderlo a civiles humanos como un explorador/explorador dedicado. El modelo de exportacion presenta el mismo equipo de maniobra Xi'an, pero superficies de control modificadas para uso humano y un armamento mas limitado.\n\n--- STATS ---\nSCM: 224 m/s  |  Max: 1,183 m/s\nBoost: +504 m/s  /  -254 m/s\nCrew: 1  |  Length: 32.0m  |  Class: Combate  |  Role: Caza ligero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,400\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 5.06 min base  |  1.69 min express
vehicle_DescXNAA_SantokYai=Fabricante: Aopoa\nEnfoque: Caza Mediano\n\nAprovechando el poder de los sistemas de vuelo Xi'an de próxima generación, propulsores de doble vector mejorados y un impresionante arsenal de armas, Aopoa ha creado un caza que conserva la destreza ágil y la maniobrabilidad precisa por la que la marca es conocida.\n\n--- STATS ---\nSCM: 227 m/s  |  Max: 1,161 m/s\nBoost: +493 m/s  /  -225 m/s\nCrew: 1  |  Length: 24.0m  |  Class: Combate  |  Role: Datos medio\nInsurance: 7.50 min base  |  2.50 min express
vehicle_Descprobe_comms_1_a=Fabricante: Chimera Communications \nEnfoque: Recon\n\nEl Auris, del fabricante Chimera Communications, le permite recopilar y almacenar transmisiones facilmente, lo que lo hace ideal para el monitoreo de actividad de corto alcance. Diseñado para ser practicamente invisible mientras esta en funcionamiento, este monitor de recopilacion pasiva de datos (PDC) de baja potencia es perfecto para brindar seguridad adicional a cualquier estación o instalacion con un registro detallado de las transmisiones de datos y los registros de trafico de naves locales. Ademas, el transmisor de rafaga de respaldo incluido permite transferir los almacenes de datos en caso de una emergencia, lo que brinda mayor tranquilidad.\n\n--- STATS ---\nCrew: 1  |  Length: 18.0m  |  Class: Transporte  |  Role: Carga ligera\nShields: S1  |  Coolers: S1  |  Power: S3\nInsurance: 33.33 min base  |  3.33 min express
