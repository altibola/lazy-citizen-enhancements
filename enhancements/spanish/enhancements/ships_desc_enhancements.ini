vehicle_DescARGO_MPUV=Fabricante: Argo Astronautics\nEnfoque: Light Freight\n\nEl Argo Astronautics MPUV Cargo es una nave mercante dedicado a la transferencia. Un omnipresente estibador intergalactico, un gran numero de MPUV Cargos son responsables de cargar y descargar mercancias en naves que de otro modo no podrian aterrizar en planetas o diques secos, como el Hull D y el Orion. Algunos capitanes de transportistas optan por poseer y operar su propio Argo, mientras que otros prefieren contratar a los propietarios locales de Argo que se encuentran en muchos de los puertos mas concurridos.\n\n--- STATS ---\nSCM: 170 m/s  |  Max: 890 m/s\nBoost: +360 m/s  /  -140 m/s\nCrew: 1  |  Length: 10.5m  |  Class: Transporte  |  Role: Carga ligera\nShields: S1  |  Coolers: 2× S0  |  Power: S0\nArmor HP: 1,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.17 min base  |  0.00 min express
