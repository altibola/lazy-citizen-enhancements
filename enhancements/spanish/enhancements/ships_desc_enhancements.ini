vehicel_DescANVL_Valkyrie=Fabricante: Anvil Aerospace \nEnfoque: Militar / Industrial\n\nLa Valkyrie sube la apuesta en el transporte de tropas. Diseñada para transportar hasta veinte soldados, asi como vehículos, a los lugares mas hostiles, esta nave militar lista para el conflicto es una fuerza formidable, tanto ofensiva como defensiva. Construido pensando en contratistas de defensa militares y privados, el Valkyrie es uno de los transportes de personal mas eficientes y efectivos de su clase.\n\n--- STATS ---\nSCM: 207 m/s  |  Max: 1,110 m/s\nBoost: +431 m/s  /  -245 m/s\nCrew: 5  |  Length: 48.0m  |  Class: Combate  |  Role: Nave de descenso\nTurrets: 6\nShields: 2× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 23,760\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 139  |  E 88  |  D 0  |  T 0\nInsurance: 19.82 min base  |  4.98 min express
