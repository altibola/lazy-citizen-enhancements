vehicle_DescARGO_SRV=Fabricante: Argo Astronautics\nEnfoque: Industrial, Civil\n\nCuando se trata de hacer el trabajo, Argo no pierde el tiempo. Desde simples remolques de carga y carga hasta desgarradoras operaciones de busqueda y rescate, el SRV se encarga de todo lo que le puedas arrojar. El sistema de tractor hecho a medida utiliza una innovadora combinación de placa y brazo, lo que permite un uso individual sin esfuerzo, asi como un remolque de equipo de precision para trabajos mas grandes. Su tripulacion y pasajeros tambien están seguros gracias a escudos duraderos y armaduras resistentes que mantienen la cabina y los componentes seguros cuando la situacion se pone complicada.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +460 m/s  /  -235 m/s\nCrew: 1  |  Length: 31.5m  |  Class: Apoyo\nShields: S2  |  Coolers: S2  |  Power: S2  |  QD: S2\nArmor HP: 3,740\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 13.22 min base  |  4.75 min express
vehicle_DescBanu_Defender=Fabricante: Banu \nEnfoque: Light Fighter\n\nConoce al Banu Defender, un caza con tripulacion multiple cuyo diseño de mosaico destaca la tecnologia de una variedad de especies. Con alojamiento modesto para su tripulacion y facil acceso a los componentes, el Defender recibe su nombre de la funcion que cumple: la primera linea de defensa contra ataques enemigos. Es por eso que el Defender es el compañero ideal del Merchantman: uno para realizar el transporte pesado y el otro para realizar las mortales peleas de perros.\n\n--- STATS ---\nSCM: 222 m/s  |  Max: 1,175 m/s\nBoost: +480 m/s  /  -255 m/s\nCrew: 2  |  Length: 24.5m  |  Class: Combate  |  Role: Caza ligero\nMRacks: 2× S3\nShields: S2  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 5,400\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 20  |  E 16  |  D 0  |  T 0\nInsurance: 13.61 min base  |  4.54 min express
vehicle_DescCNOU_HoverQuad=Fabricante: Consolidated Outland\nEnfoque: Transporte\n\nDiseñado como vehículo terrestre compañero del Nomad, el elegante marco angular del HoverQuad utiliza cuatro plataformas Gravlev para una maxima maniobrabilidad, lo que lo convierte en el transporte perfecto en todo tipo de superficies.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 550 m/s\nBoost: +280 m/s  /  -120 m/s\nCrew: 1  |  Length: 1.4m  |  Class: Exploración  |  Role: Pasajero\nCoolers: S0  |  Power: S0\nArmor HP: 1,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.15 min base  |  0.05 min express
vehicle_DescCNOU_Mustang_Alpha=Fabricante: Consolidated Outland\nEnfoque: Carga Ligera\n\nInspirado por la vanguardista visión del CEO de Consolidated Outland, Silas Koerner, el Mustang Alpha es una nave espacial elegante y con estilo que utiliza aleaciones ultraligeras para llevar las proporciones de potencia al límite, aunque a veces de manera no segura. Y ahora, con el Transportador de Carga opcional, puedes disfrutar de las ventajas del Alpha sin sacrificar la capacidad de carga.\n\n--- STATS ---\nSCM: 228 m/s  |  Max: 1,218 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Multifunción  |  Role: Inicial / ligero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 0.68 min base  |  0.00 min express
vehicle_DescCNOU_Mustang_Alpha_CitizenCon18=Fabricante: Consolidated Outland\nEnfoque: Carga Ligera\n\nDiseñado para conmemorar la CitizenCon 2948, este modelo personalizado del recién revisado Mustang Alpha presenta una exclusiva nueva apariencia diseñada por el propio Silas Koerner.vehicle_DescCNOU_Mustang_Beta=Fabricante: Consolidated Outland \nEnfoque: Pathfinder\n\nEl Mustang Beta, con su alcance sin precedentes, esta diseñado para vuelos de larga duración. El Tarsus Leaper Jump Engine estandar de fabrica permite a la Beta viajar a los sistemas mas lejanos de la galaxia con facilidad, mientras que las exclusivas habitaciones Com4T de la nave harán que el viaje se sienta como si nunca hubiera salido de casa.\n\n--- STATS ---\nCrew: 1  |  Length: 21.5m  |  Class: Multifunción  |  Role: Inicial / ligero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 0.68 min base  |  0.00 min express
