vehicle_DescANVL_C8R_Pisces_Rescue=Fabricante: Anvil Aerospace\nEnfoque: Médico\n\nCon la inclusión de una cama médica de Nivel 3 a bordo, el C8R Pisces puede tratar lesiones leves y mantener estable a un paciente mientras lo transporta a la seguridad de una nave más grande, estación o instalación médica cercana, convirtiéndolo en un recurso invaluable para operaciones de búsqueda y rescate a corta distancia.\n\n--- STATS ---\nCrew: 1  |  Length: 16.0m  |  Class: Apoyo  |  Role: Médica\nGuns: 2\nShields: S1  |  Coolers: S1  |  Power: S1\nInsurance: 4.59 min base  |  1.53 min express
vehicle_DescANVL_C8X_Pisces_Expedition=Fabricante: Anvil Aerospace\nEnfoque: Exploración / Ruta\n\nCon más armas y una pintura de edición limitada, el C8X Pisces Expedition lo convierte en un robusto vehículo de exploración perfectamente viable por sí misma. Con su estructura compacta, maniobrabilidad hábil y asientos para tres personas, el Pisces Expedition está listo para emprender sus propias aventuras.\n\n--- STATS ---\nCrew: 1  |  Length: 16.0m  |  Class: Exploración  |  Role: Exploración\nGuns: 4\nShields: S1  |  Coolers: S1  |  Power: S1  |  QD: S1\nInsurance: 3.36 min base  |  1.12 min express
vehicle_DescANVL_C8_Pisces=Fabricante: Anvil Aerospace\nEnfoque: Exploración / Ruta\n\nCon su estructura compacta, maniobrabilidad hábil y asientos para tres personas, la nave de corto alcance C8 Pisces, incluida con cada Carrack, está construida por Anvil Aerospace para explorar y avanzar o para explorar entornos inaccesibles para su nave nodriza más grande.\n\n--- STATS ---\nCrew: 1  |  Length: 16.0m  |  Class: Exploración  |  Role: Exploración\nGuns: 2\nShields: S1  |  Coolers: S1  |  Power: S1  |  QD: S1\nInsurance: 3.36 min base  |  1.12 min express
vehicle_DescANVL_Carrack=Fabricante: Anvil Aerospace\nEnfoque: Expedition / Pathfinder\n\nLlamadas de aventura y Anvil Aerospace responde con la Carrack. Construido para soportar condiciones extremas tanto en el espacio como en la atmosfera, este explorador autosostenible se ha ganado con creces su estatus de pionero tanto para el servicio militar como para el civil.\n\n--- STATS ---\nSCM: 140 m/s  |  Max: 1,050 m/s\nBoost: +315 m/s  /  -160 m/s\nCrew: 6  |  Length: 126.0m  |  Class: Exploración  |  Role: Expedición\nInsurance: 48.30 min base  |  16.10 min express
