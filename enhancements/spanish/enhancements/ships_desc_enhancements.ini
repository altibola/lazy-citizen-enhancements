vehicle_DescESPR_Prowler=Fabricante: Esperia\nEnfoque: Dropship\n\nEl Prowler, que lleva el nombre de la designacion militar de la UPE, es una version modernizada de la infame nave de abordaje Tevarin de la Primera Guerra Tevarin. La eficacia del Prowler como vehículo de despliegue rápido de personal se debio principalmente a su silencio. Con el Prowler, encontraras la fusion perfecta de dos culturas: la elegancia y efectividad de la maquína de guerra Tevarin combinada con la confiabilidad de la moderna tecnologia UEE.\n\n--- STATS ---\nSCM: 212 m/s  |  Max: 1,200 m/s\nBoost: +450 m/s  /  -240 m/s\nCrew: 2  |  Length: 34.0m  |  Class: Combate  |  Role: Nave de descenso\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 12,150\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 32  |  E 39  |  D 0  |  T 0\nInsurance: 23.22 min base  |  7.74 min express
