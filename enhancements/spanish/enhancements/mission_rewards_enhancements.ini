hurston_UGF_destroy_E_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Eliminación de Contrabando\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: R. Russel\nEVALUACIÓN DE RIESGOS: Medio\nCONTRATO URGENTE: No\n\nUn grupo de matones locales ha estado utilizando ~mission(Location|Address) para fabricar grandes cantidades de contrabando. Hurston Security necesita un contratista para ir a la instalación y destruir todo el contrabando almacenado allí.\n\nEl pago se realizará una vez que se haya eliminado todo el contrabando.\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Queda prohibida cualquier revisión, retransmisión, divulgación u otro uso o acción basados en esta información por parte de personas o entidades que no sean el destinatario previsto.**\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x8\n<EM4>Friendlies:</EM4> Civilians x4
hurston_UGF_destroy_E_title_001=Eliminar el alijo de contrabando <EM4>[500 Rep]</EM4>
hurston_UGF_destroy_H_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Eliminacion de contrabando\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: R. Russel\n EVALUACIÓN DE RIESGOS: Muy alto\nCONTRATO URGENTE: No\n\nUn pequeño sindicato ha estado utilizando ~mission(Location|Address) para fabricar grandes cantidades de narcóticos altamente peligrosos. Hurston Security esta buscando un contratista para ir a las instalaciones y eliminar todo el contrabando que se almacena allí. \n\n El pago se enviara una vez que se haya eliminado todo el contrabando. \n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Esta prohibida cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
hurston_UGF_destroy_H_title_001=Eliminar el alijo de narcóticos <EM4>[500 Rep]</EM4>
hurston_UGF_destroy_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Eliminacion de contrabando\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: R. Russel\n EVALUACIÓN DE RIESGOS: Alto\nCONTRATO URGENTE: No\n\nSe han identificado delincuentes locales utilizando ~mission(Location|Address) para fabricar grandes cantidades de productos ilegales. Hurston Security requiere que un contratista vaya a las instalaciones y elimine todo el contrabando que se almacena allí. \n\n El pago se enviara una vez que se haya eliminado todo el contrabando. \n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Esta prohibida cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Friendlies:</EM4> Civilians x4
hurston_UGF_destroy_title_001=Eliminar el alijo de drogas <EM4>[500 Rep]</EM4>
hurston_UGF_eliminateall_allies_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Proteccion de instalaciones\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: T. Spooner\n EVALUACIÓN DE RIESGOS: Alto\nCONTRATO URGENTE: No\n\nEl personal de seguridad en ~mission(Location|Address) esta siendo amenazado por un elemento criminal local y Hurston Security esta buscando contratistas para reforzar sus defensas y eliminar cualquier hostil que intente violar el sitio. \n\n Tenga en cuenta que solo esta autorizado a interactuar con hostiles confirmados. Agredir a cualquier personal de seguridad en el sitio resultara en un incumplimiento de contrato. \n\n El pago se enviara una vez que se confirme que las instalaciones son seguras. \n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Esta prohibida cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
hurston_UGF_eliminateall_allies_desc_intro=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Proteccion de instalaciones\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: T. Spooner\n EVALUACIÓN DE RIESGOS: Alto\nCONTRATO URGENTE: No\n\nUn grupo criminal local ha estado amenazando ~mission(Location|Address) y Hurston Security esta buscando contratistas para reforzar sus defensas y eliminar cualquier hostil que intente violar el sitio. \n\n Tenga en cuenta que solo esta autorizado a interactuar con hostiles confirmados. Agredir a cualquier personal de seguridad en el sitio resultara en un incumplimiento de contrato. \n\n El pago se enviara una vez que se confirme que las instalaciones son seguras. La finalizacion exitosa de esta evaluación le permitira ser considerado para trabajos futuros como contratista de seguridad.\n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Esta prohibida cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
hurston_UGF_eliminateall_allies_desc_rehire=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Proteccion de instalaciones\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: T. Spooner\n EVALUACIÓN DE RIESGOS: Alto\nCONTRATO DE PRISA: No\n\nNuestro departamento realiza reevaluaciónes periodicas de contratistas de seguridad anteriores y ha determinado que usted puede ser un candidato adecuado para posibles restablecimiento.\n\nPara reclamar su estado, Hurston Security esta buscando contratistas para ayudar a eliminar un elemento criminal local que amenaza ~mission(Location|Address).\n\nTenga en cuenta que solo esta autorizado a interactuar con hostiles confirmados. Agredir a cualquier personal de seguridad en el sitio resultara en un incumplimiento de contrato. \n\n El pago se enviara una vez que se confirme que las instalaciones son seguras. La finalizacion exitosa de esta reevaluación le permitira ser considerado para trabajos futuros como contratista de seguridad.\n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Esta prohibida cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
