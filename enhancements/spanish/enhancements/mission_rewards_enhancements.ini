Jumptown2_Criminal_MBroker_desc=Tengo buenas noticias para ti. En este momento, hay una instalación automatizada que está produciendo paquete tras paquete de producto de primera calidad, prácticamente listo para ser tomado.\n\nTodo lo que tienes que hacer es acercarte allí, lidiar con uno o dos matones, agarrar lo que puedas y venderlo por una gran ganancia. No debería ser un problema en absoluto. Y hay mucha gente dispuesta a pagar buenos créditos por obtener productos como ese.\n\nHablando de créditos, no voy a dar las coordenadas de esta instalación por pura amabilidad. Creo que es justo pedir una tarifa de buscador por información tan valiosa.\n\nNo esperaría mucho. No estoy seguro de cuánto tiempo dejarán la instalación en funcionamiento.\n\n-Ruto\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Jumptown2_Lawful_MBroker_desc_BlacJac=ATENCIÓN: Operadores Mercenarios Verificados\n\nHemos logrado rastrear un aumento reciente de contrabando hasta una instalación de producción automatizada en ~mission(Location|Address). No podemos estar seguros de cuánto tiempo estará en funcionamiento el sitio, por lo que BlacJac necesita a alguien en el lugar para barrer, asegurar el contrabando y transportarlo hasta nosotros en ~mission(Destination|Address). Una vez allí, puedes utilizar la terminal administrativa de productos para transferirnos el contrabando y recoger tu recompensa.\n\nNo hemos podido determinar qué tipo de fuerza hostil estará presente, pero sea cual sea el encuentro, estás autorizado a usar la fuerza letal según sea necesario. \n\nCuanto más contrabando logres traernos, más créditos ganarás.\n\nGracias,\nTeniente Aaron Riegert\n\nSupervisor de Contratos Privados\nBlacJac Security, "Protección Proporcionada"\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Jumptown2_Lawful_MBroker_desc_CruSec=Crusader Security ha descubierto que una instalación de producción ilegal en ~mission(Location|Address) se está utilizando actualmente para fabricar contrabando. \n\nEstamos buscando a un contratista para asegurar el sitio, confiscar cualquier contrabando y entregárnoslo en ~mission(Destination|Address). La terminal administrativa de productos permitirá que envíes el contrabando a nuestra área de evidencia y recojas tu pago.\n\nAhora bien, esta es una instalación automatizada, así que no está claro cuánto tiempo seguirán fabricando, o incluso cuántas personas pueden estar en el lugar. Para estar seguro, te sugeriría que vayas esperando encontrar una fuerte resistencia.\n\nTu compensación total se basará en cómo se entregan de manera segura los paquetes en evidencia.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Vanzant\nID# 712L921P\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Jumptown2_Lawful_MBroker_desc_Hurston=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Confiscar Contrabando\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: T. Odington\nEVALUACIÓN DE RIESGOS: Alto\nCONTRATO URGENTE: No\n\nLa seguridad de Hurston ha descubierto una instalación de producción automatizada ilegal activa en ~mission(Location|Address) y está buscando un contratista para asegurar el sitio y confiscar tantos paquetes de contrabando como sea posible para su entrega a una instalación de seguridad de Hurston en ~mission(Destination|Address) para su disposición inmediata. La transferencia del contrabando y la atribución de tu pago de recompensa deben realizarse a través de la terminal administrativa de productos allí.\n\nEstás autorizado a utilizar cualquier fuerza necesaria para completar tu objetivo. El pago se basará en la cantidad de contrabando asegurado. \n\n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o acción basada en esta información por parte de personas o entidades que no sean el destinatario previsto está prohibido. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Jumptown2_Lawful_MBroker_desc_MicroTech=SOBRE EL TRABAJO\nmicroTech Protection Services está buscando un profesional de seguridad meticuloso que pueda ayudarnos a asegurar contrabando de un sitio de producción automatizado ilegal en ~mission(Location|Address). Los paquetes luego deberán ser llevados a ~mission(Destination|Address) y transferidos a nuestra posesión para su destrucción a través de la terminal administrativa de productos.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Address).\n• Controlar cualquier hostil que se encuentren en el lugar; utilizando la fuerza según sea necesario.\n• Asegurar el contrabando y entregarlo en las terminales de productos en ~mission(Destination|Address)\n\nCALIFICACIONES MÍNIMAS\n• 2 años de experiencia combinada entre mercenarios y/o seguridad.\n• Acceso a equipo de combate y medio de transporte.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERENTES\n• Experiencia con técnicas de reducción rápida de hostilidades.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
