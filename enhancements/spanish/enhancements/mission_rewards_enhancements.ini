cfp_searchbody_danger_cave_desc_001=Hola,\n\nHemos estado tratando de ponernos en contacto con un local conocido como ~mission(TargetName), pero no hemos tenido noticias de ellos en unos días. Según lo que he podido averiguar, estaban explorando cerca de ~mission(location|address), que es un lugar conocido de forajidos.\n\nEspero que puedas ir allí por nosotros y ver si puedes localizarlos, o en el peor de los casos, sus restos. ~mission(Location|CaveSize)\n\nSi puedes encontrarlos, hay una recompensa disponible.\n\nGracias,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_searchbody_danger_cave_title_001=Desaparecido: ~mission(TargetName) <EM4>[50 Rep]</EM4>
cfp_searchbody_danger_outpost_desc_001=Hola,\n\nLamentablemente, uno de nuestros colaboradores de la comunidad, ~mission(TargetName), lleva desaparecido varios días. Su familia se puso en contacto con Citizens for Pyro en busca de ayuda y les dije que haríamos lo que pudiéramos. Dicho esto, con tanto tiempo transcurrido, no tengo muchas esperanzas.\n\nSea cual sea su estado actual, esperaba que pudieras ser nuestros ojos en el terreno para este caso. Hay una fuerte posibilidad de que se dirigieran a ~mission(Location|Address), un área conocida por ser muy peligrosa.\n\nSi puedes localizarlos y confirmar su estado, de una manera u otra, me aseguraré de que seas compensado adecuadamente.\n\nGracias,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_searchbody_danger_outpost_title_001=Desaparecido: ~mission(TargetName) <EM4>[50 Rep]</EM4>
cfp_searchbody_danger_station_desc_001=Hola,\n\nEstoy bastante preocupado por uno de nuestros contratistas locales, ~mission(TargetName). Terminaron un intercambio en ~mission(Location|Address) y no se les ha visto desde entonces. Estamos escuchando informes de que los forajidos se han estado colando allí, y si eso es cierto, sospecho que lo peor podría haber sucedido.\n\nDe todos modos, ~mission(TargetName|First) ha hecho un buen trabajo para nosotros en el pasado y no me gustaría que terminaran como otro desaparecido en Pyro. Si estás dispuesto a encontrarlos por mí, me aseguraré de que recibas una recompensa.\n\nSolo ten cuidado. No me gustaría que tú también desaparecieras.\n\nGracias,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
cfp_searchbody_nodanger_cave_desc_001=Hola,\n\n~mission(TargetName) es un local que solo ha hecho algunos trabajos para Citizens for Pyro, pero tenía promesa. Eso fue hasta que desapareció mientras exploraba ~mission(Location|Address) la semana pasada. Desafortunadamente, no me enteré hasta hoy. Las posibilidades de supervivencia en este momento son bastante escasas, pero aún creo que vale la pena confirmar lo que les sucedió.\n \nPodrías ayudarme en esto si estás interesado. Y además de ser una buena acción, el pago debería hacer que valga la pena el esfuerzo. ~mission(Location|CaveSize)\n\nGracias,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_searchbody_nodanger_cave_title_001=Desaparecido, Presumiblemente Muerto: ~mission(TargetName) <EM4>[50 Rep]</EM4>
cfp_searchbody_nodanger_outpost_desc_001=Hola,\n\nUno de nuestros colaboradores, ~mission(TargetName), debería haber estado haciendo algunos trabajos de exploración preliminares en ~mission(location|address), pero nunca informaron. Espero que solo hayan tenido mala suerte, pero con demasiada frecuencia, incluso el más pequeño paso en falso puede resultar fatal por aquí.\n\nAgradecería que te dirigieras allí y vieras si puedes localizarlos. Sería genial si los encuentras con vida, pero si no, creo que al menos podemos proporcionar algo de consuelo a su familia.\n\nGracias,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_searchbody_nodanger_outpost_title_001=Desaparecido, Presumiblemente Muerto: ~mission(TargetName) <EM4>[50 Rep]</EM4>
cfp_searchbody_nodanger_station_desc_001=Hola,\n\nDos locales con los que trabajamos estaban chatarreando en ~mission(location|address) cuando tuvieron algunos problemas con equipos defectuosos. Uno logró escapar, pero su compañero, ~mission(TargetName), lamentablemente quedó atrás.\n\nCon el estado en el que fueron reportados por última vez, supongo que no lo lograron, pero me gustaría saberlo con certeza. Si estás dispuesto, podrías ayudarme para encontrar sus restos.\n\nSi puedes localizarlos, me aseguraré de que seas compensado adecuadamente por el esfuerzo.\n\nGracias,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
