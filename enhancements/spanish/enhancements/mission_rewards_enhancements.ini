TarPits_ShipStrip_desc_001=Tenemos un trabajo de chatarrería en particular en el que podrías echar una mano.\n\nNecesitamos que encuentres una ~mission(ship) que ha sido derribada alrededor de ~mission(location). La seguridad ya la está buscando y si la encuentran, la identificarán con seguridad y estaremos en graves problemas.\n\nAsí que queremos que te asegures de que eso no pueda suceder. Ya sea remolcando la nave fuera del área de búsqueda o arrancando todo el casco para que nadie pueda decir a quién pertenecía. Sea cual sea tu decisión, mantén la boca cerrada al respecto.\n\nTe pagaremos en créditos y cualquier cosa que desguaces será tuya para quedártela. Pero si la seguridad encuentra la nave antes de que termines, estaremos todos arruinados y no te pagarán, así que no decepciones.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Friendlies:</EM4> Salvageable Ships x1
Tarpits_assassinate_dc_desc_001=No tengo tiempo que perder, así que iré directo al grano: ~mission(TargetName) tiene que morir y quiero que tú lo hagas. Puedes encontrarlos cerca de la ~mission(Location) en ~mission(Location|address). No estarán solos, pero no te distraigas con esos otros montones de inútiles. Sólo se te pagará por eliminar a ~mission(TargetName|Last).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Tarpits_destroyitem_dc_desc_001=Quiero enviar un mensaje contundente a la tripulación de ~mission(Location|Address) y conozco la forma perfecta de hacerlo: daños a la propiedad. Todo lo que tienes que hacer es dirigirte allí, destruir algunas cosas aquí y allá, y transmitir una importante lección sobre el respeto a tus superiores. \Haz eso por mí y me sentiré muy feliz. Y generoso. ¿Interesado?\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Tarpits_eliminateboss_dc_desc_001=Hace tiempo que queremos acabar con ~mission(TargetName), pero nunca hemos encontrado el momento adecuado. Basta de esperar. Tú vas a crear el momento adecuado para nosotros.\nVe a ~mission(Location|Address) y elimina a un montón de malvivientes que andan por ~mission(Location). Mata a suficientes perdedores y la misión no tendrá más remedio que enfrentarse a ti. Es entonces cuando te los cargas y te ganas un buen sueldo. \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> CQC x20, Juggernauts x1, Snipers x2, Soldiers x7
Tarpits_theft_mines_dc_desc_001=Esperaba que estuvieras interesado en hacer un trabajito para nosotros. Tengo algunos bienes en ~mission(Location|Address) que son perfectos para tomar. El único problema es - y es uno grande - los bastardos que dirigen el lugar tienen toda la zona con minas de proximidad. \Tendrás que encontrar la forma de atravesarlas o, si no te importa, de activarlas. De cualquier manera, sólo trata de no volarte a ti mismo. Entonces sólo tienes que coger el material y llevarlo a ~mission(Destination|Address).\nNo será fácil de llevar a cabo, pero si lo haces, te prometo que haré que valga la pena.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
