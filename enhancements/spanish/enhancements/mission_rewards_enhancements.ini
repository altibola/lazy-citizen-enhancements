Eckhart_Assassin_Sync_E_Desc_001=Se ha puesto precio a las cabezas de ~mission(TargetName) y ~mission(TargetName2). \n\nAunque no es raro tener que acabar con dos objetivos, el cliente quiere enviar un mensaje muy específico, así que ambos objetivos deben ser eliminados al mismo tiempo. Los créditos adicionales deberían compensar las molestias.\n\nY desafortunadamente, dado que la pareja no viaja junta, es obvio que para lograrlo necesitarás ayuda. Asegúrate de llevar personas en las que confíes y que puedan desenvolverse contra más de una nave, ya que se sabe que los objetivos viajan con refuerzos.\n\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x2
Eckhart_Assassin_Sync_E_Title_001=Doble estocada <EM4>[500 Rep]</EM4>
Eckhart_Assassin_Sync_H_Desc_001=Contrato para dos objetivos que deben ser eliminados al mismo tiempo. \n\nSupongo que al cliente le preocupa que si no se eliminan juntos, uno de ellos desaparecerá y tratará de vengarse.\n\nSe hacen llamar ~mission(TargetName) y ~mission(TargetName2).\n\nEncuentra un equipo, divide y vencerás.\n\nY asegúrate de que quien sea que elijas tenga habilidades, porque estos dos tienen fama de defenderse en una pelea y seguramente no estarán solos. Prepárate para que te causen problemas.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x2
Eckhart_Assassin_Sync_H_Title_001=Dos a la cabeza <EM4>[500 Rep]</EM4>
Eckhart_Assassin_Sync_Intro_Desc_001=Me llegó una misión interesante. Necesito que se eliminen dos objetivos diferentes: ~mission(TargetName) y ~mission(TargetName2).\n\nEl problema es que si alguno se entera de que están atacando al otro, se esconderá. No podemos arriesgarnos a perder a ninguno de ellos.\n\nSe requerirá una coordinación considerable, pero quiero que los elimines a ambos exactamente al mismo tiempo.\n\nY como no puedes estar en dos lugares a la vez, necesitarás encontrar a alguien en quien confíes para que te ayude en esto.\n\nAfortunadamente, mi inteligencia indica que ambos objetivos deberían estar viajando solos. Eso debería hacer las cosas un poco más fáciles para ti.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x1, Targets x2
Eckhart_Assassin_Sync_Intro_Title_001=Eliminación coordinada <EM4>[500 Rep]</EM4>
Eckhart_Assassin_Sync_M_Desc_001=Recibí un contrato para eliminar a dos promesas que han estado causando problemas. Tiene que ser limpio, ambos al mismo tiempo, o podrían causar aún más problemas. En resumen, necesitarás ayuda en este caso.\n\nTanto ~mission(TargetName) como ~mission(TargetName2) saben defenderse, y la gente con la que vuelan tampoco es broma. Puedes esperar que cada uno de ellos esté protegido por varias naves.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x2
Eckhart_Assassin_Sync_M_Title_001=Doble eliminación <EM4>[500 Rep]</EM4>
Eckhart_Assassin_Sync_S_Desc_001=Normalmente, el dúo de ~mission(TargetName) y ~mission(TargetName2) sería demasiado para enfrentarlos juntos. Ambos son de lo mejor en combates aéreos y la tripulación con la que vuelan también es casi igual de buena.\n\nPero recientemente se separaron, no estoy seguro de por qué, y están volando por separado por el momento. Alguien piensa que esta puede ser la mejor oportunidad para eliminarlos.\n\nReúne a personal en el que puedas confiar y planea un asalto simultáneo contra ambos objetivos. Es demasiado peligroso arriesgarse a que uno de ellos sobreviva después de un movimiento tan directo en su contra.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x2
Eckhart_Assassin_Sync_S_Title_001=Dividir y conquistar <EM4>[500 Rep]</EM4>
Eckhart_Assassin_Sync_VE_Desc_001=Tengo otro par que debe ser eliminado: ~mission(TargetName) y ~mission(TargetName2)\n\nHan estado desaparecidos durante unos días, pero acaban de aparecer. Si no los atrapamos ahora, no estoy seguro de si tendremos otra oportunidad. Necesitarás reclutar a un compañero para asegurarte de que ambos objetivos sean eliminados al mismo tiempo.\n\nEn cuanto a la resistencia, ~mission(TargetName) suele llevar a un amigo para cubrir su espalda, y sospecho que ~mission(TargetName2) hará lo mismo.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x2, Targets x2
Eckhart_Assassin_Sync_VE_Title_001=Combo uno-dos <EM4>[500 Rep]</EM4>
Eckhart_Assassin_Sync_VH_Desc_001=~mission(TargetName) y ~mission(TargetName2).\n\nDos operadores serios que recientemente decidieron actuar contra su jefe. Cada uno de ellos viaja con una pequeña y altamente entrenada armada, penetrando profundamente en territorio que no les pertenece.\n\nTú, y quienquiera que reclutes para ayudarte, los eliminareis y tiene que ser al mismo tiempo para que no puedan reagruparse.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x2
Eckhart_Assassin_Sync_VH_Title_001=Combo mortal <EM4>[500 Rep]</EM4>
