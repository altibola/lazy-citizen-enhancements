headhunters_eliminateall_XT_derelicts_desc_01=Uno de nuestros jueces se enteró de que XenoThreat está tratando de avanzar en nuestro territorio. Parece que están intentando apoderarse de ~mission(location|address). No queremos permitir que esos psicópatas ganen más terreno en el sistema del que ya tienen, así que estamos poniendo algunos créditos sobre la mesa para que retrocedan.\n\nQueremos que te enfrentes a ellos con fuerza. No te detengas hasta que todo el lugar sea un cementerio. Enviaremos tu pago una vez que los cuerpos estén listos para enterrar.\n\n- Fin de la transmisión out.\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 6/7 | Complexity 6/7 | Risk 5/7 | Knowledge 5/7\n<EM4>Hostiles:</EM4> CQC x3, Juggernauts x2, Snipers x2, Soldiers x4, Technicians x3\n<EM4>Contractor:</EM4> +200 Rep\n<EM4>Blueprint Reward:</EM4> Guaranteed
