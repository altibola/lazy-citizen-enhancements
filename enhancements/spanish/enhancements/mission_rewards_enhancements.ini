LingFamily_LocalDelivery_desc_02=Hola,\n\nNecesitamos a alguien para realizar una entrega. ~mission(Contractor|Family)\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n\nEspero que estés disponible.\n\nGracias, \nConni Ling\nCoordinador de Envíos\nLing Family Hauling\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
LingFamily_LocalDelivery_desc_03=¡Hola!\n\nNecesitamos que realices un envío para nosotros. ~mission(Contractor|Family). Aquí tienes un desglose:\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) de ~mission(Pickup3|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n\nGracias, \nConni Ling\nCoordinador de Envíos\nLing Family Hauling\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
LingFamily_LocalDelivery_desc_04=Recibi una solicitud de entrega que podria ser util para ti.\n ~mission(Contractor|Family)\n\nPAQUETES PARA RECOGER (CUALQUIER PEDIDO)\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n · Paquete #~mission(item3|serialnumber) de ~mission(Pickup3|Address)\n · Paquete #~mission(item4|serialnumber) de ~mission(Pickup4|Address)\n\n LUGARES DE ENTREGA (CUALQUIER PEDIDO) \n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address) \n\nT Gracias, \nConni Ling\n Coordinador de envio\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
LingFamily_LocalDelivery_desc_05=Hola, \n\n Se que Conni suele encargarse de estas cosas, pero estara fuera por la tarde. De todos modos, tengo un recorrido de tamaño reducido para usted.\n\nDe todos modos, si leo la factura correctamente, el envío es - \n\nPAQUETES PARA RECOGER (CUALQUIER PEDIDO)\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n · Paquete #~mission(item3|serialnumber) de ~mission(Pickup3|Address)\n · Paquete #~mission(item4|serialnumber) de ~mission(Pickup4|Address)\n · Paquete #~mission(item5|serialnumber) de ~mission(Pickup5|Address)\n\n LUGARES DE ENTREGA (CUALQUIER PEDIDO) \n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n · Paquete #~mission(item5|serialnumber) a ~mission(Dropoff5|Address) \n\n Buena suerte por ahi.\n\n-Davi Ling\nPropietario \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
LingFamily_LocalDelivery_desc_intro=Buenas, \n\nSomos una pequeña empresa de transporte operada y de propiedad familiar que actualmente esta buscando nuevos contratistas en la zona de Crusader. \n\nSi estas interesado en trabajar con nosotros, la siguiente entrega seria una gran prueba para ver si eres un buen candidato para la empresa.\n\nPAQUETE PARA RECOGER\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n\nUBICACIÓN DE ENTREGA\n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\nSi lo entregas con exito, te convertiras en el novato de Ling Family Hauling.\n\nGracias, \nConni Ling\nCoordinadora de envio\nLing Family Hauling\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +100
LingFamily_LocalDelivery_desc_rehire=Hola, \n\n No estoy emocionado de tener que hacer esto, pero tenemos escasez de contratistas y mas entregas que nunca. Estoy dispuesto a darte otra oportunidad, pero debes completar la siguiente entrega. \n\nPAQUETES PARA RECOGER (CUALQUIER PEDIDO)\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address) \n · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n · Paquete #~mission(item3|serialnumber) de ~mission(Pickup3|Address)\n\n LUGARES DE ENTREGA (CUALQUIER PEDIDO) \n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address) \n\nT Gracias, \nConni Ling\n Coordinador de envio\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
