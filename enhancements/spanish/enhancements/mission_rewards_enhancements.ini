headhunters_sabotage_servers_VH_XT_desc_001=HH Pyro RegionB VH Shadowfall Sabotage\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 6/7 | Complexity 6/7 | Risk 6/7 | Knowledge 6/7\n<EM4>Elite Contractor:</EM4> +3,200 Rep (Contractor)
