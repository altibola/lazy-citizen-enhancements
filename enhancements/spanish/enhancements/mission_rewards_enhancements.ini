murderspree_desc=~mission(DistractionKillDescription|Description)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
northrock_boarders_890J_desc_001=Un cliente ejecutivo acaba de informarnos que su 890 Jump habia sido interceptado en ~mission(Location) y abordado por forajidos. Preferirian que esto se manejara de forma privada debido a la naturaleza sensible de los datos de propiedad que se almacenan a bordo. \n\nTu primera prioridad será eliminar a todos los forajidos lo mas rápido posible para que se pueda enviar un equipo de recuperación para devolver la nave al propietario. Cuanto mas tiempo tengan los forajidos el control de la embarcacion, mayores seran las posibilidades de que se pierda. Le recomiendo que adquiera un equipo para esta salida para agilizar las cosas. \n\nTenga en cuenta que gracias a un pequeño contingente de personal de seguridad que permanecio a bordo, todos los miembros supervivientes de la tripulacion pudieron huir en una nave de escape. Se desconoce el estado actual de la seguridad restante, pero por si acaso, este atento a los amistosos cuando se enfrente a los hostiles. \n\n En segundo lugar, si es posible, el cliente esta *muy* interesado en evitar el robo de los datos antes mencionados. Si puede detener el robo de sus almacenes de datos confidenciales antes de que se transmitan, se emitira una generosa bonificacion. \n\n No hace falta decir que este es un cliente al que me gustaria mucho mantener contento. \n\nBraden Corchado\nOficial de logistica - Sucursal Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
northrock_boarders_890J_title_001=URGENTE: acción de embarque en curso <EM4>[8,000 Rep]</EM4>
northrock_bounty_PVP_desc_first=Hola, \n\n Espero que no te importe, pero ya me informaron de tu estatus en el gremio de Cazarrecompensas y queria comunicarme y ver si estarias interesado en contratar a Northrock Service Group, una de las firmas de seguridad privada mejor calificadas del sistema. \n\nSi Si esta interesado, el primer paso seria completar una capturara pro tem del sospechoso. Es menos una evaluación y mas una oportunidad de asegurarnos de que podamos tener una buena relacion de trabajo. \n\nEl sospechoso al que estaria persiguiendo se conoce como ~mission(TargetName). Se sabe que son particularmente esquivos, por lo que es posible que tenga mucho trabajo por delante.\n\nEsperamos tener noticias suyas pronto, \n\nBraden Corchado\nOficial de logistica - Sucursal de Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500
northrock_bounty_PVP_desc_rehire=Hola de nuevo, \n\n Ha pasado un tiempo, espero que todo este bien. Se que las cosas no terminaron en los mejores terminos, pero despues de discutirlo con la gerencia, me gustaria ofrecerle la oportunidad de redimirse. Tenias potencial y odio pensar que no tuviste la oportunidad adecuada de demostrar de lo que eres capaz.\n\nAprender ~mission(TargetName) y podremos ver como restablecer su situacion laboral.\n\nBraden Corchado\nOficial de logistica - Sucursal de Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
northrock_bounty_PVP_title_001=Arrestar el sospechoso: ~mission(TargetName) <EM4>[500 Rep]</EM4>
northrock_bounty_PVP_title_first=Pro Tem Sospechoso <EM4>[500 Rep]</EM4>
northrock_bounty_PVP_title_rehire=capturara sospechosa pro tem (reevaluación) <EM4>[500 Rep]</EM4>
northrock_bounty_desc_first=Hola,\n\nEspero que todo esté yendo bien. Puede que ya me haya comunicado contigo, pero por si acaso, quería enviarte otro mensaje. Soy oficial de logística de la sucursal Stanton de Northrock Service Group, una de las firmas de seguridad privada mejor valoradas del sistema, y estamos buscando ampliar nuestra cartera de contratistas cualificados.\n\nAhora, aunque estés certificado por el Gremio de Cazarrecompensas, Northrock necesitará que completes un contrato pro tempore para asegurarnos de que eres un buen candidato. Estoy pensando en comenzarte con la recompensa de ~mission(TargetName). Fueron vistos por última vez en ~mission(Location|Address).\n\nHazlo y veremos la posibilidad de conseguirte más trabajo.\n\nEspero saber de ti pronto,\n\nBraden Corchado\nOficial de Logística - Sucursal Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
northrock_bounty_fps_UGF_boss_desc_001=Hola,\n\nTengo una recompensa interesante para ti. Un criminal de alto nivel llamado ~mission(TargetName) ha sido localizado en ~mission(Location|Address).\n\nSegún nuestra inteligencia, es muy poco probable que el objetivo esté sentado y esperando al descubierto. Probablemente tendrás que infiltrarte en la instalación y atraerlo hacia afuera.\n\nAlgo como un gran tiroteo debería ser suficiente. \n\nBuena suerte,\n\nBraden Corchado\nOficial de Logística - Sucursal Stanton\nNorthrock Service Group\n\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Defiance Arms Tactical\n- Defiance Core Tactical\n- Defiance Helmet Tactical\n- Defiance Legs Tactical\n- F55 LMG\n- F55 LMG Magazine (150 cap)\n- LH86 Pistol\n- Lynx Arms\n- Lynx Core\n- Lynx Legs\n- Oracle Helmet\n- Bellator Jacket\n- Bellator Shirt and Waistcoat\n- Bellator Trousers\n- Spettro Shoes\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain\n<EM4>Difficulty (1-7):</EM4> Combat 5/7 | Complexity 3/7 | Risk 5/7 | Knowledge 3/7\n<EM4>Hostiles:</EM4> Backup x4, Boss x1, Hostiles x2, Soldiers x4, Technicians x4\n<EM4>Applicant:</EM4> +4,000 Rep (Bounty Hunting)\n<EM4>Failure Penalty:</EM4> -2,000 Rep\n<EM4>Blueprint Reward:</EM4> Guaranteed
northrock_bounty_fps_UGF_boss_nocivs_desc_001=Hola,\n\nTengo un contrato para ti que requiere un poco más de táctica de lo habitual. Un criminal de alto nivel llamado ~mission(TargetName) se está escondiendo con un gran contingente de forajidos en ~mission(Location|Address).\n\nNuestra inteligencia sugiere que las fuerzas de ~mission(TargetName|Last) probablemente actuarán como una línea defensiva para proteger a su jefe. Mi mejor suposición es que tendrás que lidiar con ellos antes de obtener acceso a ~mission(TargetName|Last).\n\nDicho esto, no quiero que dispares indiscriminadamente. A veces, estos forajidos tienen civiles a su alrededor y deben tratarse como no combatientes.\n\nBuena suerte,\n\nBraden Corchado\nOficial de Logística - Sucursal Stanton\nNorthrock Service Group\n\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Defiance Arms Tactical\n- Defiance Core Tactical\n- Defiance Helmet Tactical\n- Defiance Legs Tactical\n- F55 LMG\n- F55 LMG Magazine (150 cap)\n- LH86 Pistol\n- Lynx Arms\n- Lynx Core\n- Lynx Legs\n- Oracle Helmet\n- Bellator Jacket\n- Bellator Shirt and Waistcoat\n- Bellator Trousers\n- Spettro Shoes\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain\n<EM4>Difficulty (1-7):</EM4> Combat 5/7 | Complexity 4/7 | Risk 5/7 | Knowledge 3/7\n<EM4>Hostiles:</EM4> Backup x4, Boss x1, Hostiles x2, Soldiers x8, Technicians x4\n<EM4>Friendlies:</EM4> Civilians x4\n<EM4>Applicant:</EM4> +8,000 Rep (Bounty Hunting)\n<EM4>Failure Penalty:</EM4> -4,000 Rep\n<EM4>Blueprint Reward:</EM4> Guaranteed
northrock_bounty_fps_title_001=Asignación de recompensa: ~mission(TargetName)(HRT) <EM4>[BP]</EM4> <EM4>[4,000–8,000 Rep (Bounty Hunting)]</EM4>
northrock_bounty_prisoner_desc_001=El criminal convicto ~mission(TargetName) ha escapado de una instalación de rehabilitación local y a Northrock se le ha contratado para devolver al recluso a custodia. En mi experiencia, los prisioneros fugados tienden a no rendirse pacíficamente, así que utiliza cualquier método que puedas para encontrar y someter al fugitivo.\n\nPodría valer la pena vigilar lugares donde podrían intentar borrar sus registros. No sería la primera vez que un prisionero intenta limpiar su sentencia después de escapar.\n\nBuena caza,\n\nBraden Corchado\nOficial de Logística - Sucursal Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
northrock_bounty_prisoner_desc_intro=Hola,\n\nMi nombre es Braden Corchado y soy oficial de logística de Northrock Service Group, la principal firma de seguridad de propiedad independiente que opera en el sistema Stanton. Puede que ya me haya comunicado contigo, pero tratamos de acercarnos a cualquiera que cumpla con nuestros altos estándares y animarlos a completar un contrato pro tempore.\n\nNo puedes hacer mucho mejor que convertirte en contratista de Northrock. Tenemos una sólida reputación por ofrecer trabajos desafiantes e interesantes a una tarifa más alta que muchos de nuestros competidores en el sistema.\n\nAhora, para ser aprobado, deberás detener a ~mission(TargetName). Recientemente escaparon del centro de detención y tu trabajo será rastrearlos antes de que puedan desaparecer completamente del radar.\n\nUn pequeño consejo es que es seguro asumir que el objetivo intentará limpiar su historial. Recomiendo triangular tu búsqueda entre el centro de detención del que escaparon y lugares donde pueden hackear el sistema de registros.\n\nHaz esto y veremos la posibilidad de conseguirte más trabajo.\n\nEspero saber de ti pronto,\n\nBraden Corchado\nOficial de Logística - Sucursal Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500
northrock_bounty_prisoner_desc_rehire=Hola,\n\nSé que ha pasado un tiempo, pero si aún estás interesado en hacer trabajos por contrato para Northrock, convencí a la gerencia para que te diera una reevaluación. Si puedes completar con éxito una recompensa para nosotros, podemos ver la posibilidad de reinstaurar tu estado de empleo.\n\nEste contrato pro tempore es para rastrear al criminal fugado ~mission(TargetName). Haz lo mejor que puedas para llegar a ellos antes de que puedan borrar sus registros en un punto de acceso a la base de datos o el trabajo será significativamente más difícil.\n\nEsperando poder confiar en ti en esto.\n\nBraden Corchado\nOficial de Logística - Sucursal Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
