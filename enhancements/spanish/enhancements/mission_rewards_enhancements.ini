cfp_delivery_title_002=Múltiples Entregas Listas - ~mission(Pickup1|Address), ~mission(Pickup2|Address) > ~mission(Dropoff1|Address), ~mission(Dropoff2|Address) <EM4>[50 Rep]</EM4>
cfp_destroy_idris_desc_001=Hey, \n\nLos rumores son ciertos. XenoThreat ha desplegado un Idris para acechar y atacar las operaciones de Citizens for Pyro en una escalada dramática de su hostilidad hacia nosotros. Acabamos de recibir la noticia de que la nave, bajo el mando de ~mission(TargetName), se dirige hacia ~mission(location|address). No podemos llegar con nuestras propias fuerzas lo suficientemente rápido para luchar contra ellos y necesitamos ayuda desesperadamente. \n\nEstamos buscando contratar a alguien lo suficientemente valiente como para enfrentarse a estos bastardos. No es suficiente asustarlos, necesitamos garantizar que no puedan perseguirnos nuevamente. \n\nNo estoy seguro de si alguna vez has enfrentado a un Idris, pero es una tarea difícil para alguien enfrentarse solo. Recomiendo encarecidamente reclutar a otros para la causa.   \n\nMejor,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
