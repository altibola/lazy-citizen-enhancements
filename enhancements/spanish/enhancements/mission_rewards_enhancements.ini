mtps_bounty_fps_UGF_nocivs_desc_001=ACERCA DEL TRABAJO\nmicroTech Protection Services esta buscando un cazarrecompensas cualificado para ayudar en la captura de ~mission(TargetName) de ~mission(Location|Address). Somos conscientes de que puede haber civiles en el lugar, asi que tenga en cuenta un posible fuego cruzado.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Address).\n• Neutralizar ~mission(TargetName); usar la fuerza según sea necesario.\n• Garantizar que no haya victimas civiles.\n\nCALIFICACIONES MÍNIMAS\n• Membresia del Bounty Hunters Guild y certificación apropiada.\n• Acceso a equipo de combate y modo de transporte.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión .\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
