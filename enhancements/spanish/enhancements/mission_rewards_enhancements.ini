UDM_UGF_collect_desc_001=¡Saludos, Socio de Envío Cualificado!\n\nSi estás buscando trabajo como piloto de entrega, ¡tenemos la oportunidad perfecta para ti! \n\nHay una recogida esperando en ~mission(Location|Address) para ser entregada en ~mission(Destination|Address). ¿Suena divertido, verdad?\n\nAdvertencia: se han registrado múltiples alertas de seguridad en la zona. Asegúrate de llevar medidas defensivas para mantenerte a salvo.\n\nSi esto te parece interesante, acepta esta oferta de inmediato. \n\nEsperamos trabajar contigo,\n\nUnified Distribution Management\n -Entregando el Total del Paquete-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
