mg_pacheco_prisonerbreak_desc_002=Aquí está el trato: Un par de veteranos fueron atrapados realizando un trabajo para mí y quiero que los liberes. \n\nUn mecánico amigo ha organizado que su transporte a prisión tenga problemas en el camino, abriendo la puerta frontal y deteniendo la nave. Vas a ir, eliminar cualquier seguridad que escolte el transporte, encontrar el manifiesto de prisioneros a bordo, y usarlo para localizar las cápsulas de criopreservación de mi tripulación.\n\nLos "polos" que busco son ~mission(NameSave2), ~mission(NameKill1), ~mission(NameSave3) y ~mission(NameSave1). Todos han sido leales y merecen algo mejor que pudrirse en la cárcel.\n\nAl menos eso creo... Todavía me pregunto cómo los atraparon en primer lugar. No puedo quitarme la sensación de que uno de ellos podría haber estado haciendo tratos a espaldas nuestras. Te diré algo, si encuentras alguna prueba de que uno de mi tripulación ha estado trabajando con la Advocacy, liquida su cápsula criogénica y te daré un bono. \n\nUna vez que hayas activado las cápsulas correctas y mi gente comience a descongelarse, lárgate de allí y deja que el equipo de recuperación se encargue del resto. Esta última parte es importante. Mira, una vez que estén descongelados, los enviarán a jubilación. No tiene sentido que sepan más sobre mi negocio de lo que ya saben, es decir, no quiero que estos palurdos vean tu cara ni siquiera sepan que existes. \n\nUna vez que estés de vuelta en tu camino, te enviaré una buena cantidad de créditos bien merecidos.\n\nAhora, por si acaso estás pensando en algo como "¿Por qué no libero a todos?" o "¿No sería más fácil eliminarlos permanentemente?" Olvídalo. La política de todo esto es más complicada de lo que necesitas saber. Solo entiende que si se liberan o mueren prisioneros adicionales sin que yo lo ordene, serás tú quien pague. ¿Quieres todo tu dinero? Haz lo que se te dice y ya está. \n\n-Twitch\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +100
mg_pacheco_prisonerbreak_desc_003=Aquí está el trato: Un par de veteranos fueron atrapados realizando un trabajo para mí y quiero que los liberes. \n\nUn mecánico amigo ha organizado que su transporte a prisión tenga problemas en el camino, abriendo la puerta frontal y deteniendo la nave. Vas a ir, eliminar cualquier seguridad que escolte el transporte, encontrar el manifiesto de prisioneros a bordo, y usarlo para localizar las cápsulas de criopreservación de mi tripulación.\n\nLos "polos" que busco son ~mission(NameKill1), ~mission(NameSave2), ~mission(NameSave1) y ~mission(NameSave3). Todos han sido leales y merecen algo mejor que pudrirse en la cárcel.\n\nAl menos eso creo... Todavía me pregunto cómo los atraparon en primer lugar. No puedo quitarme la sensación de que uno de ellos podría haber estado haciendo tratos a espaldas nuestras. Te diré algo, si encuentras alguna prueba de que uno de mi tripulación ha estado trabajando con la Advocacy, liquida su cápsula criogénica y te daré un bono. \n\nUna vez que hayas activado las cápsulas correctas y mi gente comience a descongelarse, lárgate de allí y deja que el equipo de recuperación se encargue del resto. Esta última parte es importante. Mira, una vez que estén descongelados, los enviarán a jubilación. No tiene sentido que sepan más sobre mi negocio de lo que ya saben, es decir, no quiero que estos palurdos vean tu cara ni siquiera sepan que existes. \n\nUna vez que estés de vuelta en tu camino, te enviaré una buena cantidad de créditos bien merecidos.\n\nAhora, por si acaso estás pensando en algo como "¿Por qué no libero a todos?" o "¿No sería más fácil eliminarlos permanentemente?" Olvídalo. La política de todo esto es más complicada de lo que necesitas saber. Solo entiende que si se liberan o mueren prisioneros adicionales sin que yo lo ordene, serás tú quien pague. ¿Quieres todo tu dinero? Haz lo que se te dice y ya está. \n\n-Twitch\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100
mg_pacheco_title=~mission(Title) <EM4>[100–1,000 Rep]</EM4>
mg_ruto_RetrieveConsignment_desc_001=Oh hola, recientemente escuché un poco de información de que ~mission(location|address) recibió algunos materiales confidenciales que son de gran interés para un conocido mío. Tan interesantes que están dispuestos a pagar a alguien para que irrumpa en la instalación, tome la mercancía y la entregue en ~mission(DropOff1|address). Ahora espero que haya bastante seguridad, que seguramente ofrecerá resistencia, así que llevaría un par de armas. \n\nSe dice que los materiales confidenciales fueron entregados en un envío junto con otras cosas y ahora se almacenan en la bóveda automatizada de la instalación. Los oficiales de seguridad superiores en el lugar llevan datapads que contienen códigos de recuperación utilizados para acceder a la bóveda. Tendrás que conseguir un datapad antes de usar la cinta transportadora para recuperar las cajas. \n\nSi necesitas un pequeño incentivo, he visto el manifiesto y puedo confirmar que las otras cajas almacenadas en la instalación son bastante buenas. A mi cliente le importa poco lo que les suceda, así que son tuyas para hacer lo que quieras. Hazlo bien y esas cajas adicionales podrían ser un buen bono además de la tarifa de entrega para ti.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +2,000
mg_ruto_RetrieveConsignment_title_001=obtener la mercancía <EM4>[500–4,000 Rep]</EM4>
mg_ruto_UGF_destroy_E_desc_001=Parece que hay un recién llegado en el sector que no ha estado pagando las tarifas correctas a las personas adecuadas. Para darles una pequeña lección, mi cliente quiere que vayas a ~mission(Location|Address) y destruyas todas las drogas en el lugar.\n\nLos matones de bajo nivel que tienen en el lugar probablemente armarán un alboroto al respecto e intentarán detenerte. Trátalos como quieras, pero deshacerte del producto es lo más importante.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostiles x8\n<EM4>Friendlies:</EM4> Civilians x4
mg_ruto_UGF_destroy_E_title_001=suministro limitado <EM4>[100 Rep]</EM4>
mg_ruto_UGF_destroy_H_desc_001=Un cliente mío está tratando de negociar un trato, pero no tiene mucha suerte. La otra parte siente que tiene toda la ventaja porque está sentada cómodamente sobre una pila de inventario. Para ayudar a avanzar en las negociaciones, necesitaré que vayas a ~mission(Location|Address) y destruyas todas las drogas en el lugar. \n\nAhora, debería decirte que el lugar está siendo protegido por algunas personas muy serias, así que llegar a la reserva será un poco complicado, pero confío en que encontrarás una manera. \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
mg_ruto_UGF_destroy_H_title_001=limpieza de inventario <EM4>[100 Rep]</EM4>
mg_ruto_UGF_destroy_desc_001=Uno de mis clientes no está contento al enterarse de que alguien se está metiendo en su territorio. En lugar de seguir la ruta más tradicional de matar a algunas personas y armar un lío, han optado por enviar un mensaje diferente.\n\nVas a ir a ~mission(Location|Address) y destruir todas las drogas en el lugar. \n\nPor supuesto, si alguien quiere pelear contigo, siéntete libre de defenderte, pero deshacerte del producto es lo más importante.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Friendlies:</EM4> Civilians x4
mg_ruto_UGF_destroy_title_001=sin existencias <EM4>[100 Rep]</EM4>
mg_ruto_UGF_eliminateall_Lawnocivs_desc_001=Todos guardan rencores, ¿verdad? Quiero decir, cuando te atrapan cometiendo un delito, entiendo que estés un poco amargado, pero eso es más o menos el juego, ¿verdad?\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostiles x15\n<EM4>Friendlies:</EM4> Civilians x4
mg_ruto_UGF_eliminateall_Lawnocivs_title_001=vive y deja que un contratista independiente se encargue de la venganza <EM4>[100 Rep]</EM4>
mg_ruto_UGF_eliminateall_civsonly_desc_001=Un cliente está siendo superado por un nuevo competidor y quiere ponerle un obstáculo.\n\nVas a ir a ~mission(Location|Address) y matar a todos los civiles que trabajan allí. \n\nHaz lo que quieras con los matones armados que custodian a los trabajadores, pero recuerda que no son la prioridad.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostiles x10\n<EM4>Friendlies:</EM4> Civilians x4
mg_ruto_UGF_eliminateall_civsonly_title_001=demasiados cocineros <EM4>[100 Rep]</EM4>
mg_ruto_UGF_eliminateall_desc_001=Esto es un poco agresivo para mi gusto, pero los créditos son créditos, ¿verdad?\n\nTengo un cliente que busca a una persona altamente motivada para ir a ~mission(Location|Address) y matar a todos los que estén allí. \n\nBásicamente, comienza a disparar y no pares. Te pagarán una vez que el lugar esté despejado.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostiles x15
mg_ruto_UGF_eliminateall_nocivs_desc_001=Conozco a alguien que quiere iniciar un nuevo negocio, pero le cuesta trabajo contratar a los trabajadores cualificados que necesita.\n\nAhora, la cosa es que encontraron al equipo perfecto en ~mission(Location|Address), pero las personas para las que trabajan no los dejarán ir. Incluso contrataron guardias armados adicionales para asegurarse de ello.\n\nLo que quiero que hagas es ir allí y matar a todos los guardias asegurándote de que todos los trabajadores permanezcan ilesos.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostiles x15\n<EM4>Friendlies:</EM4> Civilians x4
mg_ruto_UGF_eliminateall_nocivs_title_001=es difícil encontrar buenos ayudantes <EM4>[100 Rep]</EM4>
mg_ruto_UGF_eliminateall_title_001=haciendo un desastre <EM4>[100 Rep]</EM4>
mg_ruto_UGF_steal_desc_001=Esta debería ser pan comido para alguien como tú. Hay un paquete retenido en ~mission(Location|Address) y necesito que lo lleves a ~mission(Destination|Address). \n\nHay un problemita bastante pequeño que deberías saber. Va a haber un montón de seguridad allá abajo. Pero estoy seguro de que estará bien.\n\n:)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100
mg_ruto_UGF_steal_title_001=agarrar y correr <EM4>[100 Rep]</EM4>
mg_ruto_clearcrimestat_norep_desc_01=Hola. No hemos tenido la oportunidad de trabajar juntos todavía, pero estoy en un aprieto y me vendría bien otro cuerpo. No en vano, por supuesto. Estoy totalmente a favor de un buen quid pro quo.\n\nUno de mis socios que estuvo algun tiempo en Klescher debia traerme un chip de datos, pero luego se callaron. Ahora asumo que están muertos, pero este es el trato: si terminas su trabajo, borro tu estadistica criminal. No esta mal, ¿verdad? \n\n Su predecesor aparentemente estaba planeando usar algunos tuneles viejos para escapar. Hizo que pareciera que no eran exactamente lo mas facil de acceder, pero confio en que puedas resolverlo. Supongo que encontraras su cuerpo en algun lugar allí y, si tenemos suerte, todavía tendra el chip. \n\n Una vez que lo obtengas, termina de salir como puedas. Entonces enviame los datos. Hay un lugar cercano donde puedes cargar el contenido del chip. Sin embargo, es posible que desees tener cuidado con Hurston Security. Han sido una molestia últimamamente, asi que no me sorprenderia que te los toparas. Despues de obtener los datos y validarlos, borrare tu crimestat. \n\nEntonces podras ir y disfrutar de tu nueva libertad. Si haces esto bien, tal vez tenga un trabajo mas lucrativo para ti en el futuro.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
mg_ruto_clearcrimestat_norep_title_01=¿Necesitas una salida? <EM4>[50 Rep]</EM4>
mg_ruto_clearcrimestat_rep_desc_01=Hola. He oido que terminaste en Klescher, lo cual es un verdadero fastidio. Pero en realidad podria ser un día de suerte para los dos. \n\n Para resumir, alguien saco a escondidas un chip de datos de la prision, pero nunca me respondieron. Se con certeza que no han abandonado las instalaciones, asi que creo que algo podria haberles pasado. Si bien es tragico, los negocios deben continuar. Si puedes conseguir el chip y terminar el trabajo, puedo borrar tu criminalistica por ti. ¿Que dices? \n\n Por supuesto, no se exactamente hasta donde llegaron, pero puedo decirte que la prision tiene toda una red de tuneles ocultos que mi chico planeaba usar para escapar. Supongo que su cadaver se está pudriendo en algun lugar allí. \n\n Una vez que encuentres el cuerpo, espero que el chip todavía este en el. Cuando lo tengas, termina de escapar y enviame los datos. Hay un lugar cercano donde puedes cargar el contenido del chip. \n\n Sin embargo, una advertencia: es posible que desees tener cuidado con Hurston Security. Han sido una molestia últimamamente, asi que no me sorprenderia que te los toparas. \n\n Cuando tenga los datos, borrare tu crimestat y luego, listo, estaras libre y limpio. Lo que hagas despues depende totalmente de ti.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
mg_ruto_clearcrimestat_rep_title_01=Ayudemonos <EM4>[50 Rep]</EM4>
mg_ruto_collect_reclaimer_desc=Hola.\n\nNine Tails tuvo un pequeño problema. Resulta que tenian un pequeño negocio secundario en el comercio clandestino de organos. Ahora que es un area de la que generalmente me gusta mantenerme alejado, pero un concierto es un concierto, ¿verdad? Parece que una de sus carnicerias moviles a bordo del 'October Rising' fue atacada por seguridad privada mientras cortaba. Ahora los Nine Tails están dispuestos a cortar los lazos con la nave y su tripulacion (que probablemente  estén todos muertos de todos modos), pero necesitan que se extraiga una caja en particular. Supongo que fue un pedido especial o algo asi.\n\nDe todos modos, sube a bordo del October Rising, toma el paquete y sal.\n\nLa seguridad aun esta presente, asi que ten cuidado y tal vez trae algunos amigos, pero recuerda, tu prioridad es el paquete. Si esta buscando ahorrarse algunas molestias adicionales, tambien puede bloquear el area cerrando el conjunto de comunicaciones mas cercano si desea evitar las estadisticas criminales por, ya sabe, matar a un grupo de seguridad. Pero bueno, tu lo haces.\n\nUna vez que estes fuera, deja el paquete en la clinica en Grim HEX y yo ordenare tu pago.\n\nEstá chupado,\n\nRuto.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Pirates x3, Private Security x11
