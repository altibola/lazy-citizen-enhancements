Tutorial01_MissionDesc=Felicidades por dar tus primeros pasos en el universo.\n\nA lo largo de este tutorial, aprenderás a moverte tanto a pie como en el espacio.\n\nPrimero, te ayudaremos a familiarizarte con algunos controles básicos de movimiento y el uso de tu mobiGlas mientras estás dentro de tu "Hab" (o habitación). Sigue los objetivos e indicaciones en tu HUD (visualizador frontal) para avanzar en esta misión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Starter, Unique
Tutorial02_MissionDesc=¡Bien hecho!\n\nCon la primera parte completada, ahora deberías tener cierta familiaridad básica con los controles de movimiento, la gestión de tu hambre y sed, y algunas de las funciones principales de tu mobiGlas, como el Administrador de Contratos y tu Diario.\n\nEn esta sección te ayudará a familiarizarte con ~mission(Location|Name) y te llevará a visitar ~mission(StoreName), una armería aquí en ~mission(Location|Name).\n\nPuedes comprar allí, y en otras tiendas similares, utilizando Créditos de la Tierra Unida (UEC). Durante la fase Alfa del desarrollo de Star Citizen, usaremos una moneda llamada aUEC (Créditos de la Tierra Unida Alfa). Esta es una moneda temporal diseñada específicamente para probar la economía y el equilibrio del juego.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Starter, Unique
Tutorial03_MissionDesc=Casi has terminado con el tutorial. ¡Lo único que queda es emprender el vuelo!\n\nCon tus asuntos en ~mission(Location|Name) terminados, es hora de salir de la ciudad, y eventualmente, del planeta. Dirígete a los transbordadores de tránsito ~mission(TransitNameShort). Estos transbordadores pueden llevarte por todo ~mission(Location|Name), pero tu destino es el puerto espacial, donde se ha proporcionado temporalmente una Anvil C8 Pisces para ti.\n\nEsta nave de exploración ligera es una excelente nave inicial, perfecta para nuevos pilotos que buscan desplegar sus alas.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Starter, Unique
UDM_LocalDelivery_desc_01=¡Saludos, Socio de Envíos Cualificado! \n\n ¿Busca una excusa para surcar los cielos con su nave lista para cargar? Gane créditos y explore el area local con el siguiente itinerario cuidadosamente seleccionado -\n\nPAQUETE PARA RECOGER\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n\nUBICACIÓN DE ENTREGA\n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\nSi ser su propio supervisor y recibir un pago por pilotar su propia nave le parece el trabajo perfecto, este contrato es justo lo que estaba buscando. \n\nEsperamos trabajar con usted,\n\nUnified Distribution Management\n -Entregando el paquete total-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_LocalDelivery_desc_02=¡Saludos, Socio de Envíos Cualificado!\n\n¿Listo para contribuir a nuestra creciente y expansiva red de entregas? ¿Tienes una nave a tu disposición que puede llevar varios paquetes y volar entre cuerpos planetarios y satélites locales? Tenemos la oportunidad perfecta para ti con este itinerario cuidadosamente seleccionado -\n\nPAQUETES PARA RECOGER (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n\nUBICACIONES DE ENTREGA (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n\nSi esto suena como algo que te interesa, ¡acepta esta oferta de inmediato!\n\nEsperamos con interés trabajar contigo,\n\nUnified Distribution Management\n -Entregando el Paquete Completo-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_LocalDelivery_desc_03=¡Saludos, Socio de Envíos Cualificado!\n\n¿Interesado en ganar créditos desde la comodidad de tu propia nave lista para cargar? Entonces, el siguiente itinerario cuidadosamente seleccionado puede ser la oportunidad que has estado buscando -\n\nPAQUETES PARA RECOGER (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n\nUBICACIONES DE ENTREGA (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n\nAcepta este contrato y estarás en camino.\n\nEsperamos con interés trabajar contigo,\n\nUnified Distribution Management\n -Entregando el Paquete Completo-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_LocalDelivery_desc_04=¡Saludos, Socio de Envíos Cualificado!\n\n¿Estás buscando emocionantes oportunidades en el sector de entregas? Si tienes una actitud positiva y un amplio espacio de carga, tenemos la oportunidad perfecta para ti.\n\nPAQUETES PARA RECOGER (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete #~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n\nUBICACIONES DE ENTREGA (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n\nAsí que toma ese contrato y pongámonos a trabajar.\n\nEsperamos con interés trabajar contigo,\n\nUnified Distribution Management\n -Entregando el Paquete Completo-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_LocalDelivery_desc_05=¡Saludos, Socio de Envíos Cualificado!\n\n¿Estás buscando una emocionante nueva carrera desde la comodidad de tu propia nave lista para cargar? Entonces, el siguiente itinerario puede ser justo la oportunidad que has estado buscando -\n\nPAQUETES PARA RECOGER (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete #~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n     · Paquete #~mission(item5|serialnumber) desde ~mission(Pickup5|Address)\n\nUBICACIONES DE ENTREGA (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n     · Paquete #~mission(item5|serialnumber) a ~mission(Dropoff5|Address)\n\nTodo lo que necesitas hacer es aceptar el contrato y estarás en camino.\n\nEsperamos con interés trabajar contigo,\n\nUnified Distribution Management\n -Entregando el Paquete Completo-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_LocalDelivery_desc_intro=¡Saludos, Potencial Socio de Envíos Cualificado!\n\n¿Listo para contribuir a nuestra creciente y expansiva red de entregas? ¿Tienes una nave a tu disposición que puede llevar varios paquetes y volar entre cuerpos planetarios y satélites locales? ¡La Unified Distribution Management está buscando un piloto como tú! \n\nNos encantaría evaluar tu potencial de contratación con este itinerario cuidadosamente seleccionado -\n\nPAQUETE PARA RECOGER\n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n\nUBICACIÓN DE ENTREGA\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\nSi esto suena como algo que te interesa, ¡acepta esta oferta de inmediato! \n\nEsperamos con interés trabajar contigo,\n\nUnified Distribution Management\n -Entregando el Paquete Completo-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +250
UDM_LocalDelivery_desc_rehire=¡Saludos, Ex Socio de Envíos Cualificado!\n\n¿Listo para otra oportunidad de usar tu nave lista para cargar y ganar créditos? La Unified Distribution Management ha elegido el siguiente itinerario cuidadosamente seleccionado como la manera perfecta de reevaluar tus habilidades -\n\nPAQUETES PARA RECOGER (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n\nUBICACIONES DE ENTREGA (CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n \nEsperamos con interés trabajar contigo nuevamente,\n\nUnified Distribution Management\n -Entregando el Paquete Completo-\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
