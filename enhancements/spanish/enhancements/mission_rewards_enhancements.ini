WSTR_TimeTrial_repeat_desc_01=¿Listo para establecer un nuevo récord personal en la Wildstar Racing Amateur League?\n\n~mission(RaceDetails)\n\nDESCARGO DE RESPONSABILIDAD\nWildstar Racing requiere que el piloto del vehículo sea el piloto contratado, no se permiten sustitutos ni suplentes. Ten en cuenta que Wildstar Racing utiliza pistas de acceso público y que puede haber otras personas presentes. Wildstar Racing no se hace responsable de los daños que pueda sufrir tu nave durante la carrera.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
