UDM_courier_fromdc_med_desc_001=¡Saludos, Socio de Envíos Cualificado!\n\nHoy es el día perfecto para ganar algo de experiencia adicional en envíos de primera mano.\n\nSi tienes una nave con suficiente espacio de almacenamiento, hay un buen número de paquetes en el ~mission(Pickup1) en ~mission(Pickup1|Address) listos para ser entregados. \n\nHablamos de una gran oportunidad para el crecimiento profesional.\n\nPAQUETES PARA RECOGER \n     · Todos los Paquetes en el ~mission(Pickup1) en ~mission(Pickup1|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n     · Paquete #~mission(item5|serialnumber) a ~mission(Dropoff5|Address)\n     · Paquete #~mission(item6|serialnumber) a ~mission(Dropoff5|Address)\n     · Paquete #~mission(item7|serialnumber) a ~mission(Dropoff6|Address)\n     · Paquete #~mission(item8|serialnumber) a ~mission(Dropoff6|Address)\n     · Paquete #~mission(item9|serialnumber) a ~mission(Dropoff7|Address)\n     · Paquete #~mission(item10|serialnumber) a ~mission(Dropoff7|Address)\n\nEsperamos con interés trabajar contigo,\n\nGestión Unificada de Distribución\n -Entregando el Paquete Completo-\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
UDM_courier_fromdc_small_desc_001=¡Saludos, Socio de Envíos Cualificado!\n\nSi estás en busca de una manera sencilla de ganar créditos, ¡no busques más! Hay algunos paquetes esperando ser entregados en ~mission(Pickup1|Address) en ~mission(Pickup1).\n\nPAQUETES PARA RECOGER \n     · Todos los Paquetes en ~mission(Pickup1) en ~mission(Pickup1|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n     · Paquete #~mission(item5|serialnumber) a ~mission(Dropoff5|Address)\n\nEsperamos con interés trabajar contigo,\n\nGestión Unificada de Distribución\n -Entregando el Paquete Completo-\nUDM_courier_todc_med_desc_001=¡Saludos, Socio de Envíos Cualificado!\n\n¿Listo para intentar entregar un envío bastante grande de paquetes? Entonces, ¿qué tal si ayudas a llevar los paquetes desde ~mission(Location|Address) hasta ~mission(Destination) en ~mission(Destination|Address)? ¡Solo despeja suficiente espacio en tu nave primero y estarás listo!\n\nEsperamos trabajar contigo,\n\nGestión Unificada de Distribución\n -Entregando el Paquete Total-\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_courier_todc_med_desc_001=¡Saludos, Socio de Envíos Cualificado!\n\n¿Listo para probar tus habilidades entregando un envío bastante grande de paquetes? ¿Qué tal si ayudas llevando esta asignación a ~mission(Dropoff1) en ~mission(Dropoff1|Address)? ¡Solo asegúrate de despejar suficiente espacio en tu nave primero y estarás listo!\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN) \n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete #~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n     · Paquete #~mission(item5|serialnumber) desde ~mission(Pickup5|Address)\n     · Paquete #~mission(item6|serialnumber) desde ~mission(Pickup5|Address)\n     · Paquete #~mission(item7|serialnumber) desde ~mission(Pickup6|Address)\n     · Paquete #~mission(item8|serialnumber) desde ~mission(Pickup6|Address)\n     · Paquete #~mission(item9|serialnumber) desde ~mission(Pickup7|Address)\n     · Paquete #~mission(item10|serialnumber) desde ~mission(Pickup7|Address)\n\nUBICACIÓN DE ENTREGA\n     · Todos los paquetes entregados a ~mission(Dropoff1) en ~mission(Dropoff1|Address)\n\nEsperamos con interés trabajar contigo,\n\nGestión Unificada de Distribución\n -Entregando el Paquete Completo-\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
UDM_courier_todc_small_desc_001=¡Saludos, Socio de Envíos Cualificado!\n\n¿Interesado en una ruta de envío simple sin muchas complicaciones? \nEntonces, ¡llevar algunos paquetes a ~mission(Dropoff1) en ~mission(Dropoff1|Address) debería ser el trabajo perfecto para ti!\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN) \n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete #~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n     · Paquete #~mission(item5|serialnumber) desde ~mission(Pickup5|Address)\n\nUBICACIÓN DE ENTREGA\n     · Todos los paquetes entregados a ~mission(Dropoff1) en ~mission(Dropoff1|Address)\n\nEsperamos con interés trabajar contigo,\n\nGestión Unificada de Distribución\n -Entregando el Paquete Completo-\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_internaldelivery_dc_desc_001=Greetings Qualified Package Handler!\n\nExcited to delve into the complex world of storage management and facility realignment? Then don’t miss this chance to assist with organizing the following packages at ~mission(Location|Address).\n\nPACKAGES FOR PICK UP (ANY ORDER)\n     · Package #~mission(item1|serialnumber) from the ~mission(Pickup1)\n     · Package #~mission(item2|serialnumber) from the ~mission(Pickup2)\n\nDROP OFF LOCATIONS (ANY ORDER)\n     · Package #~mission(item1|serialnumber) to the ~mission(Dropoff1)\n     · Package #~mission(item2|serialnumber) to the ~mission(Dropoff2)\n\nIf this sounds like something you're interested in, please accept this offer right away! \n\nLooking forward to working with you,\n\nUnified Distribution Management\n -Delivering the Total Package-\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
UDM_internaldelivery_dc_desc_003=¡Saludos, Manipulador de Paquetes Cualificado!\n\n¿Listo para enfrentar un trabajo desafiante pero gratificante en una capacidad de envío adyacente? Entonces, tenemos una oportunidad perfecta para ti en ~mission(Location|Address).\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) de ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) de ~mission(Pickup2)\n     · Paquete n.º ~mission(item3|serialnumber) de ~mission(Pickup3)\n     · Paquete n.º ~mission(item4|serialnumber) de ~mission(Pickup4)\n\nLUGARES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n     · Paquete n.º ~mission(item3|serialnumber) a ~mission(Dropoff3)\n     · Paquete n.º ~mission(item4|serialnumber) a ~mission(Dropoff4)\n\nAsí que acepta ese contrato y pongámonos a trabajar.\n\nEsperamos trabajar contigo,\n\nGestión Unificada de Distribución\n -Entregando el Paquete Total-\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
UDM_internaldelivery_dc_desc_005=¡Saludos, Manipulador de Paquetes Cualificado!\n\nAunque puede que no vayan muy lejos, los siguientes paquetes en ~mission(Location|Address) aún necesitan ser manipulados con cuidado experto. ¿Eres el experto que estamos buscando?\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) de ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) de ~mission(Pickup2)\n     · Paquete n.º ~mission(item3|serialnumber) de ~mission(Pickup3)\n     · Paquete n.º ~mission(item4|serialnumber) de ~mission(Pickup4)\n     · Paquete n.º ~mission(item5|serialnumber) de ~mission(Pickup5)\n     · Paquete n.º ~mission(item6|serialnumber) de ~mission(Pickup6)\n\nLUGARES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n     · Paquete n.º ~mission(item3|serialnumber) a ~mission(Dropoff3)\n     · Paquete n.º ~mission(item4|serialnumber) a ~mission(Dropoff4)\n     · Paquete n.º ~mission(item5|serialnumber) a ~mission(Dropoff5)\n     · Paquete n.º ~mission(item6|serialnumber) a ~mission(Dropoff6)\n\nTodo lo que necesitas hacer es aceptar el contrato y estarás en camino.\n\nEsperamos trabajar contigo,\n\nGestión Unificada de Distribución\n -Entregando el Paquete Total-\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +2,000
