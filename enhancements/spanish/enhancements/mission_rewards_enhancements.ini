xenothreat_destroy_server_HH_desc_01=Uno de nuestros transportistas de datos desapareció mientras transportaba información operativa vital. Hace unas horas, determinamos que fueron atacados por un grupo de Headhunters y el contenido de las tiendas de datos de la nave fue transferido a sus servidores en ~mission(location|address). \n\nAunque tenemos todas las razones para creer que nuestra encriptación resistirá, no podemos correr el riesgo de que se expongan los contenidos de esos archivos. Se te ordena dirigirte allí y asegurarte de que nuestros datos permanezcan privados destruyendo los servidores de Headhunter.\n\nTe recomiendo encarecidamente que seas minucioso. Arrasa con todo y con todos lo que puedas.\n\nEspecialista en Comunicaciones Engler\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
xenothreat_destroy_server_HH_title_01=Eliminación Total de Servidores <EM4>[50 Rep]</EM4>
xenothreat_eliminateall_CFP_outpost_desc_01=El grupo de instigadores que se hace llamar "Citizens for Pyro" ya no puede seguir propagando sus mentiras y propaganda sin repercusiones.\n\nComo un recordatorio contundente de quién realmente controla Pyro, hemos emitido una orden de eliminar toda presencia de "Ciudadanos" en ~mission(location|address). Es probable que haya resistencia, pero esperamos que lo manejes con poca dificultad. Hazlo según las instrucciones y serás bien remunerado por tu trabajo.\n\nEspec. en Comunicaciones Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
xenothreat_eliminateall_CFP_outpost_title_01=Orden de Eliminación: "Ciudadanos" en ~mission(location) <EM4>[1,000 Rep]</EM4>
xenothreat_eliminatespecific_desc_001=Los esfuerzos de XenoThreat por mantener a raya las influencias externas que infectan este sistema están siendo probados por un grupo que se atreve a llamarse a sí mismo "Citizens for Pyro". Un miembro destacado del grupo, ~mission(TargetName), ha establecido operaciones en ~mission(Location|Address) y ya está trabajando arduamente propagando sus mentiras y propaganda a cualquiera que quiera escuchar. Si queremos que Pyro permanezca independiente de la UEE y la influencia alienígena, algo debe hacerse al respecto ahora.  \n\nEs por eso que XenoThreat está emitiendo una orden de eliminar a ~mission(TargetName|Last). Y sabiendo lo importantes que son para las operaciones de Citizens for Pyro, no me sorprendería si tuvieras que luchar contra muchos de sus seguidores más fanáticos antes de tener la oportunidad de dispararles. Pero recuerda que ~mission(TargetName|Last) es tu objetivo, y el pago depende únicamente de asegurarte de que sean eliminados. \n\nEspec. en Comunicaciones Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
xenothreat_eliminatespecific_desc_002=Los Headhunters han reunido un equipo especial cuyo único propósito es atacar, perturbar y socavar nuestras operaciones. Aunque me duele admitirlo, han tenido algunos pequeños éxitos y rápidamente se están convirtiendo en una preocupación. \n\nXenoThreat sabe que la mejor manera de matar a una serpiente es cortándole la cabeza, así que estamos emitiendo una orden de eliminar al comandante del equipo de ataque, ~mission(TargetName), quien según nuestras fuentes de inteligencia, ha estado escondiéndose en ~mission(Location|Address) durante algunos días. \n\nEsperaría una fuerte resistencia por parte de las fuerzas de Headhunter allí. Por lo que hemos oído, ~mission(TargetName|Last) obtuvo este comando en parte debido a la feroz lealtad que inspira en otros. Reunir a tu propia tripulación para abordar esto sería una estrategia operativa sólida. \n\nFeliz caza de cabezas,\n\nEspec. en Comunicaciones Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
