Hurston_bounty_boss_dc_desc_001=EXTERNALIZACIÓN DE HURSTON DYNAMICS\nCONTRATO: Recolección de recompensas\nGERENTE DE EXTERNALIZACIÓN: I. Takao\nEVALUACIÓN DE RIESGOS: Objetivo de alto riesgo (Apoyo armado)\n\nHurston Dynamics está buscando un contratista para completar una recompensa por ~mission(TargetName). Hasta ahora, esta recompensa ha resultado extremadamente escurridiza, pero los informes de inteligencia han rastreado al objetivo y a un grupo de sus asociados conocidos hasta ~mission(Location|Address).\n\nSin embargo, existe una gran posibilidad de que ~mission(TargetName|Last) no arriesgue un enfrentamiento a menos que sea absolutamente necesario. Es nuestra recomendación neutralizar primero a una parte significativa de los aliados del criminal para atraerlo. El informe indica que un gran grupo de estos hostiles se encuentra actualmente cerca de ~mission(Location).\n\nEl pago se liberará solo después de que la recompensa se considere completa.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Juggernauts x1, Snipers x2, Soldiers x13, Technicians x3
Hurston_bounty_boss_dc_title_001=Recompensa Escurridiza: ~mission(TargetName) (HRT) <EM4>[500 Rep]</EM4>
Hurston_bounty_multiboss_dc_desc_001=EXTERNALIZACIÓN DE HURSTON DYNAMICS\nCONTRATO: Recolección de recompensas\nGERENTE DE EXTERNALIZACIÓN: I. Takao\nEVALUACIÓN DE RIESGOS: Objetivo de muy alto riesgo (Apoyo armado)\n\nHurston Dynamics está buscando un contratista para completar una recompensa por ~mission(TargetName). Este objetivo y la gran fuerza hostil con la que viajan acaban de ser informados de que están saqueando ~mission(Location|Address).\n\nSin embargo, si se mantiene su modus operandi, ~mission(TargetName|Last) suele permanecer oculto durante los ataques, prefiriendo dirigir sus fuerzas desde lejos. Es nuestra recomendación que te centres en debilitar primero a sus aliados, y una vez que sus números hayan sido significativamente reducidos, ~mission(TargetName|Last) no tendrá más opción que enfrentarte directamente.\n\nEl pago se liberará solo después de que se considere completa la recompensa.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Backup x5, Juggernauts x1, Soldiers x18, Technicians x32
Hurston_bounty_multiboss_dc_title_001=Recompensa Esquiva: ~mission(TargetName) (VHRT) <EM4>[1,000 Rep]</EM4>
Hurston_eliminateall_dc_desc_001=EXTERNALIZACIÓN DE HURSTON DYNAMICS\nCONTRATO: Neutralizar Fuerza Hostil\nGERENTE DE EXTERNALIZACIÓN: T. Dalik\nEVALUACIÓN DE RIESGOS: Alto\n\nNuestras fuerzas de seguridad han sido informadas de una incursión de forajidos en curso en ~mission(Location|Address), y necesitamos un operador independiente capaz de despejar a los actores hostiles.\n\nSegún el personal en el lugar, los forajidos se encuentran actualmente refugiados cerca de ~mission(Location). Acércate con precaución y prepárate para usar la fuerza letal si los forajidos se resisten a ser retirados.\n\nEl pago solo será autorizado una vez que la ubicación haya sido efectivamente despejada.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Hurston_eliminateall_dc_title_001=Neutralizar Incursión de Forajidos <EM4>[500 Rep]</EM4>
Hurston_eliminatespecifc_dc_desc_001=EXTERNALIZACIÓN DE HURSTON DYNAMICS\nCONTRATO: Recolección de Recompensas\nGERENTE DE EXTERNALIZACIÓN: T. Davik\nEVALUACIÓN DE RIESGOS: Objetivo de Riesgo Moderado\n\nHurston Dynamics está buscando un contratista para completar una recompensa por ~mission(TargetName). Los informes de inteligencia han rastreado al objetivo hasta ~mission(Location|Address) donde fueron vistos por última vez cerca de ~mission(Location).\n\nPrepárate para que se resistan a ser capturados y para usar la fuerza letal si es necesario.\n\nEl pago se liberará solo después de que se considere completa la recompensa.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> CQC x18, Juggernauts x1, Snipers x2, Soldiers x6
Hurston_eliminatespecifc_dc_title_001=Recompensa Localizada: ~mission(TargetName) (MRT) <EM4>[500 Rep]</EM4>
Hurston_searchbody_dc_desc_001=EXTERNALIZACIÓN DE HURSTON DYNAMICS\nCONTRATO: Localizar Persona Desaparecida\nGERENTE EXTERNO: I. Takao\nEVALUACIÓN DE RIESGO: Bajo\n\nEl personal en ~mission(Location|Address) ha presentado recientemente un informe de persona desaparecida para ~mission(TargetName). Han estado desaparecidos durante varios días y fueron vistos por última vez dirigiéndose a ~mission(Location).\n\nSe le contrata para llevar a cabo una búsqueda en el lugar para ~mission(TargetName|Last) y ver si puede determinar su paradero.\n\nEl pago depende de proporcionar un registro de su ubicación actual, vivo o muerto.\n\n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o toma de acción basada en esta información por parte de personas o entidades que no sean el destinatario previsto está prohibido. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
