blacjac_RetrieveConsignment_desc_001=ATENCIÓN: Mercenarios con experiencia en manipulación de carga\n\nLos Nine Tails están asaltando actualmente una de nuestras instalaciones en ~mission(Location|address). Dado que acaban de recibir una entrega de materiales confidenciales, no creemos que sea una coincidencia. BlacJac necesita a alguien que se dirija rápidamente a la ubicación y asegure estas importantes cajas antes de que lo hagan los Nine Tails. Se le autoriza a utilizar la fuerza letal contra cualquiera que intente detenerlo.\n\nComo parte de nuestro protocolo estándar de seguridad, los materiales confidenciales se integraron en otro envío y se aseguraron en la cámara automatizada. Deberá encontrar los códigos de recuperación relevantes para los materiales confidenciales e ingresarlos en el transportador de paquetes para recuperar las cajas. Los códigos de recuperación se almacenan localmente en datapads y solo se proporcionan a personal de alto rango. Con suerte, estarán vivos para ayudarlo, pero considerando la completa falta de comunicación, tememos que no sea el caso. Existe la posibilidad de que los Nine Tails ya hayan obtenido los datapads.\n\nUna vez que haya recopilado todos los materiales confidenciales, deberán entregarse en ~mission(dropoff1|address). El pago está sujeto a su entrega.\n\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +2,000
blacjac_RetrieveConsignment_title_001=Proteger el Sitio y Obtener Materiales Confidenciales <EM4>[500–4,000 Rep]</EM4>
blacjac_UGF_defend_E_desc_001=ATENCION: Operadores Mercenarios Verificados\n\nUno de los sitios bajo el control de BlacJac ha estado teniendo problemas con algunos forajidos locales. Nos gustaria que bajaras a ~mission(Location|Address) y proteja el sitio de estas amenazas hostiles.\n\n según los primeros informes, espero que este sea un asunto bastante sencillo, pero si lo hace sentir mejor, no dude en reclutar un equipo para brindarle soporte adicional.\n\nGracias,\nGloria Mesa\n\nContrato privado Supervisor\nBlacJac Seguridad, "Proteccion proporcionada"\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x1, Hostiles x10, Private Security x4, Sentries x6
blacjac_UGF_defend_E_title_001=Defender el sitio de amenazas menores <EM4>[500 Rep]</EM4>
blacjac_UGF_defend_VH_desc_001=ATENCION: Operadores Mercenarios Verificados\n\nHe recibido un informe de que algunos operadores están planeando tomar medidas contra ~mission(Location|Address). BlacJac quiere que usted forme un equipo y defienda el sitio de esta peligrosa amenaza. \n\n Se recomienda encarecidamente que no intente realizar este contrato solo. Contratar un equipo de mercenarios capacitados para brindar apoyo seria la ruta mas inteligente.\n\nGracias,\nGloria Mesa\n\nSupervisor de contrato privado\nBlacJac Security, "Proteccion proporcionada"\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x3, Hostiles x8, Private Security x4, Sentries x4
blacjac_UGF_defend_VH_title_001=Defender el sitio de amenazas peligrosas <EM4>[500 Rep]</EM4>
blacjac_UGF_defend_desc_001=ATENCIÓN: Operadores Mercenarios Verificados\n\nNos hemos enterado de que algunos matones locales han estado haciendo amenazas contra ~mission(Location|Address). BlacJac quiere que reúnas un equipo y protejas el sitio de estas amenazas hostiles.\n\nY por mucho que todos amemos los créditos, no recomiendo intentar hacer esto en solitario. Contratar un equipo para que te acompañe sería beneficioso para tu éxito.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Proporcionada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x8, Private Security x4, Sentries x8
blacjac_UGF_defend_title_001=Defender el sitio de amenazas <EM4>[500 Rep]</EM4>
blacjac_UGF_destroy_E_desc_001=ATENCIÓN: Operadores Mercenarios Verificados\n\nParece que hay un nuevo operador que está probando suerte en la fabricación de drogas en ~mission(Location|Address), pero el producto que están produciendo es extremadamente tóxico. \n\nEstamos evaluando cómo manejar los arrestos, pero lo importante es evitar que más de su suministro se distribuya. Necesito que vayas allí y destruyas las drogas que tienen almacenadas en el lugar.\n\nHay una buena posibilidad de que la instalación no esté abandonada, así que podrías encontrarte con estos matones cuando vayas allí, así que prepárate para una pelea. Pero si sus habilidades con las armas son algo parecido a su química, probablemente no será gran cosa. \n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Proporcionada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x8\n<EM4>Friendlies:</EM4> Civilians x4
blacjac_UGF_destroy_E_title_001=Eliminar Reserva de Drogas <EM4>[500 Rep]</EM4>
blacjac_UGF_destroy_H_desc_001=ATENCIÓN: Operadores Mercenarios Verificados\n\nUnos químicos emprendedores han creado un nuevo producto que es el doble de potente y el doble de mortal que el producto normal. Pudimos rastrear algunas muestras hasta la fuente en ~mission(Location|Address). \n\nBlacJac quiere que vayas cuanto antes para destruir todo el lote antes de que pueda dañar a más personas. Podemos preocuparnos por hacer arrestos más tarde.\n\nSegún todo lo que sabemos sobre este grupo, deberías esperar encontrar una resistencia fuerte al intentar limpiar el alijo.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Proporcionada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
blacjac_UGF_destroy_H_title_001=Destruir Drogas Peligrosas <EM4>[500 Rep]</EM4>
blacjac_UGF_destroy_desc_001=ATENCIÓN: Operadores Mercenarios Verificados\n\nNos enteramos de que un sindicato contaminó el paquete de drogas de un rival y está causando caos en las calles. La policía científica identificó la fuente, una instalación de producción en ~mission(Location|Address). Parece que los fabricantes de drogas ni siquiera saben que tienen un cultivo envenenado entre manos.\n\nEstamos evaluando cómo manejar los arrestos, pero lo importante es sacar esta porquería de las calles ahora. Necesito que vayas allí y destruyas las drogas que tienen almacenadas en el lugar.\n\nNo estarán contentos al respecto, así que probablemente tendrás un enfrentamiento entre tus manos, pero lo importante es limpiar el producto.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Proporcionada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Friendlies:</EM4> Civilians x4
blacjac_UGF_destroy_title_001=Eliminar Drogas del Área <EM4>[500 Rep]</EM4>
blacjac_UGF_eliminateall_allies_desc_001=ATENCIÓN: Operadores de Mercenarios Verificados\n\nHemos recibido información del equipo de seguridad en ~mission(Location|Address) de que algunos criminales locales han estado lanzando ataques. BlacJac solicita que vayas al lugar y ayudes a protegerlo de amenazas hostiles.\n\nAsegúrate de controlar tu fuego allí abajo. No quiero saber de incidentes fuego amigo.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
blacjac_UGF_eliminateall_allies_desc_intro=ATENCIÓN: Operadores de Mercenarios Verificados\n\nBlacJac busca ampliar nuestra lista de profesionales de seguridad. Para evaluar si eres adecuado, nos gustaría que brindes apoyo en ~mission(Location|Address), ya que han tenido problemas con algunos hostiles en la zona.\n\nSi puedes ayudar a proteger el sitio y eliminar la amenaza, podremos ofrecerte más trabajo de seguridad.\n\nTen en cuenta que no se tolerarán incidentes de fuego amigo.\n\nBuena suerte,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
blacjac_UGF_eliminateall_allies_desc_rehire=ATENCIÓN: Ex Operador de Mercenarios\n\nSé que BlacJac dejó de ofrecer trabajo de seguridad, pero debido a cambios de personal se decidió ofrecerte otra oportunidad.\n\nHemos recibido información de que ~mission(Location|Address) necesita ayuda para lidiar con una pandilla de forajidos locales. BlacJac quiere que vayas al lugar y ayudes a eliminar esta amenaza.\n\nY como ya estás en terreno peligroso, no quiero enterarme de que estuviste involucrado en incidentes de fuego amigo.\n\nSi puedes llevar a cabo esta operación, podemos considerar tu reincorporación.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
blacjac_UGF_eliminateall_allies_title_001=Proteger el sitio <EM4>[500 Rep]</EM4>
blacjac_UGF_eliminateall_allies_title_intro=Contrato de prueba: Proteger el sitio <EM4>[500 Rep]</EM4>
blacjac_UGF_eliminateall_allies_title_rehire=Contrato de prueba: Proteger el sitio <EM4>[500 Rep]</EM4>
blacjac_UGF_eliminateall_desc_001=ATENCIÓN: Operadores de Mercenarios Verificados\n\nHemos recibido información de que ~mission(Location|Address) está siendo utilizada por algunos criminales locales como base de operaciones. BlacJac necesita que el sitio sea barrido y que se despeje cualquier habitante de allí. \n\nEstás autorizado para usar fuerza letal si es necesario.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x15
blacjac_UGF_eliminateall_nocivs_desc_001=ATENCIÓN: Operadores de Mercenarios Verificados\n\nHemos recibido información de que ~mission(Location|Address) está siendo utilizada por algunos criminales locales como base de operaciones. BlacJac solicita que barras el sitio y elimines a cualquier hostil. \n\nNuestros informes preliminares muestran que hay una buena probabilidad de que la banda tenga civiles trabajando para ellos en el lugar. No estamos buscando hacer titulares aquí, así que trata de recordar que solo estás autorizado para enfrentarte a hostiles confirmados. \n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13\n<EM4>Friendlies:</EM4> Civilians x4
blacjac_UGF_eliminateall_title_001=Despejar el Sitio <EM4>[500 Rep]</EM4>
blacjac_bounty_desc_ERT=ATENCIÓN: Cazarrecompensas\n\nTal vez hayas oído hablar de ~mission(TargetName) antes. Es un objetivo de alto riesgo y ha estado en los titulares recientemente. La esperanza es que puedas armar un equipo de respuesta y ayudar a BlacJac a eliminarlos de una vez por todas. Nuestra información más reciente muestra que su nave subcapital y sus escoltas fuertemente armadas vuelan sobre ~mission(Location|Address).\n \nRecomendaría asegurarte de tener una huella actualizada antes de salir. Solo por si acaso. \n\nBuena suerte,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
blacjac_bounty_desc_HRT=ATENCIÓN: Cazarrecompensas\n\nTu próxima recompensa, ~mission(TargetName), definitivamente se considera un objetivo de alto riesgo por una buena razón. Se sabe que viajan con un gran poder de fuego y están escoltados por suficiente protección como para hacer que cualquiera se lo piense dos veces antes de pelear.\n\nLas fuentes indican que ~mission(TargetName|Last) se está escondiendo en ~mission(Location|Address). Cuando salgas a rastrearlos, asegúrate de estar preparado. Incluso podrías pensar en llevar algo de respaldo contigo.  \n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
blacjac_bounty_desc_LRT=ATENCIÓN: Cazarrecompensas\n\nSe ha emitido una recompensa por un objetivo de bajo riesgo llamado ~mission(TargetName). El objetivo en sí no es motivo de preocupación, pero parece que suelen volar en grupo, así que hay una alta probabilidad de que tengan algunos amigos cuando los encuentres.\n\nHablando de eso, comenzaría la búsqueda en ~mission(Location|Address) ya que tenemos informes de que fueron vistos en la zona.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
blacjac_bounty_desc_MRT=ATENCIÓN: Cazarrecompensas\n\nNecesitamos que resuelvas ~mission(TargetName), una recompensa de riesgo moderado vista por última vez en ~mission(Location|Address) pilotando una nave multitripulación pequeña.\n\nNo pudimos obtener detalles sobre exactamente lo que estaban pilotando, pero parece que tenían algunas otras naves con ellos. Prepárate para bastante resistencia cuando vayas.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
blacjac_bounty_desc_VHRT=ATENCIÓN: Cazarrecompensas\n\nBlacJac acaba de recibir información de que se avistó a un objetivo de muy alto riesgo, ~mission(TargetName), moviéndose por los carriles de vuelo en ~mission(Location|Address) pilotando una nave formidable con una escolta pesada. \n\nQueremos cerrar esta recompensa antes de que cometan más crímenes. Reúne los recursos o el apoyo que necesites y sal tan pronto como puedas.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
blacjac_bounty_desc_VLRT=ATENCIÓN: Cazarrecompensas\n\nTenemos un objetivo de muy bajo riesgo que necesito que te ocupes: ~mission(TargetName).\n\nSu última ubicación conocida fue ~mission(Location|Address).\n\nEsta es una recompensa de bajo riesgo, así que espero que puedas resolverla bastante rápido. Suelen volar una nave pequeña y no tienen muchos conocidos conocidos. No se pone mucho más sencillo que eso.\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x1, Targets x1
blacjac_bounty_desc_intro=ATENCIÓN: Cazarrecompensas\n\nNo estoy seguro de si estás interesado, pero BlacJac está buscando ampliar nuestra lista de cazarrecompensas. Tenemos más trabajos de los que nuestros contratistas actuales pueden manejar, así que espero que puedas ayudar a cubrir parte de la carga.\n\nTus calificaciones lucen bien sobre el papel, pero antes de hacer algo oficial, BlacJac necesita ver cómo te desempeñas en el campo de primera mano. Incluso tenemos un caso de prueba preparado; queremos que resuelvas a ~mission(TargetName). Fueron vistos por última vez en ~mission(Location|Address). Debería ser una recompensa bastante sencilla sin demasiada resistencia. La cosa perfecta para afilar tus habilidades.\n\nBuena suerte,\nGloria Mesa\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
blacjac_bounty_desc_rehire=ATENCIÓN: Antiguo Cazarrecompensas de BlacJac\n\nSé que tu última incursión cazando recompensas para BlacJac no salió bien, pero una carga de casos en aumento significa que tienes la suerte de tener otra oportunidad.\n\nSi puedes completar la recompensa de ~mission(TargetName) en ~mission(Location|Address), podemos ver la posibilidad de reincorporarte.\n\nGracias,\nGloria Mesa\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
blacjac_bounty_fps_UGF_desc_001=ATENCIÓN: Cazarrecompensas\n\nTenemos una recompensa que debe ser cobrada sobre ~mission(TargetName). El bastardo se está escondiendo en ~mission(Location|Address) con un montón de escoria, así que ten cuidado al entrar.\n\nGracias,\nGloria Mesa\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13, Targets x1
blacjac_bounty_fps_UGF_nocivs_desc_001=ATENCIÓN: Cazarrecompensas\n\nNecesito que captures a un fugitivo llamado ~mission(TargetName) en ~mission(Location|Address). Aunque puede haber otros cómplices criminales en la escena, quiero que tengas cuidado con cualquier civil o trabajador que pueda estar allí.\n\nYa tengo suficiente con lo que lidiar, así que no necesito explicar por qué un contratista disparó a un montón de civiles.\n\nGracias,\nGloria Mesa\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
blacjac_bounty_fps_desc_001=ATENCIÓN: Cazarrecompensas\n\nBlacJac tiene una recompensa que debe ser cobrada. El delincuente se hace llamar: ~mission(TargetName). \n\nHemos logrado rastrearlos hasta ~mission(Location|Address), pero no tenemos una evaluación completa de las condiciones en el terreno, así que ten precaución al entrar en el lugar.\n\nGracias,\nGloria Mesa\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
blacjac_bounty_fps_desc_first=ATENCIÓN: Cazarrecompensas\n\nTengo más recompensas que cazarrecompensas en este momento, así que estoy buscando ampliar nuestro grupo. \n\nSi haces un buen trabajo en esta primera misión, habrá más contratos por venir. \n\nVeamos cómo te va tratando de lidiar con la recompensa de ~mission(TargetName). Se cree que se están escondiendo en ~mission(Location|Address). \n\nGracias,\nGloria Mesa\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13, Targets x1
blacjac_bounty_fps_desc_rehire=ATENCIÓN: Antiguo Cazador de Recompensas de BlacJac\n\nSé que BlacJac dejó de darte contratos de recompensas, pero los tiempos cambian y aquí estamos dándote otra oportunidad.\n\nSi puedes completar la recompensa de ~mission(TargetName) en ~mission(Location|Address), podemos considerar reinstalarte.\n\nGracias,\nGloria Mesa\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13, Targets x1
