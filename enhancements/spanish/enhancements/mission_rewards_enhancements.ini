blacjac_recoverspace_desc_intro=ATENCIÓN: Mercenarios / Cazarrecompensas con Experiencia en Manejo de Carga\n\nAcabamos de recibir información de que un ladrón llamado ~mission(TargetName) está volando con su último botín a bordo de su nave.\n\nNormalmente, tendríamos a alguien arrestando al bastardo y ya estaría hecho, pero en este momento lo más importante es recuperar los bienes robados. \n\nSi esto suena a lo tuyo, estarás autorizado para rastrear a ~mission(TargetName|Last), asegurar el ~mission(Item) robado como puedas y entregarlo en ~mission(Destination|Address). ~mission(Contractor|RecoverSpaceTimed)~mission(Danger)\n\n\nGracias,\nGloria Mesa\n\nSupervisora de Contratos Privados\nBlacJac Security, "Protección Garantizada"\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique
