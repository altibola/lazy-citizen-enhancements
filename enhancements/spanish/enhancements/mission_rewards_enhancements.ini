headhunters_eliminateall_outpost_desc_01=Algunos idiotas se niegan a pagarnos lo que nos deben. El problema es que estos idiotas están presumiendo al respecto. Si lo hubieran mantenido en secreto, podríamos haberlo manejado de manera más quirúrgica, pero ahora necesitamos enviar un mensaje.\n\nLos tontos están operando desde ~mission(location|address). Queremos que todos se vayan. Hazlo lo más ruidoso posible. Enviaremos tu pago una vez que todos estén atendidos.\n\n- Fin de la transmisión out.\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- DustUp Arms Tactical\n- DustUp Core Tactical\n- DustUp Helmet Tactical\n- DustUp Legs Tactical\n- Yubarev "Igniter" Pistol\n- Yubarev "Mirage" Pistol\n- Yubarev Pistol\n- Yubarev Pistol Battery (10 cap)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 3/7 | Complexity 3/7 | Risk 3/7 | Knowledge 2/7\n<EM4>Hostiles:</EM4> CQC x3, Snipers x2, Soldiers x3, Technicians x2\n<EM4>Neutral:</EM4> +25 Rep\n<EM4>Sr. Contractor:</EM4> +300 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
