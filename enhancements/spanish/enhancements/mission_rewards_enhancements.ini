cfp_defend-criminals_desc_001=El lugar en ~mission(location|address) está bajo amenaza de ataque por parte de forajidos y han pedido ayuda. Necesitamos a alguien que los proteja y aleje a los forajidos. \n\nAsegúrate de mantenerte cerca después de su ataque inicial. Con demasiada frecuencia, los forajidos ganan peleas simplemente enviando más cuerpos de los que cualquiera puede defender razonablemente, así que asegúrate de repeler cualquier refuerzo antes de abandonar el área. \n\nLima Endicott\nDespachador Principal\nCiudadanos por Pyro\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n<EM4>[Pyro]</EM4>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n<EM4>[Pyro RegionB]</EM4>\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain\n<EM4>Difficulty (1-7):</EM4> Combat 4/7 | Complexity 4/7 | Risk 3/7 | Knowledge 3/7\n<EM4>Hostiles:</EM4> CQC x6, Juggernauts x2, Soldiers x10, Technicians x4\n<EM4>Neutral:</EM4> +75 Rep\n<EM4>Contractor:</EM4> +200 Rep\n<EM4>Blueprint Reward:</EM4> Guaranteed
cfp_defend-criminals_title_001=Defiende ~mission(Location) de Forajidos <EM4>[BP]</EM4> <EM4>[75–200 Rep (Contractor)]</EM4>
cfp_defend-xenothreat_desc_001=Hemos sabido que XenoThreat está a punto de lanzar un ataque en ~mission(location|address). Si tienen éxito, se espera que el número de víctimas sea alto. Espero que con tu ayuda en su defensa, podamos asegurarnos de que eso no suceda.\n \nSabemos por encuentros pasados que XenoThreat envía varios grupos de asalto para llevar a cabo sus ataques, así que asegúrate de no abandonar el puesto hasta que hayas repelido todos los refuerzos. \n\nLima Endicott\nDespachador Principal\nCiudadanos por Pyro\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Artimex Arms (Modified)\n- Artimex Core (Modified)\n- Karna "Fate" Rifle\n- Karna Rifle Battery (35 cap)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain\n<EM4>Difficulty (1-7):</EM4> Combat 4/7 | Complexity 4/7 | Risk 5/7 | Knowledge 4/7\n<EM4>Hostiles:</EM4> CQC x9, Soldiers x7, Technicians x9\n<EM4>Sr. Contractor:</EM4> +300 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
cfp_defend-xenothreat_desc_002=¡Urgente!\n\nXenoThreat está apuntando a ~mission(location|address) para enviar un mensaje a otros colonos sobre lo que sucede si aceptan nuestro apoyo. \n\nSi puedes defenderlos, estoy seguro de que enviarán fuerzas adicionales, así que tendrás que resistir múltiples asaltos. Dado que XenoThreat tiene muchos recursos a su disposición, deberías considerar reclutar a otros para que te ayuden a mantener a todos a salvo.\n\nTodos confiamos en ti.\n\nLima Endicott\nDespachador Principal\nCiudadanos por Pyro\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain\n<EM4>Difficulty (1-7):</EM4> Combat 5/7 | Complexity 4/7 | Risk 4/7 | Knowledge 4/7\n<EM4>Hostiles:</EM4> CQC x2, Juggernauts x1, Snipers x2, Soldiers x4, Technicians x4\n<EM4>Sr. Contractor:</EM4> +200 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
cfp_defend-xenothreat_desc_003=¡Urgente!\n\nXenoThreat se está movilizando para una incursión masiva para borrar ~mission(location|address) del mapa. Eres su única esperanza de resistir este asalto y protegerlos de la crueldad de XenoThreat.\n\nSé que te estoy pidiendo que te pongas en la línea de fuego, pero Pyro no cambiará a menos que personas como tú sean lo suficientemente valientes como para enfrentarse a estos peligros. Ninguna cantidad de créditos podría igualar cuánto bien estarías haciendo al intervenir.\n\nSi estás dispuesto y capacitado para asumir esta misión, asegúrate de llevar contigo algunos aliados. XenoThreat seguramente enviará refuerzos más fuertes una vez que se den cuenta de que están sufriendo pérdidas.\n\nCreemos en ti.\n\nLima Endicott\nDespachador Principal\nCiudadanos por Pyro\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Artimex Arms\n- Artimex Core\n- Artimex Helmet\n- Artimex Legs\n- Karna Rifle\n- Karna Rifle Battery (35 cap)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain\n<EM4>Difficulty (1-7):</EM4> Combat 6/7 | Complexity 6/7 | Risk 5/7 | Knowledge 5/7\n<EM4>Hostiles:</EM4> CQC x4, Juggernauts x2, Snipers x3, Soldiers x8, Technicians x4\n<EM4>Veteran Contractor:</EM4> +300 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
