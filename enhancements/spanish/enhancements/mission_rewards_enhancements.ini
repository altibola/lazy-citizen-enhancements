cfp_delivery_desc_001=Hola, \n\nNos enteramos de que la gente está esperando un envío de suministros importante que no ha llegado. Resulta que accidentalmente fue llevado al lugar equivocado. Mientras investigamos cómo sucedió el error, necesitamos a alguien que vaya a ~mission(Pickup1|Address) para recoger el paquete #~mission(item1|serialnumber) y entregarlo en la ubicación correcta en ~mission(Dropoff1|Address). \n\n¿Estás disponible para la entrega?\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_delivery_desc_002=Hey, \n\nNecesito que entregues dos paquetes. El paquete #~mission(item1|serialnumber) debe recogerse en ~mission(Pickup1|Address) y llevarse a ~mission(Dropoff1|Address), y el paquete #~mission(item2|serialnumber) va desde ~mission(Pickup2|Address) hasta ~mission(Dropoff2|Address). Debería ser una forma fácil de ganar algunos créditos. \n\nVuela seguro, \n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_delivery_desc_003=Hey, \n\nDe vez en cuando, a Citizens for Pyro le gusta sorprender a los miembros estacionados en nuestras bases con un pequeño regalo para mantener alta la moral. Tenemos el próximo lote listo, pero necesitamos a alguien que haga las entregas por nosotros. ¿Alguna interés en difundir un poco de alegría? \n\nAquí está la lista de entregas. Siéntete libre de hacerlas en cualquier orden. \n\n- El paquete #~mission(item1|serialnumber) va desde ~mission(Pickup1|Address) hasta ~mission(Dropoff1|Address).\n- El paquete #~mission(item2|serialnumber) va desde ~mission(Pickup2|Address) hasta ~mission(Dropoff2|Address).\n- El paquete #~mission(item3|serialnumber) va desde ~mission(Pickup3|Address) hasta ~mission(Dropoff3|Address).  \n\nGracias de antemano,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_delivery_desc_004=Hola,\n\nSi queremos que personas comunes se muden a Pyro, necesitamos mostrarles que los servicios básicos son fiables. Hacer que cosas como las entregas sean grantizadas para que la gente no lo piense dos veces es exactamente para lo que están aquí los Ciudadanos de Pyro. ¿Te gustaría ayudarnos con esto? \n\nTenemos varias entregas listas. Hazlas en el orden que desees. Lo único que importa es que lleguen allí. \n\n- El paquete #~mission(item1|serialnumber) va desde ~mission(Pickup1|Address) hasta ~mission(Dropoff1|Address).\n- El paquete #~mission(item2|serialnumber) va desde ~mission(Pickup2|Address) hasta ~mission(Dropoff2|Address).\n- El paquete #~mission(item3|serialnumber) va desde ~mission(Pickup3|Address) hasta ~mission(Dropoff3|Address).\n- El paquete #~mission(item4|serialnumber) va desde ~mission(Pickup4|Address) hasta ~mission(Dropoff4|Address).\n\n\nVuela Seguro,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
cfp_delivery_desc_005=Hey,\n\nParece que hubo un error técnico con nuestro sistema que marcó ciertos paquetes como entregados cuando en realidad no lo estaban. Todavía estamos desenredando el lío, pero hemos ordenado algunos y están listos para ser enviados. \n\n- El paquete #~mission(item1|serialnumber) va desde ~mission(Pickup1|Address) hasta ~mission(Dropoff1|Address).\n- El paquete #~mission(item2|serialnumber) va desde ~mission(Pickup2|Address) hasta ~mission(Dropoff2|Address).\n- El paquete #~mission(item3|serialnumber) va desde ~mission(Pickup3|Address) hasta ~mission(Dropoff3|Address).\n- El paquete #~mission(item4|serialnumber) va desde ~mission(Pickup4|Address) hasta ~mission(Dropoff4|Address).\n- El paquete #~mission(item5|serialnumber) va desde ~mission(Pickup5|Address) hasta ~mission(Dropoff5|Address).\n \nSería bueno rectificar esto de inmediato si estás disponible. \n\nMejor,\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
