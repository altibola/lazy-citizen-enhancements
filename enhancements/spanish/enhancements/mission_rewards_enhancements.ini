RedWind_Delivery_Illegal_Desc_01=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nTengo otro trabajo especial en el que podría necesitar tu ayuda. Debería ser un recorrido rápido.\n\nPAQUETE PARA RECOGER\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n\nUBICACIÓN DE ENTREGA\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\nY recuerda no molestar a los clientes ni a ninguno de sus invitados. La profesionalidad es clave aquí.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_Delivery_Illegal_Desc_02=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nTengo otro trabajo especial en el que necesito a un piloto en el que pueda confiar.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n\nEste es un cliente muy importante para nosotros, así que trátalos a ellos y a sus paquetes con un respeto adicional.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_Delivery_Illegal_Desc_03=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nObtuve otro trabajo especial de uno de nuestros clientes más privados.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete n.°~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete n.°~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n\nRecuerda tratar de mantener un perfil bajo. Lo último que este cliente quiere es llamar la atención sobre su negocio, y lo último que quiero es un cliente insatisfecho. Especialmente en este caso.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_Delivery_Illegal_Desc_04=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nTengo otra carrera especial. Pensé que serías el piloto adecuado para encargarte de ella por mí.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete n.°~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete n.°~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete n.°~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete n.°~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n\nUna vez más, sé inteligente y mantén el silencio sobre cualquier cosa que puedas ver u oír mientras estés fuera. Recuerda, solo estás allí por los paquetes.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_Delivery_Illegal_Desc_05=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nTengo otro trabajo especial en el que podría necesitar tu ayuda. Este es un poco más complicado ya que hay unos cuantos paquetes más para llevar un registro. Aquí tienes la lista:\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete n.°~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete n.°~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n     · Paquete n.°~mission(item5|serialnumber) desde ~mission(Pickup5|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete n.°~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete n.°~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n     · Paquete n.°~mission(item5|serialnumber) a ~mission(Dropoff5|Address)\n\nAsegúrate de que los paquetes correctos lleguen a donde deben. Realmente no querrás tener que explicar un error a estos clientes en particular.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_Delivery_Illegal_Desc_Intro=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nSé que has hecho un trabajo sólido para nosotros en el pasado, así que pensé en ver si estabas interesado en encargarte de un recorrido un poco especial para nosotros que está un poco más lejos en el sistema de lo que has estado haciendo hasta ahora.\n\nEn pocas palabras, necesitamos un piloto dispuesto a mantener la cabeza baja, centrarse en entregar los paquetes y, lo más importante, no hacer muchas preguntas.\n\nMira, para una empresa más pequeña como la nuestra, mantenerse por delante de la competencia significa que necesitamos ofrecer a nuestros clientes algo que no puedan obtener en otro lugar: discreción. En Red Wind, siempre que tengas los créditos, llevaremos lo que sea a donde sea. ¿Entiendes?\n\nSi eso te suena bien, veamos cómo te va en este recorrido -\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete n.°~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete n.°~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n\nUn último consejo, probablemente sería bueno evitar cualquier retraso innecesario una vez que tengas los paquetes a bordo, como ser registrado por la policía local.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500
