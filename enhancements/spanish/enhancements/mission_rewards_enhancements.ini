mgClovus_opensalvage_desc_001=La fortuna nos ha sonreído una vez más. Acabo de enterarme de una batalla cerca de ~mission(Location) que acaba de ocurrir lejos de las miradas entrometidas de cualquier antena de comunicación, y los refuerzos de cualquiera de las fuerzas involucradas aún no han sido enviados. Esto significa que hay una ventana de oportunidad para que un alma emprendedora limpie el cementerio de naves.\n \nMe gustaría extender esta oportunidad a todos mis contactos de confianza. Todas las partes interesadas pueden tener la ubicación... por el precio correcto. Las coordenadas se proporcionarán una vez que aceptes el contrato y permanecerán disponibles hasta que decidas cancelarlo.\n\nPor supuesto, la velocidad será esencial ya que no solo enfrentarás la posible competencia de otros recuperadores, sino también la posibilidad inminente de que lleguen refuerzos para inspeccionar el campo de batalla. \n\nSi aún dudas, simplemente recuerda, la fortuna favorece a los valientes.\n\n-cd\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50\n<EM4>Friendlies:</EM4> Salvageable Ships x8
