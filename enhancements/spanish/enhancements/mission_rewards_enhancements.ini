northrock_groupbounty_desc_intro=Hola, \n\n Espero que todo vaya bien. Puede que ya me haya comunicado, pero queria estar seguro y presentarme. Soy oficial de logistica de Northrock Service Group, la principal empresa de seguridad de propiedad independiente que opera actualmente en el sistema Stanton y brinda una variedad de servicios a los principales organismos gubernamentales, asi como a diversas empresas privadas. La razon por la que me comúnico con usted es porque creemos que alguien con sus habilidades podria ser de gran ayuda para nuestros clientes. \n\nNo solo eso, sino que creo que seriamos una buena opción para ti. Nuestros contratistas tradicionalmente obtienen una remuneracion mas alta que muchos de nuestros competidores en el sistema, y muchos de ellos me dicen que realmente disfrutan que les asignen el trabajo desafiante e interesante que ofrecemos. \n\nAhora, Northrock se mantiene con estandares tan altos que antes de que podamos hacer algo oficial, debera alcanzar el estado de contratista aprobado completando un contrato pro temporal. \n\nEsperaba que pudieras capturar a varios miembros buscados de una banda de forajidos: ~mission(Target1), ~mission(Target2), y ~mission(Target3).\n\nHaga esto y veremos como conseguirle mas trabajo.\n\nEsperamos tener noticias suyas pronto, \n\nBraden Corchado\nOficial de logistica - Sucursal de Stanton\nNorthrock Service Group\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x15, Targets x6
northrock_groupbounty_desc_rehire=Hola, \n\n He estado pensando en todo lo que sucedio y decidi hablar con la gerencia. Han acordado darle otra oportunidad, pero solo si completa con exito un contrato para nosotros. \n\n Podemos considerar restablecer su situacion laboral si puede traer a este trio criminal: \n ~mission(Target1)\n ~mission(Target2)\n ~mission(Target3)\n\nEllos evadieron al ultimo Asociado que los persiguio, por lo que traerlos a todos definitivamente le otorgara algunos puntos.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x15, Targets x3
