Covalex_courier_fromdc_med_desc_001=Hola,\n\nTenemos un pedido de tamaño decente listo para recoger en el ~mission(Pickup1) en ~mission(Pickup1|Dirección). ¡Asegúrate de tener una nave lo suficientemente grande para cargar todo! \n\nPAQUETES PARA RECOGER \n     · Todos los paquetes en el ~mission(Pickup1) en ~mission(Pickup1|Dirección)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|númerodeserie) a ~mission(Dropoff1|Dirección)\n     · Paquete #~mission(item2|númerodeserie) a ~mission(Dropoff2|Dirección)\n     · Paquete #~mission(item3|númerodeserie) a ~mission(Dropoff3|Dirección)\n     · Paquete #~mission(item4|númerodeserie) a ~mission(Dropoff4|Dirección)\n     · Paquete #~mission(item5|númerodeserie) a ~mission(Dropoff5|Dirección)\n     · Paquete #~mission(item6|númerodeserie) a ~mission(Dropoff5|Dirección)\n     · Paquete #~mission(item7|númerodeserie) a ~mission(Dropoff6|Dirección)\n     · Paquete #~mission(item8|númerodeserie) a ~mission(Dropoff6|Dirección)\n     · Paquete #~mission(item9|númerodeserie) a ~mission(Dropoff7|Dirección)\n     · Paquete #~mission(item10|númerodeserie) a ~mission(Dropoff7|Dirección)\n\nQue tengas un gran día,\n\nChase Hewitt\nCoordinador Jr. de Logística\nEnvíos Covalex  \n'Cualquier cosa que necesites, en cualquier lugar que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según se detalla en nuestra 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Envíos Covalex no se hace responsable de los daños que ocurran durante la operación como contratista independiente.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
Covalex_courier_fromdc_small_desc_001=¡Hola!\n\nRecibimos una solicitud para transferir algunos paquetes del ~mission(Pickup1) en ~mission(Pickup1|Dirección). \n\nPensé que te gustaría este trabajo ya que es bueno tener una tarea sencilla que hacer de vez en cuando.\n\nPAQUETES PARA RECOGER \n     · Todos los paquetes en el ~mission(Pickup1) en ~mission(Pickup1|Dirección)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|númerodeserie) a ~mission(Dropoff1|Dirección)\n     · Paquete #~mission(item2|númerodeserie) a ~mission(Dropoff2|Dirección)\n     · Paquete #~mission(item3|númerodeserie) a ~mission(Dropoff3|Dirección)\n     · Paquete #~mission(item4|númerodeserie) a ~mission(Dropoff4|Dirección)\n     · Paquete #~mission(item5|númerodeserie) a ~mission(Dropoff5|Dirección)\n\nHablamos pronto,\n\nChase Hewitt\nCoordinador Jr. de Logística\nEnvíos Covalex  \n'Cualquier cosa que necesites, en cualquier lugar que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según se detalla en nuestra 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Envíos Covalex no se hace responsable de los daños que ocurran durante la operación como contratista independiente.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
