mg_miles_capturegang_complete_desc=\nTodos los miembros de alto rango de la pandilla de Arlington están ahora tras las rejas y su banda criminal esta fuera de servicio. \n\nEste fue un collar bastante impresionante. Buen trabajo.\n\n-Miles\n\nMiles Eckhart\nFundador y director ejecutivo\nEckhart Security, LLC.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
mg_miles_capturegang_desc_001=ECKHART SECURITY, LLC.\nCONTRATOS Y GESTIÓN\n\nTIPO DE CONTRATO: Garantia de grupo\nESTADO DEL CONTRATISTA: Independiente\ncódigo de aprobacion: =~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\n*********\n__Información de antecedentes__\nSe ha emitido una orden de arresto grupal contra la famosa banda de secuestro de naves de Arlington despues de su reciente y descarado intento de robo de un Idris en un astillero de reparaciones. Mientras se detuvo el atraco, los miembros del grupo se dispersaron hacia el negro. A Eckhart Security se le ha concedido la recompensa por la captura inmediata de todos los pandilleros de alto nivel: Maltrox Arlington, Kass Dent, Nicks Cantwell, Sam 'Weepy' Arlington, Oslo Arlington y Les Arlington.\n******** *\n\nUna comunicación anonima nos informo que Les Arlington, hijo del lider de la pandilla Maltrox Arlington, habia sido visto recogiendo una entrega en un centro de transferencia de Covalex. Le proporcionaremos las coordenadas de donde creemos que se encuentra su paradero actual. \n\nLes es un piloto experimentado que ha estado volando durante casi tanto tiempo como han estado caminando y generalmente sirve como piloto de fuga de la pandilla. Puede que valga la pena traer naves de apoyo adicionales para impedir cualquier intento de fuga. \n\n Estas autorizado a utilizar cualquier fuerza que sea necesaria para neutralizar el objetivo. \n\nEl pago se realizara al finalizar exitosamente el contrato.\n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, de propiedad exclusiva, privilegiada y/o privada. La información esta destinada a ser utilizada por la persona o entidad designada anteriormente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500
mg_miles_capturegang_desc_002=ECKHART SECURITY, LLC.\nCONTRATOS Y GESTIÓN\n\nTIPO DE CONTRATO: Garantia de grupo\nESTADO DEL CONTRATISTA: Independiente\ncódigo de aprobacion: =~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\n*********\n__Información de antecedentes__\nSe ha emitido una orden de arresto grupal contra la famosa banda de secuestro de naves de Arlington despues de su reciente y descarado intento de robo de un Idris en un astillero de reparaciones. Mientras se detuvo el atraco, los miembros del grupo se dispersaron hacia el negro. A Eckhart Security se le ha concedido la recompensa por la captura inmediata de todos los pandilleros de alto nivel: Maltrox Arlington, Kass Dent, Nicks Cantwell, Sam 'Weepy' Arlington, Oslo Arlington y Les Arlington.\n******** *\n\nHemos recibido noticias de que Nicks Cantwell, conocido desde hace mucho tiempo y confiado en Maltrox Arlington, fue visto tratando de comprar un laser de minería de alta densidad, del tipo utilizado frecuentemente en intentos anteriores de secuestro de naves para romper estrategicamente los cascos. Hemos proporcionado coordenadas de la última ubicación conocida de Nicks. \n\nNicks es un experto en municiónes de gran prestigio entre los circulos criminales y, a menudo, deja un rastro de destruccion a su paso. Se recomienda llevar un mayor nivel de potencia de fuego a este encuentro. \n\n Estas autorizado a utilizar cualquier fuerza que sea necesaria para neutralizar al objetivo. \n\nEl pago se realizara al finalizar exitosamente el contrato.\n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, de propiedad exclusiva, privilegiada y/o privada. La información esta destinada a ser utilizada por la persona o entidad designada anteriormente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x4, Targets x1
mg_miles_capturegang_desc_003=ECKHART SECURITY, LLC.\nCONTRATOS Y GESTIÓN\n\nTIPO DE CONTRATO: Garantia de grupo\nESTADO DEL CONTRATISTA: Independiente\ncódigo de aprobacion: =~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\n*********\n__Información de antecedentes__\nSe ha emitido una orden de arresto grupal contra la famosa banda de secuestro de naves de Arlington despues de su reciente y descarado intento de robo de un Idris en un astillero de reparaciones. Mientras se detuvo el atraco, los miembros del grupo se dispersaron hacia el negro. A Eckhart Security se le ha concedido la recompensa por la captura inmediata de todos los pandilleros de alto nivel: Maltrox Arlington, Kass Dent, Nicks Cantwell, Sam 'Weepy' Arlington, Oslo Arlington y Les Arlington.\n******** *\n\nSam 'Weepy' Arlington fue señalado por sistemas de seguridad automatizados en un R&R despues de estar involucrado en una pelea de borrachos. Weepy pudo despejar la estación antes de que llegaran los equipos de respuesta, pero pudimos rastrearlo hasta donde actualmente creemos que esta escondido. \n\nWeepy es el tio y principal ejecutor del lider de la pandilla Maltrox Arlington. Sus problemas de ira combinados con un largo historial de abuso de sustancias lo convierten en un verdadero comodin. Espere que oponga una resistencia significativa cuando usted y sus fuerzas reunidas lo acorralen. \n\n Esta autorizado a usar cualquier fuerza que sea necesaria para neutralizar al objetivo. \n\nEl pago se realizara al finalizar exitosamente el contrato.\n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, de propiedad exclusiva, privilegiada y/o privada. La información esta destinada a ser utilizada por la persona o entidad designada anteriormente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x2, Targets x1
mg_miles_capturegang_desc_004=ECKHART SECURITY, LLC.\nCONTRATOS Y GESTIÓN\n\nTIPO DE CONTRATO: Garantia de grupo\nESTADO DEL CONTRATISTA: Independiente\ncódigo de aprobacion: =~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\n*********\n__Información de antecedentes__\nSe ha emitido una orden de arresto grupal contra la famosa banda de secuestro de naves de Arlington despues de su reciente y descarado intento de robo de un Idris en un astillero de reparaciones. Mientras se detuvo el atraco, los miembros del grupo se dispersaron hacia el negro. A Eckhart Security se le ha concedido la recompensa por la captura inmediata de todos los pandilleros de alto nivel: Maltrox Arlington, Kass Dent, Nicks Cantwell, Sam 'Weepy' Arlington, Oslo Arlington y Les Arlington.\n******** *\n\nRecientemente se accedio ilegalmente a una terminal de seguridad utilizando una clave criptografica personalizada unica que habia sido utilizada en un atraco el año pasado por un tal Oslo Arlington, el hermano menor del lider de la pandilla Maltrox Arlington. Si bien no podemos confirmar con seguridad si la terminal fue pirateada por Oslo o no, creemos que vale la pena investigar. \n\n Extremadamente inteligente, conocedor de la tecnologia y un estratega de renombre, Oslo ha demostrado ser difícil de capturar en el pasado. Si esta pista da como resultado la busqueda de Oslo, un equipo de ataque tactico bien coordinado seria ventajoso para un enfrentamiento exitoso. \n\n Estas autorizado a utilizar cualquier fuerza que sea necesaria para neutralizar el objetivo. \n\nEl pago se realizara al finalizar exitosamente el contrato.\n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, de propiedad exclusiva, privilegiada y/o privada. La información esta destinada a ser utilizada por la persona o entidad designada anteriormente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
mg_miles_capturegang_desc_005=ECKHART SECURITY, LLC.\nCONTRATOS Y GESTIÓN\n\nTIPO DE CONTRATO: Garantia de grupo\nESTADO DEL CONTRATISTA: Independiente\ncódigo de aprobacion: =~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\n*********\n__Información de antecedentes__\nSe ha emitido una orden de arresto grupal contra la famosa banda de secuestro de naves de Arlington despues de su reciente y descarado intento de robo de un Idris en un astillero de reparaciones. Mientras se detuvo el atraco, los miembros del grupo se dispersaron hacia el negro. A Eckhart Security se le ha concedido la recompensa por la captura inmediata de todos los pandilleros de alto nivel: Maltrox Arlington, Kass Dent, Nicks Cantwell, Sam 'Weepy' Arlington, Oslo Arlington y Les Arlington.\n******** *\n\nDos guardías de banco fueron reportados como desaparecidos la semana pasada. Hace unas horas, sus cuerpos aparecieron en un monton de basura en Magnus con sus datos biometricos robados. Afortunadamente, un carrito de bolas de masa cercano tenia una camara de seguridad que capto los cadaveres que caian. El reconocimiento facial pudo identificar a Kass Dent, pareja romantica de Maltrox Arlington y padre de Les Arlington. Usando el video para construir una linea de tiempo, proporcionamos las coordenadas de donde se cree que se esconde actualmente Kass. \n\nKass es sospechoso de una larga lista de asesinatos, siendo estos dos solo los mas recientes. Recomendamos traer unicamente un compañero altamente capacitado para intentar mantener el recuento de bajas al minimo. \n\n Estas autorizado a utilizar cualquier fuerza que sea necesaria para neutralizar el objetivo. \n\nEl pago se realizara al finalizar exitosamente el contrato.\n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, de propiedad exclusiva, privilegiada y/o privada. La información esta destinada a ser utilizada por la persona o entidad designada anteriormente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x4, Targets x1
mg_miles_capturegang_desc_006=ECKHART SECURITY, LLC.\nCONTRATOS Y GESTIÓN\n\nTIPO DE CONTRATO: Garantia de grupo\nESTADO DEL CONTRATISTA: Independiente\ncódigo de aprobacion: =~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\n*********\n__Información de antecedentes__\nSe ha emitido una orden de arresto grupal contra la famosa banda de secuestro de naves de Arlington despues de su reciente y descarado intento de robo de un Idris en un astillero de reparaciones. Mientras se detuvo el atraco, los miembros del grupo se dispersaron hacia el negro. A Eckhart Security se le ha concedido la recompensa por la captura inmediata de todos los pandilleros de alto nivel: Maltrox Arlington, Kass Dent, Nicks Cantwell, Sam 'Weepy' Arlington, Oslo Arlington y Les Arlington.\n******** *\n\nMaltrox Arlington ha mantenido un perfil bajo recientemente, pero creemos que ha salido de su escondite. Una patrulla estaba repostando combustible en una estación cuando uno de sus naves recibio un impulso. Maltrox es el sospechoso mas probable. Aunque la etiqueta de registro se desactivo temporalmente, hemos podido rastrear la firma cuantica de la nave y le hemos proporcionado esas coordenadas. \n\n, criminal de tercera generacion, la banda de Arlington ha estado bajo el liderazgo de Maltrox durante los ultimos seis años. Tenga en cuenta que se trata de un objetivo inteligente, agresivo y muy peligroso. Cuantos mas recursos pueda aportar, mas probable será que podamos incorporar Maltrox de una vez por todas. \n\n Estas autorizado a utilizar cualquier fuerza que sea necesaria para neutralizar el objetivo. \n\nEl pago se realizara al finalizar exitosamente el contrato.\n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, de propiedad exclusiva, privilegiada y/o privada. La información esta destinada a ser utilizada por la persona o entidad designada anteriormente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x4, Targets x1
mg_miles_capturegang_desc_idris=ECKHART SECURITY, LLC.\nCONTRATOS Y GESTIÓN\n\nTIPO DE CONTRATO: Garantia de grupo\nESTADO DEL CONTRATISTA: Independiente\ncódigo de aprobacion: =~mission(Contractor|ApprovalCode)\n\nPARA PROCESAMIENTO INMEDIATO\n\nParece que la segunda vez es la vencida para la pandilla de Arlington. Despues de un intento fallido, la familia criminal recientemente escapada logro sacar un Idris de un taller de reparación. Ahora sabemos para que servian el laser minero y la biometria que robaron. \n\nDado que tuvimos tanto exito al capturarlos la primera vez, a Eckhart Security se le ha otorgado la orden de arresto de la pandilla. Se necesitara una potencia de fuego considerable para derribar una nave capital de esta capacidad. \n\n Estas autorizado a utilizar cualquier fuerza necesaria para localizar a los Idris y neutralizar a la pandilla. \n\n El pago se emitira una vez completado con exito el contrato y se ajustara en funcion en la evaluación final de su calificación de efectividad en combate y la de su equipo. \n\nEste contrato no es negociable.\n\nEste mensaje puede contener información confidencial, propietaria, privilegiada y/o privada. La información esta destinada a ser utilizada por la persona o entidad designada anteriormente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> 5/7\n<EM4>Rep:</EM4> +1,000
