redwind_UGF_collect_desc_001=\nRED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nTienes un envío esperando ser transportado desde ~mission(Location|Address) hasta ~mission(Destination|Address).\n\nSeré directo contigo, este lugar no tiene la mejor reputación. Dicho esto, todavía necesitan que se entreguen paquetes y tienen créditos, así que todo está bien. Pero si decides aceptar el trabajo, hay una buena posibilidad de que te encuentres con algunos problemas.\n\nNo aceptes el trabajo si no puedes manejarlo.\n\nPARA TODOS LOS VETERANOS - Red Wind aprecia su servicio a nuestro Imperio. ¡Sus luchas significan nuestra libertad!\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
redwind_UGF_collect_title_001=\nSE NECESITA PILOTO DE ENTREGA DE RED WIND <EM4>[500 Rep]</EM4>
redwind_courier_dc_small_title_001=Título de Ruta de Envío Local Red Wind - ~mission(Pickup1|Address) > ~mission(Dropoff1|Address) <EM4>[500–1,000 Rep]</EM4>
redwind_courier_fromdc_med_desc_001=TRANSPORTE DE RED WIND\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nRecibimos una solicitud de ~mission(Pickup1|Address) informando que tienen una cantidad considerable de paquetes esperando en la ~mission(Pickup1) que necesitan ser entregados.\n\nAntes de aceptar el contrato, asegúrate de tener una nave con suficiente espacio. Un rayo tractor tampoco estaría de más.\n\nPAQUETES PARA RECOGER \n     · Todos los Paquetes en la ~mission(Pickup1) en ~mission(Pickup1|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a la ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a la ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a la ~mission(Dropoff3|Address)\n     · Paquete #~mission(item4|serialnumber) a la ~mission(Dropoff4|Address)\n     · Paquete #~mission(item5|serialnumber) a la ~mission(Dropoff5|Address)\n     · Paquete #~mission(item6|serialnumber) a la ~mission(Dropoff5|Address)\n     · Paquete #~mission(item7|serialnumber) a la ~mission(Dropoff6|Address)\n     · Paquete #~mission(item8|serialnumber) a la ~mission(Dropoff6|Address)\n     · Paquete #~mission(item9|serialnumber) a la ~mission(Dropoff7|Address)\n     · Paquete #~mission(item10|serialnumber) a la ~mission(Dropoff7|Address)\n\n\nSOMOS IGUALDAD DE OPORTUNIDADES - Red Wind Linehaul es y siempre ha sido un contratista de igualdad de oportunidades. Si crees que puedes hacer un buen trabajo para nosotros, entonces inscríbete.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
redwind_courier_fromdc_small_desc_001=TRANSPORTE DE RED WIND\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\nLa gente de ~mission(Pickup1|Address) tiene unos pocos paquetes en la ~mission(Pickup1) que quieren entregar. Créditos fáciles por hacer una carga y descarga básica.\n\nPAQUETES PARA RECOGER \n     · Todos los Paquetes en la ~mission(Pickup1) en ~mission(Pickup1|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a la ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a la ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a la ~mission(Dropoff3|Address)\n     · Paquete #~mission(item4|serialnumber) a la ~mission(Dropoff4|Address)\n     · Paquete #~mission(item5|serialnumber) a la ~mission(Dropoff5|Address)\n\n\nA TODOS LOS VETERANOS - ¡Red Wind aprecia su servicio a nuestro Imperio! ¡Sus luchas significan nuestra libertad!\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
redwind_courier_todc_med_desc_001=TRANSPORTE DE RED WIND\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nHay una cantidad considerable de paquetes que necesitan ser llevados a la ~mission(Dropoff1) en ~mission(Dropoff1|Address). Mientras tu nave tenga suficiente espacio, esto debería ser un viaje relativamente sencillo.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN) \n     · Paquete #~mission(item1|serialnumber) desde la ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde la ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde la ~mission(Pickup3|Address)\n     · Paquete #~mission(item4|serialnumber) desde la ~mission(Pickup4|Address)\n     · Paquete #~mission(item5|serialnumber) desde la ~mission(Pickup5|Address)\n     · Paquete #~mission(item6|serialnumber) desde la ~mission(Pickup5|Address)\n     · Paquete #~mission(item7|serialnumber) desde la ~mission(Pickup6|Address)\n     · Paquete #~mission(item8|serialnumber) desde la ~mission(Pickup6|Address)\n     · Paquete #~mission(item9|serialnumber) desde la ~mission(Pickup7|Address)\n     · Paquete #~mission(item10|serialnumber) desde la ~mission(Pickup7|Address)\n\nUBICACIÓN DE ENTREGA\n     · Todos los Paquetes entregados a la ~mission(Dropoff1) en ~mission(Dropoff1|Address)\n\n\nNO ACEPTES ESTE CONTRATO - a menos que seas confiable. Red Wind tiene una reputación en la que nuestros clientes confían y por una buena razón.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
redwind_courier_todc_small_desc_001=TRANSPORTE DE RED WIND\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nHay un pequeño grupo de paquetes que necesitan ser recogidos y llevados a la ~mission(Dropoff1) en ~mission(Dropoff1|Address). Debería ser bastante simple considerando todo.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN) \n     · Paquete #~mission(item1|serialnumber) desde la ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde la ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde la ~mission(Pickup3|Address)\n     · Paquete #~mission(item4|serialnumber) desde la ~mission(Pickup4|Address)\n     · Paquete #~mission(item5|serialnumber) desde la ~mission(Pickup5|Address)\n\nUBICACIÓN DE ENTREGA\n     · Todos los Paquetes entregados a la ~mission(Dropoff1) en ~mission(Dropoff1|Address)\n\n\nLA CONFIANZA VA EN AMBAS DIRECCIONES - Al aceptar este contrato, te comprometes a no traicionarnos, y Red Wind Linehaul se compromete a tratarte de la misma manera.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
roughready_bounty_cargoship_desc_001=Rough & Ready recientemente proporcionó servicios de combustible para un transportista llamado ~mission(TargetName), quien acordó entregar su próxima carga de suministros como compensación. Bueno, resulta que el deshonesto vendió su última entrega a una banda rival en lugar de cumplir con el trato.\n\nEstamos buscando a alguien para rastrear y eliminar a ~mission(TargetName|Last) por su traición. Un viejo amigo mío acaba de ver al deshonesto en ~mission(Location|Address). Parece que están cargados con más carga que no llegará a nosotros, y viajan con escolta. Solo te pagamos por destruir la nave, así que todo lo que encuentres a bordo es tuyo.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
roughready_bounty_cargoship_desc_002=Mis asociados y yo cerramos un trato con un transportista llamado ~mission(TargetName) para entregarnos suministros. Lo curioso es que la entrega nunca apareció. Alegaron que piratas atacaron su nave y se llevaron nuestros suministros, pero resulta que esa historia es pura mentira.\n\nMentir para romper nuestro acuerdo no puede quedar sin respuesta, y harás que ese mensaje quede bien claro. ~mission(TargetName|Last) fue visto recientemente con escolta en ~mission(Location|Address). Mientras mates a ~mission(TargetName|Last), no nos importa qué suceda con la carga que están transportando.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x4, Targets x1
roughready_bounty_cargoship_desc_003=Un idiota que responde al nombre de ~mission(TargetName) ha estado ejecutando un plan donde su nave de carga solicita servicios de repostaje solo para emboscar nuestras naves cuando llegan. Incluso cargaron la maldita cosa con carga real para asegurarse de que pase las escaneos. Hemos difundido la palabra para que nadie en Rough & Ready caiga en la trampa nuevamente, pero quiero que este deshonesto sea castigado.\n\nCreo que ~mission(TargetName|Last) conoce a muchos de los nuestros a simple vista, así que supongo que será mejor pagarte para que te encargues de ello. Escuché que fueron vistos cerca de ~mission(Location|Address). Ve allí ahora y encárgate de esa nave de carga y de cualquiera que la proteja de una vez por todas.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
roughready_bounty_desc_001=¿Interesado en hacer un poco de caza? ~mission(TargetName) saboteó uno de nuestros envíos de combustible y nos costó un montón de créditos, así que estoy buscando a alguien para hacer que paguen por lo que hicieron. Acabo de recibir la noticia de que ~mission(TargetName|Last) fue visto en ~mission(Location|Address). Si vas ahora, hay una buena posibilidad de que puedas seguir su rastro y eliminarlos de una vez por todas. ~mission(TargetName|Last) no trabajó solo, así que no te sorprendas si viajan con protección adicional.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
roughready_bounty_desc_003=Tengo una situación delicada que necesita ser manejada. Después de años de ser un miembro leal de Rough & Ready, ~mission(TargetName) desertó de la banda y está revelando secretos a nuestros rivales. Necesitamos que ~mission(TargetName|Last) desaparezca de inmediato.\n\nCon cosas como esta, he descubierto que siempre es mejor pagarle a alguien no asociado con nosotros para hacer el trabajo. Los escaneos detectaron a ~mission(TargetName|Last) cerca de ~mission(Location|Address) no hace mucho. Te pagaremos bien para que vayas allí ahora y te encargues de ellos por nosotros. ~mission(TargetName|Last) no es un tonto y sabe que iremos tras ellos. Prepárate para una buena pelea y no esperes que estén solos.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
roughready_claimsweep_desc_easy=La tripulación de Rough & Ready está buscando a alguien para manejar una situación delicada. Hemos descubierto una nave y centinelas orbitales en ~mission(location|address) espiándonos. Estamos en un aprieto porque no queremos iniciar una pelea más grande con quien esté detrás de esto. Es por eso que buscamos ayuda contratada que pueda ocuparse rápidamente y discretamente de esto por nosotros. ¿Interesado?\n\nLo último, una vez que estés allí, asegúrate de vigilar esa nave. Apuesto a que tan pronto como empieces a volar sus centinelas, intentarán traer ayuda para detenerte.\n \n- Smokey\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x3, Prospectors x1\n<EM4>Turrets:</EM4> 2 (hostile)
roughready_claimsweep_desc_hard=La tripulación de Rough & Ready está buscando a un mercenario independiente interesado en algo pesado. Hemos estado observando una situación en desarrollo en ~mission(location|address) donde las naves están custodiando varios centinelas orbitales que espían nuestras operaciones. \n\nAhora, puede que haya nacido de noche, pero no fue anoche. Considerando la manera descarada en que están configurados, quien sea responsable tenía que saber que eventualmente lo descubriríamos. Casi parece que están provocando a R&R para que lo ataque, y no quiero que caigamos en eso. \n\nEn cambio, lo harás por nosotros y recibirás una buena cantidad de créditos por tu esfuerzo. Las naves estacionadas allí serán menos sospechosas de una nave no afiliada que se acerque y harán más difícil atribuirnos el ataque. \n\nSolo asegúrate de planificar adecuadamente antes de entrar. Tal vez trae tus propios refuerzos por si alguna de sus naves escapa y llama a algunos de los suyos. \n\n- Smokey\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x5, Prospectors x4\n<EM4>Turrets:</EM4> 4 (hostile)
roughready_claimsweep_desc_intro=Mis asociados y yo nos encontramos en una pequeña situación complicada y podríamos usar algo de ayuda. Hay un centinela orbital en ~mission(location|address) que nos está espiando. No sabemos quién lo puso allí, pero seguro como el infierno no puede quedarse. \n\nEl problema es que somos personas centradas en los negocios en primer lugar y nos preocupa que si lo volamos nosotros mismos, se arme lío. Es por eso que es mejor si alguien como tú lo hace. Debería ser un trabajo rápido y fácil para alguien interesado en ganar algunos créditos.   \n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Turrets:</EM4> 1 (hostile)
roughready_claimsweep_desc_medium=Hace poco hicimos un descubrimiento interesante: alguien instaló un puñado de centinelas orbitales en ~mission(location|address). Supongo que están tratando de obtener información sobre nuestras operaciones allí. Incluso tienen algunas naves custodiándolos para asegurarse de que no les pase nada. \n\nPor supuesto, queremos que estos bastardos desaparezcan, pero me preocupa que deshacernos de ellos nosotros mismos sería malo para los negocios. Es por eso que buscamos un poco de 'negación plausible'. Alguien de fuera de R&R para eliminar el problema, para que quien esté detrás no pueda vincular directamente el ataque con nosotros. Sé que esto no será pan comido, especialmente con esos guardias al acecho. ¿Quién sabe cuántos refuerzos tienen listos? Pero si logras hacerlo, estamos preparados para pagarte bien. \n\n¿Crees que tienes las habilidades para lograrlo? \n\n- Smokey\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x4, Prospectors x2\n<EM4>Turrets:</EM4> 3 (hostile)
roughready_delivery_station_desc_001=RR Pyro Checkmate Local 1box Single Courier\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 1/7 | Complexity 1/7 | Risk 1/7 | Knowledge 1/7
roughready_delivery_station_title_001=roughready delivery station title 001
roughready_eliminateall_hangar_desc_01=Tenemos unos forajidos que se están quedando más de lo debido en una de nuestras estaciones. Intentaron engañarnos, pero ahora están atrapados en ~mission(location|address). Necesitamos que los elimines. \n\nRough & Ready no quiere que quede ni uno solo de ellos vivo cuando hayas terminado. No importa lo desordenado que se ponga, mientras se haga, ¿entendido?\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
roughready_eliminateall_maintenance_desc_01=Rough & Ready tiene un problema de ratas. Uno de nuestros equipos intentó hacer un poco de motín y ahora han tomado control de ~mission(location|address).\n\nComo no puedo estar 100% seguro de que no tienen simpatizantes a bordo de la estación, quiero que te encargues de poner a estos traidores en su lugar por mí.\n\nSi puedes resolver nuestro pequeño problema de plagas, se te pagará generosamente. Solo no dejes ni uno solo de ellos vivo. No queremos que nadie más tenga ideas divertidas.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
roughready_salvage_E_desc_001=RR Pyro Checkmate VE Civilians Salvage\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Friendlies:</EM4> Salvageable Ships x1
roughready_salvage_E_title_001=roughready salvage E title 001
roughready_salvage_M_desc_001=RR Pyro Checkmate M Civilians Salvage\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x8\n<EM4>Friendlies:</EM4> Salvageable Ships x1
roughready_salvage_M_title_001=roughready salvage M title 001
roughready_searchbody_danger_station_desc_001=Después de escuchar rumores de que podríamos tener un problema con ocupantes ilegales en ~mission(location|address), envié a una de mis personas más fiables para investigar. \n\nLa mala noticia es que no he sabido nada de ellos desde entonces. \n\nMe gustaría que fueras allí y vieras si puedes encontrar la ubicación actual de ~mission(TargetName). Dejo en tus manos cómo quieres lidiar con cualquier escoria que encuentres. \n\nConfirma dónde está ~mission(TargetName|last), y habrá una recompensa para ti.\n\n- Smokey \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
roughready_searchbody_nodanger_station_desc_001=Tengo gente por todas partes preguntándome si sé qué le pasó a ~mission(TargetName). Personalmente, estaría más que feliz de verlos desaparecer para siempre, pero por alguna razón, tienen amigos influyentes exigiendo respuestas. \n\nNo puedo permitirme enviar a ninguno de mis hombres en una persecución sin sentido, pero tú, por otro lado, pareces ser el candidato perfecto. Ve a ~mission(location|address) y averigua qué les pasó. Se te pagará si encuentras dónde están. \n\nApuesto 10 créditos a que se colocaron demasiado y se desmayaron en algún rincón oscuro. \n\n-Smokey\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
