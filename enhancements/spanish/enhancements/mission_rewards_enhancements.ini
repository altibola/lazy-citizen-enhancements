vaughn_assassination_FPS_UGF_illegal_boss_desc_001=No estoy seguro de si estás familiarizado con ~mission(Location|Address), pero ~mission(TargetName) es quien manda allí. Necesito que lo elimines.\n\nEso es más fácil decirlo que hacerlo, me temo. Son conocidos por ser reacios a encargarse de los asuntos personalmente, prefiriendo que sus subalternos se encarguen del trabajo sucio. Dicho esto, elimina a suficientes subalternos y no tendrán más remedio que enfrentarte personalmente.\n\nAtentamente,\nVaughn\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Carnifex Armor Core\n- Carnifex Armor Legs\n- Citadel Arms Base\n- Citadel Core Base\n- Citadel Legs Base\n- Fortifier Helmet Base\n- Pulverizer LMG\n- Pulverizer LMG Magazine (120 Cap)\n- Tripledown Pistol\n- Tripledown Pistol Magazine (12 Cap)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 5/7 | Complexity 3/7 | Risk 5/7 | Knowledge 3/7\n<EM4>Hostiles:</EM4> Backup x4, Boss x1, Hostiles x10\n<EM4>Head Contractor:</EM4> +300 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
vaughn_assassination_FPS_UGF_illegal_desc_001=Dicen que entre ladrones no hay honor. Hoy parece que estás apuntando a uno de los tuyos. \n\nPor favor, dirígete a ~mission(Location|Address) y mata a ~mission(TargetName). Lo que hagas con los demás allí depende completamente de ti.\n\nAtentamente,\nVaughn\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Badami Helmet\n- Deadrig Shotgun\n- Deadrig Shotgun Magazine (8 cap)\n- Killshot Rifle\n- Killshot Rifle Magazine (45 Cap)\n- Overlord Arms Supernova\n- Overlord Core Supernova\n- Overlord Helmet Supernova\n- Overlord Legs Supernova\n- Piecemeal Armor Arms\n- Piecemeal Armor Core\n- Piecemeal Armor Legs\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 4/7 | Complexity 3/7 | Risk 4/7 | Knowledge 3/7\n<EM4>Jr. Contractor:</EM4> +100 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
vaughn_assassination_FPS_UGF_illegal_title_001=Todas las cosas llegan a su fin <EM4>[BP]</EM4> <EM4>[100–300 Rep (Contractor)]</EM4>
vaughn_assassination_FPS_UGF_legal_boss_desc_001=Un alto funcionario de seguridad de nombre ~mission(TargetName) está a punto de ver el fin violento y repentino de su larga carrera. Aunque se encuentra actualmente en ~mission(Location|Address), no será fácil llegar hasta él. Temo que será necesario hacer un poco de trabajo para hacer que salga.  \n\nRecomiendo matar a suficientes de sus subordinados para que se vean obligados a enfrentarte personalmente. Por supuesto, una vez que decidan finalmente mostrar su rostro, debería ser un asunto bastante sencillo. \n\nAtentamente,\nVaughn\n\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Carnifex Armor Core\n- Carnifex Armor Legs\n- Citadel Arms Base\n- Citadel Core Base\n- Citadel Legs Base\n- Fortifier Helmet Base\n- Pulverizer LMG\n- Pulverizer LMG Magazine (120 Cap)\n- Tripledown Pistol\n- Tripledown Pistol Magazine (12 Cap)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 5/7 | Complexity 3/7 | Risk 5/7 | Knowledge 3/7\n<EM4>Hostiles:</EM4> Backup x4, Boss x1, Hostiles x10\n<EM4>Veteran Contractor:</EM4> +250 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
vaughn_assassination_FPS_UGF_legal_desc_001=Un oficial de seguridad de nombre ~mission(TargetName) necesita urgentemente una jubilación anticipada. Actualmente está destacado en ~mission(Location|Address) junto con otros tipos ansiosos en uniforme. \n\nSiéntete libre de satisfacer tus caprichos violentos, pero solo la muerte de ~mission(TargetName) te ganará mi crédito y agradecimiento.\n\nAtentamente,\nVaughn\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13, Targets x1
