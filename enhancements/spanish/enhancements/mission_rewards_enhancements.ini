vaughn_assassination_VE_desc_intro=En primer lugar, permíteme presentarme. Para ponerlo de manera bastante dramática, negocio con vidas. \n\nLa gente me contrata cuando se necesita extinguir a algún alma, y yo, a su vez, empleo a la persona perfecta para servir como el extintor. Esto proporciona seguridad a todas las partes involucradas, ya que ninguna conoce la identidad de la otra. Una situación ideal en la medida en que estas cosas van.\n\nRecientemente me enteré de que puedes poseer habilidades que podrían serte útiles y decidí que valdría la pena investigar la validez de esta afirmación. \n \nSi tienes algún interés en forjar una relación de trabajo, necesitaré una demostración de dichas habilidades. \n\nBusca y mata discretamente a ~mission(TargetName) en ~mission(Location|Address).\n\nHazlo con éxito y serás recompensado. No solo eso, sino que habrás demostrado ser merecedor de una consideración adicional.\n\nSinceramente,\nVaughn\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +250\n<EM4>Hostiles:</EM4> Targets x1
vaughn_assassination_VE_desc_rehire=No es frecuente en la vida que tengamos otra oportunidad de causar una primera impresión, pero voy a proporcionarte exactamente eso.\n\nDecir que me decepcionó cómo ocurrieron las cosas en tu último intento de asesinato sería una subestimación severa. Sin embargo, aquí tienes la oportunidad de demostrar que eres capaz de más. \n\nMata a ~mission(TargetName) en ~mission(Location|Address) y haré borrón y cuenta nueva. \n\nSinceramente,\nVaughn\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +250\n<EM4>Hostiles:</EM4> Targets x1
