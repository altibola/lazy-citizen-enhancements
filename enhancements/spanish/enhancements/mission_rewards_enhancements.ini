Covalex_courier_todc_med_desc_001=Hola,\n\nTenemos un pedido de tamaño decente que necesita ser entregado en ~mission(Dropoff1) en ~mission(Dropoff1|Dirección). ¡Sugeriría llevar un rayo tractor, pero tú sabrás!\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN) \n     · Paquete #~mission(item1|númerodeserie) desde ~mission(Pickup1|Dirección)\n     · Paquete #~mission(item2|númerodeserie) desde ~mission(Pickup2|Dirección)\n     · Paquete #~mission(item3|númerodeserie) desde ~mission(Pickup3|Dirección)\n     · Paquete #~mission(item4|númerodeserie) desde ~mission(Pickup4|Dirección)\n     · Paquete #~mission(item5|númerodeserie) desde ~mission(Pickup5|Dirección)\n     · Paquete #~mission(item6|númerodeserie) desde ~mission(Pickup5|Dirección)\n     · Paquete #~mission(item7|númerodeserie) desde ~mission(Pickup6|Dirección)\n     · Paquete #~mission(item8|númerodeserie) desde ~mission(Pickup6|Dirección)\n     · Paquete #~mission(item9|númerodeserie) desde ~mission(Pickup7|Dirección)\n     · Paquete #~mission(item10|númerodeserie) desde ~mission(Pickup7|Dirección)\n\nUBICACIÓN DE ENTREGA\n     · Todos los paquetes entregados en ~mission(Dropoff1) en ~mission(Dropoff1|Dirección)\n\nMuchas gracias,\n\nChase Hewitt\nCoordinador Jr. de Logística\nEnvíos Covalex  \n'Cualquier cosa que necesites, en cualquier lugar que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según se detalla en nuestra 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Envíos Covalex no se hace responsable de los daños que ocurran durante la operación como contratista independiente.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
Covalex_courier_todc_small_desc_001=¡Hola!\n\nRecibimos una solicitud para transferir algunos paquetes a ~mission(Dropoff1) en ~mission(Dropoff1|Dirección). Bastante sencillo según van estas cosas.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN) \n     · Paquete #~mission(item1|númerodeserie) desde ~mission(Pickup1|Dirección)\n     · Paquete #~mission(item2|númerodeserie) desde ~mission(Pickup2|Dirección)\n     · Paquete #~mission(item3|númerodeserie) desde ~mission(Pickup3|Dirección)\n     · Paquete #~mission(item4|númerodeserie) desde ~mission(Pickup4|Dirección)\n     · Paquete #~mission(item5|númerodeserie) desde ~mission(Pickup5|Dirección)\n\nUBICACIÓN DE ENTREGA\n     · Todos los paquetes entregados en ~mission(Dropoff1) en ~mission(Dropoff1|Dirección)\n\nAprecio que te tomes el tiempo para ocuparte de este trabajo por mí, \n\nChase Hewitt\nCoordinador Jr. de Logística\nEnvíos Covalex  \n'Cualquier cosa que necesites, en cualquier lugar que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según se detalla en nuestra 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Envíos Covalex no se hace responsable de los daños que ocurran durante la operación como contratista independiente.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Covalex_internaldelivery_dc_desc_001=¡Hola!\n\nNecesito una mano extra en ~mission(Location|Address) para ayudar a mover algunos artículos entre algunos de los sitios de almacenamiento dentro de la instalación. ¡Cuando los lugares son tan grandes, necesitan toda la ayuda logística que puedan conseguir! \n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) desde ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) desde ~mission(Pickup2)\n\nDESTINOS DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n\n¡Buena suerte!\n\nChase Hewitt\nCoordinador de Logística Jr.\nEnvíos Covalex\n'Cualquier cosa que necesites, donde sea que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según lo descrito en nuestra guía extendida 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Envíos Covalex no se hace responsable de los daños que ocurran mientras operas como contratista independiente.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Covalex_internaldelivery_dc_desc_003=Hola,\n\nRecibimos una solicitud de ~mission(Location|Address) para ayudar a reubicar internamente algunos paquetes de donde se encuentran almacenados actualmente. Pensé que podrías estar dispuesto a ocuparte de eso.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) desde ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) desde ~mission(Pickup2)\n     · Paquete n.º ~mission(item3|serialnumber) desde ~mission(Pickup3)\n     · Paquete n.º ~mission(item4|serialnumber) desde ~mission(Pickup4)\n\nDESTINOS DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n     · Paquete n.º ~mission(item3|serialnumber) a ~mission(Dropoff3)\n     · Paquete n.º ~mission(item4|serialnumber) a ~mission(Dropoff4)\n\n¡Que tengas un buen día!\n\nChase Hewitt\nCoordinador de Logística Jr.\nEnvíos Covalex\n'Cualquier cosa que necesites, donde sea que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según lo descrito en nuestra guía extendida 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Envíos Covalex no se hace responsable de los daños que ocurran mientras operas como contratista independiente.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
Covalex_internaldelivery_dc_desc_005=Hola,\n\nHay un montón de paquetes en ~mission(Location|address) que necesitan ser transportados por la instalación hasta su lugar de almacenamiento adecuado. Significaría mucho si pudieras ocuparte personalmente de que todo se ordene correctamente.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) desde ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) desde ~mission(Pickup2)\n     · Paquete n.º ~mission(item3|serialnumber) desde ~mission(Pickup3)\n     · Paquete n.º ~mission(item4|serialnumber) desde ~mission(Pickup4)\n     · Paquete n.º ~mission(item5|serialnumber) desde ~mission(Pickup5)\n     · Paquete n.º ~mission(item6|serialnumber) desde ~mission(Pickup6)\n\n\nDESTINOS DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n     · Paquete n.º ~mission(item3|serialnumber) a ~mission(Dropoff3)\n     · Paquete n.º ~mission(item4|serialnumber) a ~mission(Dropoff4)\n     · Paquete n.º ~mission(item5|serialnumber) a ~mission(Dropoff5)\n     · Paquete n.º ~mission(item6|serialnumber) a ~mission(Dropoff6)\n\n\nRealmente aprecio todo lo que haces,\n\nChase Hewitt\nCoordinador de Logística Jr.\nEnvíos Covalex\n'Cualquier cosa que necesites, donde sea que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según lo descrito en nuestra guía extendida 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Envíos Covalex no se hace responsable de los daños que ocurran mientras operas como contratista independiente.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +2,000
Covalex_internaldelivery_dc_title_001=Manipulador de Paquetes de Covalex - ~mission(Location|Address), ~mission(Pickup1), ~mission(Pickup2) > ~mission(Dropoff1), ~mission(Dropoff2) <EM4>[500–2,000 Rep]</EM4>
Criminal_RetrieveData_Reclaimer_desc=Estuve buscando un paquete de datos en particular y justo cuando tengo un descanso, la nave es atacada por esta Reclaimer de los Nine Tails reconvertida, llamada Black Kite. Intenté piratear los servidores del Black Kite para ver si copiaban los datos, pero no pude encontrar una manera de superar de forma remota sus protocolos de cifrado sin la llave fisica. \n\nAhí es donde entras tu. Necesito que irrumpas en su nave, obtengas su llave de descifrado y descodifiques el servidor para que pueda descargar remotamente lo que necesito. \n\n Eres lo suficientemente inteligente como para saber con quien estamos tratando aquí, asi que planifica en consecuencia. Ya que va cabrear a gente poderosa, no dejemos nada al azar. Destruye el Black Kite cuando hayas terminado para cubrirnos las espaldas.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostiles x2
DataDownload_Mobi_Description=WIP He oido que usted es la persona adecuada para este trabajo, asi que ire al grano. Hemos localizado una estación de falsificacion de UEC en un antiguo lugar accidentado. Si llega rapidamente a la estación de falsificacion, podra descargar el UEC usted mismo. Tienen algunos guardías defendiendo el lugar accidentado, pero estoy seguro de que podras manejarlo. Ah, y un aviso final. No soy la unica persona con esta información, asi que espera oposición .\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
