shubin_claimsweep_desc_easy=PUBLICACION: Seguridad / Mercenario \nUBICACIÓN: ~mission(LagrangeLocation)\nEXPERIENCIA LABORAL: Piloto de combate (Experiencia militar una ventaja)\nTERMINOS*: \nAcabamos de recibir noticias de que un contratista de Shubin fue expulsado uno de nuestros reclamos por parte de forajidos que operan allí ilegalmente. Para complicar aun mas las cosas, han instalado algunos centinelas orbitales para protegerse mientras minan. \n\nNuestra esperanza es contratar un mercenario que pueda buscar y destruir a los centinelas en ~mission(location). Si se encuentra con un minero ilegal en el sitio, tenga en cuenta que es una practica comun que este tipo de personas contacten a refuerzos para solicitar ayuda. Quizas seria mejor neutralizarlos lo mas rápido posible antes de que puedan hacerlo. \n\n\n\n\n*Shubin Interstellar es un contratista que ofrece igualdad de oportunidades. Al aceptar este contrato, usted asume todos los riesgos asociados con el trabajo aquí descrito y de ninguna manera Shubin Interstellar puede ser considerado responsable de los daños acumulados durante la duración del contrato.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x3, Prospectors x1\n<EM4>Turrets:</EM4> 1 (hostile)
shubin_claimsweep_desc_hard=PUBLICACION: Seguridad / Mercenario \nUBICACIÓN: ~mission(LagrangeLocation)\nEXPERIENCIA DE TRABAJO: Piloto de combate (Experiencia militar una ventaja)\nTERMINOS*: \nUn equipo minero independiente local de Stanton estaba trabajando ~mission(Location) como contratistas de Shubin Interstellar cuando una fuerza hostil ataco y se apodero del sitio. Creemos que los perpetradores todavía están en el reclamo utilizando el equipo que dejaron para recolectar el valioso mineral allí para ellos mismos.\n\nEntre los equipos perdidos habia un puñado de centinelas orbitales que lamentablemente aun no se habian desplegado por completo en el momento del ataque. ataque. Los escaneos de largo alcance del reclamo nos han llevado a concluir que los forajidos han activado los centinelas orbitales y los están utilizando para proteger sus operaciones ilegales.\n\nPara recuperar el sitio, estamos buscando contratistas para ir a ~mission(Location), destruye los centinelas orbitales y limpia el sitio de mineros hostiles. Se recomienda encarecidamente la eficiencia, ya que existe un alto riesgo de que pidan refuerzos una vez que descubran que están siendo desalojados. \n\n\n\n\n*Shubin Interstellar es un contratista que ofrece igualdad de oportunidades. Al aceptar este contrato, usted asume todos los riesgos asociados con el trabajo aquí descrito y de ninguna manera Shubin Interstellar puede ser considerado responsable de los daños acumulados durante la duración del contrato.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x5, Prospectors x4\n<EM4>Turrets:</EM4> 4 (hostile)
shubin_claimsweep_desc_intro=PUBLICACION: Seguridad / Mercenario \nUBICACIÓN: ~mission(LagrangeLocation)\nEXPERIENCIA DE TRABAJO: Piloto de combate (Experiencia militar una ventaja)\nTERMINOS*: \nRecientemente se descubrio que un reclamo minero de Shubin ha sido robado ilegalmente por un minero deshonesto. Si bien los mineros ya no parecen estar robando mineral del sitio, si dejaron atrás un centinela orbital que nos impide recuperarlo gracias a sus capacidades ofensivas.\n\nEstamos buscando un mercenario dispuesto a viajar a ~mission(location) caza al centinela y destruyelo en preparación para la recuperación del sitio por parte de Shubin.\n\n\n\n\n*Shubin Interstellar es un contratista que ofrece igualdad de oportunidades. Al aceptar este contrato, usted asume todos los riesgos asociados con el trabajo aquí descrito y de ninguna manera Shubin Interstellar puede ser considerado responsable de los daños acumulados durante la duración del contrato.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Turrets:</EM4> 1 (hostile)
shubin_claimsweep_desc_med=PUBLICACION: Seguridad / Mercenario \nUBICACIÓN: ~mission(LagrangeLocation)\nEXPERIENCIA LABORAL: Piloto de combate (experiencia militar adicional)\nTERMINOS*: \nSe descubrio un reclamo minero Shubin Interstellar recientemente adquirido en espera de procesamiento haber sido atacado por un equipo minero deshonesto que esta robando activamente mineral del sitio. Si bien se ha notificado a las autoridades locales, existe la preocupación de que se puedan confiscar activos valiosos antes de que se pueda iniciar una  investigación oficial.\n\nPor lo tanto, como es nuestro derecho como titulares de reclamos, deseamos asegurar una fuerza mercenaria para ir a ~mission(Location) y destruir los varios centinelas orbitales que protegen esta operacion ilegal. Se recomienda precaucion ya que todavía puede haber algunos mineros ilegales en el lugar junto con los refuerzos que puedan reunir. \n\n\n\n\n*Shubin Interstellar es un contratista que ofrece igualdad de oportunidades. Al aceptar este contrato, usted asume todos los riesgos asociados con el trabajo aquí descrito y de ninguna manera Shubin Interstellar puede ser considerado responsable de los daños acumulados durante la duración del contrato.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x4, Prospectors x2\n<EM4>Turrets:</EM4> 3 (hostile)
shubin_claimsweep_desc_rand=PUBLICACION: Seguridad / Mercenario \nUBICACIÓN: ~mission(LagrangeLocation)\nEXPERIENCIA LABORAL: Piloto de combate (Experiencia militar una ventaja)\nTERMINOS*: \nMientras realiza una encuesta de las afirmaciones de Shubin en el sector, Nos desanimo saber que un pequeño equipo de forajidos se habia instalado en ~mission(Location) y habian estado recolectando recursos ilegalmente. Peor aun, han establecido un perimetro defensivo con varios centinelas orbitales repartidos por todo el lugar, lo que nos dificulta desalojarlos. \n\nPara poder recuperar el sitio reclamado, estamos buscando contratistas mercenarios para encontrar y destruir el puñado de centinelas orbitales. Lo que añade dificultad adicional a la tarea es que no tenemos claro la fuerza de combate exacta de estos mineros forajidos. Si se les da la oportunidad de convocar refuerzos, pueden esperar desde una pequeña contingencia hasta un escuadron completo de combatientes entrenados. \n\n\n\n\n*Shubin Interstellar es un contratista que ofrece igualdad de oportunidades. Al aceptar este contrato, usted asume todos los riesgos asociados con el trabajo aquí descrito y de ninguna manera Shubin Interstellar puede ser considerado responsable de los daños acumulados durante la duración del contrato.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Hostile Wave x32, Prospectors x5\n<EM4>Turrets:</EM4> 4 (hostile)
