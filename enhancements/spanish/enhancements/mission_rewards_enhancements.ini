Headhunters_defend_XT_VH_desc_001=HH Pyro RegionB VH TheGoldenRiviera EliminateAll\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 6/7 | Complexity 6/7 | Risk 5/7 | Knowledge 5/7\n<EM4>Hostiles:</EM4> CQC x3, Juggernauts x2, Snipers x2, Soldiers x9, Technicians x2\n<EM4>Contractor:</EM4> +200 Rep\n<EM4>Blueprint Reward:</EM4> Guaranteed
Headhunters_defend_XT_VH_title_001=Headhunters defend XT VH title 001 <EM4>[BP]</EM4> <EM4>[200 Rep (Contractor)]</EM4>
Headhunters_eliminateall_caves_desc_01=Hola,\n\nUnos matones de poca monta se han refugiado en ~mission(location|address). No les prestaría atención, excepto que los skags arrogantes intentaron atacar un puesto bajo nuestra protección.\n\nLos ahuyentamos sin muchos problemas, pero no podemos permitir que ese tipo de falta de respeto quede impune. Nuestros Clips están ocupados con presas más grandes, así que nos gustaría que te encargues de esto por nosotros.\n\n~mission(Location|CaveSize) Y dado que estos bastardos ya están bajo tierra, ni siquiera tendrás que molestarte en enterrarlos cuando hayas terminado.\n\nFin de la transmisión out.\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Atzkav "Igniter" Sniper Rifle\n- Atzkav "Mirage" Sniper Rifle\n- Atzkav Sniper Rifle\n- Atzkav Sniper Rifle Battery (8 cap)\n- Calico Arms Tactical\n- Calico Core Tactical\n- Calico Helmet Tactical\n- Calico Legs Tactical\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> Combat 4/7 | Complexity 3/7 | Risk 3/7 | Knowledge 4/7\n<EM4>Hostiles:</EM4> CQC x3, Juggernauts x2, Soldiers x6\n<EM4>Neutral:</EM4> +50 Rep\n<EM4>Blueprint Reward:</EM4> Guaranteed
Headhunters_eliminateall_caves_title_01=Una Represalia Rápida <EM4>[BP]</EM4> <EM4>[50 Rep]</EM4>
Headhunters_theft_outpost_xenothreat_desc_001=XenoThreat destruyó recientemente uno de nuestros buques de suministro. No estoy seguro de si pensaron que estaba lleno de armas hechas por alienígenas, colonos Tevarin o lo que sea, pero ahora estamos escasos de algunas cosas. Parece justo que XenoThreat pague por lo que hicieron. \n\nNecesito que alguien tome el ~mission(item) de ~mission(Pickup1|Address) y lo entregue en ~mission(Dropoff1|Address).\n\nDudo mucho que estos idiotas te permitan poner tus manos en estas cajas sin ofrecer resistencia. Probablemente sea mejor armar un equipo y equiparse antes de salir.\n\nFin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
HexPenetrator_Bounty_desc=Nuestros analistas han examinado la inteligencia incautada de esos equipos de reconocimiento de XenoThreat, pero los datos parecen estar bloqueados detrás de un sofisticado sistema de cifrado y requieren una clave de cifrado personalizada para acceder.\n\nHemos logrado localizar a varios lugartenientes de XenoThreat operando en el sistema. Debes encontrar y enfrentarte a los sospechosos para ver si tienen en su poder una clave de cifrado que nos permita acceder a la inteligencia.\n\nComo recordatorio, el ejército ha donado generosamente algunos viejos Hornets F7A para los miembros de la Fuerza de Defensa Civil que lleven a cabo esta iniciativa hasta el final.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique
HexPenetrator_Comm_Description=Uno de los sospechosos capturados durante los recientes ataques reveló que XenoThreat está buscando acceder de forma remota a una serie de matrices de comunicación en todo el sistema.\n\nQue XenoThreat escuche las comunicaciones es extremadamente peligroso para las personas que viven aquí, así que la FDC ha sido enlistada para restablecer la matriz de comunicación y luego defenderla de cualquier Vanguards de XenoThreat que intenten reconectarse a los servidores.\n\nUna vez que esos Vanguards hayan sido derrotados, elimina cualquier nave hostil restante en la zona.\n\nComo recordatorio, el ejército ha donado generosamente algunos Hornets F7A viejos para los miembros de la FDC que lleven a cabo esta iniciativa hasta el final.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique
HexPenetrator_DataHeist_description=Hemos recibido informes de que XenoThreat tiene la intención de lanzar otro ataque en el sistema Stanton. La FDC ha solicitado a la Advocacy crear una nueva iniciativa llamada Operación Overdrive para detener este ataque antes de que ocurra.\n\nLa FDC está enviando voluntarios para infiltrarse y obtener cualquier inteligencia que pueda proporcionar información sobre lo que están planeando. Es de esperar una fuerte resistencia por parte de cualquier XenoThreat en el lugar.\n\nComo incentivo adicional, el ejército ha donado generosamente algunos viejos Hornets F7A para los miembros de la FDC que lleven esta iniciativa hasta el final.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Hostiles:</EM4> Hostiles x54, Technicians x2
HexPenetrator_Incursion_Desc=Olas de naves de XenoThreat han estado avanzando hacia el sistema Stanton y atacando civiles al azar. No podemos determinar si se trata de un ataque aislado o una reacción a nuestras iniciativas recientes, pero necesitamos detenerlos.\n\nComo recordatorio, el ejército ha donado generosamente algunos viejos Hornets F7A para los miembros de la FDC que lleven esta iniciativa hasta el final.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique
HexPenetrator_Kareah_Desc=Atención a todos los voluntarios de la FDC, recibimos una llamada de socorro desde el Puesto de Seguridad Kareah. Resulta que XenoThreat utilizó las matrices de comunicación como distracción para alejar a las fuerzas del orden, permitiéndoles lanzar un ataque contra la estación.\n\nHemos sabido que están intentando acceder a sus sistemas, por lo que todos los voluntarios deben desviarse inmediatamente para retomar Kareah y eliminar todas las fuerzas de XenoThreat.\n\nComo recordatorio, el ejército ha donado generosamente algunos viejos Hornets F7A para los miembros de la FDC que lleven esta iniciativa hasta el final.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Hostiles:</EM4> Hostile Wave x3
HexPenetrator_RecoverDeliver_description=Atención voluntarios de la FDC, XenoThreat ha desaparecido del radar. Sospechamos que se han vuelto invisibles para prepararse para la fase final de su plan. \n\nLa historia ha demostrado que a XenoThreat le gusta luchar, por lo que es lógico pensar que esto podría ser algún tipo de ataque, así que llamamos a los voluntarios para entregar suministros a la estación Gateway cerca del punto de salto Stanton-Pyro para reforzarnos ante un posible asalto. \nComo recordatorio, el ejército ha donado generosamente algunos Hornets F7A antiguos para los miembros de la FDC que completen esta iniciativa hasta el final.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique
