GMCapture_Desc=Para evaluar la preparación de nuestros equipos de respuesta, nos gustaría que voluntarios simularan un asalto contra una Idris de la CDF neutralizando y tomando el control de la nave.\n\nPara ser claros, el objetivo del ejercicio no es destruir la Idris, sino que intentes abordar la nave y mantener el control el mayor tiempo posible. Los voluntarios deben esperar encontrarse con una resistencia completa por parte de la tripulación altamente entrenada de la Idris y se les anima a obtener una impresión actualizada de antemano.\n\nLas coordenadas se proporcionarán al confirmar su participación.\n\nGracias y buena suerte.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
