XenoThreat_claimsweep_desc_easy=Nuestra resistencia crece día a día, pero esto llama la atención no deseada. Escaneos recientes descubrieron centinelas orbitales en ~mission(location|address) y una nave en patrulla. Creemos que es parte de una campaña de espionaje dirigida a XenoThreat, probablemente financiada por la UEE.\n\nBuscamos un mercenario experimentado dispuesto a destruir los centinelas ASAP. Dado que ya nos vigilan, enviar a alguien de fuera de la organización atraería menos atención. Si aceptas el trabajo, se te pagará puntualmente una vez que los centinelas sean destruidos.\n\nAhora, aunque la nave de patrulla no es el objetivo principal, sospechamos que, si escapa, podría tener refuerzos en reserva. Sería inteligente ocuparse de ella rápidamente.\n\nSi decides ayudarnos, XenoThreat recordará que eres alguien dispuesto a luchar por lo correcto.\n\nComm. Spec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50\n<EM4>Hostiles:</EM4> Hostile Wave x3, Prospectors x1\n<EM4>Turrets:</EM4> 2 (hostile)
XenoThreat_claimsweep_desc_hard=Escaneos recientes descubrieron varios centinelas orbitales y naves en ~mission(location|address). Creemos que son parte de una campaña de espionaje dirigida a XenoThreat, en respuesta a nuestras recientes acciones en el sistema Stanton. Parece que XenoThreat debe estar haciendo algo bien si están espiando de esta manera.\n\nBuscamos un mercenario experimentado y altamente habilidoso dispuesto a eliminar esta operación. Si no quieres que Pyro se convierta en un sistema de vigilancia, esta es tu oportunidad de detenerlo. Los centinelas probablemente no serán un gran problema, pero presta atención a las naves de patrulla. Si logran escapar, tendrás muchos más problemas.\n\nTendrás nuestra gratitud y un pago sustancial una vez que se haya completado el trabajo.\n\nComm. Spec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +250\n<EM4>Hostiles:</EM4> Hostile Wave x5, Prospectors x4\n<EM4>Turrets:</EM4> 4 (hostile)
XenoThreat_claimsweep_desc_intro=Parece que nuestra lucha por liberar a la Humanidad ha puesto nerviosos a los lacayos del gobierno en la Tierra. Escaneos recientes descubrieron un centinela orbital en ~mission(location|address) que creemos que es parte de una campaña de espionaje de la UEE. Las buenas apuestas dicen que están entregando los datos directamente a los sinvergüenzas mismos.\n\nHasta ahora, solo se ha detectado un centinela, pero quién sabe cuán grande será la operación si no se desactiva. No debería ser demasiado problema para un mercenario hábil. Si eso suena como tú, el pago se enviará puntualmente una vez que el centinela sea destruido. Además, XenoThreat recordará que eres alguien dispuesto a luchar por lo correcto.\n\nComm. Spec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50\n<EM4>Turrets:</EM4> 1 (hostile)
XenoThreat_claimsweep_desc_medium=¿Valoras la libertad de la Humanidad? Si es así, te ofrezco la oportunidad de demostrarlo. Escaneos recientes descubrieron centinelas orbitales y naves patrullando en ~mission(location|address). Creemos que son parte de una campaña de espionaje de la UEE dirigida a XenoThreat. Es importante que detengamos su recopilación de inteligencia antes de lanzar nuestra próxima misión.\n\nBuscamos un mercenario experimentado dispuesto a eliminar estas fuerzas de inmediato. Los centinelas son la prioridad, pero las naves podrían ser un problema mayor si se les permite escapar. Tendrás que evaluar la situación más de cerca una vez que estés en el lugar.\n\nPodríamos encargarnos nosotros mismos, pero queremos enviar a un contratista para que la escoria detrás de esto no sepa quién los golpeó. Se enviará el pago puntualmente tras la finalización. Además, la satisfacción de saber que estás ayudando a una buena causa.\n\nComm. Spec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostile Wave x4, Prospectors x2\n<EM4>Turrets:</EM4> 3 (hostile)
XenoThreat_claimsweep_desc_rand=Parece que la UEE está intensificando sus esfuerzos para detener nuestro movimiento. Uno de nuestros pilotos descubrió algunos centinelas orbitales y naves en ~mission(location|address). Creemos que son parte de una campaña de espionaje de la UEE dirigida a XenoThreat y es vital que se detenga antes de que reúnan algo que pueda dañar nuestros esfuerzos en curso.\n\nBuscamos un mercenario hábil dispuesto a eliminar esta amenaza y detener esta invasión de privacidad antes de que se propague aún más. ¿Quién sabe cuán grande será esta operación si no se desconecta de inmediato? El pago hará que valga la pena y se enviará puntualmente una vez que todo esté hecho.\n\nSee it done, and help be a part of the right side of history.\n\nComm. Spec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostile Wave x32, Prospectors x5\n<EM4>Turrets:</EM4> 4 (hostile)
