hurston_RetrieveConsignment_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Barrido de Instalaciones y Recuperación de Paquetes\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: G. Livingston\nEVALUACIÓN DE RIESGOS: Alto\nCONTRATO URGENTE: Sí\n\nHurston ha sabido que los Nine Tails están atacando ~mission(Location|address). Nuestras fuerzas en el lugar han sufrido bajas importantes y dejaron de responder a las comunicaciones. Informes iniciales indicaron que la banda intentaba obtener material confidencial entregado recientemente a la instalación. Afortunadamente, contamos con medidas de seguridad que deberían darnos tiempo para responder. Necesitamos un agente que se dirija de inmediato a la instalación, recupere esas cajas y las entregue a una ubicación segura.\n\nUsted y cualquier respaldo que elija llevar tienen autorización para tomar cualquier medida necesaria al enfrentarse a los intrusos. Se considera que los sospechosos están armados y son peligrosos. Hurston no proporcionará apoyo material y/o actualizaciones sobre el estado de las fuerzas de seguridad de la instalación. \n\nLos materiales confidenciales fueron entregados discretamente junto con otras cajas en un envío y se cerraron en nuestra bóveda automatizada con códigos de acceso guardados en datapads por personal de seguridad de alto rango. Sin embargo, existe una fuerte posibilidad de que los Nine Tails ya los hayan conseguido. Deberá encontrar esos datapads y luego ingresar los códigos en el transportador de paquetes para recuperar los materiales confidenciales. El pago se enviará una vez que hayan sido entregados en ~mission(dropoff1|address). \n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso de esta información por parte de personas o entidades que no sean el destinatario previsto está prohibido. **\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
hurston_RetrieveConsignment_title_001=Defender el Sitio y Recuperar Materiales Confidenciales <EM4>[500–4,000 Rep]</EM4>
hurston_UGF_defend_E_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Protección de Instalaciones\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: T. Spooner\nEVALUACIÓN DE RIESGOS: Alto\nCONTRATO EXPRESS: No\n\nUna pequeña banda local ha estado haciendo amenazas contra ~mission(Location|Address) y Hurston Security está buscando a un contratista para reunir un equipo de seguridad y proteger la instalación contra cualquier incursión.\n\nEl pago se enviará una vez que se confirme que la instalación está segura. \n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o toma de acciones basadas en esta información por parte de personas o entidades que no sean el destinatario previsto está prohibido. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x1, Hostiles x10, Private Security x4, Sentries x6
hurston_UGF_defend_E_title_001=Instalacion de guardia contra amenazas <EM4>[500 Rep]</EM4>
hurston_UGF_defend_VH_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Protección de Instalaciones\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE EXTERNALIZACIÓN: T. Spooner\nEVALUACIÓN DE RIESGOS: Muy Alto\nCONTRATO EXPRESS: No\n\nUna facción creciente de forajidos ha estado haciendo amenazas contra ~mission(Location|Address) y Hurston Security necesita un contratista para reunir un equipo de seguridad y protección la instalación contra cualquier incursión.\n\nEl pago se enviará una vez que se confirme que la instalación está segura. \n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o toma de acciones basadas en esta información por parte de personas o entidades que no sean el destinatario previsto está prohibido. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x3, Hostiles x8, Private Security x4, Sentries x4
hurston_UGF_defend_VH_title_001=Proteger la Instalación Contra Hostiles Peligrosos <EM4>[500 Rep]</EM4>
hurston_UGF_defend_desc_001=pu defend lawful stanton1 h\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x8, Private Security x4, Sentries x8
