Redwind_internaldelivery_dc_desc_001=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nLos individuos en ~mission(Location) están realizando una limpieza y desean mover algunos paquetes dentro del recinto.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) desde ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) desde ~mission(Pickup2)\n\nDESTINOS DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n\nNecesitan que se realice de manera eficiente y sin muchas molestias.\n\nNO ACEPTES ESTE CONTRATO si no eres confiable. Red Wind tiene una reputación que nuestros clientes confían y por buenas razones. \n\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Redwind_internaldelivery_dc_desc_003=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nHay algunas cajas que necesitan ser reorganizadas en ~mission(Location|Address).\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) desde ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) desde ~mission(Pickup2)\n     · Paquete n.º ~mission(item3|serialnumber) desde ~mission(Pickup3)\n     · Paquete n.º ~mission(item4|serialnumber) desde ~mission(Pickup4)\n\nDESTINOS DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n     · Paquete n.º ~mission(item3|serialnumber) a ~mission(Dropoff3)\n     · Paquete n.º ~mission(item4|serialnumber) a ~mission(Dropoff4)\n\n\nA TODOS LOS VETERANOS - ¡Red Wind aprecia su servicio a nuestro Imperio! ¡Sus luchas significan nuestra libertad! \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
Redwind_internaldelivery_dc_desc_005=RED WIND LINEHAUL\n'YOUR GOODS IN GOOD HANDS'\n----------------------------\n\nParece que hubo un pequeño problema logístico en ~mission(Location|Address) y necesitan a alguien para asegurarse de que los paquetes extraviados terminen donde deben dentro del recinto.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) desde ~mission(Pickup1)\n     · Paquete n.º ~mission(item2|serialnumber) desde ~mission(Pickup2)\n     · Paquete n.º ~mission(item3|serialnumber) desde ~mission(Pickup3)\n     · Paquete n.º ~mission(item4|serialnumber) desde ~mission(Pickup4)\n     · Paquete n.º ~mission(item5|serialnumber) desde ~mission(Pickup5)\n     · Paquete n.º ~mission(item6|serialnumber) desde ~mission(Pickup6)\n\n\nDESTINOS DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.º ~mission(item1|serialnumber) a ~mission(Dropoff1)\n     · Paquete n.º ~mission(item2|serialnumber) a ~mission(Dropoff2)\n     · Paquete n.º ~mission(item3|serialnumber) a ~mission(Dropoff3)\n     · Paquete n.º ~mission(item4|serialnumber) a ~mission(Dropoff4)\n     · Paquete n.º ~mission(item5|serialnumber) a ~mission(Dropoff5)\n     · Paquete n.º ~mission(item6|serialnumber) a ~mission(Dropoff6)\n\n\n\nLA CONFIANZA ES BIDIRECCIONAL - Al aceptar este contrato, te comprometes a no traicionarnos, y Red Wind Linehaul se compromete a tratarte de la misma manera. \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +2,000
Redwind_internaldelivery_dc_title_001=Manipulador de Paquetes de Red Wind - ~mission(Location|Address), ~mission(Pickup1), ~mission(Pickup2) > ~mission(Dropoff1), ~mission(Dropoff2) <EM4>[500–2,000 Rep]</EM4>
RepairOxygenKiosk_DescriptionLong=Hola Invitados,\n\nRecientemente nos alertaron de que uno de nuestros Dispensadores de Oxígeno ha experimentado un error técnico. Como saben, estos puestos son vitales para asegurarse de que tengan suficiente oxígeno a mano mientras participan en nuestro Programa de Liberación Laboral.\n\nEstamos buscando a cualquier invitado disponible para reiniciar el puesto. Eso debería reconectar el puesto a la red y resolver el problema. El primer invitado que logre completar esta tarea no solo será compensado con méritos, sino también con la satisfacción de estar haciendo el lugar de trabajo más seguro para otros invitados.\n\nGracias.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100
RepairOxygenKiosk_Title=Oportunidad de mantenimiento para reclusos <EM4>[100 Rep]</EM4>
ResourceRush_Lawful_desc_001=pu resourcerush prototype\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
RetakeLocation_MissionDescription=~mission(Contractor|RetakeLocationDescription)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
RetrieveDatapad_desc=Tuve un poco de mala suerte y estoy esperando que puedas ayudarme a solucionarlo.\n\nHace unos días, contraté a la tripulación del 'Pride of Arliss' para obtener algunos datos importantes para mí. Hicieron el trabajo sin problemas, pero el maldito capitán me envió una comunicación exigiendo más créditos. Resulta que no fue la primera vez que intentó este truco, porque en medio de la "negociación", su nave fue atacada por algunas personas muy enfadadas que buscaban enseñarle una lección.\n\nNuestra comunicación se cortó cuando empezaron los disparos y esa fue la última vez que supe de él. Supongo que está prácticamente desaparecido, pero quiero que vayas al Pride of Arliss y trates de obtener mis datos del datapad personal del capitán.\n\nUna vez que lo tengas, he configurado un canal de transmisión segura en la estación de descanso ARC-L1. Viaja allí y cuando estés dentro del alcance, envía los datos a través de este contrato para que te paguen.\n  \nNo intentes estafarme. El karma puede ser realmente desagradable.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Roughready_bounty_desc_002=Rough & Ready ha estado en negocios con ~mission(TargetName) durante años, pero esa relación ha tomado un giro para peor. Durante un tiempo, les estábamos suministrando combustible a crédito, pero cuando llegó el momento de cobrar, el cobarde se escondió. Si ~mission(TargetName|Last) no puede pagar con créditos, supongo que pagará con su vida.\n\nUn asociado acaba de localizar a ~mission(TargetName|Last) en ~mission(Location|Address). Me encantaría que fueras allí ahora para hacer que el moroso pague.\n\nPor cierto, parece que ~mission(TargetName|Last) no está viajando solo, así que asegúrate de estar completamente abastecido antes de ir tras ellos.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
Roughready_destroyitems_fuel_desc_01=Si estás en busca de algunos créditos fáciles, tengo una oferta para ti.\n\nResulta que ~mission(location|address) está operando como un reabastecidor de combustible. Deben no haber recibido el mensaje de que el comercio de combustible en Pyro pertenece a Rough & Ready.\n\nEs por eso que te dirigirás allí y destruirás sus reservas de combustible. Deberían ser fáciles de identificar. Son los grandes tanques de almacenamiento amarillos repartidos alrededor del puesto avanzado. Ten cuidado, sin embargo, hay emplazamientos de torretas defendiendo la zona, así que asegúrate de estar listo para esquivar sus disparos o volar las defensas por los aires.\n\nTe dejo a ti cómo manejar la demolición. Las bombas serían mi primera opción, pero no me importa mucho mientras se haga el trabajo.\n\n- Smokey\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50\n<EM4>Turrets:</EM4> present (hostile)
Roughready_destroyitems_fuel_title_01=De la Gasolina al Fuego <EM4>[50 Rep]</EM4>
Ruto_Assassin_Sync_E_Desc=Aquí está el trato. ~mission(TargetName) y ~mission(TargetName2) necesitan morir al mismo tiempo. Desafortunadamente, no van a estar en el mismo lugar.\n\nUn doble golpe puede sonar complicado, pero si contratas algunas armas adicionales, no debería ser tan difícil hacer dos asesinatos simultáneos.\n\nAsegúrate de encontrar personas con habilidades, ya que tengo información fiable de que cada uno estará volando con algunos escoltas como "protección."\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x2
Ruto_Assassin_Sync_E_Title=juntos por siempre <EM4>[500 Rep]</EM4>
Ruto_Assassin_Sync_H_Desc=Tengo otra pareja que necesita morir simultáneamente. Parece estar volviéndose cada vez más popular como opción de asesinato.\n\nEsta vez son ~mission(TargetName) y ~mission(TargetName2). Ambos se supone que son operadores bastante hábiles y no estarán volando solos.\n\nAsegúrate de que quienquiera que consigas para ayudarte en este asunto pueda desenvolverse en una pelea.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x2
Ruto_Assassin_Sync_H_Title=el doble de dolor de cabeza <EM4>[500 Rep]</EM4>
Ruto_Assassin_Sync_Intro_Desc=Adivina qué tienen en común ~mission(TargetName) y ~mission(TargetName2).\n\n¡Los vas a matar a ambos!\n\nLa parte difícil es que necesito que los mates al mismo tiempo para que uno no tenga la oportunidad de escapar, o peor aún, matar a la persona que intenta matarlos.\n\nAsí que forma un equipo para rastrear a un objetivo mientras te ocupas del otro. ¡Divide y vencerás!\n\nY a pesar de que se metieron en un lío lo suficientemente grande como para que los mataran, tengo entendido que son relativamente débiles. No espero que encuentres mucha resistencia.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x1, Targets x2
Ruto_Assassin_Sync_Intro_Title=lanzamiento simultáneo <EM4>[500 Rep]</EM4>
Ruto_Assassin_Sync_M_Desc=Realmente espero que no seas amigo de ~mission(TargetName) o ~mission(TargetName2), porque necesito que desaparezcas a ambos... al mismo tiempo...\n\nPor supuesto, no lo pondrían fácil y viajarían en la misma nave o algo así obviamente. No. Vas a tener que formar un equipo para que puedas derribar a ambos objetivos simultáneamente.\n\nTan pronto como uno de ellos esté muerto, prepárate para eliminar al otro también. No podemos arriesgarnos a que alguno de ellos escape.\n\nY creo que debería mencionar que no solo son pilotos bastante buenos, sino que también viajarán con refuerzos. Nada que no puedas manejar, estoy seguro.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x2
Ruto_Assassin_Sync_M_Title=amigos hasta el final <EM4>[500 Rep]</EM4>
Ruto_Assassin_Sync_S_Desc=Si me hubieras preguntado, habría dicho que ~mission(TargetName) y ~mission(TargetName2) terminarían matándose entre ellos. Pero en cambio, vas a tener el honor de matarlos a ambos al mismo tiempo.\n\nVas a tener que trabajar para lograrlo, sin embargo.\n\nCada uno es un problema. Registros serios, altamente entrenados y demasiado inteligentes para volar sin respaldo.\n\nReúne al mejor equipo que puedas en este caso. Lo necesitarás. Y no seas tacaño. No puedes gastar créditos si estás muerto.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x2
Ruto_Assassin_Sync_S_Title=doble problema <EM4>[500 Rep]</EM4>
Ruto_Assassin_Sync_VE_Desc=Es bastante conmovedor cuando te encuentras con una pareja dispuesta a morir el uno por el otro. Estúpido pero conmovedor.\n\n~mission(TargetName) y ~mission(TargetName2) eligieron estar juntos y ahora eso los llevó a la muerte.\n\nEncuentra un amigo y persigue a cada uno de estos dos. Asegúrate de matarlos al mismo tiempo. Llámalo justicia poética.\n\nDeberían morir bastante fácil. Tal vez tengan una nave o dos con ellos, pero no creo que sea algo de qué preocuparse.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x2, Targets x2
Ruto_Assassin_Sync_VE_Title=hasta que la muerte nos separe <EM4>[500 Rep]</EM4>
Ruto_Assassin_Sync_VH_Desc=~mission(TargetName) y ~mission(TargetName2). Creo que pueden estar relacionados. ¿O están saliendo juntos? Realmente no importa, alguien quiere que los maten.\n\nHe organizado las cosas para que los puedas atacar cuando no estén volando juntos. Más seguro para ti de esta manera. Ambos son asuntos serios y vuelan con respaldo igualmente serio.\n\nAsegúrate de que tú y tu tripulación sincronicen sus ataques. No quiero que quede ninguno de ellos vivo, o será un verdadero dolor de cabeza.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x2
Ruto_Assassin_Sync_VH_Title=Dos por el precio de dos <EM4>[500 Rep]</EM4>
