recovery_desc=~mission(Contractor|RecoverItemDescription)\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n<EM4>[Nyx]</EM4>\n- Monde Arms Delta Camo\n- Monde Arms Hemlock Camo\n- Monde Core Delta Camo\n- Monde Core Hemlock Camo\n- Monde Helmet Delta Camo\n- Monde Helmet Hemlock Camo\n- Monde Legs Delta Camo\n- Monde Legs Hemlock Camo\n- R97 "Kismet" Shotgun\n- R97 "Righteous" Shotgun\n- R97 Shotgun Magazine (18 cap)\n- Arden-SL Arms\n- Arden-SL Core\n- Arden-SL Helmet\n- Arden-SL Legs\n- Custodian "Midnight" SMG\n- Custodian "Scorched" SMG\n- Custodian SMG\n- Custodian SMG Magazine (60 cap)\n\n<EM4>[Stanton]</EM4>\n- Inquisitor Arms Black\n- Inquisitor Arms Grey\n- Inquisitor Core Black\n- Inquisitor Core Grey\n- Inquisitor Legs Black\n- Inquisitor Legs Grey\n- Lumin V SMG\n- Lumin V SMG Battery (45 cap)\n- Morningstar Helmet Icefall\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain\n<EM4>Difficulty (1-7):</EM4> Combat 4/7 | Complexity 4/7 | Risk 4/7 | Knowledge 3/7\n<EM4>Jr. Contractor:</EM4> +100 Rep (Contractor)\n<EM4>Blueprint Reward:</EM4> Guaranteed
