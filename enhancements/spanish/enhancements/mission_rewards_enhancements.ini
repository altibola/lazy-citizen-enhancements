BrightSky_Desc=La CDF se ha asociado con Anvil Aerospace para encontrar los agentes mas capaces del sistema. \n\nSi encuentra una de estas certificaciónes Platinum, puede canjear el boleto en un puesto de naves en New Deal, Astro Armada o Crusader Showroom por un F8C gratuito. \n\nEl problema es que su identidad y ubicación se han compartido con los participantes en todo el sistema. Para todos los demas, si puedes detener al titular del boleto antes de que llegue al puesto, puedes reclamar el boleto para ti.\n\nQuien lo logre no solo recibira este fighter de superioridad de proxima generacion, sino que tambien demostrara que tiene lo necesario para el Las tareas mas dificiles de la CDF.\n\nBuena suerte.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
