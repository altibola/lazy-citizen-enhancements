missionManager_Charlie_Description=Necesidad inmediata de un investigador privado experimentado y discreto cerca de Crusader para investigar un asunto de seguros. \n\n Tarifa plana. Sin gastos. La fecha de inicio será lo mas pronto posible. Se deben presentar pruebas suficientes para completar el contrato.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique
mtps_RetrieveConsignment_desc_001=SOBRE EL TRABAJO\nLos Servicios de Protección microTech necesitan a un profesional de seguridad para una operación de recuperación en ~mission(Location). El lugar está actualmente bajo ataque y las fuerzas de seguridad en el lugar no responden y se presume que están muertas. Creemos que los materiales confidenciales entregados recientemente a la instalación para su almacenamiento temporal fueron el objetivo del ataque. Tu enfoque principal será recolectar esas cajas y entregarlas a un lugar seguro.\n\nPor razones de seguridad, los materiales confidenciales se entregaron como parte de un envío más grande y se aseguraron en la bóveda automatizada. Los materiales tienen códigos de recuperación únicos que deben ingresarse en el teclado en el transportador de paquetes. Los protocolos requieren que solo los oficiales de seguridad senior puedan llevar un datapad que contenga un código, pero considerando la situación volátil, no podemos garantizar que los Nine Tails no los hayan tomado. Una vez asegurados, entrega todos los materiales confidenciales a ~mission(dropoff1) para el pago.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|address).\n• Utilizar la fuerza según sea necesario para recoger los materiales confidenciales.\n• Entregar los materiales confidenciales a ~mission(dropoff1|address).\n\nCALIFICACIONES MÍNIMAS\n• 2 años de experiencia combinada como mercenario y/o en seguridad.\n• Acceso a equipos de combate.\n• Acceso a una nave espacial que pueda transportar carga.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Experiencia con técnicas de reducción rápida de hostilidades.\n• Experiencia transportando carga importante.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +2,000
mtps_RetrieveConsignment_title_001=Defiende el Lugar y Entrega Materiales Confidenciales <EM4>[500–4,000 Rep]</EM4>
mtps_UGF_defend_E_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services busca un profesional mercenario detallista que pueda reunir un equipo de seguridad para proteger ~mission(Location|Address) contra posibles amenazas menores. \n\nRESPONSABILIDADES\n• Proporcionar tu propio transporte a ~mission(Location|Address).\n• Proporcionar tu propio equipo de seguridad para ayudar.\n• Proteger el sitio contra amenazas hostiles; usando la fuerza según sea necesario.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Experiencia en la gestión de un equipo.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x1, Hostiles x10, Private Security x4, Sentries x6
mtps_UGF_defend_E_title_001=Defender la Ubicación Contra Amenazas Menores <EM4>[500 Rep]</EM4>
mtps_UGF_defend_VH_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services busca un profesional mercenario detallista que pueda reunir un equipo de seguridad para proteger ~mission(Location|Address) contra graves amenazas hostiles. \n\nRESPONSABILIDADES\n• Proporcionar tu propio transporte a ~mission(Location|Address).\n• Proporcionar tu propio equipo de seguridad para ayudar.\n• Proteger el sitio contra amenazas hostiles; usando la fuerza según sea necesario.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Experiencia en la gestión de un equipo.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x3, Hostiles x8, Private Security x4, Sentries x4
mtps_UGF_defend_VH_title_001=Defender la Ubicación Contra Serias Amenazas. <EM4>[500 Rep]</EM4>
mtps_UGF_defend_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services busca un profesional mercenario detallista que pueda reunir un equipo de seguridad para proteger ~mission(Location|Address) contra amenazas hostiles. \n\nRESPONSABILIDADES\n• Proporcionar tu propio transporte a ~mission(Location|Address).\n• Proporcionar tu propio equipo de seguridad para ayudar.\n• Proteger el sitio contra amenazas hostiles; usando la fuerza según sea necesario.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Experiencia en la gestión de un equipo.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x8, Private Security x4, Sentries x8
mtps_UGF_defend_title_001=Defender la Ubicación Contra Amenazas Moderadas <EM4>[500 Rep]</EM4>
mtps_UGF_destroy_E_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services busca un profesional mercenario o de seguridad detallista para informar a ~mission(Location|Address) y destruir el contrabando almacenado allí. \n\nRESPONSABILIDADES\n• Proporcionar tu propio transporte a ~mission(Location|Address).\n• Limpiar el sitio de contrabando; usando la fuerza según sea necesario.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Sin problemas de adicción en curso.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x8\n<EM4>Friendlies:</EM4> Civilians x4
mtps_UGF_destroy_E_title_001=Limpiar el Sitio de Contrabando <EM4>[500 Rep]</EM4>
mtps_UGF_destroy_H_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services busca un profesional mercenario o de seguridad detallista para informar a ~mission(Location|Address) y destruir los narcóticos almacenados allí. \n\nRESPONSABILIDADES\n• Proporcionar tu propio transporte a ~mission(Location|Address).\n• Limpiar el sitio de narcóticos; usando la fuerza según sea necesario.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Sin problemas de adicción en curso.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
mtps_UGF_destroy_H_title_001=Limpiar el Sitio de Narcóticos <EM4>[500 Rep]</EM4>
mtps_UGF_destroy_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services está buscando un profesional de seguridad detallista o un mercenario que informe a ~mission(Location|Address) y destruya las drogas almacenadas allí. \n\nRESPONSABILIDADES\n• Proporcionar su propio transporte a ~mission(Location|Address).\n• Limpiar el sitio de drogas; usando la fuerza según sea necesario.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• No tener problemas de adicción en curso.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Friendlies:</EM4> Civilians x4
mtps_UGF_destroy_title_001=Limpiar el Sitio de Drogas <EM4>[500 Rep]</EM4>
mtps_UGF_eliminateall_allies_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services está buscando un profesional de seguridad detallista que pueda ayudar rápidamente y de manera segura al equipo de seguridad ubicado en ~mission(Location|Address) para proteger el sitio contra amenazas hostiles. \n\nTenga en cuenta que no se tolerará ningún fuego amigo, ya sea accidental o no. \n\nRESPONSABILIDADES\n• Proporcionar su propio transporte a ~mission(Location|Address).\n• Ayudar al equipo de seguridad local a proteger el sitio; usando la fuerza según sea necesario.\n• Evitar cualquier incidente de fuego amigo.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Experiencia con técnicas de desescalada rápida de hostilidades.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
mtps_UGF_eliminateall_allies_desc_intro=SOBRE EL TRABAJO\nmicroTech Protection Services necesita nuevos profesionales de seguridad cualificados y detallistas para ampliar nuestra lista existente. Para evaluar sus habilidades, nos gustaría que ayudara a proteger ~mission(Location|Address) contra amenazas hostiles. \n\nRESPONSABILIDADES\n• Proporcionar su propio transporte a ~mission(Location|Address).\n• Ayudar a proteger el sitio; usando la fuerza según sea necesario.\n• Evitar cualquier incidente de fuego amigo.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Experiencia con técnicas de desescalada rápida de hostilidades.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
mtps_UGF_eliminateall_allies_desc_rehire=SOBRE EL TRABAJO\nAunque su desempeño pasado no ha estado a la altura de nuestros estándares, microTech Protection Services ha decidido ofrecerle la oportunidad de redimirse. \n\nEn un esfuerzo por reevaluar sus habilidades, microTech Protection Services le gustaría que ayudara a proteger ~mission(Location|Address) contra amenazas hostiles. \n\nRESPONSABILIDADES\n• Proporcionar su propio transporte a ~mission(Location|Address).\n• Ayudar a proteger el sitio; usando la fuerza según sea necesario.\n• Evitar cualquier incidente de fuego amigo.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Experiencia con técnicas de desescalada rápida de hostilidades.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
