headhunters_eliminatespecific_desc_001=Acaba de caer en mis manos información interesante. Parece que el notorio líder de XenoThreat, ~mission(TargetName), está refugiado en ~mission(location|address) trabajando en alguna gran operación para ellos. Oportunidad perfecta para matar al maldito de una vez por todas.\n\nEl problema es que los Xenos tienen sus ojos en todas las operaciones de Headhunter en este momento. No hay forma de que podamos movilizarnos y desplegar un equipo sin que ~mission(TargetName|Last) se entere. Así que te ofrezco la oportunidad de mejorar Pyro y ganar algunos créditos al mismo tiempo.\n\nSi estás interesado, te sugiero que te prepares y encuentres algo de apoyo antes de salir. Solo te pagarán si eliminas a ~mission(TargetName|Last), pero no dudes en matar a cualquier otro pequeño XenoThug que pueda estar escondido allí con él. \n\nFin de la transmisión out.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Hostiles x1
