MTPS_eliminateall_dc_desc_001=SOBRE EL TRABAJO\nServicios de Protección de microTech está buscando un profesional mercenario detallista que pueda ayudarnos de manera rápida y segura en la eliminación completa del grupo de forajidos que temporalmente han ganado control sobre ~mission(Location) en ~mission(Location|Dirección).\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Dirección).\n• Eliminar a todos los miembros de la fuerza forajida hostil; utilizando la fuerza según sea necesario.\n\nCALIFICACIONES MÍNIMAS\n• 2 años de experiencia combinada como mercenario y seguridad.\n• Acceso a equipamiento de combate y modo de transporte.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Experiencia con técnicas rápidas de desescalada de hostilidades.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
MTPS_eliminateall_dc_title_001=Eliminar Fuerza Hostil <EM4>[500 Rep]</EM4>
MTPS_eliminateboss_dc_desc_001=SOBRE EL TRABAJO\nServicios de Protección de microTech está buscando un cazador de recompensas calificado para capturar a ~mission(TargetName), quien hasta ahora ha logrado evadir la captura. Están coordinando un ataque activo en ~mission(Location|Dirección), y creemos que finalmente podrían ser atraídos para salir de su escondite si sus fuerzas atacantes allí, atacan a ~mission(Location) se enfrentan a una resistencia lo suficientemente fuerte.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Dirección).\n• Neutralizar a los asociados criminales de ~mission(TargetName) cerca de ~mission(Location) para atraer al objetivo al descubierto.\n• Neutralizar a ~mission(TargetName); utilizando la fuerza si es necesario.\n\nCALIFICACIONES MÍNIMAS\n• Acceso a equipamiento de combate y modo de transporte.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
MTPS_eliminateboss_dc_title_001=Atrapar Recompensa: ~mission(TargetName) (HRT) <EM4>[500 Rep]</EM4>
MTPS_eliminateboss_multi_dc_desc_001=SOBRE EL TRABAJO\nServicios de Protección de microTech está buscando un cazador de recompensas calificado para capturar a ~mission(TargetName) quien hasta ahora ha logrado evadir la captura. Están coordinando un ataque activo que se ha extendido por todo ~mission(Location|Dirección). \n\nNuestra esperanza es que puedas finalmente sacarlos de su escondite si confrontas sus fuerzas en varios puntos de ataque diferentes. Con sus números debilitados lo suficiente, ~mission(TargetName|Last) probablemente arriesgará la exposición y podrás enfrentarlo directamente.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Dirección).\n• Enfrentar a los asociados criminales de ~mission(TargetName) para atraer al objetivo al descubierto.\n• Neutralizar a ~mission(TargetName); utilizando la fuerza si es necesario.\n\nCALIFICACIONES MÍNIMAS\n• Acceso a equipamiento de combate y modo de transporte.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Backup x5, Juggernauts x1, Soldiers x18, Technicians x32
MTPS_eliminateboss_multi_dc_title_001=Segurar Recompensa: ~mission(TargetName) (VHRT) <EM4>[1,000 Rep]</EM4>
MTPS_eliminatespecific_dc_desc_001=SOBRE EL TRABAJO\nServicios de Protección de microTech está buscando un cazador de recompensas calificado para capturar a ~mission(TargetName) desde ~mission(Location|Dirección). Fueron vistos recientemente cerca de ~mission(Location) y se cree que aún están en esa área.\n\nAunque puede haber otros criminales activos en el sitio, tu enfoque principal debe ser completar la recompensa.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Dirección).\n• Neutralizar a ~mission(TargetName); utilizando la fuerza según sea necesario.\n\nCALIFICACIONES MÍNIMAS\n• Acceso a equipamiento de combate y modo de transporte.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Juggernauts x1, Snipers x5, Soldiers x14
MTPS_eliminatespecific_dc_title_001=Recompensa Activa: ~mission(TargetName) (MRT) <EM4>[500 Rep]</EM4>
MTPS_searchbody_danger_dc_desc_001=pu missingperson distributioncentres stanton4 mts4ld13 auditor\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
MTPS_searchbody_dc_desc_001=SOBRE EL TRABAJO\nDespués de recibir un informe de que ~mission(TargetName) ha desaparecido, Servicios de Protección de microTech está buscando un contratista calificado para comenzar una búsqueda en el sitio de ~mission(Location|Dirección) para conocer su paradero actual. La persona desaparecida fue vista por última vez entrando en ~mission(Location) por lo que se recomienda comenzar la búsqueda allí.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|dirección).\n• Confirmar la ubicación de ~mission(TargetName) y si aún están con vida.\n\nCALIFICACIONES MÍNIMAS\n• 2 años de experiencia en seguridad.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Experiencia en la realización de investigaciones de personas desaparecidas.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
NTLockdown_FleetDestroy_Antagonist_MBroker_desc=Ahora que Crusader encontro su flota, parece que Nine Tails finalmente se dieron cuenta de lo util que puede ser un poco de ayuda adicional. \n\n Para resumir, están buscando algun musculo contratado para mantener a raya a Crusader. Tu y todos los que se ofrezcan como voluntarios recibiran un pago por cada nave de seguridad que derriben. \n\nY ademas de eso, si todos ustedes mantienen a Crusader ocupado el tiempo suficiente para que Nine Tails terminen lo que sea que  estén haciendo con este bloqueo cuantico, obtendran una gran bonificacion.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
NTLockdown_FleetDestroy_MBroker_desc=Crusader Security ha confirmado la ubicación de la flota forajida Nine Tails responsable y se está movilizando ahora para poner fin al bloqueo cuantico de ~mission(Location).\n\n Nuevamente estamos buscando profesionales de seguridad capacitados para unirse a nuestros esfuerzos de respuesta de emergencia y ayudar a neutralizar esta peligrosa amenaza. \n\n Antes de aceptar, tenga en cuenta que se espera que las Nine Tails ofrezcan una resistencia considerable y que hasta que finalice el bloqueo, los viajes cuanticos no será posible en el sector.\n\nCONTRATO AUTORIZADO POR:\nDirectora Sasha Rust\nID# 122L964G\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +4,000
NTLockdown_FleetDestroy_MBroker_name=Bloqueo ilegal: neutralizacion de la flota de Nine Tails <EM4>[4,000 Rep]</EM4>
NTLockdown_FleetFind_Antagonist_MBroker_desc=Les dije a los Nine Tails que bloquear los viajes cuanticos para mantener como rehen a toda un area atraeria el tipo de atencion equivocado, pero ¿me escuchan? No. Ahora Crusader tiene docenas de naves de escaneo metiendo sus narices en cosas que preferiria permanecer ocultas. \n\nEs por eso que estoy tratando de contratar a tanta gente como pueda para que me ayuden. Quiero pagarte por cada nave de exploracion Crusader que saques. \n\n De hecho, igualare su tasa por nave si todos ustedes alcanzan una cierta cantidad de muertes. Llamalo incentivo de rendimiento.\n\nY si realmente te sientes como un triunfador, elimina a los tontos lo suficientemente valientes como para intentar llevar carga a la estación bloqueada. Tengo algunos proveedores que agradeceran la demanda adicional.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
NTLockdown_FleetFind_MBroker_desc=Crusader Security se ha enterado de que la organizacion criminal conocida como Nine Tails ha establecido un bloqueo ilegal alrededor de ~mission(Location) y detuvo todo el trafico cuantico entrante y saliente en el sector.\n\nSe debe localizar la flota forajida y terminar el bloqueo.\n\nSolicitamos urgentemente que cualquier profesional de seguridad capacitado en el sistema se una a las fuerzas de Crusader Security y proteja nuestras naves de escaneo mientras buscan el ubicación de la flota de Nine Tails que causa este bloqueo. \n\n Tenga en cuenta que con los viajes cuanticos desactivados y numerosos hostiles en el area, esto debe considerarse una operacion de alto riesgo. Se recomienda encarecidamente que todos los pilotos que se unan a este esfuerzo de respuesta de emergencia tengan equipo adecuado y un tanque lleno de combustible. \n\nCONTRATO AUTORIZADO POR:\nDirectora Sasha Rust\nID# 122L964G\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +4,000
NTLockdown_FleetFind_MBroker_name=Bloqueo ilegal: se busca responsable de la flota de Nine Tails <EM4>[4,000 Rep]</EM4>
NTLockdown_StationSupply_MBroker_desc=El bloqueo cuantico ilegal de ~mission(Location) ha interrumpido las rutas comerciales normales y los productos básicos escasean. \n\nCrusader Security esta buscando comerciantes y transportistas para proporcionar suministros medicos muy necesarios a la estación. \n\nLos precios ofrecidos por la administración de la estación se ajustaran para reflejar la situacion con Nine Tails y, ademas, Crusader proporcionara una bonificacion de riesgo tras la transferencia exitosa de los suministros medicos debido al mayor riesgo. \n\nGracias de antemano por su apoyo durante estos tiempos dificiles.\n\nCONTRATO AUTORIZADO POR:\nDirectora Sasha Rust\nID# 122L964G\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
NorthRock_Delivery_Local_DerelictOutpost_Desc_01=Este es el trato: uno de nuestros clientes (que debería haber gastado los créditos adicionales en una escolta de Northrock) fue atacado y ahora necesitamos tu ayuda para ejecutar una operacion de recuperación de un paquete importante, el cual fue robado.\n\nAfortunadamente, tuvimos un respiro y pudimos localizar a los responsables de ~mission(Pickup1|Address). Necesitamos que vayas allí y recuperes el paquete. Podras identificarlo por su numero de serie: #~mission(item1|serialnumber)\n\nSuponemos que los piratas opondran resistencia, pero recuerda que no son la prioridad.\n\nUna vez recojas el paquete, llevalo de vuelta al cliente en ~mission(Dropoff1|Address).\n\nUna última cosa, asegurate de llevar una nave que tenga suficiente espacio para llevar el paquete. No quiero que llegues hasta allí en una Argo Cargo o una Gladius solo para tener que volver con las manos vacias.\n\nHaznos sentir orgullosos,\n\nBraden Corchado\nOficial de logistica - Sucursal de Stanton\nNorthrock Service Group\n\n* RESUMEN DE OPERACIONES DE RECUPERACIÓN *\n* Recuperar paquete #~mission(item1|serialnumber) en: ~mission(Pickup1|Address)\n* Entregar en: ~mission(Dropoff1|Address)\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
NorthRock_Delivery_Local_DerelictOutpost_Desc_02=Este es el trato: uno de nuestros clientes (que debería haber gastado los créditos adicionales en una escolta de Northrock) fue atacado y ahora necesitamos tu ayuda para ejecutar una operacion de recuperación de algunos paquetes importantes que fueron robados.\n\nAfortunadamente, tuvimos un respiro y pudimos localizar a los responsables de ~mission(Pickup1|Address). Necesitamos que vayas allí y recuperes los paquetes. Podras identificarlos por sus numeros de serie: #~mission(item1|serialnumber),\n#~mission(item2|serialnumber) y #~mission(item3|serialnumber).\n\nSuponemos que los piratas opondran resistencia, pero recuerda que no son la prioridad.\n\nUna vez tengas los paquetes, entregalos en sus respectivos destinos: ~mission(Dropoff1|Address), ~mission(Dropoff2|Address) y ~mission(Dropoff3|Address).\n\nUna última cosa, asegurate de llevar una nave que tenga suficiente espacio para llevar los paquetes. No quiero que llegues hasta allí en una Argo Cargo o una Gladius solo para tener que volver con las manos vacias.\n\nHaznos sentir orgullosos,\n\nBraden Corchado\nOficial de logistica - Sucursal de Stanton\nNorthrock Service Group\n\n* RESUMEN DE OPERACIONES DE RECUPERACIÓN *\n* Recuperar los paquetes #~mission(item1|serialnumber), #~mission(item2|serialnumber) y #~mission(item3|serialnumber) de: ~mission(Pickup1|Address)\n* Entregalos en: ~mission(Dropoff1|Address), ~mission(Dropoff2|Address) y ~mission(Dropoff3|Address)\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
NorthRock_Delivery_Local_DerelictOutpost_Desc_03=Aquí está el trato – un cliente nuestro (que debería haber gastado los créditos adicionales en una escolta de Northrock) tuvo uno de sus barcos atacado y ahora necesitan que llevemos a cabo una operación de recuperación para recuperar algunos paquetes importantes que fueron robados.\n\nGracias a la suerte, pudimos rastrear a las personas responsables hasta diferentes puestos avanzados abandonados. Necesitamos que vayas allí y recuperes los paquetes. Podrás identificarlos por sus números de serie: #~mission(item1|serialnumber), #~mission(item2|serialnumber) y #~mission(item3|serialnumber).\n\nEspero que los forajidos ofrezcan resistencia, pero recuerda que no son la prioridad.\n\nUna vez que tengas los paquetes, llévalos de vuelta al cliente en ~mission(Dropoff1|Address).\n\nUna última cosa, asegúrate de llevar una nave que tenga suficiente espacio para la carga. No queremos que llegues allí en tu Gladius o lo que sea, solo para tener que dar la vuelta.\n\nHaznos sentir orgullosos,\n\nBraden Corchado\nOficial de Logística - Sucursal de Stanton\nNorthrock Service Group\n\n*RESUMEN DE LA OPERACIÓN DE RECUPERACIÓN*\n* Recuperar los paquetes #~mission(item1|serialnumber), #~mission(item2|serialnumber) y #~mission(item3|serialnumber) de ~mission(Pickup1|Address)\n* Entregar en ~mission(Dropoff1|Address)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
