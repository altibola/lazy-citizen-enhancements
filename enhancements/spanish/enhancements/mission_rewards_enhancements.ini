BHG_Certification_Criminal_Desc=Por recomendacion de uno de nuestros miembros, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener su Licencia de Detencion de Sospechosos.\n\nEsto significaria que esta cualificado para rastrear y detener a sospechosos buscados que han demostrado ser mas esquivos que los objetivos tipicos. A menudo tienen habilidades de pilotaje avanzadas, comportamientos dificiles de predecir y mas recursos que el objetivo promedio, lo que los convierte en un verdadero desafio. \n\nPara completar con exito este proceso de certificación, debe detener al sospechoso: ~mission(TargetName).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_Criminal_Title=Certificación en detención de sospechosos <EM4>[50 Rep]</EM4>
BHG_Certification_Easy_Desc=En base a sus habilidades, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener su Licencia de cazarrecompensas. \n\nEsta licencia significa que esta cualificado para rastrear y capturar objetivos de bajo riesgo (LRT). Estos delincuentes habitualmente vuelan en naves mas pequeñas, pero generalmente tienen escolta, lo que los hace mas desafiantes.\n\nPara completar con exito este proceso de certificación, debes detener a un delincuente clasificado como LRT llamado: ~mission(TargetName). Visto por última vez en: ~mission(Location|Address).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_Easy_Title=Licencia de cazarrecompensas (LRT) <EM4>[50 Rep (Bounty Hunting)]</EM4>
BHG_Certification_EscapedConvict_Desc=Debido al aumento de fugitivos en el area, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener su Licencia de recuperación de Fugitivos.\n\nEsto significa que esta cualificado para rastrear y detenerlos. Estos individuos, a menudo desesperados, pueden resultar bastante dificiles de volver a capturar, ya que requiere habilidades especiales y una mayor intuicion.\n\nPara completar con exito este proceso de certificación, debes detener al fugitivo: ~mission(TargetName).\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_EscapedConvict_Title=Licencia de recuperación de fugitivos (?RT) <EM4>[50 Rep]</EM4>
BHG_Certification_Hard_Desc=A medida que su posición  en la comunidad continua creciendo, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener una licencia de nivel alto. \n\n Esta licencia significaria que esta cualificado para rastrear y capturar objetivos de alto riesgo (HRT). Estos delincuentes pueden viajar en naves multitripulacion mas grandes y con varias escoltas. Las capacidades ofensivas y defensivas adicionales los convierten en objetivos dificiles para todos, excepto para los miembros mas habiles del gremio. \n\n Para completar con exito este proceso de certificación, debes detener a un criminal clasificado HRT llamado: ~mission(TargetName). Visto por última vez en: ~mission(Location|Address).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_Hard_Title=Licencia de cazarrecompensas (HRT) <EM4>[50 Rep (Bounty Hunting)]</EM4>
BHG_Certification_Medium_Desc=Con el progreso que ha logrado en el desarrollo de sus habilidades, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener su licencia de cazarrecompensas nivel medio. \n\n Esta licencia significaria que esta cualificado para rastrear y capturar objetivos de riesgo moderado (MRT). Estos delincuentes tradicionalmente pilotan naves de tamaño mediano con varios escoltas. Esta clase de forajidos constituye la mayor parte de los contratos que los tipicos cazarrecompensas encontraran. \n\n Para completar con exito este proceso de certificación, debe detener a un criminal clasificado en MRT llamado: ~mission(TargetName). Visto por última vez en: ~mission(Location|Address).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_Medium_Title=Licencia de cazarrecompensas (MRT) <EM4>[50 Rep (Bounty Hunting)]</EM4>
BHG_Certification_Super_Desc=Como reconocimiento a su experiencia en el oficio, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener una de cazarrecompensas nivel extremo.\n\nEsta licencia significaria que esta cualificado para rastrear y capturar objetivos de riesgo extremo (ERT). Se trata de delincuentes que viajan en naves subcapitales con escoltas de tipo pesado. Esta clase de misiones solo se asignan a los rastreadores mas experimentados.\n\nPara completar con exito este proceso de certificación, debe detener a un criminal clasificado como ERT llamado: ~mission(TargetName). Visto por última vez en: ~mission(Location|Address).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_Super_Title=Licencia de cazarrecompensas (ERT) <EM4>[50 Rep (Bounty Hunting)]</EM4>
BHG_Certification_VeryEasy_Desc=Según una evaluación de sus habilidades, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener su Licencia de cazarrecompensas nivel muy bajo.\n\nEste permiso significaria que esta cualificado para rastrear y capturar objetivos de muy bajo riesgo (VLRT). Estos delincuentes habitualmente vuelan en naves mas pequeñas y rara vez tienen escolta. Ideal para cazarrecompensas que están comenzando.\n\nPara completar con exito este proceso de certificación, debe detener a un criminal clasificado como VLRT con el nombre de: ~mission(TargetName). Visto por última vez en: ~mission(Location|Address).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_VeryEasy_Title=Licencia de cazarrecompensas (VLRT) <EM4>[50 Rep (Bounty Hunting)]</EM4>
BHG_Certification_VeryHard_Desc=Basandose en tu historial, el Gremio de Cazarrecompensas desea ofrecerle la oportunidad de obtener una Licencia de cazarrecompensas nivel muy alto.\n\nEsta licencia significaria que esta cualificado para rastrear y capturar objetivos de muy alto riesgo (VHRT). Estos delincuentes pueden viajar en naves mas grandes con tripulacion multiple y escolta pesada. Con multiples enemigos con los que lidiar, los encuentros con estos objetivos a menudo pueden ser letales.\n\nPara completar con exito este proceso de certificación, debes detener a un criminal clasificado como VHRT con el nombre de: ~mission(TargetName). Visto por última vez en: ~mission(Location|Address).\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +50
BHG_Certification_VeryHard_Title=Licencia de cazarrecompensas (VHRT) <EM4>[50 Rep (Bounty Hunting)]</EM4>
