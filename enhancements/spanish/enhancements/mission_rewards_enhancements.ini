LingFamily_UGF_collect_desc_001=Hola,\n\nNecesitamos que recojas un envío para nosotros en ~mission(Location|Address) y luego lo lleves a ~mission(Destination|Address).\n\nOriginalmente, iba a enviar a mi hermano Ricki para encargarse de esto, pero dijo que la zona es demasiado peligrosa. Supongo que ha habido muchas advertencias de seguridad por allí, pero siempre y cuando tengas cuidado y lleves algunas armas o lo que sea, estoy seguro de que estarás bien. Probablemente ni te encuentres con nada. \n\nGracias, \nConni Ling\nCoordinador de Envíos\nLing Family Hauling\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
