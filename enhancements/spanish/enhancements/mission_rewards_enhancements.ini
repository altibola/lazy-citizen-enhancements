p_protectandresupply_PreXeno_desc=*PARA PUBLICACIÓN INMEDIATA EN TODO EL SISTEMA*\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Difficulty (1-7):</EM4> 5/7\n<EM4>Rep:</EM4> +4,000
p_protectandresupply_PreXeno_title=Iniciativa de Sobrecarga: Emboscada de Xenothreat - Se Necesita Apoyo <EM4>[4,000 Rep]</EM4>
p_protectandresupply_desc_v2=*PARA PUBLICACION INMEDIATA EN TODO EL SISTEMA*\n\nAtencion, las fuerzas de XenoThreat han estado emboscando a los convoyes espaciales en ruta a la estación INS Jericho en el sistema Stanton. \n\nLa Marina ha solicitado a las fuerzas de las CDF que ayuden a combatir las fuerzas de XenoThreat en el area y/o recuperar suministros de los escombros y entregarlos de manera segura a la estación Jericho. \n\nLa Marina ha organizado un estipendio comunitario para gestionar la distribución del pago. Esto se distribuira entre todos los voluntarios de la FCD en intervalos asignados. Aparecera un indicador en su HUD para medir estos pagos. \n\n Tenga en cuenta que los suministros son muy volatiles si no se manejan correctamente. Tenga cuidado al transportar estos materiales:\n* Zeta-Prolanide se degrada con el tiempo hasta descomponerse por completo.\n* El compuesto AcryliPlex se vuelve explosivamente inestable si se daña.\n* Diluthermex libera un pulso de energía destructivo si se expone a viajes cuanticos.\n\nSAIC Rowena Dulli de Advocacy es el agregado oficial de la CDF y dirigira la operacion.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> 5/7\n<EM4>Rep:</EM4> +4,000
p_protectandresupply_title=ALERTA DE LA CDF: Emboscada de xenothreat: se necesita apoyo <EM4>[4,000 Rep]</EM4>
p_showdown_PreXeno_desc=Atención, las fuerzas navales se han reagrupado para el asalto final que Xenothreat ha estado planeando. La Armada ha solicitado oficialmente la ayuda de cualquier voluntario de la CDF para proporcionar apoyo en combate en este último impulso para asegurar nuestro sistema. Esto incluirá a voluntarios que no hayan participado en la Iniciativa de Override.\n\nSAIC Rowena Dulli de la Advocacy es el agregado oficial de la CDF y estará a cargo de la operación.\n\nSi tiene éxito, esto completará esta serie de la Iniciativa de Override y recibirá acceso temporal a los Hornets F7A o una actualización gratuita si actualmente posee un F7C.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Difficulty (1-7):</EM4> 5/7\n<EM4>Rep:</EM4> +4,000
p_showdown_PreXeno_title=Iniciativa Override: Ataque a Xenothreat <EM4>[4,000 Rep]</EM4>
p_showdown_desc=*PARA PUBLICACIoN INMEDIATA EN TODO EL SISTEMA*\n\nAtencion, las fuerzas navales se han reagrupado para un asalto final contra el grupo de forajidos XenoThreat que ha estado plagando el Sistema Stanton. La Marina ha solicitado oficialmente voluntarios de las CDF para ayudar a brindar apoyo de combate en este ultimo esfuerzo para asegurar nuestro sistema. \n\nSAIC Rowena Dulli de la Defensa es la agregada oficial de las CDF y dirigira la operacion.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Difficulty (1-7):</EM4> 5/7\n<EM4>Rep:</EM4> +4,000
p_showdown_title=ALERTA CDF: Ataque a XenoThreat <EM4>[4,000 Rep]</EM4>
