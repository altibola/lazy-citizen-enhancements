mtps_UGF_eliminateall_desc_001=SOBRE EL TRABAJO\nmicroTech Protection Services está buscando un profesional de seguridad detallista que pueda ayudarnos de manera rápida y segura en la eliminación completa de ocupantes ilegales que han ganado temporalmente el control de ~mission(Location|Address).\n\nRESPONSABILIDADES\n• Proporcionar su propio transporte a ~mission(Location|Address).\n• Eliminar a todos los ocupantes ilegales encontrados en el sitio; usando la fuerza según sea necesario.\n\nREQUISITOS MÍNIMOS\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponibilidad para despliegue inmediato.\n\nREQUISITOS PREFERIDOS\n• Experiencia con técnicas de desescalada rápida de hostilidades.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
mtps_UGF_eliminateall_nocivs_desc_001=ACERCA DEL TRABAJO\nmicroTech Protection Services esta buscando un profesional mercenario orientado a los detalles que pueda ayudarnos de manera rapida y segura a eliminar por completo a los ocupantes ilegales que han obtenido temporalmente el control de ~mission(Location|Address).\n\n Tenga en cuenta que nuestra información muestra que hay trabajadores civiles en el sitio. Dado que su conexión con la pandilla no esta clara, se les debe considerar no combatientes. No se tolerara ninguna acción hostil hacia ellos. \n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Address).\n• Eliminar a todos los ocupantes hostiles que se encuentren dentro del sitio; utilizando la fuerza si es necesario.\n• Garantizar la seguridad de los civiles que puedan estar en el lugar. \n\nCUALIFICACIONES MÍNIMZX\n• 2 años de experiencia combinada en mercenarios y/o seguridad.\n• Acceso a equipo de combate y modo de transporte.\n• Disponible para despliegue inmediato.\n\nCUALIFICACIONES PREFERIDAS\n• Experiencia con tecnicas rapidas de desescalamiento de hostilidad.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13\n<EM4>Friendlies:</EM4> Civilians x4
mtps_UGF_eliminateall_title_001=Eliminar ocupantes ilegales <EM4>[500 Rep]</EM4>
mtps_bounty_desc_ERT=ACERCA DEL TRABAJO\nmicroTech Protection Services esta buscando un cazarrecompensas cualificado para capturar al objetivo de riesgo extremo. ~mission(TargetName) de ~mission(Location|Address). \n\nUn objetivo de riesgo extremo normalmente Pilota una embarcacion de clase subcapital, tiene varios aliados fuertemente armados y se espera que sea muy difícil de detener. Puede ser util traer personal de apoyo para ayudar a involucrar a este objetivo.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Address).\n• Neutralizar ~mission(TargetName); usando la fuerza según sea necesario.\n\nCALIFICACIONES MÍNIMAS\n• Membresia del Bounty Hunters Guild y certificación adecuada.\n• Acceso a un vehículo adecuadamente equipado para el combate.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
mtps_bounty_desc_HRT=ACERCA DEL TRABAJO\nmicroTech Protection Services esta buscando un cazarrecompensas cualificado para capturar al objetivo de alto riesgo. ~mission(TargetName) de ~mission(Location|Address). \n\nUn objetivo de alto riesgo normalmente Pilota una gran embarcacion con tripulacion multiple, tiene varios aliados conocidos y se espera que sea difícil de Arrestar. Puede ser util traer personal de apoyo para ayudar a involucrar a este objetivo.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio a ~mission(Location|Address).\n• Neutralizar ~mission(TargetName); usando la fuerza según sea necesario.\n\nCALIFICACIONES MÍNIMAS\n• Membresia del Bounty Hunters Guild y certificación adecuada.\n• Acceso a un vehículo adecuadamente equipado para el combate.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
mtps_bounty_desc_LRT=ACERCA DEL TRABAJO\nmicroTech Protection Services esta buscando un cazarrecompensas cualificado para capturar al objetivo de bajo riesgo. ~mission(TargetName) de ~mission(Location|Address). \n\nUn objetivo de bajo riesgo normalmente pilota una nave monoplaza, tiene varios aliados conocidos y debe ser sencillo de detener.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio para ~mission(Location|Address).\n• Neutralizar ~mission(TargetName); usando la fuerza según sea necesario.\n\nCALIFICACIONES MÍNIMAS\n• Membresia del Bounty Hunters Guild y certificación adecuada.\n• Acceso a un vehículo adecuadamente equipado para el combate.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
mtps_bounty_desc_MRT=ACERCA DEL TRABAJO\nmicroTech Protection Services esta buscando un cazarrecompensas cualificado para capturar al objetivo de riesgo moderado. ~mission(TargetName) de ~mission(Location|Address). \n\nUn objetivo de riesgo moderado normalmente pilota una pequeña embarcacion con tripulacion multiple, tiene varios aliados conocidos y puede ser un poco difícil de detener.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio para ~mission(Location|Address).\n• Neutralizar ~mission(TargetName); usando la fuerza según sea necesario.\n\nCALIFICACIONES MÍNIMAS\n• Membresia del Bounty Hunters Guild y certificación adecuada.\n• Acceso a un vehículo adecuadamente equipado para el combate.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
mtps_bounty_desc_VLRT=ACERCA DEL TRABAJO\nmicroTech Protection Services esta buscando un cazarrecompensas cualificado para capturar al objetivo de muy bajo riesgo. ~mission(TargetName) de ~mission(Location|Address). \n\nUn objetivo de muy bajo riesgo normalmente pilota una nave monoplaza, tiene pocos aliados conocidos y debería ser relativamente facil de detener.\n\nRESPONSABILIDADES\n• Proporcionar transporte propio para ~mission(Location|Address).\n• Neutralizar ~mission(TargetName); usando la fuerza según sea necesario.\n\nCALIFICACIONES MÍNIMAS\n• Membresia del Bounty Hunters Guild y certificación adecuada.\n• Acceso a un vehículo adecuadamente equipado para el combate.\n• Disponible para despliegue inmediato.\n\nCALIFICACIONES PREFERIDAS\n• Capacidad para manejar situaciones de alta presión.\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Reinforcements x1, Targets x1
