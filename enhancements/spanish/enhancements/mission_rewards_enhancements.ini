cfp_recovery_desc_001=Hola,\n\nPodrías ayudarnos.\n\nUna persona local con la que colaboramos estaba completando una entrega para nosotros, pero desafortunadamente se encontró con algunos forajidos y tuvo que rendir su ~mission(item). La buena noticia es que los forajidos no notaron los rastreadores que colocamos en la carga y ahora sabemos que han llevado su botín a ~mission(pickup1|address).\n\nNos gustaría que recuperaras los paquetes para nosotros y los entregaras a ~mission(dropoff1|address). No me imagino que los forajidos los entreguen voluntariamente, pero no te pediría que te pusieras en peligro si estos suministros no fueran de importancia crítica.\n\nEntonces, ¿qué dices?\n\nLima Endicott\nJefe de Coordinación\nCitizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50
