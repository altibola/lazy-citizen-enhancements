Headhunters_bounty_desc_001=Recientemente, los Headhunters prestaron créditos a ~mission(TargetName) bajo algunas condiciones claras. Específicamente, páganos o te matamos. Sorprendentemente, eso no fue suficiente incentivo, pero aquí estamos después de la fecha límite de pago. Ahora, por mucho que nos guste ~mission(TargetName|First), necesito que cumplas nuestra promesa. ~mission(TargetName|Last) fue visto por última vez en ~mission(Location|Address). Rastrea, hazlo desaparecer y cobra. Es tan simple como eso. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
Headhunters_bounty_desc_002=Se acabó el tiempo para ~mission(TargetName). El desgraciado se retrasó demasiado en pagar a los Headhunters, así que necesito que lo noquees. Mátalo, no lo golpees, por si acaso no queda claro. Alguien vio recientemente a ~mission(TargetName|Last) cerca de ~mission(Location|Address), así que ve allí y encárgate de él. Aviso completo, hemos recibido informes de que usaron algunos de nuestros créditos para contratar protección adicional. Prepárate en consecuencia. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
Headhunters_bounty_desc_003=~mission(TargetName) tomó prestados muchos créditos de los Headhunters y pensó que la mejor decisión era esconderse en lugar de pagarnos. Así que necesito que alguien les de una lección a ~mission(TargetName|Last). Fueron vistos recientemente en ~mission(Location|Address), así que te recomendaría que vayas allí antes de que la pista se enfríe. ~mission(TargetName|Last) es un tipo paranoico, así que no te sorprendas si no está solo. Hazlo como quieras, pero asegúrate de que ~mission(TargetName|Last) esté acabado cuando termines. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +250\n<EM4>Hostiles:</EM4> Reinforcements x3, Targets x1
Headhunters_bounty_title_001=Moroso <EM4>[50 Rep]</EM4>
Headhunters_bounty_title_002=Vencimiento <EM4>[100 Rep]</EM4>
Headhunters_bounty_title_003=Aviso de Cobro <EM4>[250 Rep]</EM4>
Headhunters_bounty_xenothreat_desc_001=Los Headhunters se enteraron de que hay una operación de XenoThreat en marcha que está apuntando a una de nuestras tripulaciones. No tenemos detalles precisos sobre el plan, pero sabemos que ~mission(TargetName) lo está organizando. En lugar de quedarnos quietos y esperar a que algo suceda, hemos decidido ser proactivos. ~mission(TargetName|Last) fue visto recientemente con otros cerca de ~mission(Location|Address). No podemos movilizar a nadie lo suficientemente rápido como para llegar allí. Quiero que vayas allí y lances un ataque preventivo. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
Headhunters_bounty_xenothreat_desc_002=XenoThreat golpeó recientemente una fortaleza de los Headhunters. Te ahorraré los detalles, pero hicieron algunas cosas realmente atroces a nuestra tripulación. Hemos identificado al líder de la operación como ~mission(TargetName) y buscamos un poco de revancha. No nos importa lo que hagas para lograrlo. Solo queremos que ~mission(TargetName|Last) esté muerto. Una fuente acaba de decirnos que puedes rastrear a esta escoria de XenoThreat en ~mission(Location|Address). Este maníaco es un profesional y nunca viaja solo, así que no esperes que acabar con él sea un paseo por el parque. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
Headhunters_bounty_xenothreat_desc_003=~mission(TargetName) fue revelado recientemente como una infiltrado para XenoThreat. Todo tiene sentido ahora porque el tipo era un gran imbécil. Desafortunadamente, se fue antes de que pudiéramos encargarnos nosotros mismos. Basándonos en todo lo que aprendieron sobre nuestras operaciones, necesitamos que lo elimines pronto. Si ven que uno de nosotros se acerca, simplemente huirán de nuevo, pero pensé que alguien como tú tiene una mejor oportunidad de acercarse lo suficiente para un disparo mortal. Nos acaban de informar que ~mission(TargetName|Last) estaba rondando ~mission(Location|Address). Parece que hay otras naves protegiéndolo también. ¿Crees que tienes la habilidad para liberar el universo de un bastardo traidor y sus amigos bastardos? Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
Headhunters_claimsweep_desc_easy=Algunos tontos están tratando de encontrar información comprometedora sobre los Headhunters. Dejaron caer algunas torres centinelas orbitales en ~mission(location|address) para espiarnos. También hemos visto una nave verificándolas. Propuesta sencilla para ti: ve y destruye las torres allí y te pagaremos por ello. ¿Suena como algo en lo que estarías interesado? En cuanto a la nave, puedes hacer lo que quieras con ella, pero si te ve, no te sorprendas si intenta conseguir algo de respaldo. Así son estas cosas. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50\n<EM4>Hostiles:</EM4> Hostile Wave x3, Prospectors x1\n<EM4>Turrets:</EM4> 2 (hostile)
Headhunters_claimsweep_desc_hard=Unos idiotas piensan que pueden espiarnos descaradamente y salirse con la suya. Han instalado varias torres centinelas orbitales en ~mission(location|address) y tienen algunas naves patrullando la zona. No sabemos quién está detrás, pero honestamente no nos importa. Solo necesitamos que se vayan. Avísanos si tienes ganas de poner en su lugar a algunos idiotas audaces. Te pagaremos bien y transferiremos los créditos en cuanto el trabajo esté hecho. Ten en cuenta que realmente solo nos importan las torres. Las naves que tienen patrullando solo son un problema si se interponen en tu camino o si intentan llamar a algunos amigos para detenerte. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +250\n<EM4>Hostiles:</EM4> Hostile Wave x5, Prospectors x4\n<EM4>Turrets:</EM4> 4 (hostile)
Headhunters_claimsweep_desc_intro=Tengo una molestia menor que los Headhunters necesitan resolver. Hay una torre centinela orbital en ~mission(location|address) que algún pequeño molestador colocó para espiarnos. ¿Quieres ganar algunos créditos fáciles y volarla por nosotros? Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +50\n<EM4>Turrets:</EM4> 1 (hostile)
Headhunters_claimsweep_desc_medium=Los Headhunters buscan un mercenario para que haga un poco de limpieza por nosotros. Descubrimos que alguien está tratando de espiarnos en ~mission(location|address). No podemos permitir que eso suceda. Necesitamos a un operador habilidoso para encargarse de las torres centinelas orbitales que dejaron allí, y si es necesario, lidiar con cualquiera de sus naves que se interponga en tu camino. Parece un trabajo decentemente dirigido, así que golpearlo puede que no sea fácil, pero seguro que será divertido. Avísanos si eres el adecuado para el trabajo. Los créditos se transferirán una vez que nuestras exploraciones muestren que se ha ido. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostile Wave x4, Prospectors x2\n<EM4>Turrets:</EM4> 3 (hostile)
Headhunters_claimsweep_desc_rand=Los Headhunters descubrieron recientemente algunas torres centinelas orbitales enfocadas en nuestras operaciones y no nos gusta ni un poco. Estoy buscando pagarle a alguien para que vaya a ~mission(location|address) y deje en claro que deben mantenerse fuera de nuestro negocio. Dudo que sean receptivos a una discusión al respecto, así que estaría preparado para expulsarlos con extrema fuerza. Según nuestros escaneos, esto no será un paseo por el parque. No sería una mala idea venir preparado con mucho munición. El pago se enviará rápidamente una vez que se haya hecho el trabajo. Fin de la transmisión.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +100\n<EM4>Hostiles:</EM4> Hostile Wave x32, Prospectors x5\n<EM4>Turrets:</EM4> 4 (hostile)
