hurston_UGF_eliminateall_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE SUBCONTRATACIÓN\n\nCONTRATO: Barrido de instalaciones\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: G. Livingston\n EVALUACIÓN DE RIESGOS: Alto\nCONTRATO PRIVADO: No\n\nHurston esta buscando un contratista dispuesto a limpiar a los ocupantes criminales de ~mission(Location|Address).\n\nEl sitio se ha utilizado para albergar numerosas actividades ilegales, por lo que es imperativo que este protegido. \n\n Estas autorizado a tomar las medidas necesarias. El pago se enviara una vez que se confirme que la instalacion esta clara. \n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Esta prohibida cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x20, Sentries x10, Snipers x2
hurston_UGF_eliminateall_nocivs_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE SUBCONTRATACIÓN\n\nCONTRATO: Barrido de instalaciones\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: K. Restle\n EVALUACIÓN DE RIESGOS: Alto\nCONTRATO DE PRISA: No\n\nHurston esta buscando un contratista dispuesto a eliminar a los ocupantes criminales de ~mission(Location|Address).\n\nEl sitio se ha utilizado para albergar numerosas actividades ilegales, por lo que es imperativo que este protegido. \n\nTen en cuenta que solo estas autorizado a enfrentarte a hostiles confirmados. Agredir a cualquier civil en el sitio se considerara una violacion de su contrato. \n\nEl pago se enviara una vez que se confirme que la instalacion esta clara. \n\n\n\n** La información transmitida puede contener material confidencial y/o privilegiado. Esta prohibida cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13\n<EM4>Friendlies:</EM4> Civilians x4
hurston_UGF_eliminateall_title_001=Desalojar a los ocupantes ilegales <EM4>[500 Rep]</EM4>
hurston_bounty_desc_intro=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Recaudación de Recompensas\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE EXTERNO: ~mission(Contractor|Auth)\nEVALUACIÓN DE RIESGOS: ~mission(Danger)\nCONTRATO URGENTE: ~mission(Contractor|BountyTimed)\n\nDespués de repetidas y continuas infracciones menores, se ha emitido una recompensa para el siguiente individuo - ~mission(TargetName).\n \nPara evaluar tu potencial en ayudar en la captura de criminales más esquivos, Hurston Dynamics evaluará tu capacidad para localizar y detener a ~mission(TargetName|Last) por cualquier medio a tu disposición. La última información sobre el paradero actual de ~mission(TargetName|Last) indica que fueron vistos por última vez en ~mission(Location|Address).\n\nEl pago se liberará solo después de ocuparte de la recompensa. \n \n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o toma de acción basada en esta información por parte de personas o entidades distintas al destinatario previsto está prohibido. **\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
hurston_bounty_desc_rehire=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Recaudación de Recompensas\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE EXTERNO: ~mission(Contractor|Auth)\nEVALUACIÓN DE RIESGOS: ~mission(Danger)\nCONTRATO URGENTE: ~mission(Contractor|BountyTimed)\n\nNuestro departamento realiza reevaluaciones periódicas de cazarrecompensas pasados y ha determinado que puedes ser un candidato adecuado para una posible reinstalación.\n\nComo demostración de tu idoneidad, aprehende con éxito al siguiente individuo buscado: \n~mission(TargetName).\n \nLa última información sobre el paradero actual de ~mission(TargetName|Last) indica que fueron vistos por última vez en ~mission(Location|Address).\n\nLa reinstalación como cazador de recompensas de Hurston Dynamics y el pago seguirán a la finalización exitosa de este contrato.\n \n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o toma de acción basada en esta información por parte de personas o entidades distintas al destinatario previsto está prohibido. **\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
hurston_bounty_fps_UGF_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Coleccion de recompensas\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: I. Takao\n EVALUACIÓN DE RIESGOS: Objetivo de riesgo moderada (probablemente apoyo armado)\n CONTRATO RUSH: No\n\nHurston Dynamics esta buscando un contratista para completar un bo desatado por ~mission(TargetName). \n\nLos informes de Intel han rastreado el objetivo hasta ~mission(Location|Address). Se sabe que este sitio es frecuentado por delincuentes que probablemente  estén armados y sean hostiles. Interactue con ellos como mejor le parezca, pero su maxima prioridad es la neutralizacion de ~mission(TargetName|Last). \n\nEl pago se liberara solo despues de que la recompensa se haya considerado completa.\n \n\n** La información transmitida puede contener material confidencial y/o privilegiado. Se prohibe cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13, Targets x1
hurston_bounty_fps_UGF_nocivs_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Coleccion de recompensas\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE DE OUTSOURCE: L. Paleski\n EVALUACIÓN DE RIESGOS: Objetivo de riesgo moderada (probablemente apoyo armado)\nCONTRATO RUSH: No\n\nHurston Dynamics esta buscando un contratista para completar un bo desatado por ~mission(TargetName). \n\nLos informes de Intel han localizado el paradero actual del objetivo para ~mission(Location|Address). Si bien puede interactuar con cualquier delincuente en el sitio como mejor le parezca, todos los civiles en el lugar deben estar protegidos. \n\n El pago se liberara solo despues de que la recompensa se haya considerado completa. y/o material privilegiado. Se prohibe cualquier revision, retransmision, difusion u otro uso o adopción de medidas basandose en esta información por parte de personas o entidades distintas del destinatario previsto. **\n\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
hurston_bounty_fps_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE EXTERNALIZACIÓN\n\nCONTRATO: Recaudación de Recompensas\nAFILIACIÓN DEL CONTRATISTA: Independiente\nGERENTE EXTERNO: ~mission(Contractor|Auth)\nEVALUACIÓN DE RIESGOS: Objetivo de Riesgo moderada (Posible Apoyo Armado)\nCONTRATO URGENTE: ~mission(Contractor|BountyTimed)\n\nBajo la autoridad de Hurston Dynamics otorgada por la UEE, se ha emitido una recompensa por ~mission(TargetName) en relación con crímenes contra la corporación. \n\nSe cree que el sujeto se encuentra recientemente en ~mission(Location|Address), posiblemente con varios aliados. Puede ser necesario el uso de la fuerza para acceder al sitio y neutralizar a ~mission(TargetName|Last). ~mission(Location|CaveSize)\n\nEl pago se liberará solo después de que se considere completa la recolección de la recompensa.\n \n\n** La información transmitida puede contener material confidencial y/o privilegiado. Cualquier revisión, retransmisión, difusión u otro uso o toma de acción basada en esta información por parte de personas o entidades distintas al destinatario previsto está prohibido. **\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
