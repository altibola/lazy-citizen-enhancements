DynamicEvent_FleetWeek2022_Description=PARA PUBLICACIÓN INMEDIATA EN TODO EL SISTEMA\n\nAtención, las fuerzas de Nine Tails han tomado el control de varias plataformas comerciales cerca de Orison. Utilizando un Alternador de Identificación Amigo o Enemigo (IFFI), han tomado el espacio aéreo restringido que rodea las plataformas, y solo las naves afiliadas a Nine Tails pueden acceder a la zona. Esto ha dificultado seriamente los intentos iniciales de la Crusader Security de retomar las plataformas. Como tal, Crusader ha solicitado la asistencia de las fuerzas de CDF para desactivar el alternador y eliminar toda presencia hostil. Se alienta a cualquier voluntario disponible de CDF a brindar apoyo.\n\nInformación adicional:\n* Mientras el alternador esté activo y el espacio aéreo sea inaccesible, CDF ha logrado tomar el control de un sistema de transporte local y dirigirlo para acceder a Solanki Platform sin que Nine Tails lo sepa. Los voluntarios deberán dirigirse a Crusader Industries Showroom en la Plataforma Comercial y llegar a la azotea para encontrar la lanzadera que viajará a las plataformas ocupadas.\n* Se cree que el IFFI se encuentra en un contenedor de almacenamiento cerrado en una barcaza de carga atracada en el Centro de Administración central.\n* Los códigos de acceso para el contenedor IFFI están en posesión del líder de las fuerzas de Nine Tails, Mendo Ren.\n* La experiencia pasada con Mendo Ren indica que es poco probable que muestre su rostro y arriesgue ser capturado. Sin embargo, si todos sus tenientes son neutralizados, creemos que no tendrá más opción que tomar el mando de las fuerzas en persona y nos brindará la oportunidad de recuperar los códigos de él.\n* Además del sistema de transporte, la Crusader Security nos ha informado que hay varios vehículos en las plataformas disponibles para que CDF los tome. Estos vehículos serán la única forma de llegar al Centro de Administración. NOTA: Si todos los vehículos dentro del espacio aéreo restringido son destruidos antes de que se pueda desactivar el alternador, no habrá forma de llegar a la barcaza de carga y CDF se verá obligado a retirarse.\n* Las plataformas están protegidas por armas antiaéreas controladas por Nine Tails.\n\nTenga en cuenta que la SAIC Rowena Dulli de la Advocacy es el enlace oficial del CDF y dirigirá la operación.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
