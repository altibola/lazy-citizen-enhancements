RedWind_LocalDelivery_desc_01=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nNecesito un piloto independiente disponible para una entrega local rápida.\n\nPAQUETE PARA RECOGER\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n\nUBICACIÓN DE ENTREGA\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\nTrata de mantenerte limpio cuando estés por ahí. Si llevas paquetes de Red Wind a bordo, se aprecia un cierto nivel de profesionalismo.\n\n~mission(Contractor|SignOff)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +250
RedWind_LocalDelivery_desc_02=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nBusco un piloto para llevar un par de paquetes -\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n\nNecesito que se haga rápido y sin errores.\n\n~mission(Contractor|SignOff)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_LocalDelivery_desc_03=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nOye todos, tengo un contrato disponible para cualquier piloto con una nave lista -\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete n.°~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete n.°~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n\n~mission(Contractor|SignOff)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_LocalDelivery_desc_04=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nHa salido un recorrido que necesita un piloto disponible.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete n.°~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete n.°~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete n.°~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete n.°~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n\nY solo para ser claro, debes proporcionar tu propia nave de carga. Asegúrate de tener espacio suficiente.\n\n~mission(Contractor|SignOff)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_LocalDelivery_desc_05=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nHe organizado un recorrido con múltiples paradas que necesita un piloto.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete n.°~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete n.°~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n     · Paquete n.°~mission(item4|serialnumber) desde ~mission(Pickup4|Address)\n     · Paquete n.°~mission(item5|serialnumber) desde ~mission(Pickup5|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete n.°~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete n.°~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n     · Paquete n.°~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n     · Paquete n.°~mission(item5|serialnumber) a ~mission(Dropoff5|Address)\n\nAsegúrate de que tu nave tenga espacio para todas estas recogidas.\n\n~mission(Contractor|SignOff)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
RedWind_LocalDelivery_desc_intro=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nEstamos buscando contratar a un piloto independiente que esté interesado en realizar una ruta local para nosotros.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete n.°~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\nSi tienes éxito, podemos ver otros contratos en el futuro.\n\n~mission(Contractor|SignOff)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +100
RedWind_LocalDelivery_desc_rehire=RED WIND LINEHAUL\n'TUS MERCANCÍAS EN BUENAS MANOS'\n----------------------------\n\nAunque no te hemos contratado en un tiempo, podríamos necesitar una ayuda extra en este momento.\n\nPAQUETES PARA RECOGER (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) desde ~mission(Pickup1|Address)\n     · Paquete #~mission(item2|serialnumber) desde ~mission(Pickup2|Address)\n     · Paquete #~mission(item3|serialnumber) desde ~mission(Pickup3|Address)\n\nLUGARES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n     · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n     · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n\nSi completas esta entrega, podemos considerar hacerlo más regularmente otra vez.\n\n~mission(Contractor|SignOff)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
