Hockrow_FacilityDelve_P3M1_desc=Hockrow FacilityDelve P3MM Intro\n\n<EM3>POTENTIAL BLUEPRINTS</EM3>\n- Fresnel "Molten" Energy LMG\n- Geist Armor Arms ASD Edition\n- Geist Armor Core ASD Edition\n- Geist Armor Helmet ASD Edition\n- Geist Armor Legs ASD Edition\n- Zenith "Darkwave" Laser Sniper Rifle\n- Zenith Laser Sniper Rifle Battery (22 Cap)\n- [MIL-S1-B] DynaFlux\n- [MIL-S2-B] Bolide\n- [MIL-S3-B] Fulgur\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Mission Type:</EM4> Chain, Starter\n<EM4>Difficulty (1-7):</EM4> Combat 6/7 | Complexity 6/7 | Risk 6/7 | Knowledge 5/7\n<EM4>Blueprint Reward:</EM4> 100% chance (Repeat only)\n\n<EM4>? = only the Repeat variant awards blueprints</EM4>
