Covalex_LocalDelivery_desc_01=¡Hola!\n\nAcabo de recibir un reparto local que necesitamos atender, si estas disponible. \n\nPAQUETE PARA RECOGER\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n\nUBICACIÓN DE ENTREGA\n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Coordinador de Logistica\nCovalex Shipping \n'Todo lo que necesites, donde lo necesites.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Al aceptar este contrato, usted acepta todos los terminos y condiciones descritos en nuestra 'Guia de información complementaria para trabajadores independientes v.2948.01.29' ampliada. Covalex Shipping no es responsable de los daños que ocurran mientras operas como contratista independiente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Covalex_LocalDelivery_desc_02=¡Hola! \n\nOtra entrega aparecio en mi lista y pense en enviarsela. Debería ser una entrega rapida con un par de paradas.\n\nPAQUETES PARA RECOGER (CUALQUIER PEDIDO)\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n\n LUGARES DE ENTREGA (CUALQUIER PEDIDO) \n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n\n ~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Coordinador de Logistica\nCovalex Shipping \n'Todo lo que necesites, donde lo necesites.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Al aceptar este contrato, usted acepta todos los terminos y condiciones descritos en nuestra 'Guia de información complementaria para trabajadores independientes v.2948.01.29' ampliada. Covalex Shipping no es responsable de los daños que ocurran mientras operas como contratista independiente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Covalex_LocalDelivery_desc_03=Hola, \n\n Realmente espero que estes libre porque estamos absolutamente desbordados en este momento. aquí hay una entrega local que esperaba que pudieras recoger. \n\nPAQUETES PARA RECOGER (CUALQUIER PEDIDO)\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n · Paquete #~mission(item3|serialnumber) de ~mission(Pickup3|Address)\n\n LUGARES DE ENTREGA (CUALQUIER PEDIDO) \n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n\n ~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Coordinador de Logistica\nCovalex Shipping \n'Todo lo que necesites, donde lo necesites.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Al aceptar este contrato, usted acepta todos los terminos y condiciones descritos en nuestra 'Guia de información complementaria para trabajadores independientes v.2948.01.29' ampliada. Covalex Shipping no es responsable de los daños que ocurran mientras operas como contratista independiente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Covalex_LocalDelivery_desc_04=Hola, \n\nTenemos una entrega con tu nombre si estas disponible. Es un monton, asi que asegurese de tener espacio.\n\nPAQUETES PARA RECOGER (CUALQUIER PEDIDO)\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n · Paquete #~mission(item3|serialnumber) de ~mission(Pickup3|Address)\n · Paquete #~mission(item4|serialnumber) de ~mission(Pickup4|Address)\n\n LUGARES DE ENTREGA (CUALQUIER PEDIDO) \n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n\n ~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Coordinador de Logistica\nCovalex Shipping \n'Todo lo que necesites, donde lo necesites.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Al aceptar este contrato, usted acepta todos los terminos y condiciones descritos en nuestra 'Guia de información complementaria para trabajadores independientes v.2948.01.29' ampliada. Covalex Shipping no es responsable de los daños que ocurran mientras operas como contratista independiente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Covalex_LocalDelivery_desc_05=¡Hola! \n\nNecesito mover un monton de paquetes si tienes el tiempo y el espacio. aquí esta la lista.\n\nPAQUETES PARA RECOGER (CUALQUIER PEDIDO)\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n · Paquete #~mission(item2|serialnumber) de ~mission(Pickup2|Address)\n · Paquete #~mission(item3|serialnumber) de ~mission(Pickup3|Address)\n · Paquete #~mission(item4|serialnumber) de ~mission(Pickup4|Address)\n · Paquete #~mission(item5|serialnumber) de ~mission(Pickup5|Address)\n\n LUGARES DE ENTREGA (CUALQUIER PEDIDO) \n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n · Paquete #~mission(item2|serialnumber) a ~mission(Dropoff2|Address)\n · Paquete #~mission(item3|serialnumber) a ~mission(Dropoff3|Address)\n · Paquete #~mission(item4|serialnumber) a ~mission(Dropoff4|Address)\n · Paquete #~mission(item5|serialnumber) a ~mission(Dropoff5|Address)\n\n ~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Coordinador de Logistica\nCovalex Shipping \n'Todo lo que necesites, donde lo necesites.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Al aceptar este contrato, usted acepta todos los terminos y condiciones descritos en nuestra 'Guia de información complementaria para trabajadores independientes v.2948.01.29' ampliada. Covalex Shipping no es responsable de los daños que ocurran mientras operas como contratista independiente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Covalex_LocalDelivery_desc_intro=¡Hola!\n\nCovalex esta actualmente buscando nuevos contratistas de entrega. Para ver si eres apto para Covalex o no, hemos organizado la siguiente ruta de entrega como evaluación de tus habilidades.\n\nPAQUETE PARA RECOGER\n · Paquete #~mission(item1|serialnumber) de ~mission(Pickup1|Address)\n\nUBICACIÓN DE ENTREGA\n · Paquete #~mission(item1|serialnumber) a ~mission(Dropoff1|Address)\n\n Completar exitosamente esta ejecucion lo certificara como contratista oficial de Covalex.\n\n ~mission(Contractor|SignOff)\n\nChase Hewitt\nJr. Coordinador de Logistica\nCovalex Shipping \n'Todo lo que necesites, donde lo necesites.'\n\n\n\n\n\n\n\nCovalex Shipping es una sociedad de responsabilidad limitada. Al aceptar este contrato, usted acepta todos los terminos y condiciones descritos en nuestra 'Guia de información complementaria para trabajadores independientes v.2948.01.29' ampliada. Covalex Shipping no es responsable de los daños que ocurran mientras operas como contratista independiente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500
