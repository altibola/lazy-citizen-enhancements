combatassist_desc=ATENCION: Un repetidor ECN en su sector ha recibido una señal de emergencia transmitida desde una nave en peligro. Se solicita a todos las naves disponibles en el area capaces de prestar asistencia que lo hagan de inmediato.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
