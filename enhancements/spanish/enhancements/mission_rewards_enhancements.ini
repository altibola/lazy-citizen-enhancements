cfp_RetrieveConsignment_desc_001=¿Estás disponible para un trabajo? Uno de nuestros lugares seguros fue atacado por bandidos y robaron material altamente confidencial. Como puedes imaginar, Citizens for Pyro está ansioso por recuperarlos lo antes posible. Gracias a un contacto local, pudimos rastrear a los bandidos hasta ~mission(Location|address), donde están almacenando los materiales confidenciales dentro de una bóveda automatizada segura. Para acceder, primero tendrás que encontrar el código de recuperación relevante e ingresarlo en el transportador de paquetes de la bóveda. Nuestra mejor suposición es que uno de los líderes bandidos llevará el código consigo, así que hay una muy alta posibilidad de que tengas que enfrentarte directamente a ellos para obtenerlo. Una vez que tengas posesión del material confidencial, queremos que lo entregues a ~mission(dropoff1|address). Estarás haciendo una gran diferencia para muchas personas si logras hacerlo. Gracias de antemano, Lima Endicott Jefe de Coordinación Citizens for Pyro\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Backup x8, Boss x2, Hostiles x54
cfp_RetrieveConsignment_title_001=Material Confidencial Robado <EM4>[1,000–4,000 Rep]</EM4>
