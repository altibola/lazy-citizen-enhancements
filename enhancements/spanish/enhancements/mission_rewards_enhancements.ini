XenoThreat_claimsweep_title_rand=Eliminar Centinelas <EM4>[100 Rep]</EM4>
Xenothreat_bounty_headhunter_desc_001=XenoThreat ha emitido una orden de muerte para ~mission(TargetName). Como miembro de nivel Clips de la pandilla Headhunters, ~mission(TargetName|Last) ha liderado operaciones dirigidas a operativos, misiones e infraestructura de XenoThreat. Por estas transgresiones, XenoThreat pagará a cualquiera que rastree con éxito y asesine a ~mission(TargetName|Last).  \n\nACTUALIZACIÓN DE UBICACIÓN: ~mission(TargetName|Last) fue visto cerca de ~mission(Location|Address) no hace mucho. Si decides aceptar este contrato, deberías dirigirte a las coordenadas inmediatamente. ~mission(TargetName|Last) sabe que lo estamos buscando y ha estado viajando con un escolta recientemente. No te sorprendas si no está solo.\n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
Xenothreat_bounty_headhunter_desc_002=XenoThreat ha emitido una orden de muerte para ~mission(TargetName). Un conocido miembro de la pandilla Headhunters, ~mission(TargetName|Last), ha traicionado a la humanidad al ser un conocido aliado alienígena que se asocia con ellos tanto en un ámbito personal como comercial. XenoThreat quiere que estas asociaciones traidoras se detengan de inmediato antes de que traigan más influencia alienígena a Pyro. Pagaremos a cualquiera que rastree con éxito y asesine a ~mission(TargetName|Last) por estos crímenes contra la humanidad.  \n\nACTUALIZACIÓN DE UBICACIÓN: ~mission(TargetName|Last) fue visto recientemente con un escolta en ~mission(Location|Address). \n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
Xenothreat_bounty_headhunter_desc_003=XenoThreat ha emitido una orden de muerte para el líder de ~mission(TargetName). Como miembro de la pandilla Headhunters, ~mission(TargetName|Last) hackeó los sistemas de XenoThreat para robar información sobre nuestras operaciones y personal. El daño causado solo puede ser rectificado asegurándose de que ~mission(TargetName|Last) nunca pueda hacer algo así de nuevo. Por eso, XenoThreat pagará a cualquiera que pueda rastrear y asesinar con éxito a ~mission(TargetName|Last).     \n\nACTUALIZACIÓN DE UBICACIÓN: Escaneos recientes identificaron a ~mission(TargetName|Last) viajando con otras naves cerca de ~mission(Location|Address). \n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Hostiles:</EM4> Reinforcements x5, Targets x1
Xenothreat_destroyitems_CFP_vehicle_desc_01=Los "activistas" de salón de Citizens for Pyro siguen intentando expandir su influencia por todo el sistema. Con tu ayuda, hay una oportunidad de cortar sus operaciones desde la raíz.\n\nEl grupo está utilizando ~mission(location|address) para distribuir suministros a independientes dispersos por el planeta. Si destruimos la ~mission(ship) ubicada allí, su red colapsará.\n\nUn bombardeo enviaría un mensaje claro, pero dejaré que decidas los medios de destrucción.\n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Xenothreat_theft_outpost_cfp_desc_001=Deja que la mentirosa UEE diga que no están involucrados en las operaciones de Citizens for Pyro simplemente porque "donan" suministros a una organización de ayuda que luego los entrega directamente a ellos. \n\nAcabamos de recibir información de que uno de estos envíos de ayuda del gobierno fue dejado en un puesto alineado con Citizens for Pyro. Es por eso que te pagaremos por asaltar ~mission(Pickup1|Address) y reclamar el ~mission(item) para la causa. Una vez que entregues todo en ~mission(Dropoff1|Address), podemos redistribuir el envío para ayudar en nuestra lucha. Nada mejor que usar los recursos del enemigo en su contra. \n\nPero no pienses que simplemente te entregarán las cosas. Aunque Citizens for Pyro supuestamente está aquí para traer paz, es mejor que estés preparado para enfrentarte a ellos. \n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Xenothreat_theft_outpost_headhunters_desc_001=Por mucho que XenoThreat haya luchado por hacer de Pyro un refugio puro para los humanos, no todos están alineados con nuestros objetivos. El principal entre ellos son los Headhunters, que se han rebajado al contratar a un transportista alienígena para entregar suministros. Perdimos la oportunidad de atacar ese envío, pero aún queremos enviar el mensaje de que trabajar con alienígenas en cualquier capacidad no será tolerado en este sistema. \n\nEse envío fue entregado en ~mission(Pickup1|Address). Queremos que alguien asalte el puesto, reclame el ~mission(item) y lo lleve a ~mission(Dropoff1|Address) para que podamos deshacernos de él adecuadamente. \n\n¿Estás dispuesto a mantener a Pyro libre de influencia alienígena?\n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Xenothreat_theft_station_cfp_desc_001=Citizens for Pyro se han enraizado en ~mission(Pickup1|Address). Para evitar que se sientan demasiado cómodos en esa estación, queremos mostrarles cómo es realmente la vida en nuestro sistema. Te pagaremos por asaltar la estación, agarrar el ~mission(item) y matar a cualquiera que se interponga en tu camino. \n\nEl pago depende de que entregues esos suministros en ~mission(Dropoff1|Address). Cualquiera que mates será solo una ventaja.     \n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Xenothreat_theft_station_roughready_desc_001=No estoy seguro de si has tenido el placer de tratar con los Rough & Ready, pero la pandilla está enfocada en acaparar el mercado de combustible en Pyro. Juego inteligente, pero uno que no podemos permitir que suceda sin que nos proporcionen algunas concesiones. Como actualmente no están interesados en negociar, nos vemos obligados a mostrarles lo que sucede con aquellos que se nos oponen.\n\nHemos identificado ~mission(Pickup1|Address) como un objetivo principal para tal ataque. También sabemos que recientemente recibieron algunos suministros que deberían ser un precio adecuado por su obstinación. Una vez dentro de la estación, haz lo que sea necesario para confiscar el ~mission(item). Enviaremos el pago una vez que los hayas entregado en ~mission(Dropoff1|Address).      \n\nComm. Espec. Engler\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
