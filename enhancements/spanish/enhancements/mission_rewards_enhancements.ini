covalex_UGF_collect_desc_001=Hola, \n\nTengo una entrega que necesito que me atiendan. El pedido esta esperando en ~mission(Location|Address) para ser llevado a ~mission(Destination|Address). \n\nEstoy seguro de que estaras bien, pero para una divulgacion completa, veo aparecer un monton de advertencias de seguridad para esta area. Parece que ha habido varios ataques en esa zona en los ultimos días. Ahora, no estoy diciendo que te toparas con nada, pero probablemente seria mejor si trajeras un poco de proteccion. \n\nBuena suerte, \n\nChase Hewitt\nJr. Coordinador de Logistica\nEnvios Covalex \n'Todo lo que necesites, donde lo necesites.'\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
covalex_UGF_collect_title_001=Piloto de entrega para Covalex <EM4>[500 Rep]</EM4>
covalex_delivery_desc_0006=Hola,\n\n~mission(Contractor|Reaction)\n\nEncontré el contrato de envío perfecto para que lo resuelvas. Hay un envío esperando en ~mission(Location|Address) que debe llevarse a ~mission(Destination|Address). ¿Suena bien, verdad? ~mission(Contractor|Timed)~mission(Contractor|Danger)\n\n~mission(Contractor|SignOff)\n\nChase Hewitt\nCoordinador Jr. de Logística\nCovalex Shipping  \n'Lo que necesites, donde lo necesites.'\n\n\n\n\n\n\n\nCovalex Shipping es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según se detalla en nuestra 'Guía de Información Suplementaria para Trabajadores Independientes v.2948.01.29'. Covalex Shipping no se hace responsable de los daños que ocurran mientras operas como contratista independiente.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
covalexrand_desc=~mission(Description)\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
covalexspec_description_0001=Hola,\n\nEntenderé por completo si no quieres ayudar con esto, pero si puedes, sería increíble.\n\nVerás, mi novio falleció durante la tragedia de Covalex Gundo. Dijeron que recibiría todas las cosas de Scott una vez que se completara la investigación, pero hasta donde yo sé, ya ha pasado un tiempo y aún no han dado ninguna indicación de cuándo podré obtener sus pertenencias. Ha sido lo suficientemente difícil lidiar con todo esto, y saber que un paquete va a aparecer en uno o dos meses y abrir todas estas heridas, es simplemente demasiado. Preferiría lidiar con esto ahora y acabar con ello. Si pudieras encontrar la manera de obtener sus efectos personales (Número de identificación de empleado 104) y dejarlos en ~mission(Destination), te estaría muy agradecida.\n\nGracias por tu ayuda,\nAnya\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
covalexspec_description_0002=Mi hermano fue una de esas personas que murieron cuando esa estación de Covalex cerca de Crusader explotó. Aún peor, estaba tomando prestada algo mío cuando sucedió. Ahora algún idiota de la burocracia está tratando de decirme que tengo que esperar para recuperar mis cosas. Sí, claro. Primero matan a mi hermano y ahora quieren que tenga paciencia? El descaro de estos jillos corporativos. Olvídate de eso. En cambio, pensé en contratar a alguien para que vaya a Gundo a buscar mis cosas y las lleve a ~mission(Destination) por mí. Quiero decir, ¿qué demonios van a hacer al respecto? De todos modos, es lo que mi hermano hubiera querido. Será la caja marcada con el número 156.\n\n- Ed\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
covalexspec_description_0003=Hola,\n\nAsí que esto es un poco incómodo para mí hablar, pero resulta que una de las personas que falleció en ese desastre de la estación Covalex, Kyomi Santos, en realidad me legó algo en su testamento. Me sorprendió escucharlo, pero aparentemente ahora soy el orgulloso propietario de todo lo almacenado en la caja número 173. La gente de Covalex dice que podré obtenerlo cuando la estación vuelva a abrir, pero... esta es la parte incómoda... realmente lo necesito ahora. Normalmente solo esperaría, pero estoy tratando de comenzar mi propio negocio (hago pasteles en forma de los mundos natales de las personas) y los créditos que obtendré al venderlo realmente serán de gran ayuda. Tengo un poco guardado ahora que puedo usar para pagar a alguien para que lo entregue desde Gundo hasta ~mission(Destination) por mí. Sé que todo esto es un poco irregular, pero si hubiera alguna otra forma, no estaría preguntando.\n\nGracias por la ayuda,\nThrace\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
covalexspec_description_0004=Mi hijo Nico fue trágicamente una de las víctimas del accidente en la estación Gundo de Covelex y aún no me han devuelto todas sus pertenencias personales. Entiendo que tienen que hacer las cosas según las regulaciones, pero parece inconcebible que no hagan algunas concesiones para los familiares afligidos. Con ese fin, estoy buscando a alguien que pueda ir a la estación por mí. Para ser claro, Gundo actualmente se considera fuera de límites, lo que significa que esto no sería del todo legítimo, pero siento que mi situación justifica una consideración especial. Mi hermana dice que la tarifa que ofrezco es la cantidad correcta para recuperar la caja con las pertenencias de Nico (#964) y llevarlas a ~mission(Destination), así que espero poder encontrar a una persona competente para resolver este asunto rápidamente.\n\nAtentamente,\nGloria Theolone\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
covalexspec_description_0005=Dijeron que podría encontrar a alguien aquí para ir a Gundo por mí y agarrar una caja que pertenecía a mi esposa. Si el nombre no te suena, esa es la estación donde tuvieron ese gran accidente. Mi esposa trabajaba para Covalex y sé que no va a hacer que perderla sea más fácil, pero realmente solo quiero las cosas de Claudia de vuelta. Pienso en su colección de fotos o en el collar que le regalé simplemente sentados allí en esa estación fría y muerta en alguna caja marcada como 249 y no está bien. Ella merece algo mejor. ¿Qué dices? ¿Estás dispuesto a ir a Gundo y llevar su caja de vuelta a ~mission(Destination)?\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
covalexspec_description_0006=Hola,\n\nEstoy buscando a alguien que vaya a la estación Covalex Gundo cerca de Crusader y recoja algunos artículos. Sé que esto puede sonar como robar, pero son cosas de mi padre. Verás, él estaba en la estación Gundo cuando tuvo su accidente. Mi madre dice que tenemos que esperar hasta que Covalex lo diga, pero no creo que sea justo porque lo extraño mucho. Me gustaría tener algo para recordarlo y no quiero esperar más porque podría empezar a olvidar cosas. Te pagaré para que consigas la caja 510 y la lleves a ~mission(Destination) para que pueda tenerla.\n\nMuchas gracias,\nBaylor Ward\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
crus_markerhunt_from=Sociedad Histórica de Crusader\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique
crusader_RetrieveConsignment_desc_001=Informes indican que nuestro personal de seguridad en ~mission(location|address) ha sido aniquilado por un grupo de Nine Tails, que intentan robar materiales confidenciales que fueron entregados recientemente en la instalación. Crusader Security necesita un contratista experimentado para expulsar a los hostiles y asegurar estas cajas.\n\nSegún los informes iniciales, recomendamos encarecidamente que venga bien equipado y considere traer refuerzos. Por razones de seguridad, los materiales confidenciales fueron transportados como parte de un envío con otras cajas y se cerraron en una bóveda automatizada. Los códigos de recuperación para acceder a los materiales confidenciales están almacenados en datapads en posesión de personal de seguridad de alto rango, pero no sabemos quién los tiene ahora. Es probable que los Nine Tails también los estén buscando.\n\nCuando tenga todos los materiales confidenciales, entréguelos en ~mission(dropoff1|address) para recibir el pago.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +2,000
crusader_RetrieveConsignment_title_001=Apoyar a las Fuerzas de Seguridad y Asegurar Materiales Confidenciales <EM4>[500–4,000 Rep]</EM4>
crusader_UGF_defend_E_desc_001=Crusader Security se ha enterado de que ~mission(Location|Address) Actualmente esta siendo amenazado por una pandilla local y estamos buscando contratar a un contratista para formar un equipo de seguridad para hacer frente a cualquier ataque. \n\nEsta pandilla tiene un poco de historial, pero en general todavía están bastante verdes. Espero que sea relativamente sencillo de manejar para usted y su equipo.\n\nCONTRATO AUTORIZADO POR:\nOficial de enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x1, Hostiles x10, Private Security x4, Sentries x6
crusader_UGF_defend_E_title_001=Sitio de guardia contra hostiles <EM4>[500 Rep]</EM4>
crusader_UGF_defend_VH_desc_001=Crusader Security se ha enterado de que ~mission(Location|Address) Actualmente esta siendo amenazado por una pandilla conocida que opera en el area y estamos buscando contratar un equipo de seguridad experimentado para hacer frente a cualquier ataque. \n\nIntenta asegurarte de que la persona que lleves este debidamente cualificada. Necesitara toda la ayuda que pueda conseguir para lidiar con este grupo.\n\nCONTRATO AUTORIZADO POR:\nOficial de enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x3, Hostiles x8, Private Security x4, Sentries x4
crusader_UGF_defend_VH_title_001=Sitio de guardia contra hostiles peligrosos <EM4>[500 Rep]</EM4>
crusader_UGF_defend_desc_001=Crusader Security se ha enterado de que ~mission(Location|Address) Actualmente esta siendo amenazado por un grupo de delincuentes y estamos buscando contratar a un contratista para formar un equipo de seguridad para repeler cualquier ataque. \n\n Se que puedes sentirte tentado a intentar manejar esto por tu cuenta, pero necesitas formar un equipo para ello. Creame, los créditos no valen la pena para intentarlo solo.\n\nCONTRATO AUTORIZADO POR:\nOficial de enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x8, Private Security x4, Sentries x8
crusader_UGF_defend_title_001=Sitio de guardia contra hostiles serios <EM4>[500 Rep]</EM4>
crusader_UGF_destroy_E_desc_001=Hemos descubierto que un grupo esta intentando iniciar su propio negocio de drogas en ~mission(Location|Address). Si bien parecen ser matones promedio de bajo nivel, el producto que producen es toxico y responsable de la muerte de multiples civiles, por lo que no podemos permitir que se venda mas.\n\nEstamos trabajando en un operacion mas grande que los cerrara para siempre, pero mientras tanto necesitamos detener el flujo de sus drogas. Es por eso que Crusader quiere que vayas al sitio y destruyas el alijo que tienen allí. \n\n Sin duda tendran guardías protegiendo el alijo, pero no espero que sean una gran amenaza.\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x8\n<EM4>Friendlies:</EM4> Civilians x4
crusader_UGF_destroy_E_title_001=Destruir las drogas ilegales <EM4>[500 Rep]</EM4>
crusader_UGF_destroy_H_desc_001=A fledgling syndicate have set up shop over at ~mission(Location|Address) and have been trying their hand at cracking into the drug market. Unfortunately, their product has been linked to several deaths in and around Crusader. With how potent this stuff is, it’s posing a serious threat to the public. \n\nCrusader is working to take down the whole operation, but as long as their product is circulating, the bodies are starting to pile up. \n\nWe want you to go the site and destroy the stash they have there before they get a chance to sell it. However, you should expect their stash to be extremely well guarded.\n\nCONTRACT AUTHORIZED BY:\nLiaison Officer Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Boss x2, Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
crusader_UGF_destroy_H_title_001=Destruir el contrabando mortal <EM4>[500 Rep]</EM4>
crusader_UGF_destroy_desc_001=Hemos estado investigando un ataque reciente de sobredosis y todos parecen haberse originado con un lote defectuoso de medicamentos fabricados en ~mission(Location|Address). \n\nEstoy trabajando con otros contratistas para descubrir a los responsables, pero la gente esta muriendo mientras el producto siga disponible. \n\nQuiero que vayas al sitio y destruyas el alijo que tienen allí. Deberiamos ganar algo de tiempo antes de que los apaguemos definitivamente.\n\nTendran guardías protegiendo su suministro, asi que preparese para enfrentarse a los hostiles.\n\nCONTRATO AUTORIZADO POR:\nOficial de enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Friendlies:</EM4> Civilians x4
crusader_UGF_destroy_title_001=Destruir los narcóticos tóxicos <EM4>[500 Rep]</EM4>
crusader_UGF_eliminateall_allies_desc_001=Crusader Security se ha enterado de que ~mission(Location|Address) Actualmente esta siendo amenazado por un grupo de delincuentes.\n\nSi bien contamos con personal de seguridad en el sitio, buscamos contratar contratistas adicionales para ayudarlos a repeler cualquier ataque. \n\nAhora, como contratista, no estoy seguro de que tan acostumbrado estas a trabajar con un equipo, pero no quiero escuchar nada sobre "fuego amigo" o habra problemas.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
crusader_UGF_eliminateall_allies_desc_intro=En un esfuerzo por aumentar la Crusader Security y sus alrededores, Crusader Security esta buscando personas calificadas para ayudar con el trabajo de seguridad en el sector. \n\nHemos determinado que usted posee el conjunto de habilidades necesarias para ofrecerle un contrato de prueba inicial. Ayudaras a Crusader Security a lidiar con un pequeño grupo hostil que ha estado amenazando contra ~mission(Location|Address). \n\nTenga en cuenta que ya contamos con personal de seguridad en el sitio, por lo que debera tener cuidado con el fuego amigo.\n\nAl completar exitosamente este contrato, será elegible para postularse para cualquier trabajo de seguridad futuro a medida que este disponible.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
crusader_UGF_eliminateall_allies_desc_rehire=¡Felicidades! Crusader Security ha decidido ofrecerle otra oportunidad de ser contratista de seguridad. Con un poco de trabajo duro y esfuerzo, la esperanza es que puedas superar cualquier problema de rendimiento anterior. \n\nSin embargo, primero, para reevaluar su viabilidad, nos gustaria que ayudara a Crusader Security a lidiar con un grupo ilegal que ha estado amenazando contra ~mission(Location|Address).\n\nAhora, dado que ha tenido problemas de rendimiento en el pasado, le recordare que no se tolerara el fuego amigo.\n\nAl completar exitosamente esta prueba, se restablecera su elegibilidad y podra volver a poder postularse para trabajo de seguridad con Crusader.\n\nCONTRATO AUTORIZADO POR:\nOficial de enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Attackers x10, Defenders x4, Hostiles x5
crusader_UGF_eliminateall_allies_title_001=Proporcionar respaldo <EM4>[500 Rep]</EM4>
crusader_UGF_eliminateall_allies_title_intro=Evaluación del trabajo de seguridad <EM4>[500 Rep]</EM4>
crusader_UGF_eliminateall_allies_title_rehire=Reevaluación del trabajo de seguridad <EM4>[500 Rep]</EM4>
crusader_UGF_eliminateall_desc_001=Crusader Security se ha enterado de que ~mission(Location|Address) se utiliza actualmente como base de operaciones para numerosas actividades ilegales.\n\nPara poner fin a este "nido de delincuentes", estamos buscando un contratista que vaya al sitio y despeje a todos los ocupantes. Por la fuerza si es necesario.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
crusader_UGF_eliminateall_nocivs_desc_001=Crusader Security se ha enterado de que ~mission(Location|Address) se utiliza actualmente como base de operaciones para numerosas actividades ilegales.\n\nPara poner fin a este "nido de delincuentes", estamos buscando un contratista que vaya al sitio y elimine todos los elementos hostiles. Por la fuerza si es necesario.\n\nY, para que lo sepas, a veces bandas como esta traen a civiles para que trabajen para ellos, a menudo mediante coercion. Esto debería ser evidente, pero si ve algun civil, debe protegerlo. Crusader Security no puede permitir que uno de sus contratistas ande disparando indiscriminadamente a la gente.\n\nCONTRATO AUTORIZADO POR:\nOficial de enlace Bautista\nID# 948J030K\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x13\n<EM4>Friendlies:</EM4> Civilians x4
crusader_UGF_eliminateall_title_001=Limpiar el nido criminal <EM4>[500 Rep]</EM4>
crusader_bounty_desc_first=En un esfuerzo por aumentar la seguridad de Crusader y sus alrededores, Crusader Security está buscando individuos calificados para ayudar en la captura de recompensas en la zona. \n\nHemos evaluado que posees las habilidades necesarias y, como tal, nos gustaría ofrecerte un contrato de prueba inicial para la extracción de ~mission(TargetName), visto por última vez en ~mission(Location|Address).\n\nTras la exitosa conclusión de este contrato, serás incluido en la lista de Freelancers Verificados de Crusader y serás elegible para cualquier trabajo futuro de recolección de recompensas que esté disponible.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Unique\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
crusader_bounty_desc_rehire=¡Buenas noticias! Crusader Security ha decidido ofrecerte otra oportunidad como contratista de recompensas. Esperamos que durante este tiempo hayas corregido cualquier problema de rendimiento pasado y puedas ser nuevamente un activo útil.\n\nPrimero, sin embargo, debemos reevaluarte y, como tal, nos gustaría que completaras este contrato de recompensa para ~mission(TargetName).\n\nTras la exitosa conclusión de esta prueba, serás restaurado en la lista de Freelancers Verificados de Crusader y serás elegible para cualquier trabajo futuro de recolección de recompensas que esté disponible.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Targets x1
crusader_bounty_fps_UGF_desc_001=Gracias a un arresto reciente, hemos descubierto la ubicación de una recompensa activo con el nombre de ~mission(TargetName). Actualmente se cree que se encuentran escondidos en ~mission(Location|Address). Se te ha autorizado a ingresar al sitio, encontrarlos y resolver la recompensa.\n\nTenemos todas las razones para creer que habrá otros elementos criminales en el sitio, pero por el momento, solo ~mission(TargetName|Last) es tu preocupación.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Gibbs\nID# 91G66BW0\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
crusader_bounty_fps_UGF_nocivs_desc_001=Tuvimos suerte y algunos escaneos recientes de ~mission(Location|Address) han mostrado que una recompensa abierta con el nombre de ~mission(TargetName) se está escondiendo allí. Se te ha autorizado a ingresar al sitio, encontrarlos y resolver la recompensa.\n\nSin embargo, además de la recompensa y sus cómplices criminales, es probable que también haya civiles en el lugar. Aunque estamos ansiosos por ver que ~mission(TargetName|Last) sea tratado, no podemos permitir ninguna baja civil. Ten cuidado al enfrentarte a los hostiles.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Gibbs\nID# 91G66BW0\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> FPS\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Hostiles x14\n<EM4>Friendlies:</EM4> Civilians x4
crusader_bounty_fps_title_001=Extracción de objetivo: ~mission(TargetName) (MRT) <EM4>[500–1,000 Rep]</EM4>
crusader_bounty_title_E=Recompensa emitida por ~mission(TargetName) (LRT) <EM4>[500 Rep]</EM4>
crusader_bounty_title_H=Recompensa emitida por ~mission(TargetName) (HRL) <EM4>[500 Rep]</EM4>
crusader_bounty_title_M=Recompensa emitida por ~mission(TargetName) (MRT) <EM4>[500 Rep]</EM4>
crusader_bounty_title_S=Recompensa emitida por ~mission(TargetName) (ERT) <EM4>[500 Rep]</EM4>
crusader_bounty_title_VE=Recompensa emitida por ~mission(TargetName) (VLRT) <EM4>[500 Rep]</EM4>
crusader_bounty_title_VH=Recompensa emitida por ~mission(TargetName) (VHRT) <EM4>[500 Rep]</EM4>
crusader_bounty_title_first=Evaluación de recompensas de autonomos verificados <EM4>[500 Rep]</EM4>
crusader_bounty_title_rehire=Reevaluación de recompensas de Freelancer verificada <EM4>[500 Rep]</EM4>
crusader_platform_EliminateAll_description_001=Tras su último intento de asedio, las fuerzas de Nine Tails han comenzado a realizar redadas dirigidas en un esfuerzo por continuar interrumpiendo las operaciones de Crusader. El ataque actual ha apuntado a ~mission(MissionCluster|address) y es vital que detengamos la agresión allí.\n\nCrusader Security está buscando un contratista dispuesto a eliminar a todos los operativos de Nine Tails en la zona. Se espera que los contratistas utilicen la fuerza y se les anima encarecidamente a considerar llevar refuerzos.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Hostiles:</EM4> Hostiles x20
crusader_platform_EliminateAll_title_001=Repeler el Asalto en Orison <EM4>[500 Rep]</EM4>
crusader_platform_EliminateSpecific_desc=Crusader Security ha recibido información de inteligencia de que un ataque de Nine Tails que está ocurriendo actualmente en ~mission(MissionCluster|address) incluye a un destacado sicario de la banda. Poner fin a este ataque y llevar ante la justicia a los responsables es una prioridad máxima para Crusader Security. Por eso estamos buscando un contratista dispuesto a ir a ~mission(MissionCluster|Nombre) para detener la amenaza y aprehender al sicario que la lidera.\n\nUna vez en el lugar, deberás diezmar las fuerzas de Nine Tails hasta que puedas hacer salir a ~mission(TargetName).\n\nDada la brutalidad desplegada por Nine Tails durante su reciente asedio, recomendamos que los contratistas estén preparados para usar la fuerza y les instamos encarecidamente a considerar llevar refuerzos.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Gibbs\nID# 91G66BW0\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Backup x6, Boss x1, Hostiles x19
crusader_platform_EliminateSpecific_title=Sicario de Nine Tails (HRT) <EM4>[1,000 Rep]</EM4>
crusader_platform_MultiEliminateAll_description_001=Tras su último intento de asedio, las fuerzas de Nine Tails han comenzado a realizar redadas dirigidas en un esfuerzo por continuar interrumpiendo las operaciones de Crusader. El ataque actual ha apuntado a varios edificios en ~mission(MissionCluster|address) y es vital que detengamos la agresión allí.\n\nCrusader Security está buscando un contratista dispuesto a eliminar a todos los operativos de Nine Tails en la zona. Se espera que los contratistas utilicen la fuerza y se les anima encarecidamente a considerar llevar refuerzos.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Bautista\nID# 948J030K\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
crusader_platform_MultiEliminateAll_title_001=Repeler Múltiples Asaltos en Orison <EM4>[500–2,000 Rep]</EM4>
crusader_platform_MultiEliminateSpecific_desc=Crusader Security ha recibido información de inteligencia de que un ataque de Nine Tails que está ocurriendo actualmente en ~mission(MissionCluster|address) incluye a varios destacados sicarios de la banda. Poner fin a este ataque y llevar ante la justicia a los responsables es una prioridad máxima para Crusader Security. Por eso estamos buscando un contratista dispuesto a ir y aprehender a aquellos que lo lideran.\n\nEn cada sitio de ataque, deberás diezmar las fuerzas de Nine Tails hasta que puedas hacer salir al sicario a cargo.\n\nDada la brutalidad desplegada por Nine Tails durante su reciente asedio, recomendamos que los contratistas estén preparados para usar la fuerza y les instamos encarecidamente a considerar llevar refuerzos.\n\nCONTRATO AUTORIZADO POR:\nOficial de Enlace Gibbs\nID# 91G66BW0\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
crusader_platform_MultiEliminateSpecific_title=Nine Tails Enforcer Bounties (VHRT) <EM4>[1,000–4,000 Rep]</EM4>
crusader_retakelocation_kareah_desc_001=La Estación de Seguridad Kareah está siendo atacada por un número desconocido de asaltantes. \n\nCrusader está buscando contratistas para viajar rápidamente a la estación y eliminar a todos los intrusos en las inmediaciones antes de que nuestras fuerzas de seguridad se vean abrumadas.  \n\nNo estamos seguros de si los atacantes están apuntando al contrabando en nuestro almacén de evidencia o a nuestra base de datos de CrimeStat, pero sea lo que sea que estén buscando, deben ser eliminados. Recibirás un bono de combate por cada objetivo neutralizado.  \n\nAl aceptar este contrato, aceptas cumplir con todos los protocolos de seguridad de Crusader: si dañas a algún guardia u otros contratistas autorizados mientras estás en la estación, tu contrato será terminado y serás marcado como un objetivo. \n\nEl tiempo es esencial, pero asegúrate de estar bien equipado para manejar a los hostiles antes de responder. \n\nCONTRATO AUTORIZADO POR: \nOficial de Enlace Bautista \nID# 948J030K\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
