Bitzeroes_bombingrun_dc_desc_001=Hemos estado intentando acceder a algunos datos sensibles en ~mission(Location|Address), pero parece que solo hay una puerta trasera que podemos usar. El problema es que necesitamos a alguien en el lugar para activarla. Y cuando digo activarla, realmente me refiero a activarla.\n\nSi puedes dirigirte allí y destruir parte de su infraestructura, los sistemas de respaldo de emergencia se activarán y deberíamos poder acceder a todo lo que queremos. \n\nOjalá pudiera ver la expresión de sorpresa en las caras de los miserables que dirigen el lugar cuando suceda.\n\n- Bit Zeroes\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500\n<EM4>Turrets:</EM4> present (hostile)
Bitzeroes_bombingrun_dc_title_001=Reducido a Cenizas <EM4>[500–2,000 Rep]</EM4>
Bitzeroes_destroygen_locked_dc_desc_001=Necesito tu ayuda en un trabajo, pero no puedo entrar en muchos detalles sobre las específicicaciones. Si eso es un problema para ti, no te preocupes.\n\nVas a dirigirte a ~mission(Location|Address) y hacer volar por los aires un generador de energía por nosotros. Ahora bien, mantienen el generador bajo llave, así que primero tendrás que buscar los códigos de acceso. Afortunadamente, suelen tener copias del código en datapads. (Piensan que eso los mantendrá a salvo de ser pirateados).\n\nDestruyes ese generador, y será tu cuenta bancaria la que explote a continuación.\n\n- Bit Zeroes\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Bitzeroes_destroygen_locked_dc_title_001=Corte de Energía Obligatorio <EM4>[500 Rep]</EM4>
Bitzeroes_destroyitem_dc_desc_001=No entraré en toda la aburrida y larga historia de por qué, pero hay algunas partes de ~mission(Location|Address) que necesitamos destruir. La parte importante es que quiero pagarte una buena cantidad de créditos por hacerlo. Casi siento que deberías pagarnos por esto debido a lo divertido que va a ser.\n\nNo me importa cómo lo hagas. Granadas, lanzacohetes, un burrito torpedo caducado, todo nos da igual.\n\n- Bit Zeroes \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Bitzeroes_destroyitem_dc_title_001=Gran Desastre <EM4>[500 Rep]</EM4>
Bitzeroes_destroyservers_locked_dc_desc_001=Oye,\n\nTenemos un problema en el que podríamos usar tu ayuda. Uno de nuestros antiguos reclutas hizo un trabajo completamente pésimo en un hackeo y terminó dejando una huella digital tan desordenada que bien podría ser una confesión completa. \n\nUna eliminación remota no va a ser suficiente, así que quiero que vayas a ~mission(Location|Address) y te asegures de que sus servidores de datos sean borrados de la existencia.\n\nComo si esto no fuera ya suficientemente desastroso, los códigos de acceso a la puerta de la sala de servidores bloqueada solo se almacenan físicamente en el lugar. Eso significa que primero tendrás que conseguir un datapad con el código antes de que puedas acercarte siquiera a ellos.\n\nPero no te preocupes. Me aseguraré de que los créditos valgan la pena todo el problema.  \n\n- Bit Zeros\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
Bitzeroes_destroyservers_locked_dc_title_001=Servidor No Encontrado <EM4>[1,000 Rep]</EM4>
Bitzeroes_destroystash_dc_desc_001=Los Bitzeroes de ~mission(Location|Address) decidieron que sería una buena idea interferir en nuestro negocio, y ahora necesitamos hacerles saber inequívocamente que estaban equivocados.\n\nDespués de investigar un poco en sus datos, pudimos descubrir dónde guardan su alijo esos idiotas. Ahora todo lo que necesitamos es que vayas allí y destruyas hasta el último rastro de ello.\n\nCreemos que eso debería dejar en claro el mensaje.\n\n- Bit Zeros\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +500
Bitzeroes_destroystash_dc_title_001=Golpea donde más duele <EM4>[500 Rep]</EM4>
Bitzeroes_eliminateall_dc_desc_001=Los despreciables rastreros de ~mission(Location|Address) nos han estado vendiendo datos basura mientras intentan hacer tratos por duplicado. No podemos permitirlo.\n\nQueremos que vayas a enseñarles una última lección y elimines a todos los cobardes que puedas encontrar. Lo último que supe es que estaban refugiados cerca de ~mission(Location). \n\nDerrama su sangre, y llenaremos tu billetera. \n\n-Bit Zeroes\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000\n<EM4>Hostiles:</EM4> Juggernauts x2, Soldiers x12, Technicians x2
Bitzeroes_eliminateall_dc_title_001=Eliminar Permanentemente <EM4>[1,000 Rep]</EM4>
Bitzeroes_heist_buyin_dc_desc_001=Estoy viendo ahora mismo un registro de transferencia de inventario que está a punto de reventar con un montón de carga muy valiosa que prácticamente está pidiendo a gritos ser robada. Seguro que hay algunas personas allí cuidando la mercancía, pero cuanto más difícil sea la pelea, ¡más dulce será el botín, ¿verdad?\n\nNormalmente, estaríamos en todos lados en un trabajo como este, pero tenemos otro objetivo en punto de mira en este momento y me disgustaría que información tan buena se desperdiciara.\n\n¿Qué dices? ¿Te interesa intentarlo? Envíame unos cuantos créditos y la ubicación será toda tuya.\n\n-Bit Zeroes\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
Bitzeroes_theft_dc_desc_001=De acuerdo,\n\nEn ~mission(Location|Address) hay algunas cosas en particular que tienen en su posesión que necesitan ser liberadas. Seguro que puede haber algunos guardias o personas preocupadas con las que tendrás que lidiar, pero en su mayor parte es una transacción relativamente sencilla: toma las cosas de ~mission(Location) y llévalas a nosotros en ~mission(Destination|Address). \n\nA veces lo simple es lo mejor.\n\n-Bit Zeroes \n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard\n<EM4>Rep:</EM4> +1,000
Bitzeroes_theft_dc_title_001=Reasignación de Propiedad <EM4>[500–1,000 Rep]</EM4>
Bitzeroes_theft_mines_dc_desc_001=Realmente espero que aceptes coger esto porque parece que no hay muchas personas dispuestas a enfrentarse a un montón de minas de proximidad. Mira, hay un marcador que hemos localizado en ~mission(Location|Address), pero la seguridad física está resultando más difícil de lo esperado. \n\nSi puedes encontrar una forma de navegar a través de las minas o posiblemente una forma de activarlas remotamente, debería ser relativamente fácil agarrar la mercancía y salir de allí. Obtendrás más que tu parte justa de los créditos por asumir el riesgo.\n\n-Bit Zeroes\n\n\n<EM3>MISSION DETAILS</EM3>\n<EM4>Engagement Type:</EM4> Ship\n<EM4>Mission Type:</EM4> Standard
