Covalex_courier_fromdc_large_desc_001=Hola,\n\nTenemos un envío bastante grande esperando en el ~mission(Pickup1) en ~mission(Pickup1|Dirección) que está listo para ser entregado.\n\nCon este número de cajas para transportar, probablemente sería bueno tener un juego extra de manos para ayudar a transferir todo dentro y fuera de tu nave.\n\nPAQUETES PARA RECOGER \n     · Todos los paquetes en el ~mission(Pickup1) en ~mission(Pickup1|Dirección)\n\nUBICACIONES DE ENTREGA (EN CUALQUIER ORDEN)\n     · Paquete #~mission(item1|númerodeserie) a ~mission(Dropoff1|Dirección)\n     · Paquete #~mission(item2|númerodeserie) a ~mission(Dropoff2|Dirección)\n     · Paquete #~mission(item3|númerodeserie) a ~mission(Dropoff3|Dirección)\n     · Paquete #~mission(item4|númerodeserie) a ~mission(Dropoff4|Dirección)\n     · Paquete #~mission(item5|númerodeserie) a ~mission(Dropoff5|Dirección)\n     · Paquete #~mission(item6|númerodeserie) a ~mission(Dropoff5|Dirección)\n     · Paquete #~mission(item7|númerodeserie) a ~mission(Dropoff6|Dirección)\n     · Paquete #~mission(item8|númerodeserie) a ~mission(Dropoff6|Dirección)\n     · Paquete #~mission(item9|númerodeserie) a ~mission(Dropoff7|Dirección)\n     · Paquete #~mission(item10|númerodeserie) a ~mission(Dropoff7|Dirección)\n     · Paquete #~mission(item11|númerodeserie) a ~mission(Dropoff8|Dirección)\n     · Paquete #~mission(item12|númerodeserie) a ~mission(Dropoff8|Dirección)\n     · Paquete #~mission(item13|númerodeserie) a ~mission(Dropoff9|Dirección)\n     · Paquete #~mission(item14|númerodeserie) a ~mission(Dropoff9|Dirección)\n     · Paquete #~mission(item15|númerodeserie) a ~mission(Dropoff9|Dirección)\n\n¡Buena suerte!\n\nChase Hewitt\nCoordinador Jr. de Logística\nEnvíos Covalex  \n'Cualquier cosa que necesites, en cualquier lugar que la necesites.'\n\n\n\n\n\n\n\nEnvíos Covalex es una corporación de responsabilidad limitada. Al aceptar este contrato, aceptas todos los términos y condiciones según se detalla en nuestra 'Guía