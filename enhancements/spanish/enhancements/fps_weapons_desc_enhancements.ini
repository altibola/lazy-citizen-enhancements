item_DescKSAR_pistol_ballistic_01=Fabricante: Kastak Arms\nTipo de artículo: Pistol\nClase: Balistica\n\nTamaño del cargador: 6\nVelocidad de disparo: 180 rpm \nAlcance efectivo: 100 m\n\nAccesorios: optica (S1), Cañon (S1), Debajo del cañon (S1)\n\nA menudo llamado Kastak Arms "cañon de mano, " la Coda puede terminar un enfrentamiento con una sola bala calibre .50, aunque el poder sustancial puede hacer que el retroceso del Coda sea difícil de manejar. Teniendo en cuenta el tamaño limitado del cargador y su considerable potencia, se desaconseja el fuego sostenido en favor de disparos únicos mas precisos.\n\n--- STATS ---\nWeight: 1.3 kg\nFire Rate: 180 RPM\nFire Modes: Semi-Auto\nAlpha Dmg: 60.0 (Phys)  |  DPS: 180.0\nAmmo: 6\nVelocity: 550 m/s  |  Absolute Range: 1.1 km\nFull Dmg to: 55 m  |  Drop: -0.20/m  |  Min Dmg: 35.0
item_DescKsar_rifle_energy_01_blue_gold_01=Fabricante: Kastak Arms\nTipo de artículo: Rifle de asalto\nClase: Energía (Plasma)\n\nTamaño de la batería: 30\nCadencia de fuego: 500 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Bajo cañón (S2)\n\nEl Karna es un clásico rifle de asalto de plasma de Kastak Arms. Este destructor de alcance medio cuenta con modos de fuego en ráfaga, cargado y automático completo para permitir ajustes situacionales rápidos y fáciles. Además de su renombrado poder de fuego, el aspecto robusto y la fiabilidad del Karna lo han convertido en una de las armas más populares de Kastak Arms. El llamativo esquema de colores azul y dorado le da a la edición Valor un atractivo valiente y digno.\n\n--- STATS ---\nWeight: 3.5 kg\nFire Rate: 600 RPM\nFire Modes: Auto / Charge / Semi-Auto\nAlpha Dmg: 17.5 (Energy)  |  DPS: 175.0\nAmmo: 35\nVelocity: 600 m/s  |  Absolute Range: 1.2 km\nFull Dmg to: 20 m  |  Drop: -0.11/m  |  Min Dmg: 14.5
