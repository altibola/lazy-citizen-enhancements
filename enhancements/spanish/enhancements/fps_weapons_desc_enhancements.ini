item_Descksar_sniper_ballistic_01=Fabricante: Kastak Arms\nTipo de artículo: Rifle de francotirador\nClase: Balistico\n\nTamaño de cargador: 8\nVelocidad de disparo: 30 rpm\nAlcance efectivo: 120 m\n\nAccesorios: optica (S3), Cañon (N/A), Debajo del cañon (S2)\n\nEl bisturi es un sni único y versatil por rifle de Kastak Brazos. Diseñado con dos cañones apilados uno encima del otro, tiene dos modos de disparo para que puedas adaptar tu disparo a la situacion. Puede realizar un disparo único y potente desde una larga distancia o disparar ambos cañones en rapida sucesion para crear una rafaga de doble disparo.\n\n--- STATS ---\nWeight: 5.1 kg\nFire Rate: 600 RPM\nFire Modes: Burst / Semi-Auto\nAlpha Dmg: 45.0 (Phys)  |  DPS: 450.0\nAmmo: 12\nVelocity: 875 m/s  |  Absolute Range: 1.8 km\nFull Dmg to: 335 m  |  Min Dmg: 45.0
