item_Descgmni_sniper_ballistic_01=Fabricante: Gemini\nTipo de Artículo: Rifle de Francotirador\nClase: Balística\n\nCapacidad del Cargador: 15\nTasa de Fuego: 120 rpm\nRango Efectivo: 80 m\n\nAccesorios: Óptica (S3), Cañón (S2), Bajo el Cañón (S2)\n\nDevasta a larga distancia con el rifle de francotirador A03. Diseñada magistralmente por Clem, cofundador tevarin de Gemini, esta arma equilibra un diseño elegante y ergonómico con un potente impacto balístico. El A03 ofrece una impresionante tasa de fuego para un rifle de francotirador que sacrifica precisión por urgencia cuando se requieren disparos sucesivos. Dada su fama por diseño y características únicas, es fácil entender por qué el A03 se ha convertido en el favorito de los profesionales de seguridad en todo el imperio.\n\n--- STATS ---\nWeight: 4.7 kg\nFire Rate: 225 RPM\nFire Modes: Semi-Auto\nAlpha Dmg: 42.5 (Phys)  |  DPS: 159.4\nAmmo: 15\nVelocity: 800 m/s  |  Absolute Range: 1.6 km\nFull Dmg to: 150 m  |  Drop: -0.02/m  |  Min Dmg: 35.0
