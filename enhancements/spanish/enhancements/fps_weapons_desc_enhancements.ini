item_Descklwe_rifle_energy_01=Fabricante: Klaus & Werner\nTipo de artículo: Rifle de asalto\nClase: energía (Laser)\n\nTamaño de la bateria: 45\nVelocidad de disparo: 450 rpm\nRango efectivo: 50 m\n\nAccesorios: optica (S2), Cañon (S2), Debajo del cañon (S2)\n\nLas armas de asalto fiables nunca fallan fuera de estilo . Klaus & Werner mantiene esa tradicion al presentar el Gallant. Este rifle de asalto basado en energía es capaz de proporcionar fuego preciso y sostenido contra objetivos de hasta media distancia, mientras que su sistema de energía de alta capacidad permite a los operadores disparar considerablemente mas tiros por bateria.\n\n--- STATS ---\nWeight: 3.8 kg\nFire Rate: 900 RPM\nFire Modes: Burst\nAlpha Dmg: 21.0 (Energy)  |  DPS: 315.0\nAmmo: 45\nVelocity: 1,200 m/s  |  Absolute Range: 4.8 km
