item_Descklwe_lmg_energy_01_purple_blue01=Fabricante: Klaus & Werner\nTipo de Artículo: Ametralladora Ligera (LMG)\nClase: Energía (Láser)\n\nTamaño de la Batería: 100\nVelocidad de Disparo: 400 rpm\nAlcance Efectivo: 40 m\n\nAccesorios: Óptica (S2), Cañón (S2), Debajo del Cañón (S3)\n\nKlaus & Werner ha creado un arma icónica con la probada y verdadera ametralladora láser Demeco. Utilizada extensamente en enfrentamientos militares, este favorito de la infantería a corta y media distancia ha sido construido con estabilidad y precisión como prioridad. La edición Ultravioleta presenta un atractivo color violeta y orquídea.\n\n--- STATS ---\nWeight: 9.8 kg\nFire Rate: 800 RPM\nFire Modes: Auto\nAlpha Dmg: 11.5 (Energy)  |  DPS: 153.3\nAmmo: 100\nVelocity: 600 m/s  |  Absolute Range: 2.4 km
item_Descklwe_pistol_energy_01=Manufacturer: Klaus & Werner\nTipo de artículo: Pistol\nClass: Energy (Laser)\n\nBattery Size: 30\nRate Of Fire: 300 rpm\nEffective Range: 30 m\n\nAttachments: Optics (S1), Barrel (S1), Underbarrel (S1)\n\nA handheld laser made famous as Kyle Fenris' Como arma en el exitoso programa de video The Frontier, el Klaus & Werner Model II Arclight se ha vuelto extremadamente popular en el mercado civil. A pesar de su atractivo mediatico, el Modelo II ofrece una mayor cadencia de tiro que cualquiera de sus homologos balisticos. Si bien eso puede disminuir el poder de detencion del arma, su celda de energía ofrece disparos mas que suficientes para terminar el trabajo.\n\n--- STATS ---\nWeight: 1.4 kg\nFire Rate: 700 RPM\nFire Modes: Burst / Semi-Auto\nAlpha Dmg: 18.0 (Energy)  |  DPS: 210.0\nAmmo: 30\nVelocity: 600 m/s  |  Absolute Range: 1.2 km
item_Descklwe_pistol_energy_01_chromic01=Fabricante: Klaus & Werner\nTipo de artículo: Pistol\nClase: energía (Laser)\n\nTamaño de la bateria: 30\nVelocidad de disparo: 300 rpm\nAlcance efectivo: 30 m\n\nUn laser de mano que se hizo famoso como el arma de Kyle Fenris en el exitoso programa de video The Frontier, el Klaus & Werner Model II Arclight se ha vuelto extremadamente popular en el mercado civil. A pesar de su atractivo mediatico, el Modelo II ofrece una mayor cadencia de tiro que cualquiera de sus homologos balisticos. Si bien eso puede disminuir el poder de detencion del arma, su celda de energía ofrece disparos mas que suficientes para terminar el trabajo. Esta edicion exclusiva de Glimmer presenta un revestimiento iridiscente distintivo que hace que el arma brille con diferentes colores según las condiciones de iluminacion y el angulo desde el que se mira.\n\n--- STATS ---\nWeight: 1.4 kg\nFire Rate: 700 RPM\nFire Modes: Burst / Semi-Auto\nAlpha Dmg: 18.0 (Energy)  |  DPS: 210.0\nAmmo: 30\nVelocity: 600 m/s  |  Absolute Range: 1.2 km
