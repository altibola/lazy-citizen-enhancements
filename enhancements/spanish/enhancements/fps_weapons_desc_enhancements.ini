item_Desclbco_sniper_energy_01=Fabricante: Lightning Bolt Co. \nTipo de artículo: Rifle de francotirador\nClase: Electron\n\nTamaño del cargador: 5\nVelocidad de disparo: 30 rpm\nAlcance efectivo: 150 m+\n\nAccesorios: optica (S3), Debajo del cañon (S2)\n\n El Atzkav es un rifle de francotirador de precision único de Lightning Bolt Co. una vez Cuando la manija de carga esta activada, dispara con precision un electron cargado para causar un daño energetico significativo que se propaga a los objetivos conductores cercanos. Este efecto de pulso especial tambien deja una carga residual en el area del impacto que aumenta el daño causado por disparos de electrones posteriores. Ademas de las capacidades especiales de disparo del rifle, el Atzkav es mejor conocido por su distintivo cañon que crepita con energía al disparar su siguiente disparo.\n\n--- STATS ---\nWeight: 9.1 kg\nFire Rate: 30 RPM\nFire Modes: Semi-Auto\nAlpha Dmg: 165.0 (Energy: 120.0 / Distort: 35.0 / Stun: 10.0)  |  DPS: 82.5\nAmmo: 8\nVelocity: 500 m/s  |  Absolute Range: 1.0 km\nFull Dmg to: 350 m  |  Drop: -0.01/m  |  Min Dmg: 30.0
