item_Desclbco_pistol_energy_01=Fabricante: Lightning Bolt Co. \nTipo de artículo: Pistol\nClase: Electron\n\nTamaño de la bateria: 10\nVelocidad de disparo: 350 rpm\nAlcance efectivo: 35m\n\nAccesorios: optica (S1), Debajo del cañon (S1)\n\nLa excelencia en ingenieria solo rasca la superficie de la distintiva pistola Yubarev. Irina Arkadova, ex mercenario convertida en magnate de la fabricacion de armas, superviso cada aspecto del arma, dotandola de poder, practicidad y garbo. Con una empuñadura de madera clasica y un diseño de cañon de vanguardia, el Yubarev dispara un disparo de electrones cargados que impacta no solo a al objetivo, amplificando la carga con cada golpe, sino que tambien puede extenderse a objetivos conductores adicionales dentro del alcance.\n\n--- STATS ---\nWeight: 1.6 kg\nFire Rate: 350 RPM\nFire Modes: Semi-Auto\nAlpha Dmg: 41.0 (Energy: 32.5 / Distort: 7.5 / Stun: 1.0)  |  DPS: 239.2\nAmmo: 10\nVelocity: 500 m/s  |  Absolute Range: 1.0 km\nFull Dmg to: 20 m  |  Drop: -0.10/m  |  Min Dmg: 1.5
