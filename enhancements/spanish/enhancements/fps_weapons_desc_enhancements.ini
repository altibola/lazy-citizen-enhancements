item_Descgmni_rifle_ballistic_01_IAE2023=Fabricante: Gemini\nTipo de Artículo: Rifle de Asalto\nClase: Balística\n\nTamaño del Cargador: 30\nVelocidad de Disparo: 300 rpm / 900 rpm\nAlcance Efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Debajo del Cañón (S2)\n\nCon el S71, Gemini diseñó un rifle de asalto ergonómico ideal para enfrentamientos a media distancia. Con un calibre más pequeño que otras armas de su clase, el S71 se ha vuelto popular entre profesionales militares privados por su estética elegante y precisión precisa. Diseñada en honor a la IAE 2953, la edición Ascension ha sido decorada con elegantes acentos de acero y cobre inspirados en el Syulen de Gatac Manufacture.\n\n--- STATS ---\nWeight: 2.5 kg\nFire Rate: 500 RPM\nFire Modes: Semi-Auto\nAlpha Dmg: 21.5 (Phys)  |  DPS: 179.2\nAmmo: 30\nVelocity: 1,200 m/s  |  Absolute Range: 2.4 km\nFull Dmg to: 100 m  |  Drop: -0.10/m  |  Min Dmg: 17.5
item_Descgmni_rifle_ballistic_01_firerats01=Fabricante: Gemini\nTipo de artículo: Rifle de asalto\nClase: Balistico\n\nTamaño del cargador: 30\nVelocidad de disparo: 300 rpm / 900 rpm\nAlcance efectivo: 50 m\n\nAccesorios: optica (S2), Cañon (S2), Debajo del cañon (S2)\n\nCon el S71, diseño Gemini un rifle de asalto ergonomico ideal para enfrentamientos de rango medio. Equipado con una bala de menor calibre que otras armas de su clase, el S71 se ha vuelto popular entre los profesionales militares privados por su estetica elegante y precision precisa. La contribucion de la famosa cazarrecompensas basada en Pyro Nala "Bullseye" Govea a la linea Legendary Bounty Hunters fue darle a su arma favorita un tinte rojo y negro apropiado para la estrella de bengala en el corazon del sistema que acecha.\n\n--- STATS ---\nWeight: 2.5 kg\nFire Rate: 500 RPM\nFire Modes: Semi-Auto\nAlpha Dmg: 21.5 (Phys)  |  DPS: 179.2\nAmmo: 30\nVelocity: 1,200 m/s  |  Absolute Range: 2.4 km\nFull Dmg to: 100 m  |  Drop: -0.10/m  |  Min Dmg: 17.5
