item_Descgmni_pistol_ballistic_01_green_grey01=Fabricante: Gemini\nTipo de Artículo: Pistola\nClase: Balística\n\nCapacidad del Cargador: 13\nTasa de Fuego: 400 rpm\nRango Efectivo: 30 m\n\nAccesorios: Óptica (S1), Cañón (S1), Bajo el Cañón (S1)\n\nEl LH86 de Gemini es una pistola cinética compacta diseñada para defensa personal y combate a corta distancia. Un cuidado en la ergonomía y equilibrio, junto con una construcción resistente, hace que esta pistola sea adecuada para cualquier tirador en diversas condiciones hostiles. El LH86 también cuenta con una mira de bajo nivel de luz Tritium y un cargador de trece rondas. Esta edición especial Luckbringer en verde y gris, lanzada para Stella Fortuna 2954, es una excelente manera de tener la suerte de tu lado.\n\n--- STATS ---\nWeight: 1.0 kg\nFire Rate: 950 RPM\nFire Modes: Auto\nAlpha Dmg: 13.0 (Phys)  |  DPS: 205.8\nAmmo: 25\nVelocity: 500 m/s  |  Absolute Range: 950 m\nFull Dmg to: 20 m  |  Drop: -0.10/m  |  Min Dmg: 5.0
