item_descklwe_sniper_energy_01=Fabricante: Klaus & Werner\nTipo de artículo: Rifle de francotirador\nClase: energía (Laser)\n\nTamaño de la bateria: 20\nVelocidad de disparo: 50 rpm\nRango efectivo: 100 m\n\nAccesorios: optica (S3), Cañon (S2), Debajo del cañon (S2)\n\nKlaus & Werner 's Arrowhead Model VI de largo El rifle de energía de alcance presenta un cuerpo compuesto de fibra de vidrio capaz de soportar cualquier cantidad de entornos rigurosos tanto en la atmosfera como en el exterior. Construido con una culata de precision, una mira compuesta y un bipode incorporado, el Arrowhead ofrece un arma estable y devastadora para los operadores que desean mantener la distancia, pero permanecer en la lucha.\n\n--- STATS ---\nWeight: 6.8 kg\nFire Rate: 70 RPM\nFire Modes: Charge / Semi-Auto\nAlpha Dmg: 50.0 (Energy)  |  DPS: 58.3\nAmmo: 16\nVelocity: 1,000 m/s  |  Absolute Range: 4.0 km
