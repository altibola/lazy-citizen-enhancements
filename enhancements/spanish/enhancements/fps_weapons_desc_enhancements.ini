item_Desckegr_fire_extinguisher_01=Fabricante: KE Group\nTipo de artículo: Extintor de incendios\nClase: Gadget\n\nTamaño del cargador: Bote de gas\nVelocidad de incendio: Constante\nRango efectivo: 3-4 m\n\nEl extintor de incendios APX de KE Group ha sido calificado como el mejor equipo de seguridad de consumo de su clase durante mas de una decada, convirtiendolo en el estandar de la industria en prevencion de incendios. Lleno de un compuesto refrigerante gaseoso patentado, el extintor puede sofocar rapidamente cualquier incendio a la vista. La pantalla digital del dispositivo le permite controlar la temperatura local para ayudarle a contener y eliminar los riesgos de incendio.\n\n--- STATS ---\nWeight: 3.2 kg\nFire Rate: 600 RPM\nFire Modes: Auto\nAlpha Dmg: 18.0 (Thermal)  |  DPS: 180.0\nAmmo: 3,000\nRegen: 0/s  |  Cooldown: 3.0s  |  Cost/Shot: 1\nVelocity: 600 m/s  |  Absolute Range: 1.2 km
item_Descklwe_lmg_energy_01=Fabricante: Klaus & Werner\nTipo de artículo: LMG\nClase: energía (Laser)\n\nTamaño de la bateria: 100\nVelocidad de disparo: 400 rpm\nRango efectivo: 40 m\n\nAccesorios: optica (S2), Barril (S2), Debajo del cañon (S3)\n\nKlaus & Werner tiene creo un arma iconica con LMG laser Demeco probado y verdadero. Utilizado ampliamente en enfrentamientos militares, este favorito de la infanteria de corto a medio alcance ha sido construido con estabilidad y precision a la vanguardia.\n\n--- STATS ---\nWeight: 9.8 kg\nFire Rate: 800 RPM\nFire Modes: Auto\nAlpha Dmg: 11.5 (Energy)  |  DPS: 153.3\nAmmo: 100\nVelocity: 600 m/s  |  Absolute Range: 2.4 km
