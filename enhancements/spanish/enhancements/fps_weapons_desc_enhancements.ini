item_Descklwe_smg_energy_01=Fabricante: Klaus & Werner\nTipo de artículo: SMG\nClase: Laser\n\nTamaño de la bateria: 45\nVelocidad de disparo: 562,5 rpm\nRango efectivo: 25m\n\nAccesorios: optica (S1), Barril (S1), Debajo del cañon (S1)\n\n\n\n\nX La mano de obra esta una vez mas a la vista para hacer que el El rifle de energía compacto laser Lumin V es aun mas letal y fiable. Un nuevo modo de "disparo automático a intervalos" dispara rafagas de cinco disparos cuando se mantiene presionado el gatillo, utilizando la saturacion del objetivo que viene con el disparo automático y al mismo tiempo proporciona pausas para recompensar la puntería. Incluso cuando esta constantemente atacando, el excelente diseño del arma proporciona un retroceso bajo y una apertura ajustada.\n\n--- STATS ---\nWeight: 2.6 kg\nFire Rate: 700 RPM\nFire Modes: Burst\nAlpha Dmg: 21.0 (Energy)  |  DPS: 245.0\nAmmo: 45\nVelocity: 600 m/s  |  Absolute Range: 1.2 km
item_Descklwe_smg_energy_01_mr01=item_Nameklwe_smg_energy_01_mr01\n\n--- STATS ---\nWeight: 2.6 kg\nFire Rate: 700 RPM\nFire Modes: Burst\nAlpha Dmg: 21.0 (Energy)  |  DPS: 245.0\nAmmo: 45\nVelocity: 600 m/s  |  Absolute Range: 1.2 km
item_Descklwe_smg_energy_blue_gold_01=Fabricante: Klaus & Werner\nTipo de artículo: SMG\nClase: Láser\n\nTamaño de la batería: 45\nCadencia de fuego: 562.5 rpm\nAlcance efectivo: 25 m\n\nAccesorios: Óptica (S1), Cañón (S1), Bajo cañón (S1)\n\nUna vez más, la artesanía experta de Klaus & Werner está en plena exhibición para hacer que el rifle compacto de energía láser Lumin V sea aún más letal y confiable. Un nuevo modo de "disparo automático por intervalos" dispara ráfagas de cinco rondas cuando se mantiene presionado el gatillo, utilizando la saturación de objetivos que proviene del disparo automático mientras proporciona pausas para volver a compensar el objetivo. Incluso cuando está constantemente en ataque, el excelente diseño del arma proporciona bajo retroceso y una dispersión mínima. El llamativo esquema de colores azul y dorado le da a la edición Valor un atractivo valiente y digno.\n\n--- STATS ---\nWeight: 2.6 kg\nFire Rate: 700 RPM\nFire Modes: Burst\nAlpha Dmg: 21.0 (Energy)  |  DPS: 245.0\nAmmo: 45\nVelocity: 600 m/s  |  Absolute Range: 1.2 km
item_Descklwe_sniper_energy_01_Luminalia_red01=Fabricante: Klaus & Werner\nTipo de artículo: Rifle de francotirador\nClase: energía (Laser)\n\nTamaño de la bateria: 20\nVelocidad de disparo: 50 rpm\nRango efectivo: 100 m\n\nAccesorios: optica (S3), Cañon (S2), Debajo del cañon (S2)\n\nKlaus & Werner 's Arrowhead Model VI de largo El rifle de energía de alcance presenta un cuerpo compuesto de fibra de vidrio capaz de soportar cualquier cantidad de entornos rigurosos tanto en la atmosfera como en el exterior. Construido con una culata de precision, una mira compuesta y un bipode incorporado, el Arrowhead ofrece un arma estable y devastadora para los operadores que desean mantener la distancia, pero permanecer en la lucha. Lanzada por primera vez durante Luminalia, la edicion Lamplighter se inspiro en el tradicional color rojo navideño.\n\n--- STATS ---\nWeight: 6.8 kg\nFire Rate: 70 RPM\nFire Modes: Charge / Semi-Auto\nAlpha Dmg: 50.0 (Energy)  |  DPS: 58.3\nAmmo: 16\nVelocity: 1,000 m/s  |  Absolute Range: 4.0 km
item_Descksar_pistol_ballistic_01_IAE2023=Fabricante: Kastak Arms\nTipo de Artículo: Pistola\nClase: Balística\n\nTamaño del Cargador: 6\nVelocidad de Disparo: 180 rpm\nAlcance Efectivo: 100 m\n\nAccesorios: Óptica (S1), Cañón (S1), Debajo del Cañón (S1)\n\nA menudo llamada la "pistola de mano" de Kastak Arms, la Coda puede poner fin a un enfrentamiento con un solo proyectil de calibre .50, aunque la potencia sustancial puede hacer que el retroceso de la Coda sea difícil de manejar. Dada su limitada capacidad de cargador y el considerable retroceso, se desaconseja el fuego sostenido en favor de disparos individuales más precisos. Diseñada en honor a la IAE 2953, la edición Ascension tiene acentos de acero y cobre inspirados en el Syulen de Gatac Manufacture.\n\n--- STATS ---\nWeight: 1.3 kg\nFire Rate: 180 RPM\nFire Modes: Semi-Auto\nAlpha Dmg: 60.0 (Phys)  |  DPS: 180.0\nAmmo: 6\nVelocity: 550 m/s  |  Absolute Range: 1.1 km\nFull Dmg to: 55 m  |  Drop: -0.20/m  |  Min Dmg: 35.0
