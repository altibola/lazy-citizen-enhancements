item_Descgmni_shotgun_ballistic_01=Fabricante: Gemini\nTipo de Artículo: Escopeta\nClase: Balística\n\nCapacidad del Cargador: 18\nTasa de Fuego: 120 rpm / 60 rpm\nAlcance Efectivo: 15 m / 35 m\n\nAccesorios: Óptica (S1), Cañón (N/D), Bajo Cañón (S2)\n\nEl R97 combina un diseño elegante y potencia de detención para ser un arma efectiva en distancias cortas. Esta escopeta balística de Gemini cuenta con dos modos de disparo distintos: un modo de dispersión semi-automático ideal para infligir daño rápidamente y un modo focalizado que ofrece mayor alcance a expensas de algo de potencia. Esta flexibilidad en combate ha hecho que el R97 sea un arma popular de defensa personal en todo el Imperio.\n\n--- STATS ---\nWeight: 2.4 kg\nFire Rate: 455 RPM\nFire Modes: Shotgun / Semi-Auto\nAlpha Dmg: 32.0 x8 (Phys)  |  DPS: 242.7\nAmmo: 18\nVelocity: 225 m/s  |  Absolute Range: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Dmg: 1.2
