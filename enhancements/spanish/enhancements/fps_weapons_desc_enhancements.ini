item_Deschdgw_pistol_ballistic_01=Fabricante: Hedeby Gunworks\nTipo de artículo: Pistola de fragmentacion\nClase: Balistica\n\nTamaño del cargador: 8\nVelocidad de disparo: 140 rpm\nAlcance efectivo: 80 m / 10 m (cargado)\n\nAccesorios: optica (S1), Cañon (S1), Debajo del cañon (S1)\n\n Mientras el Salvo se puede utilizar Como pistola normal, Hedeby no se detuvo ahi. Con un gatillo mas largo, se inyecta una imprimacion congelante en la recamara y, cuando se suelta, el pesado percutor golpea con fuerza suficiente para pulverizar la carcasa sobreenfriada. Desarrollada accidentalmente como un intento de mitigar el sobrecalentamiento, esta opción de fuego cargado descarga una lluvia mortal de fragmentos de alta velocidad seguida de un estallido ensordecedor.\n\n--- STATS ---\nWeight: 0.8 kg\nFire Rate: 170 RPM\nFire Modes: Charge / Semi-Auto\nAlpha Dmg: 45.0 (Phys)  |  DPS: 127.5\nAmmo: 8\nVelocity: 550 m/s  |  Absolute Range: 1.1 km\nFull Dmg to: 30 m  |  Drop: -0.08/m  |  Min Dmg: 25.0
