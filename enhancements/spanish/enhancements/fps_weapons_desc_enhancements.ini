item_Descgmni_smg_ballistic_01_Luminalia=Fabricante: Gemini\nTipo de Artículo: Subfusil\nClase: Balística\n\nCapacidad del Cargador: 50\nTasa de Fuego: 1,100 rpm\nRango Efectivo: 35 m\n\nAccesorios: Cañón (S1), Óptica (S1), Bajo el Cañón (S1)\n\nFácil de manejar y hermoso de contemplar, el C54 es un subfusil elegante y precisamente equilibrado de Gemini. Su marco ligero de polímero y diseño ergonómico lo hacen ideal para enfrentamientos a corta distancia. El C54 es capaz de disparar balas de 10 mm en modo automático para proporcionar apoyo máximo y saturación de objetivos para garantizar que cualquier enfrentamiento termine rápidamente. La edición Luminalia presenta un diseño festivo en rojo y verde.\n\n--- STATS ---\nWeight: 2.0 kg\nFire Rate: 925 RPM\nFire Modes: Auto\nAlpha Dmg: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocity: 500 m/s  |  Absolute Range: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Dmg: 7.5
