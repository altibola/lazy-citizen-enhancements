item_Descgmni_shotgun_ballistic_01_pink_red01=Fabricante: Gemini\nTipo de artículo: Escopeta\nClase: Balística\n\nCapacidad del cargador: 18\nCadencia de fuego: 120 rpm / 60 rpm\nRango efectivo: 15 m / 35 m\n\nAccesorios: Óptica (S1), Cañón (N/D), Bajo cañón (S2)\n\nEl R97 combina un diseño elegante y potencia de parada para ser un arma elegante y efectiva en distancias cortas. Esta escopeta balística de Gemini cuenta con dos modos de disparo distintos: un modo de dispersión semi-automático ideal para infligir daño rápido y un modo enfocado que ofrece un mayor alcance a expensas de algo de potencia. Esta flexibilidad en combate ha convertido al R97 en un arma popular de defensa personal en todo el Imperio. Protégete a ti mismo y a tus seres queridos con la edición especial Kismet del R97, que presenta una combinación de colores rosa y negro reminiscente de la nave que Yuri Ilyin pilotó para rastrear a su amada perdida, Corazon Tan, en el clásico vid Coramor.\n\n--- STATS ---\nWeight: 2.4 kg\nFire Rate: 455 RPM\nFire Modes: Shotgun / Semi-Auto\nAlpha Dmg: 32.0 x8 (Phys)  |  DPS: 242.7\nAmmo: 18\nVelocity: 225 m/s  |  Absolute Range: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Dmg: 1.2
