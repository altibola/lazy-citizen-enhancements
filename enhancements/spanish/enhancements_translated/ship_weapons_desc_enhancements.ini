item_DescGATS_BallisticGatling_S1=Fabricante: Gallenson Tactical Systems\nTipo de artículo: Gatling balistico\nTamaño: 1\n\nSi bien el GT-210 YellowJacket puede ser pequeño, tiene un gran impacto. Esta arma balistica de alta velocidad es perfecta para apuntar a objetivos mas pequeños y moviles y su sistema de suministro de munición DTX-8 elimina casi por completo los atascos de armas debido a balas defectuosas.\n\n--- ATRIBUTOS ---\nPeso: 24.0 kg\nCadencia: 1,600 RPM\nModos de Disparo: Auto\nDaño Alfa: 7.6 (Phys)  |  DPS: 201.6\nMunición: 4,440\nVelocidad: 1,350 m/s  |  Alcance: 2.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 550\nSignatures:  EM: 36  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescGATS_BallisticGatling_S2=Fabricante: Gallenson Tactical Systems\nTipo de artículo: Gatling balistico\nTamaño: 2\n\nEl Scorpion GT-215 es un cañon giratorio tipo Gatling accionado hidraulicamente diseñado para disparar rondas mas pequeñas a una velocidad de disparo muy alta. El Scorpion esta diseñado para destruir armaduras en objetivos muy rápidos, sacrificando potencia por la saturacion absoluta del area objetivo.\n\n--- ATRIBUTOS ---\nPeso: 60.0 kg\nCadencia: 1,600 RPM\nModos de Disparo: Auto\nDaño Alfa: 12.7 (Phys)  |  DPS: 338.7\nMunición: 4,410\nVelocidad: 1,346 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 850\nSignatures:  EM: 36  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
