item_DescMXOX_EMP_Device=Fabricante: MaxOx\nTipo de artículo: Generador de rafagas\nTamaño: 1\nTipo de daño: EMP\n\nEl TroMag de MaxOx es un generador de rafagas centrado en EMP fiable y bien diseñado. Su popularidad ha aumentado a lo largo de los años a medida que los pilotos buscan alternativas al REP-8 de Behring. El TroMag cuenta con un tiempo de carga mas rápido que su principal competidor, pero tiene un radio efectivo mas pequeño, lo que deja a los pilotos decidir si prefieren velocidad o tamaño.\n\n--- ATRIBUTOS ---\nPeso: 10.0 kg\nConsumo de Energía: 1 PU/s\nHP del Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescMXOX_NeutronCannon_S1=Fabricante: MaxOx\nTipo de artículo: Cañon de neutrones\nTamaño: 1\n\nEl cañon de neutrones NN-13 de MaxOx ofrece una carga util de energía masiva a expensas de la velocidad y la eficiencia energetica. Se podrian argumentar las virtudes de la velocidad, la velocidad de disparo y la distancia sobre el daño, pero el argumento se vuelve irrelevante si solo necesitas golpearlos una vez.\n\n--- ATRIBUTOS ---\nPeso: 32.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 101.2 (Energy)  |  DPS: 253.0\nMunición: 25\nRegeneración: 1,500/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 90\nVelocidad: 765 m/s  |  Alcance: 1.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 205  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescMXOX_NeutronCannon_S2=Fabricante: MaxOx\nTipo de artículo: Cañon de neutrones\nTamaño: 2\n\nBasado en la tecnologia del NN-13, el NN-14 de MaxOx ofrece un aumento significativo en la potencia del cañon automático de neutrones para darle a cada disparo un golpe devastador. Sin embargo, ese mayor daño conlleva un mayor consumo de energía.\n\n--- ATRIBUTOS ---\nPeso: 80.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 152.8 (Energy)  |  DPS: 382.0\nMunición: 25\nRegeneración: 2,250/s  |  Tiempo de Recarga: 0.4s  |  Coste/Disparo: 135\nVelocidad: 762 m/s  |  Alcance: 1.3 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 273  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescMXOX_NeutronCannon_S3=item_NameMXOX_NeutronCannon_S3\n\n--- ATRIBUTOS ---\nPeso: 200.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 220.7 (Energy)  |  DPS: 551.8\nMunición: 25\nRegeneración: 3,375/s  |  Tiempo de Recarga: 0.4s  |  Coste/Disparo: 202\nVelocidad: 755 m/s  |  Alcance: 1.5 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 341  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescMXOX_NeutronRepeater_S1=Fabricante: MaxOx\nTipo de artículo: Repetidor de neutrones\nTamaño: 1\n\nEl NDB-26 utiliza un sistema de doble cañon para disparar proyectiles de neutrones a una velocidad rapida. Devastador a corta distancia, este repetidor de neutrones aun tiene suficiente potencia a media distancia como para persuadir a cualquier atacante a reconsiderar su ataque.\n\n--- ATRIBUTOS ---\nPeso: 16.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 38.0 (Energy)  |  DPS: 316.5\nMunición: 75\nRegeneración: 1,758/s  |  Tiempo de Recarga: 0.7s  |  Coste/Disparo: 32\nVelocidad: 1,275 m/s  |  Alcance: 2.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 525\nSignatures:  EM: 138  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescMXOX_NeutronRepeater_S2=Fabricante: MaxOx\nTipo de artículo: Repetidor de neutrones\nTamaño: 2\n\nCon un diseño elegante y cientifico, el MaxOx NDB-28 es el siguiente paso en potencia de frenado importante. Los cañones gemelos se superponen a las explosiones para lograr un fuego sostenido de neutrones que sigue siendo eficaz a corto y medio alcance.\n\n--- ATRIBUTOS ---\nPeso: 40.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 57.0 (Energy)  |  DPS: 474.8\nMunición: 75\nRegeneración: 2,638/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 48\nVelocidad: 1,271 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 184  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescMXOX_NeutronRepeater_S3=Fabricante: MaxOx\nTipo de artículo: Repetidor de neutrones\nTamaño: 3\n\nSe dedicaron decadas de trabajo de diseño a perfeccionar la linea NDB de repetidores de neutrones. El S3 NDB-30 dispara rapidamente proyectiles de neutrones potentes y precisos que rapidamente disuadiran a cualquiera lo suficientemente tonto como para acercarse demasiado.\n\n--- ATRIBUTOS ---\nPeso: 100.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 85.5 (Energy)  |  DPS: 712.5\nMunición: 75\nRegeneración: 3,958/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 71\nVelocidad: 1,258 m/s  |  Alcance: 2.4 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 230  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
