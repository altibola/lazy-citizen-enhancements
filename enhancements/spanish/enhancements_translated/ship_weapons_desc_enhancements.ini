item_DescFSKI_S1_RPOD_3x_S3=Tipo de artículo: Rocket Pod\nFabricante: Firestorm Kinetics\nTamaño: 1\nCohetes: 3xS3\n\nLa capsula de cohetes Yebira I es el sistema perfecto para el despliegue eficiente de artilleria S3. Fabricado por Firestorm Kinetics, este módulo de cohetes lleva tres cohetes y se fija a un punto fijo de cualquier tamaño.\n\n--- ATRIBUTOS ---\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 150.0 (Phys)  |  DPS: 150.0\nMunición: 6\nVelocidad: 700 m/s  |  Alcance: 2.1 km\nHP del Componente: 500
