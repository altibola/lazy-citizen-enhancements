item_DescBEHR_BallisticCannon_S4=Fabricante: Behring\nTipo de artículo: Cañon balistico\nTamaño: 4\n\nLanzando rondas de alto calibre con una velocidad devastadora, el cañon automático balistico C-788 de Behring fue construido para perforar el blindaje de una nave. Extremadamente duradera con una resistencia al calor excepcional, la "Combine" puede manejar una carga de trabajo pesada que, incluso con la velocidad de disparo mas lenta del arma, la convierte en una opción ideal para enfrentarse a objetivos mas grandes y menos maniobrables.\n\n--- ATRIBUTOS ---\nPeso: 2250.0 kg\nCadencia: 50 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 325.0 (Phys)  |  DPS: 270.8\nMunición: 270\nVelocidad: 1,152 m/s  |  Alcance: 3.5 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 50  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
