item_DescPRAR_DistortionScatterGun_S4=Fabricante: Preacher Armaments\nTipo de artículo: Distortion Scattergun\nTamaño: 4\n\nDesactiva la nave de un enemigo sin dañarla con la Salvation Scattergun de Preacher Armaments. Con su amplio alcance y su baja velocidad de disparo, esta escopeta de dispersión de tamaño cuatro es mas potente a corta distancia.\n\n--- ATRIBUTOS ---\nPeso: 750.0 kg\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 480.0 x8 (Distort)  |  DPS: 480.0\nMunición: 75\nRegeneración: 4,800/s  |  Tiempo de Recarga: 0.4s  |  Coste/Disparo: 120\nVelocidad: 778 m/s  |  Alcance: 1.0 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 495  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescPRAR_DistortionScatterGun_S5=Fabricante: Preacher Armaments\nTipo de artículo: Distortion Scattergun\nTamaño: 5\n\nProporciona daño de alta distorsion en espacios reducidos con la pistola de dispersión Absolution de Preacher Armaments. Esta arma de tamaño cinco es una opción de equipamiento ideal para aquellos interesados en capturar o abordar al objetivo.\n\n--- ATRIBUTOS ---\nPeso: 1880.0 kg\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 720.0 x8 (Distort)  |  DPS: 720.0\nMunición: 75\nRegeneración: 7,200/s  |  Tiempo de Recarga: 0.4s  |  Coste/Disparo: 180\nVelocidad: 751 m/s  |  Alcance: 1.5 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 2,640\nSignatures:  EM: 578  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescPRAR_DistortionScatterGun_S6=Fabricante: Preacher Armaments\nTipo de artículo: Distortion Scattergun\nTamaño: 6\n\nLa Condemnation es una enorme pistola de dispersión de tamaño seis de Preacher Armaments. Su alto daño por distorsion incapacita los componentes electronicos, aunque sus amplias extensiones lo hacen menos efectivo a medida que el objetivo se aleja.\n\n--- ATRIBUTOS ---\nPeso: 4690.0 kg\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 1,040.0 x8 (Distort)  |  DPS: 1,040.0\nMunición: 75\nRegeneración: 10,600/s  |  Tiempo de Recarga: 0.4s  |  Coste/Disparo: 265\nVelocidad: 729 m/s  |  Alcance: 2.3 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 4,224\nSignatures:  EM: 660  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
