item_DescBEHR_LaserCannon_S5=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 5\n\nEste versatil cañon automático de energía de larga distancia es el ultimo de la serie M de Behring. El M7A esta diseñado para actuar como un elemento disuasivo de alto impacto eficaz a medio y largo alcance. El nuevo sistema de lentes AC8 minimiza la perdida de potencia de frenado a distancia, lo que hace que cada disparo sea igualmente efectivo a distancias mas largas.\n\n--- ATRIBUTOS ---\nPeso: 5630.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 921.8 (Energy)  |  DPS: 1,536.3\nMunición: 25\nRegeneración: 9,483/s  |  Tiempo de Recarga: 1.5s  |  Coste/Disparo: 569\nVelocidad: 1,112 m/s  |  Alcance: 4.0 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 2,500\nSignatures:  EM: 941  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_LaserCannon_S6=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 6\n\nEl cañon automático laser M8A ejemplifica la extensa historia de Behring en el diseño y construccion de armamento para naves. El resultado es un arma de energía fiable y efectiva capaz de manejar grandes escaramuzas o maniobras defensivas precisas.\n\n--- ATRIBUTOS ---\nPeso: 14100.0 kg\nCadencia: 120 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 900.0 (Energy)  |  DPS: 1,800.0\nMunición: 25\nRegeneración: 14,292/s  |  Tiempo de Recarga: 1.5s  |  Coste/Disparo: 854\nVelocidad: 1,080 m/s  |  Alcance: 6.0 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 4,224\nSignatures:  EM: 1,090  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_LaserCannon_S7=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 7\n\nAtaca el corazon de tus enemigos con el impacto devastador del cañon automático de energía M9A de Behring. Cuando esta completamente cargada, el enorme poder de frenado de esta arma laser tiene el potencial de detener incluso a las naves capitales en seco.\n\n--- ATRIBUTOS ---\nPeso: 6870000.0 kg\nCadencia: 10 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 200,000.0 (Phys)  |  DPS: 33,333.3\nMunición: 21\nVelocidad: 924 m/s  |  Alcance: 12.0 km\nConsumo de Energía: 6 PU/s\nHP del Componente: 708,660\nSignatures:  EM: 3,020  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_LaserCannon_SF7E_S7=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 7\n\nIngenieros de Behring y Crusader colaboraron para hacer del cañon laser SF7E el arma ideal para el Ares Ion Star Fighter. Un caparazon personalizado permite que el arma masiva se integre perfectamente en el cuerpo de la nave. Ideal para enfrentamientos de largo alcance que involucran naves espaciales grandes y de clase capital, la impresionante precision y el alto daño por disparo del SF7E lo convierten en un arma devastadora en manos de un tirador experto.\n\n--- ATRIBUTOS ---\nPeso: 35200.0 kg\nCadencia: 55 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 5,150.0 (Energy)  |  DPS: 4,720.8\nMunición: 25\nRegeneración: 21,355/s  |  Tiempo de Recarga: 1.9s  |  Coste/Disparo: 1,200\nVelocidad: 1,048 m/s  |  Alcance: 7.3 km\nConsumo de Energía: 3 PU/s\nHP del Componente: 6,750\nSignatures:  EM: 1,450  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_LaserCannon_VNG_S2=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 2\n\nBehring ha rediseñado especialmente el clasico M4A para crear el VS (Vanguard Special), un arma laser diseñada para cumplir con los requisitos únicos del Aegis. El arma predeterminada montada en la nariz del Vanguard Warden, el MVSA, solo se puede cargar en otras variantes de Vanguard.\n\n--- ATRIBUTOS ---\nPeso: 360.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 273.0 (Energy)  |  DPS: 455.0\nMunición: 25\nRegeneración: 2,808/s  |  Tiempo de Recarga: 1.5s  |  Coste/Disparo: 168\nVelocidad: 1,196 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 708  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_LaserRepeater_PDC_S1=item_NameBEHR_LaserRepeater_PDC_S1\n\n--- ATRIBUTOS ---\nPeso: 36.0 kg\nCadencia: 1,000 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 10.0 (Energy)  |  DPS: 166.7\nMunición: 75\nRegeneración: 2,025/s  |  Tiempo de Recarga: 0.6s  |  Coste/Disparo: 32\nVelocidad: 1,500 m/s  |  Alcance: 1.6 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 800\nSignatures:  EM: 143  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_LaserRepeater_VNG_S2=Fabricante: Behring\nTipo de artículo: Repetidor laser\nTamaño: 2\n\nAegis encargo a Behring el diseño de un repetidor laser especificamente para su linea Vanguard. El resultado fue el GVSR, que cumplio con los exigentes estandares de Aegis al ofrecer una velocidad de disparo constante sin sobrecargar el generador de la nave.\n\n--- ATRIBUTOS ---\nPeso: 90.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 99.7 (Energy)  |  DPS: 581.7\nMunición: 75\nRegeneración: 3,232/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 55\nVelocidad: 1,495 m/s  |  Alcance: 1.7 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 289  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBOMB_S03_FSKI_Thunderball=Fabricante: FireStorm Kinetics\nTipo de artículo: Bomba explosiva\nTamaño: 3\n\nApunta a las fuerzas terrestrés desde una distancia segura arriba con el Thunderball. A pesar de su pequeño tamaño, estas bombas S3 contienen una poderosa carga util, lo que permite a los usuarios desplegar multiples bombas para abrumar a un objetivo estaciónario o lanzarlas a intervalos para alcanzar objetivos en movimiento. El Thunderball utiliza las aletas Atmo-Xact patentadas de FireStorm Kinetics que se despliegan una vez que se caen para proporcionar orientacion adicional en el camino hacia el objetivo.\n\n--- ATRIBUTOS ---\nPeso: 252.0 kg\nHP del Componente: 1,000\nTemp. de Sobrecalentamiento: 450K
item_DescBOMB_S05_FSKI_Stormburst=Fabricante: FireStorm Kinetics\nTipo de artículo: Bomba explosiva\nTamaño: 5\n\nCausa estragos en las fuerzas terrestrés desde los cielos con Stormburst. Diseñadas por FireStorm Kinetics para maximizar el impacto destructivo en un tamaño mas moderado, estas bombas S5 cuentan con una artilleria compuesta mixta para diezmar objetivos blindados. El Stormburst tambien utiliza las aletas Atmo-Xact patentadas de FireStorm Kinetics para garantizar que la carga util alcance al objetivo.\n\n--- ATRIBUTOS ---\nPeso: 252.0 kg\nHP del Componente: 1,000\nTemp. de Sobrecalentamiento: 450K
item_DescBOMB_S10_FSKI_Colossus=Fabricante: FireStorm Kinetics\nTipo de artículo: Bomba explosiva\nTamaño: 10\n\nLos enemigos a continuacion no tendran ninguna posibilidad contra un Coloso. FireStorm Kinetics diseño esta enorme bomba S10 para devastar objetivos terrestres, ya sean vehículos o estructuras. Diseñado para ser lanzado desde gran altura, el Colossus cuenta con aletas Atmo-Xact patentadas que se despliegan para proporcionar orientacion adicional en el camino hacia el objetivo.\n\n--- ATRIBUTOS ---\nPeso: 951.0 kg\nHP del Componente: 1,000\nTemp. de Sobrecalentamiento: 450K
item_DescESPR_BallisticCannon_S1=Fabricante: Esperia\nTipo de artículo: Cañon balistico \nTamaño: 1\n\nSembra el miedo con el cañon balistico Deadbolt I. Temida por su potencia de fuego a corta distancia, esta famosa arma tevarin se gano su reputación intimidante durante la Primera Guerra Tevarin como parte del devastador arsenal de la flota tevarin. Esperia ha recreado minuciosamente el Deadbolt I por respeto al arma original y a los guerreros que la usaron con tanta eficacia.\n\n--- ATRIBUTOS ---\nPeso: 96.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 202.5 (Phys)  |  DPS: 337.5\nMunición: 396\nVelocidad: 1,200 m/s  |  Alcance: 2.5 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 550\nSignatures:  EM: 41  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
