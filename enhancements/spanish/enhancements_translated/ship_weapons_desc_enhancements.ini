item_DescGRIN_TractorBeam_002_shared=Fabricante: Greycat Industrial\nTipo de Artículo: Rayo Tractor\nÁngulo Máximo: 60°\nRango Máximo: 150 m\nDistancia a Plena Potencia: 75 m\n\nRespaldado por su garantía certificada Soft-Touch®, el rayo tractor SureGrip de Greycat es un pilar de su catálogo de productos gracias a su rango y control fiables.\n\n--- ATRIBUTOS ---\nPeso: 100.0 kg\nModos de Disparo: Rayo Tractor\nMunición: 0\nVelocidad: 0 m/s  |  Alcance: 0 m\nConsumo de Energía: 3 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescGRIN_TractorBeam_002_shared_UT1=Fabricante: Greycat Industrial\nTipo de Artículo: Rayo Tractor\nÁngulo Máximo: 60°\nRango Máximo: 130 m\nDistancia a Plena Potencia: 55 m\n\nEsta variante resistente del rayo tractor SureGrip de Greycat sacrifica alcance a cambio de potencia adicional para manejar objetos más grandes y pesados. Como resultado, el dispositivo se utiliza más comúnmente en una variedad de aplicaciones industriales donde su potencia adicional lo convierte en una herramienta esencial.\n\n--- ATRIBUTOS ---\nPeso: 100.0 kg\nModos de Disparo: Rayo Tractor\nMunición: 0\nVelocidad: 0 m/s  |  Alcance: 0 m\nConsumo de Energía: 3 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescGRIN_TractorBeam_002_shared_UT2=Fabricante: Greycat Industrial\nÁngulo Máximo: 80°\nRango Máximo: 130 m\nDistancia a Plena Potencia: 55 m\n\nEsta variante de precisión del rayo tractor SureGrip de Greycat sacrifica parte de la potencia y el alcance del modelo base a cambio de un ángulo más amplio de manipulación y un mayor agarre del tensor, lo que hace que sea mucho más difícil perder el control de un objeto. Esta precisión convierte a este modelo en una herramienta esencial para cualquier empresa que requiera un manejo cuidadoso.\n\n--- ATRIBUTOS ---\nPeso: 100.0 kg\nModos de Disparo: Rayo Tractor\nMunición: 0\nVelocidad: 0 m/s  |  Alcance: 0 m\nConsumo de Energía: 3 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescGRIN_TractorBeam_003_shared=Fabricante: Greycat Industrial\nTipo de Artículo: Rayo Tractor\nÁngulo Máximo: 80°\nRango Máximo: 135 m\nDistancia a Plena Potencia: 50 m\n\nEl rayo tractor ViseLock es una evolución de la tecnología estándar de la industria de Greycat, con mejoras adicionales diseñadas específicamente para ayudar a las fuerzas de seguridad a contener a sus objetivos. En su diseño, Greycat sacrificó algo de fuerza de retención a distancias mayores para lograr un tensor más potente que es más difícil de escapar.\n\n--- ATRIBUTOS ---\nPeso: 100.0 kg\nModos de Disparo: Rayo Tractor\nMunición: 0\nVelocidad: 0 m/s  |  Alcance: 0 m\nConsumo de Energía: 3 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescGRIN_TractorBeam_004_S3=Fabricante: Greycat Industrial\nTipo de Artículo: Rayo de Remolque\nÁngulo Máximo: 160°\nRango Máximo: 250 m\nDistancia a Plena Potencia: 200 m\n\nLa elección segura y fiable de los equipos de recuperación en todo el imperio, el rayo de remolque SafeTow de Greycat Industrial cuenta con la suficiente fuerza, potencia y control para transportar tanto carga pesada como vehículos completos a través del verso.\n\n--- ATRIBUTOS ---\nPeso: 100.0 kg\nModos de Disparo: Rayo Tractor\nMunición: 0\nVelocidad: 0 m/s  |  Alcance: 0 m\nConsumo de Energía: 3 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescGRIN_TractorBeam_S1=Fabricante: Greycat Industrial\nTipo de artículo: Rayo tractor\n\nLa última incorporacion de Greycat a su linea de rayos tractores probada en campo es una adicion fiable a su catalogo. Aparte de una relacion de traccion/extraccion mas eficiente, el ultimo modelo hace poco para avanzar con respecto a los modelos anteriores. SureGrip tiene configuraciones para apuntar y extraer todo, desde fragmentos de asteroides hasta tripulantes a la deriva, respaldado por la garantia certificada Soft-Touch® de Greycat.\n\n--- ATRIBUTOS ---\nPeso: 200.0 kg\nModos de Disparo: Rayo Tractor\nMunición: 0\nVelocidad: 0 m/s  |  Alcance: 0 m\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
