item_DescRSI_EMP_Magstrand_S4=Tipo de artículo: Generador de rafagas\nFabricante: RSI\nTamaño: 4\n\nEl Magstrand de RSI es un generador de rafagas EMP diseñado especificamente para Scorpius Antares. Cuando esta completamente cargado, el dispositivo crea una poderosa ola de daño por distorsion que puede desactivar los componentes electricos dentro de su radio de explosion.\n\n--- ATRIBUTOS ---\nPeso: 4000.0 kg\nConsumo de Energía: 1 PU/s\nHP del Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
