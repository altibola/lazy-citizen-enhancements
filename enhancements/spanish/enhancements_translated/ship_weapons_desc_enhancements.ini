item_Mining_MiningLaser_Thermyte_1_S1_Desc=Fabricante: Thermyte Concern\nTipo de artículo: Láser de minería \nTamaño: 1\n\nRango óptimo: 45m\nRango máximo: 135m\n\nPotencia del láser de minería: 420 - 2100\nPotencia del láser de extracción: 2775\n\nRanuras de módulo: 2\n\nInestabilidad del láser: -10%\nTamaño de la ventana de carga óptima: +20%\nNivel de material inerte: -30%\n\nResistencia: +10%\nTasa de la ventana de carga óptima: -40%\n\nEl Impact I sobresale en una variedad de situaciones de minería. Lentes de enfoque especiales facilitan el trabajo en un depósito al estabilizar el láser y aumentar la ventana de carga óptima. Hay inconvenientes, incluida una mayor resistencia del depósito y una ventana de carga óptima que se llena más lentamente, pero Thermyte Concern también proporcionó dos ranuras de módulo para permitir a los mineros personalizar mejor el láser para la tarea en cuestión.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 2,100  |  Alcance: 45m→135m\n<EM4>Extracción:</EM4>  DPS: 2,775  |  Alcance: 45m→135m\n<EM4>Modificadores:</EM4>  Instability: -10%  |  Ventana Óptima de Carga: +20%  |  Resistencia: +10%  |  Filtro Inerte: +30%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Thermyte_1_S2_Desc=Fabricante: Thermyte Concern\nTipo de artículo: Láser de minería \nTamaño: 2\n\nRango óptimo: 60m\nRango máximo: 180m\n\nPotencia del láser de minería: 840 - 3360\nPotencia del láser de extracción: 3145\n\nRanuras de módulo: 3\n\nInestabilidad del láser: -10%\nTamaño de la ventana de carga óptima: +20%\nNivel de material inerte: -40%\n\nResistencia: +10%\nTasa de la ventana de carga óptima: -40%\n\nEl Impact II sobresale en una variedad de situaciones de minería. Lentes de enfoque especiales facilitan el trabajo en un depósito al estabilizar el láser y aumentar la ventana de carga óptima. Hay inconvenientes, incluida una mayor resistencia del depósito y una ventana de carga óptima que se llena más lentamente, pero Thermyte Concern también proporcionó tres ranuras de módulo para permitir a los mineros personalizar mejor el láser para la tarea en cuestión.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 3,360  |  Alcance: 60m→180m\n<EM4>Extracción:</EM4>  DPS: 3,145  |  Alcance: 60m→180m\n<EM4>Modificadores:</EM4>  Instability: -10%  |  Ventana Óptima de Carga: +20%  |  Resistencia: +10%  |  Filtro Inerte: +40%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Thermyte_2_S1_Desc=Fabricante: Thermyte Concern\nTipo de artículo: Láser de minería \nTamaño: 1\n\nRango óptimo: 15m\nRango máximo: 45m\n\nPotencia del láser de minería: 630 - 3150\nPotencia del láser de extracción: 1850\n\nRanuras de módulo: 2\n\nResistencia: -30%\nNivel de material inerte: -30%\n\nTamaño de la ventana de carga óptima: -40%\n\nPara algunos, el uso efectivo del Helix I se ha convertido en un signo de un verdadero profesional de la minería. Thermyte Concern dotó al láser de una potencia impresionante que puede superar la resistencia de un depósito, pero también requiere un manejo preciso para alcanzar la ventana de carga óptima. Mejor desplegado a corta distancia, el Helix I cuenta con dos ranuras de módulo para que los mineros puedan personalizar el láser a su gusto.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 3,150  |  Alcance: 15m→45m\n<EM4>Extracción:</EM4>  DPS: 1,850  |  Alcance: 15m→45m\n<EM4>Modificadores:</EM4>  Ventana Óptima de Carga: -40%  |  Resistencia: -30%  |  Filtro Inerte: +30%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Thermyte_2_S2_Desc=Fabricante: Thermyte Concern\nTipo de artículo: Láser de minería \nTamaño: 2\n\nRango óptimo: 30m\nRango máximo: 90m\n\nPotencia del láser de minería: 1020 - 4080\nPotencia del láser de extracción: 2590\n\nRanuras de módulo: 3\n\nResistencia: -30%\nNivel de material inerte: -30%\n\nTamaño de la ventana de carga óptima: -30%\n\nPara algunos, el uso efectivo del Helix II se ha convertido en un signo de un verdadero profesional de la minería. Thermyte Concern dotó al láser de una potencia impresionante que puede superar la resistencia de un depósito, pero también requiere un manejo preciso para alcanzar la ventana de carga óptima. Mejor desplegado a corta distancia, el Helix II cuenta con tres ranuras de módulo para que los mineros puedan personalizar el láser a su gusto.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 4,080  |  Alcance: 30m→90m\n<EM4>Extracción:</EM4>  DPS: 2,590  |  Alcance: 30m→90m\n<EM4>Modificadores:</EM4>  Ventana Óptima de Carga: -40%  |  Resistencia: -30%  |  Filtro Inerte: +40%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
