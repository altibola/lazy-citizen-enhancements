Item_DescBEHR_LaserCannon_S4=Fabricante: Behring\nTipo de Artículo: Cañón láser\nTamaño: 4\n\nEl M6A de Behring es un autocañón versátil de energía de alta velocidad, diseñado para mantenerte alejado de tu enemigo sin sacrificar tu potencia de detención.\n\n--- ATRIBUTOS ---\nPeso: 2250.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 615.3 (Energy)  |  DPS: 1,025.5\nMunición: 25\nRegeneración: 6,330/s  |  Tiempo de Recarga: 1.4s  |  Coste/Disparo: 379\nVelocidad: 1,152 m/s  |  Alcance: 2.8 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 2,000\nSignatures:  EM: 792  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAEGS_EMP_Device=Fabricante: Behring\nTipo de artículo: Generador EMP\n\nEl REP-8 es un generador de rafagas centrado en EMP de gran prestigio de Behring. Equilibra un tiempo de carga manejable con una fuerte rafaga de daño por distorsion que destruye los componentes electronicos atrapados dentro de su radio. Una ingenieria solida y siglos de uso lo han convertido en un elemento de disuasion no letal estandar en todo el Imperio.\n\n--- ATRIBUTOS ---\nPeso: 4000.0 kg\nConsumo de Energía: 1 PU/s\nHP del Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAEGS_EMP_Sentinel_S4=Fabricante: Behring\nTipo de artículo: Generador de rafagas\nTamaño: 4\nTipo de daño: EMP\n\nProporcione daño por distorsion con el generador de rafagas REP-VS construido especificamente para el Aegis Vanguard Sentinel. Behring modifico la tecnologia utilizada en su prestigioso REP-8 para diseñar un arma no letal eficaz que se integra perfectamente con el Sentinel.\n\n--- ATRIBUTOS ---\nPeso: 4000.0 kg\nConsumo de Energía: 1 PU/s\nHP del Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAMRS_LaserCannon_S1=Fabricante: Amon & Reese Co.\nTipo de artículo: Cañon laser\nTamaño: 1\n\nEl Omnisky III es el modelo base de la linea de cañones automáticos laser de A&R para naves pequeños y tiene una velocidad de disparo, daño y alcance comparables a otras armas de su clase de tamaño. Utiliza componentes de calidad media en su diseño, lo que ofrece un marcado aumento en la eficiencia energetica con respecto a algunos de sus competidores menos costosos.\n\n--- ATRIBUTOS ---\nPeso: 144.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 97.2 (Energy)  |  DPS: 243.0\nMunición: 25\nRegeneración: 1,500/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 90\nVelocidad: 1,200 m/s  |  Alcance: 2.0 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 446  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAMRS_LaserCannon_S2=Fabricante: Amon & Reese Co.\nTipo de artículo: Cañon laser\nTamaño: 2\n\nEl Omnisky VI es el cañon automático laser de tamaño mediano del fabricante A&R. Cuenta con mayor daño, alcance y consumo de energía que su hermano menor, el Omnisky III, y utiliza muchos de los mismos componentes, lo que resulta en una eficiencia energetica intermedia.\n\n--- ATRIBUTOS ---\nPeso: 360.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 145.8 (Energy)  |  DPS: 364.5\nMunición: 25\nRegeneración: 2,250/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 135\nVelocidad: 1,196 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 594  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAMRS_LaserCannon_S3=Fabricante: Amon & Reese Co.\nTipo de artículo: Cañon laser\nTamaño: 3\n\nEl Omnisky IX es la version de tamaño tres del popular cañon automático laser de Amon & Reese. La baja cadencia de disparo del arma se ve compensada por su alcance efectivo, que le permite realizar un disparo potente desde lejos.\n\n--- ATRIBUTOS ---\nPeso: 900.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 218.7 (Energy)  |  DPS: 546.8\nMunición: 25\nRegeneración: 3,375/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 202\nVelocidad: 1,184 m/s  |  Alcance: 2.4 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 743  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAMRS_LaserCannon_S4=Fabricante: Amon & Reese Co.\nTipo de artículo: Cañon laser\nTamaño: 4\n\nLa fiable linea de cañones automáticos laser de Amon & Reese continua con el Omnisky XII. Aunque dispara lentamente, este laser de tamaño cuatro es capaz de lanzar de manera eficiente rafagas de rayos laser devastadores desde un rango considerable.\n\n--- ATRIBUTOS ---\nPeso: 280.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 327.9 (Energy)  |  DPS: 819.7\nMunición: 25\nRegeneración: 5,060/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 303\nVelocidad: 1,152 m/s  |  Alcance: 2.8 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAMRS_LaserCannon_S5=Fabricante: Amon & Reese Co.\nTipo de artículo: Cañon laser\nTamaño: 5\n\nLa reputación de Amon & Reese de fabricar armas poderosas y fiables se materializa en su linea Omnisky de cañones automáticos laser. El Omnisky XV es la version tamaño cinco del arma que ha ayudado a defender el Imperio durante siglos.\n\n--- ATRIBUTOS ---\nPeso: 5630.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 492.2 (Energy)  |  DPS: 1,230.4\nMunición: 25\nRegeneración: 7,595/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 455\nVelocidad: 1,112 m/s  |  Alcance: 4.0 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 2,500\nSignatures:  EM: 1,040  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAMRS_LaserCannon_S6=Fabricante: Amon & Reese Co.\nTipo de artículo: Cañon laser\nTamaño: 6\n\nApodado 'Augustus' por los ingenieros de Amon & Reese en honor al emperador romano que fundo la notable 'Decimoctava Legion', este enorme cañon automático laser de tamaño seis golpea con fuerza a grandes distancias, lo que convierte al Omnisky XVIII una forma eficaz de mantener a raya a los enemigos.\n\n--- ATRIBUTOS ---\nPeso: 14100.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 738.4 (Energy)  |  DPS: 1,846.0\nMunición: 25\nRegeneración: 11,395/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 683\nVelocidad: 1,080 m/s  |  Alcance: 6.0 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 4,224\nSignatures:  EM: 1,190  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAMRS_ScatterGun_S3=Fabricante: Amon & Reese Co.\nTipo de artículo: Pistola de dispersión de plasma\nTamaño: 3\n\nTu nave sembrara el caos con la escopeta de plasma PyroBurst de A&R. Eficaz en espacios reducidos, el PyroBurst rocia proyectiles de plasma autodetonantes, sacrificando la precision milimetrica por la saturacion del area.\n\n--- ATRIBUTOS ---\nPeso: 450.0 kg\nCadencia: 70 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 396.0 x8 (Energy)  |  DPS: 462.0\nMunición: 75\nRegeneración: 2,567/s  |  Tiempo de Recarga: 0.4s  |  Coste/Disparo: 440\nVelocidad: 844 m/s  |  Alcance: 1.3 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,550\nSignatures:  EM: 450  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAPAR_BallisticGatling_S4=Fabricante: Apocalypse Arms\nTipo de artículo: Ballistic Gatling\nTamaño: 4\n\nSi no esta roto, no lo arregles. Y si quieres que se rompa, apuntalo con un Revenant. Apocalypse Arms, construido solidamente sobre una base de tecnologia centenaria, le da un giro innovador a diseños probados en batalla para crear un Gatling balistico resistente que puede lanzar la muerte de manera constante a traves del vacio. Aunque tarda en girar y enfriarse, la confiabilidad del Revenant lo convierte en el favorito de quienes esperan encontrar problemas.\n\n--- ATRIBUTOS ---\nPeso: 2340.0 kg\nCadencia: 900 RPM\nModos de Disparo: Auto\nDaño Alfa: 189.9 (Phys)  |  DPS: 2,848.5\nMunición: 3,801\nVelocidad: 1,215 m/s  |  Alcance: 6.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 16,500\nSignatures:  EM: 36  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAPAR_BallisticGatling_S6=Fabricante: Apocalypse Arms\nTipo de artículo: Gatling balistico\nTamaño: 6\n\nCon reminiscencias de una era pasada de combate espacial, este brutal Gatling balistico de tamaño seis de Apocalypse Arms es un arma muy deliberada. Tomate un momento mientras el tambor del Draugar acelera para saborear la ruina y la destruccion que estas a punto de desatar.\n\n--- ATRIBUTOS ---\nPeso: 1950.0 kg\nCadencia: 1,200 RPM\nModos de Disparo: Auto\nDaño Alfa: 142.4 (Phys)  |  DPS: 2,848.0\nMunición: 3,309\nVelocidad: 1,215 m/s  |  Alcance: 6.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 4,224\nSignatures:  EM: 33  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAPAR_BallisticScatterGun_S1=Fabricante: Apocalypse Arms\nTipo de artículo: Pistola de dispersión balistica\nTamaño: 1\n\nSiembra terror en el campo de batalla con el Havoc de Apocalypse Arms. Esta pistola de dispersión de tamaño uno causa un daño enorme a corta distancia, lo que la convierte en el arma perfecta para terminar una pelea.\n\n--- ATRIBUTOS ---\nPeso: 60.0 kg\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 374.4 x8 (Phys)  |  DPS: 374.4\nMunición: 2,040\nVelocidad: 900 m/s  |  Alcance: 1.3 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,550\nSignatures:  EM: 41  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAPAR_BallisticScatterGun_S2=Fabricante: Apocalypse Arms\nTipo de artículo: Pistola de dispersión balistica\nTamaño: 2\n\nApocalypse Arms' Hellion es una pistola de dispersión de tamaño dos que satura los objetivos con munición balistica en espacios reducidos. La funcionalidad de munición inteligente del arma le permite cambiar entre rondas estandar y especiales.\n\n--- ATRIBUTOS ---\nPeso: 150.0 kg\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 560.0 x8 (Phys)  |  DPS: 560.0\nMunición: 2,019\nVelocidad: 897 m/s  |  Alcance: 1.4 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,550\nSignatures:  EM: 41  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAPAR_BallisticScatterGun_S3=Fabricante: Apocalypse Arms\nTipo de artículo: Pistola de dispersión balistica\nTamaño: 3\n\nLa pistola de dispersión Predator ataca a los oponentes cercanos con una abrumadora rafaga de munición balistica. La version de tamaño tres de la temida pistola de dispersión de Apocalypse Arms intercambia un alcance efectivo por una amplia dispersión.\n\n--- ATRIBUTOS ---\nPeso: 375.0 kg\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 840.0 x8 (Phys)  |  DPS: 840.0\nMunición: 1,980\nVelocidad: 888 m/s  |  Alcance: 1.5 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,550\nSignatures:  EM: 41  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescAPAR_MassDriver_S2=Fabricante: Apocalypse Arms\nTipo de artículo: Mass Driver Cannon\nTamaño: 2\n\nSiempre vale la pena estar preparado, y si alguna vez llega la desgracia, te alegraras de tener a mano un Apocalypse Arms Strife Mass Driver. Sus aceleradores electromagneticos pueden consumir un poco de energía, pero lo compensan con la rapidez con la que pueden disparar sus proyectiles de alta velocidad. Verlo atravesar a tu objetivo es suficiente para hacer que cualquier mal día sea un poco mejor. Solo tenga cuidado de no dejar que se sobrecaliente.\n\n--- ATRIBUTOS ---\nPeso: 600.0 kg\nCadencia: 30 RPM\nModos de Disparo: Charge / Semi-Auto\nDaño Alfa: 525.0 (Phys)  |  DPS: 262.5\nMunición: 84\nVelocidad: 1,151 m/s  |  Alcance: 3.2 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 792  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescARGO_TractorBeam_S1_Cargo=item_NameARGO_TractorBeam_S1_Cargo\n\n--- ATRIBUTOS ---\nPeso: 70.0 kg\nModos de Disparo: Rayo Tractor\nMunición: 0\nVelocidad: 0 m/s  |  Alcance: 0 m\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescASAD_DistortionRepeater_S1=Fabricante: Associated Science & Development\nTipo de artículo: Repetidor de distorsion\nTamaño: 1\n\nLa potencia es la sangre vital de cada nave, y el DR Model-XJ1 de ASD es la opción ideal para desangrar a los hostiles. Este repetidor de distorsion de última generacion le permite interrumpir la energía de los objetivos y desactivar las amenazas de manera eficiente.\n\n--- ATRIBUTOS ---\nPeso: 24.0 kg\nCadencia: 400 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 25.7 (Distort)  |  DPS: 171.3\nMunición: 75\nRegeneración: 750/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 26\nVelocidad: 1,350 m/s  |  Alcance: 1.2 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 525\nSignatures:  EM: 167  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescASAD_DistortionRepeater_S2=Fabricante: Associated Science & Development\nTipo de artículo: Repetidor de distorsion\nTamaño: 2\n\nAvanzando en el campo de las armas de distorsion, el repetidor DR Modelo-XJ2 de ASD proporciona una interrupcion de energía tactica que limitara gravemente la capacidad operativa de cualquier nave objetivo.\n\n--- ATRIBUTOS ---\nPeso: 60.0 kg\nCadencia: 400 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 38.5 (Distort)  |  DPS: 256.7\nMunición: 75\nRegeneración: 1,123/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 38\nVelocidad: 1,346 m/s  |  Alcance: 1.3 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 223  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescASAD_DistortionRepeater_S3=Fabricante: Associated Science & Development\nTipo de artículo: Repetidor de distorsion\nTamaño: 3\n\nApague acciones hostiles y apunte a fuentes de alimentacion con el DR Model-XJ3, un repetidor de distorsion de buen alcance desarrollado por los laboratorios de investigación de armas avanzadas de ASD.\n\n--- ATRIBUTOS ---\nPeso: 150.0 kg\nCadencia: 400 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 57.9 (Energy: 0.0 / Distort: 57.9)  |  DPS: 386.0\nMunición: 75\nRegeneración: 1,689/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 58\nVelocidad: 1,332 m/s  |  Alcance: 1.4 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 278  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBANU_TachyonCannon_S1=Fabricante: Banu\nTipo de artículo: Cañon de taquíones\nTamaño: 1\n\nFabricado popularmente por un Banu souli, el cañon de taquíones Singe produce constantemente daños de energía devastadores a traves de grandes distancias. Aunque es lento para disparar, el proyectil de taquíones ultrarrápido golpea objetivos casi instantaneamente, lo que convierte al Singe en la opción favorita de las naves de seguridad Banu. Aunque los Banu han olvidado durante mucho tiempo el origen de esta arma de alta tecnologia, varias elecciones de diseño unicas han llevado a los estudiosos a sospechar que los Banu podrian haberse apropiado de la tecnologia en su cultura, en lugar de inventarla ellos mismos.\n\n--- ATRIBUTOS ---\nPeso: 192.0 kg\nCadencia: 90 RPM\nModos de Disparo: Charge / Semi-Auto\nDaño Alfa: 202.5 (Energy)  |  DPS: 303.8\nMunición: 25\nRegeneración: 1,500/s  |  Tiempo de Recarga: 1.6s  |  Coste/Disparo: 300\nVelocidad: 1,050 m/s  |  Alcance: 3.0 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 594  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBANU_TachyonCannon_S2=Fabricante: Banu\nTipo de artículo: Cañon de taquíones\nTamaño: 2\n\nFabricado popularmente por un Banu souli, el cañon de taquíones Singe produce constantemente daños de energía devastadores a traves de grandes distancias. Aunque es lento para disparar, el proyectil de taquíones ultrarrápido golpea objetivos casi instantaneamente, lo que convierte al Singe en la opción favorita de las naves de seguridad Banu. Aunque los Banu han olvidado durante mucho tiempo el origen de esta arma de alta tecnologia, varias elecciones de diseño unicas han llevado a los estudiosos a sospechar que los Banu podrian haberse apropiado de la tecnologia en su cultura, en lugar de inventarla ellos mismos.\n\n--- ATRIBUTOS ---\nPeso: 480.0 kg\nCadencia: 90 RPM\nModos de Disparo: Charge / Semi-Auto\nDaño Alfa: 472.5 (Energy)  |  DPS: 708.8\nMunición: 25\nRegeneración: 2,250/s  |  Tiempo de Recarga: 1.7s  |  Coste/Disparo: 400\nVelocidad: 1,046 m/s  |  Alcance: 3.2 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 850\nSignatures:  EM: 792  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
