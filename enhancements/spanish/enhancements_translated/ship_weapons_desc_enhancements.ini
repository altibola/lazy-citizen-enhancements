item_DescHRST_S1_RPOD_6x_S1=Tipo de artículo: Rocket Pod\nFabricante: Hurston Dynamics\nTamaño: 1\nCohetes: 6xS1\n\nLa capsula de cohetes Jericho de Hurston Dynamics es compatible con un punto fijo de cualquier tamaño y es capaz de transportar seis cohetes S1.\n\n--- ATRIBUTOS ---\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 150.0 (Phys)  |  DPS: 150.0\nMunición: 12\nVelocidad: 700 m/s  |  Alcance: 2.1 km\nHP del Componente: 500
item_DescHRST_S2_RPOD_12x_S1=Tipo de artículo: Rocket Pod\nFabricante: Hurston Dynamics\nTamaño: 2\nCohetes: 12xS1\n\nLa capsula de cohetes Jericho X de Hurston Dynamics es compatible con dos puntos de anclaje de cualquier tamaño y es capaz de transportar doce cohetes S1.\n\n--- ATRIBUTOS ---\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 150.0 (Phys)  |  DPS: 150.0\nMunición: 24\nVelocidad: 700 m/s  |  Alcance: 2.1 km\nHP del Componente: 750
item_DescHRST_S3_RPOD_18x_S1=Tipo de artículo: Rocket Pod\nFabricante: Hurston Dynamics\nTamaño: 3\nCohetes: 18xS1\n\nLa capsula de cohetes Jericho XL de Hurston Dynamics es compatible con tres puntos de anclaje de cualquier tamaño y es capaz de transportar dieciocho cohetes S1.\n\n--- ATRIBUTOS ---\nPeso: 280.0 kg\nCadencia: 60 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 150.0 (Phys)  |  DPS: 150.0\nMunición: 36\nVelocidad: 700 m/s  |  Alcance: 2.1 km\nHP del Componente: 1,000\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_Storm_LaserRepeater_S3=Fabricante: Hurston Dynamics\nTipo de Artículo: Repetidor Láser\nTamaño: 3\n\nHurston Dynamics se ha asociado con Tumbril Land Systems para diseñar el potente repetidor láser Reign-3 específicamente para la torreta del vehículo de asalto Storm. Utilizando la tecnología exclusiva de cascada de Hurston Dynamics, el Reign-3 ofrece un rendimiento mejorado y una mayor salida de energía a medida que la frenética velocidad del combate comienza a intensificarse.\n\n--- ATRIBUTOS ---\nPeso: 150.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 350.0 (Energy)  |  DPS: 2,041.7\nMunición: 75\nRegeneración: 4,853/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 84\nVelocidad: 1,480 m/s  |  Alcance: 1.9 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 320  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescJOKR_DistortionCannon_S1=Fabricante: Joker Engineering\nTipo de artículo: Cañon de distorsion\nTamaño: 1\n\nLos genios de Joker lo han vuelto a hacer. El cañon automático Suckerpunch Distortion es un arma de largo alcance que drena el suministro de energía del objetivo en lugar de dañar el cuerpo fisico de la nave, lo que lo hace ideal para hacer cumplir la ley u otras aplicaciones.\n\n--- ATRIBUTOS ---\nPeso: 96.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 81.0 (Distort)  |  DPS: 135.0\nMunición: 25\nRegeneración: 750/s  |  Tiempo de Recarga: 1.6s  |  Coste/Disparo: 90\nVelocidad: 1,080 m/s  |  Alcance: 1.5 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 408  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescJOKR_DistortionCannon_S2=Fabricante: Joker Engineering\nTipo de artículo: Cañon de distorsion\nTamaño: 2\n\nGolpea silenciosamente desde lejos con el Suckerpunch. El cañon de distorsion de largo alcance y tamaño dos del Joker drena el sistema de energía del objetivo, dejandolo indefenso para defenderse de lo que has planeado a continuacion. Una opción ideal para las fuerzas del orden, cazarrecompensas y otras operaciones no letales.\n\n--- ATRIBUTOS ---\nPeso: 240.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 121.5 (Energy: 0.0 / Distort: 121.5)  |  DPS: 202.5\nMunición: 25\nRegeneración: 1,125/s  |  Tiempo de Recarga: 1.7s  |  Coste/Disparo: 135\nVelocidad: 1,076 m/s  |  Alcance: 1.6 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 545  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescJOKR_DistortionCannon_S3=Fabricante: Joker Engineering\nTipo de artículo: Cañon de distorsion\nTamaño: 3\n\nCuando quieras atrapar a tu presa sin causar daño, utiliza el Suckerpunch. Este cañon de distorsion de tamaño tres de Joker agota el sistema de energía del objetivo, lo que lo convierte en una excelente y efectiva adicion no letal a tu arsenal.\n\n--- ATRIBUTOS ---\nPeso: 600.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 182.5 (Distort)  |  DPS: 304.2\nMunición: 25\nRegeneración: 1,690/s  |  Tiempo de Recarga: 1.8s  |  Coste/Disparo: 203\nVelocidad: 1,066 m/s  |  Alcance: 1.8 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 681  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKBAR_BallisticCannon_S1=Fabricante: KnightBridge Arms\nTipo de artículo: Cañon balistico\nTamaño: 1\n\nEl cañon automático de nivel básico de la linea KnightBridge Arms Sword, el Longsword Serie 9 dispara una bala balistica diseñada para usarse contra una variedad de enemigos blindados mientras permite a los pilotos mantener una distancia saludable de los objetivos.\n\n--- ATRIBUTOS ---\nPeso: 76.8 kg\nCadencia: 250 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 48.6 (Phys)  |  DPS: 202.5\nMunición: 495\nVelocidad: 1,200 m/s  |  Alcance: 2.5 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 850\nSignatures:  EM: 38  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKBAR_BallisticCannon_S2=Fabricante: KnightBridge Arms\nTipo de artículo: Cañon balistico\nTamaño: 2\n\nKnightBridge Arms sabe que cuando se trata de batalla, tener el arma adecuada puede marcar la diferencia. Con sus potentes proyectiles balisticos, el versatil Greatsword serie 10 de tamaño dos te acompañara hasta el final del conflicto gracias a su largo alcance y su alto potencial de daño.\n\n--- ATRIBUTOS ---\nPeso: 192.0 kg\nCadencia: 250 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 73.0 (Phys)  |  DPS: 304.1\nMunición: 492\nVelocidad: 1,196 m/s  |  Alcance: 2.7 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 850\nSignatures:  EM: 38  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKBAR_BallisticCannon_S3=Fabricante: KnightBridge Arms\nTipo de artículo: Cañon balistico\nTamaño: 3\n\nLa espada ancha serie 11 de KnightBridge Arms es el tamaño al que acuden tres pilotos de cañones automáticos balisticos cuando quieren las 3 D: distancia, confiabilidad y daño.\n\n--- ATRIBUTOS ---\nPeso: 480.0 kg\nCadencia: 250 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 109.3 (Phys)  |  DPS: 455.2\nMunición: 489\nVelocidad: 1,184 m/s  |  Alcance: 3.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 2,850\nSignatures:  EM: 38  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_LaserRepeater_S1=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor laser\nTamaño: 1\n\nCon un diseño de disparo secuencial de tres cañones, el repetidor laser Bulldog Klaus & Werner CF-117 es capaz de lanzar rondas de energía de alta velocidad manteniendo la eficiencia termica, lo que lo convierte en uno de los favoritos entre los nuevos pilotos que equipar su primer nave.\n\n--- ATRIBUTOS ---\nPeso: 24.0 kg\nCadencia: 750 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 11.3 (Energy)  |  DPS: 141.2\nMunición: 70\nRegeneración: 1,355/s  |  Tiempo de Recarga: 0.7s  |  Coste/Disparo: 22\nVelocidad: 1,500 m/s  |  Alcance: 1.6 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 525\nSignatures:  EM: 152  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_LaserRepeater_S2=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor laser\nTamaño: 2\n\nEl CF-227 Badger es el fiable laser de repetición de tamaño dos de Klaus & Werner. Su mayor potencia y su alta cadencia de fuego lo convierten en un contendiente solido en cualquier pelea.\n\n--- ATRIBUTOS ---\nPeso: 60.0 kg\nCadencia: 750 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 26.2 (Energy)  |  DPS: 328.1\nMunición: 75\nRegeneración: 2,025/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 32\nVelocidad: 1,495 m/s  |  Alcance: 1.7 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 203  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_LaserRepeater_S3=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor laser\nTamaño: 3\n\nEl CF-337 Panther es el modelo de tamaño tres en la linea de repetidores laser de Klaus & Werner. El Panther es una verdadera arma de disparar y olvidar con una relacion respetable entre consumo de energía y daño. Los pilotos que equipan sus naves con Panthers rara vez se arrepienten de su decision.\n\n--- ATRIBUTOS ---\nPeso: 200.0 kg\nCadencia: 750 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 43.6 (Energy)  |  DPS: 545.6\nMunición: 75\nRegeneración: 3,031/s  |  Tiempo de Recarga: 0.7s  |  Coste/Disparo: 48\nVelocidad: 1,480 m/s  |  Alcance: 1.9 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,500\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_LaserRepeater_S4=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor laser\nTamaño: 4\n\nCuando una nave viene cargando hacia usted con un CF-447 Rhino atado, es una experiencia que pocos pilotos olvidaran jamas. Este formidable repetidor laser de tamaño cuatro de Klaus & Werner es muy adecuado para enfrentamientos de alcance medio, pero tiene un gran impacto de cerca.\n\n--- ATRIBUTOS ---\nPeso: 375.0 kg\nCadencia: 750 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 65.4 (Energy)  |  DPS: 817.9\nMunición: 75\nRegeneración: 4,544/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 73\nVelocidad: 1,440 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 304  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_LaserRepeater_S5=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor laser\nTamaño: 5\n\nCon una mordida tan temible como su homonimo con colmillos, el repetidor laser Klaus & Werner CF-557 Galdereen es una opción solida para una amplia gama de vehículos gracias a su alta velocidad de disparo y eficacia constante. .\n\n--- ATRIBUTOS ---\nPeso: 938.0 kg\nCadencia: 750 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 98.2 (Energy)  |  DPS: 1,227.4\nMunición: 75\nRegeneración: 6,819/s  |  Tiempo de Recarga: 0.9s  |  Coste/Disparo: 109\nVelocidad: 1,390 m/s  |  Alcance: 3.2 km\nConsumo de Energía: 1 PU/s\nSignatures:  EM: 354  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_LaserRepeater_S6=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor laser\nTamaño: 6\n\nEsta bestia de repetidor laser de Klaus & Werner cuenta con tres enormes barriles que advierten a cualquiera que detecte una nave con el CF-667 que debe pensar de nuevo antes de atacar.\n\n--- ATRIBUTOS ---\nPeso: 2340.0 kg\nCadencia: 750 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 147.3 (Energy)  |  DPS: 1,841.6\nMunición: 75\nRegeneración: 10,231/s  |  Tiempo de Recarga: 0.9s  |  Coste/Disparo: 164\nVelocidad: 1,350 m/s  |  Alcance: 4.8 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 4,224\nSignatures:  EM: 405  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_MassDriver_S1=Fabricante: Klaus & Werner\nTipo de artículo: Mass Driver Cannon\nTamaño: 1\n\nDerriba objetivos distantes con el Sledge I Mass Driver Cannon. Klaus & Werner utilizo tecnologia de cañon de riel para disparar con precision proyectiles balisticos de alto daño a largas distancias. Sin embargo, asegurate de hacer que cada disparo cuente, ya que el arma sacrifica la velocidad de disparo por un daño crudo y devastador.\n\n--- ATRIBUTOS ---\nPeso: 192.0 kg\nCadencia: 30 RPM\nModos de Disparo: Charge / Semi-Auto\nDaño Alfa: 225.0 (Phys)  |  DPS: 112.5\nMunición: 105\nVelocidad: 1,155 m/s  |  Alcance: 3.0 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,050\nSignatures:  EM: 540  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_MassDriver_S10=Descripcion del cañon de riel Idris\n\n--- ATRIBUTOS ---\nPeso: 700.0 kg\nCadencia: 6 RPM\nModos de Disparo: Charge / Semi-Auto\nDaño Alfa: 144,160.0 (Phys)  |  DPS: 14,416.0\nMunición: 1,500\nVelocidad: 939 m/s  |  Alcance: 12.0 km\nConsumo de Energía: 5 PU/s\nHP del Componente: 727,680\nSignatures:  EM: 0  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_MassDriver_S2=Fabricante: Klaus & Werner\nTipo de artículo: Mass Driver Cannon\nTamaño: 2\n\nEl Klaus & Werner Sledge II Mass Driver Cannon es un arma balistica contundente capaz de disparar multiples tipos de municiónes. Sin embargo, la mayor capacidad de penetracion de escudos de esta arma tiene un costo. El espacio del cargador es limitado, por lo que la munición debe reponerse periodicamente. Debido a que no utiliza proyectiles basados en energía, el controlador de masa K&W tiene un costo de energía reducido y, por lo tanto, da como resultado una firma EM reducida.\n\n--- ATRIBUTOS ---\nPeso: 480.0 kg\nCadencia: 30 RPM\nModos de Disparo: Charge / Semi-Auto\nDaño Alfa: 525.0 (Phys)  |  DPS: 262.5\nMunición: 105\nVelocidad: 1,151 m/s  |  Alcance: 3.2 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 2,050\nSignatures:  EM: 720  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKLWE_MassDriver_S3=Fabricante: Klaus & Werner\nTipo de artículo: Mass Driver Cannon\nTamaño: 3\n\nEl Sledge III es la variante de tamaño tres de la popular serie de cañones Mass Driver de Klaus & Werner. Aunque es lento para disparar, el arma combina con exito la filosofia de la compañia de diseño simple con tecnologia de punta de cañon de riel para disparar proyectiles balisticos con precision quirurgica a distancia.\n\n--- ATRIBUTOS ---\nPeso: 1200.0 kg\nCadencia: 30 RPM\nModos de Disparo: Charge / Semi-Auto\nDaño Alfa: 1,125.0 (Phys)  |  DPS: 562.5\nMunición: 102\nVelocidad: 1,140 m/s  |  Alcance: 3.6 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 3,050\nSignatures:  EM: 900  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKRIG_BallisticGatling_S2=Fabricante: Kruger Intergalactic\nTipo de artículo: Gatling balistico\nTamaño: 2\n\nUna variante personalizada de la linea de cañones giratorios Tigerstrike de Kruger Intergalactic, esta poderosa arma fue diseñada en conjunto con el equipo que trabaja en el P-52 Merlin para garantizar que encaje perfectamente con las elegantes lineas de luz. casco del caza y al mismo tiempo realiza rapidamente disparo tras disparo con la confiabilidad que uno espera de un arma Kruger.\n\n--- ATRIBUTOS ---\nPeso: 26.7 kg\nCadencia: 1,200 RPM\nModos de Disparo: Auto\nDaño Alfa: 22.5 (Phys)  |  DPS: 450.0\nMunición: 4,626\nVelocidad: 1,346 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 850\nSignatures:  EM: 27  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKRIG_LaserCannon_S3=Fabricante: Kruger Intergalactic\nTipo de artículo: Cañon laser\nTamaño: 3\n\nFabricado con piezas fabricadas con precision, forjadas con tolerancias extremadamente estrictas, diseñado para una gestión del calor de primer nivel y ensamblado para superar todos los estandares de la industria, el cañon automático laser Quarreler fue creado por Kruger Intergalactic para una verdadera confiabilidad defensiva .\n\n--- ATRIBUTOS ---\nPeso: 400.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 218.7 (Energy)  |  DPS: 546.8\nMunición: 25\nRegeneración: 3,375/s  |  Tiempo de Recarga: 1.8s  |  Coste/Disparo: 202\nVelocidad: 1,184 m/s  |  Alcance: 2.4 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 2,850\nSignatures:  EM: 649  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
