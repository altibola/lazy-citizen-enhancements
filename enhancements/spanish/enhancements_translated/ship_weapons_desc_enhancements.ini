item_DescBEHR_BallisticCannon_VNG_S2=Fabricante: Behring\nTipo de artículo: Cañon balistico\nTamaño: 2\n\nBehring diseño el CVSA para que fuera su unica variante de cañon balistico Vanguard. Esta arma presenta una velocidad de disparo mas lenta y ofrece una ronda de mayor velocidad que es ideal para causar daños importantes a objetivos a distancias medías y largas.\n\n--- ATRIBUTOS ---\nPeso: 360.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 162.0 (Phys)  |  DPS: 405.0\nMunición: 327\nVelocidad: 1,196 m/s  |  Alcance: 2.7 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 550\nSignatures:  EM: 50  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
