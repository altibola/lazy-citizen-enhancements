item_DescESPR_LaserCannon_S1=Fabricante: Esperia\nTipo de artículo: Cañon laser \nTamaño: 1\n\nEl Lightstrike I lleva el ataque a objetivos distantes lanzando rafagas enfocadas y de alto daño que harán que cualquier agresor lo piense dos veces antes de acercarse demasiado. Capaz de proporcionar poderosas opciones de vigilancia durante el despliegue de tropas o atacar objetivos en el espacio exterior, es facil ver por que las fuerzas de la UPE temian al Lightstrike I durante la Primera Guerra Tevarin.\n\n--- ATRIBUTOS ---\nPeso: 96.0 kg\nCadencia: 250 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 49.2 (Energy)  |  DPS: 205.2\nMunición: 25\nRegeneración: 1,267/s  |  Tiempo de Recarga: 1.2s  |  Coste/Disparo: 52\nVelocidad: 1,200 m/s  |  Alcance: 2.0 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 371  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
