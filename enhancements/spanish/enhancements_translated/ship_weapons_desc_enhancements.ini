item_DescBEHR_BallisticGatling_S4=Fabricante: Behring\nTipo de artículo: Gatling balistico\nTamaño: 4\n\nEl AD4B, la version de Behring del clasico Gatling balistico, incluye un mecanismo de disparo de ciclo de cristal en el sistema giratorio de alta velocidad para maximizar la eficiencia en enfrentamientos sostenidos con minimos fallos de disparo. La proxima vez que un agresor intensifique una situacion hostil, haga que se arrepienta de su decision utilizando esta arma abrumadora y eficaz.\n\n--- ATRIBUTOS ---\nPeso: 375.0 kg\nCadencia: 900 RPM\nModos de Disparo: Auto\nDaño Alfa: 84.4 (Phys)  |  DPS: 1,266.0\nMunición: 5,220\nVelocidad: 1,296 m/s  |  Alcance: 2.8 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 36  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_BallisticGatling_S5=Fabricante: Behring\nTipo de artículo: Gatling balistico\nTamaño: 5\n\nEl AD5B, la version de Behring del clasico Gatling balistico, incluye un mecanismo de disparo de ciclo de cristal en el sistema giratorio de alta velocidad para maximizar la eficiencia en enfrentamientos sostenidos con minimos fallos de disparo. La proxima vez que un agresor intensifique una situacion hostil, haga que se arrepienta de su decision utilizando esta arma abrumadora y eficaz.\n\n--- ATRIBUTOS ---\nPeso: 938.0 kg\nCadencia: 900 RPM\nModos de Disparo: Auto\nDaño Alfa: 126.5 (Phys)  |  DPS: 1,897.5\nMunición: 5,004\nVelocidad: 1,251 m/s  |  Alcance: 4.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 36  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_BallisticGatling_S6=Fabricante: Behring\nTipo de artículo: Gatling balistico\nTamaño: 6\n\nEl AD6B, la version de Behring del clasico Gatling balistico, incluye un mecanismo de disparo de ciclo de cristal en el sistema giratorio de alta velocidad para maximizar la eficiencia en enfrentamientos sostenidos con minimos fallos de encendido. La proxima vez que un agresor intensifique una situacion hostil, haga que se arrepienta de su decision utilizando esta arma abrumadora y eficaz.\n\n--- ATRIBUTOS ---\nPeso: 2340.0 kg\nCadencia: 900 RPM\nModos de Disparo: Auto\nDaño Alfa: 189.9 (Phys)  |  DPS: 2,848.5\nMunición: 4,734\nVelocidad: 1,215 m/s  |  Alcance: 6.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 36  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_BallisticGatling_SF7B_S7=Fabricante: Behring\nTipo de artículo: Gatling balistico\nTamaño: 7\n\nLucha con naves espaciales grandes y destruye rapidamente naves mas pequeñas con el Gatling balistico SF7B. Construida especificamente para el Ares Inferno Star Fighter, el arma se integra perfectamente en el cuerpo de la nave. La impresionante velocidad de disparo del arma libera balas de alta densidad que atraviesan armaduras y escudos, lo que la convierte en una opción perfecta para situaciones en las que la saturacion del objetivo es clave.\n\n--- ATRIBUTOS ---\nPeso: 5860.0 kg\nCadencia: 900 RPM\nModos de Disparo: Auto\nDaño Alfa: 292.0 (Phys)  |  DPS: 4,380.0\nMunición: 2,994\nVelocidad: 1,179 m/s  |  Alcance: 7.3 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 6,750\nSignatures:  EM: 36  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_BallisticRepeater_S1=Fabricante: Behring\nTipo de artículo: Repetidor balistico\nTamaño: 1\n\n Al disparar con dos cañones, el "Buzzsaw" SW16BR1 puede abrumar a los agresores a media y corta distancia. La experta artesania de Behring permite que el arma participe en tiroteos sostenidos antes de necesitar un tiempo de reutilizacion, lo que la convierte en un excelente repetidor balistico de nivel básico.\n\n--- ATRIBUTOS ---\nPeso: 36.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 36.0 (Phys)  |  DPS: 300.0\nMunición: 2,664\nVelocidad: 1,500 m/s  |  Alcance: 2.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 525\nSignatures:  EM: 40  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_BallisticRepeater_S2=Fabricante: Behring\nTipo de artículo: Repetidor balistico\nTamaño: 2\n\nEl SW16BR2 Sawbuck es la contribucion de Behring al mercado en  expansión de repetidores balisticos. Su configuracion de doble cañon de disparo secuencial ofrece un termino medio eficaz para los operadores que buscan una velocidad de disparo mayor que la de un cañon, pero sin el miedo al sobrecalentamiento que se produciria con una Gatling.\n\n--- ATRIBUTOS ---\nPeso: 90.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 54.0 (Phys)  |  DPS: 450.0\nMunición: 2,637\nVelocidad: 1,495 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 850\nSignatures:  EM: 40  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_BallisticRepeater_S3=Fabricante: Behring\nTipo de artículo: Repetidor balistico\nTamaño: 3\n\nSalga de los problemas con este repetidor balistico Behring tamaño tres. La "Shredder" SW16BR3 distribuye el calor entre ambos cañones para que siga disparando cuando mas se necesita. La agrupacion de disparos y la reduccion del daño del arma la hacen mas letal a media o corta distancia.\n\n--- ATRIBUTOS ---\nPeso: 225.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 81.0 (Phys)  |  DPS: 675.0\nMunición: 2,589\nVelocidad: 1,480 m/s  |  Alcance: 2.4 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 40  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_BallisticRepeater_VNG_S2=Fabricante: Behring\nTipo de artículo: Repetidor balistico\nTamaño: 2\n\nSolo los propietarios de Vanguard pueden equipar esta version unica de la linea de repetidores balisticos de Behring en el morro de su nave. El BRVS esta cuidadosamente calibrado para que su bombardeo balistico dispare lo suficientemente rápido como para proporcionar la maxima saturacion del objetivo, mientras que su ventilacion mejorada reduce el sobrecalentamiento frecuente.\n\n--- ATRIBUTOS ---\nPeso: 90.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 54.0 (Phys)  |  DPS: 450.0\nMunición: 2,637\nVelocidad: 1,495 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 850\nSignatures:  EM: 40  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_DistortionCannon_VNG_S2=Fabricante: Behring\nTipo de artículo: Cañon de distorsion\nTamaño: 2\n\nDesactive las naves sin dañar a su tripulacion ni a su carga con el EVSD de Behring. Este cañon de distorsion presenta gran parte de la misma tecnologia lider en la industria utilizada en otras armas Behring, pero esta diseñado especificamente para montarse en la punta de un Aegis Vanguard.\n\n--- ATRIBUTOS ---\nPeso: 360.0 kg\nCadencia: 150 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 81.0 (Distort)  |  DPS: 202.5\nMunición: 25\nRegeneración: 1,125/s  |  Tiempo de Recarga: 1.4s  |  Coste/Disparo: 90\nVelocidad: 1,076 m/s  |  Alcance: 1.6 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 594  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_DistortionRepeater_VNG_S2=Fabricante: Behring\nTipo de artículo: Repetidor de distorsion\nTamaño: 2\n\nMetete con el sistema electrico de un agresor con el ATVS de Behring. Este repetidor de distorsion disruptivo y no letal solo es compatible con la montura frontal del Aegis Vanguard.\n\n--- ATRIBUTOS ---\nPeso: 90.0 kg\nCadencia: 500 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 27.0 (Distort)  |  DPS: 225.0\nMunición: 75\nRegeneración: 1,125/s  |  Tiempo de Recarga: 0.5s  |  Coste/Disparo: 27\nVelocidad: 1,346 m/s  |  Alcance: 1.3 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 243  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescBEHR_LaserCannon_S1=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 1\n\nEl M3A es el cañon automático laser de nivel básico de Behring. La configuracion del cañon automático ofrece un daño modesto por proyectil y una cadencia de disparo bastante baja. Como la oferta mas basica en la linea de armas de Behring, presenta un bajo consumo de energía, pero una eficiencia energetica deficiente. Compensa sus deficiencias siendo barato, una caracteristica que muchos pilotos buscan cuando equipan sus naves con un presupuesto limitado.\n\n--- ATRIBUTOS ---\nPeso: 144.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 182.2 (Energy)  |  DPS: 303.8\nMunición: 25\nRegeneración: 1,867/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 112\nVelocidad: 1,200 m/s  |  Alcance: 2.0 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 348  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
