item_Mining_MiningLaser_Greycat_1_S1_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Láser de minería\nTamaño: 1\n\nRango óptimo: 30 m\nRango máximo: 90 m\n\nPotencia del láser de minería: 504 - 2520\nPotencia del láser de extracción: 1850\n\nRanuras de módulo: 1\n\nInestabilidad del láser: -10%\nTasa de ventana de carga óptima: +40%\nNivel de material inerte: -30%\n\nTamaño de ventana de carga óptima: -60%\n\nGreycat clasifica al Lancet MH1 como un láser de soporte mejor utilizado cuando se mina con otros. Aunque el pequeño tamaño de la ventana de carga óptima del láser de minería significa que la precisión es clave, el Lancet MH1 sobresale en la reducción de la cantidad de materiales inertes recolectados por el láser de extracción. Para los equipos de minería, es un láser de soporte ideal para usar junto con otros láseres.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 2,520  |  Alcance: 30m→90m\n<EM4>Extracción:</EM4>  DPS: 1,850  |  Alcance: 30m→90m\n<EM4>Modificadores:</EM4>  Instability: -10%  |  Ventana Óptima de Carga: -60%  |  Filtro Inerte: +30%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Greycat_1_S2_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Láser de minería\nTamaño: 2\n\nRango óptimo: 45 m\nRango máximo: 135 m\n\nPotencia del láser de minería: 900 - 3600\nPotencia del láser de extracción: 2590\n\nRanuras de módulo: 2\n\nInestabilidad del láser: -10%\nTasa de ventana de carga óptima: +40%\nNivel de material inerte: -40%\n\nTamaño de ventana de carga óptima: -60%\n\nGreycat clasifica al Lancet MH2 como un láser de soporte mejor utilizado cuando se mina con otros. Aunque el pequeño tamaño de la ventana de carga óptima del láser de minería significa que la precisión es clave, el Lancet MH2 sobresale en llenarla una vez encontrada y en reducir la cantidad de materiales inertes recolectados por el láser de extracción. Para los equipos de minería, es un láser de soporte ideal para usar junto con otros láseres.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 3,600  |  Alcance: 45m→135m\n<EM4>Extracción:</EM4>  DPS: 2,590  |  Alcance: 45m→135m\n<EM4>Modificadores:</EM4>  Instability: -10%  |  Ventana Óptima de Carga: -60%  |  Filtro Inerte: +40%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Greycat_Default_S0_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Laser de minería \nTamaño: 0\n\nRango óptimo: 15m\nRango maximo: 20m\nRendimiento de recoleccion: 0.01 SCU/s\nRadio del punto de recoleccion: 1m\n\nEl Arbor se ha convertido en el laser de minería mas famoso del universo gracias a los exigentes estandares y la profesionalidad empresarial de Greycat Industrial. wess. El MHV toma el mismo diseño clasico y lo reinventa para convertirlo en una plataforma de minería mas compacta, sin dejar de ofrecer el rendimiento solido y fiable en el que los mineros confian.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 1  |  Alcance: 5m→15m\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Greycat_Default_S1_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Láser de minería\nTamaño: 1\n\nRango óptimo: 60 m\nRango máximo: 180 m\n\nPotencia del láser de minería: 189 - 1890\nPotencia del láser de extracción: 1850\n\nRanuras de módulo: 1\n\nInestabilidad del láser: -35%\nTamaño de ventana de carga óptima: +40%\nNivel de material inerte: -30%\n\nResistencia: +25%\n\nEl Arbor MH1 se convirtió en el láser de minería más aclamado del universo gracias a los estándares exigentes y la astucia comercial de Greycat Industrial. El láser ganó favor entre operaciones industriales y solitarias por equilibrar velocidad y seguridad, y también por contar con un sistema de filtración especial que reduce la cantidad de material inerte recolectado. Greycat capitalizó esta reputación al asegurar contratos exclusivos que convirtieron al Arbor MH1 en la cabeza láser estándar en la mayoría de las naves mineras.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 1,890  |  Alcance: 60m→180m\n<EM4>Extracción:</EM4>  DPS: 1,850  |  Alcance: 60m→180m\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Greycat_Default_S2_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Láser de minería\nTamaño: 2\n\nRango óptimo: 90 m\nRango máximo: 270 m\n\nPotencia del láser de minería: 480 - 2400\nPotencia del láser de extracción: 2590\n\nRanuras de módulo: 2\n\nInestabilidad del láser: -35%\nTamaño de ventana de carga óptima: +40%\nNivel de material inerte: -40%\n\nResistencia: +25%\n\nEl Arbor MH2 es la versión de tamaño dos de la aclamada serie de láseres de minería Arbor de Greycat. Al igual que la variante más pequeña, el diseño sólido y confiable del Arbor MH2 ganó favor entre operaciones industriales y solitarias por equilibrar velocidad y seguridad, y también por contar con un sistema de filtración especial que reduce la cantidad de material inerte recolectado.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 2,400  |  Alcance: 90m→270m\n<EM4>Extracción:</EM4>  DPS: 2,590  |  Alcance: 90m→270m\n<EM4>Modificadores:</EM4>  Instability: -35%  |  Ventana Óptima de Carga: +40%  |  Resistencia: +25%  |  Filtro Inerte: +40%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
item_Mining_MiningLaser_Shubin_1_S1_Desc=Fabricante: Shubin Interstellar\nTipo de artículo: Láser de minería \nTamaño: 1\n\nRango óptimo: 45m\nRango máximo: 135m\n\nPotencia del láser de minería: 105 - 2100\nPotencia del láser de extracción: 1295\n\nRanuras de módulo: 1\n\nResistencia: -30%\nTasa de ventana de carga óptima: +20%\nNivel de material inerte: -30%\n\nInestabilidad del láser: +10%\n\nEl Hofstede-S1 fue diseñado con una estructura de retícula de cristal patentada que amortigua la resistencia natural de un depósito durante la minería y recoge menos materiales inertes durante la extracción. Más efectivo a corto y medio alcance, un aumento acompañante en la inestabilidad significa que el láser debe ser manejado con cuidado.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 2,100  |  Alcance: 45m→135m\n<EM4>Extracción:</EM4>  DPS: 1,295  |  Alcance: 45m→135m\n<EM4>Modificadores:</EM4>  Instability: +10%  |  Ventana Óptima de Carga: +60%  |  Resistencia: -30%  |  Filtro Inerte: +30%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
