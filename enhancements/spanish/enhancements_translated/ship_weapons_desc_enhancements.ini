item_Mining_MiningLaser_Shubin_2_S1_Desc=Fabricante: Shubin Interstellar\nTipo de artículo: Láser de minería \nTamaño: 1\n\nRango óptimo: 45m\nRango máximo: 135m\n\nPotencia del láser de minería: 378 - 2220\nPotencia del láser de extracción: 2220\n\nRanuras de módulo: 0\n\nResistencia: -45%\nTamaño de la ventana de carga óptima: +20%\nNivel de material inerte: -30%\n\nInestabilidad del láser: +35%\n\nShubin diseñó el Klein-S1 para generar un láser potente que haga la minería más rápida. Esta potencia conlleva riesgos adicionales al aumentar la inestabilidad del láser, pero si se usa correctamente, el Klein-S1 puede generar rápidamente recompensas para el minero cuidadoso.\n\n--- ATRIBUTOS ---\n<EM4>Fractura:</EM4>  DPS: 2,520  |  Alcance: 45m→135m\n<EM4>Extracción:</EM4>  DPS: 2,220  |  Alcance: 45m→135m\n<EM4>Modificadores:</EM4>  Instability: +35%  |  Ventana Óptima de Carga: +20%  |  Resistencia: -45%  |  Filtro Inerte: +30%\n<EM4>HP del Componente:</EM4> 8,000\n<EM4>Distorsión Máx:</EM4> 500,000
