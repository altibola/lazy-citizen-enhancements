item_DescKRON_LaserCannon_S1=Fabricante: Kroneg\nTipo de artículo: Cañon laser\nTamaño: 1\n\nProduce daño masivo desde la distancia con la linea FL de cañones laser de Kroneg. El FL-11 puede disparar lento pero proporciona una potencia de fuego considerable para un arma de tamaño uno.\n\n--- ATRIBUTOS ---\nPeso: 120.0 kg\nCadencia: 250 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 49.2 (Energy)  |  DPS: 205.2\nMunición: 25\nRegeneración: 1,267/s  |  Tiempo de Recarga: 1.6s  |  Coste/Disparo: 52\nVelocidad: 1,200 m/s  |  Alcance: 2.0 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 550\nSignatures:  EM: 408  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKRON_LaserCannon_S2=Fabricante: Kroneg\nTipo de artículo: Cañon laser\nTamaño: 2\n\nProduce daño masivo desde la distancia con la linea FL de cañones laser de Kroneg. El FL-22 de tamaño dos brilla a mediano y largo alcance gracias a un diseño que minimiza la caida del daño.\n\n--- ATRIBUTOS ---\nPeso: 300.0 kg\nCadencia: 250 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 74.0 (Energy)  |  DPS: 308.5\nMunición: 25\nRegeneración: 1,904/s  |  Tiempo de Recarga: 1.7s  |  Coste/Disparo: 79\nVelocidad: 1,196 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 545  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescKRON_LaserCannon_S3=Fabricante: Kroneg\nTipo de artículo: Cañon laser\nTamaño: 3\n\nProduce daño masivo desde la distancia con la linea FL de cañones laser de Kroneg. El FL-33, que incorpora la filosofia de diseño practico de Kroneg, sigue siendo uno de los cañones laser de tamaño tres mas fiables y destructivos disponibles actualmente.\n\n--- ATRIBUTOS ---\nPeso: 750.0 kg\nCadencia: 250 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 110.8 (Energy)  |  DPS: 461.7\nMunición: 25\nRegeneración: 2,850/s  |  Tiempo de Recarga: 1.8s  |  Coste/Disparo: 118\nVelocidad: 1,184 m/s  |  Alcance: 2.4 km\nConsumo de Energía: 2 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 681  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S01_CS_FSKI_Spark=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Seccion transversal\nTamaño: 1\n\nAquellos que creen que el tamaño no importa harian bien en mantenerse alejados del Firestorm Kinetics Spark. Al utilizar objetivos de seccion transversal, este misil de proximidad liviano tiene un impacto considerable.\n\n--- ATRIBUTOS ---\nPeso: 63.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S01_EM_BEHR_Pioneer=Fabricante: Behring\nSeñal de seguimiento: Electromagnetica\nTamaño: 1\n\nBehring se enorgullece de su confiabilidad y el Pioneer no es una excepcion. El sistema de seguimiento Oracle EM actualizado ha demostrado su eficacia una y otra vez en numerosos informes de pruebas de consumidores contra misiles de proximidad de clasificacion similar.\n\n--- ATRIBUTOS ---\nPeso: 51.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S01_EM_THCN_TaskForce=Fabricante: Thermyte Concern\nSeñal de seguimiento: Electromagnetica\nTamaño: 1\n\nAventurandose en el mercado de armas, Thermyte Concern ha reunido su amplio conocimiento sobre explosivos de demolicion para crear el TaskForce. Un misil de ataque de seguimiento EM liviano con un sistema de propulsión de primer nivel proporciona una combinación eficiente de velocidad y potencia de fuego para establecer el dominio en el campo de batalla.\n\n--- ATRIBUTOS ---\nPeso: 25.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S01_IR_BEHR_Marksman=Fabricante: Behring\nSeñal de seguimiento: Infrarrojo\nTamaño: 1\n\nLa serie Marksman de misiles de proximidad de Behring se ha ganado tanta reputación por su capacidad de rastrear una amplia gama de firmas de calor como por su daño de proximidad con efecto de area.\n\n--- ATRIBUTOS ---\nPeso: 56.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S01_IR_VNCL_Arrow=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojo\nTamaño: 1\n\nComunmente conocido por su designacion militar, el Arrow es un pequeño misil de ataque infrarrojo que se ha convertido en un pilar de la armeria Vanduul.\n\n--- ATRIBUTOS ---\nPeso: 70.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S02_CS_FSKI_Tempest=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Seccion transversal\nTamaño: 2\n\nEl Tempest fue diseñado con nada mas que la aniquilacion en mente. Utilizando la tecnologia de focalizacion de FireStorm Kinetics, este misil de proximidad se fija en la seccion transversal de un objetivo para llevar los conflictos a una conclusion rapida.\n\n--- ATRIBUTOS ---\nPeso: 121.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S02_CS_THCN_StrikeForce=Fabricante: Thermyte Concern\nSeñal de seguimiento: Seccion transversal\nTamaño: 2\n\nEl StrikeForce es la última culminacion de la  expansión de Thermyte Concern en la industria de misiles, mostrando notables mejoras en el diseño y la orientacion transversal.\n\n--- ATRIBUTOS ---\nPeso: 72.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S02_EM_TALN_Dominator=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 2\n\nDiseñado para rastrear la firma electromagnetica de un oponente, el misil de ataque Dominator es un paquete de artilleria de precision diseñado para establecer el dominio tactico en el campo de batalla.\n\n--- ATRIBUTOS ---\nPeso: 136.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S02_IR_FSKI_Ignite=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Infrarrojo\nTamaño: 2\n\nEl Ignite es la principal marca de misiles de ataque con busqueda de calor de Firestorm, que es la definicion de Fuego y olvido. Simplemente dejalo volar y disfruta del espectaculo.\n\n--- ATRIBUTOS ---\nPeso: 113.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S02_IR_NOVP_Rattler=Fabricante: Nova Pyrotechnica\nSeñal de seguimiento: Infrarrojo\nTamaño: 2\n\nEl Rattler es un misil de racimo rentable que sin duda atraera a una amplia variedad de pilotos. Cuando se dispara, el Rattler rastreara la firma IR del oponente y creara un bombardeo de apertura que debilita la armadura o los escudos, dejando al objetivo vulnerable a la carga util completa que sigue.\n\n--- ATRIBUTOS ---\nPeso: 133.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S02_IR_VNCL_Bullet=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojos\nTamaño: 2\n\nLos pilotos de la Armada han desarrollado un saludable respeto por este misil de ataque Vanduul con objetivo infrarrojo, formalmente designado Bullet.\n\n--- ATRIBUTOS ---\nPeso: 113.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S03_CS_FSKI_Arrester=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Seccion transversal\nTamaño: 3\n\nUtilizando la orientacion de seccion transversal para cazar a su presa, el misil de proximidad Firestorm Arrester elimina rapidamente a los enemigos atrapados en el punto de mira.\n\n--- ATRIBUTOS ---\nPeso: 119.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S03_EM_FSKI_Thunderbolt=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Electromagnetica \nTamaño: 3\n\nGracias a la estructura agil del Firestorm Thunderbolt y al sistema de orientacion EM, este misil de proximidad es una opción solida para una amplia variedad de escenarios de combate.\n\n--- ATRIBUTOS ---\nPeso: 119.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S03_IR_NOVP_Viper=Fabricante: Nova Pyrotechnica\nSeñal de seguimiento: Infrarrojo\nTamaño: 3\n\nNova ha trabajado duro para garantizar que su misil de ataque Viper con seguimiento por infrarrojos haga honor a su nombre al realizar ataques agiles y letales contra objetivos hostiles.\n\n--- ATRIBUTOS ---\nPeso: 189.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S03_IR_VNCL_Chaos=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojos\nTamaño: 3\n\n Los instructores de vuelo navales a menudo incluyen el misil de ataque Caos con busqueda de calor en las simulaciones de ataque Vanduul, citando que su velocidad y fuerza brindan a los nuevos reclutas el respeto adecuado por el enemigo al que se enfrentaran.\n\n--- ATRIBUTOS ---\nPeso: 171.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S04_CS_TALN_Assailant=Fabricante: Talon\nSeñal de seguimiento: Seccion transversal\nTamaño: 4\n\nEl misil Assailant de Talon es una solucion de arma perfecta para ataques de precision contra oponentes motivados.\n\n--- ATRIBUTOS ---\nPeso: 224.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S04_EM_TALN_Raptor=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 4\n\nUtilizando seguimiento electromagnetico avanzado y vuelo de precision equilibrado, el misil de ataque Talon Raptor es una feroz adicion al arsenal de cualquier nave.\n\n--- ATRIBUTOS ---\nPeso: 221.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S04_IR_BEHR_Pathfinder=Fabricante: Behring\nSeñal de seguimiento: Infrarrojo\nTamaño: 4\n\nEl misil de proximidad Pathfinder ha sido un miembro constante del ya robusto arsenal de Behring gracias a su probado sistema de propulsión y su conjunto de guia de busqueda de calor.\n\n--- ATRIBUTOS ---\nPeso: 203.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S04_IR_VNCL_Dragon=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojo\nTamaño: 4\n\nDesignado como Dragon, este misil de ataque de seguimiento infrarrojo Vanduul tiene una reputación temible que se ha ganado el numero de naves navales destruidos atribuido a su poder destructivo.\n\n--- ATRIBUTOS ---\nPeso: 212.0 kg\nHP del Componente: 25\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S05_CS_TALN_Stalker=Fabricante: Talon\nSeñal de seguimiento: Seccion transversal\nTamaño: 5\n\nCon seguimiento de seccion transversal dedicado, el Talon Stalker ha resistido a lo largo de los años como un torpedo de ataque de precision con maxima potencia de frenado.\n\n--- ATRIBUTOS ---\nPeso: 303.0 kg\nHP del Componente: 50\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S05_EM_TALN_Reaper=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 5\n\nEl torpedo de ataque Reaper presenta una favorable relacion rendimiento-gasto destructivo y un conjunto de seguimiento Talon EM probado.\n\n--- ATRIBUTOS ---\nPeso: 326.0 kg\nHP del Componente: 50\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S05_EM_TALN_Scimitar=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 5\n\nEl misil Scimitar rastrea objetivos a traves de su firma EM para entregar una carga util devastadora de tamaño cinco.\n\n--- ATRIBUTOS ---\nPeso: 314.0 kg\nHP del Componente: 50\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S05_IR_TALN_Valkyrie=Fabricante: Talon\nSeñal de seguimiento: Infrarrojo\nTamaño: 5\n\nEl equipo de diseño de torpedos de Talon hizo todo lo posible para su ultimo torpedo de ataque Valkyrie al crear una solucion de empuje de varios niveles con capacidades de seguimiento infrarrojo de última generacion.\n\n--- ATRIBUTOS ---\nPeso: 314.0 kg\nHP del Componente: 50\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S07_IR_TALN_Hellion=Fabricante: Talon\nSeñal de seguimiento: Infrarrojos\nTamaño: 7\n\nCon una carga util considerable y un conjunto avanzado de sensores de busqueda de calor, el misil Hellion de Talon puede ser efectivo contra agresores de todos los tamaños.\n\n--- ATRIBUTOS ---\nPeso: 452.0 kg\nHP del Componente: 200\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S09_CS_TALN_Argos=Fabricante: Talon\nSeñal de seguimiento: Seccion transversal\nTamaño: 9\n\nEl torpedo de ataque Talon Argos presenta un diseño clasico y sencillo que se basa en estandares de fabricacion exigentes y un sistema de orientacion de seccion transversal clasico.\n\n--- ATRIBUTOS ---\nPeso: 449.0 kg\nHP del Componente: 1,000\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S09_CS_TALN_Argos_2=item_NameMISL_S09_CS_TALN_Argos_2
item_DescMISL_S09_EM_TALN_Seeker=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 9\n\nEl torpedo Seeker de Talon es un torpedo de precision con orientacion EM capaz de entregar una carga util masiva de forma rapida y precisa.\n\n--- ATRIBUTOS ---\nPeso: 447.0 kg\nHP del Componente: 667\nTemp. de Sobrecalentamiento: 450K
item_DescMISL_S09_IR_TALN_Typhoon=Fabricante: Talon\nSeñal de seguimiento: Infrarrojos\nTamaño: 9\n\nDiseñado por Talon, el torpedo de ataque con busqueda de calor Typhoon ofrece una carga util pesada que seguramente servira como disuasivo de futuras acciones hostiles.\n\n--- ATRIBUTOS ---\nPeso: 452.0 kg\nHP del Componente: 667\nTemp. de Sobrecalentamiento: 450K
