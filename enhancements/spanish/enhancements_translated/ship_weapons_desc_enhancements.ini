item_DescBEHR_LaserCannon_S2=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 2\n\nEl M4A es el cañon automático laser de segundo nivel de Behring. Su mayor tamaño significa mas consumo de energía a cambio de tener una mayor potencia. La velocidad de disparo y la eficiencia energetica son comparables a las del modelo M3A.\n\n--- ATRIBUTOS ---\nPeso: 360.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 273.4 (Energy)  |  DPS: 455.6\nMunición: 25\nRegeneración: 2,815/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 168\nVelocidad: 1,196 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 495  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
