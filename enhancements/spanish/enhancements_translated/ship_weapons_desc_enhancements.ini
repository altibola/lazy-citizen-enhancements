item_DescHRST_LaserRepeater_S1=Fabricante: Hurston Dynamics\nTipo de artículo: Repetidor laser\nTamaño: 1\n\nEl repetidor laser Attrition-1 presenta la exclusiva tecnologia en cascada de Hurston Dynamics que proporciona un mayor rendimiento mientras se mantiene el fuego laser sostenido. El resultado es un arma de tamaño uno que recompensa a un operador habil.\n\n--- ATRIBUTOS ---\nPeso: 24.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 34.0 (Energy)  |  DPS: 198.3\nMunición: 75\nRegeneración: 2,155/s  |  Tiempo de Recarga: 0.7s  |  Coste/Disparo: 37\nVelocidad: 1,500 m/s  |  Alcance: 1.6 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 524\nSignatures:  EM: 167  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserRepeater_S2=Fabricante: Hurston Dynamics\nTipo de artículo: Repetidor laser\nTamaño: 2\n\nCuando la batalla se intensifica, es cuando la tecnologia laser en cascada de Hurston Dynamics realmente brilla. Con el repetidor Attrition-2 de tamaño dos, un operador puede utilizar rafagas sostenidas de fuego laser para traducir el exceso de calor en un mayor rendimiento del arma.\n\n--- ATRIBUTOS ---\nPeso: 60.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 55.0 (Energy)  |  DPS: 320.8\nMunición: 75\nRegeneración: 3,232/s  |  Tiempo de Recarga: 0.7s  |  Coste/Disparo: 55\nVelocidad: 1,495 m/s  |  Alcance: 1.7 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 850\nSignatures:  EM: 223  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserRepeater_S3=Fabricante: Hurston Dynamics\nTipo de artículo: Repetidor laser\nTamaño: 3\n\nEn lugar de limitar el rendimiento de su arma para aumentar la estabilidad, la tecnologia en cascada de Hurston Dynamics permite al operador decidir. Si bien el sobrecalentamiento es un riesgo, periodos mas prolongados de fuego sostenido con el repetidor laser Attrition-3 aumentaran el rendimiento ya que el exceso de calor se traduce en una mayor produccion de energía.\n\n--- ATRIBUTOS ---\nPeso: 150.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 86.0 (Energy)  |  DPS: 501.7\nMunición: 75\nRegeneración: 4,853/s  |  Tiempo de Recarga: 0.7s  |  Coste/Disparo: 84\nVelocidad: 1,480 m/s  |  Alcance: 1.9 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 278  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserRepeater_S4=Fabricante: Hurston Dynamics\nTipo de artículo: Repetidor laser\nTamaño: 4\n\nHurston Dynamics ha integrado completamente su tecnologia laser en cascada en su linea de repetidores Attrition. El Attrition-4 de tamaño cuatro no es una excepcion, ya que funciona a su maximo rendimiento cuando esta cerca de su capacidad termica maxima.\n\n--- ATRIBUTOS ---\nPeso: 375.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 150.0 (Energy)  |  DPS: 875.0\nMunición: 75\nRegeneración: 3,000/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 125\nVelocidad: 1,440 m/s  |  Alcance: 2.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,650\nSignatures:  EM: 334  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserRepeater_S5=Fabricante: Hurston Dynamics\nTipo de artículo: Repetidor laser\nTamaño: 5\n\nMas que un simple repetidor laser de tamaño cinco, el Attrition-5 de Hurston Dynamics presenta una avanzada tecnologia en cascada para permitir al arma mejoras significativas en el rendimiento cuanto mas tiempo mantenga su produccion de energía.\n\n--- ATRIBUTOS ---\nPeso: 938.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 150.0 (Energy)  |  DPS: 875.0\nMunición: 75\nRegeneración: 10,914/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 187\nVelocidad: 1,390 m/s  |  Alcance: 3.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 2,640\nSignatures:  EM: 390  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserRepeater_S6=Fabricante: Hurston Dynamics\nTipo de artículo: Repetidor laser\nTamaño: 6\n\nCon la tecnologia en cascada de Hurston Dynamics, el repetidor laser Attrition-6 maximiza su potencial de combate. Es comun que las armas se calienten cuando se usan intensamente en combate, pero lo que distingue a este repetidor de tamaño seis es que la energía termica se traduce directamente en una mayor fuerza ofensiva.\n\n--- ATRIBUTOS ---\nPeso: 2340.0 kg\nCadencia: 350 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 505.4 (Energy)  |  DPS: 2,947.9\nMunición: 75\nRegeneración: 16,377/s  |  Tiempo de Recarga: 0.8s  |  Coste/Disparo: 281\nVelocidad: 1,350 m/s  |  Alcance: 4.8 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 4,224\nSignatures:  EM: 446  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserScattergun_S1=Fabricante: Hurston Dynamics\nTipo de artículo: Pistola de dispersión laser\nTamaño: 1\n\nGracias a la integracion de la tecnologia de cascada laser de Hurston Dynamics, la pistola de dispersión Dominance-1 puede causar mas daño cuanto mas cerca este el tamaño de un arma de su maxima capacidad termica segura.\n\n--- ATRIBUTOS ---\nPeso: 48.0 kg\nCadencia: 50 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 504.0 x8 (Energy)  |  DPS: 420.0\nMunición: 75\nRegeneración: 1,867/s  |  Tiempo de Recarga: 0.3s  |  Coste/Disparo: 70\nVelocidad: 900 m/s  |  Alcance: 999 m\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,550\nSignatures:  EM: 248  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserScattergun_S2=Fabricante: Hurston Dynamics\nTipo de artículo: Pistola de dispersión laser\nTamaño: 2\n\nCuanto mas dura sea la pelea, mas duro funcionara la pistola de dispersión Dominance-2. A medida que aumentan sus niveles termicos, el arma de tamaño dos de Hurston Dynamics puede utilizar tecnologia en cascada para convertir ese potencial termico en un ataque cuerpo a cuerpo aun mas letal.\n\n--- ATRIBUTOS ---\nPeso: 120.0 kg\nCadencia: 50 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 792.0 x8 (Energy)  |  DPS: 660.0\nMunición: 75\nRegeneración: 2,933/s  |  Tiempo de Recarga: 0.3s  |  Coste/Disparo: 110\nVelocidad: 897 m/s  |  Alcance: 1.1 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,550\nSignatures:  EM: 330  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_LaserScattergun_S3=Fabricante: Hurston Dynamics\nTipo de artículo: Pistola de dispersión laser\nTamaño: 3\n\nLa pistola de dispersión Dominance-3 de Hurston Dynamics muestra la tecnologia en cascada del fabricante de armas. A medida que el operador continua disparando el arma de tamaño tres, mas capaz será de convertir el calor generado en ataques cada vez mas devastadores.\n\n--- ATRIBUTOS ---\nPeso: 300.0 kg\nCadencia: 50 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 1,116.0 x8 (Energy)  |  DPS: 930.0\nMunición: 75\nRegeneración: 4,133/s  |  Tiempo de Recarga: 0.4s  |  Coste/Disparo: 155\nVelocidad: 888 m/s  |  Alcance: 1.2 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,550\nSignatures:  EM: 413  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
item_DescHRST_Nova_BallisticCannon_S5=Fabricante: Hurston Dynamics\nTipo de artículo: Cañon balistico\nTamaño: 5\n\nDiseñado especificamente para el tanque Nova, el cañon balistico Slayer de Hurston Dynamics se gano su ilustre reputación a traves de innumerables enfrentamientos en el campo de batalla durante la Segunda Guerra Tevarin. Esta bestia del campo de batalla destaca contra objetivos blindados y emplazamientos fortificados al disparar rondas de artilleria de gran calibre con una precision y velocidad asombrosas. Hurston trabajo en estrecha colaboracion con Tumbril cuando el fabricante del tanque decidio recuperar el Nova. Aunque honraron minuciosamente el diseño original de Slayer, Hurston tambien lo actualizo para el siglo 30 mejorando la velocidad de giro, la resistencia al calor y el software asociado para proporcionar una interfaz de usuario de artillero de última generacion.\n\n--- ATRIBUTOS ---\nPeso: 7500.0 kg\nCadencia: 12 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 13,500.0 (Phys)  |  DPS: 2,700.0\nMunición: 363\nVelocidad: 973 m/s  |  Alcance: 6.0 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 20,000\nSignatures:  EM: 50  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
