item_DescBEHR_LaserCannon_S3=Fabricante: Behring\nTipo de artículo: Cañon laser\nTamaño: 3\n\nCuando se diseñan cañones automáticos de energía, el M5A de Behring proporciona el estandar con el que se miden, debido a su largo alcance de participacion y bajo daño radiactivo.\n\n--- ATRIBUTOS ---\nPeso: 900.0 kg\nCadencia: 100 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 410.2 (Energy)  |  DPS: 683.6\nMunición: 25\nRegeneración: 4,220/s  |  Tiempo de Recarga: 1.3s  |  Coste/Disparo: 253\nVelocidad: 1,184 m/s  |  Alcance: 2.4 km\nConsumo de Energía: 1 PU/s\nHP del Componente: 1,024\nSignatures:  EM: 644  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
