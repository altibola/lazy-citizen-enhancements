item_DescGATS_BallisticCannon_S1=Fabricante: Gallenson Tactical Systems\nTipo de artículo: Cañon balistico\nTamaño: 1\n\nAlimentado por el sistema de munición de tambor patentado SpinGlide de Gallenson Tactical, el Tarantula GT-870 Mk1 puede lanzar de manera suave y precisa un flujo constante de proyectiles balisticos. Aunque solo tiene una velocidad de disparo moderada, su durabilidad fiable lo convierte en una adicion fiable para cualquier pelea.\n\n--- ATRIBUTOS ---\nPeso: 144.0 kg\nCadencia: 200 RPM\nModos de Disparo: Semi-Auto\nDaño Alfa: 60.8 (Phys)  |  DPS: 202.5\nMunición: 330\nVelocidad: 1,200 m/s  |  Alcance: 2.5 km\nConsumo de Energía: 0 PU/s\nHP del Componente: 550\nSignatures:  EM: 50  |  IR: 0\nTemp. de Sobrecalentamiento: 450K
