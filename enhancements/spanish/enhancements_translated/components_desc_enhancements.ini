item_DescCOOL_JSPN_S00_FrostStarSL=Tipo de artículo: Cooler\nFabricante: J-Span\nTamaño: 0\nGrado: C\nClase: Civil\n\nYa sea que navegue por el suelo o navegue por el espacio, hay un refrigerador J-Span perfecto para usted. El Frost-Star SL es un refrigerador de nivel medio diseñado para llevar la confiabilidad de la linea a vehículos terrestrés y de capota abierta.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 16 CR/s\nConsumo de Energía: 1 PU/s\nHP del Componente: 46\nSignatures:  EM: 375  |  IR: 2,500\nTemp. de Sobrecalentamiento: 600K
item_DescCOOL_JSPN_S00_WinterStarSL_SCItem=Tipo de artículo: Cooler\nFabricante: J-Span\nTamaño: 0\nGrado: D \nClase: Civil\n\nLo ultimo en la linea de cooler Winter-Star de J-Span, el nuevo sistema Kivo del SL ofrece un metodo de dispersión único, lo que permite que su vehículo administre el calor mejor que nunca.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 14 CR/s\nConsumo de Energía: 1 PU/s\nHP del Componente: 40\nSignatures:  EM: 375  |  IR: 2,270\nTemp. de Sobrecalentamiento: 545K
item_DescCOOL_JSPN_S01_CryoStar=Tipo de artículo: Enfriador\nFabricante: J-Span\nTamaño: 1\nGrado: B\nClase: Civil\n\n El refrigerador Cryo-Star de consumo de J-Span se ha convertido en algo comun en todo el Imperio gracias a su fiable absorcion de calor que no sobrecargara el generador de energía de su nave.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 26 CR/s\nConsumo de Energía: 2 PU/s\nHP del Componente: 150\nSignatures:  EM: 750  |  IR: 4,000\nTemp. de Sobrecalentamiento: 660K
item_DescCOOL_JSPN_S01_FrostStar=Tipo de artículo: Enfriador\nFabricante: J-Span \nTamaño: 1\nGrado: C\nClase: Civil\n\nDestacado por su rendimiento constante, el enfriador Frost-Star de J-Span tiene muchos admiradores por su relacion equilibrada entre potencia y calor.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 26 CR/s\nConsumo de Energía: 2 PU/s\nHP del Componente: 130\nSignatures:  EM: 750  |  IR: 4,000\nTemp. de Sobrecalentamiento: 600K
item_DescCOOL_JSPN_S01_WinterStar=Tipo de artículo: Cooler\nFabricante: J-Span \nTamaño: 1\nGrado: D\nClase: Civil\n\nunase a la familia J-Span adquiriendo el refrigerador Winter-Star para su nave. Este modelo básico carece de flash, pero su solido historial de rendimiento y su precio lo convierten en una opción popular para los pilotos de toda la UEE.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 23 CR/s\nConsumo de Energía: 2 PU/s\nHP del Componente: 110\nSignatures:  EM: 750  |  IR: 3,630\nTemp. de Sobrecalentamiento: 545K
item_DescCOOL_JSPN_S02_CryoStarEX=Tipo de artículo: Enfriador\nFabricante: J-Span\nTamaño: 2\nGrado: B\nClase: Civil\n\nCon su linea EX, J-Span ha brindado la misma absorcion de calor fiable de su popular refrigerador Cryo-Star a los pilotos que buscan equipar naves mas grandes.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 34 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 400\nSignatures:  EM: 1,130  |  IR: 5,500\nTemp. de Sobrecalentamiento: 660K
item_DescCOOL_JSPN_S02_FrostStarEX=Tipo de artículo: Enfriador\nFabricante: J-Span \nTamaño: 2\nGrado: C\nClase: Civil\n\nEl enfriador Frost-Star EX viene de J-Span, un fabricante con una merecida reputación entre los armadores por construir refrigeradores que pueden manejar de manera fiable el intercambio de calor dondequiera que pueda volar.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 34 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 350\nSignatures:  EM: 1,130  |  IR: 5,500\nTemp. de Sobrecalentamiento: 600K
item_DescCOOL_JSPN_S02_WinterStarEX_SCItem=Tipo de artículo: Cooler\nFabricante: J-Span \nTamaño: 2\nGrado: D\nClase: Civil\n\nEl Winter-Star EX es un refrigerador básico en el que puede confiar. Construido por los expertos de J-Span, esta listo para manejar cualquier condicion que encuentre.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 32 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 300\nSignatures:  EM: 1,130  |  IR: 5,000\nTemp. de Sobrecalentamiento: 545K
item_DescCOOL_JSPN_S03_FrostStarXL_SCItem=Tipo de artículo: Enfriador\nFabricante: J-Span \nTamaño: 3\nGrado: C\nClase: Civil\n\nA medida que su nave vuela, los componentes generan calor que puede ser dañino e incluso provocar fallas en el sistema a menos que un enfriador fiable y diseñado adecuadamente como el Frost-Star XL de J-Span.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 45 CR/s\nConsumo de Energía: 4 PU/s\nHP del Componente: 960\nSignatures:  EM: 1,500  |  IR: 7,000\nTemp. de Sobrecalentamiento: 600K
item_DescCOOL_JSPN_S03_WinterStarXL_SCItem=Tipo de artículo: Cooler\nFabricante: J-Span \nTamaño: 3\nGrado: D\nClase: Civil\n\nDurante dos siglos, J-Span se ha dedicado a fabricar refrigeradores. El Winter-Star XL es su refrigerador grande de nivel básico. Lo que le falta en caracteristicas lo compensa con creces con una solida artesania.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 41 CR/s\nConsumo de Energía: 4 PU/s\nHP del Componente: 840\nSignatures:  EM: 1,500  |  IR: 6,380\nTemp. de Sobrecalentamiento: 545K
item_DescCOOL_JUST_S01_EcoFlow=Tipo de artículo: Enfriador\nFabricante: Juno Starwerk \nTamaño: 1\nGrado: B\nClase: Industrial\n\nUn estandar durante siglos, el enfriador industrial Eco-Flow de Juno Starwerk es uno de los favoritos de los transportistas por su facil mantenimiento incluso cuando transportan las cargas mas pesadas.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 32 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 180\nSignatures:  EM: 1,490  |  IR: 6,530\nTemp. de Sobrecalentamiento: 743K
item_DescCOOL_JUST_S01_Hydrocel=Tipo de artículo: Enfriador\nFabricante: Juno Starwerk \nTamaño: 1\nGrado: D\nClase: Industrial\n\nMantenga su nave trabajando mas duro durante mas tiempo con el duradero Hydrocel, un enfriador industrial de nivel básico del respetado fabricante Juno Starwerk.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 29 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 130\nSignatures:  EM: 1,490  |  IR: 5,940\nTemp. de Sobrecalentamiento: 614K
item_DescCOOL_JUST_S01_Thermax=Tipo de artículo: Cooler\nFabricante: Juno Starwerk \nTamaño: 1\nGrado: C\nClase: Industrial\n\nJuno Starwerk lo ha vuelto a hacer. Con la linea de cooler Thermax, Juno elevo el liston de los refrigeradores industriales economicos fabricados para adaptarse a cualquier presupuesto. Estos pequeños refrigeradores ofrecen un rendimiento y una durabilidad superiores a la media, pero sin gastar mucho dinero.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 32 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 150\nSignatures:  EM: 1,490  |  IR: 6,530\nTemp. de Sobrecalentamiento: 675K
item_DescCOOL_JUST_S02_CoolCore=Tipo de artículo: Cooler\nFabricante: Juno Starwerk \nTamaño: 2\nGrado: C\nClase: Industrial\n\nEl nombre CoolCore lo dice todo. Diseñado por Juno Starwerk para ser tan trabajador como usted, este refrigerador ayuda a garantizar que toda su nave funcione bien dentro de los parametros de temperatura deseados.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 41 CR/s\nConsumo de Energía: 4 PU/s\nHP del Componente: 420\nSignatures:  EM: 1,980  |  IR: 8,710\nTemp. de Sobrecalentamiento: 675K
item_DescCOOL_JUST_S02_Hydrojet=Tipo de artículo: Cooler\nFabricante: Juno Starwerk \nTamaño: 2\nGrado: D\nClase: Industrial\n\nCuando su nave se sobrecalienta, hace que casi cualquier tarea no solo sea mas dificil, sino tambien potencialmente peligrosa para usted y su tripulacion. Con el HydroJet básico de Juno Starwerk instalado, puede estar seguro de que sus niveles de calor están controlados por un enfriador diseñado por uno de los nombres mas fiables de la industria.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 38 CR/s\nConsumo de Energía: 4 PU/s\nHP del Componente: 370\nSignatures:  EM: 1,980  |  IR: 7,920\nTemp. de Sobrecalentamiento: 614K
item_DescCOOL_JUST_S02_Snowpack_SCItem=Tipo de artículo: Enfriador\nFabricante: Juno Starwerk\nTamaño: 2\nGrado: A \nClase: Industrial\n\nLos refrigeradores industriales de tamaño mediano no hay nada mejor que el Snowpack de Juno Starwerk. Su excelente rendimiento y durabilidad lo han convertido en el favorito de los transportistas durante siglos.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 46 CR/s\nConsumo de Energía: 4 PU/s\nHP del Componente: 550\nSignatures:  EM: 1,980  |  IR: 9,500\nTemp. de Sobrecalentamiento: 810K
item_DescCOOL_JUST_S03_ChillMax_SCItem=Tipo de artículo: Enfriador\nFabricante: Juno Starwerk\nTamaño: 3\nGrado: A \nClase: Industrial\n\nEl nombre Chill-Max es tan sencillo como el diseño de este enfriador Juno Starwerk. Este refrigerador industrial de alta calificación ha sido el favorito de los transportistas durante siglos.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 58 CR/s\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,500\nSignatures:  EM: 2,480  |  IR: 11,900\nTemp. de Sobrecalentamiento: 810K
item_DescCOOL_JUST_S03_Hydropulse_SCItem=Tipo de artículo: Enfriador\nFabricante: Juno Starwerk\nTamaño: 3\nGrado: D \nClase: Industrial\n\nUna opción de nivel básico para la marca de refrigeradores de Juno Starwerk, el Hydropulse sacrifica algo de durabilidad y utiliza algunos trucos de diseño para hacer de este gran refrigerador industrial una opción para aquellos que no pueden pagar uno de sus modelos de primera linea.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 48 CR/s\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,000\nSignatures:  EM: 2,480  |  IR: 9,900\nTemp. de Sobrecalentamiento: 614K
item_DescCOOL_JUST_S03_ThermalCore=Tipo de artículo: Cooler\nFabricante: Juno Starwerk \nTamaño: 3\nGrado: C\nClase: Industrial\n\nCuando este en medio de un trabajo importante, no querra perder el tiempo preguntandose si su refrigerador esta haciendo su parte. Ahora no es necesario. Con el fiable enfriador ThermalCore de nivel medio de Juno Starwerk integrado, puede eliminar todas las conjeturas sobre la gestión del calor.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 52 CR/s\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,200\nSignatures:  EM: 2,480  |  IR: 10,900\nTemp. de Sobrecalentamiento: 675K
item_DescCOOL_LPLT_S01_ArcticStorm=Tipo de artículo: Cooler\nFabricante: Lightning Power Ltd. \nTamaño: 1\nGrado: C\nClase: Civil\n\nSi buscas un refrigerador que equilibre rendimiento, durabilidad y sigilo, entonces busca el ArcticStorm. Este enfriador de grado medio de Lightning Power Ltd utiliza su tecnologia centenaria para brindar un rendimiento en el que se puede confiar.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 26 CR/s\nConsumo de Energía: 2 PU/s\nHP del Componente: 130\nSignatures:  EM: 750  |  IR: 4,000\nTemp. de Sobrecalentamiento: 600K
