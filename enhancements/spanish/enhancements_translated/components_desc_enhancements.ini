item_DescCOOL_ACOM_S01_IcePlunge=Tipo de artículo: Cooler\nFabricante: ACOM\nTamaño: 1\nGrado: C\nClase: Competicion\n\nCuando estes llevando tu nave al límite durante esa última vuelta frenetica, te alegrara tener IcePlunge de ACOM para mantener todo fresco.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 34 CR/s\nConsumo de Energía: 2 PU/s\nHP del Componente: 69\nSignatures:  EM: 818  |  IR: 5,890\nTemp. de Sobrecalentamiento: 675K
item_DescCOOL_ACOM_S01_QuickCool=Tipo de artículo: Cooler\nFabricante: ACOM\nTamaño: 1\nGrado: D\nClase: Competencia\n\nEl QuikCool proporciona un rendimiento superior a otros refrigeradores de su clase. Este componente de competicion de ACOM sacrifica el sigilo y cierta durabilidad para ser uno de los refrigeradores básicos mas potentes que existen.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 32 CR/s\nConsumo de Energía: 2 PU/s\nHP del Componente: 62\nSignatures:  EM: 818  |  IR: 5,400\nTemp. de Sobrecalentamiento: 614K
item_DescCOOL_ACOM_S02_AbsoluteZero_SCItem=Tipo de artículo: Enfriador\nFabricante: ACOM\nTamaño: 2\nGrado: B \nClase: Competicion\n\nOriginalmente diseñado para corredores, el enfriador AbsoluteZero lleva el rendimiento al limite. Este componente de alta calidad de ACOM cuenta con un nuevo sistema de ciclo de refrigerante para mantener frios los sistemas de su nave sobre todo lo demas.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 46 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 210\nSignatures:  EM: 1,230  |  IR: 7,850\nTemp. de Sobrecalentamiento: 743K
item_DescCOOL_ACOM_S02_IceDive_SCItem=Tipo de artículo: Enfriador\nFabricante: ACOM\nTamaño: 2\nGrado: C \nClase: Competicion\n\nEl IceDive ofrece un rendimiento maximo sobre otros refrigeradores medianos de su grado, aunque tiene el costo de generar firmas IR y EM altas.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 46 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 190\nSignatures:  EM: 1,230  |  IR: 7,850\nTemp. de Sobrecalentamiento: 675K
item_DescCOOL_ACOM_S02_RapidCool_SCItem=Tipo de artículo: Cooler\nFabricante: ACOM\nTamaño: 2\nGrado: D \nClase: Competicion\n\nACOM aporta su filosofia de rendimiento primero a este refrigerador mediano. RapidCool intercambia resistencia y durabilidad caracteristicas por un mejor rendimiento.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 43 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 170\nSignatures:  EM: 1,230  |  IR: 7,200\nTemp. de Sobrecalentamiento: 614K
item_DescCOOL_AEGS_S01_Bracer=Tipo de artículo: Enfriador\nFabricante: Aegis Dynamics \nTamaño: 1\nGrado: C\nClase: Militar\n\nPara aquellos que buscan un enfriador de linea media solido y fiable, no pueden hacerlo mucho mejor que Aegis' Bracer. Este sistema de refigeración de estructura pequeña ofrece un rendimiento solido y durabilidad para mantener su nave funcionando a toda maquína.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 34 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 180\nSignatures:  EM: 1,490  |  IR: 7,260\nTemp. de Sobrecalentamiento: 750K
item_DescCOOL_AEGS_S01_Polar=Tipo de artículo: Cooler\nFabricante: Aegis Dynamics \nTamaño: 1\nGrado: B\nClase: Militar\n\nConstruido según las altas exigencias del servicio militar diario, el refrigerador Polar de Aegis cuenta con un marco reforzado para mayor durabilidad. Puedes estar seguro de que cuando te sumerjas en el fuego del combate, el Polar mantendra tu nave fresca.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 34 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 210\nSignatures:  EM: 1,490  |  IR: 7,260\nTemp. de Sobrecalentamiento: 825K
item_DescCOOL_AEGS_S01_Tundra=Tipo de artículo: Cooler\nFabricante: Aegis Dynamics\nTamaño: 1\nGrado: D\nClase: Militar\n\nConstruida por Aegis teniendo en cuenta el rendimiento militar, el rendimiento fiable de la Tundra la ha convertido en una refrigeradora estandar de la Armada de la UEE.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 32 CR/s\nConsumo de Energía: 3 PU/s\nHP del Componente: 160\nSignatures:  EM: 1,490  |  IR: 6,600\nTemp. de Sobrecalentamiento: 682K
item_DescCOOL_AEGS_S02_Arctic=Tipo de artículo: Enfriador\nFabricante: Aegis Dynamics \nTamaño: 2\nGrado: C\nClase: Militar\n\n Al brindar el tipo de durabilidad que hizo de los productos Aegis un pilar del ejercito, el Arctic es un enfriador economico de especificaciones militares capaz de soportar los rigores del combate sin sacrificar el rendimiento.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 46 CR/s\nConsumo de Energía: 4 PU/s\nHP del Componente: 490\nSignatures:  EM: 1,980  |  IR: 9,440\nTemp. de Sobrecalentamiento: 750K
item_DescCOOL_AEGS_S02_Boreal=Tipo de artículo: Cooler\nFabricante: Aegis Dynamics\nTamaño: 2\nGrado: D\nClase: Militar\n\nDiseñado para dispersar el fragor de la batalla, el refrigerador Boreal de Aegis Dynamics es un estandar militar con capacidad para sobrevivir situaciones estresantes.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 41 CR/s\nConsumo de Energía: 4 PU/s\nHP del Componente: 430\nSignatures:  EM: 1,980  |  IR: 8,580\nTemp. de Sobrecalentamiento: 682K
item_DescCOOL_AEGS_S03_Blizzard_SCItem=Tipo de artículo: Cooler\nFabricante: Aegis Dynamics\nTamaño: 3\nGrado: A \nClase: Militar\n\nLos mecanicos de la Marina trabajaron con los ingenieros de Aegis para garantizar que Blizzard cumpliera con sus necesidades especificas. Cuando llego al mercado comercial, este enfriador de grado militar de primera linea se convirtio en uno de los componentes mas vendidos de Aegis.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 60 CR/s\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,800\nSignatures:  EM: 2,480  |  IR: 12,700\nTemp. de Sobrecalentamiento: 900K
item_DescCOOL_AEGS_S03_Galinstan_SCItem=Tipo de artículo: Cooler\nFabricante: Aegis Dynamics\nTamaño: 3\nGrado: D \nClase: Militar\n\nEl Galinstan es un modelo mas antiguo de refrigerador desarrollado originalmente para la Armada de la UEE. Sus especificaciones no te dejaran boquiabierto, pero sigue siendo un refrigerador grande y de nivel básico solido.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 50 CR/s\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,200\nSignatures:  EM: 2,480  |  IR: 10,600\nTemp. de Sobrecalentamiento: 682K
item_DescCOOL_AEGS_S03_Mercury=Tipo de artículo: Cooler\nFabricante: Aegis Dynamics \nTamaño: 3\nGrado: C\nClase: Militar\n\nEn situaciones de combate, incluso la ventaja mas pequeña puede generar grandes ganancias. Con el sistema de refigeración Mercury de Aegis a bordo, podra calentar su nave durante mas tiempo cuando mas lo necesite.\n\n--- ATRIBUTOS ---\nTasa de Refrigeración: 56 CR/s\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,300\nSignatures:  EM: 2,480  |  IR: 11,600\nTemp. de Sobrecalentamiento: 750K
