item_descQDRV_RSI_S02_Khaos_SCItem=Tipo de artículo: Quantum Drive\nFabricante: RSI\nTamaño: 2\nGrado: C \nClase: Civil\n\nRSI's Khaos ha sido ajustado para proporcionar un rendimiento fiable con una construccion fiable. Una vez que lo tenga atado, apreciara el orden que este salto cuántico aporta al caos de los viajes.\n\n--- ATRIBUTOS ---\nVelocidad QT: 201 Mm/s  |  Preparación (Spool): 6s\nTiempo de Recarga: 16.9s\nCombustible/Gm: 0.0101\nUso de Combustible QT: 16 μ/s\nAcel.:  S1: 3,000,000  |  S2: 13,200,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 3 PU/s\nHP del Componente: 410\nSignatures:  EM: 27,000  |  IR: 0\nTemp. de Sobrecalentamiento: 383K\nDistorsión Máx: 3,500
item_descQDRV_RSI_S03_Metis_SCItem=Tipo de artículo: Quantum Drive\nFabricante: RSI\nTamaño: 3\nGrado: C\nClase: Civil\n\nNo hay margen de error al doblar el espacio y el tiempo para viajar distancias increibles. Asi que confie en RSI, una empresa que ha entregado componentes de calidad al público desde los albores de los vuelos espaciales.\n\n--- ATRIBUTOS ---\nVelocidad QT: 246 Mm/s  |  Preparación (Spool): 7s\nTiempo de Recarga: 9.4s\nCombustible/Gm: 0.0599\nUso de Combustible QT: 26 μ/s\nAcel.:  S1: 1,800,000  |  S2: 11,600,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,100\nSignatures:  EM: 36,000  |  IR: 0\nTemp. de Sobrecalentamiento: 383K\nDistorsión Máx: 5,500
item_descQDRV_RSI_S03_Tyche_SCItem=Tipo de artículo: Unidad cuantica\nFabricante: RSI\nTamaño: 3\nGrado: B\nClase: Civil\n\nLa unidad cuantica Tyche equilibra armoniosamente el rendimiento, la durabilidad y el sigilo para crear un componente completo capaz de manejar con habilidad una variedad de situaciones.\n\n--- ATRIBUTOS ---\nVelocidad QT: 295 Mm/s  |  Preparación (Spool): 7s\nTiempo de Recarga: 9.1s\nCombustible/Gm: 0.0541\nUso de Combustible QT: 21 μ/s\nAcel.:  S1: 2,160,000  |  S2: 13,900,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,300\nSignatures:  EM: 36,000  |  IR: 0\nTemp. de Sobrecalentamiento: 394K\nDistorsión Máx: 6,000
item_descQDRV_TARS_S01_Wayfare_SCItem=Tipo de artículo: Quantum Drive\nFabricante: Tarsus \nTamaño: 1\nGrado: D \nClase: Civil\n\nAcelera a traves del espacio sin gastar mucho dinero. The Warfare es un pequeño motor cuantico de Tarsus que fue diseñado especificamente para ayudar a que los viajes espaciales sean asequibles para las masas.\n\n--- ATRIBUTOS ---\nVelocidad QT: 138 Mm/s  |  Preparación (Spool): 4s\nTiempo de Recarga: 10.0s\nCombustible/Gm: 0.0101\nUso de Combustible QT: 8 μ/s\nAcel.:  S1: 4,170,000  |  S2: 12,500,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 2 PU/s\nHP del Componente: 130\nSignatures:  EM: 15,000  |  IR: 0\nTemp. de Sobrecalentamiento: 372K\nDistorsión Máx: 1,950
item_descQDRV_TARS_S02_Quest_SCItem=Tipo de artículo: Quantum Drive\nFabricante: Tarsus \nTamaño: 2\nGrado: D \nClase: Civil\n\n¿Por que meterse con la perfeccion? Tarsus ha estado fabricando la unidad Quest durante siglos para brindarles a todos un componente asequible de tamaño mediano para llevarlos en sus aventuras.\n\n--- ATRIBUTOS ---\nVelocidad QT: 168 Mm/s  |  Preparación (Spool): 6s\nTiempo de Recarga: 18.0s\nCombustible/Gm: 0.0112\nUso de Combustible QT: 19 μ/s\nAcel.:  S1: 2,500,000  |  S2: 11,000,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 3 PU/s\nHP del Componente: 360\nSignatures:  EM: 22,500  |  IR: 0\nTemp. de Sobrecalentamiento: 372K\nDistorsión Máx: 3,050
item_descQDRV_TARS_S03_Drifter_SCItem=Tipo de artículo: Quantum Drive\nFabricante: Tarsus\nTamaño: 3\nGrado: D\nClase: Civil\n\nAl equilibrar la artesania y el costo, el Drifter ofrece el reconocido rendimiento de Tarsus a un precio asequible.\n\n--- ATRIBUTOS ---\nVelocidad QT: 205 Mm/s  |  Preparación (Spool): 7s\nTiempo de Recarga: 10.0s\nCombustible/Gm: 0.0663\nUso de Combustible QT: 31 μ/s\nAcel.:  S1: 1,500,000  |  S2: 9,680,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 4 PU/s\nHP del Componente: 990\nSignatures:  EM: 30,000  |  IR: 0\nTemp. de Sobrecalentamiento: 372K\nDistorsión Máx: 4,700
item_descQDRV_TARS_S03_Wanderer_SCItem=Tipo de artículo: Unidad cuantica\nFabricante: Tarsus\nTamaño: 3\nGrado: C\nClase: Civil\n\nTarsus diseño y ajusto cuidadosamente el Wanderer para convertirlo en una unidad cuantica solida y versatil, convirtiendolo en uno de los componentes mas populares de su venerada gama.\n\n--- ATRIBUTOS ---\nVelocidad QT: 246 Mm/s  |  Preparación (Spool): 7s\nTiempo de Recarga: 10.0s\nCombustible/Gm: 0.0644\nUso de Combustible QT: 26 μ/s\nAcel.:  S1: 1,800,000  |  S2: 11,600,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,100\nSignatures:  EM: 30,000  |  IR: 0\nTemp. de Sobrecalentamiento: 383K\nDistorsión Máx: 5,500
item_descQDRV_WETK_S02_XL1_SCItem=Tipo de artículo: Quantum Drive\nFabricante: Wei-Tek\nTamaño: 2\nGrado: A \nClase: Militar\n\nWei-Tek puede ser una empresa nueva, pero su linea de componentes de grado militar ya esta ganando notoriedad. El XL-1 es su principal unidad cuantica media que combina de manera experta rendimiento y durabilidad.\n\n--- ATRIBUTOS ---\nVelocidad QT: 324 Mm/s  |  Preparación (Spool): 6s\nTiempo de Recarga: 22.9s\nCombustible/Gm: 0.0240\nUso de Combustible QT: 11 μ/s\nAcel.:  S1: 4,830,000  |  S2: 21,300,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 4 PU/s\nHP del Componente: 840\nSignatures:  EM: 26,300  |  IR: 0\nTemp. de Sobrecalentamiento: 453K\nDistorsión Máx: 7,000
item_descQDRV_WETK_S03_Balandin_SCItem=Tipo de artículo: Quantum Drive\nFabricante: Wei-Tek\nTamaño: 3\nGrado: B\nClase: Militar\n\nWei-Tek construyo el Balandin pensando en el personal militar y de seguridad. Despues de una serie de pruebas realizadas por veteranos, los ingenieros aceleraron los tiempos de carrete y calibracion y al mismo tiempo mejoraron la precision y estabilidad del componente.\n\n--- ATRIBUTOS ---\nVelocidad QT: 339 Mm/s  |  Preparación (Spool): 7s\nTiempo de Recarga: 12.3s\nCombustible/Gm: 0.1352\nUso de Combustible QT: 21 μ/s\nAcel.:  S1: 2,480,000  |  S2: 16,000,000\nTasa de Calibración: 1,000  |  Requerido: 5,000–10,000\nConsumo de Energía: 5 PU/s\nHP del Componente: 2,100\nSignatures:  EM: 33,800  |  IR: 0\nTemp. de Sobrecalentamiento: 438K\nDistorsión Máx: 10,000
