item_DescSHLD_BANU_S01_Suldrath=Tipo de artículo: Generador de escudos\nFabricante: Banu\nTamaño: 1\nGrado: C\nClase: Militar\n\nLa tecnologia clasica de Tevarin se combina con un diseño moderno para el generador de escudo Suldrath. Los Banu combinan maravillosamente las mejores partes de la tecnologia historica del escudo Tevarin con las actualizaciones y comodidades contemporaneas que se esperan de esta generacion de componentes. El resultado es un escudo exclusivo y eficaz creado por xeno, listo para envolver tu nave y protegerte de cualquier peligro que se presente en tu camino.\n\n--- ATRIBUTOS ---\nHP Máx: 2,304  |  Regeneración: 438 HP/s\nRetraso (Derribado): 11.5s  |  Retraso (Dañado): 5.8s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,360  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 180
item_DescSHLD_BANU_S02_Sukoran=Tipo de artículo: Generador de escudos\nFabricante: Banu\nTamaño: 2\nGrado: C\nClase: Militar\n\nEl buen diseño siempre sobrevive con los Banu. El generador de escudo Sukoran actualiza la tecnologia Tevarin de varias maneras interesantes. Su diseño eficiente consume menos energía y, al mismo tiempo, produce de manera efectiva un escudo robusto capaz de absorber la mayoria de los ataques balisticos y de energía hasta que se agota por completo. Sin embargo, esta mayor eficiencia tiene un precio, ya que la tasa de regeneracion mas lenta del Sukoran puede dejar el escudo fuera de linea temporalmente.\n\n--- ATRIBUTOS ---\nHP Máx: 7,680  |  Regeneración: 1,459 HP/s\nRetraso (Derribado): 12.7s  |  Retraso (Dañado): 6.3s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,820  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 500
