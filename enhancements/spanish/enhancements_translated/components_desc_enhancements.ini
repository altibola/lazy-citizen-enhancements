item_Desc_SHLD_ASAS_S01_Mirage=Tipo de artículo: Generador de escudos\nFabricante: Ascension Astro\nTamaño: 1\nGrado: A\nClase: Stealth\n\nAl presumir de una firma tan debil que la mayoria no creera que esta allí, el generador de escudo pequeño de primera linea de Ascension Astro hace honor a su nombre: Mirage. Es el componente definitivo para aquellos que quieren pasar desapercibidos.\n\n--- ATRIBUTOS ---\nHP Máx: 2,244  |  Regeneración: 494 HP/s\nRetraso (Derribado): 5.8s  |  Retraso (Dañado): 2.9s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 250  |  IR: 0\nConsumo de Energía: 1 PU/s\nHP del Componente: 170
item_Desc_SHLD_ASAS_S01_Veil=Tipo de artículo: Generador de escudos\nFabricante: Ascension Astro\nTamaño: 1\nGrado: B\nClase: Stealth\n\nUn sistema de enfriamiento avanzado reduce significativamente el calor producido por el generador de escudo sigiloso Veil. ningún otro componente de su clase se acerca siquiera a rivalizar con su tecnologia de supresion de calor.\n\n--- ATRIBUTOS ---\nHP Máx: 2,244  |  Regeneración: 449 HP/s\nRetraso (Derribado): 6.4s  |  Retraso (Dañado): 3.2s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 250  |  IR: 0\nConsumo de Energía: 1 PU/s\nHP del Componente: 150
item_Desc_SHLD_ASAS_S02_Obscura=Tipo de artículo: Generador de escudos\nFabricante: Ascension Astro\nTamaño: 2\nGrado: C\nClase: Stealth\n\nRespetado por sus menores emisiones, el generador de escudo Obscura utiliza un sistema avanzado de dispersión de firmas para ayudar a darle a su nave una firma mas silenciosa sin dejar de estar protegida.\n\n--- ATRIBUTOS ---\nHP Máx: 7,480  |  Regeneración: 1,421 HP/s\nRetraso (Derribado): 7.7s  |  Retraso (Dañado): 3.9s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 500  |  IR: 0\nConsumo de Energía: 2 PU/s\nHP del Componente: 350
item_Desc_SHLD_ASAS_S02_Sheut=Tipo de artículo: Generador de escudos\nFabricante: Ascension Astro\nTamaño: 2\nGrado: B\nClase: Stealth\n\nEvita que el calor de tu escudo te delate usando un Sheut. Otro excelente generador de escudos sigilosos de Ascension Astro.\n\n--- ATRIBUTOS ---\nHP Máx: 7,480  |  Regeneración: 1,496 HP/s\nRetraso (Derribado): 7.0s  |  Retraso (Dañado): 3.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 500  |  IR: 0\nConsumo de Energía: 2 PU/s\nHP del Componente: 400
item_Desc_SHLD_ASAS_S02_Umbra=Tipo de artículo: Generador de escudos\nFabricante: Ascension Astro\nTamaño: 2\nGrado: A\nClase: Stealth\n\nDeslizate por la oscuridad del espacio como un fantasma con el generador de escudo sigiloso Umbra. Mejor cuando se usa junto con otros componentes de baja firma de Ascension Astro.\n\n--- ATRIBUTOS ---\nHP Máx: 7,480  |  Regeneración: 1,646 HP/s\nRetraso (Derribado): 6.4s  |  Retraso (Dañado): 3.2s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 500  |  IR: 0\nConsumo de Energía: 2 PU/s\nHP del Componente: 460
item_Desc_SHLD_BASL_S01_Guardian=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 1\nGrado: B\nClase: Industrial\n\nActualiza a Guardian para una mayor absorcion de daño balistico, de energía y de distorsion. Haciendo de este generador de escudo industrial uno de los mas duraderos de su clase.\n\n--- ATRIBUTOS ---\nHP Máx: 2,160  |  Regeneración: 432 HP/s\nRetraso (Derribado): 9.1s  |  Retraso (Dañado): 4.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,490  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 210
item_Desc_SHLD_BASL_S01_Palisade=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 1\nGrado: A\nClase: Industrial\n\nNingun otro generador de escudo pequeño puede igualar la durabilidad del Basilisk Palisade. Este componente industrial de primera linea pierde el sigilo por la capacidad de absorber una cantidad de daño inigualable.\n\n--- ATRIBUTOS ---\nHP Máx: 2,160  |  Regeneración: 475 HP/s\nRetraso (Derribado): 8.3s  |  Retraso (Dañado): 4.2s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,490  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 230
item_Desc_SHLD_BASL_S01_Steward=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 1\nGrado: D\nClase: Industrial\n\nEl Steward es el generador de escudo industrial de nivel básico de Basilisk. Su carcasa reforzada añade un nivel extra de durabilidad a un sistema ya robusto, garantizando que su escudo sobresaldra incluso en las condiciones mas duras.\n\n--- ATRIBUTOS ---\nHP Máx: 2,160  |  Regeneración: 389 HP/s\nRetraso (Derribado): 11.0s  |  Retraso (Dañado): 5.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,490  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 160
item_Desc_SHLD_BASL_S02_Armada=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 2\nGrado: D\nClase: Industrial\n\nBasilisk comenzo fabricando revestimientos de casco de vanguardia que eran famosos por ser duraderos y fiables. Hoy continuan ese orgulloso legado con generadores de escudos industriales como la Armada.\n\n--- ATRIBUTOS ---\nHP Máx: 7,200  |  Regeneración: 1,296 HP/s\nRetraso (Derribado): 12.1s  |  Retraso (Dañado): 6.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,980  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 430
item_Desc_SHLD_BASL_S02_Citadel=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 2\nGrado: B\nClase: Industrial\n\nFortifica tu nave con el generador de escudo Citadel de Basilisk. Diseñado para embarcaciones industriales, el componente emite un escudo robusto y fiable.\n\n--- ATRIBUTOS ---\nHP Máx: 7,200  |  Regeneración: 1,440 HP/s\nRetraso (Derribado): 10.0s  |  Retraso (Dañado): 5.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,980  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 570
item_Desc_SHLD_BASL_S02_Rampart=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 2\nGrado: A\nClase: Industrial\n\nBasilisk entiende que escapar no siempre es una opcion. Es por eso que construyeron el generador de escudo industrial Rampart para soportar una cantidad increible de daño antes de que se agote.\n\n--- ATRIBUTOS ---\nHP Máx: 7,200  |  Regeneración: 1,584 HP/s\nRetraso (Derribado): 9.2s  |  Retraso (Dañado): 4.6s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,980  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 640
item_Desc_SHLD_BASL_S03_Barbican=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 3\nGrado: B\nClase: Industrial\n\nBarricana de tu nave contra fuerzas externas con Basilisk Barbican. Originalmente fabricado para grandes embarcaciones industriales, este generador de escudos se ha vuelto muy popular debido a su alta absorcion de daños.\n\n--- ATRIBUTOS ---\nHP Máx: 72,000  |  Regeneración: 14,400 HP/s\nRetraso (Derribado): 11.0s  |  Retraso (Dañado): 5.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 2,480  |  IR: 0\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,600
item_Desc_SHLD_BASL_S03_Parapet=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 3\nGrado: A\nClase: Industrial\n\nComo el pico de los grandes generadores de escudos industriales de Basilisk, es facil ver por que el Parapeto es tan querido. Con una de las mejores proporciones de generacion de escudo a daño de la industria, es difícil degradar el escudo y exponer el casco.\n\n--- ATRIBUTOS ---\nHP Máx: 72,000  |  Regeneración: 15,840 HP/s\nRetraso (Derribado): 10.1s  |  Retraso (Dañado): 5.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 2,480  |  IR: 0\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,800
item_Desc_SHLD_BASL_S03_Ward=Tipo de artículo: Generador de escudos\nFabricante: Basilisk\nTamaño: 3\nGrado: D\nClase: Industrial\n\nThe Ward es el generador de escudos básico de grado industrial de Basilisk para naves grandes. Proporciona un rendimiento y una durabilidad decentes y, al mismo tiempo, mantiene su firma respetable.\n\n--- ATRIBUTOS ---\nHP Máx: 72,000  |  Regeneración: 12,960 HP/s\nRetraso (Derribado): 13.3s  |  Retraso (Dañado): 6.7s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 2,480  |  IR: 0\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,200
item_Desc_SHLD_BEHR_S01_6SA=Tipo de artículo: Generador de escudos\nFabricante: Behring\nTamaño: 1\nGrado: B\nClase: Civil\n\nProporcionando salud de escudo y absorcion de daños por encima del promedio, el 6SA "Arbiter" ha sido un componente fiable durante siglos. Experimente la ventaja de Behring instalando este pequeño generador de escudos hoy.\n\n--- ATRIBUTOS ---\nHP Máx: 3,000  |  Regeneración: 600 HP/s\nRetraso (Derribado): 9.1s  |  Retraso (Dañado): 4.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 900  |  IR: 0\nConsumo de Energía: 2 PU/s\nHP del Componente: 170
item_Desc_SHLD_BEHR_S01_7SA=Tipo de artículo: Generador de escudos\nFabricante: Behring\nTamaño: 1\nGrado: A\nClase: Civil\n\nUn generador de escudos de primera linea que funciona ruidoso y orgulloso. Lo que sacrifica en sigilo lo compensa con creces con una durabilidad suprema y un rendimiento excelente. Entonces, incluso si los enemigos te ven venir, les resultara difícil desactivar el 7SA 'Concord' de Behring.\n\n--- ATRIBUTOS ---\nHP Máx: 3,000  |  Regeneración: 660 HP/s\nRetraso (Derribado): 8.3s  |  Retraso (Dañado): 4.2s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 900  |  IR: 0\nConsumo de Energía: 2 PU/s\nHP del Componente: 200
item_Desc_SHLD_BEHR_S02_6MA=Tipo de artículo: Generador de escudos\nFabricante: Behring\nTamaño: 2\nGrado: B\nClase: Civil\n\nLa reputación acorazada de Behring es casi tan impenetrable como el escudo producido por el 6MA 'Kozane'. Si es lo suficientemente bueno para Behring, tambien lo es para usted.\n\n--- ATRIBUTOS ---\nHP Máx: 10,000  |  Regeneración: 2,000 HP/s\nRetraso (Derribado): 10.0s  |  Retraso (Dañado): 5.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,350  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 470
item_Desc_SHLD_BEHR_S02_7MA=Tipo de artículo: Generador de escudos\nFabricante: Behring\nTamaño: 2\nGrado: A\nClase: Civil\n\nConfie en un componente que ha estado equipado en embarcaciones durante siglos: el 7MA 'Lorica'. Experimente hoy el generador de escudos de última generacion de Behring en su nave.\n\n--- ATRIBUTOS ---\nHP Máx: 10,000  |  Regeneración: 2,200 HP/s\nRetraso (Derribado): 9.2s  |  Retraso (Dañado): 4.6s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,350  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 540
item_Desc_SHLD_BEHR_S03_6CA=Tipo de artículo: Generador de escudos\nFabricante: Behring\nTamaño: 3\nGrado: B\nClase: Civil\n\n“Construido por Behring” es una frase sinonimo de calidad. Es por eso que tantas personas en todo el Imperio confian en su gran generador de escudo 6CA 'Bila' para brindarles un rendimiento solido, una durabilidad impresionante y un grado aceptable de sigilo.\n\n--- ATRIBUTOS ---\nHP Máx: 100,000  |  Regeneración: 20,000 HP/s\nRetraso (Derribado): 11.0s  |  Retraso (Dañado): 5.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,800  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,300
item_Desc_SHLD_BEHR_S03_7CA=Tipo de artículo: Generador de escudos\nFabricante: Behring\nTamaño: 3\nGrado: A\nClase: Civil\n\nLos generadores de escudos de grado comercial no hay nada mejor que el 7CA 'Nargun'. El componente utiliza la tecnologia patentada "Freeze Flow" de Behring para mantener bajo control su firma de calor y al mismo tiempo aumentar tanto su rendimiento general como su durabilidad.\n\n--- ATRIBUTOS ---\nHP Máx: 100,000  |  Regeneración: 22,000 HP/s\nRetraso (Derribado): 10.1s  |  Retraso (Dañado): 5.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,800  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,500
item_Desc_SHLD_GODI_S01_FR66=Tipo de artículo: Generador de escudos\nFabricante: Gorgon Defender Industries\nTamaño: 1\nGrado: A\nClase: Militar\n\nEl FR-66 es uno de los generadores de escudo pequeño mas versatiles actualmente en el mercado. Obtenga proteccion y rendimiento de fuerza militar de Gorgon Defender Industries para garantizar que su nave pueda sobrevivir a cualquier ataque.\n\n--- ATRIBUTOS ---\nHP Máx: 3,168  |  Regeneración: 697 HP/s\nRetraso (Derribado): 9.6s  |  Retraso (Dañado): 4.8s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,240  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 270
item_Desc_SHLD_GODI_S02_CoverAll=Tipo de artículo: Generador de escudos\nFabricante: Gorgon Defender Industries\nTamaño: 2\nGrado: B\nClase: Militar\n\nNo sacrifique el rendimiento por la durabilidad. Obtenga ambos con el generador de escudos CoverAll de Gorgon Defender Industries.\n\n--- ATRIBUTOS ---\nHP Máx: 10,560  |  Regeneración: 2,112 HP/s\nRetraso (Derribado): 11.5s  |  Retraso (Dañado): 5.8s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,650  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 660
item_Desc_SHLD_GODI_S02_FR76=Tipo de artículo: Generador de escudos\nFabricante: Gorgon Defender Industries\nTamaño: 2\nGrado: A\nClase: Militar\n\nRefinado por años de extensas pruebas en el mundo real realizadas por el ejercito, Gorgon Defender Industries FR-76 es el generador de escudos definitivo. Perfecto para todos, desde quienes defienden la linea del frente hasta quienes exploran la frontera.\n\n--- ATRIBUTOS ---\nHP Máx: 10,560  |  Regeneración: 2,323 HP/s\nRetraso (Derribado): 10.5s  |  Retraso (Dañado): 5.3s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,650  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 750
item_Desc_SHLD_GODI_S02_SecureShield=Tipo de artículo: Generador de escudos\nFabricante: Gorgon Defender Industries\nTamaño: 2\nGrado: D\nClase: Militar\n\nObtenga proteccion de grado militar para su nave con SecureShield de Gorgon Defender Industries. Su tecnologia de emisores de vanguardia permite una absorcion de escudo superior en todo el espectro de tipos de daños.\n\n--- ATRIBUTOS ---\nHP Máx: 10,560  |  Regeneración: 1,901 HP/s\nRetraso (Derribado): 13.9s  |  Retraso (Dañado): 7.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,650  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 500
item_Desc_SHLD_GODI_S03_FR86=Tipo de artículo: Generador de escudos\nFabricante: Gorgon Defender Industries\nTamaño: 3\nGrado: A\nClase: Militar\n\nEl FR-86 de Gorgon esta probado, probado y es fiable. ningún otro generador de escudo de gran tamaño ofrece un rendimiento y una durabilidad excepcionales a este nivel.\n\n--- ATRIBUTOS ---\nHP Máx: 105,600  |  Regeneración: 23,232 HP/s\nRetraso (Derribado): 11.6s  |  Retraso (Dañado): 5.8s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 2,060  |  IR: 0\nConsumo de Energía: 5 PU/s\nHP del Componente: 2,100
item_Desc_SHLD_GODI_S03_FullBlock=Tipo de artículo: Generador de escudos\nFabricante: Gorgon Defender Industries\nTamaño: 3\nGrado: B\nClase: Militar\n\nFabricado por antiguos residentes de Caliban, el generador de escudo grande FullBlock de Gorgon ha sido puesto a prueba repetidamente por miembros del ejercito y el público. Eso significa que puedes contar con ello independientemente de lo que te enfrentes.\n\n--- ATRIBUTOS ---\nHP Máx: 105,600  |  Regeneración: 21,120 HP/s\nRetraso (Derribado): 12.7s  |  Retraso (Dañado): 6.3s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 2,060  |  IR: 0\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,800
item_Desc_SHLD_GODI_S03_SecureScreen=Tipo de artículo: Generador de escudos\nFabricante: Gorgon Defender Industries\nTamaño: 3\nGrado: D\nClase: Militar\n\nGorgon Defender Industries aporta poder militar a su gran generador de escudos básico. Con la mejor durabilidad de su clase, SecureScreen fue diseñado para soportar golpes y sobrevivir.\n\n--- ATRIBUTOS ---\nHP Máx: 105,600  |  Regeneración: 19,008 HP/s\nRetraso (Derribado): 15.3s  |  Retraso (Dañado): 7.7s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 2,060  |  IR: 0\nConsumo de Energía: 5 PU/s\nHP del Componente: 1,400
item_Desc_SHLD_SECO_S01_HEX=Tipo de artículo: Generador de escudos\nFabricante: Seal Corporation\nTamaño: 1\nGrado: B\nClase: Civil\n\nPrepara tu nave para cualquier circunstancia instalando un HEX de Seal Corporation. El rendimiento equilibrado y la durabilidad hacen de esta una opción ideal y versatil para aquellos que no saben adonde los llevara su proxima aventura.\n\n--- ATRIBUTOS ---\nHP Máx: 2,160  |  Regeneración: 432 HP/s\nRetraso (Derribado): 9.1s  |  Retraso (Dañado): 4.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 750  |  IR: 0\nConsumo de Energía: 2 PU/s\nHP del Componente: 170
item_Desc_SHLD_SECO_S02_BLOC=Tipo de artículo: Generador de escudos\nFabricante: Seal Corporation\nTamaño: 2\nGrado: B\nClase: Civil\n\nEl generador de escudo BLOC de Seal Corporation fue el primero en utilizar el revolucionario semiconductor de núcleo cuantico de la compañia para reducir el consumo de energía del componente sin comprometer el rendimiento.\n\n--- ATRIBUTOS ---\nHP Máx: 7,200  |  Regeneración: 1,440 HP/s\nRetraso (Derribado): 10.0s  |  Retraso (Dañado): 5.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,130  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 470
item_Desc_SHLD_SECO_S02_RPEL=Tipo de artículo: Generador de escudos\nFabricante: Seal Corporation\nTamaño: 2\nGrado: D\nClase: Civil\n\nVea por que mas personas confian en Seal Corporation para proteger su nave que en cualquier otra empresa. Con el generador de escudo RPEL puedes estar seguro de que estaras protegido del peligro.\n\n--- ATRIBUTOS ---\nHP Máx: 7,200  |  Regeneración: 1,296 HP/s\nRetraso (Derribado): 12.1s  |  Retraso (Dañado): 6.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,130  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 360
item_Desc_SHLD_SECO_S03_ARMOR=Tipo de artículo: Generador de escudos\nFabricante: Seal Corporation\nTamaño: 3\nGrado: B\nClase: Civil\n\nARMOR es el generador de escudos de primera linea de Seal Corps. fue utilizado ampliamente por el ejercito antes de que su tecnologia de escudo fuera desclasificada para uso civil.\n\n--- ATRIBUTOS ---\nHP Máx: 72,000  |  Regeneración: 14,400 HP/s\nRetraso (Derribado): 11.0s  |  Retraso (Dañado): 5.5s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,500  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,300
item_Desc_SHLD_SECO_S03_GUARD=Tipo de artículo: Generador de escudos\nFabricante: Seal Corporation\nTamaño: 3\nGrado: C\nClase: Civil\n\nNo tengas miedo de enfrentarte a lo desconocido con Seal Corp's GUARD. Este generador de escudo equilibra el rendimiento, la durabilidad y el sigilo para permitir al usuario utilizar el escudo de la forma que mas le convenga.\n\n--- ATRIBUTOS ---\nHP Máx: 72,000  |  Regeneración: 13,680 HP/s\nRetraso (Derribado): 12.1s  |  Retraso (Dañado): 6.0s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,500  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 1,100
item_Desc_SHLD_SECO_S03_HAVEN=Tipo de artículo: Generador de escudos\nFabricante: Seal Corporation\nTamaño: 3\nGrado: D\nClase: Civil\n\nEl HAVEN es un admirado generador de escudos para naves grandes. El diseño simple y limpio de Seal Corp hace que la reparación del componente sea una tarea facil y asequible, y no ha hecho mas que aumentar su popularidad a lo largo de los años.\n\n--- ATRIBUTOS ---\nHP Máx: 72,000  |  Regeneración: 12,960 HP/s\nRetraso (Derribado): 13.3s  |  Retraso (Dañado): 6.7s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,500  |  IR: 0\nConsumo de Energía: 4 PU/s\nHP del Componente: 990
item_Desc_SHLD_YORM_S01_Jaghte=Tipo de artículo: Generador de escudos\nFabricante: Yorm\nTamaño: 1\nGrado: B\nClase: Competicion\n\nConstruido teniendo en cuenta el rendimiento, el generador de escudos de competicion Jaghte de Yorm prioriza la salud y la tasa de generacion del escudo sobre la fuerza y el sigilo.\n\n--- ATRIBUTOS ---\nHP Máx: 1,920  |  Regeneración: 384 HP/s\nRetraso (Derribado): 7.7s  |  Retraso (Dañado): 3.9s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 818  |  IR: 0\nConsumo de Energía: 2 PU/s\nHP del Componente: 91
item_Desc_SHLD_YORM_S02_Bamoty=Tipo de artículo: Generador de escudos\nFabricante: Yorm\nTamaño: 2\nGrado: D\nClase: Competicion\n\nEl Bamoty es la version de Yorm de un generador de escudos de estilo comercial. Este componente de tamaño mediano le ha ganado a la compañia una base de seguidores mas amplia porque equilibra de manera experta rendimiento, durabilidad y sigilo.\n\n--- ATRIBUTOS ---\nHP Máx: 6,400  |  Regeneración: 1,152 HP/s\nRetraso (Derribado): 10.3s  |  Retraso (Dañado): 5.1s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,230  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 200
item_Desc_SHLD_YORM_S02_Haltur=Tipo de artículo: Generador de escudos\nFabricante: Yorm\nTamaño: 2\nGrado: B\nClase: Competicion\n\nLa fuerte salud del escudo y una tasa de generacion excepcional le dan al Haltur la mejor clasificacion de rendimiento de cualquier escudo de su clase. Amado por los corredores y aquellos que prefieren navegar lejos del peligro en lugar de absorberlo.\n\n--- ATRIBUTOS ---\nHP Máx: 6,400  |  Regeneración: 1,280 HP/s\nRetraso (Derribado): 8.5s  |  Retraso (Dañado): 4.2s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,230  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 250
item_Desc_SHLD_YORM_S02_Trenta=Tipo de artículo: Generador de escudos\nFabricante: Yorm\nTamaño: 2\nGrado: C\nClase: Competicion\n\nUna opción ideal para corredores que buscan un generador de escudo que proporcione un rendimiento y durabilidad de escudo superiores al promedio. Como beneficio adicional, la carcasa del Trenta esta construida con una aleacion de magnesio que hace que el componente sea resistente pero liviano.\n\n--- ATRIBUTOS ---\nHP Máx: 6,400  |  Regeneración: 1,216 HP/s\nRetraso (Derribado): 9.3s  |  Retraso (Dañado): 4.7s\nResist.:  Phys: +0% – +25%\nSignatures:  EM: 1,230  |  IR: 0\nConsumo de Energía: 3 PU/s\nHP del Componente: 220
