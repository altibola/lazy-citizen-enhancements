items_commodities_goldenmedmon_desc=NDR: 39\nHEI: 19\nEfectos: Energizante, Hidratante\n\nCultivados en climas templados en el arbol de ebano Maru, los Medmons dorados se dejan caer del arbol cuando están maduros y recolectados. El fruto en esa etapa es extremadamente firme y astringente. Solo se vuelven comestibles despues de haber sido "bleteados" o ablandados mediante la maduración del etileno.\n\n<EM3>DATOS DEL PLANO</EM3>\n- Electron Ammo\n- Fresnel Energy LMG\n- Pulse Laser Pistol, Pulse Pistol\n- Parallax Energy Assault Rifle\n- Prism Laser Shotgun\n- Quartz Energy SMG\n- Zenith Laser Sniper Rifle\n- vehiclegear/radar: 11 objetos\n- vehiclegear/shield: 11 objetos\n- NDB-26 Repeater, NDB-28 Repeater, NDB-30 Repeater\n- Cannons (4 tipos)\n- Scatters (4 tipos)
