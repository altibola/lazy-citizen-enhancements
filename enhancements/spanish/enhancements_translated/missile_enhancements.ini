item_DescHRST_S1_RPOD_6x_S1=Tipo de artículo: Rocket Pod\nFabricante: Hurston Dynamics\nTamaño: 1\nCohetes: 6xS1\n\nLa capsula de cohetes Jericho de Hurston Dynamics es compatible con un punto fijo de cualquier tamaño y es capaz de transportar seis cohetes S1.\n\n--- ATRIBUTOS ---\nHP del Componente: 500
item_DescHRST_S2_RPOD_12x_S1=Tipo de artículo: Rocket Pod\nFabricante: Hurston Dynamics\nTamaño: 2\nCohetes: 12xS1\n\nLa capsula de cohetes Jericho X de Hurston Dynamics es compatible con dos puntos de anclaje de cualquier tamaño y es capaz de transportar doce cohetes S1.\n\n--- ATRIBUTOS ---\nHP del Componente: 750
item_DescHRST_S3_RPOD_18x_S1=Tipo de artículo: Rocket Pod\nFabricante: Hurston Dynamics\nTamaño: 3\nCohetes: 18xS1\n\nLa capsula de cohetes Jericho XL de Hurston Dynamics es compatible con tres puntos de anclaje de cualquier tamaño y es capaz de transportar dieciocho cohetes S1.\n\n--- ATRIBUTOS ---\nHP del Componente: 1,000
item_DescMISL_S01_CS_FSKI_Spark=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Seccion transversal\nTamaño: 1\n\nAquellos que creen que el tamaño no importa harian bien en mantenerse alejados del Firestorm Kinetics Spark. Al utilizar objetivos de seccion transversal, este misil de proximidad liviano tiene un impacto considerable.\n\n--- ATRIBUTOS ---\nVida Útil: 15.00s\nAlcance de Fijación: 1.7 km – 10.0 km\nTiempo de Armado: 0.8s  |  Dist. de Armado: 1.1 km  |  Detonación Mín: 5 m\nDaño: 800.0 (Phys)\nRadio de Explosión: 2 m\nHP del Componente: 25
item_DescMISL_S01_EM_BEHR_Pioneer=Fabricante: Behring\nSeñal de seguimiento: Electromagnetica\nTamaño: 1\n\nBehring se enorgullece de su confiabilidad y el Pioneer no es una excepcion. El sistema de seguimiento Oracle EM actualizado ha demostrado su eficacia una y otra vez en numerosos informes de pruebas de consumidores contra misiles de proximidad de clasificacion similar.\n\n--- ATRIBUTOS ---\nVida Útil: 15.00s\nAlcance de Fijación: 1.7 km – 10.0 km\nTiempo de Armado: 1.3s  |  Dist. de Armado: 1.8 km  |  Detonación Mín: 5 m\nDaño: 750.0 (Phys)\nRadio de Explosión: 14 m\nHP del Componente: 25
item_DescMISL_S01_EM_THCN_TaskForce=Fabricante: Thermyte Concern\nSeñal de seguimiento: Electromagnetica\nTamaño: 1\n\nAventurandose en el mercado de armas, Thermyte Concern ha reunido su amplio conocimiento sobre explosivos de demolicion para crear el TaskForce. Un misil de ataque de seguimiento EM liviano con un sistema de propulsión de primer nivel proporciona una combinación eficiente de velocidad y potencia de fuego para establecer el dominio en el campo de batalla.\n\n--- ATRIBUTOS ---\nVida Útil: 15.00s\nAlcance de Fijación: 1.7 km – 10.0 km\nTiempo de Armado: 1.0s  |  Dist. de Armado: 1.4 km  |  Detonación Mín: 5 m\nDaño: 700.0 (Phys)\nRadio de Explosión: 14 m\nHP del Componente: 25
item_DescMISL_S01_IR_BEHR_Marksman=Fabricante: Behring\nSeñal de seguimiento: Infrarrojo\nTamaño: 1\n\nLa serie Marksman de misiles de proximidad de Behring se ha ganado tanta reputación por su capacidad de rastrear una amplia gama de firmas de calor como por su daño de proximidad con efecto de area.\n\n--- ATRIBUTOS ---\nVida Útil: 15.00s\nAlcance de Fijación: 1.7 km – 10.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 2.1 km  |  Detonación Mín: 5 m\nDaño: 650.0 (Phys)\nRadio de Explosión: 2 m\nHP del Componente: 25
item_DescMISL_S01_IR_VNCL_Arrow=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojo\nTamaño: 1\n\nComunmente conocido por su designacion militar, el Arrow es un pequeño misil de ataque infrarrojo que se ha convertido en un pilar de la armeria Vanduul.\n\n--- ATRIBUTOS ---\nVida Útil: 15.00s\nAlcance de Fijación: 1.7 km – 10.0 km\nTiempo de Armado: 1.0s  |  Dist. de Armado: 1.4 km  |  Detonación Mín: 5 m\nDaño: 600.0 (Phys)\nRadio de Explosión: 3 m\nHP del Componente: 25
item_DescMISL_S02_CS_FSKI_Tempest=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Seccion transversal\nTamaño: 2\n\nEl Tempest fue diseñado con nada mas que la aniquilacion en mente. Utilizando la tecnologia de focalizacion de FireStorm Kinetics, este misil de proximidad se fija en la seccion transversal de un objetivo para llevar los conflictos a una conclusion rapida.\n\n--- ATRIBUTOS ---\nVida Útil: 30.00s\nAlcance de Fijación: 1.8 km – 10.0 km\nTiempo de Armado: 1.2s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 17,544.6 (Phys: 3508.9 / Energy: 14035.7)\nRadio de Explosión: 3 m\nHP del Componente: 25
item_DescMISL_S02_CS_THCN_StrikeForce=Fabricante: Thermyte Concern\nSeñal de seguimiento: Seccion transversal\nTamaño: 2\n\nEl StrikeForce es la última culminacion de la  expansión de Thermyte Concern en la industria de misiles, mostrando notables mejoras en el diseño y la orientacion transversal.\n\n--- ATRIBUTOS ---\nVida Útil: 30.00s\nAlcance de Fijación: 1.8 km – 10.0 km\nTiempo de Armado: 1.2s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 1,600.0 (Phys)\nRadio de Explosión: 2 m\nHP del Componente: 25
item_DescMISL_S02_EM_TALN_Dominator=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 2\n\nDiseñado para rastrear la firma electromagnetica de un oponente, el misil de ataque Dominator es un paquete de artilleria de precision diseñado para establecer el dominio tactico en el campo de batalla.\n\n--- ATRIBUTOS ---\nVida Útil: 30.00s\nAlcance de Fijación: 1.8 km – 10.0 km\nTiempo de Armado: 1.2s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 1,500.0 (Phys)\nRadio de Explosión: 4 m\nHP del Componente: 25
item_DescMISL_S02_IR_FSKI_Ignite=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Infrarrojo\nTamaño: 2\n\nEl Ignite es la principal marca de misiles de ataque con busqueda de calor de Firestorm, que es la definicion de Fuego y olvido. Simplemente dejalo volar y disfruta del espectaculo.\n\n--- ATRIBUTOS ---\nVida Útil: 30.00s\nAlcance de Fijación: 1.8 km – 10.0 km\nTiempo de Armado: 1.2s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 1,440.0 (Phys)\nRadio de Explosión: 3 m\nHP del Componente: 25
item_DescMISL_S02_IR_NOVP_Rattler=Fabricante: Nova Pyrotechnica\nSeñal de seguimiento: Infrarrojo\nTamaño: 2\n\nEl Rattler es un misil de racimo rentable que sin duda atraera a una amplia variedad de pilotos. Cuando se dispara, el Rattler rastreara la firma IR del oponente y creara un bombardeo de apertura que debilita la armadura o los escudos, dejando al objetivo vulnerable a la carga util completa que sigue.\n\n--- ATRIBUTOS ---\nVida Útil: 10.00s\nAlcance de Fijación: 1.8 km – 5.0 km\nTiempo de Armado: 1.2s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 1,370.0 (Phys)\nRadio de Explosión: 4 m\nHP del Componente: 25
item_DescMISL_S02_IR_VNCL_Bullet=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojos\nTamaño: 2\n\nLos pilotos de la Armada han desarrollado un saludable respeto por este misil de ataque Vanduul con objetivo infrarrojo, formalmente designado Bullet.\n\n--- ATRIBUTOS ---\nVida Útil: 30.00s\nAlcance de Fijación: 1.8 km – 10.0 km\nTiempo de Armado: 1.2s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 1,300.0 (Phys)\nRadio de Explosión: 4 m\nHP del Componente: 25
item_DescMISL_S03_CS_FSKI_Arrester=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Seccion transversal\nTamaño: 3\n\nUtilizando la orientacion de seccion transversal para cazar a su presa, el misil de proximidad Firestorm Arrester elimina rapidamente a los enemigos atrapados en el punto de mira.\n\n--- ATRIBUTOS ---\nVida Útil: 35.00s\nAlcance de Fijación: 1.9 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 3,200.0 (Phys)\nRadio de Explosión: 5 m\nHP del Componente: 25
item_DescMISL_S03_EM_FSKI_Thunderbolt=Fabricante: Firestorm Kinetics\nSeñal de seguimiento: Electromagnetica \nTamaño: 3\n\nGracias a la estructura agil del Firestorm Thunderbolt y al sistema de orientacion EM, este misil de proximidad es una opción solida para una amplia variedad de escenarios de combate.\n\n--- ATRIBUTOS ---\nVida Útil: 35.00s\nAlcance de Fijación: 1.9 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 2,900.0 (Phys)\nRadio de Explosión: 5 m\nHP del Componente: 25
item_DescMISL_S03_IR_NOVP_Viper=Fabricante: Nova Pyrotechnica\nSeñal de seguimiento: Infrarrojo\nTamaño: 3\n\nNova ha trabajado duro para garantizar que su misil de ataque Viper con seguimiento por infrarrojos haga honor a su nombre al realizar ataques agiles y letales contra objetivos hostiles.\n\n--- ATRIBUTOS ---\nVida Útil: 35.00s\nAlcance de Fijación: 1.9 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 2,650.0 (Phys)\nRadio de Explosión: 6 m\nHP del Componente: 25
item_DescMISL_S03_IR_VNCL_Chaos=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojos\nTamaño: 3\n\n Los instructores de vuelo navales a menudo incluyen el misil de ataque Caos con busqueda de calor en las simulaciones de ataque Vanduul, citando que su velocidad y fuerza brindan a los nuevos reclutas el respeto adecuado por el enemigo al que se enfrentaran.\n\n--- ATRIBUTOS ---\nVida Útil: 35.00s\nAlcance de Fijación: 1.9 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.3 km  |  Detonación Mín: 5 m\nDaño: 2,500.0 (Phys)\nRadio de Explosión: 6 m\nHP del Componente: 25
item_DescMISL_S04_CS_TALN_Assailant=Fabricante: Talon\nSeñal de seguimiento: Seccion transversal\nTamaño: 4\n\nEl misil Assailant de Talon es una solucion de arma perfecta para ataques de precision contra oponentes motivados.\n\n--- ATRIBUTOS ---\nVida Útil: 45.00s\nAlcance de Fijación: 2.0 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.0 km  |  Detonación Mín: 5 m\nDaño: 6,500.0 (Phys)\nRadio de Explosión: 9 m\nHP del Componente: 25
item_DescMISL_S04_EM_TALN_Raptor=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 4\n\nUtilizando seguimiento electromagnetico avanzado y vuelo de precision equilibrado, el misil de ataque Talon Raptor es una feroz adicion al arsenal de cualquier nave.\n\n--- ATRIBUTOS ---\nVida Útil: 45.00s\nAlcance de Fijación: 2.0 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.0 km  |  Detonación Mín: 5 m\nDaño: 5,750.0 (Phys)\nRadio de Explosión: 9 m\nHP del Componente: 25
item_DescMISL_S04_IR_BEHR_Pathfinder=Fabricante: Behring\nSeñal de seguimiento: Infrarrojo\nTamaño: 4\n\nEl misil de proximidad Pathfinder ha sido un miembro constante del ya robusto arsenal de Behring gracias a su probado sistema de propulsión y su conjunto de guia de busqueda de calor.\n\n--- ATRIBUTOS ---\nVida Útil: 45.00s\nAlcance de Fijación: 2.0 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.0 km  |  Detonación Mín: 5 m\nDaño: 5,300.0 (Phys)\nRadio de Explosión: 7 m\nHP del Componente: 25
item_DescMISL_S04_IR_VNCL_Dragon=Fabricante: Vanduul\nSeñal de seguimiento: Infrarrojo\nTamaño: 4\n\nDesignado como Dragon, este misil de ataque de seguimiento infrarrojo Vanduul tiene una reputación temible que se ha ganado el numero de naves navales destruidos atribuido a su poder destructivo.\n\n--- ATRIBUTOS ---\nVida Útil: 45.00s\nAlcance de Fijación: 2.0 km – 25.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 1.0 km  |  Detonación Mín: 5 m\nDaño: 5,000.0 (Phys)\nRadio de Explosión: 8 m\nHP del Componente: 25
item_DescMISL_S05_CS_TALN_Stalker=Fabricante: Talon\nSeñal de seguimiento: Seccion transversal\nTamaño: 5\n\nCon seguimiento de seccion transversal dedicado, el Talon Stalker ha resistido a lo largo de los años como un torpedo de ataque de precision con maxima potencia de frenado.\n\n--- ATRIBUTOS ---\nVida Útil: 60.00s\nAlcance de Fijación: 2.0 km – 30.0 km\nTiempo de Armado: 2.0s  |  Dist. de Armado: 1.1 km  |  Detonación Mín: 5 m\nDaño: 18,000.0 (Phys)\nRadio de Explosión: 11 m\nHP del Componente: 50
item_DescMISL_S05_EM_TALN_Reaper=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 5\n\nEl torpedo de ataque Reaper presenta una favorable relacion rendimiento-gasto destructivo y un conjunto de seguimiento Talon EM probado.\n\n--- ATRIBUTOS ---\nVida Útil: 60.00s\nAlcance de Fijación: 2.0 km – 30.0 km\nTiempo de Armado: 2.0s  |  Dist. de Armado: 1.1 km  |  Detonación Mín: 5 m\nDaño: 15,500.0 (Phys)\nRadio de Explosión: 10 m\nHP del Componente: 50
item_DescMISL_S05_EM_TALN_Scimitar=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 5\n\nEl misil Scimitar rastrea objetivos a traves de su firma EM para entregar una carga util devastadora de tamaño cinco.\n\n--- ATRIBUTOS ---\nVida Útil: 60.00s\nAlcance de Fijación: 50 m – 30.0 km\nTiempo de Armado: 1.5s  |  Dist. de Armado: 840 m  |  Detonación Mín: 5 m\nDaño: 14,500.0 (Phys)\nRadio de Explosión: 10 m\nHP del Componente: 50
item_DescMISL_S05_IR_TALN_Valkyrie=Fabricante: Talon\nSeñal de seguimiento: Infrarrojo\nTamaño: 5\n\nEl equipo de diseño de torpedos de Talon hizo todo lo posible para su ultimo torpedo de ataque Valkyrie al crear una solucion de empuje de varios niveles con capacidades de seguimiento infrarrojo de última generacion.\n\n--- ATRIBUTOS ---\nVida Útil: 60.00s\nAlcance de Fijación: 2.0 km – 30.0 km\nTiempo de Armado: 2.0s  |  Dist. de Armado: 1.1 km  |  Detonación Mín: 5 m\nDaño: 12,000.0 (Phys)\nRadio de Explosión: 10 m\nHP del Componente: 50
item_DescMISL_S07_IR_TALN_Hellion=Fabricante: Talon\nSeñal de seguimiento: Infrarrojos\nTamaño: 7\n\nCon una carga util considerable y un conjunto avanzado de sensores de busqueda de calor, el misil Hellion de Talon puede ser efectivo contra agresores de todos los tamaños.\n\n--- ATRIBUTOS ---\nVida Útil: 80.00s\nAlcance de Fijación: 50 m – 35.0 km\nTiempo de Armado: 3.0s  |  Dist. de Armado: 1.5 km  |  Detonación Mín: 5 m\nDaño: 90,000.0 (Phys)\nRadio de Explosión: 16 m\nHP del Componente: 200
item_DescMISL_S09_CS_TALN_Argos=Fabricante: Talon\nSeñal de seguimiento: Seccion transversal\nTamaño: 9\n\nEl torpedo de ataque Talon Argos presenta un diseño clasico y sencillo que se basa en estandares de fabricacion exigentes y un sistema de orientacion de seccion transversal clasico.\n\n--- ATRIBUTOS ---\nVida Útil: 30.00s\nTiempo de Armado: 1.5s  |  Dist. de Armado: 675 m  |  Detonación Mín: 5 m\nDaño: 421,685.9 (Phys: 26065.5 / Energy: 395620.4)\nRadio de Explosión: 5 m\nHP del Componente: 1,000
