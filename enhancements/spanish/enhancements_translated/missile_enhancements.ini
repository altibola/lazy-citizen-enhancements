item_DescBOMB_S03_FSKI_Thunderball=Fabricante: FireStorm Kinetics\nTipo de artículo: Bomba explosiva\nTamaño: 3\n\nApunta a las fuerzas terrestrés desde una distancia segura arriba con el Thunderball. A pesar de su pequeño tamaño, estas bombas S3 contienen una poderosa carga util, lo que permite a los usuarios desplegar multiples bombas para abrumar a un objetivo estaciónario o lanzarlas a intervalos para alcanzar objetivos en movimiento. El Thunderball utiliza las aletas Atmo-Xact patentadas de FireStorm Kinetics que se despliegan una vez que se caen para proporcionar orientacion adicional en el camino hacia el objetivo.\n\n--- ATRIBUTOS ---\nDaño: 27,000.0 (Phys: 12500.0 / Energy: 14500.0)\nRadio de Explosión: 40 m\nHP del Componente: 1,000
item_DescBOMB_S05_FSKI_Stormburst=Fabricante: FireStorm Kinetics\nTipo de artículo: Bomba explosiva\nTamaño: 5\n\nCausa estragos en las fuerzas terrestrés desde los cielos con Stormburst. Diseñadas por FireStorm Kinetics para maximizar el impacto destructivo en un tamaño mas moderado, estas bombas S5 cuentan con una artilleria compuesta mixta para diezmar objetivos blindados. El Stormburst tambien utiliza las aletas Atmo-Xact patentadas de FireStorm Kinetics para garantizar que la carga util alcance al objetivo.\n\n--- ATRIBUTOS ---\nDaño: 46,702.0 (Phys: 22346.0 / Energy: 24356.0)\nRadio de Explosión: 100 m\nHP del Componente: 1,000
item_DescBOMB_S10_FSKI_Colossus=Fabricante: FireStorm Kinetics\nTipo de artículo: Bomba explosiva\nTamaño: 10\n\nLos enemigos a continuacion no tendran ninguna posibilidad contra un Coloso. FireStorm Kinetics diseño esta enorme bomba S10 para devastar objetivos terrestres, ya sean vehículos o estructuras. Diseñado para ser lanzado desde gran altura, el Colossus cuenta con aletas Atmo-Xact patentadas que se despliegan para proporcionar orientacion adicional en el camino hacia el objetivo.\n\n--- ATRIBUTOS ---\nDaño: 568,297.0 (Phys: 45676.6 / Energy: 522620.4)\nRadio de Explosión: 250 m\nHP del Componente: 1,000
item_DescFSKI_S1_RPOD_3x_S3=Tipo de artículo: Rocket Pod\nFabricante: Firestorm Kinetics\nTamaño: 1\nCohetes: 3xS3\n\nLa capsula de cohetes Yebira I es el sistema perfecto para el despliegue eficiente de artilleria S3. Fabricado por Firestorm Kinetics, este módulo de cohetes lleva tres cohetes y se fija a un punto fijo de cualquier tamaño.\n\n--- ATRIBUTOS ---\nHP del Componente: 500
item_DescFSKI_S2_RPOD_6x_S3=Tipo de artículo: Rocket Pod\nFabricante: Firestorm Kinetics\nTamaño: 2\nCohetes: 6xS3\n\nLa capsula de cohetes Yebira II es el sistema perfecto para el despliegue eficiente de artilleria S3. Fabricado por Firestorm Kinetics, este módulo de cohetes lleva seis cohetes y se conecta a dos puntos de cualquier tamaño.\n\n--- ATRIBUTOS ---\nHP del Componente: 750
