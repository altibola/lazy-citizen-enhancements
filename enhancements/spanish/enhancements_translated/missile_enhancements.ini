item_DescNOVP_Rocket_Venom_S1_Strike_TL_IR=Cohete venenoso Nova Pyrotechnica\n\n--- ATRIBUTOS ---\nVida Útil: 30.00s\nTiempo de Armado: 1.5s  |  Dist. de Armado: 2.2 km  |  Detonación Mín: 5 m\nDaño: 300.0 (Phys: 100.0 / Energy: 200.0)\nRadio de Explosión: 15 m\nHP del Componente: 1,000
item_DescTHCN_S1_RPOD_4x_S2=Tipo de artículo: Rocket Pod\nFabricante: Thermyte Concern\nTamaño: 1\nCohetes: 4xS2\n\nLa capsula de cohetes Liberator de Thermyte Concern lleva cuatro cohetes S2 y se puede conectar a un punto fijo de cualquier tamaño.\n\n--- ATRIBUTOS ---\nHP del Componente: 500
item_DescTHCN_S2_RPOD_8x_S2=Tipo de artículo: Rocket Pod\nFabricante: Thermyte Concern\nTamaño: 2\nCohetes: 8xS2\n\nLa capsula de cohetes Liberator Prime de Thermyte Concern lleva ocho cohetes S2 y se puede conectar a dos puntos de cualquier tamaño.\n\n--- ATRIBUTOS ---\nHP del Componente: 750
item_DescTHCN_S3_RPOD_12x_S2=Tipo de artículo: Rocket Pod\nFabricante: Thermyte Concern\nTamaño: 3\nCohetes: 12xS2\n\nLa capsula de cohetes Liberator Ultra de Thermyte Concern lleva doce cohetes S2 y se puede conectar a tres puntos duros de cualquier tamaño.\n\n--- ATRIBUTOS ---\nHP del Componente: 1,000
