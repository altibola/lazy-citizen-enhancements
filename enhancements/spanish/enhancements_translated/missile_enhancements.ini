item_DescMISL_S09_EM_TALN_Seeker=Fabricante: Talon\nSeñal de seguimiento: Electromagnetica\nTamaño: 9\n\nEl torpedo Seeker de Talon es un torpedo de precision con orientacion EM capaz de entregar una carga util masiva de forma rapida y precisa.\n\n--- ATRIBUTOS ---\nVida Útil: 90.00s\nAlcance de Fijación: 2.5 km – 40.0 km\nTiempo de Armado: 4.0s  |  Dist. de Armado: 2.1 km  |  Detonación Mín: 1,500 m\nDaño: 350,000.0 (Phys)\nRadio de Explosión: 15 m\nHP del Componente: 667
item_DescMISL_S09_IR_TALN_Typhoon=Fabricante: Talon\nSeñal de seguimiento: Infrarrojos\nTamaño: 9\n\nDiseñado por Talon, el torpedo de ataque con busqueda de calor Typhoon ofrece una carga util pesada que seguramente servira como disuasivo de futuras acciones hostiles.\n\n--- ATRIBUTOS ---\nVida Útil: 90.00s\nAlcance de Fijación: 2.5 km – 40.0 km\nTiempo de Armado: 1.0s  |  Dist. de Armado: 514 m  |  Detonación Mín: 1,500 m\nDaño: 300,000.0 (Phys)\nRadio de Explosión: 16 m\nHP del Componente: 667
