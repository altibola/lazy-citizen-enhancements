items_commodities_beradom=Beradom <EM4>[CF|Collection]</EM4>
items_commodities_beradom_desc=Formata quando la linfa della abete beraber viene cristallata durante gli incendi boschivi, questa "pietra gemella" trasparente è spesso lucida e utilizzata nei gioielli. Mentre può essere fabbricato in crescita degli alberi e quindi facendo un'ustione controllata, l'investimento temporale per gli alberi per raggiungere la maturità corretta rende ancora questo una merce rara.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Karna Rifle\n- vehiclegear/shield: 27 items
