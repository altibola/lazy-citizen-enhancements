items_commodities_carinite=Carinite <EM4>[CF|Collection]</EM4>
items_commodities_carinite_desc=Un minerale raro perché l'estrema pressione necessaria per la sua formazione è molto rara, è molto richiesta grazie al suo uso nei processori informatici avanzati e in altre elettronica all'avanguardia.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Parallax Energy Assault Rifle\n- Quartz Energy SMG
