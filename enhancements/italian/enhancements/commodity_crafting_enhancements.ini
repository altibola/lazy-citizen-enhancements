items_commodities_feynmaline=Feynmaline <EM4>[CF|Collection]</EM4>
items_commodities_feynmaline_desc=La struttura cristallina paramorfica di questo minerale è estremamente volatile. Quando viene introdotta un'energia extra, come è tipico con il mining moderno, il minerale si degraderà spesso in janalite più stabilmente strutturata. Questa instabilità rende Feynamline molto pericolosa da acquisire, ma anche estremamente preziosa come precursore antimateriale industriale se può essere raccolto adeguatamente.\n\n<EM3>BLUEPRINT DATA</EM3>\n- vehiclegear/shield: 9 items
