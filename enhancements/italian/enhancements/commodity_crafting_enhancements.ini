items_commodities_glacosite=Glacosite <EM4>[CF|Collection]</EM4>
items_commodities_glacosite_desc=Mentre si formano i ghiacciai, il contenuto minerale più pesante affonda nel tempo e viene quindi schiacciato dal peso sopra mentre il ghiaccio deforma e scorre. Quando il ghiacciaio si ritira, i depositi di glacosite vengono lasciati indietro. Di colore bianco e blu, i cristalli si formano in lunghi ciocche lucenti che quasi hanno un aspetto simile a un cotone. Glacosite ha trovato un uso commerciale specializzato poiché è un isolante estremamente leggero e durevole.\n\n<EM3>BLUEPRINT DATA</EM3>\n- vehiclegear/shield: 24 items
