items_commodities_goldenmedmon_desc=NDR: 39\nHEI: 19\nEffetti: energizzante, idratante\n\nColtivati ??in climi temperati sull'albero di ebano Maru, i Golden Medmon vengono lasciati cadere dall'albero quando sono maturi e raccolti. Il frutto a questo stadio è estremamente sodo e astringente. Diventano commestibili solo dopo essere stati "sbiancati" o ammorbiditi tramite maturazione con etilene.\n\n<EM3>BLUEPRINT DATA</EM3>\n- Electron Ammo\n- Fresnel Energy LMG\n- Pulse Laser Pistol, Pulse Pistol\n- Parallax Energy Assault Rifle\n- Prism Laser Shotgun\n- Quartz Energy SMG\n- Zenith Laser Sniper Rifle\n- vehiclegear/radar: 11 items\n- vehiclegear/shield: 11 items\n- NDB-26 Repeater, NDB-28 Repeater, NDB-30 Repeater\n- Cannons (4 types)\n- Scatters (4 types)
