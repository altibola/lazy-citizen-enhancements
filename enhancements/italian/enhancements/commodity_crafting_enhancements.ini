items_commodities_aslarite_desc=L'aslarite è un minerale naturale che si trova più comunemente negli asteroidi. Ricercato per le sue naturali proprietà di isolamento termico, può essere lavorato e utilizzato nella costruzione di armature personali per aiutare chi le indossa a resistere a temperature estreme.\n\n<EM3>BLUEPRINT DATA</EM3>\n- 8 sets (Heavy Combat)\n- 5 sets (Light Combat)\n- 9 sets (Medium Combat)\n- Horizon, MacFlex, Venture (Light Cosmonaut)\n- Corbel, Palatino (Heavy Engineer)\n- 4 sets (Light Engineer)\n- 5 sets (Heavy Environment)\n- Dust Devil, Manticore (Heavy Explorer)\n- Badami, Microid Battle, Piecemeal Armor (Light Explorer)\n- Antium, Morozov-CH, Morozov-SH (Heavy Hunter)\n- Arden-CL, Arden-SL (Light Hunter)\n- Inquisitor, Morningstar (Medium Hunter)\n- Chiron (Medic Armour)\n- Strata (Medium Miner)\n- Stirling Exploration (Heavy Radiation)\n- Aril (Medium Salvager)\n- 5 sets (Light Stealth)\n- Artimex (Medium Stealth)
