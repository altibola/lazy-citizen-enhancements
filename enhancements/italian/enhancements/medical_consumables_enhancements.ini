item_Desccrlf_consumable_adrenaline_01=Produttore: CureLife\nTipo di articolo: Materiale di consumo medico\n\nDalla società medica più affidabile dell'Impero, CureLife AdrenaPen può erogare rapidamente dosi di adrenalina sintetica Demexatrina durante le situazioni di emergenza per aiutare ad alleviare l'affaticamento muscolare e i sintomi legati a una commozione cerebrale. Utilizzare solo come raccomandato.\n\n--- EFFECT ---\nReduces concussion symptoms, normalizes weapon handling and movement speed.
item_Desccrlf_consumable_healing_01=Produttore: CureLife\nTipo di articolo: Materiale di consumo medico\n\nDalla società medica più affidabile dell'Impero, la CureLife MedPen può erogare rapidamente dosi del coagulante Hemozal durante le situazioni di emergenza per aiutare ad alleviare il sanguinamento e migliorare i parametri vitali generali del paziente . Utilizzare solo come raccomandato.\n\n--- EFFECT ---\nRestores health and stops bleeding. When used on another person recovers from incapacitated state.
item_Desccrlf_consumable_overdoseRevival_01=Produttore: CureLife\nTipo di articolo: Materiale di consumo medico\n\nDalla società medica più affidabile dell'Impero, CureLife DetoxPen può erogare rapidamente dosi del disintossicante Resurgera durante le situazioni di emergenza per aiutare ad alleviare i sintomi associati a livelli elevati di farmaci nel sangue (BDL) e overdose. Utilizzare solo come raccomandato.\n\n--- EFFECT ---\nRevives an overdosed person (if not incapacitated), doubles decay rate of Blood Drug Level.
item_Desccrlf_consumable_oxygen_01=Produttore: CureLife\n\nQuesto sistema di pronto soccorso monouso facile da trasportare è progettato per ricaricare le riserve di ossigeno della tuta pressurizzata in situazioni di emergenza. Compatibile con la maggior parte delle tute standard, Curelife OxyPen è una soluzione ideale per prevenire l'ipossia e fornire accesso immediato all'ossigeno salvavita.\n\n--- EFFECT ---\nRecharges Oxygen reserves of a suit.
item_Desccrlf_consumable_painkiller_01=Produttore: CureLife\nTipo di articolo: Materiale di consumo medico\n\nDalla società medica più affidabile dell'Impero, CureLife OpioPen può erogare rapidamente dosi dell'antidolorifico Roxaphen durante le situazioni di emergenza per aiutare ad alleviare i sintomi associati a mobilità ridotta e paralisi parziale. Utilizzare solo come raccomandato.\n\n--- EFFECT ---\nReduces pain symptoms, normalizes movement ability.
item_Desccrlf_consumable_radiation_01=Produttore: CURELife \n Tipo di articolo: consumabile medico \n \n Il deconpend di CURELife offre una rapida iniezione di canoiodide, un composto medicinale proprietario che tratta l'esposizione alle radiazioni.\n\n--- EFFECT ---\nReduces injuries from radiation.
item_Desccrlf_consumable_steroids_01=Produttore: CureLife\nTipo di articolo: Materiale di consumo medico\n\nDall'azienda medica più affidabile dell'Impero, CureLife CorticoPen può erogare rapidamente dosi di corticosteroide Sterogen durante le situazioni di emergenza per aiutare ad alleviare i sintomi associati alla debolezza muscolare e al danno respiratorio. Utilizzare solo come raccomandato.\n\n--- EFFECT ---\nReduces vision and hearing symptoms, normalizes stamina.
