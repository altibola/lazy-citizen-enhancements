item_DescGMISL_S02_CS_THCN_StrikeForce=Produttore: Thermyte Concern \nSegnale di Tracciamento: Sezione Trasversale \nTaglia: 2 \n\nLo StrikeForce è l'ultimo culmine dell'espansione di Thermyte Concern nell'industria missilistica, mettendo in mostra notevoli miglioramenti nel design e nel puntamento della sezione trasversale. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATS ---\nLifetime: 30.00s\nLock Range: 50 m – 10.0 km\nArm Time: 1.2s  |  Arm Dist: 1.3 km  |  Min Detonate: 5 m\nDamage: 2,250.0 (Phys)\nBlast Radius: 2 m\nComponent HP: 25
