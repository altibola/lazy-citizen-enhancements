item_DescGMISL_S01_EM_THCN_TaskForce=Produttore: Thermyte Concern \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 1 \n\nAvventurandosi nel mercato delle armi, la Thermyte Concern ha messo a frutto la sua vasta conoscenza degli esplosivi da demolizione per creare il TaskForce. Un missile leggero a ricerca EM con un sistema di propulsione top di gamma fornisce un mix efficiente di velocità e potenza di fuoco per stabilire il dominio sul campo di battaglia. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATS ---\nLifetime: 15.00s\nLock Range: 50 m – 10.0 km\nArm Time: 1.0s  |  Arm Dist: 1.4 km  |  Min Detonate: 5 m\nDamage: 980.0 (Phys)\nBlast Radius: 14 m\nComponent HP: 25
