item_DescMISL_S03_EM_FSKI_Thunderbolt=Produttore: Firestorm Kinetics\nSegnale di tracciamento: elettromagnetico\nDimensione: 3\n\nGrazie al telaio agile e al sistema di puntamento EM del Firestorm Thunderbolt, questo missile di prossimità è una scelta solida per un'ampia varietà di scenari di combattimento.\n\n--- STATS ---\nLifetime: 35.00s\nLock Range: 1.9 km – 25.0 km\nArm Time: 1.5s  |  Arm Dist: 1.3 km  |  Min Detonate: 5 m\nDamage: 2,900.0 (Phys)\nBlast Radius: 5 m\nComponent HP: 25
item_DescMISL_S03_IR_NOVP_Viper=Produttore: Nova Pyrotechnica\nSegnale di tracciamento: infrarossi\nDimensione: 3\n\nNova ha lavorato duramente per garantire che il suo missile d'attacco Viper con tracciamento a infrarossi fosse all'altezza del suo nome fornendo attacchi agili e letali contro obiettivi ostili.\n\n--- STATS ---\nLifetime: 35.00s\nLock Range: 1.9 km – 25.0 km\nArm Time: 1.5s  |  Arm Dist: 1.3 km  |  Min Detonate: 5 m\nDamage: 2,650.0 (Phys)\nBlast Radius: 6 m\nComponent HP: 25
item_DescMISL_S03_IR_VNCL_Chaos=Produttore: Vanduul\nSegnale di tracciamento: infrarossi\nDimensione: 3\n\nGli istruttori di volo navali spesso includono il missile d'attacco Chaos a ricerca di calore nelle simulazioni di attacco Vanduul citando che la sua velocità e forza danno alle nuove reclute il giusto rispetto per il nemico che saranno affrontare.\n\n--- STATS ---\nLifetime: 35.00s\nLock Range: 1.9 km – 25.0 km\nArm Time: 1.5s  |  Arm Dist: 1.3 km  |  Min Detonate: 5 m\nDamage: 2,500.0 (Phys)\nBlast Radius: 6 m\nComponent HP: 25
item_DescMISL_S04_CS_TALN_Assailant=Produttore: Talon\nSegnale di tracciamento: sezione trasversale\nDimensione: 4\n\nIl missile Assailant di Talon è un'arma perfetta per attacchi di precisione contro avversari motivati.\n\n--- STATS ---\nLifetime: 45.00s\nLock Range: 2.0 km – 25.0 km\nArm Time: 1.5s  |  Arm Dist: 1.0 km  |  Min Detonate: 5 m\nDamage: 6,500.0 (Phys)\nBlast Radius: 9 m\nComponent HP: 25
item_DescMISL_S04_EM_TALN_Raptor=Produttore: Talon\nSegnale di tracciamento: elettromagnetico\nDimensione: 4\n\nUtilizzando un tracciamento elettromagnetico avanzato e un volo di precisione bilanciato, il missile d'assalto Talon Raptor è una potente aggiunta all'arsenale di qualsiasi nave.\n\n--- STATS ---\nLifetime: 45.00s\nLock Range: 2.0 km – 25.0 km\nArm Time: 1.5s  |  Arm Dist: 1.0 km  |  Min Detonate: 5 m\nDamage: 5,750.0 (Phys)\nBlast Radius: 9 m\nComponent HP: 25
item_DescMISL_S04_IR_BEHR_Pathfinder=Produttore: Behring\nSegnale di tracciamento: infrarossi\nDimensione: 4\n\nIl missile di prossimità Pathfinder è stato un membro coerente del già robusto arsenale di Behring grazie al suo sistema di propulsione collaudato e testato e al sistema di guida a ricerca di calore.\n\n--- STATS ---\nLifetime: 45.00s\nLock Range: 2.0 km – 25.0 km\nArm Time: 1.5s  |  Arm Dist: 1.0 km  |  Min Detonate: 5 m\nDamage: 5,300.0 (Phys)\nBlast Radius: 7 m\nComponent HP: 25
item_DescMISL_S04_IR_VNCL_Dragon=Produttore: Vanduul\nSegnale di tracciamento: infrarossi\nDimensione: 4\n\nDesignato il Drago, questo missile d'attacco con tracciamento a infrarossi Vanduul ha una reputazione spaventosa guadagnata con il numero di navi navali distrutte attribuite al suo potere distruttivo.\n\n--- STATS ---\nLifetime: 45.00s\nLock Range: 2.0 km – 25.0 km\nArm Time: 1.5s  |  Arm Dist: 1.0 km  |  Min Detonate: 5 m\nDamage: 5,000.0 (Phys)\nBlast Radius: 8 m\nComponent HP: 25
item_DescMISL_S05_CS_TALN_Stalker=Produttore: Talon\nSegnale di tracciamento: sezione trasversale\nDimensione: 5\n\nCon il tracciamento della sezione trasversale dedicato, il Talon Stalker ha resistito negli anni come siluro d'attacco di precisione con il massimo potere frenante.\n\n--- STATS ---\nLifetime: 60.00s\nLock Range: 2.0 km – 30.0 km\nArm Time: 2.0s  |  Arm Dist: 1.1 km  |  Min Detonate: 5 m\nDamage: 18,000.0 (Phys)\nBlast Radius: 11 m\nComponent HP: 50
