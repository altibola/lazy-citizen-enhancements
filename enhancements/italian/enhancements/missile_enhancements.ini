item_DescBOMB_S03_FSKI_Thunderball=Produttore: FireStorm Kinetics\nTipo di oggetto: bomba esplosiva\nDimensione: 3\n\nPrendi di mira le forze di terra da una distanza di sicurezza dall'alto con la Thunderball. Nonostante le dimensioni ridotte, queste bombe S3 racchiudono un potente carico utile, consentendo agli utenti di schierare più bombe per sopraffare un bersaglio fermo o di sganciarle a intervalli per colpire bersagli in movimento. Il Thunderball utilizza le pinne Atmo-Xact brevettate di FireStorm Kinetics che si aprono una volta caduto per fornire ulteriore guida lungo il percorso verso il bersaglio.\n\n--- STATS ---\nDamage: 27,000.0 (Phys: 12500.0 / Energy: 14500.0)\nBlast Radius: 40 m\nComponent HP: 1,000
item_DescBOMB_S05_FSKI_Stormburst=Produttore: FireStorm Kinetics\nTipo di oggetto: bomba esplosiva\nDimensione: 5\n\nScatena il caos sulle forze di terra dai cieli sopra, con l'esplosione Storm. Progettate da FireStorm Kinetics per massimizzare l'impatto distruttivo con dimensioni più moderate, queste bombe S5 sono dotate di ordigni compositi misti per decimare bersagli corazzati. Il Stormburst utilizza anche le pinne Atmo-Xact brevettate di FireStorm Kinetics per garantire che il carico utile raggiunga il suo obiettivo.\n\n--- STATS ---\nDamage: 46,702.0 (Phys: 22346.0 / Energy: 24356.0)\nBlast Radius: 100 m\nComponent HP: 1,000
item_DescBOMB_S10_FSKI_Colossus=Produttore: FireStorm Kinetics\nTipo di oggetto: Bomba esplosiva\nDimensione: 10\n\nI nemici qui sotto non avranno alcuna possibilità contro un Colosso. FireStorm Kinetics ha progettato questa enorme bomba S10 per devastare bersagli terrestri, siano essi veicoli o strutture. Pensato per essere lanciato da un'alta quota, il Colosso è dotato di pinne Atmo-Xact brevettate che si aprono per fornire ulteriore guida lungo il percorso verso il bersaglio.\n\n--- STATS ---\nDamage: 568,297.0 (Phys: 45676.6 / Energy: 522620.4)\nBlast Radius: 250 m\nComponent HP: 1,000
item_DescFSKI_S1_RPOD_3x_S3=Tipo di elemento: capsula missilistica\nProduttore: Firestorm Kinetics\nDimensione: 1\nRazzi: 3xS3\n\nLa capsula missilistica Yebira I è il sistema perfetto per un efficiente dispiegamento di ordigni S3. Prodotto da Firestorm Kinetics, questo baccello porta razzi trasporta tre razzi e si attacca a un punto fisso di qualsiasi dimensione.\n\n--- STATS ---\nComponent HP: 500
