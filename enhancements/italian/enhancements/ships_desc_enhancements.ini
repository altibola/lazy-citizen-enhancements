vehicle_DescDRAK_Cutlass_Black=Produttore: Drake Interplanetary\nFocalizzazione: Trasporto Merci Leggero / Caccia Medio\n\nDrake Interplanetary sostiene che la Cutlass Black sia una soluzione a basso costo e di facile manutenzione per le unità di milizia locali all'interno del sistema. La stiva cargo più grande della media, il sedile RIO e il supporto traente dedicato servono, insiste la documentazione dell'azienda, per facilitare le operazioni di ricerca e soccorso.\n\n--- STATS ---\nSCM: 217 m/s  |  Max: 1,150 m/s\nBoost: +465 m/s  /  -230 m/s\nCrew: 3  |  Length: 37.5m  |  Class: Multiruolo  |  Role: Cargo Leggero / Caccia Medio\nInsurance: 9.99 min base  |  3.33 min express
