vehicle_DescCNOU_Mustang_Alpha=Produttore: Consolidated Outland \nFocalizzazione: Iniziale / Trasporto Merci Leggero\n\nIspirata alla visione all'avanguardia del CEO della Consolidated Outland Silas Koerner, la Mustang Alpha è un veicolo spaziale elegante e alla moda che utilizza leghe ultraleggere per spingere i rapporti di potenza ai limiti, seppur a volte in modo non sicuro. E ora, con il Cargo Carrier opzionale, puoi avere i vantaggi dell'Alpha senza sacrificare la capacità di trasporto.\n\n--- STATS ---\nSCM: 228 m/s  |  Max: 1,218 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Multiruolo  |  Role: Starter / \nCargo medio\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 0.68 min base  |  0.00 min express
