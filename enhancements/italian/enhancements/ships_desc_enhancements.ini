vehicle_DescXNAA_SantokYai=Produttore: Aopoa\nFocus: caccia medio\n\nSfruttando la potenza dei sistemi di volo Xi'an di nuova generazione, i propulsori a doppio vettore potenziati e un pacchetto di armi scoraggiante, Aopoa ha realizzato un caccia che conserva l'agile destrezza e la manovrabilità il marchio è noto per.\n\n--- STATS ---\nSCM: 227 m/s  |  Max: 1,161 m/s\nBoost: +493 m/s  /  -225 m/s\nCrew: 1  |  Length: 24.0m  |  Class: Combattimento  |  Role: Caccia medio\nInsurance: 7.50 min base  |  2.50 min express
vehicle_Descprobe_comms_1_a=Produttore: Chimera Communications \nFocus: Recon\n\nL'Auris, del produttore Chimera Communications, ti consente di raccogliere e archiviare facilmente le trasmissioni, rendendolo ideale per il monitoraggio delle attività a corto raggio. Progettato per essere praticamente invisibile durante il funzionamento, questo monitor PDC (Passive Data Collection) a basso consumo è perfetto per fornire ulteriore sicurezza a qualsiasi stazione o struttura con registrazione dettagliata delle trasmissioni di dati e record del traffico navale locale. Inoltre, il trasmettitore burst di backup incluso consente il trasferimento degli archivi dati in caso di emergenza, garantendo maggiore tranquillità.\n\n--- STATS ---\nCrew: 1  |  Length: 18.0m  |  Class: Trasporto  |  Role: Cargo leggero\nShields: S1  |  Coolers: S1  |  Power: S3\nInsurance: 33.33 min base  |  3.33 min express
vehicle_descANVL_Paladin=Produttore: Anvil Aerospace\nFocus: Gunship\n \nProgettato da Anvil Aerospace, il Paladin è un intimidatorio combattente in prima linea che ha un impatto audace ogni volta che arriva in battaglia. Che si tratti di eseguire un'operazione pericolosa o di guidare la carica contro probabilità schiaccianti, con la sua potente gamma di armi e munizioni torrettate, il Paladin è pronto a correre in soccorso.\n\n--- STATS ---\nSCM: 175 m/s  |  Max: 950 m/s\nBoost: +340 m/s  /  -200 m/s\nCrew: 4  |  Length: 53.5m  |  Class: Cannoniera  |  Role: Cannoniera\nInsurance: 24.00 min base  |  6.00 min express
vehicle_descMISC_Starlancer_MAX=Produttore: MISC\nFocalizzazione: Trasporto Merci Medio\n \nPer coloro che cercano di espandere le proprie operazioni di trasporto, gli ingegneri della MISC hanno aggiornato la Starlancer MAX con una stiva extra spaziosa pronta a trasportare merci e veicoli. Abbinata ad alloggi confortevoli per viaggi più lunghi e a un pacchetto difensivo completo per quando si esce dai sentieri battuti, è facile capire perché la Starlancer MAX è il mercantile di scelta per i piloti industriosi in tutto il 'verse.\n\n--- STATS ---\nCrew: 4  |  Length: 90.0m  |  Class: Trasporto  |  Role: Cargo medio\nTurrets: 2\nShields: S3  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 12,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 360  |  D 0  |  T 0\nInsurance: 12.33 min base  |  3.08 min express
vehicle_descMISC_Starlancer_TAC=Produttore: MISC\nFocalizzazione: Cannoniera\n \nPer coloro che cercano una nave versatile che possa cavarsela da sola in un combattimento, gli ingegneri hanno aggiornato la Starlancer TAC con un aggressivo pacchetto offensivo pronto ad affrontare i nemici più feroci. Quando affronti un lavoro ad alto rischio e alta ricompensa, la Starlancer TAC è lì per assicurarsi che tu e il tuo equipaggio siate in grado di portarlo a termine fino alla fine.\n\n--- STATS ---\nSCM: 150 m/s  |  Max: 960 m/s\nBoost: +315 m/s  /  -155 m/s\nCrew: 8  |  Length: 90.0m  |  Class: Combattimento  |  Role: Cannoniera\nTurrets: 9\nShields: 2× S3  |  Coolers: S3  |  Power: S3  |  QD: S2\nArmor HP: 18,150\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 347  |  E 396  |  D 0  |  T 0\nInsurance: 13.33 min base  |  3.33 min express
vehicles_DescOrbital_Sentry=Il Supervisore, del produttore Broad & Raibee, consente il monitoraggio dell'attività difensiva in una determinata area. Quando viene rilevata una minaccia, il Supervisore è in grado di prendere di mira e ingaggiare i nemici che sconfinano con brutale efficienza, rendendolo perfetto per fornire ulteriore sicurezza a qualsiasi stazione, struttura o settore controllato.\n\n--- STATS ---\nCrew: 1  |  Length: 18.0m  |  Class: Combattimento  |  Role: Torretta\nTurrets: 1\nShields: S2  |  Coolers: S3  |  Power: S3\nInsurance: 33.33 min base  |  3.33 min express
