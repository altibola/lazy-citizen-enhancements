vehicle_DescKRIG_S65_Stingray=Produttore: Kruger Intergalactic\nFocus: Caccia medio\n\nElegante, bilanciato e intransigente nella sua visione, l'S-65 Stingray è un caccia medio che bilancia un'ottima manovrabilità pur offrendo una notevole potenza di fuoco. Prendendo nome dal suo omonimo animale, lo Stingray non è estraneo al combattimento, in grado di piombare sul bersaglio, infliggere danni costanti e allontanarsi rapidamente, senza timore di subire qualche colpo nel processo.\n\n--- STATS ---\nSCM: 218 m/s  |  Max: 1,200 m/s\nBoost: +485 m/s  /  -230 m/s\nCrew: 1  |  Length: 20.4m  |  Class: Combattimento  |  Role: Caccia medio\nInsurance: 2.00 min base  |  1.00 min express
vehicle_DescMISC_Fortune=Produttore: MISC\nFocalizzazione: Recupero Leggero\n\nPer coloro che sono pronti ad elevare la propria professione al livello successivo, gli ingegneri della MISC hanno accuratamente realizzato la Fortune come il miglior piccolo vascello di recupero della sua categoria. Dotato di un versatile braccio di recupero e di un ascensore cargo, la MISC Fortune è costruita dalle fondamenta per trasformare la spazzatura in tesoro.\n\n\n--- STATS ---\nSCM: 143 m/s  |  Max: 975 m/s\nBoost: +350 m/s  /  -150 m/s\nCrew: 1  |  Length: 26.5m  |  Class: Industriale  |  Role: Recupero relitti leggero\nCoolers: S2  |  Power: S2  |  QD: S1\nArmor HP: 4,114\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 5.18 min base  |  1.30 min express
