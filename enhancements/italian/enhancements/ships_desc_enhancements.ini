vehicle_DescAEGS_Gladius_Valiant=Produttore: Aegis Dynamics\nFocus:Light Fighter\n\nCreato come parte della serie "Masters of Flight" insieme al simulatore di volo Arena Commander, il Valiant rende omaggio al famoso pilota di difesa Condi Hillard per essere il primo umano mai registrato a sconfiggere un Vanduul in combattimento. Questa Gladius è dotata di un equipaggiamento specializzato nel combattimento aereo e di una livrea in edizione speciale personalizzata in onore della sua iconica nave.\n\n--- STATS ---\nCrew: 1  |  Length: 21.0m  |  Class: Combattimento  |  Role: Caccia leggero\nMRacks: 4× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 5.83 min base  |  1.94 min express
vehicle_DescAEGS_Hammerhead=Produttore: Aegis Dynamics\nNovità:Cannoniera pesante\n\nUna nave pattuglia veloce con torrette multiple progettata per combattere i caccia, la Hammerhead è ugualmente adatta a supportare navi capitali più grandi in una flotta o a fungere da nave ammiraglia per gruppi di caccia.\n\n--- STATS ---\nSCM: 160 m/s  |  Max: 1,000 m/s\nBoost: +340 m/s  /  -170 m/s\nCrew: 9  |  Length: 120.0m  |  Class: Combattimento  |  Role: Cannoniera pesante\nTurrets: 6\nShields: 2× S3  |  Coolers: 2× S3  |  Power: 2× S3  |  QD: S3\nArmor HP: 25,740\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 531  |  E 380  |  D 0  |  T 0\nInsurance: 48.60 min base  |  16.20 min express
vehicle_DescAEGS_Idris_M=Produttore: Aegis Dynamics\nFocus: Fregata\n\nPiù grande di un bombardiere ma più piccola di una nave di linea, le fregate occupano uno spazio interessante nel pantheon delle navi da guerra navali. Sebbene manchino della pesante corazzatura e dell'armamento capitale di un incrociatore, la Marina UEE apprezza le sue fregate in quanto sono manovrabili e possono essere adattate per l'uso in un'ampia gamma di scenari di combattimento.\n\n--- STATS ---\nCrew: 28  |  Length: 243.0m  |  Class: Combattimento  |  Role: Fregata\nTurrets: 1\nInsurance: 253.00 min base  |  63.25 min express
vehicle_DescAEGS_Idris_P=Produttore: Aegis Dynamics\nFocus: Fregata\n\nUna variante 'peacekeeper' mark due sviluppata per i servizi di pattugliamento UEE, la Idris-P rinuncia all'arma nave-nave standard e all'attacco dorsale a favore di una maggiore capacità di carico e di una velocità superiore.\n\n--- STATS ---\nCrew: 28  |  Length: 243.0m  |  Class: Combattimento  |  Role: Fregata\nArmor HP: 72,930\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 528  |  E 462  |  D 0  |  T 0\nInsurance: 199.00 min base  |  49.75 min express
vehicle_DescAEGS_Idris_P_Collector_Military=Produttore: Aegis Dynamics\nFocus: Fregata\n\nUna variante 'pacificatrice' mark due sviluppata per i servizi di pattuglia UEE, l'Idris-P rimuove il cannone nave-nave e l'armamento dorsale della nave standard in favore di una maggiore capacità di carico e una velocità superiore.\n\nSono Wikelo. Ho fatto modifiche utili per rendere la nave più combattiva. Molto impressionante.\n\n--- STATS ---\nCrew: 28  |  Length: 243.0m  |  Class: Combattimento  |  Role: Fregata\nArmor HP: 72,930\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 528  |  E 462  |  D 0  |  T 0\nInsurance: 199.00 min base  |  49.75 min express
vehicle_DescAEGS_Javelin=Produttore: Aegis Dynamics\nObiettivo: cacciatorpediniere\n\nProgettata per l'uso da parte dell'esercito UEE, la Javelin è un'enorme nave classe capital modulare che può essere adattata per uso imprenditoriale. Con interni dettagliati, numerose opzioni di stanze modulari e un'elevata capacità dell'equipaggio, la Javelin è una nave che si è fatta un nome in una varietà di ruoli.\n\n--- STATS ---\nSCM: 50 m/s  |  Max: 900 m/s\nBoost: +290 m/s  /  -230 m/s\nCrew: 1  |  Length: 0.0m  |  Class: Cacciatorpediniera  |  Role: Cacciatorpediniera\nTurrets: 28\nShields: 4× S4  |  Coolers: 4× S4  |  Power: 4× S4  |  QD: S4\nArmor HP: 117,810\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 539  |  E 473  |  D 0  |  T 0\nInsurance: 168.75 min base  |  56.25 min express
vehicle_DescAEGS_Reclaimer=Produttore: Aegis Dynamics\nNovità:salvataggio pesante\n\nLa Aegis Reclaimer è una nave da salvataggio industriale. Dotata di una stiva di carico rinforzata, di un dispositivo di salto a lungo raggio e di capsule di lancio per droni senza pilota, la Reclaimer è la nave ideale per sfruttare i relitti dello spazio profondo. Raggi traenti, proiettori, opzioni scanner e porte di attracco completano gli strumenti di questo veicolo spaziale capace e utilitario.\n\n--- STATS ---\nSCM: 110 m/s  |  Max: 870 m/s\nBoost: +290 m/s  /  -115 m/s\nCrew: 5  |  Length: 160.0m  |  Class: Industriale  |  Role: Recupero relitti pesante\nTurrets: 3\nShields: S4  |  Coolers: S4  |  Power: S4  |  QD: S3\nArmor HP: 32,912\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 495  |  E 418  |  D 0  |  T 0\nInsurance: 30.69 min base  |  10.23 min express
vehicle_DescAEGS_Reclaimer_Teach=Produttore: Aegis Dynamics\nFocus: Recupero Pesante\n\nLa Aegis Reclaimer è una nave industriale da recupero. Equipaggiata con una stiva di carico rinforzata, un motore quantum a lungo raggio e pod di lancio per droni senza equipaggio, la Reclaimer è la nave ideale per trarre vantaggio dai relitti spaziali profondi. Raggi traenti, riflettori, opzioni di scanner e porte di attracco completano gli strumenti di questa capace e utilitaria astronave.\n\nPer far fronte alle difficili condizioni di lavoro di Nyx, il Teach's Ship Shop ha equipaggiato questa edizione speciale con un allestimento personalizzato caratterizzato da componenti robusti, in modo che tu possa affrontare al meglio il lavoro da svolgere.\n\n--- STATS ---\nCrew: 5  |  Length: 160.0m  |  Class: Industriale  |  Role: Recupero relitti pesante\nTurrets: 3\nShields: S4  |  Coolers: S4  |  Power: S4  |  QD: S3\nArmor HP: 32,912\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 495  |  E 418  |  D 0  |  T 0\nInsurance: 30.69 min base  |  10.23 min express
vehicle_DescAEGS_Redeemer=Produttore: Aegis Dynamics\nNovità:Gunship\n\nProgettata da Aegis Dynamics, la Redeemer è una potente nave da combattimento in grado di resistere in combattimento con un potente carico di armi. Punteggiato di torrette e missili, il Redeemer funge anche da mezzo da sbarco corazzato in grado di trasportare soldati in prima linea.\n\n--- STATS ---\nSCM: 203 m/s  |  Max: 1,050 m/s\nBoost: +400 m/s  /  -215 m/s\nCrew: 4  |  Length: 51.0m  |  Class: Combattimento  |  Role: Cannoniera\nGuns: 2  |  Turrets: 7  |  MRacks: 2× S4\nShields: 6× S2  |  Coolers: S3  |  Power: 2× S3  |  QD: S2\nArmor HP: 21,120\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 116  |  E 110  |  D 0  |  T 0\nInsurance: 28.35 min base  |  9.45 min express
