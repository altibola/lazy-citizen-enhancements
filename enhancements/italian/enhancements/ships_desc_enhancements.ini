vehicle_DescRSI_Constellation_Phoenix=Produttore: RSI\nFocalizzazione: Turismo di Lusso\n\nUn vascello spaziale di lusso dedicato per il capitano stellare esigente. La Constellation Phoenix può essere utilizzata come nave comando dell'organizzazione e presenta un lussuoso interno riprogettato. Include un'area nascosta e isolata dai sensori per il tuo carico più prezioso. La Phoenix viene fornita con un Lynx rover e un Kruger P-72 Archimedes Fighter.\n\n--- STATS ---\nSCM: 185 m/s  |  Max: 995 m/s\nBoost: +385 m/s  /  -191 m/s\nCrew: 4  |  Length: 63.5m  |  Class: Esplorazione  |  Role: Touring di lusso\nTurrets: 1  |  MRacks: 4× S4\nShields: S3  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 13,440\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 116  |  E 110  |  D 0  |  T 0\nInsurance: 24.30 min base  |  8.10 min express
vehicle_DescRSI_Constellation_Phoenix_Emerald=Produttore: RSI \nFocalizzazione: Turismo di Lusso\n\nChe tu sia un socialite esigente o un animale da festa a ruota libera, la Constellation Phoenix Emerald è il tuo passaporto personale per l'intrattenimento. Con una cabina interna elegante progettata specificamente per i festeggiamenti, e una livrea "fortunata" in edizione limitata, la Emerald è il luogo perfetto per sorseggiare un bicchiere di Radegast Gold o buttare giù uno Sleeping Tiger Malt verde mentre sfrecci lussuosamente tra le stelle. Assicurati solo di portare un pilota designato.\n\n--- STATS ---\nCrew: 4  |  Length: 63.5m  |  Class: Esplorazione  |  Role: Touring di lusso\nTurrets: 1  |  MRacks: 4× S4\nShields: S3  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 13,440\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 116  |  E 110  |  D 0  |  T 0\nInsurance: 24.30 min base  |  8.10 min express
