vehicle_DescMISC_Razor_LX=Produttore: Mirai\nFocalizzazione: Corsa\n\nLa Razor viene sovralimentata. La LX presenta un motore overcloccato per sprigionare velocità massime folgoranti. Questa potenza ha un costo, con una ridotta manovrabilità e armamenti che la rendono ideale per le corse su rettilineo. Ma chi ha bisogno di armi quando stai lasciando la concorrenza nella polvere.\n\n--- STATS ---\nSCM: 275 m/s  |  Max: 1,525 m/s\nBoost: +490 m/s  /  -290 m/s\nCrew: 1  |  Length: 12.5m  |  Class: Competizione  |  Role: Da gara\nInsurance: 6.08 min base  |  2.02 min express
vehicle_DescMISC_Reliant=Produttore: MISC\nFocalizzazione: Iniziale / Trasporto Merci Leggero\n\nCon la Reliant Kore, MISC aggiunge alla sua già impressionante gamma di navi, un veicolo spaziale più piccolo di classe introduttiva. Utilizzando avanzati design Xi'An, la Reliant presenta ali ampie ed eleganti, propulsori omnidirezionali e un abitacolo a due posti completamente articolato che supporta modalità di volo orizzontali e verticali. Tutto questo si combina con una capacità di trasporto maggiore rispetto a molte navi della sua classe per rendere la Kore una scelta naturale per il trasporto a corto raggio, o con la semplice aggiunta di pochi componenti opzionali, questa capace nave può fare tutto ciò che sogni.\n\n--- STATS ---\nCrew: 2  |  Length: 14.8m  |  Class: Trasporto  |  Role: Starter / \nCargo medio\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,200\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 0.68 min base  |  0.00 min express
vehicle_DescMISC_Reliant_Mako=Produttore: MISC\nFocus: Reporting\n\nL'Impero dipende da informazioni aggiornate al secondo, motivo per cui i giornalisti devono essere in grado di andare dove si verificano le notizie: ovunque, in qualsiasi momento. Entra nel Mako, tutta la flessibilità e l'affidabilità di un MISC Reliant combinate con un pacchetto fotocamera Cernan all'avanguardia per catturare ogni momento mentre accade con la chiarezza e la precisione che fanno notizia.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 2  |  Length: 14.8m  |  Class: Supporto  |  Role: Segnalazione\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,200\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 5.36 min base  |  1.79 min express
vehicle_DescMISC_Reliant_Sen=Produttore: MISC\nFocus: Scienza della luce\n\nMagellan, Pierce, Croshaw, nomi che risuonano nella storia grazie al loro spirito avventuroso, una natura curiosa e una nave affidabile. Reliant Sen è una piattaforma scientifica mobile versatile; dotato di funzionalità a lungo raggio per portarti più lontano, più a lungo e della suite avanzata di sensori Samos. Perfetto per l'aspirante esploratore che vuole sussurrare il proprio nome nelle sale della storia.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 2  |  Length: 14.8m  |  Class: Industriale  |  Role: Ricerca scientifica Leggera\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,200\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 4.82 min base  |  1.61 min express
vehicle_DescMISC_Reliant_Tana=Produttore: MISC\nFocus: caccia leggero\n\nCon l'umanità in continua espansione nell'universo, la necessità di un caccia leggero e versatile è aumentata con essa. Di facile manutenzione e dotato di una struttura robusta, il Reliant Tana rappresenta la scelta ideale per la difesa di frontiera e di avamposto grazie al suo impianto energetico personalizzato ad alto rendimento, scudi più resistenti e supporti per armi aggiuntivi.\n\n--- STATS ---\nSCM: 222 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 2  |  Length: 14.8m  |  Class: Combattimento  |  Role: Caccia leggero\nGuns: 2  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 4.82 min base  |  1.61 min express
vehicle_DescMISC_Starfarer=Produttore: MISC\nFocus: rifornimento pesante\n\nLa Starfarer differisce dalle tradizionali navi da carico alla rinfusa in un aspetto fondamentale: è una piattaforma di carburante dedicata. Il Starfarer è progettato non solo per caricare, immagazzinare e proteggere le unità di stasi del carburante, ma è progettato anche per assorbire i gas presenti nello spazio e raffinarli per l'uso senza atterraggio. E anche se eccelle in questo, la Starfarer può essere utilizzata anche per trasportare i tradizionali pod per carichi sfusi.\n\n--- STATS ---\nSCM: 106 m/s  |  Max: 845 m/s\nBoost: +295 m/s  /  -106 m/s\nCrew: 8  |  Length: 102.0m  |  Class: Supporto  |  Role: Rifornimento pesante\nTurrets: 1\nShields: 3× S3  |  Coolers: 2× S3  |  Power: S3  |  QD: S3\nArmor HP: 12,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 360  |  D 0  |  T 0\nInsurance: 18.00 min base  |  6.00 min express
vehicle_DescMISC_Starfarer_Gemini=Produttore: MISC\nObiettivo: rifornimento pesante\n\nL'esercito dell'Impero Unito della Terra utilizza una variante "agitata" adattata del Starfarer per le operazioni in prima linea. Il G2M Gemini, più comunemente Starfarer Gemini o "Star G", scambia parte della capacità di carico e della manovrabilità in cambio di corazza rinforzata, scudi aumentati, motori più potenti e versioni più potenti delle tre torrette con equipaggio.\n\n--- STATS ---\nSCM: 106 m/s  |  Max: 845 m/s\nBoost: +295 m/s  /  -106 m/s\nCrew: 2  |  Length: 102.0m  |  Class: Supporto  |  Role: Rifornimento pesante\nTurrets: 1\nShields: 3× S3  |  Coolers: 2× S3  |  Power: S3  |  QD: S3\nArmor HP: 18,150\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 331  |  E 378  |  D 0  |  T 0\nInsurance: 35.34 min base  |  11.78 min express
vehicle_DescMISC_Starfarer_Teach=Produttore: MISC\nFocus: Rifornimento Pesante\n\nLa Starfarer si differenzia dai tradizionali mercantili alla rinfusa in un modo fondamentale: è una piattaforma di rifornimento dedicata. La Starfarer è progettata non solo per caricare, immagazzinare e proteggere le unità di stasi del carburante, è progettata per aspirare i gas spaziali e raffinarli per l'uso senza atterrare. E anche se eccelle in questo, la Starfarer può anche essere utilizzata per trasportare tradizionali pod di carico alla rinfusa.\n\nPer far fronte alle difficili condizioni di lavoro di Nyx, il Teach's Ship Shop ha equipaggiato questa edizione speciale con un allestimento personalizzato caratterizzato da componenti robusti, in modo che tu possa affrontare al meglio il lavoro da svolgere.\n\n--- STATS ---\nCrew: 8  |  Length: 102.0m  |  Class: Supporto  |  Role: Rifornimento pesante\nTurrets: 1\nShields: 3× S3  |  Coolers: 2× S3  |  Power: S3  |  QD: S3\nArmor HP: 12,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 360  |  D 0  |  T 0\nInsurance: 18.00 min base  |  6.00 min express
vehicle_DescMISC_Starlancer_MAX_Collector_Indust=Produttore: MISC\nFocalizzazione: Trasporto Merci Medio\n \nPer coloro che cercano di espandere le proprie operazioni di trasporto, gli ingegneri della MISC hanno aggiornato la Starlancer MAX con una stiva extra spaziosa pronta a trasportare merci e veicoli. Abbinata ad alloggi confortevoli per viaggi più lunghi e a un pacchetto difensivo completo per quando si esce dai sentieri battuti, è facile capire perché la Starlancer MAX è il mercantile di scelta per i piloti industriosi in tutto il 'verse.\n\n--- STATS ---\nCrew: 4  |  Length: 90.0m  |  Class: Trasporto  |  Role: Cargo medio\nTurrets: 2\nArmor HP: 12,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 360  |  D 0  |  T 0\nInsurance: 12.33 min base  |  3.08 min express
vehicle_DescMISC_Starlancer_TAC_Collector_Military=Produttore: MISC\nFocalizzazione: Cannoniera\n \nPer coloro che cercano una nave versatile che possa cavarsela da sola in un combattimento, gli ingegneri hanno aggiornato la Starlancer TAC con un aggressivo pacchetto offensivo pronto ad affrontare i nemici più feroci. Quando affronti un lavoro ad alto rischio e alta ricompensa, la Starlancer TAC è lì per assicurarsi che tu e il tuo equipaggio siate in grado di portarlo a termine fino alla fine.\n\nWikelo qui. Fatto modifiche utili per rendere la nave ancora più simile a un caccia. Molto impressionante.\n\n--- STATS ---\nCrew: 8  |  Length: 90.0m  |  Class: Combattimento  |  Role: Cannoniera\nTurrets: 9\nShields: 2× S3  |  Coolers: S3  |  Power: S3  |  QD: S2\nArmor HP: 18,150\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 347  |  E 396  |  D 0  |  T 0\nInsurance: 13.33 min base  |  3.33 min express
vehicle_DescMISC_Starlite=Produttore: MISC\nFocus: Rifornimento Leggero\n\nSe c'è una costante nell'universo, è che le navi alla fine finiranno il carburante. È qui che entra in gioco lo Starlite. Dotato di due serbatoi di carburante standard e di un design ridotto ed elegante, lo Starlite è stato meticolosamente realizzato dagli ingegneri della MISC per offrire servizi di rifornimento alle navi in difficoltà ovunque possano essere bloccate.\n\n--- STATS ---\nSCM: 150 m/s  |  Max: 970 m/s\nBoost: +340 m/s  /  -160 m/s\nCrew: 1  |  Length: 32.0m  |  Class: Supporto  |  Role: Rifornimento Leggero\nInsurance: 5.82 min base  |  1.45 min express
vehicle_DescMRAI_Guardian=Produttore: Mirai\nFocalizzazione: Caccia Pesante\n\nPrendendo il detto che la miglior difesa è un buon attacco, gli ingegneri della Mirai hanno portato la loro esperienza in prestazioni e manovrabilità al caccia a lungo raggio Guardian.  Vola in tondo attorno ai tuoi avversari con il Mirai Guardian mentre stabilisci la tua superiorità spaziale. \n\n\n--- STATS ---\nSCM: 213 m/s  |  Max: 1,125 m/s\nBoost: +465 m/s  /  -225 m/s\nCrew: 1  |  Length: 24.3m  |  Class: Combattimento  |  Role: Caccia pesante\nInsurance: 11.33 min base  |  2.83 min express
