vehicle_DescAEGS_Vanguard=Produttore: Aegis Dynamics\nFocus: caccia pesante\n\nUn caccia bulldog dalla carica potente dotato di estese armi montate in avanti progettate per squarciare gli scudi e l'armatura di altri veicoli spaziali. Così chiamati perché la loro portata di salti multipli consente loro di formare l'avanguardia di qualsiasi spedizione militare, le Avanguardie hanno prestato servizio a lungo contro i Vanduul.\n\n--- STATS ---\nSCM: 210 m/s  |  Max: 1,075 m/s\nBoost: +458 m/s  /  -220 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combattimento  |  Role: Caccia pesante\nGuns: 5  |  Turrets: 1  |  MRacks: 4× S4\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 18.22 min base  |  6.07 min express
vehicle_DescAEGS_Vanguard_Harbinger=Produttore: Aegis Dynamics\nFocalizzazione: Caccia Pesante / Bombardiere\n\nLa Vanguard Harbinger è il caccia/bombardiere standard della Terra, che converte la capsula di salvataggio della Vanguard Warden standard in un potente vano bombe. La portata estesa della Vanguard e il profilo relativamente piccolo significano che può andare dove le navi basate su portaerei o i bombardieri strategici più grandi non arrivano, colpire duro e poi tornare alla base.\n\n--- STATS ---\nSCM: 212 m/s  |  Max: 1,085 m/s\nBoost: +462 m/s  /  -224 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combattimento  |  Role: Caccia Pesante / Bombardiere\nGuns: 5  |  Turrets: 1  |  MRacks: 4× S4  S5\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 16.39 min base  |  5.46 min express
vehicle_DescAEGS_Vanguard_Hoplite=Produttore: Aegis Dynamics\nFocalizzazione: Nave da Sbarco \n\nLa Vanguard Hoplite è un incrocio tra il vincente caccia da spazio profondo Vanguard e una nave da abbordaggio dedicata. Adattata da collaudati design di navi d'assalto, l'Hoplite è lo strumento perfetto per inserire una squadra d'assalto corazzata con sufficiente potenza di fuoco per farli uscire di nuovo.\n\n--- STATS ---\nSCM: 209 m/s  |  Max: 1,115 m/s\nBoost: +435 m/s  /  -246 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combattimento  |  Role: Nave da Sbarco\nGuns: 5  |  Turrets: 1  |  MRacks: 2× S4\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 14,850\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 13.25 min base  |  4.42 min express
vehicle_DescAEGS_Vanguard_Sentinel=Produttore: Aegis Dynamics\nFocalizzazione: Caccia Pesante \n\nLa Vanguard Sentinel è una nave progettata per combattere in modo intelligente invece di affrontare i nemici a testa bassa. La conversione presenta un abitacolo AR, una capsula e-War esterna, missili esca e un set di cariche EMP. Le Vanguard Sentinel forniscono spesso il necessario supporto in combattimento per operazioni combinate. Una Sentinel solitaria è frequentemente accoppiata con bombardieri Harbinger e scorte Warden per grandi missioni di attacco.\n\n--- STATS ---\nSCM: 217 m/s  |  Max: 1,075 m/s\nBoost: +462 m/s  /  -224 m/s\nCrew: 2  |  Length: 48.0m  |  Class: Combattimento  |  Role: Caccia Pesante / Bombardiere\nGuns: 5  |  Turrets: 1  |  MRacks: 4× S4\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 50  |  E 40  |  D 0  |  T 0\nInsurance: 18.22 min base  |  6.07 min express
