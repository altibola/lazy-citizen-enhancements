vehicle_DescANVL_Hornet_F7CM=Produttore: Anvil Aerospaziale\nFocus: Caccia medio\n\nIl più vicino all'equipaggiamento militare possibile legalmente per un modello civile, l'F7C-M Super Hornet riattacca la torretta sferica e offre parti quasi milspec sotto il cofano. A dimostrazione che due teste sono meglio di una, è stato aggiunto un secondo posto per dividere i compiti logistici e di combattimento, rendendo il Super Hornet un bersaglio davvero terrificante da affrontare.\n\n--- STATS ---\nSCM: 219 m/s  |  Max: 1,142 m/s\nBoost: +477 m/s  /  -249 m/s\nCrew: 2  |  Length: 28.2m  |  Class: Combattimento  |  Role: Caccia medio\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 6,600\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 24  |  E 13  |  D 0  |  T 0\nInsurance: 9.72 min base  |  3.24 min express
