vehicle_DescDRAK_Clipper=Produttore: Drake Interplanetary\nFocalizzazione: Generalista\n \nSe c'è una cosa che ogni capitano deve prendere a cuore mentre si prepara a viaggiare tra le stelle è "aspettarsi l'inaspettato". Con una stiva cargo, strutture mediche e capacità di crafting, insieme al senso pratico del design della Drake, la Clipper è il perfetto tuttofare per qualsiasi nuova impresa spaziale.\n\n--- STATS ---\nSCM: 205 m/s  |  Max: 1,000 m/s\nBoost: +405 m/s  /  -230 m/s\nCrew: 1  |  Length: 26.5m  |  Class: Esplorazione  |  Role: Generalista\nInsurance: 8.17 min base  |  2.05 min express
vehicle_DescDRAK_Command_Module=Produttore: Drake Interplanetary\nFocalizzazione: Logistica\n\nAnche i capitani più esperti sanno quando la migliore linea di condotta è limitare le perdite e sopravvivere per combattere un altro giorno. Con questo modulo di comando staccabile, la Drake si è assicurata che gli operatori cauti possano estrarsi dal corpo principale della nave e fare una rapida uscita con facilità, qualora se ne presentasse la necessità.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +350 m/s  /  -220 m/s\nCrew: 2  |  Length: 20.0m  |  Class: Trasporto  |  Role: Trasporto\nInsurance: 3.00 min base  |  0.00 min express
vehicle_DescDRAK_Corsair=Produttore: Drake Interplanetary\nFocalizzazione: Spedizione\n\nRispondi al richiamo dello spazio inesplorato e sfrutta lo spirito di esplorazione con la Drake Corsair. Utilizzando un esclusivo design asimmetrico dello scafo, questo esploratore versatile può andare ovunque i venti dell'avventura possano guidarti.\n\n--- STATS ---\nSCM: 190 m/s  |  Max: 1,025 m/s\nBoost: +390 m/s  /  -205 m/s\nCrew: 4  |  Length: 53.0m  |  Class: Esplorazione  |  Role: Esplorazione\nInsurance: 17.01 min base  |  5.67 min express
