vehicle_DescDRAK_Cutlass_Blue=Produttore: Drake Interplanetary\nFocus:Interdizione\n\nElegante, cattivo e reale. Il Cutlass Blue aggiunge missili, un motore più aggressivo e celle di contenimento Durasteel nella stiva di carico al modello standard. La Cutlass Blue è la nave standard della milizia esterna scelta per le pattuglie.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,165 m/s\nBoost: +467 m/s  /  -230 m/s\nCrew: 3  |  Length: 37.5m  |  Class: Combattimento  |  Role: Interdizione\nInsurance: 9.99 min base  |  3.33 min express
vehicle_DescDRAK_Cutlass_Red=Produttore: Drake Interplanetary\nFocus:Â Medico\n\nLa Cutlass Red converte la stiva di carico standard in una struttura medica ben attrezzata che include un Autodoc. Questa ambulanza diretta verso la stella è dotata del transponder Echo Nav-E7, di uno scanner a lungo raggio e di un collare di aggancio Secure Plus, che la rende ideale per la ricerca e il salvataggio. Questo modello presenta anche un'esclusiva skin Red Crossbones.\n\n--- STATS ---\nSCM: 212 m/s  |  Max: 1,125 m/s\nBoost: +460 m/s  /  -230 m/s\nCrew: 2  |  Length: 37.5m  |  Class: Supporto  |  Role: Soccorso\nInsurance: 14.99 min base  |  5.00 min express
vehicle_DescDRAK_Cutlass_Steel=Produttore: Drake Interplanetary\nFocalizzazione: Nave da Sbarco\n\nCon la Cutlass Steel, la Drake Interplanetary ha ancora una volta reinventato il suo design classico per creare una nave da trasporto da combattimento di nuova generazione attraverso l'aggiunta di sedili ribaltabili dedicati e un arsenale espanso. È un 'verse pericoloso là fuori, e la Cutlass Steel è pronta a farsi strada attraverso qualsiasi cosa si frapponga tra te e il tuo equipaggio dedicato.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +420 m/s  /  -240 m/s\nCrew: 3  |  Length: 37.5m  |  Class: Combattimento  |  Role: Nave da Sbarco\nInsurance: 11.99 min base  |  4.00 min express
vehicle_DescDRAK_Cutter=Produttore: Drake Interplanetary\nFocalizzazione: Iniziale / Esploratore\n\nProgettata per i gran lavoratori di ogni tipo, la Cutter racchiude 4 SCU di spazio cargo e un sacco di potenza in un telaio rude, violento e compatto. È una nave che incarna veramente lo spirito della Drake: che non importa chi tu sia o cosa tu faccia, puoi raggiungere le stelle.\n\n--- STATS ---\nSCM: 180 m/s  |  Max: 1,010 m/s\nBoost: +380 m/s  /  -160 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Esplorazione  |  Role: Starter / Esplorazione\nShields: S1  |  Coolers: S1  |  Power: S1  |  QD: S1\nArmor HP: 1,980\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 3.37 min base  |  1.12 min express
vehicle_DescDRAK_Cutter_Rambler=Produttore: Drake Interplanetary\nFocus: Spedizione\n\nI pezzi grossi di Drake hanno sentito quello che avevi da dire e la loro risposta è stata il Cutter Rambler. Basandosi sull'originale, il Rambler conserva un intero spazio di carico di 2 SCU, aggiungendo al contempo i comfort richiesti e abbastanza spazio di archiviazione personale per far sì che anche il viaggio più lungo passi in un lampo.\n\n--- STATS ---\nCrew: 1  |  Length: 20.0m  |  Class: Esplorazione  |  Role: Esplorazione\nCoolers: S1  |  Power: S1  |  QD: S1\nArmor HP: 1,980\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 1.25 min base  |  0.00 min express
vehicle_DescDRAK_Cutter_Scout=Produttore: Drake Interplanetary\nFocalizzazione: Esploratore\n\nRiducendo all'osso il telaio rude, violento e compatto della Cutter all'essenziale, la Drake ha preso una nave già impressionante e l'ha trasformata nel vascello da ricognizione ideale. Dotata di capacità radar e di scansione migliorate abbinate a maggiore potenza e raffreddamento, la Cutter Scout è pronta a volare davanti al gruppo.\n\n--- STATS ---\nSCM: 180 m/s  |  Max: 1,010 m/s\nBoost: +380 m/s  /  -160 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Esplorazione  |  Role: Esplorazione\nCoolers: S2  |  Power: S2\nArmor HP: 1,980\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 3.87 min base  |  1.28 min express
vehicle_DescDRAK_Dragonfly=Produttore: Drake Interplanetary\nFocus: corse\n\nLa Drake Dragonfly è la nave perfetta per chiunque voglia vivere al limite. Poiché nulla separa il pilota dai pericoli dello spazio, la Dragonfly è un'avventura tanto quanto una nave! La conversione a doppia modalità consente al Dragonfly di operare a terra o nello spazio, e un secondo sedile rivolto all'indietro significa che puoi persino portare un passeggero!\n\n--- STATS ---\nSCM: 190 m/s  |  Max: 523 m/s\nBoost: +270 m/s  /  -120 m/s\nCrew: 1  |  Length: 7.0m  |  Class: Competizione  |  Role: Da gara\nGuns: 2\nCoolers: S0  |  Power: S0\nArmor HP: 1,170\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.10 min base  |  0.00 min express
