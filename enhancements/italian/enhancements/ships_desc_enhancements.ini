vehicle_DescRSI_Constellation_Taurus_Collector_Military=Produttore: RSI \nFocus: Fregara media \n \nPair Down per concentrarsi pienamente sul trasporto, il Toro fornisce il maggior numero di merci di qualsiasi nave nella gamma di costellazione di RSI. Ciò che perde in versatilità è più che compensato in potenziali profitti grazie ai suoi tratti di tractor, un sistema di rilascio di carico per un rapido scarico e una presa di sicurezza rinforzata con placcatura tecnologica. \n \nwikelo qui. Ha apportato utili modifiche per rendere la nave molto più combattente. Molto impressionante.\n\n--- STATS ---\nCrew: 4  |  Length: 70.0m  |  Class: Trasporto  |  Role: Cargo medio\nTurrets: 2  |  MRacks: 4× S5\nArmor HP: 13,440\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 116  |  E 110  |  D 0  |  T 0\nInsurance: 17.10 min base  |  5.70 min express
vehicle_DescRSI_Hermes=Produttore: Roberts Space Industries\nFocalizzazione: Trasporto Merci Medio\n\nA differenza del suo omonimo mitologico, la RSI Hermes non è un truffatore: è davvero così veloce. Dotata di un pacchetto propulsori su misura e innovativo, un'impressionante gamma di misure difensive e una stiva considerevole, la Hermes è pronta a velocizzare le consegne verso le loro destinazioni finali. Persino verso punti di consegna pericolosi in cui altri trasportatori non oserebbero andare.\n\n--- STATS ---\nSCM: 180 m/s  |  Max: 1,200 m/s\nBoost: +370 m/s  /  -170 m/s\nCrew: 2  |  Length: 58.0m  |  Class: Trasporto  |  Role: Cargo medio\nInsurance: 11.18 min base  |  2.80 min express
vehicle_DescRSI_Mantis=Produttore: RSI\nFocus: Interdizione\n\nFerma le navi sul loro cammino con la principale nave Quantum Enforcement di RSI. La Mantis è dotata di un dispositivo di applicazione quantistica realizzato su misura da Wei-Tek, in grado di strappare le navi dal QT con il suo Quantum Snare e di impedire fughe affrettate con il suo Quantum Dampener.\n\n--- STATS ---\nSCM: 236 m/s  |  Max: 1,400 m/s\nBoost: +605 m/s  /  -257 m/s\nCrew: 1  |  Length: 30.0m  |  Class: Combattimento  |  Role: Interdizione\nInsurance: 6.48 min base  |  2.16 min express
vehicle_DescRSI_Meteor=Produttore: RSI\nFocus: Caccia Medio\n\nPalesando una seria potenza di fuoco, la Meteor è uno spettacolo che i nemici non vorranno vedere. Prendendo ispirazione dall'iconica Mantis, questa caccia pesante rinuncia all'applicazione quantistica e presenta invece due cannoni balistici S5 su misura e quattro rastrelliere per missili S4 a carico singolo; rendendo la Meteor una forza che può illuminare il cielo come una stella cadente.\n\n--- STATS ---\nSCM: 229 m/s  |  Max: 1,405 m/s\nBoost: +570 m/s  /  -235 m/s\nCrew: 1  |  Length: 30.0m  |  Class: Combattimento  |  Role: Caccia medio\nInsurance: 13.50 min base  |  4.50 min express
