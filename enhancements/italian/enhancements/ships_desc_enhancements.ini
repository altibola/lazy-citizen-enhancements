vehicle_DescCNOU_Mustang_Beta=Produttore: Consolidated Outland\nFocus:Pathfinder\n\nIl Mustang Beta, con la sua portata senza precedenti, è realizzato per voli di lunga durata. Il Tarsus Leaper Jump Engine standard di fabbrica consente alla Beta di viaggiare facilmente verso i sistemi più lontani della galassia, mentre gli esclusivi alloggi Com4T della nave faranno sembrare il viaggio come se non fossi mai uscito di casa.\n\n--- STATS ---\nSCM: 228 m/s  |  Max: 1,218 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Esplorazione  |  Role: Esplorazione\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 3.71 min base  |  1.24 min express
vehicle_DescCNOU_Mustang_Delta=Produttore: Consolidated Outland\nFocus:Light Fighter\n\nAnche se potrebbe non essere in grado di competere con alcune navi specifiche per l'esercito, rinforzando la già robusta struttura dello scafo della Mustang con le navi proprie di Consolidated Outland linea di armature a riduzione di massa di classe cavalleria, la Delta ha una caratteristica trasversale ridotta che uniforma il campo di gioco.\n\n--- STATS ---\nSCM: 226 m/s  |  Max: 1,195 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Combattimento  |  Role: Caccia leggero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 4.01 min base  |  1.34 min express
vehicle_DescCNOU_Mustang_Gamma=Produttore: Consolidated Outland\nFocus: corse\n\nI team di progettazione e ingegneria di Consolidated Outland sono riusciti a modificare e perfezionare la Mustang rendendola un'ammirevole vettura da corsa. Il risultato finale, il Mustang Gamma, ha un'accelerazione fluida e potenza su richiesta grazie a un pacchetto innovativo con tre potenti motori Magma Jet per la massima spinta.\n\n--- STATS ---\nSCM: 244 m/s  |  Max: 1,230 m/s\nBoost: +533 m/s  /  -273 m/s\nCrew: 1  |  Length: 21.5m  |  Class: Competizione  |  Role: Da gara\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 7.28 min base  |  2.43 min express
