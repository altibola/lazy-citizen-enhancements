vehicle_DescMISC_Freelancer=Produttore: MISC\nFocalizzazione: Trasporto Merci Leggero\n\nLe Freelancer sono utilizzate come navi mercantili a lungo raggio dalle principali corporazioni, ma sono altrettanto frequentemente riadattate come vascelli di esplorazione dedicati da capitani indipendenti che vogliono operare ai margini della galassia.\n\n--- STATS ---\nSCM: 197 m/s  |  Max: 1,050 m/s\nBoost: +400 m/s  /  -205 m/s\nCrew: 4  |  Length: 38.0m  |  Class: Trasporto  |  Role: Cargo leggero\nTurrets: 1  |  MRacks: 2× S3  2× S4\nShields: 3× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 10,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 41  |  E 43  |  D 0  |  T 0\nInsurance: 12.99 min base  |  4.33 min express
vehicle_DescMISC_Freelancer_DUR=Produttore: MISC\nFocus:Spedizione\n\nLa variante Freelancer DUR è specializzata nell'esplorazione. Sacrificare il 25% della capacità di carico della Freelancer standard per un sistema di salto potenziato, uno scanner più avanzato e un serbatoio di carburante ampliato può sembrare una cattiva scelta per alcuni, ma coloro che apprezzano la scoperta rispetto al profitto scopriranno che è la loro nave di riferimento. scelta.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +403 m/s  /  -205 m/s\nCrew: 4  |  Length: 38.0m  |  Class: Esplorazione  |  Role: Esplorazione\nTurrets: 1  |  MRacks: 2× S3  2× S4\nShields: 3× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 10,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 41  |  E 43  |  D 0  |  T 0\nInsurance: 12.99 min base  |  4.33 min express
