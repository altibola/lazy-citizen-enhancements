TheCollector_ShipMod_F7_Hornet_VehicleDesc=Produttore: Anvil Aerospace\nFocus: Caccia Medio\n\nPerfezionando il loro rinomato caccia di superiorità di classe militare con la tecnologia più aggiornata, Anvil Aerospace ha creato l'F7C-M Super Hornet Mk II, mantenendo il secondo sedile e la torretta sferica che rendevano l'originale un bersaglio davvero terrificante da ingaggiare.\n\nCiao, sono Wikelo. Ho apportato delle modifiche alla nave. Già impressionante, sì, ma l'ho resa ancora di più.\n\n--- STATS ---\nCrew: 2  |  Length: 24.0m  |  Class: Combattimento  |  Role: Caccia medio\nShields: S1\nInsurance: 10.17 min base  |  2.55 min express
TheCollector_ShipMod_MISC_Fortune_VehicleDesc=Produttore: MISC\nFocus: Recupero\n\nPer coloro che sono pronti a elevare la propria professione al livello successivo, gli ingegneri di MISC hanno accuratamente realizzato la Fortune come la migliore nave di recupero di piccole dimensioni della sua categoria. Dotata di un braccio di recupero versatile e di un elevatore di carico, la MISC Fortune è costruita dalle traverse per trasformare i rifiuti in tesori.\n\nCiao, sono Wikelo. Ti piace trovare cose per fare altre cose. Anche a me. Questa nave è molto buona per quello. Wikelo l'ha resa un po' migliore.\n\n--- STATS ---\nCrew: 1  |  Length: 26.5m  |  Class: Industriale  |  Role: Recupero relitti leggero\nArmor HP: 4,114\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 10  |  D 0  |  T 0\nInsurance: 5.18 min base  |  1.30 min express
TheCollector_ShipMod_MRAI_GuardianQI_VehicleDesc=Produttore: Mirai\nFocus: Interdizione\n\nNon è troppo sorprendente che gli ostili possano fuggire quando si trovano di fronte a un potente avversario, ma grazie alle sue capacità di smorzamento quantistico, la Mirai Guardian QI assicura che i tuoi nemici non saranno in grado di combattere un altro giorno. Prendendo le migliori caratteristiche della Guardian base, gli ingegneri di Mirai hanno reso la variante QI il complemento ideale per qualsiasi forza protettiva.\n\nWikelo apprezza molto la nave. Dovevo entrarci e giocarci un po'. Ho aggiunto parti per renderla ancora più utile. Divertiti.\n\n--- STATS ---\nCrew: 1  |  Length: 24.3m  |  Class: Combattimento  |  Role: Interdizione\nInsurance: 12.00 min base  |  3.00 min express
TheCollector_ShipMod_MRAI_Pulse_VehicleDesc=Produttore: Mirai\nFocus: Combattimento\n\nGli ingegneri di Mirai si sono prefissati di creare una moto a cielo aperto capace di qualcosa di più. Una connessione più intima tra pilota e prestazioni con una silhouette aderente. Un modo più intuitivo per domare paesaggi formidabili con un sistema grav-lev reattivo. Un'esperienza di combattimento più intelligente con un'arma personalizzata completamente integrata nello spirito del veicolo. Il risultato finale? La Mirai Pulse.\n\nWikelo ha trascorso molti battiti sul pianeta andando veloce. Ho apportato alcune modifiche in modo che anche tu possa andare veloce. Ti piacerà.\n\n--- STATS ---\nCrew: 1  |  Length: 3.5m  |  Class: Combattimento  |  Role: Esplorazione\nArmor HP: 1,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 6  |  E 4  |  D 0  |  T 0\nInsurance: 0.15 min base  |  0.05 min express
