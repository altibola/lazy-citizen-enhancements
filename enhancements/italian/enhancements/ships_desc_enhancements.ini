vehicle_DescESPR_Stinger=Produttore: Esperia\nSpecializzazione: Caccia Pesante\n \nSeminando il panico lungo i sistemi di confine dell'Umanità, questo caccia pesante Vanduul, designato 'Stinger' dalla Marina della UEE, si è guadagnato un'eredità intrisa di sangue come una grande minaccia sia per i piloti che per le navi ammiraglie. Originariamente destinata all'addestramento degli squadroni aggressori, Esperia sta ora rendendo disponibile la sua replica dettagliata alla popolazione civile in generale. \n\n\n--- STATS ---\nSCM: 207 m/s  |  Max: 1,050 m/s\nBoost: +440 m/s  /  -230 m/s\nCrew: 1  |  Length: 36.0m  |  Class: Combattimento  |  Role: Caccia pesante\nInsurance: 25.30 min base  |  6.30 min express
vehicle_DescESPR_Talon=Produttore: Esperia\nFocus: caccia leggero\n\nLa Talon rappresenta il continuo impegno di Esperia per preservare i progetti di navi Tevarin storicamente significativi. Una nave da combattimento manovrabile monoposto con armatura leggera ma potenti scudi direzionali "Falange", la Talon è fatta per colpire per prima e colpire duramente prima di usare gli scudi per coprire la sua fuga.\n\n--- STATS ---\nSCM: 225 m/s  |  Max: 1,190 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 24.0m  |  Class: Combattimento  |  Role: Caccia leggero\nCoolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 8  |  E 10  |  D 0  |  T 0\nInsurance: 11.34 min base  |  3.78 min express
vehicle_DescESPR_Talon_Shrike=Produttore: Esperia\nFocus: caccia leggero\n\nLa Talon rappresenta il continuo impegno di Esperia per preservare i progetti di navi Tevarin storicamente significativi. Una nave da combattimento manovrabile monoposto con armatura leggera ma potenti scudi direzionali "Falange", la Talon è fatta per colpire per prima e colpire duramente prima di usare gli scudi per coprire la sua fuga. Il famigerato modello della variante Shrike è armato con portamissili interni aggiuntivi.\n\n--- STATS ---\nSCM: 225 m/s  |  Max: 1,190 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 24.0m  |  Class: Combattimento  |  Role: Caccia leggero\nCoolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,000\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 8  |  E 10  |  D 0  |  T 0\nInsurance: 11.34 min base  |  3.78 min express
vehicle_DescGAMA_Syulen=Produttore: Gatac Manufacture\nFocalizzazione: Iniziale / Esploratore\n\nIl vascello cargo Syulen è stato abilmente realizzato dalla rinomata House Gatac per essere adatto sia ai piloti Umani che a quelli Xi'an. Con un telaio agile e raffinato, la Syulen si presta a traghettare importanti consegne attraverso l'universo, o come nave ideale per coloro che fanno il loro debutto nella carriera dei trasporti.\n\n--- STATS ---\nSCM: 225 m/s  |  Max: 1,175 m/s\nBoost: +450 m/s  /  -230 m/s\nCrew: 1  |  Length: 25.0m  |  Class: Multiruolo  |  Role: Starter / Esplorazione\nShields: 2× S1  |  Coolers: S1  |  Power: S1  |  QD: S1\nArmor HP: 4,352\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 2.95 min base  |  1.10 min express
