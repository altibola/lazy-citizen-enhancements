vehicle_DescCRUS_Star_Runner=Produttore: Crusader Industries\nFocus: trasporto medio\n\nSe ne hai bisogno lì velocemente e indenne, la Mercury soddisfa tutte le esigenze che ci si aspetta da una nave corriere affidabile e anche di più. Costruito con gli stessi principi ingegneristici e di progettazione che hanno reso Crusader Industries il produttore di riferimento per il trasporto galattico su qualsiasi scala, Mercury Star Runner ti consentirà di stare al passo con i tempi, i problemi e la concorrenza.\n\n--- STATS ---\nSCM: 217 m/s  |  Max: 1,300 m/s\nBoost: +510 m/s  /  -218 m/s\nCrew: 3  |  Length: 51.0m  |  Class: Trasporto  |  Role: Cargo medio\nInsurance: 21.00 min base  |  7.00 min express
