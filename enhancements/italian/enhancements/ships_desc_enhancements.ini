vehicle_DescDRAK_Golem=Produttore: Drake Interplanetary\nFocalizzazione: Iniziale / Estrazione Leggera\n\nCon la Golem, la Drake ha progettato la nave ideale per chi è interessato a iniziare una carriera mineraria. La nave dispone di un laser minerario su misura e la capacità di trasportare 32 SCU di risorse preziose. Nel classico stile Drake, la Golem è una nave costruita appositamente che dà priorità alla funzione rispetto ai fronzoli.\n\n--- STATS ---\nSCM: 203 m/s  |  Max: 1,010 m/s\nBoost: +280 m/s  /  -210 m/s\nCrew: 1  |  Length: 7.0m  |  Class: Industriale  |  Role: Starter / Estrazione Leggera\nInsurance: 3.00 min base  |  0.75 min express
vehicle_DescDRAK_Golem_Battaglia=Produttore: Drake Interplanetary\nFocus: Iniziale / Estrazione Leggera\n\nCon la Golem, la Drake ha progettato la nave ideale per chi è interessato a intraprendere una carriera mineraria. La nave dispone di un laser minerario su misura e la capacità di trasportare 32 SCU di preziose risorse. Nel classico stile Drake, la Golem è una nave costruita per uno scopo che dà priorità alla funzione rispetto ai fronzoli.\n\nQuesta Golem mostra il tuo sostegno alla causa della People's Alliance nella costruzione di un futuro migliore in Nyx con una livrea unica e parti riutilizzate.\n\n--- STATS ---\nCrew: 1  |  Length: 7.0m  |  Class: Industriale  |  Role: Starter / Estrazione Leggera\nInsurance: 3.00 min base  |  0.75 min express
vehicle_DescDRAK_Golem_Collector_Indust=Produttore: Drake Interplanetary\nFocalizzazione: Iniziale / Estrazione Leggera\n\nCon la Golem, la Drake ha progettato la nave ideale per chi è interessato a iniziare una carriera mineraria. La nave dispone di un laser minerario su misura e la capacità di trasportare 32 SCU di risorse preziose. Nel classico stile Drake, la Golem è una nave costruita appositamente che dà priorità alla funzione rispetto ai fronzoli.\n\nWikelo qui. Fatto modifiche utili per rendere la nave ancora più industriosa. Ti piacerà.\n\n--- STATS ---\nCrew: 1  |  Length: 7.0m  |  Class: Industriale  |  Role: Starter / Estrazione Leggera\nInsurance: 3.00 min base  |  0.75 min express
vehicle_DescDRAK_Golem_OX=Produttore: Drake Interplanetary\nFocalizzazione: Trasporto Merci Leggero\n \nCon la Golem OX, la Drake ha trasformato l'affidabile cavallo di battaglia nel vascello cargo ideale per il trasporto di rifornimenti e attrezzature. Realizzata per i piloti che preferiscono la funzione ai fronzoli, la OX raddoppia la capacità dell'originale con spazio per 64 SCU e dispone di un raggio traente per rendere i trasferimenti di merci lisci come la seta.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,000 m/s\nBoost: +280 m/s  /  -210 m/s\nCrew: 1  |  Length: 7.0m  |  Class: Industriale  |  Role: Cargo leggero\nInsurance: 3.00 min base  |  0.75 min express
vehicle_DescDRAK_Golem_Teach=Produttore: Drake Interplanetary\nFocalizzazione: Iniziale / Estrazione Leggera\n\nCon la Golem, la Drake ha progettato la nave ideale per chi è interessato a iniziare una carriera mineraria. La nave dispone di un laser minerario su misura e la capacità di trasportare 32 SCU di risorse preziose. Nel classico stile Drake, la Golem è una nave costruita appositamente che dà priorità alla funzione rispetto ai fronzoli.\n\nPer far fronte alle difficili condizioni di lavoro di Nyx, il Teach's Ship Shop ha equipaggiato questa edizione speciale con un equipaggiamento personalizzato dotato di componenti robusti in modo da poter affrontare meglio il lavoro da svolgere.\n\n--- STATS ---\nCrew: 1  |  Length: 7.0m  |  Class: Industriale  |  Role: Starter / Estrazione Leggera\nInsurance: 3.00 min base  |  0.75 min express
vehicle_DescDRAK_Herald=Produttore: Drake Interplanetary\nFocus:Dati medi\n\nLa Drake Herald è una piccola nave corazzata progettata per ottenere informazioni in sicurezza dal punto A al punto B. Dotata di un potente motore centrale (per il transito ad alta velocità e per generare la necessaria per un'efficace crittografia/contenimento dei dati), un software di crittografia avanzato e un nucleo informatico corazzato, Herald è unico tra i veicoli spaziali personali in quanto è progettato per essere facilmente "pulito" in caso di pericolo di cattura.\n\n--- STATS ---\nSCM: 245 m/s  |  Max: 1,450 m/s\nBoost: +670 m/s  /  -260 m/s\nCrew: 1  |  Length: 24.8m  |  Class: Trasporto  |  Role: Hacking medio\nInsurance: 2.02 min base  |  0.68 min express
vehicle_DescDRAK_Ironclad=Produttore: Drake Interplanetary\nFocus: Trasporto merci pesante\n \nL'universo è diventato sempre più pericoloso e il semplice tentativo di guadagnarsi da vivere è diventato un affare potenzialmente letale. Ecco perché Drake ha costruito il cargo più robusto per volare sulle rotte di navigazione armato di una serie intimidatoria di torrette, una generosa stiva di carico e un comodo raggio traente.\n\n--- STATS ---\nSCM: 110 m/s  |  Max: 900 m/s\nBoost: +290 m/s  /  -130 m/s\nCrew: 7  |  Length: 117.0m  |  Class: Trasporto  |  Role: Cargo pesante\nInsurance: 18.00 min base  |  6.00 min express
vehicle_DescDRAK_Ironclad_Assault=Produttore: Drake Interplanetary\nFocalizzazione: Nave da Sbarco\n \nQuando la consegna speciale che devi fare è un'incursione in piena regola, hai bisogno della Drake Ironclad Assault. Non solo può ospitare più veicoli terrestri nella sua stiva, ha torrette lungo la parte inferiore per spianare la strada per lo sbarco, e persino un vano di fabbricazione per riparazioni di emergenza.\n\n--- STATS ---\nSCM: 130 m/s  |  Max: 940 m/s\nBoost: +320 m/s  /  -150 m/s\nCrew: 7  |  Length: 117.0m  |  Class: Combattimento  |  Role: Nave da Sbarco Pesante\nInsurance: 18.00 min base  |  6.00 min express
vehicle_DescDRAK_Pitbull=Produttore: Drake Interplanetary\nFocus: Caccia Parassita\n\nUna macchina da combattimento snella e cattiva. Il Pitbull combina le manovre ad alta velocità con la pura potenza di fuoco per offrirti un colosso che colpisce duro, il tutto in un piccolo pacchetto per pilota singolo.\n\n--- STATS ---\nSCM: 232 m/s  |  Max: 1,275 m/s\nBoost: +555 m/s  /  -270 m/s\nCrew: 1  |  Length: 6.0m  |  Class: Caccia piccolo  |  Role: Caccia piccolo\nInsurance: 2.00 min base  |  0.60 min express
vehicle_DescDRAK_Vulture=Produttore: Drake Interplanetary\nFocus: recupero leggero\n\nNon rispondere a nessuno, elimina gli intermediari e getta al vento la prudenza. Strappa i relitti come un professionista e ritagliati il ??tuo posto nel grande vuoto dietro il bastone di questa rozza e robusta macchina di salvataggio di Drake Interplanetary.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +350 m/s  /  -240 m/s\nCrew: 1  |  Length: 34.0m  |  Class: Industriale  |  Role: Recupero relitti leggero\nShields: 3× S1  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 6,732\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 18  |  E 16  |  D 0  |  T 0\nInsurance: 9.00 min base  |  3.00 min express
vehicle_DescDRAK_Vulture_Teach=Produttore: Drake Interplanetary\nFocus: Recupero Leggero\n\nNon rispondere a nessuno, elimina l'intermediario e getta la cautela al vento. Distruggi relitti come un professionista e ritagliati il tuo posto nel grande vuoto al comando di questa macchina da recupero ruvida e robusta della Drake Interplanetary.\n\nPer far fronte alle difficili condizioni di lavoro di Nyx, il Teach's Ship Shop ha equipaggiato questa edizione speciale con un allestimento personalizzato caratterizzato da componenti robusti, in modo che tu possa affrontare al meglio il lavoro da svolgere.\n\n--- STATS ---\nCrew: 1  |  Length: 34.0m  |  Class: Industriale  |  Role: Recupero relitti leggero\nShields: 3× S1  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 6,732\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 18  |  E 16  |  D 0  |  T 0\nInsurance: 9.00 min base  |  3.00 min express
vehicle_DescESPR_Blade=Produttore: Clan Vanduul\nFocus: Caccia leggero\n\nQuesti caccia leggeri, con la designazione 'Blade', sono spesso usati dai Vanduul come esploratori e velivoli d'assalto della prima ondata. Hanno anche svolto bene il ruolo di schermagliatori grazie alla loro velocità che permette loro di inseguire qualsiasi nave che tenti di fuggire dall'area. Per alcuni decenni, gli squadroni aggressori dell'Impero Unito della Terra hanno operato repliche dei caccia Blade prodotti sotto contratto esclusivo da Esperia, Inc.\n\n--- STATS ---\nSCM: 227 m/s  |  Max: 1,191 m/s\nBoost: +500 m/s  /  -260 m/s\nCrew: 1  |  Length: 20.5m  |  Class: Combattimento  |  Role: Caccia leggero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 7  |  D 0  |  T 0\nInsurance: 10.33 min base  |  3.44 min express
vehicle_DescESPR_Glaive=Produttore: Esperia\nFocus: Caccia medio\n\nIl Glaive è una versione simmetrica dello Scythe. Generalmente pilotato da Vanduul con più esperienza di combattimento, è meglio armato e ha due enormi lame/ali invece di una sola come nello Scythe standard.\n\n--- STATS ---\nSCM: 218 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -230 m/s\nCrew: 1  |  Length: 33.0m  |  Class: Combattimento  |  Role: Caccia medio\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 6,600\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 22  |  E 14  |  D 0  |  T 0\nInsurance: 7.59 min base  |  2.53 min express
vehicle_DescESPR_Prowler=Produttore: Esperia\nFocalizzazione: Nave da Sbarco\n\nPrendendo il nome dalla designazione militare dell'UPE, la Prowler è una versione modernizzata della famigerata nave da abbordaggio Tevarin della Prima Guerra Tevarin. L'efficacia della Prowler come veicolo per il rapido dispiegamento del personale era dovuta principalmente alla sua silenziosità. Con la Prowler, troverai la perfetta fusione di due culture: l'eleganza e l'efficacia della macchina da guerra Tevarin combinate con l'affidabilità della moderna tecnologia UEE.\n\n--- STATS ---\nSCM: 212 m/s  |  Max: 1,200 m/s\nBoost: +450 m/s  /  -240 m/s\nCrew: 2  |  Length: 34.0m  |  Class: Combattimento  |  Role: Nave da Sbarco\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 12,150\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 32  |  E 39  |  D 0  |  T 0\nInsurance: 23.22 min base  |  7.74 min express
vehicle_DescESPR_Prowler_Utility=Produttore: Esperia\nFocalizzazione: Trasporto Merci Leggero\n\nSebbene non esistano esemplari noti di fabbricazione Tevarin di questa nave storica, gli storici di Esperia hanno studiato i rapporti sul campo dell'esercito dell'UPE dell'epoca per ricostruire questa Prowler modificata. Utilizzata dall'esercito Tevarin per consegnare i rifornimenti urgentemente necessari in prima linea, la Prowler Utility abbina un raggio traente con una stiva completamente accessibile, insieme agli armamenti ancora significativi della nave da guerra, per rendere il trasferimento delle merci in condizioni di campo di battaglia un'operazione di precisione.\n\n--- STATS ---\nSCM: 208 m/s  |  Max: 1,110 m/s\nBoost: +437 m/s  /  -240 m/s\nCrew: 2  |  Length: 34.0m  |  Class: Trasporto  |  Role: Cargo leggero\nShields: 2× S2  |  Coolers: 2× S2  |  Power: S2  |  QD: S2\nArmor HP: 12,150\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 32  |  E 39  |  D 0  |  T 0\nInsurance: 21.00 min base  |  5.25 min express
