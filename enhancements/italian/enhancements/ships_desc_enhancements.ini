vehicle_DescANVL_Terrapin=Produttore: Anvil Aerospace\nFocus:Pathfinder\n\nPresentazione della nave da scansione/esplorazione di classe Anvil Aerospace U4A-3 Terrapin. La Terrapin fu sviluppata verso la fine del 28° secolo per servire come prima nave nella ristrutturazione difensiva della Marina da parte dell'Impero. La parola d'ordine del Terrapin è protezione, con ampi sistemi di scudi e strati di armatura progettati per fornire la massima difesa possibile al pilota e all'equipaggio. Sebbene non abbia la manovrabilità di un combattente dedicato, mantiene una gamma di armi avanzate e potenti destinate a tenere a bada il più temibile predone Vanduul.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,150 m/s\nBoost: +320 m/s  /  -240 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Supporto  |  Role: Esplorazione\nInsurance: 7.88 min base  |  2.62 min express
vehicle_DescANVL_Terrapin_Medic=Produttore: Anvil Aerospace\nFocus: Medical\n\nMantenendo la famosa robustezza del Terrapin originale, i progettisti Anvil hanno creato un veicolo ottimale per le operazioni di soccorso con il Terrapin Medic. Dotato di un letto medico di livello 2, il Terrapin Medic può estrarre i feriti anche dalle situazioni più pericolose grazie alla sua potente armatura e schermatura.\n\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,150 m/s\nBoost: +320 m/s  /  -240 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Supporto  |  Role: Soccorso\nInsurance: 9.50 min base  |  2.38 min express
vehicle_DescANVL_Terrapin_Medic_Collector_Medic=Produttore: Anvil Aerospace\nSpecializzazione: Medica\n\nMantenendo la proverbiale robustezza della Terrapin originale, i progettisti della Anvil hanno realizzato un veicolo ottimale per le operazioni di soccorso con la Terrapin Medic. Dotata di un lettino medico di livello 2, la Terrapin Medic può estrarre feriti anche dalle situazioni più pericolose grazie alla sua potente corazza e ai suoi scudi.\n\nSono Wikelo. Fatto modifiche utili per rendere la nave anche migliore, così che possiate fare più guarigioni.\n\n--- STATS ---\nCrew: 1  |  Length: 20.0m  |  Class: Supporto  |  Role: Soccorso\nInsurance: 9.50 min base  |  2.38 min express
vehicle_DescANVL_Valkyrie_CitizenCon=Produttore: Anvil Aerospace \nFocalizzazione: Nave da Sbarco\n\nPer oltre un secolo, le navi Anvil si sono distinte in innumerevoli operazioni di combattimento civili e militari. Onora quella fiera tradizione di sicurezza con la Valkyrie in edizione limitata Liberator Edition, caratterizzata da un pacchetto livrea esclusivo che commemora il debutto della nave al CitizenCon 2948.\n\n--- STATS ---\nCrew: 5  |  Length: 48.0m  |  Class: Combattimento  |  Role: Nave da Sbarco\nTurrets: 7\nShields: 2× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 23,760\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 139  |  E 88  |  D 0  |  T 0\nInsurance: 19.82 min base  |  4.98 min express
vehicle_DescARGO_MOTH=Produttore: Argo Astronautics\nFocalizzazione: Recupero Medio\n\nSperimenta i secoli di esperienza industriale di Argo con la MOTH. Utilizzando un telaio collaudato come base, la MOTH presenta tre torrette di recupero dedicate e un caricatore automatico di recupero esterno, in modo che un equipaggio di quattro persone possa smontare, strappare e stoccare i rottami alla stessa velocità con cui riescono ad arrivarci.\n\n--- STATS ---\nSCM: 140 m/s  |  Max: 960 m/s\nBoost: +340 m/s  /  -150 m/s\nCrew: 4  |  Length: 0.0m  |  Class: Industriale  |  Role: Recupero medio\nInsurance: 12.50 min base  |  3.13 min express
vehicle_DescARGO_MPUV=Produttore: Argo Astronautics\nFocus: trasporto leggero\n\nLa Argo Astronautics MPUV Cargo è una nave mercantile dedicata al trasferimento. Un onnipresente stivatore intergalattico, un gran numero di MPUV Cargos sono responsabili del carico e dello scarico di merci su navi che altrimenti non potrebbero atterrare su pianeti o bacini di carenaggio, come la Hull D e la Orion. Alcuni capitani di trasportatori scelgono di possedere e gestire la propria Argo, mentre altri preferiscono contrattare con i proprietari locali di Argo che si trovano in molti dei porti più trafficati.\n\n--- STATS ---\nSCM: 170 m/s  |  Max: 890 m/s\nBoost: +360 m/s  /  -140 m/s\nCrew: 1  |  Length: 10.5m  |  Class: Trasporto  |  Role: Cargo leggero\nShields: S1  |  Coolers: 2× S0  |  Power: S0\nArmor HP: 1,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.17 min base  |  0.00 min express
vehicle_DescARGO_MPUV_Tractor=Produttore: Argo Astronautics\nFocalizzazione: Trasporto Merci Leggero\n\nL'Argo Astronautics MPUV-1T è dotato di un raggio traente per consentirgli di spostare agevolmente i container merci da e verso vascelli da trasporto più grandi. Le sue dimensioni ridotte e la sua manovrabilità lo rendono un veicolo di supporto ideale nelle zone di atterraggio e nelle stazioni spaziali.\n\n--- STATS ---\nSCM: 175 m/s  |  Max: 895 m/s\nBoost: +365 m/s  /  -145 m/s\nCrew: 1  |  Length: 10.5m  |  Class: Trasporto  |  Role: Cargo leggero\nTurrets: 1\nShields: S1  |  Coolers: S0  |  Power: S0\nArmor HP: 1,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.17 min base  |  0.00 min express
vehicle_DescARGO_MPUV_Transport=Produttore: Argo Astronautics\nFocalizzazione: Passeggeri\n\nL'Argo Astronautics MPUV-1P (comunemente 'Argo Personnel'). Questa versione dell'Argo è orientata verso una responsabilità semplice ma incredibilmente importante: spostare gruppi di persone da un posto all'altro. La Marina dell'UEE usa ampiamente gli MPUV-1P, e qualsiasi nuova recluta può probabilmente ricordare quei terrificanti momenti in cui tale nave li ha portati al loro primo incarico spaziale. Nelle mani dei civili, le navi Argo Personnel sono adattate per tutto, dai servizi taxi standard all'uso come navi da sbarco da combattimento di fortuna. L'Argo MPUV-1P è in grado di trasportare fino a otto umani e il loro equipaggiamento.\n\n--- STATS ---\nSCM: 170 m/s  |  Max: 890 m/s\nBoost: +360 m/s  /  -140 m/s\nCrew: 1  |  Length: 10.5m  |  Class: Trasporto  |  Role: Passeggeri\nShields: S1  |  Coolers: 2× S0  |  Power: S0\nArmor HP: 1,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.68 min base  |  0.23 min express
vehicle_DescARGO_Mole=Produttore: Argo Astronautics\nFocalizzazione: Estrazione Media\n\nL'iconico estrattore laser multi-operatore di Argo, più comunemente noto come MOLE, ti consente di lavorare in modo più veloce ed efficace che mai, grazie al suo sistema di estrazione trilaterale brevettato. Tre stazioni di estrazione articolate e controllate indipendentemente consentono la massima potenza e una versatilità quasi illimitata. La MOLE vive del detto "molte mani rendono il lavoro leggero".\n\n--- STATS ---\nSCM: 140 m/s  |  Max: 960 m/s\nBoost: +340 m/s  /  -150 m/s\nCrew: 4  |  Length: 45.0m  |  Class: Industriale  |  Role: Mining medio\nShields: S3  |  Coolers: S3  |  Power: S3  |  QD: S2\nArmor HP: 11,220\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 45  |  E 40  |  D 0  |  T 0\nInsurance: 13.50 min base  |  4.50 min express
vehicle_DescARGO_Mole_Battaglia=Produttore: Argo Astronautics\nFocus: Estrazione Media\n\nL'iconico estrattore laser multi-operatore della Argo, più comunemente noto come MOLE, ti consente di lavorare più velocemente e in modo più efficace che mai, grazie al suo sistema di estrazione trilaterale brevettato. Tre stazioni di estrazione articolate controllate in modo indipendente consentono la massima potenza e una versatilità quasi illimitata. La MOLE vive del detto "molte mani rendono il lavoro leggero".\n\nQuesta MOLE mostra il tuo sostegno alla causa della People's Alliance nella costruzione di un futuro migliore in Nyx con una livrea unica e parti riutilizzate.\n\n--- STATS ---\nCrew: 4  |  Length: 45.0m  |  Class: Industriale  |  Role: Mining medio\nArmor HP: 11,220\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 45  |  E 40  |  D 0  |  T 0\nInsurance: 13.50 min base  |  4.50 min express
vehicle_DescARGO_Mole_Teach=Produttore: Argo Astronautics\nFocalizzazione: Estrazione Media\n\nL'iconico estrattore laser multi-operatore di Argo, più comunemente noto come MOLE, ti consente di lavorare in modo più veloce ed efficace che mai, grazie al suo sistema di estrazione trilaterale brevettato. Tre stazioni di estrazione articolate e controllate indipendentemente consentono la massima potenza e una versatilità quasi illimitata. La MOLE vive del detto "molte mani rendono il lavoro leggero".\n\nPer far fronte alle difficili condizioni di lavoro di Nyx, il Teach's Ship Shop ha equipaggiato questa edizione speciale con un equipaggiamento personalizzato dotato di componenti robusti in modo da poter affrontare meglio il lavoro da svolgere.\n\n--- STATS ---\nCrew: 4  |  Length: 45.0m  |  Class: Industriale  |  Role: Mining medio\nShields: S3  |  Coolers: S3  |  Power: S3  |  QD: S2\nArmor HP: 11,220\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 45  |  E 40  |  D 0  |  T 0\nInsurance: 13.50 min base  |  4.50 min express
vehicle_DescARGO_RAFT=Produttore: Argo Astronautics\nFocalizzazione: Trasporto Merci Medio\n\nL'Argo RAFT presenta una capiente stiva cargo da 192 SCU, ed è in grado di trasportare container merci standardizzati da 32 SCU. Perfetto sia per i trasportatori alle prime armi che per i vecchi professionisti, il RAFT è una soluzione ideale per un trasporto merci locale affidabile.\n\n--- STATS ---\nSCM: 140 m/s  |  Max: 990 m/s\nBoost: +340 m/s  /  -150 m/s\nCrew: 2  |  Length: 39.5m  |  Class: Trasporto  |  Role: Cargo medio\nInsurance: 14.00 min base  |  2.00 min express
vehicle_DescARGO_RAFT_Collector_Indust=Produttore: Argo Astronautics\nFocalizzazione: Trasporto Merci Medio\n\nL'Argo RAFT presenta una capiente stiva cargo da 192 SCU, ed è in grado di trasportare container merci standardizzati da 32 SCU. Perfetto sia per i trasportatori alle prime armi che per i vecchi professionisti, il RAFT è una soluzione ideale per un trasporto merci locale affidabile.\n\nWikelo qui. Fatto modifiche utili per rendere la nave ancora più industriosa. Ti piacerà.\n\n--- STATS ---\nCrew: 2  |  Length: 39.5m  |  Class: Trasporto  |  Role: Cargo medio\nInsurance: 14.00 min base  |  2.00 min express
vehicle_DescARGO_SRV=Produttore: Argo Astronautics\nFocalizzazione: Recupero\n\nQuando si tratta di portare a termine il lavoro, Argo non scherza. Dal semplice trasporto merci e traino cargo fino alle strazianti operazioni di ricerca e soccorso, l'SRV gestisce qualsiasi cosa tu possa lanciargli contro. Il sistema traente su misura utilizza un'innovativa combinazione di piastra e braccio, consentendo un uso in solitaria senza sforzo e un traino di squadra di precisione per i lavori più grandi. Anche il tuo equipaggio e i tuoi passeggeri rimangono al sicuro grazie a scudi resistenti e armature pesanti che mantengono l'abitacolo e i componenti al sicuro quando la situazione si fa complicata.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,100 m/s\nBoost: +460 m/s  /  -235 m/s\nCrew: 1  |  Length: 31.5m  |  Class: Supporto  |  Role: Recupero\nShields: S2  |  Coolers: S2  |  Power: S2  |  QD: S2\nArmor HP: 3,740\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 10  |  E 9  |  D 0  |  T 0\nInsurance: 13.22 min base  |  4.75 min express
vehicle_DescBanu_Defender=Produttore: Banu\nFocus:Light Fighter\n\nTi presentiamo il Banu Defender, un caccia a equipaggio multiplo il cui design patchwork mette in risalto la tecnologia di una varietà di specie. Dotato di sistemazioni modeste per l'equipaggio e di facile accesso ai componenti, il Defender prende il nome dal ruolo che svolge: la prima linea di difesa contro gli attacchi nemici. Ecco perché il Defender è il compagno ideale del Merchantman: uno per i trasporti pesanti e l'altro per i letali combattimenti aerei.\n\n--- STATS ---\nSCM: 222 m/s  |  Max: 1,175 m/s\nBoost: +480 m/s  /  -255 m/s\nCrew: 2  |  Length: 24.5m  |  Class: Combattimento  |  Role: Caccia leggero\nMRacks: 2× S3\nShields: S2  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 5,400\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 20  |  E 16  |  D 0  |  T 0\nInsurance: 13.61 min base  |  4.54 min express
