vehicel_DescANVL_Valkyrie=Produttore: Anvil Aerospace \nFocalizzazione: Nave da Sbarco\n\nLa Valkyrie alza la posta in gioco per il trasporto truppe. Progettata per trasportare fino a venti soldati, così come veicoli, nei luoghi più ostili, questo veicolo con specifiche militari pronto al conflitto è una forza formidabile, sia in fase offensiva che difensiva. Costruita pensando agli appaltatori della difesa militari e privati, la Valkyrie è uno dei trasporti passeggeri più efficienti ed efficaci della sua classe.\n\n--- STATS ---\nSCM: 207 m/s  |  Max: 1,110 m/s\nBoost: +431 m/s  /  -245 m/s\nCrew: 5  |  Length: 48.0m  |  Class: Combattimento  |  Role: Nave da Sbarco\nTurrets: 6\nShields: 2× S2  |  Coolers: 2× S2  |  Power: 2× S2  |  QD: S2\nArmor HP: 23,760\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 139  |  E 88  |  D 0  |  T 0\nInsurance: 19.82 min base  |  4.98 min express
vehicl_DescMISC_Hull_B=Produttore: MISC\nFocalizzazione: Trasporto Merci Medio\n\nLa MISC Hull B è un'opzione robusta per i piloti in cerca di un trasporto merci dedicato. Sebbene non sia grande quanto alcuni degli altri modelli della serie Hull, il profilo più piccolo della Hull B offre una maggiore flessibilità e più opzioni di accesso.\n\n--- STATS ---\nSCM: 145 m/s  |  Max: 960 m/s\nBoost: +340 m/s  /  -180 m/s\nCrew: 2  |  Length: 71.0m  |  Class: Trasporto  |  Role: Cargo medio\nInsurance: 11.66 min base  |  2.85 min express
vehicle_DescAEGS_Avenger_Stalker=Produttore: Aegis Dynamics\nFocalizzazione: Intercettatore\n\nInizialmente progettata come nave da trasporto di prima linea dell'Aegis per i militari, l'Avenger Stalker ha preso una strada diversa, avendo infine una lunga e celebre carriera come pattugliatore standard dell'Advocacy dell'UEE. Utilizzando la sua stiva per il trasporto di prigionieri, l'Avenger presenta uno scafo robusto e affidabile e la capacità per supporti motore più grandi del previsto.\n\n--- STATS ---\nSCM: 262 m/s  |  Max: 1,425 m/s\nBoost: +610 m/s  /  -280 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Combattimento  |  Role: Intercettore\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,232\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.86 min base  |  1.62 min express
vehicle_DescAEGS_Avenger_Titan=Produttore: Aegis Dynamics\nFocus:Trasporti leggeri\n\nIn mancanza delle celle di prigionia dello Stalker o del generatore EMP dello Stregone, la stiva del Titano è libera di trasportare merci. Abbina lo spazio disponibile alle comprovate e vere abilità di combattimento del Avenger e otterrai un trasportatore di merci leggere che è più che in grado di gestire se stesso in un combattimento.\n\n--- STATS ---\nSCM: 262 m/s  |  Max: 1,425 m/s\nBoost: +610 m/s  /  -280 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Trasporto  |  Role: Cargo leggero\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,640\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.05 min base  |  1.35 min express
vehicle_DescAEGS_Avenger_Titan_Renegade=Produttore: Aegis Dynamics\nFocus:Â Light Freight\n\nCreato come parte della serie "Masters of Flight" insieme al simulatore di volo Arena Commander, il Renegade rende omaggio al famoso pilota Danny Solomon per il suo notevole lavoro con l'Avvocatura per portare giustizia a Brema. Questo Avenger Titan è dotato di un equipaggiamento specializzato incentrato sul combattimento aereo e di una livrea in edizione speciale personalizzata in onore di questa nave iconica.\n\n--- STATS ---\nCrew: 1  |  Length: 20.0m  |  Class: Trasporto  |  Role: Cargo leggero\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,640\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.05 min base  |  1.35 min express
vehicle_DescAEGS_Avenger_Warlock=Produttore: Aegis Dynamics\nFocus:Interdizione\n\nAvenger Warlock è stato costruito secondo un'unica filosofia di progettazione: fermare le navi, non distruggerle. Probabilmente il più vicino a un combattente non letale, lo Stregone è dotato di un generatore EMP Behring REP-8, in grado di emettere una potente onda elettromagnetica per disabilitare qualsiasi dispositivo elettronico così sfortunato da trovarsi nel raggio dell'esplosione.\n\n--- STATS ---\nSCM: 262 m/s  |  Max: 1,425 m/s\nBoost: +610 m/s  /  -280 m/s\nCrew: 1  |  Length: 20.0m  |  Class: Combattimento  |  Role: Interdizione\nGuns: 2× S1 (empty)  |  MRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,640\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 4.86 min base  |  1.62 min express
vehicle_DescAEGS_Eclipse=Produttore: Aegis Dynamics\nNovità:Bombardiere Stealth\n\nIl Aegis Eclipse è un bombardiere progettato per entrare e colpire prima ancora di essere individuato. Dopo un lungo servizio presso l'UEE, questo equipaggiamento militare ad alta tecnologia fece il suo debutto sul mercato civile nel 2947.\n\n--- STATS ---\nSCM: 210 m/s  |  Max: 1,100 m/s\nBoost: +510 m/s  /  -215 m/s\nCrew: 1  |  Length: 24.5m  |  Class: Combattimento  |  Role: Bombardiere stealth\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,464\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 16.54 min base  |  5.51 min express
vehicle_DescAEGS_Firebird_Collector_Milt=Produttore: Aegis Dynamics\nFocalizzazione: Caccia Stealth\n \nQuando le schermaglie in prima linea richiedono un'offensiva rapida e decisa, la Sabre Firebird è il caccia medio ideale per qualsiasi arsenale. Prendendo la Sabre Raven già testata in battaglia, Aegis ha progettato la variante Firebird con un lanciamissili potenziato capace di ingaggiare un'ampia gamma di minacce.\n\n--- STATS ---\nCrew: 1  |  Length: 24.5m  |  Class: Combattimento  |  Role: Caccia stealth\nMRacks: S3\nArmor HP: 4,752\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 20  |  E 16  |  D 0  |  T 0\nInsurance: 7.56 min base  |  2.52 min express
vehicle_DescAEGS_Gladius=Produttore: Aegis Dynamics\nFocus: Light Fighter\n\nGladius è un modello più vecchio che è stato aggiornato nel corso degli anni per stare al passo con la tecnologia moderna. Negli ambienti militari, il Gladius è amato per le sue prestazioni e la sua semplicità. Un caccia veloce e leggero con una particolare attenzione al combattimento aereo, la Gladius è una nave intercettore o scorta ideale.\n\n--- STATS ---\nSCM: 226 m/s  |  Max: 1,193 m/s\nBoost: +520 m/s  /  -268 m/s\nCrew: 1  |  Length: 21.0m  |  Class: Combattimento  |  Role: Caccia leggero\nMRacks: 4× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 3,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 5.83 min base  |  1.94 min express
vehicle_DescAEGS_Gladius_Dunlevy=Produttore: Aegis Dynamics\nFocus: Caccia Leggero\n\nOnora la famosa Capitana che ha plasmato il corso dello squadrone di caccia Elite della Marina UEE con la variante Dunlevy per l'Aegis Gladius. Questa nave speciale rende omaggio alla Capitana Alexandra Dunlevy e allo Squadrone 42 con dettagli rossi su una vernice di base grigia e componenti di livello militare.\n\n--- STATS ---\nCrew: 1  |  Length: 21.0m  |  Class: Combattimento  |  Role: Caccia leggero\nMRacks: 4× S3\nQD: S1\nArmor HP: 3,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 11  |  E 9  |  D 0  |  T 0\nInsurance: 5.83 min base  |  1.94 min express
