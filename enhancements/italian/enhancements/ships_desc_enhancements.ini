vehicle_DescMRAI_Guardian_MX=Produttore: Mirai\nFocus: Caccia Pesante\n\nPrendendo la struttura del caccia Guardian e aggiungendo ancora più opzioni offensive, il Mirai Guardian MX offre potenza di fuoco e corazzatura aggiuntive ideali per sopraffare gli avversari. Sebbene non sia agile come il Guardian base, questo caccia pesante è comunque più agile di molte altre navi della sua classe.\n\n\n--- STATS ---\nSCM: 208 m/s  |  Max: 1,100 m/s\nBoost: +455 m/s  /  -221 m/s\nCrew: 1  |  Length: 26.0m  |  Class: Combattimento  |  Role: Caccia pesante\nInsurance: 8.33 min base  |  2.08 min express
vehicle_DescMRAI_Guardian_MX_Collector_Military=Produttore: Mirai\nFocus: Caccia Pesante\n\nPrendendo la struttura della caccia Guardian e aggiungendo ancora più opzioni offensive, la Mirai Guardian MX racchiude potenza di fuoco e corazza aggiuntive ideali per sopraffare gli avversari. Sebbene non sia agile come la Guardian base, questa caccia pesante è comunque più maneggevole di molte altre navi della sua classe.\n\nWikelo qui. Fatte modifiche utili per rendere nave molto più da caccia. Molto impressionante.\n\n--- STATS ---\nCrew: 1  |  Length: 26.0m  |  Class: Combattimento  |  Role: Caccia pesante\nInsurance: 8.33 min base  |  2.08 min express
vehicle_DescMRAI_Pulse=Produttore: Mirai\nObiettivo: combattimento\n \nGli ingegneri di Mirai hanno deciso di creare una moto capace di fare di più. Una connessione più intima tra pilota e performance con una silhouette aderente. Un modo più intuitivo per domare paesaggi formidabili con un sistema di gravità reattivo. Un'esperienza di combattimento più intelligente con un'arma personalizzata completamente integrata nello spirito del veicolo. Il risultato finale? Il Mirai Pulse.\n\n\n--- STATS ---\nSCM: 204 m/s  |  Max: 561 m/s\nBoost: +284 m/s  /  -124 m/s\nCrew: 1  |  Length: 3.5m  |  Class: Combattimento  |  Role: Esplorazione\nCoolers: S0  |  Power: S0\nArmor HP: 1,300\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 6  |  E 4  |  D 0  |  T 0\nInsurance: 0.15 min base  |  0.05 min express
vehicle_DescMRAI_Pulse_LX=Produttore: Mirai\nFocus: corse\n \nAbbinando perfettamente pilota e velocità pura, la Mirai Pulse LX vola sul terreno come nessun altra moto da corsa a tettuccio aperto ha mai visto prima. Senti il tuo battito cardiaco accelerare mentre sperimenti in prima persona la reattività rivoluzionaria e la silhouette aderente di Pulse. \n\n\n--- STATS ---\nSCM: 218 m/s  |  Max: 600 m/s\nBoost: +298 m/s  /  -138 m/s\nCrew: 1  |  Length: 3.5m  |  Class: Combattimento  |  Role: Da gara\nCoolers: S0  |  Power: S0\nArmor HP: 650\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 6  |  E 4  |  D 0  |  T 0\nInsurance: 0.15 min base  |  0.05 min express
vehicle_DescMisc_Fury=Produttore: Mirai\nFocus: Snub Fighter\n\nCaratterizzato dalla migliore manovrabilità della categoria e da una tecnologia Xi'an all'avanguardia e completamente integrata, il caccia snub Fury di prossima generazione di Mirai utilizza le sue quattro dimensioni montate su halo 4 ripetitori laser per ridefinire il combattimento spaziale a corto raggio.\n\n--- STATS ---\nSCM: 230 m/s  |  Max: 1,263 m/s\nBoost: +550 m/s  /  -260 m/s\nCrew: 1  |  Length: 7.0m  |  Class: Combattimento  |  Role: Caccia piccolo\nShields: S1  |  Coolers: 2× S1  |  Power: S1\nArmor HP: 1,650\nDmg Mult: P 0.85x  |  E 0.70x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 5  |  D 0  |  T 0\nInsurance: 1.89 min base  |  0.63 min express
vehicle_DescMisc_Fury_LX=Produttore: Mirai\nFocus: corse\n\nDotata di manovrabilità migliore della categoria e tecnologia Xi'an all'avanguardia e completamente integrata, la nave da corsa Fury LX di Mirai di prossima generazione disattiva le capacità offensive della agile nave per fare spazio ad ulteriori propulsori di manovra perfetti per tagliare il traguardo.\n\n--- STATS ---\nSCM: 900 m/s  |  Max: 1,280 m/s\nBoost: +1,280 m/s  /  -900 m/s\nCrew: 1  |  Length: 7.0m  |  Class: Competizione  |  Role: Da gara\nShields: S1  |  Coolers: 2× S1  |  Power: S1\nArmor HP: 550\nDmg Mult: P 0.85x  |  E 0.70x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 5  |  D 0  |  T 0\nInsurance: 1.80 min base  |  0.60 min express
vehicle_DescMisc_Fury_Miru=Produttore: Mirai\nFocalizzazione: Caccia Snub\n\nCaratterizzato da una manovrabilità best-in-class e da tecnologia Xi'an all'avanguardia completamente integrata, il bombardiere snub di nuova generazione Fury MX della Mirai utilizza i suoi venti missili montati su un anello per devastare i bersagli durante i combattimenti spaziali a corto raggio.\n\n--- STATS ---\nCrew: 1  |  Length: 7.0m  |  Class: Combattimento  |  Role: Caccia piccolo\nShields: S1  |  Coolers: 2× S1  |  Power: S1\nArmor HP: 1,650\nDmg Mult: P 0.85x  |  E 0.70x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 5  |  D 0  |  T 0\nInsurance: 1.89 min base  |  0.63 min express
vehicle_DescORIG_100i=Produttore: Origin Jumpworks\nFocalizzazione: Iniziale / Esploratore\n\nVisita l'universo con il perfetto connubio tra lusso e prestazioni. La 100i presenta il sistema di alimentazione brevettato AIR della Origin Jumpworks, che la rende la nave più efficiente ed ecologica sul mercato. In grado di effettuare voli a lunga distanza per i quali la maggior parte delle navi della sua stazza non è equipaggiata, la 100i è perfetta per i piloti in solitaria che cercano di far girare la testa senza sacrificare funzionalità o affidabilità.\n\n--- STATS ---\nSCM: 223 m/s  |  Max: 1,230 m/s\nBoost: +610 m/s  /  -290 m/s\nCrew: 1  |  Length: 19.0m  |  Class: Esplorazione  |  Role: Starter / Esplorazione\nGuns: 2\nShields: S1  |  Coolers: 2× ?  2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 3.36 min base  |  1.12 min express
vehicle_DescORIG_125a=Produttore: Origin Jumpworks\nFocalizzazione: Caccia Leggero\n\nI rischi sono fatti per essere presi, ma perché rischiare di rimanere senza carburante nel calore della battaglia? Con il sistema di carburante AIR, un pacchetto armi potenziato e tutto il lusso e la raffinatezza che ti aspetti dalla Origin Jumpworks, la 125a è stata progettata per l'anticonformista esigente.\n\n--- STATS ---\nSCM: 230 m/s  |  Max: 1,260 m/s\nBoost: +610 m/s  /  -300 m/s\nCrew: 1  |  Length: 19.0m  |  Class: Combattimento  |  Role: Caccia leggero\nGuns: 2\nShields: S1  |  Coolers: 2× ?  2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 4.54 min base  |  1.51 min express
vehicle_DescORIG_135c=Produttore: Origin Jumpworks\nFocalizzazione: Trasporto Merci Leggero\n\nCon una quantità ingannevole di spazio di stoccaggio nel suo telaio elegante e alla moda, e il sistema di alimentazione brevettato AIR della Origin, il modello 135c è la scelta ovvia per musicisti, corrieri e chiunque cerchi di far iniziare la festa. Fallo arrivare in fretta, e fallo con stile.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,250 m/s\nBoost: +610 m/s  /  -290 m/s\nCrew: 1  |  Length: 19.0m  |  Class: Trasporto  |  Role: Cargo leggero\nGuns: 2\nShields: S1  |  Coolers: 2× ?  2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 3.78 min base  |  1.26 min express
vehicle_DescORIG_300i=Produttore: Origin Jumpworks\nFocalizzazione: Turismo di Lusso\n\nSe hai intenzione di viaggiare tra le stelle... perché non farlo con stile? La 300i è il veicolo spaziale di lusso di punta della Origin Jumpworks. È un killer elegante e argentato che invia un messaggio tanto con la sua silhouette quanto con i suoi cannoni a particelle.\n\n--- STATS ---\nSCM: 258 m/s  |  Max: 1,440 m/s\nBoost: +550 m/s  /  -270 m/s\nCrew: 1  |  Length: 27.0m  |  Class: Esplorazione  |  Role: Touring di lusso\nMRacks: 2× S2\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 7.76 min base  |  2.59 min express
vehicle_DescORIG_315p=Produttore: Origin Jumpworks\nFocus:Pathfinder\n\nL'esplorazione è la vocazione più alta dell'uomo. Preparati a tracciare orizzonti lontani con la tecnologia più sofisticata dell'uomo, la Origin 315p. Dotato di una centrale elettrica più robusta e di un pacchetto di scansione personalizzato, progettato esclusivamente da Chimera Communications.\n\n--- STATS ---\nSCM: 258 m/s  |  Max: 1,460 m/s\nBoost: +550 m/s  /  -270 m/s\nCrew: 1  |  Length: 27.0m  |  Class: Esplorazione  |  Role: Esplorazione\nMRacks: 2× S2\nShields: 2× S1  |  Coolers: 2× S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 5.18 min base  |  1.73 min express
vehicle_DescORIG_325a=Produttore: Origin Jumpworks\nFocalizzazione: Intercettatore\n\nSolo perché è una galassia difficile non significa che tu debba sacrificare il tuo comfort: la 325a può uscirne vincitrice in qualsiasi combattimento aereo. La 325a presenta un carico utile di armi avanzato così come un sistema di puntamento personalizzato progettato appositamente per la 325a dalla WillsOp.\n\n--- STATS ---\nSCM: 260 m/s  |  Max: 1,430 m/s\nBoost: +600 m/s  /  -270 m/s\nCrew: 1  |  Length: 27.5m  |  Class: Combattimento  |  Role: Intercettore\nMRacks: 2× S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 6.21 min base  |  2.07 min express
vehicle_DescORIG_350r=Produttore: Origin Jumpworks\nFocus:Corse\n\nOrigin La serie 300 di Jumpwork è la fusione definitiva di eleganza e astroingegneria. Ogni componente è calibrato individualmente per garantire che la tua nave rimanga in perfetta armonia. Di gran lunga il membro più veloce della famiglia, il 350r concentra nuovamente la potenza del 300 e la traduce in pura velocità.\n\n--- STATS ---\nSCM: 265 m/s  |  Max: 1,500 m/s\nBoost: +490 m/s  /  -270 m/s\nCrew: 1  |  Length: 27.0m  |  Class: Competizione  |  Role: Da gara\nMRacks: 2× S2\nShields: 2× S1  |  Coolers: 2× S1  |  QD: S1\nArmor HP: 1,920\nDmg Mult: P 0.80x  |  E 0.65x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 10.14 min base  |  3.38 min express
vehicle_DescORIG_400i=Produttore: Origin Jumpworks\nFocalizzazione: Spedizione\n\nEsplorare le stelle è l'impresa più nobile, e la Origin Jumpworks si è dimostrata all'altezza nel realizzare l'esploratore ad alte prestazioni 400i. Con un'autonomia ai vertici della categoria, sostanziali capacità difensive e un apparato di scansione equipaggiato di fabbrica, la 400i è pronta ad affrontare gli angoli più ostili della galassia mantenendo il comfort e l'eleganza per cui la Origin è nota.\n\n--- STATS ---\nSCM: 215 m/s  |  Max: 1,225 m/s\nBoost: +500 m/s  /  -216 m/s\nCrew: 3  |  Length: 56.0m  |  Class: Esplorazione  |  Role: Esplorazione\nShields: S3  |  Coolers: S2  |  Power: S2  |  QD: S2\nArmor HP: 13,440\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 95  |  E 90  |  D 0  |  T 0\nInsurance: 22.50 min base  |  7.50 min express
