vehicle_DescANVL_Hornet_F7CM_Heartseeker_Mk2=Produttore: Anvil Aerospace\nFocus: Medium Fighter\n \nQuando l'F7C-M Super Hornet è stato aggiornato a Mk II, non c'erano dubbi nella mente di Anvil Aerospace che avrebbero riservato lo stesso trattamento alla speciale edizione Heartseeker. Con il suo robusto pacchetto di armi progettato per piloti il ??cui vero amore è il brivido di un combattimento aereo straziante, l'F7C-M Heartseeker Mk II in edizione limitata è destinata a diventare la nave preferita per una nuovissima generazione di veri duri a morire del combattimento.\n\n--- STATS ---\nCrew: 2  |  Length: 24.0m  |  Class: Combattimento  |  Role: Caccia medio\nShields: 3× S1  |  Coolers: 2× S1  |  Power: S2  |  QD: S1\nInsurance: 11.17 min base  |  2.80 min express
vehicle_DescANVL_Hornet_F7CM_Mk2=Produttore: Anvil Aerospace\nFocus: caccia medio\n \nPerfezionando il suo rinomato caccia da superiorità di classe militare con la tecnologia più all'avanguardia, Anvil Aerospace ha realizzato l'F7C-M Super Hornet Mk II, mantenendo il secondo sedile e la torretta sferica che hanno reso l'originale un bersaglio davvero terrificante da affrontare.\n\n--- STATS ---\nSCM: 215 m/s  |  Max: 1,125 m/s\nBoost: +465 m/s  /  -240 m/s\nCrew: 2  |  Length: 24.0m  |  Class: Combattimento  |  Role: Caccia medio\nShields: 3× S1  |  Coolers: 2× S1  |  Power: S2  |  QD: S1\nInsurance: 10.17 min base  |  2.55 min express
vehicle_DescANVL_Hornet_F7CR=Produttore: Anvil Aerospace\nFocus:Pathfinder\n\nSe il Fantasma è costretto a nascondersi, il Tracker è costretto a cercare. L'F7C-R Tracker vanta una suite radar avanzata che lo rende ideale per gli esploratori dello spazio profondo che richiedono profondità e precisione nei loro pacchetti di scansione. Anche la milizia locale e le unità mercenarie più grandi riproporranno i Tracker per fungere da navi C&C mobili per i loro squadroni.\n\n--- STATS ---\nSCM: 219 m/s  |  Max: 1,142 m/s\nBoost: +477 m/s  /  -249 m/s\nCrew: 1  |  Length: 28.2m  |  Class: Esplorazione  |  Role: Esplorazione\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 6,600\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 24  |  E 13  |  D 0  |  T 0\nInsurance: 8.10 min base  |  2.70 min express
vehicle_DescANVL_Hornet_F7CR_Mk2=Produttore: Anvil Aerospace\nFocus: Pathfinder\n \nQuando si cerca la prossima grande frontiera, chi meglio di un pathfinder di nuova generazione può essere affidabile? L'F7C-R Hornet Tracker Mk II vanta una suite radar revisionata, ideale per gli esploratori dello spazio profondo che richiedono profondità e precisione nei loro pacchetti di scansione.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 1  |  Length: 22.5m  |  Class: Combattimento  |  Role: Esplorazione\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 9.33 min base  |  2.33 min express
vehicle_DescANVL_Hornet_F7CS=Produttore: Anvil Aerospace\nFocus:Stealth Fighter\n\nGrazie a una combinazione di motori a basse emissioni, armi a basso assorbimento e tecnologia Void Armor in grado di diffondere le scansioni, l'F7C-S Ghost è costruito per il pilota che vuole mantenere un basso profilo. Il Fantasma è in grado di sfuggire agli osservatori più ardenti per raggiungere qualsiasi obiettivo tu voglia raggiungere. Non preoccuparti, non te lo chiederemo.\n\n--- STATS ---\nSCM: 219 m/s  |  Max: 1,142 m/s\nBoost: +477 m/s  /  -249 m/s\nCrew: 1  |  Length: 28.2m  |  Class: Combattimento  |  Role: Caccia stealth\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 6,600\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 24  |  E 13  |  D 0  |  T 0\nInsurance: 9.72 min base  |  3.24 min express
vehicle_DescANVL_Hornet_F7CS_Mk2=Produttore: Anvil Aerospace\nFocus: Stealth Fighter\n \nQuando si è avvicinato alla riprogettazione Mk II dell'F7C-S Hornet Ghost, gli ingegneri di Anvil Aerospace hanno voluto preservare ciò che i piloti amavano dei motori a basse emissioni, delle armi a basso assorbimento e della tecnologia Void Armor dell'originale, ma li hanno perfezionati per raggiungere un livello di prestazioni ancora più elevato per un'era completamente nuova di operazioni stealth.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,150 m/s\nBoost: +480 m/s  /  -250 m/s\nCrew: 1  |  Length: 22.5m  |  Class: Combattimento  |  Role: Caccia stealth\nShields: 2× S1  |  Coolers: 2× S1  |  QD: S1\nInsurance: 9.50 min base  |  2.38 min express
