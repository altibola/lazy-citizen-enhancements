vehicle_DescGAMA_Tyilui=Produttore: Gatac Manufacture\nFocus: Combattimento\n\nFedele alla natura dei Xi'an, il Tyilui porta l'innovazione a un livello superiore con la nave più ambiziosa di Gatac fino ad oggi. Oltre a ospitare diverse torrette, l'hangar rivolto all'indietro della mini-portaerei è in grado di immagazzinare più navi snub, fornendo una maggiore flessibilità operativa negli scenari di combattimento e oltre.\n\n--- STATS ---\nSCM: 165 m/s  |  Max: 980 m/s\nBoost: +335 m/s  /  -175 m/s\nCrew: 4  |  Length: 52.0m  |  Class: Trasporto  |  Role: Snub Carrier\nInsurance: 17.33 min base  |  5.66 min express
vehicle_DescGLSN_Basher=Produttore: Sconosciuto\nFocus: Intercettore\nUna testimonianza del creare qualcosa dal nulla, il Basher prende forma per diventare una bestia da non sottovalutare. Il lungo sviluppo di questa nave, dovuto all'approccio per tentativi ed errori di Greycat nel mescolare parti di navi finché non hanno capito le combinazioni migliori, dimostra il lavoro svolto per elevare questa macchina dai rottami da cui è stata costruita.\n\n--- STATS ---\nSCM: 220 m/s  |  Max: 1,180 m/s\nBoost: +500 m/s  /  -24 m/s\nCrew: 1  |  Length: 13.7m  |  Class: Combattimento  |  Role: Caccia leggero\nInsurance: 5.50 min base  |  1.50 min express
vehicle_DescGLSN_Shiv=Produttore: Sconosciuto\nSpecializzazione: Caccia Pesante\nCostruita grossolanamente da un rattoppato miscuglio di varie astronavi, questa brutale caccia è stata realizzata per sopravvivere alle dure realtà dello spazio non rivendicato, dimostrando che non è la marca della tua nave che conta, ma ciò che ne fai.\n\n--- STATS ---\nSCM: 219 m/s  |  Max: 1,175 m/s\nBoost: +479 m/s  /  -230 m/s\nCrew: 2  |  Length: 37.5m  |  Class: Combattimento  |  Role: Caccia pesante\nInsurance: 18.00 min base  |  4.50 min express
