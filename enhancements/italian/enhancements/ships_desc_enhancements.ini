vehicle_DescRSI_Perseus=Produttore: RSI\nFocalizzazione: Cannoniera Pesante\n\nQuando la RSI ha deciso di creare l'affermazione moderna definitiva nella prevenzione persuasiva, ha guardato al proprio passato, alle storiche cannoniere designate Perseus. Capace di fare a pezzi i goliath di classe sub-ammiraglia, la semplice presenza di una cannoniera Perseus in un blocco o in una squadra di pattuglia è sufficiente a farci pensare due volte i tuoi nemici più aggressivi prima di ingaggiare, proprio come il suo omonimo vintage.\n\n--- STATS ---\nSCM: 150 m/s  |  Max: 1,050 m/s\nBoost: +350 m/s  /  -160 m/s\nCrew: 6  |  Length: 100.0m  |  Class: Combattimento  |  Role: Cannoniera pesante\nInsurance: 38.00 min base  |  9.50 min express
vehicle_DescRSI_Polaris=Produttore: Roberts Space Industries\nFocus: Corvette\n\nLa Polaris è un'agile nave classe capital di classe corvetta dotata di una potente potenza e di un armamento completo di torrette e torpedo. Destinata ad essere utilizzata sia come pattugliatore navale che come nave ammiraglia delle operazioni della milizia, la Polaris ha la capacità di eseguire operazioni di ricerca e salvataggio, missioni di attacco leggero e pattugliamenti di sicurezza generali. La Polaris include le strutture per riparare, riarmare e rifornire di carburante un singolo caccia, bombardiere leggero o nave appoggio.\n\n--- STATS ---\nSCM: 145 m/s  |  Max: 940 m/s\nBoost: +250 m/s  /  -155 m/s\nCrew: 12  |  Length: 181.0m  |  Class: Combattimento  |  Role: Corvetta\nTurrets: 22\nShields: S4  |  Coolers: S4  |  Power: S4  |  QD: S3\nArmor HP: 48,960\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 495  |  E 418  |  D 0  |  T 0\nInsurance: 75.83 min base  |  18.96 min express
vehicle_DescRSI_Salvation=Produttore: Roberts Space Industries\nFocus: Recupero\n \nPer secoli, la Roberts Space Industries si è vantata di creare veicoli che non solo soddisfano le esigenze dei piloti, ma superano le aspettative. Sebbene la RSI Salvation possa sembrare un semplice mezzo di recupero a prima vista, ogni dettaglio, dal braccio di recupero, all'impianto di elaborazione di bordo, al conveniente stoccaggio esterno è stato perfezionato e ottimizzato per far sentire anche un dilettante un esperto.\n\n--- STATS ---\nSCM: 205 m/s  |  Max: 1,150 m/s\nBoost: +290 m/s  /  -230 m/s\nCrew: 1  |  Length: 14.5m  |  Class: Industriale  |  Role: Starter / Recupero Leggero\nInsurance: 6.00 min base  |  1.50 min express
