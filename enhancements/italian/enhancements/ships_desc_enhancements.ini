vehicle_DescAEGS_Sabre=Produttore: Aegis Dynamics\nFocus: Stealth Fighter\n\nParte della fase due dei nuovi modelli di navi di Aegis Dynamics, la Sabre è stata progettata come caccia da superiorità spaziale per quelle situazioni in cui è necessario lasciare un'impronta più leggera. Progettato per rispondere rapidamente, il Sabre è più che capace di stabilire il dominio sul campo di battaglia in qualsiasi numero di scenari di combattimento.\n\n--- STATS ---\nSCM: 223 m/s  |  Max: 1,235 m/s\nBoost: +480 m/s  /  -230 m/s\nCrew: 1  |  Length: 24.5m  |  Class: Combattimento  |  Role: Caccia stealth\nMRacks: 2× S4\nShields: 2× S1  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 2,772\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 20  |  E 16  |  D 0  |  T 0\nInsurance: 9.45 min base  |  3.15 min express
