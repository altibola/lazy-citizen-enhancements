vehicle_DescAEGS_Sabre_Firebird=Produttore: Aegis Dynamics\nFocalizzazione: Caccia Stealth\n \nQuando le schermaglie in prima linea richiedono un'offensiva rapida e decisa, la Sabre Firebird è il caccia medio ideale per qualsiasi arsenale. Prendendo la Sabre Raven già testata in battaglia, Aegis ha progettato la variante Firebird con un lanciamissili potenziato capace di ingaggiare un'ampia gamma di minacce.\n\n--- STATS ---\nSCM: 240 m/s  |  Max: 1,400 m/s\nBoost: +600 m/s  /  -260 m/s\nCrew: 1  |  Length: 24.5m  |  Class: Combattimento  |  Role: Caccia stealth\nMRacks: S3\nShields: 2× S1  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 4,752\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 20  |  E 16  |  D 0  |  T 0\nInsurance: 7.56 min base  |  2.52 min express
vehicle_DescAEGS_Sabre_Peregrine=Produttore: Aegis Dynamics\nFocus: Racing\n \nDopo aver visto cosa i fan del Sabre Raven sono riusciti a realizzare con il caccia in pista, il team di progettazione di Aegis Dynamics è stato ispirato a creare una variante da corsa ufficiale per l'agile nave. Ecco il Sabre Peregrine. Aerodinamico e dotato di ulteriori propulsori, questo agile uccello è pronto a volare verso il traguardo.\n\n--- STATS ---\nSCM: 267 m/s  |  Max: 1,447 m/s\nBoost: +655 m/s  /  -277 m/s\nCrew: 1  |  Length: 24.5m  |  Class: Competizione  |  Role: Da gara\nMRacks: 1\nShields: 2× S1  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 1,584\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 20  |  E 16  |  D 0  |  T 0\nInsurance: 7.56 min base  |  2.52 min express
