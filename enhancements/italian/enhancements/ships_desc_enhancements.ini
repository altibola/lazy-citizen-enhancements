vehicle_DescCRUS_Starlifter_A2=Produttore: Crusader Industries\nFocalizzazione: Bombardiere Pesante\n\nLa A2 Starlifter è stata utilizzata con effetti devastanti in assalti aerei, operazioni di ricerca e soccorso e iniziative di sbarco. Con più del doppio della potenza di fuoco della M2, e un vano bombe personalizzato in grado di sganciare un carico utile sbalorditivo, la A2 si rivolge a chiunque trasporti enormi quantità di merci attraverso cieli potenzialmente ostili.\n\n--- STATS ---\nSCM: 160 m/s  |  Max: 950 m/s\nBoost: +320 m/s  /  -170 m/s\nCrew: 8  |  Length: 70.0m  |  Class: Combattimento  |  Role: Bombardiere pesante\nTurrets: 12\nInsurance: 39.24 min base  |  13.08 min express
vehicle_DescCRUS_Starlifter_A2_Collector_Military=Produttore: Crusader Industries\nFocalizzazione: Bombardiere Pesante\n\nLa A2 Starlifter è stata utilizzata con effetti devastanti in assalti aerei, operazioni di ricerca e soccorso e iniziative di sbarco. Con più del doppio della potenza di fuoco della M2, e un vano bombe personalizzato in grado di sganciare un carico utile sbalorditivo, la A2 si rivolge a chiunque trasporti enormi quantità di merci attraverso cieli potenzialmente ostili.\n\nWikelo qui. Fatto modifiche utili per rendere la nave molto più simile a un caccia. Molto impressionante.\n\n--- STATS ---\nCrew: 8  |  Length: 70.0m  |  Class: Combattimento  |  Role: Bombardiere pesante\nTurrets: 12\nInsurance: 39.24 min base  |  13.08 min express
vehicle_DescCRUS_Starlifter_C2=Produttore: Crusader Industries\nFocalizzazione: Trasporto Merci Pesante\n\nUtilizzando il telaio spaziale brevettato di grado militare Hercules ed espandendo la capacità di carico, pur sacrificando a malapena la potenza di fuoco, la C2 ha preso d'assalto il settore privato. È diventata lo standard del settore per i team di corse, i rivenditori e i produttori di navi, le organizzazioni di costruzione, le corporazioni minerarie e persino i gruppi di intrattenimento itinerante su larga scala.\n\n--- STATS ---\nCrew: 2  |  Length: 70.0m  |  Class: Trasporto  |  Role: Cargo medio\nTurrets: 2\nCoolers: 2× S3  |  QD: S3\nArmor HP: 13,000\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 385  |  E 300  |  D 0  |  T 0\nInsurance: 32.70 min base  |  10.90 min express
vehicle_DescCRUS_Starlifter_M2=Produttore: Crusader Industries\nFocalizzazione: Trasporto Merci Pesante\n\nLa M2 Hercules è il principale starlifter tattico dell'UEE. La potente combinazione di capacità, manovrabilità, resistenza e robusto pacchetto armi del trasporto su larga scala assicura che le tue merci e il tuo equipaggio arrivino a destinazione interi.\n\n--- STATS ---\nSCM: 160 m/s  |  Max: 950 m/s\nBoost: +320 m/s  /  -170 m/s\nCrew: 3  |  Length: 70.0m  |  Class: Trasporto  |  Role: Cargo medio\nTurrets: 3\nCoolers: 2× S3  |  QD: S3\nArmor HP: 23,400\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 385  |  E 300  |  D 0  |  T 0\nInsurance: 25.00 min base  |  8.00 min express
vehicle_DescDRAK_Buccaneer=Produttore: Drake Interplanetary\nFocalizzazione: Caccia Leggero\n\nLa Buccaneer è stata progettata da zero per volare e combattere nel modo in cui vivi. Nessun interno in pelle o iper-cuscini qui: il Bucc è un attaccabrighe progettato per manovrare e combattere al di sopra della sua categoria di peso. Questo caccia di frontiera rude e violento può essere mantenuto nelle peggiori condizioni al fine di mantenere in vita veri equipaggi spaziali operativi.\n\n--- STATS ---\nSCM: 240 m/s  |  Max: 1,400 m/s\nBoost: +600 m/s  /  -260 m/s\nCrew: 1  |  Length: 15.2m  |  Class: Combattimento  |  Role: Caccia leggero\nShields: S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 2,160\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 8  |  D 0  |  T 0\nInsurance: 5.40 min base  |  1.80 min express
vehicle_DescDRAK_Caterpillar=Produttore: Drake Interplanetary\nFocalizzazione: Trasporto Merci Medio\n\nIntrodotta per la prima volta nel 2871, la Caterpillar della Drake Interplanetary ha da tempo dimostrato di essere un vascello multiruolo affidabile ed economico, capace di essere equipaggiato per qualsiasi cosa, dalle operazioni mercantili al supporto al combattimento. Da tempo acclamata come una dura alternativa alla onnipresente serie Hull, la Caterpillar è un mercantile che non lesina su armi o personalizzazione.\n\n--- STATS ---\nSCM: 130 m/s  |  Max: 900 m/s\nBoost: +300 m/s  /  -120 m/s\nCrew: 4  |  Length: 13.4m  |  Class: Trasporto  |  Role: Cargo medio\nTurrets: 2\nShields: 3× S3  |  Coolers: 2× S3  |  Power: S3  |  QD: S3\nArmor HP: 16,830\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 300  |  D 0  |  T 0\nInsurance: 18.63 min base  |  6.21 min express
