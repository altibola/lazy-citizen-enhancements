vehicle_DescORIG_85X=Produttore: Origin Jumpworks\nFocus: Touring\n\nDello stile elegante e costruito meticolosamente, l'85X è una nave da trasferta versatile e completa che offre un controllo di precisione dentro e fuori dall'atmosfera. Utilizzando gran parte della stessa tecnologia dei propulsori della serie 300, ha la potenza di un regata con l'affidabilità di una nave da turismo. Sia che scenda sulla superficie del pianeta o che osservi il panorama del tuo sistema, questo runabout continua l'orgogliosa tradizione di Origin di far girare la testa.\n\n--- STATS ---\nSCM: 235 m/s  |  Max: 1,250 m/s\nBoost: +560 m/s  /  -270 m/s\nCrew: 2  |  Length: 13.5m  |  Class: Esplorazione  |  Role: Touring\nShields: S1  |  Coolers: 2× S1  |  QD: S1\nArmor HP: 2,400\nDmg Mult: P 0.85x  |  E 0.70x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 1.01 min base  |  0.00 min express
vehicle_DescORIG_890Jump=Produttore: Origin Jumpworks\nFocalizzazione: Turismo di Lusso\n\nCon un esterno elegante e raffinato che nasconde i suoi interni spaziosi, la 890 Jump è una vera meraviglia ingegneristica; realizzata per impressionare da ogni angolazione combinando un design unico e innovativo con i migliori materiali e la tecnologia più avanzata. Il risultato è un vascello che appartiene a una classe tutta sua, un capolavoro degno del nome Origin.\n\n--- STATS ---\nCrew: 8  |  Length: 210.0m  |  Class: Esplorazione  |  Role: Touring di lusso\nTurrets: 6  |  MRacks: 2× S5\nShields: 2× S4  |  Coolers: 2× S4  |  Power: S4  |  QD: S4\nArmor HP: 32,640\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 405  |  E 342  |  D 0  |  T 0\nInsurance: 67.50 min base  |  22.50 min express
vehicle_DescORIG_M80=Produttore: Origin Jumpworks\nFocus: Caccia Pesante\n\nAbbraccia l'eleganza senza compromettere la difesa con l'M80. Caratterizzato dal famoso design elegante e sofisticato della Origin, lo scafo della nave nasconde furbescamente sistemi di armi aggressivi che possono essere dispiegati e scatenati contro gli assalitori in un attimo.\n\n--- STATS ---\nSCM: 225 m/s  |  Max: 1,400 m/s\nBoost: +560 m/s  /  -250 m/s\nCrew: 1  |  Length: 11.5m  |  Class: Combattimento  |  Role: Caccia pesante\nInsurance: 11.66 min base  |  2.92 min express
vehicle_DescORIG_X1=Produttore: Origin Jumpworks\nFocalizzazione: Passeggeri\n\nBenvenuto al livello successivo con la X1, il veicolo ad abitacolo aperto ad alte prestazioni della Origin Jumpworks. Costruito con polimeri leggeri, l'X1 porta la velocità e l'agilità al livello successivo grazie alla tecnologia dei motori perfettamente integrata e al posizionamento congiunto dei propulsori vettoriali. Design innovativo e ingegneria di alta qualità si intrecciano per creare un'esperienza di volo senza precedenti.\n\n--- STATS ---\nSCM: 207 m/s  |  Max: 569 m/s\nBoost: +287 m/s  /  -127 m/s\nCrew: 1  |  Length: 1.6m  |  Class: Esplorazione  |  Role: Passeggeri\nShields: ?  |  Coolers: S0  |  Power: S0\nArmor HP: 1,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.15 min base  |  0.05 min express
vehicle_DescORIG_X1_Force=Produttore: Origin Jumpworks\nFocalizzazione: Passeggeri\n\nCostruita per resistere ad ambienti più ostili e per avere un bell'aspetto nel farlo, la X1 Force è una versione modificata del modello base X1 con l'aggiunta di elementi difensivi aggiuntivi per irrobustire questa moto ad abitacolo aperto veloce e agile, permettendole di servire in una varietà di ruoli, dall'esplorazione di mondi a potenziali operazioni di infiltrazione per la sicurezza.\n\n--- STATS ---\nCrew: 1  |  Length: 1.6m  |  Class: Combattimento  |  Role: Passeggeri\nShields: S0  |  Coolers: S0  |  Power: S0\nArmor HP: 1,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.15 min base  |  0.05 min express
vehicle_DescORIG_X1_Velocity=Produttore: Origin Jumpworks\nFocus: corse\n\nCome fai ad andare veloce più veloce? Origin X1 Velocity di Jumpworks osa oltrepassare i limiti della velocità riducendo la base X1 ai suoi elementi principali; eliminando il supporto dell'arma e incorporando nuovi compositi Syntek per creare un telaio più leggero per una perdita di peso complessiva.\n\n--- STATS ---\nSCM: 222 m/s  |  Max: 611 m/s\nBoost: +302 m/s  /  -142 m/s\nCrew: 1  |  Length: 1.6m  |  Class: Competizione  |  Role: Da Gara\nShields: ?  |  Coolers: S0  |  Power: S0\nArmor HP: 1,560\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 5  |  E 4  |  D 0  |  T 0\nInsurance: 0.15 min base  |  0.05 min express
vehicle_DescORIG_m50=Produttore: Origin Jumpworks\nFocus:Corse\n\nSe vuoi andare dal punto A al punto B il più velocemente possibile e con quanto più stile possibile, allora l'M50 di Origin fa al caso tuo. Dotata di motori sovralimentati che contrastano un minuscolo carico di armi, la M50 è una nave per andare VELOCE.\n\n--- STATS ---\nSCM: 280 m/s  |  Max: 1,575 m/s\nBoost: +490 m/s  /  -290 m/s\nCrew: 1  |  Length: 11.5m  |  Class: Competizione  |  Role: Da gara\nGuns: 2× S1 (empty)  |  MRacks: 2× S1\nShields: S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 960\nDmg Mult: P 0.85x  |  E 0.70x  |  D 1.00x  |  T 1.00x\nDeflect: P 9  |  E 7  |  D 0  |  T 0\nInsurance: 6.08 min base  |  2.02 min express
vehicle_DescRSI_Apollo_Medivac=Produttore: RSI\nFocus: Medical\n\nInsieme alla corazza superiore e ai doppi portamissili, il modello Apollo Medivac 2948 rende omaggio al classico film del 2910, Astromedics: Back from the Brink, con una livrea che ricrea fedelmente la Kithara principale.\n\n--- STATS ---\nSCM: 175 m/s  |  Max: 1,000 m/s\nBoost: +340 m/s  /  -180 m/s\nCrew: 2  |  Length: 54.0m  |  Class: Supporto  |  Role: Soccorso\nInsurance: 18.17 min base  |  4.55 min express
vehicle_DescRSI_Apollo_Triage=Produttore: RSI\nFocus: settore medico\n\nIl leggendario Apollo Triage di Roberts Space Industries è lo standard di riferimento per i veicoli di emergenza medica e di risposta rapida alle emergenze. Aggiornato per supportare la tecnologia di rigenerazione, l'Apollo ha una lunga storia nel fornire aiuto fondamentale all'Impero e oltre per oltre due secoli.\n\n--- STATS ---\nSCM: 170 m/s  |  Max: 1,025 m/s\nBoost: +345 m/s  /  -180 m/s\nCrew: 2  |  Length: 54.0m  |  Class: Supporto  |  Role: Soccorso\nInsurance: 17.50 min base  |  4.38 min express
vehicle_DescRSI_Apollo_Triage_Collector_Stealth=Produttore: RSI\nRuolo: Medico\n\nIl leggendario Apollo Triage della Roberts Space Industries è lo standard di riferimento nei veicoli per l'evacuazione medica e la risposta rapida alle emergenze. Aggiornato per supportare la tecnologia di rigenerazione, l'Apollo ha una lunga storia nel fornire aiuti critici all'Impero e oltre per ben più di due secoli.\n\nQui Wikelo. Apportate modifiche utili per rendere la nave molto più difficile da vedere. Furtivo.\n\n--- STATS ---\nCrew: 2  |  Length: 54.0m  |  Class: Supporto  |  Role: Soccorso\nInsurance: 17.50 min base  |  4.38 min express
vehicle_DescRSI_Aurora_CL=Produttore: RSI\nFocus:Trasporti leggeri\n\nPersonalizzata per escursioni mercantili e commerciali, l'Aurora Clipper è la nave perfetta sia per aspiranti imprenditori che per commercianti esperti. Sostituendo una centrale elettrica più piccola e capacità di armatura con una capacità di carico ampliata, il Clipper alza la posta per le imbarcazioni mercantili personali.\n\n--- STATS ---\nCrew: 1  |  Length: 19.0m  |  Class: Trasporto  |  Role: Cargo leggero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 2.43 min base  |  0.81 min express
vehicle_DescRSI_Aurora_ES=Produttore: RSI\nFocalizzazione: Iniziale / Esploratore\n\nL'Aurora è la discendente moderna del veicolo spaziale X-7 della Roberts Space Industries che ha testato i primissimi motori di salto. Utilitaria fino in fondo, l'Aurora è la perfetta nave per principianti: ciò che le manca in stile è compensato da un ampio spazio per i moduli di aggiornamento.\n\n--- STATS ---\nCrew: 1  |  Length: 19.0m  |  Class: Multiruolo  |  Role: Starter / Esplorazione\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 2.16 min base  |  0.72 min express
vehicle_DescRSI_Aurora_LN=Produttore: RSI\nFocus:Light Fighter\n\nCon un generatore di scudi più robusto e un paio di punti di attacco aggiuntivi per le armi, Legionnaire è un combattente da combattimento dedicato, costruito per gestire qualsiasi ostacolo che l'universo può lanciarti.\n\n--- STATS ---\nCrew: 1  |  Length: 19.0m  |  Class: Combattimento  |  Role: Caccia leggero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 2.92 min base  |  0.97 min express
vehicle_DescRSI_Aurora_LX=Produttore: RSI\nFocus:Pathfinder\n\nSii orgoglioso delle tue radici con la nuovissima Aurora Deluxe, costruita per il pilota esigente che non dimentica mai da dove viene. La LX è dotata di interni in pelle verniciata per garantire comfort per i lunghi tratti nel nero profondo.\n\n--- STATS ---\nCrew: 1  |  Length: 19.0m  |  Class: Esplorazione  |  Role: Esplorazione\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 2.70 min base  |  0.90 min express
vehicle_DescRSI_Aurora_MR=Produttore: RSI\nFocalizzazione: Iniziale / Caccia Leggero\n\nForse stai cercando qualcosa che offra capacità di trasporto ma che abbia anche capacità di combattimento? L'Aurora Marque viene fornita con un paio di laser di qualità Behring e un sistema di raffreddamento delle armi di alta qualità.\n\n--- STATS ---\nCrew: 1  |  Length: 19.0m  |  Class: Combattimento  |  Role: Caccia leggero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 2.92 min base  |  0.97 min express
vehicle_DescRSI_Aurora_Mk2=Produttore: Roberts Space Industries\nFocalizzazione: Iniziale / Trasporto Merci Leggero\n \nUna nuova versione della nave classica, la Roberts Space Industries ha reimmaginato la collaudata Aurora dalle fondamenta. Vi presentiamo l'Aurora Mk II. Tutto, dalle prestazioni della nave, all'usabilità, fino al suo stile, è stato revisionato pensando a una nuova generazione di piloti. Inoltre, quest'ultima versione introduce un nuovo trucco per la serie Aurora: moduli intercambiabili. Invece di bloccare i piloti in un singolo percorso di carriera, questi moduli consentono una semplice specializzazione operativa dal comfort del tuo hangar. Che tu sia un proprietario di nave per la prima volta, o un pilota di lunga data pronto per un aggiornamento al tuo veicolo quotidiano, l'Aurora Mk II ti sta aspettando.\n\n--- STATS ---\nSCM: 225 m/s  |  Max: 1,230 m/s\nBoost: +460 m/s  /  -240 m/s\nCrew: 1  |  Length: 27.4m  |  Class: Multiruolo  |  Role: Starter / Caccia Leggero\nInsurance: 5.82 min base  |  1.45 min express
vehicle_DescRSI_Aurora_SE=Produttore: RSI\nFocus: Multiruolo\n\nIntegrando il meglio di ciò che ha reso la serie Aurora Mk I così amata da generazioni, questa edizione speciale raggiunge un equilibrio impressionante per consentire ai piloti di affrontare un'ampia gamma di compiti. Con l'Aurora Mk I SE parcheggiata nel tuo hangar, questa tuttofare diventerà sicuramente la tua compagna di volo quotidiana grazie alla sua capacità di gestire qualsiasi cosa la vita ti riservi. \n\n\n--- STATS ---\nCrew: 1  |  Length: 19.0m  |  Class: Combattimento  |  Role: Caccia leggero\nShields: 2× S1  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nInsurance: 2.92 min base  |  0.97 min express
