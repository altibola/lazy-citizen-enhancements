vehicle_DescRSI_Zeus_CL=Produttore: Roberts Space Industries\nFocus: trasporto medio\n\nPronta a traghettare un'intera nuova generazione di viaggiatori attraverso l'universo, Roberts Space Industries è orgogliosa di presentare un'astronave in lavorazione da otto secoli: la nuovissima navicella spaziale Zeus Mk II. Rendendo omaggio al design classico che lanciò l'umanità verso le stelle nel 2140, lo Zeus Mk II è stato aggiornato per superare gli standard moderni pur mantenendo il cuore di questa amata icona dei viaggi spaziali. Concentrandosi sul commercio, l'edizione Zeus Mk II CL presenta spazio di carico aggiuntivo e un raggio traente ideale per movimentare grandi volumi di carico.\n\n--- STATS ---\nSCM: 200 m/s  |  Max: 1,000 m/s\nBoost: +400 m/s  /  -210 m/s\nCrew: 3  |  Length: 46.0m  |  Class: Trasporto  |  Role: Cargo medio\nShields: 3× S2\nInsurance: 10.67 min base  |  2.67 min express
