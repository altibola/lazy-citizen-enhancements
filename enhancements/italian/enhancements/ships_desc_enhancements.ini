vehicle_DescAEGS_Sabre_Raven=Produttore: Aegis Dynamics \nFocus: Interdizione\n\nAegis Dynamics ha alzato ancora una volta l'asticella con la sua variante Raven, mantenendo tutta la velocità e la manovrabilità del suo antenato Sabre, ma con una firma della nave inferiore, rendendola una nave veloce , infiltrato furtivo.\n\n--- STATS ---\nSCM: 240 m/s  |  Max: 1,400 m/s\nBoost: +600 m/s  /  -260 m/s\nCrew: 1  |  Length: 24.5m  |  Class: Combattimento  |  Role: Interdizione\nMRacks: 2\nShields: 2× S1  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 2,218\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 20  |  E 16  |  D 0  |  T 0\nInsurance: 7.56 min base  |  2.52 min express
