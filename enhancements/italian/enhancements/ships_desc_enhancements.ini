vehicle_DescMISC_Hull_A=Produttore: MISC\nFocalizzazione: Trasporto Merci Leggero\n\nLa Hull più piccola e più economica. La Hull A è ottima per coloro che si stanno appena avventurando nella galassia da soli. La Hull A è più simile all'Aurora e alla Mustang, ma manca della natura 'tuttofare'. Mentre le altre scambiano capacità cargo per potenza di fuoco o velocità, la Hull A è un trasporto focalizzato al 100% sulla missione.\n\n--- STATS ---\nSCM: 185 m/s  |  Max: 1,050 m/s\nBoost: +385 m/s  /  -195 m/s\nCrew: 1  |  Length: 30.0m  |  Class: Trasporto  |  Role: Cargo leggero\nShields: S2  |  Coolers: 2× S1  |  Power: S1  |  QD: S1\nArmor HP: 4,840\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 18  |  E 19  |  D 0  |  T 0\nInsurance: 5.95 min base  |  1.98 min express
vehicle_DescMISC_Hull_C=Produttore: MISC\nFocus: carichi pesanti\n\nSpesso definita la nave più comune nella galassia, la Hull C è la più prodotta della gamma ed è considerata da molti la più versatile. Destinata a raggiungere il "punto debole" tra i più piccoli trasporti per una sola persona e i massicci superfreighter che compongono il resto della gamma, la Hull C offre l'ampia modularità delle navi più grandi pur mantenendo un minimo di manovrabilità. ha consentito la fascia bassa dell'intervallo.\n\n--- STATS ---\nSCM: 110 m/s  |  Max: 890 m/s\nBoost: +290 m/s  /  -100 m/s\nCrew: 4  |  Length: 91.2m  |  Class: Trasporto  |  Role: Cargo pesante\nShields: 3× S3  |  Power: S3\nArmor HP: 12,100\nDmg Mult: P 0.70x  |  E 0.50x  |  D 1.00x  |  T 1.00x\nDeflect: P 315  |  E 360  |  D 0  |  T 0\nInsurance: 45.00 min base  |  15.00 min express
