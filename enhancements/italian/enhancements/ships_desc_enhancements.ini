vehicle_DescANVL_Hurricane=Produttore: Anvil Aerospace\nFocus:Heavy Fighter\n\nLe grandi cose arrivano in piccoli pacchetti: il Hurricane è un veicolo spaziale da combattimento che racchiude un pugno mortale in una fusoliera sottile. La Nave Spaziale compensa la sua mancanza di comfort con il suo potente armamento: sei cannoni capaci di farsi strada attraverso quasi qualsiasi cosa. I piloti Hurricane devono ancora trovare uno scudo nemico che non possano abbattere.\n\n--- STATS ---\nSCM: 214 m/s  |  Max: 1,125 m/s\nBoost: +480 m/s  /  -225 m/s\nCrew: 2  |  Length: 24.0m  |  Class: Combattimento  |  Role: Caccia pesante\nShields: S2  |  Coolers: 2× S1  |  Power: 2× S1  |  QD: S1\nArmor HP: 9,900\nDmg Mult: P 0.75x  |  E 0.60x  |  D 1.00x  |  T 1.00x\nDeflect: P 54  |  E 29  |  D 0  |  T 0\nInsurance: 8.55 min base  |  2.85 min express
