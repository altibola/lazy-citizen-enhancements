item_descklwe_sniper_energy_01=Produttore: Klaus & Werner\nTipo di elemento: fucile di precisione\nClasse: Energia (laser)\n\nDimensione batteria: 20\nVelocità di fuoco: 50 giri/min\nPortata effettiva: 100 m\n\nAccessori: Ottica (S3), Canna ( S2), Underbarrel (S2)\n\nIl fucile energetico a lungo raggio Arrowhead Modello VI di Klaus & Werner è dotato di un corpo composito in fibra di vetro in grado di resistere a qualsiasi numero di ambienti rigorosi sia nell'atmosfera che all'esterno. Costruito con un calcio di precisione, un mirino composto e un bipiede integrato, il Arrowhead offre un'arma stabile e devastante per gli operatori che vogliono mantenere le distanze, ma restare in combattimento.\n\n--- STATISTICHE ---\nPeso: 6.8 kg\nCadenza di Fuoco: 70 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 50.0 (Energy)  |  DPS: 58.3\nAmmo: 16\nVelocità Proiettile: 1,000 m/s  |  Absolute Portata: 4.0 km
