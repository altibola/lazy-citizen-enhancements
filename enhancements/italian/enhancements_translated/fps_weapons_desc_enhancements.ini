item_Desckegr_fire_extinguisher_01=Produttore: Gruppo KE\nTipo di elemento: Estintore\nClasse: Gadget\n\nDimensione caricatore: Bombola di gas\nVelocità di fuoco: Costante\nPortata effettiva: 3-4 m\n\nL'estintore APX del Gruppo KE è stato valutato come il migliore -attrezzature di sicurezza di livello consumer di prima qualità da oltre un decennio, rendendole lo standard del settore nella prevenzione incendi. Riempito con un composto refrigerante gassoso brevettato, l'estintore può soffocare rapidamente qualsiasi incendio in vista. Lo schermo digitale del dispositivo consente di monitorare la temperatura locale per aiutarti a contenere ed eliminare i rischi di incendio.\n\n--- STATISTICHE ---\nPeso: 3.2 kg\nCadenza di Fuoco: 600 RPM\nFire Modalità: Auto\nDanno Alpha: 18.0 (Thermal)  |  DPS: 180.0\nAmmo: 3,000\nRegen: 0/s  |  Cooldown: 3.0s  |  Cost/Shot: 1\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
item_Descklwe_lmg_energy_01=Produttore: Klaus & Werner\nTipo di elemento: LMG\nClasse: Energia (laser)\n\nDimensione della batteria: 100\nVelocità di fuoco: 400 giri/min\nPortata effettiva: 40 m\n\nAccessori: Ottica (S2), Canna (S2 ), Underbarrel (S3)\n\nKlaus & Werner ha creato un'arma iconica con la collaudata e vera mitragliatrice laser Demeco. Ampiamente utilizzato negli scontri militari, questo favorito della fanteria a corto e medio raggio è stato costruito con stabilità e precisione all'avanguardia.\n\n--- STATISTICHE ---\nPeso: 9.8 kg\nCadenza di Fuoco: 800 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Energy)  |  DPS: 153.3\nAmmo: 100\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 2.4 km
item_Descklwe_lmg_energy_01_IAE2022=Produttore: Klaus & Werner\nTipo di elemento: LMG\nClasse: Energia (laser)\n\nDimensione della batteria: 100\nVelocità di fuoco: 400 giri/min\nPortata effettiva: 40 m\n\nAccessori: Ottica (S2), Canna (S2 ), Underbarrel (S3)\n\nKlaus & Werner ha creato un'arma iconica con la collaudata e vera mitragliatrice laser Demeco. Ampiamente utilizzato negli scontri militari, questo favorito della fanteria a corto e medio raggio è stato costruito con stabilità e precisione all'avanguardia. L'edizione "Red Alert" mescola il grigio e un rosso vibrante per un design audace e dinamico.\n\n--- STATISTICHE ---\nPeso: 9.8 kg\nCadenza di Fuoco: 800 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Energy)  |  DPS: 153.3\nAmmo: 100\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 2.4 km
item_Descklwe_lmg_energy_01_mr01=Produttore: Klaus & Werner\nTipo Oggetto: LMG\nClasse: Energia (Laser)\n\nDimensione Batteria: 100\nRateo di Fuoco: 400 rpm\nGittata Efficace: 40 m\n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S3)\n\nLa Klaus & Werner ha creato un'arma iconica con la collaudata LMG laser Demeco. Ampiamente utilizzata negli scontri militari, questa favorita della fanteria a corto-medio raggio è stata costruita con stabilità e precisione in primo piano. \n\nL'edizione Purgatory Camo mescola sfumature di grigio per un design elegante e senza fronzoli.\n\n--- STATISTICHE ---\nPeso: 9.8 kg\nCadenza di Fuoco: 800 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Energy)  |  DPS: 153.3\nAmmo: 100\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 2.4 km
item_Descklwe_lmg_energy_01_purple_blue01=Produttore: Klaus & Werner\nTipo di elemento: LMG\nClasse: Energia (laser)\n\nDimensione della batteria: 100\nVelocità di fuoco: 400 giri/min\nPortata effettiva: 40 m\n\nAccessori: Ottica (S2), Canna (S2 ), Underbarrel (S3)\n\nKlaus & Werner ha creato un'arma iconica con la collaudata e vera mitragliatrice laser Demeco. Ampiamente utilizzato negli scontri militari, questo favorito della fanteria a corto e medio raggio è stato costruito con stabilità e precisione all'avanguardia. L'edizione Ultraviolet presenta accattivanti colorazioni viola e orchidea.\n\n--- STATISTICHE ---\nPeso: 9.8 kg\nCadenza di Fuoco: 800 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Energy)  |  DPS: 153.3\nAmmo: 100\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 2.4 km
item_Descklwe_pistol_energy_01=Produttore: Klaus & Werner\nTipo di elemento: Pistola\nClasse: Energia (laser)\n\nCapacità della batteria: 30\nVelocità di fuoco: 300 giri/min\nPortata effettiva: 30 m\n\nAccessori: Ottica (S1), Canna (S1 ), Underbarrel (S1)\n\nUn laser portatile reso famoso come l'arma laterale di Kyle Fenris nello show video di successo The Frontier, il Klaus & Werner Model II Arclight è diventato estremamente popolare sul mercato civile. Nonostante il suo appeal mediatico, il Modello II offre una cadenza di fuoco più elevata rispetto a qualsiasi delle sue controparti balistiche. Sebbene ciò possa diminuire il potere d'arresto dell'arma, la sua cella energetica offre colpi più che sufficienti per completare il lavoro.\n\n--- STATISTICHE ---\nPeso: 1.4 kg\nCadenza di Fuoco: 700 RPM\nFire Modalità: Burst / Semi-Auto\nDanno Alpha: 18.0 (Energy)  |  DPS: 210.0\nAmmo: 30\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
item_Descklwe_pistol_energy_01_chromic01=Produttore: Klaus & Werner\nTipo di elemento: Pistola\nClasse: Energia (laser)\n\nDimensione della batteria: 30\nVelocità di fuoco: 300 giri/min\nPortata effettiva: 30 m\n\nUn laser portatile reso famoso come quello di Kyle Fenris arma da fianco nello show video di successo The Frontier, il Klaus & Werner Model II Arclight è diventato estremamente popolare sul mercato civile. Nonostante il suo appeal mediatico, il Modello II offre una cadenza di fuoco più elevata rispetto a qualsiasi delle sue controparti balistiche. Sebbene ciò possa diminuire il potere d'arresto dell'arma, la sua cella energetica offre colpi più che sufficienti per completare il lavoro. Questa esclusiva edizione Glimmer presenta un caratteristico rivestimento iridescente che fa brillare l'arma con colori diversi in base alle condizioni di illuminazione e all'angolazione da cui viene vista.\n\n--- STATISTICHE ---\nPeso: 1.4 kg\nCadenza di Fuoco: 700 RPM\nFire Modalità: Burst / Semi-Auto\nDanno Alpha: 18.0 (Energy)  |  DPS: 210.0\nAmmo: 30\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
item_Descklwe_pistol_energy_01_engraved01=Produttore: Klaus & Werner\nTipo di elemento: Pistola\nClasse: Energia (laser)\n\nCapacità della batteria: 30\nVelocità di fuoco: 300 giri/min\nPortata effettiva: 30 m\n\nAccessori: Ottica (S1), Canna (S1 ), Underbarrel (S1)\n\nUn laser portatile reso famoso come l'arma laterale di Kyle Fenris nello show video di successo The Frontier, il Klaus & Werner Model II Arclight è diventato estremamente popolare sul mercato civile. Nonostante il suo appeal mediatico, il Modello II offre una cadenza di fuoco più elevata rispetto a qualsiasi delle sue controparti balistiche. Sebbene ciò possa diminuire il potere d'arresto dell'arma, la sua cella energetica offre colpi più che sufficienti per completare il lavoro. L'edizione Herrero si distingue includendo incisioni geometriche sul telaio e sull'impugnatura, oltre a una guardia del grilletto strutturata.\n\n--- STATISTICHE ---\nPeso: 1.4 kg\nCadenza di Fuoco: 700 RPM\nFire Modalità: Burst / Semi-Auto\nDanno Alpha: 18.0 (Energy)  |  DPS: 210.0\nAmmo: 30\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
item_Descklwe_rifle_energy_01=Produttore: Klaus & Werner\nTipo di elemento: fucile d'assalto\nClasse: Energia (laser)\n\nDimensione batteria: 45\nVelocità di fuoco: 450 giri/min\nPortata effettiva: 50 m\n\nAccessori: Ottica (S2), Canna ( S2), Underbarrel (S2)\n\nLe armi d'assalto affidabili non passano mai di moda. Klaus & Werner mantengono questa tradizione svelando il Gallant. Questo fucile d'assalto a energia è in grado di fornire un fuoco preciso e prolungato contro bersagli fino a medio raggio, mentre il suo sistema di alimentazione ad alta capacità consente agli operatori di sparare un numero considerevolmente maggiore di colpi per batteria.\n\n--- STATISTICHE ---\nPeso: 3.8 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Burst\nDanno Alpha: 21.0 (Energy)  |  DPS: 315.0\nAmmo: 45\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 4.8 km
item_Descklwe_rifle_energy_01_IAE2022=Produttore: Klaus & Werner\nTipo di elemento: fucile d'assalto\nClasse: Energia (laser)\n\nDimensione batteria: 45\nVelocità di fuoco: 450 giri/min\nPortata effettiva: 50 m\n\nAccessori: Ottica (S2), Canna ( S2), Underbarrel (S2)\n\nLe armi d'assalto affidabili non passano mai di moda. Klaus & Werner mantengono questa tradizione svelando il Gallant. Questo fucile d'assalto a energia è in grado di fornire un fuoco preciso e prolungato contro bersagli fino a medio raggio, mentre il suo sistema di alimentazione ad alta capacità consente agli operatori di sparare un numero considerevolmente maggiore di colpi per batteria. L'edizione "Red Alert" mescola il grigio e un rosso vibrante per un design audace e dinamico.\n\n--- STATISTICHE ---\nPeso: 3.8 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Burst\nDanno Alpha: 21.0 (Energy)  |  DPS: 315.0\nAmmo: 45\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 4.8 km
item_Descklwe_rifle_energy_01_sf01=Produttore: Klaus & Werner\nTipo Oggetto: Fucile d'Assalto\nClasse: Energia (Laser)\n\nDimensione Batteria: 45\nRateo di Fuoco: 450 rpm\nGittata Efficace: 50 m\n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S2)\n\nLe armi d'assalto affidabili non passano mai di moda. La Klaus & Werner mantiene questa tradizione svelando il Gallant. Questo fucile d'assalto a energia è in grado di fornire un fuoco accurato e sostenuto su bersagli fino a medio raggio, mentre il suo sistema di alimentazione ad alta capacità consente agli operatori di sparare un numero considerevolmente maggiore di colpi per batteria.\n\nL'edizione Conviction Camo utilizza una selezione diffusa di grigi per aiutare a mimetizzarsi con ambienti più urbani.\n\n--- STATISTICHE ---\nPeso: 3.8 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Burst\nDanno Alpha: 21.0 (Energy)  |  DPS: 315.0\nAmmo: 45\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 4.8 km
item_Descklwe_rifle_energy_01_store01=Produttore: Klaus & Werner\nTipo di Oggetto: Fucile d'Assalto\nClasse: Energia (Laser)\n\nCapacità Batteria: 45\nCadenza di Fuoco: 450 rpm\nGittata Effettiva: 50 m\n\nAccessori: Ottiche (S2), Canna (S2), Sottocanna (S2)\n\nLe armi d'assalto affidabili non passano mai di moda. Klaus & Werner mantiene questa tradizione svelando il Gallant. Questo fucile d'assalto basato sull'energia è in grado di fornire un fuoco preciso e sostenuto su bersagli fino a media distanza, mentre il suo sistema di alimentazione ad alta capacità consente agli operatori di sparare molti più colpi per batteria.\n\nL'edizione Redline presenta una feroce verniciatura di base rossa con riflessi neri e oro.\n\n--- STATISTICHE ---\nPeso: 3.8 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Burst\nDanno Alpha: 21.0 (Energy)  |  DPS: 315.0\nAmmo: 45\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 4.8 km
item_Descklwe_smg_energy_01=Produttore: Klaus & Werner\nTipo di elemento: SMG\nClasse: Laser\n\nDimensione della batteria: 45\nVelocità di fuoco: 562,5 giri/min\nPortata effettiva: 25 m\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna ( S1)\n\nLa maestria artigianale di Klaus e Werner è ancora una volta in piena mostra per rendere il fucile laser a energia compatto Lumin V ancora più letale e affidabile. Una nuova modalità di "fuoco automatico a intervalli" lancia raffiche di cinque colpi quando si tiene premuto il grilletto, utilizzando la saturazione del bersaglio fornita con il fuoco automatico e fornendo pause per compensare la mira. Anche se costantemente in attacco, l'eccellente design dell'arma garantisce un rinculo basso e una diffusione ridotta.\n\n--- STATISTICHE ---\nPeso: 2.6 kg\nCadenza di Fuoco: 700 RPM\nFire Modalità: Burst\nDanno Alpha: 21.0 (Energy)  |  DPS: 245.0\nAmmo: 45\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
item_Descklwe_smg_energy_blue_gold_01=Produttore: Klaus & Werner\nTipo di elemento: SMG\nClasse: Laser\n\nDimensione della batteria: 45\nVelocità di fuoco: 562,5 giri/min\nPortata effettiva: 25 m\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna ( S1)\n\nLa maestria artigianale di Klaus e Werner è ancora una volta in piena mostra per rendere il fucile laser a energia compatto Lumin V ancora più letale e affidabile. Una nuova modalità di "fuoco automatico a intervalli" spara raffiche di cinque colpi quando si tiene premuto il grilletto, utilizzando la saturazione del bersaglio fornita dal fuoco automatico e fornendo pause per compensare la mira. Anche se costantemente in attacco, l'eccellente design dell'arma garantisce un rinculo basso e una diffusione ridotta. L'audace combinazione di colori blu e oro conferisce all'edizione Valor un fascino coraggioso e dignitoso.\n\n--- STATISTICHE ---\nPeso: 2.6 kg\nCadenza di Fuoco: 700 RPM\nFire Modalità: Burst\nDanno Alpha: 21.0 (Energy)  |  DPS: 245.0\nAmmo: 45\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
item_Descklwe_sniper_energy_01_Luminalia_red01=Produttore: Klaus & Werner\nTipo di elemento: fucile di precisione\nClasse: Energia (laser)\n\nDimensione batteria: 20\nVelocità di fuoco: 50 giri/min\nPortata effettiva: 100 m\n\nAccessori: Ottica (S3), Canna ( S2), Underbarrel (S2)\n\nIl fucile energetico a lungo raggio Arrowhead Modello VI di Klaus & Werner è dotato di un corpo composito in fibra di vetro in grado di resistere a qualsiasi numero di ambienti rigorosi sia nell'atmosfera che all'esterno. Costruito con un calcio di precisione, un mirino composto e un bipiede integrato, il Arrowhead offre un'arma stabile e devastante per gli operatori che vogliono mantenere le distanze, ma restare in combattimento. Rilasciata per la prima volta durante Luminalia, l'edizione Lamplighter è stata ispirata dal tradizionale colore rosso delle vacanze.\n\n--- STATISTICHE ---\nPeso: 6.8 kg\nCadenza di Fuoco: 70 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 50.0 (Energy)  |  DPS: 58.3\nAmmo: 16\nVelocità Proiettile: 1,000 m/s  |  Absolute Portata: 4.0 km
item_Descksar_pistol_ballistic_01_IAE2023=Produttore: Kastak Arms\nTipo di elemento: Pistola\nClasse: Balistico\n\nDimensione caricatore: 6\nVelocità di fuoco: 180 giri/min\nPortata effettiva: 100 m\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna ( S1)\n\nSpesso chiamato "cannone portatile" il Kastak Arms, il Coda può terminare uno scontro con un singolo colpo calibro .50, anche se la notevole potenza può rendere difficile gestire il rinculo del Coda. Considerando le dimensioni limitate del caricatore e il calcio notevole, il fuoco prolungato è scoraggiato a favore di colpi singoli più precisi. Progettata in onore dell'IAE 2953, l'edizione Ascension presenta dettagli in acciaio e rame ispirati al Gatac Syulen della manifattura.\n\n--- STATISTICHE ---\nPeso: 1.3 kg\nCadenza di Fuoco: 180 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 60.0 (Phys)  |  DPS: 180.0\nAmmo: 6\nVelocità Proiettile: 550 m/s  |  Absolute Portata: 1.1 km\nFull Dmg to: 55 m  |  Drop: -0.20/m  |  Min Danno: 35.0
