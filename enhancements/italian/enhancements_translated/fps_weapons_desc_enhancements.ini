item_Desclbco_sniper_energy_01=Produttore: Lightning Bolt Co. \nTipo di elemento: fucile di precisione\nClasse: elettronico\n\nDimensione caricatore: 5\nVelocità di fuoco: 30 giri/min\nPortata effettiva: 150 m+\n\nAccessori: ottica (S3), sottocanna (S2)\n\nL'Atzkav è un fucile di precisione di precisione unico della Lightning Bolt Co. Una volta attivata la maniglia di ricarica, spara con precisione un elettrone carico per infliggere danni energetici significativi che si diffondono ai bersagli conduttori vicini. Questo speciale effetto di impulso lascia anche una carica residua nell'area colpita che aumenta il danno inflitto dai successivi colpi di elettroni. Oltre alle speciali capacità di fuoco del fucile, l'Atzkav è meglio conosciuto per la sua canna particolare che crepita di energia quando alimenta il colpo successivo.\n\n--- STATISTICHE ---\nPeso: 9.1 kg\nCadenza di Fuoco: 30 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 165.0 (Energy: 120.0 / Distort: 35.0 / Stun: 10.0)  |  DPS: 82.5\nAmmo: 8\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 1.0 km\nFull Dmg to: 350 m  |  Drop: -0.01/m  |  Min Danno: 30.0
