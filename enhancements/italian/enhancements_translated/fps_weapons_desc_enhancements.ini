item_Descgrin_multitool_01=ATTREZZI VENDUTI SEPARATAMENTE!\n\nProduttore: Greycat Industrial\nTipo di articolo: Utilità\nClasse: Gadget\n\nDimensione caricatore: Batteria integrata\nVelocità di fuoco: N / A (raggio)\nPortata effettiva: 0,5 m\n\nIl Pyro di Greycat Industrial è uno strumento elettrico delle dimensioni di una pistola per il moderno ingegnere spaziale in grado di caricare, tagliare e rattoppare; ottenendo una moltitudine di usi grazie al suo vasto assortimento di accessori. Perfetto per rendere un lavoro duro un po' più semplice.\n\n--- STATISTICHE ---\n<EM4>Repair:</EM4>  HP Rate: 95/s  |  Damage-Map Rate: 10/s  |  HP/Ammo: 0.08  |  Ramp: 0.5s↑ 0.1s↓\n<EM4>Salvage:</EM4>  HP Rate: 310/s  |  Damage-Map Rate: 10/s  |  Material Efficiency: 0.80  |  HP/Ammo: 2.00  |  Ramp: 4.0s↑ 0.2s↓
