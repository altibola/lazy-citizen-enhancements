item_Descvolt_lmg_energy_01=Produttore: Verified Offworld Laser Technologies\nTipo oggetto: LMG\nClasse: Energia (Elettrone)\n\nCapacità batteria: 165\nCadenza di tiro: 550 colpi/minuto - 220 colpi/minuto\nGamma efficace: 50m\n\nAccessori: Ottiche (S3), Sottocanna (S3)\n\nGli ingegneri di VOLT hanno realizzato la mitragliatrice leggera (LMG) Fresnel per portare in prima linea una potente arma energetica, una che può iniziare un combattimento con una rapida raffica di colpi mortali. Man mano che l'arma si surriscalda, i colpi diventano più lenti e potenti, ma fai attenzione al surriscaldamento. Un'arma di questa portata richiede una base solida; gli operatori sono incoraggiati a sparare da una posizione accovacciata per consentire una migliore gestione del rinculo.\n\n--- STATISTICHE ---\nPeso: 6.0 kg\nCadenza di Fuoco: 550 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 9.0 (Energy)  |  DPS: 82.5\nAmmo: 165\nVelocità Proiettile: 1,100 m/s  |  Absolute Portata: 4.4 km
