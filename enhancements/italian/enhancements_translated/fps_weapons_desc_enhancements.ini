item_Deschdgw_pistol_ballistic_01=Produttore: Hedeby Gunworks\nTipo di elemento: Pistola a frammentazione\nClasse: Balistico\n\nDimensione caricatore: 8\nVelocità di fuoco: 140 giri/min\nPortata effettiva: 80 m / 10 m (carica)\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna (S1)\n\nSebbene la Salvo possa essere usata come una normale pistola, Hedeby non si è fermata qui. Premendo il grilletto più a lungo, un primer congelante viene iniettato nella camera e quando viene rilasciato, il pesante percussore colpisce con forza sufficiente a polverizzare il bossolo superraffreddato. Sviluppata accidentalmente nel tentativo di mitigare il surriscaldamento, questa opzione di fuoco carico scarica uno spruzzo mortale di frammenti ad alta velocità seguito da un boom fragoroso.\n\n--- STATISTICHE ---\nPeso: 0.8 kg\nCadenza di Fuoco: 170 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 45.0 (Phys)  |  DPS: 127.5\nAmmo: 8\nVelocità Proiettile: 550 m/s  |  Absolute Portata: 1.1 km\nFull Dmg to: 30 m  |  Drop: -0.08/m  |  Min Danno: 25.0
