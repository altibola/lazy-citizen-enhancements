item_Descgmni_rifle_ballistic_01_mr01=Produttore: Gemini\nTipo Oggetto: Fucile d'Assalto\nClasse: Balistica\n\nDimensione Caricatore: 30\nRateo di Fuoco: 300 rpm / 900 rpm\nGittata Efficace: 50 m\n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S2)\n\nCon l'S71, la Gemini ha progettato un fucile d'assalto ergonomico ideale per gli scontri a medio raggio. Camerato con un proiettile di calibro inferiore rispetto ad altre armi della sua categoria, l'S71 è diventato popolare tra i professionisti militari privati per la sua estetica elegante e la sua precisione accurata. \n\nL'edizione Purgatory Camo vanta un elegante profilo monocromatico.\n\n--- STATISTICHE ---\nPeso: 2.5 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 21.5 (Phys)  |  DPS: 179.2\nAmmo: 30\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 2.4 km\nFull Dmg to: 100 m  |  Drop: -0.10/m  |  Min Danno: 17.5
item_Descgmni_shotgun_ballistic_01=Produttore: Gemini\nTipo di elemento: fucile a pompa\nClasse: balistico\n\nDimensione caricatore: 10\nVelocità di fuoco: 120 giri/min/60 giri/min\nPortata effettiva: 15 m/35 m\n\nAccessori: ottica (S1), canna ( N/A), Underbarrel (S2)\n\nL'R97 combina design elegante e potenza d'arresto per un'arma elegante ed efficace per gli scontri ravvicinati. Questo fucile balistico di Gemini presenta due distinte modalità di fuoco: una modalità semiautomatica ad ampia diffusione ideale per infliggere danni rapidi e una modalità mirata che offre una portata maggiore a scapito di una certa potenza. Questa flessibilità di combattimento ha reso l'R97 un'arma di difesa personale popolare in tutto l'Impero.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 455 RPM\nFire Modalità: Shotgun / Semi-Auto\nDanno Alpha: 32.0 x8 (Phys)  |  DPS: 242.7\nAmmo: 18\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 1.2
item_Descgmni_shotgun_ballistic_01_firerats01=Produttore: Gemini\nTipo di articolo: Fucile a pompa\nClasse: Balistico\n\nDimensioni del caricatore: 18\nCadenza di fuoco: 120 giri/min / 60 giri/min\nGittata effettiva: 15 m / 35 m\n\nAccessori: Ottica (S1), Canna (N/D), Sottocanna (S2)\n\nL'R97 combina un design elegante e un potere di arresto per un'arma da combattimento ravvicinato elegante ed efficace. Questo fucile a pompa balistico della Gemini presenta due distinte modalità di fuoco: una modalità semi-automatica a diffusione ampia ideale per infliggere danni rapidi e una modalità concentrata che offre una gittata maggiore a scapito di un po' di potenza. Questa flessibilità in combattimento ha reso l'R97 un'arma di difesa personale popolare in tutto l'Impero. L'edizione Scorched presenta una patina fiammeggiante unica.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 455 RPM\nFire Modalità: Shotgun / Semi-Auto\nDanno Alpha: 32.0 x8 (Phys)  |  DPS: 242.7\nAmmo: 18\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 1.2
item_Descgmni_shotgun_ballistic_01_pink_red01=Produttore: Gemini\nTipo di elemento: fucile a pompa\nClasse: balistico\n\nDimensione caricatore: 18\nVelocità di fuoco: 120 giri/min/60 giri/min\nPortata effettiva: 15 m/35 m\n\nAccessori: Ottica (S1), Canna ( N/A), Underbarrel (S2)\n\nL'R97 combina design elegante e potenza d'arresto per un'arma elegante ed efficace per gli scontri ravvicinati. Questo fucile balistico di Gemini presenta due distinte modalità di fuoco: una modalità semiautomatica ad ampia diffusione ideale per infliggere danni rapidi e una modalità mirata che offre una portata maggiore a scapito di una certa potenza. Questa flessibilità di combattimento ha reso l'R97 un'arma di difesa personale popolare in tutto l'Impero. Proteggi te stesso e la persona amata con l'edizione speciale Kismet della R97, che presenta una colorazione rosa e nera che ricorda la nave su cui Yuri Ilyin volò per rintracciare la sua amante perduta Corazon Tan nel classico video Coramor.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 455 RPM\nFire Modalità: Shotgun / Semi-Auto\nDanno Alpha: 32.0 x8 (Phys)  |  DPS: 242.7\nAmmo: 18\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 1.2
item_Descgmni_shotgun_ballistic_01_red_black01=SEGNAPOSTO\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 455 RPM\nFire Modalità: Shotgun / Semi-Auto\nDanno Alpha: 32.0 x8 (Phys)  |  DPS: 242.7\nAmmo: 18\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 1.2
item_Descgmni_shotgun_ballistic_01_reward01=Produttore: Gemini\nTipo di Oggetto: Fucile a Pompa\nClasse: Balistico\n\nCapacità Caricatore: 18\nCadenza di Fuoco: 120 rpm / 60 rpm\nGittata Effettiva: 15 m / 35 m\n\nAccessori: Ottiche (S1), Canna (N/A), Sottocanna (S2)\n\nL'R97 combina un design elegante e potenza d'arresto per un'arma da combattimento ravvicinato raffinata ed efficace. Questo fucile a pompa balistico della Gemini presenta due distinte modalità di fuoco: una modalità semiautomatica ad ampia rosata, ideale per infliggere danni rapidi, e una modalità focalizzata che offre una gittata maggiore a discapito di un po' di potenza. Questa flessibilità in combattimento ha reso l'R97 un'arma da difesa personale popolare in tutto l'Impero.\n\nQuesta edizione presenta un audace motivo mimetico digitale rosso.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 455 RPM\nFire Modalità: Shotgun / Semi-Auto\nDanno Alpha: 32.0 x8 (Phys)  |  DPS: 242.7\nAmmo: 18\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 1.2
item_Descgmni_smg_ballistic_01_Luminalia=Produttore: Gemini\nTipo di oggetto: SMG\nClasse: balistico\n\nDimensione caricatore: 50\nVelocità di fuoco: 1.100 giri/min\nPortata effettiva: 35 m\n\nAccessori: Canna (S1), Ottica (S1), Sottocanna (S1) \n\nFacile da maneggiare e bello da vedere, il C54 è un mitragliatore Gemini elegante e bilanciato con precisione. Il suo telaio in polimero leggero e il design ergonomico lo rendono ideale per gli scontri ravvicinati. Il C54 è in grado di sparare colpi da 10 mm in modalità completamente automatica per fornire il massimo supporto e saturazione del bersaglio per garantire che qualsiasi ingaggio finisca rapidamente. L'edizione Luminalia sfoggia un festoso design rosso e verde.\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_Descgmni_smg_ballistic_01_blue_white01=Manufacturer: Gemini\nItem Type: SMG\nClasse: Ballistic\n\nDimensione Caricatore: 50\nRate Of Fire: 1,100 rpm\nPortata Efficace: 35m\n\nAttachments: Barrel (S1), Optics (S1), Underbarrel (S1)\n\nEasy to handle and a beauty to behold, the C54 is a sleek and precisely balanced SMG from Gemini. Its lightweight polymer frame and ergonomic design makes it ideal for close quarter engagements. The C54 is capable of firing 10mm rounds on full auto to provide maximum target saturation to ensure that any engagement ends quick. Created to honor the Origin Racing team, this SMG is primarily white with black and blue highlights.\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_Descgmni_smg_ballistic_01_firerats01=Produttore: Gemini\nTipo di articolo: SMG\nClasse: Balistico\n\nDimensioni caricatore: 50\nCadenza di fuoco: 1.100 giri/min\nGittata effettiva: 35 m\n\nAccessori: Canna (S1), Ottica (S1), Sottocanna (S1)\n\nFacile da maneggiare e una bellezza da ammirare con il suo stile con accenti viola, la C54 è una SMG elegante e perfettamente bilanciata di Gemini. Il suo telaio in polimero leggero e il design ergonomico la rendono ideale per gli scontri ravvicinati. La C54 è in grado di sparare proiettili da 10 mm in modalità completamente automatica per fornire il massimo supporto e saturazione del bersaglio per garantire che qualsiasi scontro finisca rapidamente. L'edizione Scorched presenta un'esclusiva patina fiammeggiante.\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_Descgmni_smg_ballistic_01_green_grey01=Produttore: Gemini\nTipo di oggetto: SMG\nClasse: balistico\n\nDimensione caricatore: 40\nVelocità di fuoco: 1.100 giri/min\nPortata effettiva: 35 m\n\nAccessori: Canna (S1), Ottica (S1), Sottocanna (S1) \n\nFacile da maneggiare e bello da vedere con il suo stile con accenti viola, il C54 è un mitragliatore Gemini elegante e bilanciato con precisione. Il suo telaio in polimero leggero e il design ergonomico lo rendono ideale per gli scontri ravvicinati. Il C54 è in grado di sparare colpi da 10 mm in modalità completamente automatica per fornire il massimo supporto e saturazione del bersaglio per garantire che qualsiasi ingaggio finisca rapidamente. Questa speciale edizione Luckbringer verde e grigia rilasciata per Stella Fortuna 2954 è un ottimo modo per avere la fortuna dalla tua parte.\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_Descgmni_smg_ballistic_01_purple01=Produttore: Gemini\nTipo di articolo: SMG\nClasse: Balistico\n\nDimensioni caricatore: 50\nCadenza di fuoco: 1.100 giri/min\nGittata effettiva: 35 m\n\nAccessori: Canna (S1), Ottica (S1), Sottocanna (S1)\n\nFacile da maneggiare e una bellezza da ammirare, la C54 è una SMG elegante e perfettamente bilanciata della Gemini. Il suo telaio in polimero leggero e il design ergonomico la rendono ideale per gli scontri ravvicinati. La C54 è in grado di sparare proiettili da 10 mm in modalità completamente automatica per fornire il massimo supporto e la saturazione del bersaglio per garantire che qualsiasi scontro finisca rapidamente. Creata per celebrare l'IAE del 2954, l'edizione Starchaser è di un vivace viola con dettagli bianchi e neri.\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_Descgmni_smg_ballistic_01_sf01=Produttore: Gemini\nTipo Oggetto: SMG\nClasse: Balistica\n\nDimensione Caricatore: 50\nRateo di Fuoco: 1.100 rpm\nGittata Efficace: 35m\n\nAccessori: Canna (S1), Ottica (S1), Sottocanna (S1)\n\nFacile da maneggiare e una bellezza da guardare, il C54 è un SMG elegante e bilanciato con precisione della Gemini. Il suo leggero telaio in polimero e il design ergonomico lo rendono ideale per gli scontri a corto raggio. Il C54 è in grado di sparare proiettili da 10 mm in modalità automatica per fornire il massimo supporto e saturazione del bersaglio per garantire che qualsiasi scontro finisca in fretta. \n\nL'edizione Ochelo prende la sua ispirazione di design dall'omonimo strumento musicale Banu.\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_Descgmni_sniper_ballistic_01=Produttore: Gemini\nTipo di elemento: fucile di precisione\nClasse: balistico\n\nDimensione caricatore: 15\nVelocità di fuoco: 120 giri/min\nPortata effettiva: 80 m\n\nAccessori: ottica (S3), canna (S2), sottocanna ( S2)\n\nDevasta a distanza con il fucile di precisione A03. Magistralmente progettata da Clem, co-fondatore di Gemini Tevarin, l'arma bilancia un design elegante ed ergonomico con un potente pugno balistico. L'A03 offre una cadenza di fuoco impressionante per un fucile di precisione che sacrifica la precisione a favore dell'urgenza quando sono necessari colpi successivi. Considerando il suo rinomato design e le sue caratteristiche uniche, è facile capire perché l'A03 è diventato uno dei preferiti dai professionisti della sicurezza in tutto l'impero.\n\n--- STATISTICHE ---\nPeso: 4.7 kg\nCadenza di Fuoco: 225 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 42.5 (Phys)  |  DPS: 159.4\nAmmo: 15\nVelocità Proiettile: 800 m/s  |  Absolute Portata: 1.6 km\nFull Dmg to: 150 m  |  Drop: -0.02/m  |  Min Danno: 35.0
