item_Descgrin_salvage_01=Produttore: Greycat Industriale\nTipo di elemento: Utilità\nClasse: Gadget\n\nDimensione contenitore: Grande\nVelocità di fuoco: N / A (raggio)\nPortata effettiva: 5 m\n\nSmalti il ??materiale recuperato ed effettua riparazioni con il Cambio, uno strumento di recupero e riparazione (SRT) a duplice scopo progettato per raccogliere e convertire le leghe e i polimeri presenti nei rottami in materiale composito riciclato che può essere venduto o utilizzato per effettuare riparazioni rapide. Il Cambio SRT è caratterizzato da elevate velocità di rimozione e da un'impressionante durata della batteria, che lo rendono un gadget essenziale per meccanici e viaggiatori spaziali.\n\n--- STATISTICHE ---\n<EM4>Repair:</EM4>  HP Rate: 160/s  |  Damage-Map Rate: 10/s  |  HP/Ammo: 0.10  |  Ramp: 0.5s↑ 0.1s↓\n<EM4>Salvage:</EM4>  HP Rate: 670/s  |  Damage-Map Rate: 10/s  |  Material Efficiency: 0.70  |  HP/Ammo: 5.80  |  Ramp: 4.0s↑ 2.0s↓
item_Descgrin_salvage_01_store01=Produttore: Greycat Industrial\nTipo di Oggetto: Utilità\nClasse: Gadget\n\nDimensione Contenitore: Grande\nRateo di Fuoco: N / A (Raggio)\nGittata Effettiva: 5 m\n\nSmantella relitti ed effettua riparazioni con il Cambio, uno strumento a doppio scopo per il recupero e la riparazione (SRT) progettato per raccogliere e convertire leghe e polimeri trovati nei rottami in materiale composito riciclato che può essere venduto o utilizzato per effettuare rapide riparazioni. Il Cambio SRT presenta velocità di smantellamento rapide e un'impressionante durata della batteria, rendendolo un gadget essenziale per meccanici e viaggiatori spaziali.\n\nL'edizione "Heartthrob" è di un violetto sognante e scintillante; perfetto per far cedere le ginocchia ad amici e nemici.\n\n--- STATISTICHE ---\n<EM4>Repair:</EM4>  HP Rate: 160/s  |  Damage-Map Rate: 10/s  |  HP/Ammo: 0.10  |  Ramp: 0.5s↑ 0.1s↓\n<EM4>Salvage:</EM4>  HP Rate: 670/s  |  Damage-Map Rate: 10/s  |  Material Efficiency: 0.70  |  HP/Ammo: 5.80  |  Ramp: 4.0s↑ 2.0s↓
item_Descgrin_tractor_01=Produttore: Greycat Industrial\nTipo di elemento: Raggio traente\nClasse: Gadget\n\nDimensione caricatore: Batteria integrata\nVelocità di fuoco: N / A (raggio)\nPortata effettiva: 10-20 m\n\nIl servizio pesante di Greycat il raggio traente vanta prestazioni industriali a un prezzo conveniente per il consumatore. Grazie alla batteria a lunga durata e all'emettitore di raggio più ampio, MaxLift può facilmente manipolare oggetti più pesanti e ingombranti, rendendolo lo strumento perfetto per lunghe giornate di trasporto di merci.\n\n--- STATISTICHE ---\nPeso: 3.8 kg\nFire Modalità: tractor\nDanno Alpha: 21.0 (Energy)\nAmmo: 60\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 4.8 km
item_Descgrin_tractor_01_msn_rwd01=Produttore: Greycat Industrial\nTipo di Oggetto: Raggio Traente\nClasse: Gadget\n\nDimensione Caricatore: Batteria Integrata\nRateo di Fuoco: N / A (Raggio)\nGittata Effettiva: 10-20 m\n\nIl raggio traente per uso intensivo di Greycat vanta prestazioni industriali a un prezzo accessibile al consumatore. Con la sua batteria a lunga durata e l'emettitore del raggio più ampio, il MaxLift può manipolare facilmente oggetti più pesanti e ingombranti, rendendolo lo strumento perfetto per lunghe giornate di trasporto merci.\n\nL'edizione AA Transport presenta una colorazione verde metallizzato ed era destinata a coloro che hanno assistito la Transport Division di Alliance Aid durante il periodo di necessità di Levski.\n\n--- STATISTICHE ---\nPeso: 3.8 kg\nFire Modalità: tractor\nDanno Alpha: 21.0 (Energy)\nAmmo: 60\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 4.8 km
