item_Descksar_smg_energy_01_red01=Produttore: Kastak Arms\nTipo di articolo: SMG\nClasse: Energia (laser)\n\nDimensioni batteria: 60\nCadenza di fuoco: 800 giri/min\nPortata effettiva: 30 m\n\nIl Custodian SMG di Kastak Arms si concentra su un'elevata cadenza di fuoco rispetto a danni e precisione, rendendolo una scelta ideale per spazzare attraverso ambienti ristretti e combattimenti ravvicinati. L'edizione speciale "Brimstone" presenta una finitura superiore rossa audace e una finitura grigio scuro sulla metà inferiore dell'arma.\n\n--- STATISTICHE ---\nPeso: 3.4 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Auto / Charge / Burst\nDanno Alpha: 13.0 (Energy)  |  DPS: 195.0\nAmmo: 60\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
item_Descksar_sniper_ballistic_01=Produttore: Kastak Arms\nTipo di elemento: fucile di precisione\nClasse: balistico\n\nDimensione caricatore: 8\nVelocità di fuoco: 30 giri/min\nPortata effettiva: 120 m\n\nAccessori: ottica (S3), canna (N/A) , Underbarrel (S2)\n\nLo Scalpel è un fucile di precisione unico e versatile di Kastak Arms. Progettato con due canne sovrapposte, dispone di due modalità di fuoco per adattare il tiro alla situazione. Può sferrare un singolo colpo potente da una lunga distanza o sparare con entrambe le canne in rapida successione per creare una raffica di doppi colpi.\n\n--- STATISTICHE ---\nPeso: 5.1 kg\nCadenza di Fuoco: 600 RPM\nFire Modalità: Burst / Semi-Auto\nDanno Alpha: 45.0 (Phys)  |  DPS: 450.0\nAmmo: 12\nVelocità Proiettile: 875 m/s  |  Absolute Portata: 1.8 km\nFull Dmg to: 335 m  |  Min Danno: 45.0
item_Descksar_sniper_ballistic_01_blue_white01=Produttore: Kastak Arms\nTipo di elemento: fucile di precisione\nClasse: balistico\n\nDimensione caricatore: 8\nVelocità di fuoco: 30 giri/min\nPortata effettiva: 120 m\n\nAccessori: ottica (S3), canna (N/A) , Underbarrel (S2)\n\nLo Scalpel è un fucile di precisione unico e versatile di Kastak Arms. Progettato con una configurazione verticale a due canne, dispone di due modalità di fuoco in modo da poter adattare il tiro alla situazione per sferrare un singolo, potente colpo da una lunga distanza, oppure sparare con entrambe le canne in rapida successione per creare una raffica a doppio colpo. Questa speciale edizione Permafrost presenta una colorazione blu e grigia che ricorda un ghiacciaio sotto un accecante cielo invernale.\n\n--- STATISTICHE ---\nPeso: 5.1 kg\nCadenza di Fuoco: 600 RPM\nFire Modalità: Burst / Semi-Auto\nDanno Alpha: 45.0 (Phys)  |  DPS: 450.0\nAmmo: 12\nVelocità Proiettile: 875 m/s  |  Absolute Portata: 1.8 km\nFull Dmg to: 335 m  |  Min Danno: 45.0
item_Desclbco_pistol_energy_01=Produttore: Lightning Bolt Co.\nTipo di elemento: Pistola\nClasse: Elettrone\n\nCapacità della batteria: 10\nVelocità di fuoco: 350 giri/min\nPortata effettiva: 35 m\n\nAccessori: Ottica (S1), Sottocanna (S1)\n \nL'eccellenza ingegneristica scalfisce solo la superficie della distinta pistola Yubarev. Irina Arkadova, ex mercenaria diventata magnate della produzione di armi, ha supervisionato ogni aspetto dell'arma, conferendole potenza, praticità ed eleganza. Caratterizzato da una classica impugnatura con venature del legno e un design della canna all'avanguardia, Yubarev spara un colpo di elettroni carico che colpisce non solo il bersaglio, amplificando la carica ad ogni colpo, ma può diffondersi ad altri bersagli conduttivi nel raggio d'azione.\n\n--- STATISTICHE ---\nPeso: 1.6 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 41.0 (Energy: 32.5 / Distort: 7.5 / Stun: 1.0)  |  DPS: 239.2\nAmmo: 10\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 1.0 km\nFull Dmg to: 20 m  |  Drop: -0.10/m  |  Min Danno: 1.5
