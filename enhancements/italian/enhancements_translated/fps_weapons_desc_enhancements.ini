item_Descvolt_shotgun_energy_01=Produttore: Verified Offworld Laser Technologies\nTipo oggetto: Fucile a pompa\nClasse: Energetica (Laser)\n \nCapacità batteria: 20\nRateo di fuoco: 200 - 450 rpm\nPortata effettiva: 10m\n \nAccessori: Ottiche (S2), Sottocanna (S2)\n \nSparando potenti raffiche di energia a corto raggio, gli ingegneri di Verified Offworld Laser Technologies hanno sviluppato la Sottocanna laser Prism in modo che, all'aumentare dei livelli di calore dell'arma, i proiettili inizino a fondersi in proiettili simili a lumache che infliggono danni maggiori ai bersagli.\n\n--- STATISTICHE ---\nPeso: 2.1 kg\nCadenza di Fuoco: 385 RPM\nFire Modalità: SEMI / Semi-Auto\nDanno Alpha: 5.8 (Energy)  |  DPS: 36.9\nAmmo: 20\nVelocità Proiettile: 300 m/s  |  Absolute Portata: 600 m
