item_Descnone_smg_energy_01=Produttore: Sconosciuto\nTipo di Oggetto: SMG\nClasse: Energetica (Laser)\n\nDimensione Batteria: 60\nRateo di Fuoco: 800 rpm\nGittata Effettiva: 30 m\n\nAssemblata con qualsiasi parte e pezzo disponibile, la SMG Ripper può probabilmente fare abbastanza danni da tirarti fuori da una situazione difficile. Sii solo pronto a veder le cose farsi caotiche. L'edizione Sunblock presenta una finitura gialla.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nDanno Alpha: 21.0 (Energy)\nAmmo: 60\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km
