item_Descvolt_lmg_energy_01_collector02=Produttore: Verified Offworld Laser Technologies\nTipo Oggetto: LMG\nClasse: Energy (Electron)\n\nCapacità Batteria: 165\nRate Of Fire: 550 rpm - 220 rpm\nPortata Efficace: 50m\n\nAttachments: Optics (S3), Underbarrel (S3)\n\nGli ingegneri di VOLT hanno creato la Fresnel LMG per portare in prima linea una potente arma energetica, in grado di iniziare un combattimento con una rapida raffica di colpi letali. Man mano che l'arma si surriscalda, i colpi diventano più lenti e più potenti, ma fate attenzione al surriscaldamento. Un'arma di questa portata richiede una base solida; si incoraggiano gli operatori a sparare da una posizione accovacciata per consentire una migliore gestione del rinculo.\n\nL'edizione Yormandi è verde screziata con un disegno del feroce rettile lungo il lato.\n\n--- STATISTICHE ---\nPeso: 6.0 kg\nCadenza di Fuoco: 550 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 9.0 (Energy)  |  DPS: 82.5\nAmmo: 165\nVelocità Proiettile: 1,100 m/s  |  Absolute Portata: 4.4 km
