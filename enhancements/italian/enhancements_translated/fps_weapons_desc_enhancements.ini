item_Descbehr_glauncher_ballistic_01=Produttore: Behring\nTipo di elemento: Lanciagranate\nClasse: Balistico\n\nDimensione caricatore: 6\nVelocità di fuoco: 40 giri/min\nPortata effettiva: Variabile (80 m)\n\nAccessori: Ottica (S1), Canna (N/A ), Underbarrel (S1)\n\nIl lanciagranate GP-33 MOD di livello militare spara granate da 40 mm per liberare stanze e stanare i nemici dietro una copertura grazie al design di precisione di Behring che prepara ogni granata a esplodere all'impatto.\n\n--- STATISTICHE ---\nPeso: 5.3 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 12.5 (Phys)  |  DPS: 12.5\nAmmo: 6\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descbehr_glauncher_ballistic_01_black01=Produttore: Behring\nTipo di elemento: Lanciagranate\nClasse: Balistico\n\nDimensione caricatore: 6\nVelocità di fuoco: 40 giri/min\nPortata effettiva: Variabile (80 m)\n\nAccessori: Ottica (S1), Canna (N/A ), Underbarrel (S1)\n\nIl lanciagranate GP-33 MOD di livello militare spara granate da 40 mm per liberare stanze e stanare i nemici dietro una copertura grazie al design di precisione di Behring che prepara ogni granata a esplodere all'impatto. Una combinazione di colori nero e grigio conferisce all'edizione Thunderclap un aspetto sottile adatto a qualsiasi professionista della sicurezza.\n\n--- STATISTICHE ---\nPeso: 5.3 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 12.5 (Phys)  |  DPS: 12.5\nAmmo: 6\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descbehr_glauncher_ballistic_01_cen01=Produttore: Behring\nTipo di elemento: Lanciagranate\nClasse: Balistico\n\nDimensione caricatore: 6\nVelocità di fuoco: 40 giri/min\nPortata effettiva: Variabile (80 m)\n\nAccessori: Ottica (S1), Sottocanna (S1)\n\nIl lanciagranate GP-33 MOD di livello militare spara granate da 40 mm per liberare le stanze e stanare i nemici dietro una copertura grazie al design di precisione di Behring che prepara ogni granata a esplodere all'impatto. L'edizione Ashfall mescola blu scuro, grigio e nero per un look sottile ma elegante.\n\n--- STATISTICHE ---\nPeso: 5.3 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 12.5 (Phys)  |  DPS: 12.5\nAmmo: 6\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descbehr_glauncher_ballistic_01_imp01=Produttore: Behring\nTipo di elemento: Lanciagranate\nClasse: Balistico\n\nDimensione caricatore: 6\nVelocità di fuoco: 40 giri/min\nPortata effettiva: Variabile (80 m)\n\nAccessori: Ottica (S1), Sottocanna (S1)\n\nIl lanciagranate GP-33 MOD di livello militare spara granate da 40 mm per liberare le stanze e stanare i nemici dietro una copertura grazie al design di precisione di Behring che prepara ogni granata a esplodere all'impatto. Una leggera finitura metallica applicata alla canna e al calcio attira l'attenzione e distingue l'edizione ramehead dalle altre versioni.\n\n--- STATISTICHE ---\nPeso: 5.3 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 12.5 (Phys)  |  DPS: 12.5\nAmmo: 6\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descbehr_glauncher_ballistic_01_mat01=Produttore: Behring \n Tipo di articolo: Grenade Launcher \n Classe: balistico \n \n Dimensione del caricatore: 6 \n Tasso di incendio: 40 giri/min \n Gamma effettiva: variabile (80m) \n \n Allegati: Optics (S1), barra (N/A), Underbarl (S1) \n Il lanciatore MOD GP-33 di livello militare spara granate da 40 mm per liberare le stanze e svuotare i nemici dietro la copertura grazie al design di precisione di Behring che si prepara ogni granata per esplodere sull'impatto. Uno dei tanti articoli che Wikelo ha acquisito nei suoi viaggi, l'edizione "abbastanza utile" è un must per qualsiasi collezionista serio.\n\n--- STATISTICHE ---\nPeso: 5.3 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 12.5 (Phys)  |  DPS: 12.5\nAmmo: 6\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descbehr_glauncher_ballistic_01_shin=Produttore: Behring\nTipo di elemento: Lanciagranate\nClasse: Balistico\n\nDimensione caricatore: 6\nVelocità di fuoco: 40 giri/min\nPortata effettiva: Variabile (80 m)\n\nAccessori: Ottica (S1), Sottocanna (S1)\n\nIl lanciagranate GP-33 MOD di livello militare spara granate da 40 mm per liberare le stanze e stanare i nemici dietro una copertura grazie al design di precisione di Behring che prepara ogni granata a esplodere all'impatto. L'edizione Umber è rifinita in ruggine e arancione.\n\n--- STATISTICHE ---\nPeso: 5.3 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 12.5 (Phys)  |  DPS: 12.5\nAmmo: 6\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descbehr_lmg_ballistic_01=Produttore: Behring\nTipo di elemento: LMG\nClasse: balistico\n\nDimensione caricatore: 120\nVelocità di fuoco: 800 giri/min\nPortata effettiva: 40 m\n\nAccessori: ottica (S2), canna (S2), sottocanna (S3 )\n\nBehring ha progettato l'FS-9 perché fosse una travolgente forza sul campo di battaglia. Questa mitragliatrice leggera è dotata di una modalità completamente automatica che la rende ideale per stendere il fuoco di copertura o trattenere i nemici che avanzano. L'FS-9 è acclamato anche per la sua capacità di mantenere la precisione mentre scatena un fuoco prolungato.\n\n--- STATISTICHE ---\nPeso: 6.8 kg\nCadenza di Fuoco: 650 RPM\nFire Modalità: Auto\nDanno Alpha: 14.5 (Phys)  |  DPS: 157.1\nAmmo: 75\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km\nFull Dmg to: 50 m  |  Drop: -0.01/m  |  Min Danno: 10.0
item_Descbehr_lmg_ballistic_01_luminalia_green01=Produttore: Behring\nTipo di elemento: LMG\nClasse: balistico\n\nDimensione caricatore: 120\nVelocità di fuoco: 800 giri/min\nPortata effettiva: 40 m\n\nAccessori: ottica (S2), canna (S2), sottocanna (S3 )\n\nBehring ha progettato l'FS-9 perché fosse una travolgente forza sul campo di battaglia. Questa mitragliatrice leggera è dotata di una modalità completamente automatica che la rende ideale per stendere il fuoco di copertura o trattenere i nemici che avanzano. L'FS-9 è acclamato anche per la sua capacità di mantenere la precisione mentre scatena un fuoco prolungato. L'edizione Evergreen abbraccia lo spirito Luminalia utilizzando un tradizionale colore natalizio con la sua vibrante tinta verde.\n\n--- STATISTICHE ---\nPeso: 6.8 kg\nCadenza di Fuoco: 650 RPM\nFire Modalità: Auto\nDanno Alpha: 14.5 (Phys)  |  DPS: 157.1\nAmmo: 75\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km\nFull Dmg to: 50 m  |  Drop: -0.01/m  |  Min Danno: 10.0
item_Descbehr_lmg_ballistic_01_tint01=Produttore: Behring\nTipo di Oggetto: LMG\nClasse: Balistica\n\nDimensione Caricatore: 75\nRateo di Fuoco: 800 rpm\nGittata Effettiva: 40 m\n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S3)\n\nBehring ha progettato l'FS-9 per essere una forza schiacciante sul campo di battaglia. Questa mitragliatrice leggera dispone di una modalità completamente automatica che la rende ideale per fornire fuoco di copertura o trattenere i nemici in avanzata. L'FS-9 è anche acclamata per la sua capacità di mantenere la precisione durante il fuoco sostenuto. L'edizione Blacklist presenta una finitura nera scura.\n\n--- STATISTICHE ---\nPeso: 6.8 kg\nCadenza di Fuoco: 650 RPM\nFire Modalità: Auto\nDanno Alpha: 14.5 (Phys)  |  DPS: 157.1\nAmmo: 75\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km\nFull Dmg to: 50 m  |  Drop: -0.01/m  |  Min Danno: 10.0
item_Descbehr_lmg_ballistic_01_xenothreat01=Produttore: Behring\nTipo di elemento: LMG\nClasse: balistico\n\nDimensione caricatore: 120\nVelocità di fuoco: 800 giri/min\nPortata effettiva: 40 m\n\nAccessori: ottica (S2), canna (S2), sottocanna (S3 )\n\nBehring ha progettato l'FS-9 perché fosse una travolgente forza sul campo di battaglia. Questa mitragliatrice leggera è dotata di una modalità completamente automatica che la rende ideale per stendere il fuoco di copertura o trattenere i nemici che avanzano. L'FS-9 è acclamato anche per la sua capacità di mantenere la precisione mentre scatena un fuoco prolungato. Questo articolo della linea Legendary Bounty Hunters ha fatto sì che il famoso tracker Farook "Stoneface" Norris abbia progettato un look per la sua amata FS-9 LMG caratterizzato da sorprendenti tocchi di rosso su una tinta di base grigia.\n\n--- STATISTICHE ---\nPeso: 6.8 kg\nCadenza di Fuoco: 650 RPM\nFire Modalità: Auto\nDanno Alpha: 14.5 (Phys)  |  DPS: 157.1\nAmmo: 75\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km\nFull Dmg to: 50 m  |  Drop: -0.01/m  |  Min Danno: 10.0
