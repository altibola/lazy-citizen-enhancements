item_Descbehr_rifle_ballistic_02_civilian=Produttore: Behring \nTipo di oggetto: Fucile d'assalto \nClasse: Balistico \n\nCapacità caricatore: 15 \nCadenza di fuoco: 475 giri al minuto \nGittata effettiva: 100 m \n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S2) \n\nDiscendente diretto dell'arma standard in dotazione ai Marines UEE, Behring ha creato il semiautomatico P8-AR per fornire ai civili di tutto l'impero un'arma semplice e affidabile per difendersi dai nemici aggressivi.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 235 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 45.0 (Phys)  |  DPS: 176.2\nAmmo: 15\nVelocità Proiettile: 1,150 m/s  |  Absolute Portata: 2.3 km\nFull Dmg to: 50 m  |  Drop: -0.10/m  |  Min Danno: 40.0
item_Descbehr_rifle_ballistic_02_civilian_digi01=Produttore: Behring \nTipo di articolo: Fucile d'assalto \nClasse: Balistico \n\nDimensioni del caricatore: 15 \nCadenza di fuoco: 475 giri al minuto \nGittata effettiva: 100 m \n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S2) \n\nDiscendente diretto dell'arma standard dei Marines UEE, Behring ha creato la semiautomatica P8-AR per fornire ai civili di tutto l'impero un'arma semplice e affidabile per difendersi dagli ostili aggressivi. L'edizione "Metro Camo" presenta un motivo digicamo grigio.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 235 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 45.0 (Phys)  |  DPS: 176.2\nAmmo: 15\nVelocità Proiettile: 1,150 m/s  |  Absolute Portata: 2.3 km\nFull Dmg to: 50 m  |  Drop: -0.10/m  |  Min Danno: 40.0
item_Descbehr_rifle_ballistic_02_civilian_store01=Produttore: Behring\nTipo di Oggetto: Fucile d'Assalto\nClasse: Balistico\n\nCapacità Caricatore: 15\nCadenza di Fuoco: 475 rpm\nGittata Effettiva: 100 m\n\nAccessori: Ottiche (S2), Canna (S2), Sottocanna (S2)\n\nDiscendente diretto dell'arma d'ordinanza degli UEE Marines, la Behring ha realizzato il P8-AR semiautomatico per fornire ai civili di tutto l'impero un'arma semplice e affidabile per difendersi dalle minacce ostili.\n\nL'edizione Dominion Camo aggiunge al fucile un motivo mimetico verde scuro.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 235 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 45.0 (Phys)  |  DPS: 176.2\nAmmo: 15\nVelocità Proiettile: 1,150 m/s  |  Absolute Portata: 2.3 km\nFull Dmg to: 50 m  |  Drop: -0.10/m  |  Min Danno: 40.0
item_Descbehr_shotgun_ballistic_01=Produttore: Behring\nTipo di elemento: fucile a pompa\nClasse: balistico\n\nDimensione caricatore: 12\nVelocità di fuoco: 75 giri/min\nPortata effettiva: 15 m\n\nAccessori: ottica (S1), canna (S3), sottocanna (S2 )\n\nOriginprogettato per l'esercito, Behring ha deciso di vendere il fucile balistico BR-2 al grande pubblico dopo che i primi tester delle armi continuavano a chiedere di portarne uno a casa. Dotato di una modalità di fuoco semiautomatica in grado di fornire rapidamente un potere d'arresto devastante, il BR-2 è la scelta ideale sia per le operazioni offensive che difensive.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 350.0 x10 (Phys)  |  DPS: 875.0\nAmmo: 99,999\nVelocità Proiettile: 550 m/s  |  Absolute Portata: 4.4 km
item_Descbehr_shotgun_ballistic_01_blue_white01=PLACEHOLDER\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 90 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 88.0 x8 (Phys)  |  DPS: 132.0\nAmmo: 12\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 10.0
item_Descbehr_shotgun_ballistic_01_mr01=Produttore: Behring\nTipo Oggetto: Fucile a Pompa\nClasse: Balistica\n\nDimensione Caricatore: 12\nRateo di Fuoco: 75 rpm\nGittata Efficace: 15 m\n\nAccessori: Ottica (S1), Canna (S3), Sottocanna (S2)\n\nOriginariamente progettato per i militari, la Behring ha deciso di vendere il fucile a pompa balistico BR-2 al pubblico in generale dopo che i collaudatori iniziali dell'arma continuavano a chiedere di portarsene uno a casa. Dotato di una modalità di fuoco semi-automatica in grado di fornire rapidamente un potere d'arresto devastante, il BR-2 è la scelta ideale sia per le operazioni offensive che difensive. La veste grigio su grigio dell'edizione Purgatory Camo crea un profilo elegante e utilitario.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 90 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 88.0 x8 (Phys)  |  DPS: 132.0\nAmmo: 12\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 10.0
item_Descbehr_shotgun_ballistic_01_tint01=Produttore: Behring\nTipo di Oggetto: Fucile a Pompa\nClasse: Balistico\n\nCapacità Caricatore: 12\nCadenza di Fuoco: 75 rpm\nGittata Effettiva: 15 m\n\nAccessori: Ottiche (S1), Canna (S3), Sottocanna (S2)\n\nOriginariamente progettato per i militari, la Behring ha deciso di vendere il fucile a pompa balistico BR-2 al grande pubblico dopo che i primi collaudatori dell'arma hanno continuato a chiedere di poterne portare uno a casa. Dotato di una modalità di fuoco semiautomatica in grado di fornire rapidamente una devastante potenza d'arresto, il BR-2 è la scelta ideale sia per operazioni offensive che difensive.\n\nL'edizione Blacklist presenta una finitura nera.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 90 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 88.0 x8 (Phys)  |  DPS: 132.0\nAmmo: 12\nVelocità Proiettile: 225 m/s  |  Absolute Portata: 450 m\nFull Dmg to: 12 m  |  Drop: -0.05/m  |  Min Danno: 10.0
item_Descbehr_smg_ballistic_01=Produttore: Behring\nTipo di oggetto: SMG\nClasse: balistico\n\nDimensione caricatore: 45\nVelocità di fuoco: 800 giri/min\nPortata effettiva: 30 m\n\nAccessori: ottica (S1), canna (S1), sottocanna (S1 )\n\nQuando la principale forza combattente dell'universo sceglie un'arma come standard, vale la pena alzarsi e prenderne atto. Il P8-SC prodotto da Behring è stato il fucile mitragliatore balistico preferito dai Marines UEE fin da quando è uscito dalla linea di produzione, ma da allora molti hanno fatto affidamento su quest'arma per la propria sicurezza e protezione personale.\n\n--- STATISTICHE ---\nPeso: 1.9 kg\nCadenza di Fuoco: 850 RPM\nFire Modalità: Auto / Burst\nDanno Alpha: 13.8 (Phys)  |  DPS: 194.8\nAmmo: 45\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.06/m  |  Min Danno: 10.0
item_Descbehr_smg_ballistic_01_IAE2022=Produttore: Behring\nTipo di oggetto: SMG\nClasse: balistico\n\nDimensione caricatore: 45\nVelocità di fuoco: 800 giri/min\nPortata effettiva: 30 m\n\nAccessori: ottica (S1), canna (S1), sottocanna (S1 )\n\nQuando la principale forza combattente dell'universo sceglie un'arma come standard, vale la pena alzarsi e prenderne atto. Il P8-SC prodotto da Behring è stato il fucile mitragliatore balistico preferito dai Marines UEE fin da quando è uscito dalla linea di produzione, ma da allora molti hanno fatto affidamento su quest'arma per la propria sicurezza e protezione personale. L'edizione "Red Alert" mescola il grigio e un rosso vibrante per un design audace e dinamico.\n\n--- STATISTICHE ---\nPeso: 1.9 kg\nCadenza di Fuoco: 850 RPM\nFire Modalità: Auto / Burst\nDanno Alpha: 13.8 (Phys)  |  DPS: 194.8\nAmmo: 45\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.06/m  |  Min Danno: 10.0
item_Descbehr_smg_ballistic_01_iae2501=Produttore: Behring\nTipo oggetto: SMG\nClasse: Balistico\n\nDimensioni Caricatore: 45\nRateo di Fuoco: 800 rpm\nPortata Effettiva: 30 m\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna (S1)\n\nQuando la principale forza combattente dell'universo sceglie un'arma come standard, conviene alzarsi e prendere nota. La P8-SC, realizzata da Behring, è stata la mitragliatrice balistica d'elezione per i Marines della UEE da quando è uscita dalla linea di produzione, ma da allora, molti hanno fatto affidamento su quest'arma per la propria sicurezza e protezione personale. L'edizione Epoque presenta una colorazione blu navy e nera con dettagli in oro barocco e ali stilizzate su entrambi i lati dell'impugnatura.\n\n--- STATISTICHE ---\nPeso: 1.9 kg\nCadenza di Fuoco: 850 RPM\nFire Modalità: Auto / Burst\nDanno Alpha: 13.8 (Phys)  |  DPS: 194.8\nAmmo: 45\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.06/m  |  Min Danno: 10.0
item_Descbehr_sniper_ballistic_01=Produttore: Behring\nTipo oggetto: Fucile da cecchino\nClasse: Balistico\n\nDimensione caricatore: 8\nCadenza di tiro: 20 colpi/minuto\nGamma efficace: 120 m\n\nAccessori: Ottiche (S3), Canna (S2), Sottocanna (S2)\n\nIl fucile da cecchino balistico Behring P6-LR compensa ampiamente la sua bassa cadenza di tiro con un colpo ad alta potenza efficace a lungo raggio. Dotato di un mirino con modalità di zoom variabili e una canna composta da una lega proprietaria ad alta resistenza, il P6-LR è stato progettato per dare il meglio quando serve di più.\n\n--- STATISTICHE ---\nPeso: 6.9 kg\nCadenza di Fuoco: 55 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 100.0 (Phys)  |  DPS: 91.7\nAmmo: 8\nVelocità Proiettile: 725 m/s  |  Absolute Portata: 1.4 km\nFull Dmg to: 550 m  |  Drop: -10.00/m  |  Min Danno: 90.0
item_Descbehr_sniper_ballistic_01_store01=Produttore: Behring\nTipo di Oggetto: Fucile di Precisione\nClasse: Balistico\n\nDimensione Caricatore: 8\nCadenza di Fuoco: 20 rpm\nRange Effettivo: 120 m\n\nAccessori: Ottica (S3), Canna (S2), Sottocanna (S2)\n\nIl fucile di precisione balistico Behring P6-LR compensa ampiamente la sua bassa cadenza di fuoco con un proiettile ad alta potenza efficace a lunga distanza. Dotato di un mirino con modalità di zoom variabile e di una canna composta da una lega brevettata ad alta resistenza, il P6-LR è stato progettato per dare il meglio quando è più necessario. L'edizione Gideon presenta una finitura usurata color ottanio e giallo.\n\n--- STATISTICHE ---\nPeso: 6.9 kg\nCadenza di Fuoco: 55 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 100.0 (Phys)  |  DPS: 91.7\nAmmo: 8\nVelocità Proiettile: 725 m/s  |  Absolute Portata: 1.4 km\nFull Dmg to: 550 m  |  Drop: -10.00/m  |  Min Danno: 90.0
item_Descbehr_sniper_ballistic_01_tint01=Produttore: Behring\nTipo di Oggetto: Fucile di Precisione\nClasse: Balistica\n\nDimensione Caricatore: 8\nRateo di Fuoco: 20 rpm\nGittata Effettiva: 120 m\n\nAccessori: Ottica (S3), Canna (S2), Sottocanna (S2)\n\nIl fucile di precisione balistico Behring P6-LR compensa ampiamente il suo basso rateo di fuoco con un proiettile ad alta potenza efficace dalla lunga distanza. Dotato di un mirino con modalità di zoom variabile e una canna composta da una lega brevettata ad alta resistenza, il P6-LR è stato progettato per dare il massimo quando è più necessario. L'edizione Blacklist presenta una finitura nera scura.\n\n--- STATISTICHE ---\nPeso: 6.9 kg\nCadenza di Fuoco: 55 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 100.0 (Phys)  |  DPS: 91.7\nAmmo: 8\nVelocità Proiettile: 725 m/s  |  Absolute Portata: 1.4 km\nFull Dmg to: 550 m  |  Drop: -10.00/m  |  Min Danno: 90.0
