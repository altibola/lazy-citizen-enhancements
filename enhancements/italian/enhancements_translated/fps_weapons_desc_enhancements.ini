item_Descvolt_sniper_energy_01=Produttore: Verified Offworld Laser Technologies\nTipo oggetto: Fucile da cecchino\nClasse: Energia (Laser)\n \nDimensione della batteria: 22\nRateo di fuoco: 60-300 rpm\nIntervallo effettivo: 80 m\n \nAccessori: Ottica (S3), Sottocanna (S2)\n \nIl fucile da cecchino laser Zenith di VOLT offre flessibilità operativa sul campo di battaglia in quanto può sparare rapidamente colpi a bassa energia, o avere il tempo di caricarsi automaticamente per sparare un'esplosione di energia molto più potente che genera anche molto più rumore e calore.\n\n--- STATISTICHE ---\nPeso: 3.8 kg\nCadenza di Fuoco: 325 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 42.5 (Energy)  |  DPS: 230.2\nAmmo: 22\nVelocità Proiettile: 700 m/s  |  Absolute Portata: 1.4 km\nFull Dmg to: 500 m
