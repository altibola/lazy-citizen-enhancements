item_Descnone_shotgun_ballistic_01=Produttore: sconosciuto\nTipo di elemento: fucile a pompa\nClasse: balistico\n\nDimensione caricatore: 8\nVelocità di fuoco: 120 giri/min\nPortata effettiva: 0-10 m\n\nAccessori: N/A\n\nIl Deadrig è un alto fucile motorizzato a doppia canna dal design semplice, realizzato con scarti di discarica. Dando priorità alla potenza sopra ogni altra cosa, il Deadrig non ha la raffinatezza delle armi prodotte in serie e soffre di un forte rinculo.\n\n--- STATISTICHE ---\nPeso: 4.2 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 72.0 x8 (Phys)  |  DPS: 60.0\nAmmo: 8\nVelocità Proiettile: 300 m/s  |  Absolute Portata: 600 m\nFull Dmg to: 7 m  |  Drop: -0.05/m  |  Min Danno: 6.0
item_Descnone_shotgun_ballistic_01_green01=Produttore: Sconosciuto\nTipo di Oggetto: Fucile a Pompa\nClasse: Balistico\n\nCapacità Caricatore: 8\nCadenza di Fuoco: 120 rpm\nGittata Efficace: 0-10 m\n\nAccessori: N/A\n\nIl Deadrig è un fucile a doppia canna ad alta potenza con un design semplice assemblato con rottami di discarica. Dando priorità alla potenza sopra ogni altra cosa, il Deadrig manca della raffinatezza delle armi prodotte in serie e soffre di un forte rinculo. La variante Noxious presenta una colorazione più verde a causa del rottame metallico utilizzato durante il suo assemblaggio.\n\n--- STATISTICHE ---\nPeso: 4.2 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 72.0 x8 (Phys)  |  DPS: 60.0\nAmmo: 8\nVelocità Proiettile: 300 m/s  |  Absolute Portata: 600 m\nFull Dmg to: 7 m  |  Drop: -0.05/m  |  Min Danno: 6.0
