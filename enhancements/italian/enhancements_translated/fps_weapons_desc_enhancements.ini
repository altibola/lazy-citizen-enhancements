item_DescGMNI_rifle_ballistic_01=Produttore: Gemini\nTipo di oggetto: fucile d'assalto\nClasse: balistico\n\nDimensione caricatore: 30\nVelocità di fuoco: 300 giri/min/900 giri/min\nPortata effettiva: 50 m\n\nAccessori: Ottica (S2), Canna (S2) , Underbarrel (S2)\n\nCon l'S71, Gemini ha progettato un fucile d'assalto ergonomico ideale per gli scontri a media distanza. Camerata con un calibro più piccolo rispetto ad altre armi della sua categoria, l'S71 è diventato popolare tra i professionisti militari privati ??per la sua estetica elegante e la precisione precisa.\n\n--- STATISTICHE ---\nPeso: 2.5 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 21.5 (Phys)  |  DPS: 179.2\nAmmo: 30\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 2.4 km\nFull Dmg to: 100 m  |  Drop: -0.10/m  |  Min Danno: 17.5
item_DescGMNI_rifle_ballistic_01_collector01=Produttore: Gemini\nTipo di Oggetto: Fucile d'Assalto\nClasse: Balistico\n\nCapacità Caricatore: 30\nCadenza di Fuoco: 300 rpm / 900 rpm\nPortata Effettiva: 50 m\n\nAccessori: Ottiche (S2), Canna (S2), Sottocanna (S2)\n\nCon l'S71, Gemini ha progettato un fucile d'assalto ergonomico ideale per scontri a medio raggio. Camberato con un proiettile di calibro inferiore rispetto ad altre armi della sua classe, l'S71 è diventato popolare tra i professionisti militari privati per la sua estetica elegante e la precisione millimetrica. \n\nL'edizione Hemlock presenta un motivo mimetico verde.\n\n--- STATISTICHE ---\nPeso: 2.5 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 21.5 (Phys)  |  DPS: 179.2\nAmmo: 30\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 2.4 km\nFull Dmg to: 100 m  |  Drop: -0.10/m  |  Min Danno: 17.5
item_DescGMNI_rifle_ballistic_01_grey_red01=SEGNAPOSTO\n\n--- STATISTICHE ---\nPeso: 2.5 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 21.5 (Phys)  |  DPS: 179.2\nAmmo: 30\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 2.4 km\nFull Dmg to: 100 m  |  Drop: -0.10/m  |  Min Danno: 17.5
item_DescGMNI_rifle_ballistic_01_yellow_blue01=Manufacturer: Gemini\nItem Type: Assault Rifle\nClasse: Ballistic\n\nDimensione Caricatore: 30\nRate Of Fire: 300 rpm / 900 rpm\nPortata Efficace: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nWith the S71, Gemini designed an ergonomic assault rifle ideal for mid-range engagements. Chambered with a smaller caliber round than other weapons in its class, the S71 has become popular among private military professionals for its sleek aesthetics and precise accuracy. Bold neon yellow and vivid blue combine to make the official Murray Cup Racing rifle stand out from the crowd.\n\n--- STATISTICHE ---\nPeso: 2.5 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 21.5 (Phys)  |  DPS: 179.2\nAmmo: 30\nVelocità Proiettile: 1,200 m/s  |  Absolute Portata: 2.4 km\nFull Dmg to: 100 m  |  Drop: -0.10/m  |  Min Danno: 17.5
item_DescGMNI_smg_ballistic_01=Produttore: Gemini\nTipo di oggetto: SMG\nClasse: balistico\n\nDimensione caricatore: 40\nVelocità di fuoco: 1.100 giri/min\nPortata effettiva: 35 m\n\nAccessori: Canna (S1), Ottica (S1), Sottocanna (S1) \n\nFacile da maneggiare e bello da vedere con il suo stile con accenti viola, il C54 è un mitragliatore Gemini elegante e bilanciato con precisione. Il suo telaio in polimero leggero e il design ergonomico lo rendono ideale per gli scontri ravvicinati. Il C54 è in grado di sparare colpi da 10 mm in modalità completamente automatica per fornire il massimo supporto e saturazione del bersaglio per garantire che qualsiasi ingaggio finisca rapidamente.\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_DescGMNI_smg_ballistic_01_grey_red01=SEGNAPOSTO\n\n--- STATISTICHE ---\nPeso: 2.0 kg\nCadenza di Fuoco: 925 RPM\nFire Modalità: Auto\nDanno Alpha: 11.5 (Phys)  |  DPS: 177.3\nAmmo: 50\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 15 m  |  Drop: -0.20/m  |  Min Danno: 7.5
item_DescKSAR_pistol_ballistic_01=Produttore: Kastak Arms\nTipo di elemento: pistola\nClasse: balistico\n\nDimensione caricatore: 6\nVelocità di fuoco: 180 giri/min\nPortata effettiva: 100 m\n\nAccessori: ottica (S1), canna (S1), sottocanna ( S1)\n\nSpesso chiamato "cannone portatile" il Kastak Arms, il Coda può terminare uno scontro con un singolo colpo calibro .50, anche se la notevole potenza può rendere difficile gestire il rinculo del Coda. Considerando le dimensioni limitate del caricatore e il calcio notevole, il fuoco prolungato è scoraggiato a favore di colpi singoli più precisi.\n\n--- STATISTICHE ---\nPeso: 1.3 kg\nCadenza di Fuoco: 180 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 60.0 (Phys)  |  DPS: 180.0\nAmmo: 6\nVelocità Proiettile: 550 m/s  |  Absolute Portata: 1.1 km\nFull Dmg to: 55 m  |  Drop: -0.20/m  |  Min Danno: 35.0
item_DescKsar_rifle_energy_01_blue_gold_01=Produttore: Kastak Arms\nTipo di oggetto: fucile d'assalto\nClasse: Energia (plasma)\n\nCapacità batteria: 30\nVelocità di fuoco: 500 giri/min\nPortata effettiva: 50 m\n\nAccessori: Ottica (S2), Canna (S2 ), Underbarrel (S2)\n\nIl Karna è un classico fucile d'assalto al plasma Kastak Arms. Questo mauler di medio raggio è dotato di modalità di fuoco a raffica, carico e completamente automatico per consentire regolazioni situazionali facili e veloci. Oltre alla sua rinomata potenza di fuoco, l'aspetto robusto e l'affidabilità del Karna lo hanno reso una delle armi più popolari di Kastak Arms. L'audace combinazione di colori blu e oro conferisce all'edizione Valor un fascino coraggioso e dignitoso.\n\n--- STATISTICHE ---\nPeso: 3.5 kg\nCadenza di Fuoco: 600 RPM\nFire Modalità: Auto / Charge / Semi-Auto\nDanno Alpha: 17.5 (Energy)  |  DPS: 175.0\nAmmo: 35\nVelocità Proiettile: 600 m/s  |  Absolute Portata: 1.2 km\nFull Dmg to: 20 m  |  Drop: -0.11/m  |  Min Danno: 14.5
item_Descapar_special_ballistic_01=Produttore:Apocalypse Arms\nTipo di oggetto: Railgun\nClasse: Balistico\n\nDimensione caricatore: 5\nVelocità di fuoco: 60 giri/min\nPortata effettiva: 200 m\n\nAccessori: Ottica (N/A), Canna (N/ A), Underbarrel (S4)\n\nAltrettanto devastante per le minacce più grandi e i veicoli ostili, questo cannone a rotaia montato sulla spalla di Apocalypse Arms utilizza elettromagneti per trasportare il suo carico con precisione su grandi distanze, rendendolo il Flagello della terra, dell'aria e dello spazio.\n\n--- STATISTICHE ---\nPeso: 12.1 kg\nCadenza di Fuoco: 70 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 10.0 (Phys)  |  DPS: 11.7\nAmmo: 5\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descapar_special_ballistic_01_mat01=Produttore: Apocalypse Arms \n Tipo di articolo: Railgun \n Classe: balistico \n \n Dimensione del caricatore: 5 \n Tasso di incendio: 60 giri/min \n Gamma effettiva: 200 m \n \n Attaccati: Optics (N/A), barra (N/A), Underbarl (S4) \n Devastante a minacce più grandi e veicoli ostili, questo grollo a monte delle spalle di Apocalypse Arms utilizza elettromagneti per consegnare il suo carico utile accuratamente su grandi distanze, rendendolo il flagello di terra, aria e spazio. Uno dei tanti articoli che Wikelo ha acquisito nei suoi viaggi, l'edizione "abbastanza utile" è un must per qualsiasi collezionista serio.\n\n--- STATISTICHE ---\nPeso: 12.1 kg\nCadenza di Fuoco: 70 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 10.0 (Phys)  |  DPS: 11.7\nAmmo: 5\nVelocità Proiettile: 50 m/s  |  Absolute Portata: 200 m
item_Descapar_special_ballistic_02=Produttore: Apocalypse Arms\nTipo di oggetto: Lanciamissili\nClasse: Balistico\n\nDimensione caricatore: 3\nVelocità di fuoco: 300 giri/min (raffica di 3 colpi)\nPortata effettiva: 2 km\n\nAccessori: Ottiche (N/A) ,Barrel (N/A), Underbarrel (N/A)\n\nSolleva l'Animus sulla spalla e livella gli avversari sul campo di battaglia. Questo lanciamissili di Apocalypse Arms è dotato di una canna rotante che spara rapidamente tre missili, rendendolo l'arma perfetta per annientare le forze di terra o danneggiare veicoli e piccole navi. Quando hai bisogno di seminare distruzione per salvarti, puoi fidarti di Apocalypse Arms per farlo.\n\n--- STATISTICHE ---\nPeso: 16.8 kg\nCadenza di Fuoco: 300 RPM\nFire Modalità: Semi-Auto
item_Descapar_special_ballistic_02_mat01=Produttore: Apocalypse Arms \n Tipo di articolo: Missile Launcher \n Classe: balistico \n \n Dimensione del caricatore: 3 \n Tasso di incendio: 300 giri/min (3 scatti) \n Gamma effettiva: 2 km \n \n Accendi: Optics (N/A), Corlo N/A) (N/A) \n \n sollevare l'animus sulla spalla e livellare l'opposizione sul campo di battaglia. Questo lanciatore di missili di Apocalypse Arms presenta una canna rotante che spara rapidamente tre missili, rendendola l'arma perfetta per cancellare le forze di terra o danneggiare veicoli e piccole navi. Quando hai bisogno di seminare la distruzione per salvarti, puoi fidarti di Apocalypse Arms per consegnare. Uno dei tanti articoli che Wikelo ha acquisito nei suoi viaggi, l'edizione "abbastanza utile" è un must per qualsiasi collezionista serio.\n\n--- STATISTICHE ---\nPeso: 16.8 kg\nCadenza di Fuoco: 300 RPM\nFire Modalità: Semi-Auto
item_Descbehr_binoculars_01=Il Monocolo Telemetro XDL altamente preciso di Behring è adatto tanto per una spedizione quanto per il campo di battaglia. Robusta, con lenti di alta qualità, display di facile lettura e una modalità di amplificazione della luce, l'XDL fornisce un ingrandimento 10x per fornire misurazioni laser a distanza esatta su bersagli lontani in modo affidabile.\n\n--- STATISTICHE ---\nPeso: 1.5 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto
item_Descbehr_binoculars_01_collector01=L'highly accurate XDL Monocular Rangefinder di Behring è adatto tanto a una spedizione quanto al campo di battaglia. Costruito con robustezza, dotato di lenti di alta qualità, un display di facile lettura e una modalità di amplificazione della luce, l'XDL fornisce un ingrandimento 10x per misurazioni laser di distanza esatte e affidabili su bersagli lontani.\n\nL'edizione Mark I presenta una finitura grigia e blu acciaio.\n\n--- STATISTICHE ---\nPeso: 1.5 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto
