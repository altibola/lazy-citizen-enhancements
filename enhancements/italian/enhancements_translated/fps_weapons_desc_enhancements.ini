item_Descbehr_pistol_ballistic_01=Produttore: Behring\nTipo di elemento: Pistola\nClasse: Balistico\n\nDimensione caricatore: 15\nVelocità di fuoco: 450 giri/min\nPortata effettiva: 25 m\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna (S1 )\n\nGrazie al design aerodinamico e al telaio in polimero leggero che aiuta a ridurre al minimo il rinculo, è facile capire perché il versatile e affidabile S-38 di Behring è diventato un'arma fidata in tutto l'Impero sia per i cittadini che per gli agenti delle forze dell'ordine.\n\n--- STATISTICHE ---\nPeso: 0.9 kg\nCadenza di Fuoco: 450 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 22.5 (Phys)  |  DPS: 168.8\nAmmo: 20\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 20 m  |  Drop: -0.25/m  |  Min Danno: 16.0
item_Descbehr_pistol_ballistic_01_300=Produttore: Behring\nTipo di elemento: Pistola\nClasse: Balistico\n\nDimensione caricatore: 15\nVelocità di fuoco: 450 giri/min\nPortata effettiva: 25 m\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna (S1 )\n\nGrazie a un design aerodinamico e un telaio in polimero leggero che aiuta a ridurre al minimo il rinculo, è facile capire perché il versatile e affidabile S-38 di Behring è diventato un'arma fidata in tutto l'Impero. Questa edizione speciale presenta uno scivolo blu imperiale per commemorare gli sforzi in corso di "One Empire", un'iniziativa governativa basata sulla comunità.\n\n--- STATISTICHE ---\nPeso: 0.9 kg\nCadenza di Fuoco: 450 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 22.5 (Phys)  |  DPS: 168.8\nAmmo: 20\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 20 m  |  Drop: -0.25/m  |  Min Danno: 16.0
item_Descbehr_pistol_ballistic_01_firerats01=Produttore: Behring\nTipo di articolo: Pistola\nClasse: Balistica\n\nDimensioni caricatore: 20\nCadenza di fuoco: 450 giri/min\nGittata effettiva: 25 m\n\nAccessori: Ottica (S1), Canna (S1), Sottocanna (S1)\n\nGrazie a un design aerodinamico e a un telaio in polimero leggero che aiuta a ridurre al minimo il rinculo, è facile capire perché la versatile e affidabile S-38 di Behring è diventata un'arma da fianco affidabile in tutto l'Impero sia per i cittadini che per gli ufficiali delle forze dell'ordine. L'edizione Scorched presenta un'esclusiva patina fiammeggiante.\n\n--- STATISTICHE ---\nPeso: 0.9 kg\nCadenza di Fuoco: 450 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 22.5 (Phys)  |  DPS: 168.8\nAmmo: 20\nVelocità Proiettile: 500 m/s  |  Absolute Portata: 950 m\nFull Dmg to: 20 m  |  Drop: -0.25/m  |  Min Danno: 16.0
item_Descbehr_rifle_ballistic_01=Produttore: Behring\nTipo di oggetto: fucile d'assalto\nClasse: balistico\n\nDimensione caricatore: 30\nVelocità di fuoco: 550 giri/min\nPortata effettiva: 50 m\n\nAccessori: ottica (S2), canna (S2), sottocanna ( S2)\n\nIl classico fucile P4-AR di Behring è dotato di calcio pieghevole e canna accorciata, che lo rendono la scelta ideale per gli scontri a fuoco ravvicinati. La sua precisione e la generale facilità d'uso lo rendono universalmente apprezzato dagli utenti civili, militari e di sicurezza.\n\n--- STATISTICHE ---\nPeso: 2.6 kg\nCadenza di Fuoco: 810 RPM\nFire Modalità: Auto / Semi-Auto\nDanno Alpha: 12.0 (Phys)  |  DPS: 162.0\nAmmo: 40\nVelocità Proiettile: 550 m/s  |  Absolute Portata: 1.1 km\nFull Dmg to: 40 m  |  Drop: -0.05/m  |  Min Danno: 10.0
item_Descbehr_rifle_ballistic_01_store01=Produttore: Behring\nTipo di Oggetto: Fucile d'Assalto\nClasse: Balistica\n\nDimensione Caricatore: 40\nRateo di Fuoco: 550 rpm\nGittata Effettiva: 50 m\n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S2)\n\nIl classico fucile P4-AR di Behring presenta un calcio pieghevole e una canna accorciata, rendendolo una scelta ideale per gli scontri a fuoco a distanza ravvicinata. La sua precisione e la generale facilità d'uso lo rendono universalmente apprezzato tra gli utenti della sicurezza, militari e civili.\n\nL'edizione "Fortuna" è verde con un quadrifoglio in rilievo sul lato.\n\n--- STATISTICHE ---\nPeso: 2.6 kg\nCadenza di Fuoco: 810 RPM\nFire Modalità: Auto / Semi-Auto\nDanno Alpha: 12.0 (Phys)  |  DPS: 162.0\nAmmo: 40\nVelocità Proiettile: 550 m/s  |  Absolute Portata: 1.1 km\nFull Dmg to: 40 m  |  Drop: -0.05/m  |  Min Danno: 10.0
item_Descbehr_rifle_ballistic_01_tint01=Produttore: Behring\nTipo di Oggetto: Fucile d'Assalto\nClasse: Balistico\n\nCapacità Caricatore: 40\nCadenza di Fuoco: 550 rpm\nGittata Effettiva: 50 m\n\nIl classico fucile P4-AR della Behring presenta un calcio pieghevole e una canna accorciata, rendendolo una scelta ideale per i conflitti a corto raggio. La sua precisione e la generale facilità d'uso lo rendono universalmente apprezzato tra la sicurezza, i militari e gli utenti civili.\n\nL'edizione Blacklist presenta una finitura nera.\n\n--- STATISTICHE ---\nPeso: 2.6 kg\nCadenza di Fuoco: 810 RPM\nFire Modalità: Auto / Semi-Auto\nDanno Alpha: 12.0 (Phys)  |  DPS: 162.0\nAmmo: 40\nVelocità Proiettile: 550 m/s  |  Absolute Portata: 1.1 km\nFull Dmg to: 40 m  |  Drop: -0.05/m  |  Min Danno: 10.0
item_Descbehr_rifle_ballistic_02_black01=Produttore: Behring \nTipo di articolo: Fucile d'assalto\nClasse: Balistico\n\nDimensioni del caricatore: 15\nCadenza di fuoco: 475 giri/min\nGittata effettiva: 100 m\n\nAccessori: Ottica (S2), Canna (S2), Sottocanna (S2)\n\nDiscendente diretto dell'arma standard dei Marines UEE, Behring ha creato il semiautomatico P8-AR per fornire ai civili di tutto l'impero un'arma semplice e affidabile per difendersi dagli aggressivi nemici. Dotato di una vernice nera opaca, il fucile in edizione speciale "Blackguard" è perfetto per le operazioni notturne.\n\n--- STATISTICHE ---\nPeso: 2.4 kg\nCadenza di Fuoco: 235 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 45.0 (Phys)  |  DPS: 176.2\nAmmo: 15\nVelocità Proiettile: 1,150 m/s  |  Absolute Portata: 2.3 km\nFull Dmg to: 50 m  |  Drop: -0.10/m  |  Min Danno: 40.0
