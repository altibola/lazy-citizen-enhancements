item_Descsasu_pistol_toy_01_shared=Produttore: Sakura Sun\nTipo di elemento: pistola giocattolo\nClasse: dardo in schiuma\n\nDimensione caricatore: 10\nVelocità di fuoco: 450 giri/min\nPortata effettiva: 35 m\n\nDivertiti con il fuoco amico con il Sakura Sun WowBlast Desperado. Spara giocosamente dardi in schiuma contro amici o nemici fittizi con queste pistole giocattolo in plastica ultra colorate. Che si tratti di ammazzare il tempo in una zona di atterraggio o durante un lungo volo tra le stelle, la linea di giocattoli WowBlast offre eccitazione e intrattenimento spensierati per tutta la famiglia. La pistola giocattolo Desperado è disponibile in diversi colori vivaci, ognuno caratterizzato da un effetto sonoro unico!\n\n--- STATISTICHE ---\nPeso: 0.1 kg\nCadenza di Fuoco: 63 RPM\nFire Modalità: Semi-Auto\nAmmo: 10\nVelocità Proiettile: 20 m/s  |  Absolute Portata: 300 m
item_Descutfl_crossbow_ballistic_01=Produttore: UltiFlex\nTipo Oggetto: Balestra\n \nDimensione Caricatore: 5\nRateo di Fuoco: 60 rpm\nGittata Efficace: 50 m\n \nAccessori: Ottica (S3), Sottocanna (S3)\n \nGli artigiani della UltiFlex sono passati attraverso centinaia di prototipi per scoprire il materiale leggero perfetto con la giusta combinazione di forza e flessibilità per la sua balestra Novian, un compagno ideale su tutto, dalle spedizioni di frontiera alle infiltrazioni tattiche. Tirando la sua azione di fuoco, il Novian lancia quasi silenziosamente un pesante dardo che si frantuma all'impatto causando danni devastanti ai bersagli a corto raggio.\n\n--- STATISTICHE ---\nPeso: 3.5 kg\nCadenza di Fuoco: 42 RPM\nFire Modalità: Auto\nDanno Alpha: 133.0 (Energy: 123.0 / Stun: 10.0)  |  DPS: 93.1\nAmmo: 5\nVelocità Proiettile: 185 m/s  |  Absolute Portata: 1.9 km
