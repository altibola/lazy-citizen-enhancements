item_DescCOOL_JSPN_S03_FrostStarXL_SCItem=Tipo di elemento: Dispositivo di raffreddamento\nProduttore: J-Span\nDimensione: 3\nGrado: C\nClasse: Civile\n\nMentre la tua nave vola, i componenti generano calore che può essere dannoso e persino portare a guasti del sistema se non adeguatamente gestiti da una persona affidabile e un dispositivo di raffreddamento adeguatamente progettato come Frost-Star XL di J-Span.\n\n--- STATISTICHE ---\nTasso di Raffreddamento: 45 CR/s\nConsumo Energia: 4 PU/s\nHP Componente: 960\nSignatures:  EM: 1,500  |  IR: 7,000\nTemp. Surriscaldamento: 600K
