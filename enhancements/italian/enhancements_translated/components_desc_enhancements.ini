item_DescCOOL_ACOM_S01_IcePlunge=Tipo di elemento: Dispositivo di raffreddamento\nProduttore: ACOM\nTaglia: 1\nGrado: C\nClasse: Competizione\n\nQuando spingi la tua nave al limite durante quell'ultimo frenetico giro, sarai felice di avere ACOM€ ™s IcePlunge per mantenere le cose fresche.\n\n--- STATISTICHE ---\nTasso di Raffreddamento: 34 CR/s\nConsumo Energia: 2 PU/s\nHP Componente: 69\nSignatures:  EM: 818  |  IR: 5,890\nTemp. Surriscaldamento: 675K
item_DescCOOL_ACOM_S01_QuickCool=Tipo di articolo: dispositivo di raffreddamento\nProduttore: ACOM\nTaglia: 1\nGrado: D\nClasse:Competizione\n\nQuikCool offre prestazioni superiori rispetto ad altri dispositivi di raffreddamento della sua categoria. Questo componente da competizione di ACOM sacrifica la furtività e una certa durata per essere uno dei più potenti dispositivi di raffreddamento entry-level in circolazione.\n\n--- STATISTICHE ---\nTasso di Raffreddamento: 32 CR/s\nConsumo Energia: 2 PU/s\nHP Componente: 62\nSignatures:  EM: 818  |  IR: 5,400\nTemp. Surriscaldamento: 614K
