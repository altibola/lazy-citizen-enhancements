item_DescCOOL_AEGS_S03_Mercury=Tipo di oggetto: più cool\nProduttore: Aegis Dynamics\nTaglia: 3\nGrado: C\nClasse: militare\n\nIn situazioni di combattimento, anche il più piccolo vantaggio può portare a grandi guadagni. Con il sistema di raffreddamento Mercury Aegis' a bordo, sarai in grado di mantenere la tua nave più calda più a lungo quando ne avrai più bisogno.\n\n--- STATISTICHE ---\nTasso di Raffreddamento: 56 CR/s\nConsumo Energia: 5 PU/s\nHP Componente: 1,300\nSignatures:  EM: 2,480  |  IR: 11,600\nTemp. Surriscaldamento: 750K
