item_descQDRV_RSI_S02_Khaos_SCItem=Tipo di elemento: Quantum Drive\nProduttore: RSI\nTaglia: 2\nGrado: C\nClasse: civile\n\nIl Khaos di RSI è stato messo a punto per fornire prestazioni affidabili con una costruzione affidabile. Una volta che avrai tutto questo, apprezzerai l'ordine che questa guida quantistica porta nel caos del viaggio.\n\n--- STATISTICHE ---\nQT Velocità: 201 Mm/s  |  Avvio (Spool): 6s\nRaffreddamento: 16.9s\nCarburante/Gm: 0.0101\nUso Carb. QT: 16 μ/s\nAccel.:  S1: 3,000,000  |  S2: 13,200,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 3 PU/s\nHP Componente: 410\nSignatures:  EM: 27,000  |  IR: 0\nTemp. Surriscaldamento: 383K\nDistorsione Max: 3,500
item_descQDRV_RSI_S03_Metis_SCItem=Tipo di elemento: Quantum Drive\nProduttore: RSI\nTaglia: 3\nGrado: C\nClasse: Civile\n\nNon c'è spazio per errori quando si piega lo spazio e il tempo per percorrere distanze incredibili. Quindi riponi la tua fiducia in RSI, un'azienda che ha fornito al pubblico componenti di qualità sin dagli albori del volo spaziale.\n\n--- STATISTICHE ---\nQT Velocità: 246 Mm/s  |  Avvio (Spool): 7s\nRaffreddamento: 9.4s\nCarburante/Gm: 0.0599\nUso Carb. QT: 26 μ/s\nAccel.:  S1: 1,800,000  |  S2: 11,600,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 4 PU/s\nHP Componente: 1,100\nSignatures:  EM: 36,000  |  IR: 0\nTemp. Surriscaldamento: 383K\nDistorsione Max: 5,500
item_descQDRV_RSI_S03_Tyche_SCItem=Tipo di elemento: Quantum Drive\nProduttore: RSI\nTaglia: 3\nGrado: B\nClasse: Civile\n\nIl motore Quantum Tyche bilancia armoniosamente prestazioni, durata e furtività per creare un componente a tutto tondo in grado di gestire abilmente una varietà di situazioni.\n\n--- STATISTICHE ---\nQT Velocità: 295 Mm/s  |  Avvio (Spool): 7s\nRaffreddamento: 9.1s\nCarburante/Gm: 0.0541\nUso Carb. QT: 21 μ/s\nAccel.:  S1: 2,160,000  |  S2: 13,900,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 4 PU/s\nHP Componente: 1,300\nSignatures:  EM: 36,000  |  IR: 0\nTemp. Surriscaldamento: 394K\nDistorsione Max: 6,000
item_descQDRV_TARS_S01_Wayfare_SCItem=Tipo di oggetto: Quantum Drive\nProduttore: Tarsus\nTaglia: 1\nGrado: D\nClasse: civile\n\nVeloci attraverso lo spazio senza spendere una fortuna. The Warfare è un piccolo propulsore Quantum proveniente da Tarso, progettato specificamente per contribuire a rendere i viaggi spaziali accessibili alle masse.\n\n--- STATISTICHE ---\nQT Velocità: 138 Mm/s  |  Avvio (Spool): 4s\nRaffreddamento: 10.0s\nCarburante/Gm: 0.0101\nUso Carb. QT: 8 μ/s\nAccel.:  S1: 4,170,000  |  S2: 12,500,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 2 PU/s\nHP Componente: 130\nSignatures:  EM: 15,000  |  IR: 0\nTemp. Surriscaldamento: 372K\nDistorsione Max: 1,950
item_descQDRV_TARS_S02_Quest_SCItem=Tipo di elemento: Quantum Drive\nProduttore: Tarsus\nTaglia: 2\nGrado: D\nClasse: Civile\n\nPerché scherzare con la perfezione? Tarsus produce da secoli l'unità Quest per fornire a tutti un componente di medie dimensioni a prezzi accessibili per trasportarli nelle loro avventure.\n\n--- STATISTICHE ---\nQT Velocità: 168 Mm/s  |  Avvio (Spool): 6s\nRaffreddamento: 18.0s\nCarburante/Gm: 0.0112\nUso Carb. QT: 19 μ/s\nAccel.:  S1: 2,500,000  |  S2: 11,000,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 3 PU/s\nHP Componente: 360\nSignatures:  EM: 22,500  |  IR: 0\nTemp. Surriscaldamento: 372K\nDistorsione Max: 3,050
item_descQDRV_TARS_S03_Drifter_SCItem=Tipo di elemento: Quantum Drive\nProduttore: Tarsus\nTaglia: 3\nGrado: D\nClasse: civile\n\nBilanciando maestria e costi, il Drifter offre le rinomate prestazioni di Tarsus a un prezzo accessibile.\n\n--- STATISTICHE ---\nQT Velocità: 205 Mm/s  |  Avvio (Spool): 7s\nRaffreddamento: 10.0s\nCarburante/Gm: 0.0663\nUso Carb. QT: 31 μ/s\nAccel.:  S1: 1,500,000  |  S2: 9,680,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 4 PU/s\nHP Componente: 990\nSignatures:  EM: 30,000  |  IR: 0\nTemp. Surriscaldamento: 372K\nDistorsione Max: 4,700
item_descQDRV_TARS_S03_Wanderer_SCItem=Tipo di elemento: Quantum Drive\nProduttore: Tarsus\nTaglia: 3\nGrado: C\nClasse: Civile\n\nTarsus ha attentamente progettato e messo a punto il Vagabondo in un solido motore Quantum a tutto tondo, rendendolo uno dei componenti più popolari nella loro formazione venerata.\n\n--- STATISTICHE ---\nQT Velocità: 246 Mm/s  |  Avvio (Spool): 7s\nRaffreddamento: 10.0s\nCarburante/Gm: 0.0644\nUso Carb. QT: 26 μ/s\nAccel.:  S1: 1,800,000  |  S2: 11,600,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 4 PU/s\nHP Componente: 1,100\nSignatures:  EM: 30,000  |  IR: 0\nTemp. Surriscaldamento: 383K\nDistorsione Max: 5,500
item_descQDRV_WETK_S02_XL1_SCItem=Tipo di elemento: Quantum Drive\nProduttore: Wei-Tek\nTaglia: 2\nGrado: A\nClasse: militare\n\nWei-Tek potrebbe essere una nuova azienda, ma la loro linea di componenti di livello militare sta già guadagnando notorietà. L'XL-1 è il loro principale motore Quantum medio che unisce sapientemente prestazioni e durata.\n\n--- STATISTICHE ---\nQT Velocità: 324 Mm/s  |  Avvio (Spool): 6s\nRaffreddamento: 22.9s\nCarburante/Gm: 0.0240\nUso Carb. QT: 11 μ/s\nAccel.:  S1: 4,830,000  |  S2: 21,300,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 4 PU/s\nHP Componente: 840\nSignatures:  EM: 26,300  |  IR: 0\nTemp. Surriscaldamento: 453K\nDistorsione Max: 7,000
item_descQDRV_WETK_S03_Balandin_SCItem=Tipo di elemento: Quantum Drive\nProduttore: Wei-Tek\nTaglia: 3\nGrado: B\nClasse: militare\n\nWei-Tek ha costruito il Balandin pensando al personale militare e di sicurezza. Dopo una serie di test eseguiti da veterani, gli ingegneri hanno accelerato i tempi della bobina e della calibrazione, migliorando allo stesso tempo la precisione e la stabilità del componente.\n\n--- STATISTICHE ---\nQT Velocità: 339 Mm/s  |  Avvio (Spool): 7s\nRaffreddamento: 12.3s\nCarburante/Gm: 0.1352\nUso Carb. QT: 21 μ/s\nAccel.:  S1: 2,480,000  |  S2: 16,000,000\nTasso Cal.: 1,000  |  Richiesto: 5,000–10,000\nConsumo Energia: 5 PU/s\nHP Componente: 2,100\nSignatures:  EM: 33,800  |  IR: 0\nTemp. Surriscaldamento: 438K\nDistorsione Max: 10,000
