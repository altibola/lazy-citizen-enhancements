item_Desc_SHLD_BASL_S01_Guardian=Tipo di oggetto: Generatore di scudi\nProduttore: Basilisco\nDimensione: 1\nGrado: B\nClasse: Industriale\n\nMigliora a Guardiano per un maggiore assorbimento dei danni balistici, energetici e di distorsione. Rendendo questo generatore di scudi industriali uno dei più durevoli della sua categoria.\n\n--- STATISTICHE ---\nHP Max: 2,160  |  Rigenerazione: 432 HP/s\nRitardo a Terra: 9.1s  |  Ritardo Danno: 4.5s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,490  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 210
item_Desc_SHLD_BASL_S01_Palisade=Tipo di elemento: Generatore di scudi\nProduttore: Basilisk\nDimensione: 1\nGrado: A\nClasse: Industriale\n\nNessun altro piccolo generatore di scudi può eguagliare la durabilità della Basilisk Palisade. Questo componente industriale top di gamma rinuncia alla furtività per la capacità di assorbire una quantità di danni senza rivali.\n\n--- STATISTICHE ---\nHP Max: 2,160  |  Rigenerazione: 475 HP/s\nRitardo a Terra: 8.3s  |  Ritardo Danno: 4.2s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,490  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 230
item_Desc_SHLD_BASL_S01_Steward=Tipo di elemento: Generatore di scudi\nProduttore: Basilisk\nDimensione: 1\nGrado: D\nClasse: Industriale\n\nLo Steward è il generatore di scudi industriali entry-level di Basilisk. Il suo alloggiamento rinforzato aggiunge un ulteriore livello di durata a un sistema già robusto, garantendo che il tuo scudo proietti anche nelle condizioni più difficili.\n\n--- STATISTICHE ---\nHP Max: 2,160  |  Rigenerazione: 389 HP/s\nRitardo a Terra: 11.0s  |  Ritardo Danno: 5.5s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,490  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 160
item_Desc_SHLD_BASL_S02_Armada=Tipo di elemento: Generatore di scudi\nProduttore: Basilisk\nTaglia: 2\nGrado: D\nClasse: Industriale\n\nBasilisk ha iniziato realizzando rivestimenti dello scafo all'avanguardia rinomati per essere durevoli e affidabili. Oggi portano avanti questa orgogliosa eredità con generatori di scudi industriali come l'Armada.\n\n--- STATISTICHE ---\nHP Max: 7,200  |  Rigenerazione: 1,296 HP/s\nRitardo a Terra: 12.1s  |  Ritardo Danno: 6.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,980  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 430
item_Desc_SHLD_BASL_S02_Citadel=Tipo di oggetto: Generatore di scudi\nProduttore: Basilisk\nDimensione: 2\nGrado: B\nClasse: Industriale\n\nFortifica la tua nave con il generatore di scudi Cittadella di Basilisk. Progettato su misura per le imbarcazioni industriali, il componente emette uno scudo robusto e affidabile.\n\n--- STATISTICHE ---\nHP Max: 7,200  |  Rigenerazione: 1,440 HP/s\nRitardo a Terra: 10.0s  |  Ritardo Danno: 5.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,980  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 570
item_Desc_SHLD_BASL_S02_Rampart=Tipo di oggetto: Generatore di scudi\nProduttore: Basilisk\nDimensione: 2\nGrado: A\nClasse: Industriale\n\nBasilisk capisce che la fuga non è sempre un'opzione. Ecco perché hanno costruito il generatore di scudi industriali Rampart in modo che subisca un'incredibile quantità di danni prima che si esaurisca.\n\n--- STATISTICHE ---\nHP Max: 7,200  |  Rigenerazione: 1,584 HP/s\nRitardo a Terra: 9.2s  |  Ritardo Danno: 4.6s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,980  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 640
item_Desc_SHLD_BASL_S03_Barbican=Tipo di oggetto: Generatore di scudi\nProduttore: Basilisk\nDimensione: 3\nGrado: B\nClasse: Industriale\n\nBarrica la tua nave contro le forze esterne con il Basilisk Barbican. Originrealizzato appositamente per grandi navi industriali, questo generatore di scudi è diventato molto popolare grazie al suo elevato assorbimento dei danni.\n\n--- STATISTICHE ---\nHP Max: 72,000  |  Rigenerazione: 14,400 HP/s\nRitardo a Terra: 11.0s  |  Ritardo Danno: 5.5s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 2,480  |  IR: 0\nConsumo Energia: 5 PU/s\nHP Componente: 1,600
item_Desc_SHLD_BASL_S03_Parapet=Tipo di elemento: Generatore di scudi\nProduttore: Basilisk\nTaglia: 3\nGrado: A\nClasse: Industriale\n\nEssendo l'apice dei grandi generatori di scudi industriali di Basilisk, è facile capire perché il Parapetto è così amato . Con uno dei migliori rapporti tra generazione di scudi e danni del settore, è difficile degradare lo scudo ed esporre lo scafo.\n\n--- STATISTICHE ---\nHP Max: 72,000  |  Rigenerazione: 15,840 HP/s\nRitardo a Terra: 10.1s  |  Ritardo Danno: 5.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 2,480  |  IR: 0\nConsumo Energia: 5 PU/s\nHP Componente: 1,800
item_Desc_SHLD_BASL_S03_Ward=Tipo di elemento: Generatore di scudi\nProduttore: Basilisk\nDimensione: 3\nGrado: D\nClasse: Industriale\n\nIl Ward è il generatore di scudi base di livello industriale di Basilisk per navi di grandi dimensioni. Fornisce prestazioni e durata decenti pur mantenendo la sua firma rispettabile.\n\n--- STATISTICHE ---\nHP Max: 72,000  |  Rigenerazione: 12,960 HP/s\nRitardo a Terra: 13.3s  |  Ritardo Danno: 6.7s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 2,480  |  IR: 0\nConsumo Energia: 5 PU/s\nHP Componente: 1,200
item_Desc_SHLD_BEHR_S01_6SA=Tipo di elemento: Generatore di scudi\nProduttore: Behring\nTaglia: 1\nGrado: B\nClasse: Civile\n\nFornendo salute degli scudi e assorbimento dei danni superiori alla media, l'"Arbiter" 6SA è stato un componente affidabile per secoli. Sperimenta il vantaggio Behring installando oggi stesso questo piccolo generatore di scudi.\n\n--- STATISTICHE ---\nHP Max: 3,000  |  Rigenerazione: 600 HP/s\nRitardo a Terra: 9.1s  |  Ritardo Danno: 4.5s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 900  |  IR: 0\nConsumo Energia: 2 PU/s\nHP Componente: 170
item_Desc_SHLD_BEHR_S01_7SA=Tipo di elemento: Generatore di scudi\nProduttore: Behring\nTaglia: 1\nGrado: A\nClasse: Civile\n\nUn generatore di scudi top di gamma che funziona forte e fiero. Ciò che sacrifica in modalità furtiva è più che compensato con una durata suprema e prestazioni eccellenti. Quindi, anche se i nemici ti vedono arrivare, avranno difficoltà a disattivare il 7SA "Concord" di Behring.\n\n--- STATISTICHE ---\nHP Max: 3,000  |  Rigenerazione: 660 HP/s\nRitardo a Terra: 8.3s  |  Ritardo Danno: 4.2s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 900  |  IR: 0\nConsumo Energia: 2 PU/s\nHP Componente: 200
item_Desc_SHLD_BEHR_S02_6MA=Tipo di elemento: Generatore di scudi\nProduttore: Behring\nTaglia: 2\nGrado: B\nClasse: Civile\n\nLa ferrea reputazione di Behring è impenetrabile quasi quanto lo scudo prodotto dal 6MA "Kozane". Se va bene per Behring, va bene anche per te.\n\n--- STATISTICHE ---\nHP Max: 10,000  |  Rigenerazione: 2,000 HP/s\nRitardo a Terra: 10.0s  |  Ritardo Danno: 5.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,350  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 470
item_Desc_SHLD_BEHR_S02_7MA=Tipo di elemento: Generatore di scudi\nProduttore: Behring\nTaglia: 2\nGrado: A\nClasse: Civile\n\nAffidati a un componente che è stato equipaggiato sulle imbarcazioni per secoli: il 7MA "Lorica". Prova oggi stesso il generatore di scudi top di gamma di Behring sulla tua nave.\n\n--- STATISTICHE ---\nHP Max: 10,000  |  Rigenerazione: 2,200 HP/s\nRitardo a Terra: 9.2s  |  Ritardo Danno: 4.6s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,350  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 540
item_Desc_SHLD_BEHR_S03_6CA=Tipo di elemento: Generatore di scudi\nProduttore: Behring\nTaglia: 3\nGrado: B\nClasse: Civile\n\n"Costruito da Behring" è una frase sinonimo di qualità. Ecco perché così tanti in tutto l'Impero si affidano al loro generatore di scudi di grandi dimensioni 6CA "Bila" per fornire loro prestazioni solide, una durata impressionante e un grado accettabile di azione furtiva.\n\n--- STATISTICHE ---\nHP Max: 100,000  |  Rigenerazione: 20,000 HP/s\nRitardo a Terra: 11.0s  |  Ritardo Danno: 5.5s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,800  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 1,300
item_Desc_SHLD_BEHR_S03_7CA=Tipo di elemento: Generatore di scudi\nProduttore: Behring\nTaglia: 3\nGrado: A\nClasse: Civile\n\nCommercial-grade i generatori di scudi non sono migliori del 7CA "Nargun". Il componente utilizza la tecnologia brevettata "Freeze Flow" di Behring per mantenere sotto controllo la sua firma termica, aumentando al tempo stesso le prestazioni complessive e la durata.\n\n--- STATISTICHE ---\nHP Max: 100,000  |  Rigenerazione: 22,000 HP/s\nRitardo a Terra: 10.1s  |  Ritardo Danno: 5.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,800  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 1,500
item_Desc_SHLD_GODI_S01_FR66=Tipo di elemento: generatore di scudi\nProduttore: Gorgon Defender Industries\nTaglia: 1\nGrado: A\nClasse: militare\n\nL'FR-66 è uno dei piccoli generatori di scudi più versatili attualmente sul mercato. Ottieni protezione e prestazioni militari da Gorgon Defender Industries per garantire che la tua nave possa sopravvivere a qualsiasi assalto.\n\n--- STATISTICHE ---\nHP Max: 3,168  |  Rigenerazione: 697 HP/s\nRitardo a Terra: 9.6s  |  Ritardo Danno: 4.8s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,240  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 270
item_Desc_SHLD_GODI_S02_CoverAll=Tipo di elemento: Generatore di scudi\nProduttore: Gorgon Defender Industries\nTaglia: 2\nGrado: B\nClasse: militare\n\nNon sacrificare le prestazioni per la durata. Ottieni entrambi con il generatore di scudi CoverAll di Gorgon Defender Industries.\n\n--- STATISTICHE ---\nHP Max: 10,560  |  Rigenerazione: 2,112 HP/s\nRitardo a Terra: 11.5s  |  Ritardo Danno: 5.8s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,650  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 660
item_Desc_SHLD_GODI_S02_FR76=Tipo di elemento: Generatore di scudi\nProduttore: Gorgon Defender Industries\nTaglia: 2\nGrado: A\nClasse: Militare\n\nPerfezionato da anni di test approfonditi nel mondo reale da parte dei militari, Gorgon Defender Industries FR-76 è il massimo generatore di scudi. Perfetto per tutti, da chi difende la prima linea a chi esplora la frontiera.\n\n--- STATISTICHE ---\nHP Max: 10,560  |  Rigenerazione: 2,323 HP/s\nRitardo a Terra: 10.5s  |  Ritardo Danno: 5.3s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,650  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 750
item_Desc_SHLD_GODI_S02_SecureShield=Tipo di elemento: Generatore di scudi\nProduttore: Gorgon Defender Industries\nDimensione: 2\nGrado: D\nClasse: militare\n\nOttieni protezione di livello militare per la tua nave con SecureShield di Gorgon Defender Industries. La loro tecnologia di emissione all'avanguardia consente un assorbimento superiore dello scudo in tutto lo spettro dei tipi di danno.\n\n--- STATISTICHE ---\nHP Max: 10,560  |  Rigenerazione: 1,901 HP/s\nRitardo a Terra: 13.9s  |  Ritardo Danno: 7.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,650  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 500
item_Desc_SHLD_GODI_S03_FR86=Tipo di elemento: Generatore di scudi\nProduttore: Gorgon Defender Industries\nTaglia: 3\nGrado: A\nClasse: militare\n\nL'FR-86 di Gorgon è provato, testato e affidabile. Nessun altro generatore di scudi di grandi dimensioni offre prestazioni e durata eccezionali a questo livello.\n\n--- STATISTICHE ---\nHP Max: 105,600  |  Rigenerazione: 23,232 HP/s\nRitardo a Terra: 11.6s  |  Ritardo Danno: 5.8s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 2,060  |  IR: 0\nConsumo Energia: 5 PU/s\nHP Componente: 2,100
item_Desc_SHLD_GODI_S03_FullBlock=Tipo di elemento: Generatore di scudi\nProduttore: Gorgon Defender Industries\nDimensione: 3\nGrado: B\nClasse: Militare\n\nRealizzato da ex residenti di Caliban, il grande generatore di scudi FullBlock di Gorgon è stato ripetutamente messo alla prova da membri delle forze armate e del pubblico. Ciò significa che puoi contare su di esso indipendentemente da ciò che incontri.\n\n--- STATISTICHE ---\nHP Max: 105,600  |  Rigenerazione: 21,120 HP/s\nRitardo a Terra: 12.7s  |  Ritardo Danno: 6.3s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 2,060  |  IR: 0\nConsumo Energia: 5 PU/s\nHP Componente: 1,800
item_Desc_SHLD_GODI_S03_SecureScreen=Tipo di elemento: generatore di scudi\nProduttore: Gorgon Defender Industries\nTaglia: 3\nGrado: D\nClasse: militare\n\nGorgon Defender Industries porta la potenza militare nel loro generatore di scudi di grandi dimensioni entry-level. Dotato della migliore durata della categoria, SecureScreen è stato costruito per resistere e sopravvivere.\n\n--- STATISTICHE ---\nHP Max: 105,600  |  Rigenerazione: 19,008 HP/s\nRitardo a Terra: 15.3s  |  Ritardo Danno: 7.7s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 2,060  |  IR: 0\nConsumo Energia: 5 PU/s\nHP Componente: 1,400
item_Desc_SHLD_SECO_S01_HEX=Tipo di elemento: Generatore di scudi\nProduttore: Seal Corporation\nDimensione: 1\nGrado: B\nClasse: Civile\n\nPrepara la tua nave per qualsiasi circostanza installando un HEX di Seal Corporation. Prestazioni bilanciate e durata lo rendono una scelta ideale e versatile per coloro che non sanno dove li porterà la prossima avventura.\n\n--- STATISTICHE ---\nHP Max: 2,160  |  Rigenerazione: 432 HP/s\nRitardo a Terra: 9.1s  |  Ritardo Danno: 4.5s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 750  |  IR: 0\nConsumo Energia: 2 PU/s\nHP Componente: 170
item_Desc_SHLD_SECO_S02_BLOC=Tipo di elemento: Generatore di scudi\nProduttore: Seal Corporation\nDimensione: 2\nGrado: B\nClasse: Civile\n\nIl generatore di scudi BLOC di Seal Corporation è stato il primo a utilizzare il rivoluzionario semiconduttore con nucleo Quantum dell'azienda per ridurre la l'assorbimento di potenza del componente senza compromettere le prestazioni.\n\n--- STATISTICHE ---\nHP Max: 7,200  |  Rigenerazione: 1,440 HP/s\nRitardo a Terra: 10.0s  |  Ritardo Danno: 5.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,130  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 470
item_Desc_SHLD_SECO_S02_RPEL=Tipo di elemento: Generatore di scudi\nProduttore: Seal Corporation\nDimensione: 2\nGrado: D\nClasse: civile\n\nScopri perché più persone si affidano a Seal Corporation per proteggere la propria nave rispetto a qualsiasi altra società. Con il generatore di scudi RPEL puoi essere certo di essere isolato dal pericolo.\n\n--- STATISTICHE ---\nHP Max: 7,200  |  Rigenerazione: 1,296 HP/s\nRitardo a Terra: 12.1s  |  Ritardo Danno: 6.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,130  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 360
item_Desc_SHLD_SECO_S03_ARMOR=Tipo di elemento: Generatore di scudi\nProduttore: Seal Corporation\nDimensione: 3\nGrado: B\nClasse: Civile\n\nARMOR è il generatore di scudi top di gamma di Seal Corps. E' stato ampiamente utilizzato dai militari prima che la sua tecnologia di scudo venisse declassificata per uso civile.\n\n--- STATISTICHE ---\nHP Max: 72,000  |  Rigenerazione: 14,400 HP/s\nRitardo a Terra: 11.0s  |  Ritardo Danno: 5.5s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,500  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 1,300
item_Desc_SHLD_SECO_S03_GUARD=Tipo di elemento: Generatore di scudi\nProduttore: Seal Corporation\nDimensione: 3\nGrado: C\nClasse: Civile\n\nNon aver paura di affrontare l'ignoto con la GUARDIA di Seal Corp. Questo generatore di scudi bilancia prestazioni, durata e azione furtiva per consentire all'utente di utilizzare lo scudo nel modo che preferisce.\n\n--- STATISTICHE ---\nHP Max: 72,000  |  Rigenerazione: 13,680 HP/s\nRitardo a Terra: 12.1s  |  Ritardo Danno: 6.0s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,500  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 1,100
item_Desc_SHLD_SECO_S03_HAVEN=Tipo di elemento: generatore di scudi\nProduttore: Seal Corporation\nDimensione: 3\nGrado: D\nClasse: civile\n\nL'HAVEN è un ammirato generatore di scudi per navi di grandi dimensioni. Il design semplice e pulito di Seal Corp rende la riparazione del componente un compito facile ed economico e non ha fatto altro che aumentarne la popolarità nel corso degli anni.\n\n--- STATISTICHE ---\nHP Max: 72,000  |  Rigenerazione: 12,960 HP/s\nRitardo a Terra: 13.3s  |  Ritardo Danno: 6.7s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,500  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 990
item_Desc_SHLD_YORM_S01_Jaghte=Tipo di elemento: Generatore di scudi\nProduttore: Yorm\nTaglia: 1\nGrado: B\nClasse: Competizione\n\nCostruito pensando alle prestazioni, il generatore di scudi da competizione Jaghte di Yorm dà priorità alla salute e al tasso di generazione degli scudi rispetto alla forza e alla furtività.\n\n--- STATISTICHE ---\nHP Max: 1,920  |  Rigenerazione: 384 HP/s\nRitardo a Terra: 7.7s  |  Ritardo Danno: 3.9s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 818  |  IR: 0\nConsumo Energia: 2 PU/s\nHP Componente: 91
item_Desc_SHLD_YORM_S02_Bamoty=Tipo di elemento: Generatore di scudi\nProduttore: Yorm\nTaglia: 2\nGrado: D\nClasse: Competizione\n\nIl Bamoty è la versione di Yorm di un generatore di scudi in stile commerciale. Questo componente di medie dimensioni ha conquistato all'azienda una base di fan più ampia perché bilancia sapientemente prestazioni, durata e invisibilità.\n\n--- STATISTICHE ---\nHP Max: 6,400  |  Rigenerazione: 1,152 HP/s\nRitardo a Terra: 10.3s  |  Ritardo Danno: 5.1s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,230  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 200
item_Desc_SHLD_YORM_S02_Haltur=Tipo di oggetto: Generatore di scudi\nProduttore: Yorm\nDimensione: 2\nGrado: B\nClasse: Competizione\n\nLa forte salute dello scudo e un tasso di generazione eccezionale conferiscono all'Haltur il miglior punteggio prestazionale di qualsiasi scudo della sua classe. Amato dai corridori e da coloro che preferiscono navigare lontano dal pericolo invece di assorbirlo.\n\n--- STATISTICHE ---\nHP Max: 6,400  |  Rigenerazione: 1,280 HP/s\nRitardo a Terra: 8.5s  |  Ritardo Danno: 4.2s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,230  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 250
item_Desc_SHLD_YORM_S02_Trenta=Tipo di elemento: Generatore di scudi\nProduttore: Yorm\nTaglia: 2\nGrado: C\nClasse: Competizione\n\nUna scelta ideale per i corridori che cercano un generatore di scudi che fornisca prestazioni e durata degli scudi superiori alla media. Come bonus, l'involucro del Trenta è costruito con una lega infusa di magnesio che rende il componente robusto ma leggero.\n\n--- STATISTICHE ---\nHP Max: 6,400  |  Rigenerazione: 1,216 HP/s\nRitardo a Terra: 9.3s  |  Ritardo Danno: 4.7s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,230  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 220
