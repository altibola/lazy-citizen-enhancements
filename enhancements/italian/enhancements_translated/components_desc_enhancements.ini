item_DescCOOL_AEGS_S03_Blizzard_SCItem=Tipo di articolo: dispositivo di raffreddamento\nProduttore: Aegis Dynamics\nTaglia: 3\nGrado: A\nClasse: militare\n\nI meccanici della marina hanno lavorato con gli ingegneri di Aegis per garantire che la Blizzard soddisfacesse le loro esigenze specifiche. Quando raggiunse il mercato commerciale, questo dispositivo di raffreddamento top di gamma di livello militare divenne uno dei componenti più venduti di Aegis.\n\n--- STATISTICHE ---\nTasso di Raffreddamento: 60 CR/s\nConsumo Energia: 5 PU/s\nHP Componente: 1,800\nSignatures:  EM: 2,480  |  IR: 12,700\nTemp. Surriscaldamento: 900K
