item_DescCOOL_AEGS_S01_Bracer=Tipo di elemento: Dispositivo di raffreddamento\nProduttore: Aegis Dynamics\nTaglia: 1\nGrado: C\nClasse: Militare\n\nPer coloro che cercano un dispositivo di raffreddamento di fascia media solido e affidabile, non si può fare molto meglio di Aegis€ ™ Bracciale. Questo sistema di raffreddamento a telaio piccolo offre prestazioni solide e durata per mantenere la tua nave in funzione con tutti i cilindri.\n\n--- STATISTICHE ---\nTasso di Raffreddamento: 34 CR/s\nConsumo Energia: 3 PU/s\nHP Componente: 180\nSignatures:  EM: 1,490  |  IR: 7,260\nTemp. Surriscaldamento: 750K
item_DescCOOL_AEGS_S01_Polar=Tipo di articolo: frigorifero portatile\nProduttore: Aegis Dynamics\nTaglia: 1\nGrado: B\nClasse: militare\n\nCostruito per le elevate esigenze del servizio militare quotidiano, il frigorifero portatile Aegis' Polar è dotato di un telaio rinforzato per una maggiore durata. Puoi stare certo che quando cadi nel fuoco del combattimento, il Polar manterrà fresca la tua nave.\n\n--- STATISTICHE ---\nTasso di Raffreddamento: 34 CR/s\nConsumo Energia: 3 PU/s\nHP Componente: 210\nSignatures:  EM: 1,490  |  IR: 7,260\nTemp. Surriscaldamento: 825K
