item_DescSHLD_BANU_S01_Suldrath=Tipo di elemento: Generatore di scudi\nProduttore: Banu\nTaglia: 1\nGrado: C\nClasse: Militare\n\nLa classica tecnologia Tevarin si fonde con il design moderno per il generatore di scudi Suldrath. Il Banu fonde magnificamente le parti migliori della storica tecnologia degli scudi Tevarin con gli aggiornamenti contemporanei e le comodità previste da questa generazione di componenti. Il risultato è uno scudo xeno-crafted efficace e unico, pronto a avvolgere la tua nave e a proteggerti da qualunque pericolo ti si presenti davanti.\n\n--- STATISTICHE ---\nHP Max: 2,304  |  Rigenerazione: 438 HP/s\nRitardo a Terra: 11.5s  |  Ritardo Danno: 5.8s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,360  |  IR: 0\nConsumo Energia: 3 PU/s\nHP Componente: 180
item_DescSHLD_BANU_S02_Sukoran=Tipo di elemento: Generatore di scudi\nProduttore: Banu\nTaglia: 2\nGrado: C\nClasse: militare\n\nIl buon design sopravvive sempre con Banu. Il generatore di scudi Sukoran aggiorna la tecnologia Tevarin in molti modi interessanti. Il suo design efficiente assorbe meno energia, pur producendo efficacemente uno scudo robusto in grado di assorbire la maggior parte degli attacchi balistici ed energetici fino a quando non è completamente esaurito. Tuttavia, questa maggiore efficienza ha un prezzo in quanto la velocità di rigenerazione più lenta del Sukoran potrebbe mettere temporaneamente lo scudo offline.\n\n--- STATISTICHE ---\nHP Max: 7,680  |  Rigenerazione: 1,459 HP/s\nRitardo a Terra: 12.7s  |  Ritardo Danno: 6.3s\nResistenza:  Phys: +0% – +25%\nSignatures:  EM: 1,820  |  IR: 0\nConsumo Energia: 4 PU/s\nHP Componente: 500
