Item_DescBEHR_LaserCannon_S4=Produttore: Behring\nTipo di articolo: cannone laser\nTaglia: 4\n\nL'M6A di Behring è un versatile cannone automatico a energia ad alta velocità, progettato per mantenere il nemico a distanza senza sacrificare il potere di arresto.\n\n--- STATISTICHE ---\nPeso: 2250.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 615.3 (Energy)  |  DPS: 1,025.5\nAmmo: 25\nRegen: 6,330/s  |  Cooldown: 1.4s  |  Cost/Shot: 379\nVelocità Proiettile: 1,152 m/s  |  Portata: 2.8 km\nConsumo Energia: 2 PU/s\nHP Componente: 2,000\nSignatures:  EM: 792  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAEGS_EMP_Device=Produttore: Behring\nTipo di articolo: generatore EMP\n\nIl REP-8 è un generatore di burst incentrato sull'EMP molto apprezzato di Behring. Bilancia un tempo di ricarica gestibile con una forte esplosione di danni da distorsione che mette fuori combattimento i componenti elettronici intrappolati nel suo raggio. La solida ingegneria e secoli di utilizzo lo hanno reso un deterrente non letale standard in tutto l'Impero.\n\n--- STATISTICHE ---\nPeso: 4000.0 kg\nConsumo Energia: 1 PU/s\nHP Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAEGS_EMP_Sentinel_S4=Produttore: Behring\nTipo di elemento: Generatore di raffiche\nDimensione: 4\nTipo di danno: EMP\n\nInfliggi danni da distorsione con il generatore di raffiche REP-VS costruito appositamente per Aegis Vanguard Sentinel. Behring ha modificato la tecnologia utilizzata nel suo rispettabile REP-8 per progettare un'arma efficace e non letale che si integra perfettamente con la Sentinel.\n\n--- STATISTICHE ---\nPeso: 4000.0 kg\nConsumo Energia: 1 PU/s\nHP Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAMRS_LaserCannon_S1=Produttore: Amon & Reese Co.\nTipo di articolo: Cannone laser\nDimensione: 1\n\nL'Omnisky III è il modello base della linea di cannoni automatici laser di A&R per piccole navi e ha una velocità di fuoco, danni e portata paragonabili ad altri armi nella sua classe di dimensioni. Utilizza componenti di fascia media nel suo design, offrendo un netto aumento dell'efficienza energetica rispetto ad alcuni dei suoi concorrenti meno costosi.\n\n--- STATISTICHE ---\nPeso: 144.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 97.2 (Energy)  |  DPS: 243.0\nAmmo: 25\nRegen: 1,500/s  |  Cooldown: 0.5s  |  Cost/Shot: 90\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 446  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAMRS_LaserCannon_S2=Produttore: Amon & Reese Co.\nTipo di articolo: cannone laser\nDimensione: 2\n\nL'Omnisky VI è il cannone laser automatico di medie dimensioni del produttore A&R. Vanta danni, portata e consumo energetico maggiori rispetto al fratello minore, l'Omnisky III, e utilizza molti degli stessi componenti con conseguente efficienza energetica a metà strada.\n\n--- STATISTICHE ---\nPeso: 360.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 145.8 (Energy)  |  DPS: 364.5\nAmmo: 25\nRegen: 2,250/s  |  Cooldown: 0.5s  |  Cost/Shot: 135\nVelocità Proiettile: 1,196 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 594  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAMRS_LaserCannon_S3=Produttore: Amon & Reese Co.\nTipo di articolo: cannone laser\nDimensione: 3\n\nL'Omnisky IX è la versione di taglia tre del popolare cannone laser automatico di Amon & Reese. La bassa cadenza di fuoco dell'arma è controbilanciata dalla sua portata effettiva, che le consente di sferrare un colpo potente da lontano.\n\n--- STATISTICHE ---\nPeso: 900.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 218.7 (Energy)  |  DPS: 546.8\nAmmo: 25\nRegen: 3,375/s  |  Cooldown: 0.5s  |  Cost/Shot: 202\nVelocità Proiettile: 1,184 m/s  |  Portata: 2.4 km\nConsumo Energia: 2 PU/s\nHP Componente: 1,024\nSignatures:  EM: 743  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAMRS_LaserCannon_S4=Produttore: Amon & Reese Co.\nTipo di articolo: cannone laser\nDimensione: 4\n\nL'affidabile linea di cannoni automatici laser di Amon & Reese continua con l'Omnisky XII. Nonostante la sua emissione lenta, questo laser di dimensione quattro è in grado di erogare in modo efficiente devastanti raggi laser da una distanza considerevole.\n\n--- STATISTICHE ---\nPeso: 280.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 327.9 (Energy)  |  DPS: 819.7\nAmmo: 25\nRegen: 5,060/s  |  Cooldown: 0.5s  |  Cost/Shot: 303\nVelocità Proiettile: 1,152 m/s  |  Portata: 2.8 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,650\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAMRS_LaserCannon_S5=Produttore: Amon & Reese Co.\nTipo di articolo: cannone laser\nDimensione: 5\n\nLa reputazione di Amon e Reese per la produzione di armi potenti e affidabili è incarnata dalla loro linea Omnisky di cannoni automatici laser. L'Omnisky XV è la versione taglia cinque dell'arma che ha aiutato a difendere l'Impero per secoli.\n\n--- STATISTICHE ---\nPeso: 5630.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 492.2 (Energy)  |  DPS: 1,230.4\nAmmo: 25\nRegen: 7,595/s  |  Cooldown: 0.5s  |  Cost/Shot: 455\nVelocità Proiettile: 1,112 m/s  |  Portata: 4.0 km\nConsumo Energia: 2 PU/s\nHP Componente: 2,500\nSignatures:  EM: 1,040  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAMRS_LaserCannon_S6=Produttore: Amon & Reese Co.\nTipo di elemento: Cannone laser\nDimensione: 6\n\nSoprannominato "Augustus" dagli ingegneri di Amon & Reese in onore dell'imperatore romano che fondò la famosa "Dicettesima Legione", questo enorme cannone laser automatico di dimensioni sei colpisce duramente su grandi distanze, rendendo l'Omnisky XVIII un mezzo efficace per tenere a bada i nemici.\n\n--- STATISTICHE ---\nPeso: 14100.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 738.4 (Energy)  |  DPS: 1,846.0\nAmmo: 25\nRegen: 11,395/s  |  Cooldown: 0.5s  |  Cost/Shot: 683\nVelocità Proiettile: 1,080 m/s  |  Portata: 6.0 km\nConsumo Energia: 2 PU/s\nHP Componente: 4,224\nSignatures:  EM: 1,190  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAMRS_ScatterGun_S3=Produttore: Amon & Reese Co.\nTipo di articolo: fucile a dispersione al plasma\nDimensione: 3\n\nLa tua spedizione diffonderà il caos con il fucile al plasma PyroBurst di A&R. Efficace negli scontri ravvicinati, il PyroBurst spruzza proiettili al plasma autodetonanti, sacrificando la precisione millimetrica a favore della saturazione dell'area.\n\n--- STATISTICHE ---\nPeso: 450.0 kg\nCadenza di Fuoco: 70 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 396.0 x8 (Energy)  |  DPS: 462.0\nAmmo: 75\nRegen: 2,567/s  |  Cooldown: 0.4s  |  Cost/Shot: 440\nVelocità Proiettile: 844 m/s  |  Portata: 1.3 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,550\nSignatures:  EM: 450  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAPAR_BallisticGatling_S4=Produttore: Apocalypse Arms\nTipo di articolo: Ballistic Gatling\nTaglia: 4\n\nSe non è rotto, non aggiustarlo. E se vuoi che si rompa, puntagli contro un Revenant. Solidamente costruito su una tecnologia secolare, Apocalypse Arms dà una svolta innovativa a progetti testati in battaglia per creare un robusto Gatling balistico in grado di scagliare costantemente la morte attraverso il vuoto. Anche se è lento ad avviarsi e a raffreddarsi, l'affidabilità del Revenant lo rende il favorito per coloro che si aspettano di trovare guai.\n\n--- STATISTICHE ---\nPeso: 2340.0 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Auto\nDanno Alpha: 189.9 (Phys)  |  DPS: 2,848.5\nAmmo: 3,801\nVelocità Proiettile: 1,215 m/s  |  Portata: 6.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 16,500\nSignatures:  EM: 36  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAPAR_BallisticGatling_S6=Produttore: Apocalypse Arms\nTipo di articolo: Gatling balistico\nTaglia: 6\n\nRicorda un'era passata di combattimento spaziale, questo brutale Gatling balistico di taglia sei di Apocalypse Arms è un'arma molto deliberata. Prenditi un momento mentre il tamburo del Draugar gira a tutta velocità per assaporare la rovina e la distruzione che stai per scatenare.\n\n--- STATISTICHE ---\nPeso: 1950.0 kg\nCadenza di Fuoco: 1,200 RPM\nFire Modalità: Auto\nDanno Alpha: 142.4 (Phys)  |  DPS: 2,848.0\nAmmo: 3,309\nVelocità Proiettile: 1,215 m/s  |  Portata: 6.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 4,224\nSignatures:  EM: 33  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAPAR_BallisticScatterGun_S1=Produttore: Apocalypse Arms\nTipo di oggetto: fucile a dispersione balistico\nDimensione: 1\n\nSemina terrore sul campo di battaglia con il caos di Apocalypse Arms. Questo fucile a dispersione di taglia uno infligge ingenti danni a distanza ravvicinata, rendendolo l'arma perfetta per finire un combattimento.\n\n--- STATISTICHE ---\nPeso: 60.0 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 374.4 x8 (Phys)  |  DPS: 374.4\nAmmo: 2,040\nVelocità Proiettile: 900 m/s  |  Portata: 1.3 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,550\nSignatures:  EM: 41  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAPAR_BallisticScatterGun_S2=Produttore: Apocalypse Arms\nTipo di elemento: fucile a dispersione balistico\nDimensione: 2\n\nHellion di Apocalypse Arms è un fucile a dispersione di dimensione due che satura i bersagli con munizioni balistiche a distanza ravvicinata. La funzionalità delle munizioni intelligenti della pistola consente di passare dai proiettili standard a quelli speciali.\n\n--- STATISTICHE ---\nPeso: 150.0 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 560.0 x8 (Phys)  |  DPS: 560.0\nAmmo: 2,019\nVelocità Proiettile: 897 m/s  |  Portata: 1.4 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,550\nSignatures:  EM: 41  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAPAR_BallisticScatterGun_S3=Produttore: Apocalypse Arms\nTipo di oggetto: fucile a dispersione balistico\nDimensione: 3\n\nIl fucile a dispersione Predator preda gli avversari vicini con una travolgente raffica di munizioni balistiche. La versione di taglia tre del temuto fucile a dispersione di Apocalypse Arms scambia la portata effettiva con un'ampia diffusione.\n\n--- STATISTICHE ---\nPeso: 375.0 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 840.0 x8 (Phys)  |  DPS: 840.0\nAmmo: 1,980\nVelocità Proiettile: 888 m/s  |  Portata: 1.5 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,550\nSignatures:  EM: 41  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescAPAR_MassDriver_S2=Produttore: Apocalypse Arms\nTipo di elemento: Mass Driver Cannon\nDimensione: 2\n\nPaga sempre essere preparati e, se mai la sfortuna dovesse colpire, sarai felice di avere un Apocalypse Arms Strife Mass Driver a portata di mano. I suoi acceleratori elettromagnetici possono essere un po' assetati di energia, ma compensano con la rapidità con cui può sparare i suoi proiettili ad alta velocità. Guardarlo sfondare il tuo obiettivo è sufficiente per migliorare un po' qualsiasi brutta giornata. Fai solo attenzione a non lasciarlo surriscaldare.\n\n--- STATISTICHE ---\nPeso: 600.0 kg\nCadenza di Fuoco: 30 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 525.0 (Phys)  |  DPS: 262.5\nAmmo: 84\nVelocità Proiettile: 1,151 m/s  |  Portata: 3.2 km\nConsumo Energia: 2 PU/s\nHP Componente: 1,050\nSignatures:  EM: 792  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescARGO_TractorBeam_S1_Cargo=Produttore: Argo Astronautics\nTipo di articolo: Raggio traente\nAngolo massimo: 60°\nPortata massima: 150 m\nDistanza a piena potenza: 75 m\n\nRealizzato appositamente per la tuta potenziata ATLS, il raggio traente Durus di Argo Astronautics è stato accuratamente messo a punto per il carico e lo scarico del carico.\n\n--- STATISTICHE ---\nPeso: 70.0 kg\nFire Modalità: Tractor Beam\nAmmo: 0\nVelocità Proiettile: 0 m/s  |  Portata: 0 m\nConsumo Energia: 1 PU/s\nHP Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescASAD_DistortionRepeater_S1=Produttore: Associated Science & Development\nTipo di articolo: Ripetitore di distorsione\nDimensione: 1\n\nLa potenza è la linfa vitale di ogni nave e il DR Model-XJ1 di ASD è la scelta ideale per dissanguare gli ostili. Questo ripetitore di distorsione all'avanguardia ti consente di interrompere l'alimentazione sui bersagli, disabilitando le minacce in modo efficiente.\n\n--- STATISTICHE ---\nPeso: 24.0 kg\nCadenza di Fuoco: 400 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 25.7 (Distort)  |  DPS: 171.3\nAmmo: 75\nRegen: 750/s  |  Cooldown: 0.8s  |  Cost/Shot: 26\nVelocità Proiettile: 1,350 m/s  |  Portata: 1.2 km\nConsumo Energia: 0 PU/s\nHP Componente: 525\nSignatures:  EM: 167  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescASAD_DistortionRepeater_S2=Produttore: Associated Science & Development\nTipo di articolo: Ripetitore di distorsione\nDimensione: 2\n\nAvanzando nel campo delle armi di distorsione, il ripetitore DR Model-XJ2 di ASD fornisce un'interruzione tattica dell'energia che limiterà gravemente la capacità operativa di qualsiasi nave presa di mira.\n\n--- STATISTICHE ---\nPeso: 60.0 kg\nCadenza di Fuoco: 400 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 38.5 (Distort)  |  DPS: 256.7\nAmmo: 75\nRegen: 1,123/s  |  Cooldown: 0.8s  |  Cost/Shot: 38\nVelocità Proiettile: 1,346 m/s  |  Portata: 1.3 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 223  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescASAD_DistortionRepeater_S3=Produttore: Associated Science & Development\nTipo di elemento: Ripetitore di distorsione\nDimensione: 3\n\nArresta le azioni ostili e gli alimentatori di destinazione con il DR Model-XJ3, un ripetitore di distorsione a lungo raggio sviluppato dai laboratori di ricerca sulle armi avanzate di ASD.\n\n--- STATISTICHE ---\nPeso: 150.0 kg\nCadenza di Fuoco: 400 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 57.9 (Energy: 0.0 / Distort: 57.9)  |  DPS: 386.0\nAmmo: 75\nRegen: 1,689/s  |  Cooldown: 0.8s  |  Cost/Shot: 58\nVelocità Proiettile: 1,332 m/s  |  Portata: 1.4 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,024\nSignatures:  EM: 278  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBANU_TachyonCannon_S1=Produttore: Banu\nTipo di elemento: Cannone tachionico\nTaglia: 1\n\nReso popolare da un Banu souli, il cannone tachionico Singe infligge costantemente danni energetici devastanti su vaste distanze. Anche se lento a sparare, il velocissimo proiettile tachionico colpisce i bersagli quasi istantaneamente, rendendo il Singe la scelta preferita per le navi di sicurezza Banu. Sebbene i Banu abbiano da tempo dimenticato l'origine di quest'arma ad alta tecnologia, diverse scelte progettuali uniche hanno portato gli studiosi a sospettare che i Banu potrebbero essersi appropriati della tecnologia nella loro cultura, invece di inventarla loro stessi.\n\n--- STATISTICHE ---\nPeso: 192.0 kg\nCadenza di Fuoco: 90 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 202.5 (Energy)  |  DPS: 303.8\nAmmo: 25\nRegen: 1,500/s  |  Cooldown: 1.6s  |  Cost/Shot: 300\nVelocità Proiettile: 1,050 m/s  |  Portata: 3.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 594  |  IR: 0\nTemp. Surriscaldamento: 450K
