item_DescFSKI_S1_RPOD_3x_S3=Tipo di elemento: capsula missilistica\nProduttore: Firestorm Kinetics\nDimensione: 1\nRazzi: 3xS3\n\nLa capsula missilistica Yebira I è il sistema perfetto per un efficiente dispiegamento di ordigni S3. Prodotto da Firestorm Kinetics, questo baccello porta razzi trasporta tre razzi e si attacca a un punto fisso di qualsiasi dimensione.\n\n--- STATISTICHE ---\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 150.0 (Phys)  |  DPS: 150.0\nAmmo: 6\nVelocità Proiettile: 700 m/s  |  Portata: 2.1 km\nHP Componente: 500
