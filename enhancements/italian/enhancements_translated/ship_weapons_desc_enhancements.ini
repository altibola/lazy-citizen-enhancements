item_DescESPR_LaserCannon_S1=Produttore: Esperia\nTipo di elemento: Cannone laser\nDimensione: 1\n\nIl Lightstrike I attacca bersagli distanti lanciando colpi mirati e ad alto danno che faranno riflettere due volte qualsiasi aggressore prima di avvicinarsi troppo. Capace di fornire potenti opzioni di sorveglianza durante lo schieramento di truppe o l'ingaggio di bersagli nello spazio, è facile capire perché il Lightstrike I fosse temuto dalle forze UPE durante la Prima Guerra Tevarin.\n\n--- STATISTICHE ---\nPeso: 96.0 kg\nCadenza di Fuoco: 250 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 49.2 (Energy)  |  DPS: 205.2\nAmmo: 25\nRegen: 1,267/s  |  Cooldown: 1.2s  |  Cost/Shot: 52\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 371  |  IR: 0\nTemp. Surriscaldamento: 450K
