item_DescPRAR_DistortionScatterGun_S4=Produttore: Preacher Armaments\nTipo di oggetto: fucile a dispersione di distorsione\nDimensione: 4\n\nDisabilita una nave nemica senza danneggiarla con il fucile a dispersione di salvezza di Preacher Armaments. Grazie alla sua ampia diffusione e alla bassa cadenza di fuoco, questo fucile a dispersione di taglia quattro è molto potente a distanza ravvicinata.\n\n--- STATISTICHE ---\nPeso: 750.0 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 480.0 x8 (Distort)  |  DPS: 480.0\nAmmo: 75\nRegen: 4,800/s  |  Cooldown: 0.4s  |  Cost/Shot: 120\nVelocità Proiettile: 778 m/s  |  Portata: 1.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,650\nSignatures:  EM: 495  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescPRAR_DistortionScatterGun_S5=Produttore: Preacher Armaments\nTipo di oggetto: fucile a dispersione distorsore\nDimensione: 5\n\nInfliggi elevati danni di distorsione a distanza ravvicinata con il fucile a dispersione Absolution di Preacher Armaments. Quest'arma di taglia cinque è un'opzione di equipaggiamento ideale per chi è interessato a catturare o abbordare il proprio bersaglio.\n\n--- STATISTICHE ---\nPeso: 1880.0 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 720.0 x8 (Distort)  |  DPS: 720.0\nAmmo: 75\nRegen: 7,200/s  |  Cooldown: 0.4s  |  Cost/Shot: 180\nVelocità Proiettile: 751 m/s  |  Portata: 1.5 km\nConsumo Energia: 1 PU/s\nHP Componente: 2,640\nSignatures:  EM: 578  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescPRAR_DistortionScatterGun_S6=Produttore: Preacher Armaments\nTipo di oggetto: pistola a dispersione distorsione\nDimensione: 6\n\nThe Condemnation è un enorme fucile a dispersione di dimensione sei di Preacher Armaments. Il suo elevato danno da distorsione rende inabile l'elettronica, anche se la sua ampia diffusione lo rende meno efficace quando il bersaglio si allontana.\n\n--- STATISTICHE ---\nPeso: 4690.0 kg\nCadenza di Fuoco: 60 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 1,040.0 x8 (Distort)  |  DPS: 1,040.0\nAmmo: 75\nRegen: 10,600/s  |  Cooldown: 0.4s  |  Cost/Shot: 265\nVelocità Proiettile: 729 m/s  |  Portata: 2.3 km\nConsumo Energia: 2 PU/s\nHP Componente: 4,224\nSignatures:  EM: 660  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescRSI_BallisticCannon_Meteor_Bespoke=Produttore: RSI\nTipo di oggetto: Cannone Balistico\nDimensione: 5\n\nCostruito specificamente per la Meteor, il cannone balistico Leonids fornisce una formidabile potenza di fuoco progettata per sopraffiare gli aggressori che osano avvicinarsi. RSI ha sapientemente incorporato il cannone su entrambi i lati della nave per integrarsi perfettamente con i componenti della nave e fornire una copertura anteriore completa.\n\n--- STATISTICHE ---\nPeso: 510.0 kg\nCadenza di Fuoco: 225 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 1,600.0 (Phys)  |  DPS: 6,000.0\nAmmo: 720\nVelocità Proiettile: 1,112 m/s  |  Portata: 5.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 2,500\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescRSI_BallisticCannon_S8=Produttore: RSI\nTipo di Oggetto: Cannone Balistico\nTaglia: 8\n\nBasandosi su secoli di tecnologia d'armi RSI, la Perseus utilizza cannoni Medusa di taglia 8 su misura che forniscono devastanti salve di fuoco balistico, capaci di iniziare combattimenti con la stessa facilità con cui li terminano. Questi cannoni RSI personalizzati eccellono nel punire bersagli più grandi a lunga distanza, rendendola una formidabile equalizzatrice sul campo di battaglia.\n\n--- STATISTICHE ---\nPeso: 1400.0 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 5,400.0 (Phys)  |  DPS: 4,500.0\nAmmo: 900\nVelocità Proiettile: 1,016 m/s  |  Portata: 9.7 km\nConsumo Energia: 0 PU/s\nHP Componente: 30,000\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescRSI_Bespoke_BallisticCannon_A=Produttore: Roberts Space Industries\nTipo di Oggetto: Cannone Balistico\nTaglia: 6\n\nQuesto potente cannone balistico è stato progettato da RSI come armamento su misura per la loro corvetta Polaris.\n\n--- STATISTICHE ---\nPeso: 600.0 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 3,400.0 (Phys)  |  DPS: 2,833.3\nAmmo: 2,700\nVelocità Proiettile: 1,112 m/s  |  Portata: 5.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 5,600\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescRSI_EMP_Magstrand_S4=Tipo di articolo: generatore di esplosioni\nProduttore: RSI\nTaglia: 4\n\nIl Magstrand di RSI è un generatore di esplosioni EMP progettato specificamente per Scorpius Antares. Quando è completamente carico, il dispositivo crea una potente ondata di danni distorsivi che possono disattivare i componenti elettrici all'interno del suo raggio di esplosione.\n\n--- STATISTICHE ---\nPeso: 4000.0 kg\nConsumo Energia: 1 PU/s\nHP Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescRSI_LaserRepeater_S5=Produttore: Robert Space Industries\nTipo Oggetto: Ripetitore Laser\nDimensione: 5\n\nProgettato per sopraffare gli scudi con una raffica di fuoco laser, questo ripetitore laser Echion personalizzato della RSI spoglierà i nemici delle loro difese lasciandoli vulnerabili ad attacchi più devastanti.\n\n--- STATISTICHE ---\nPeso: 280.0 kg\nCadenza di Fuoco: 800 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 95.0 (Energy)  |  DPS: 1,266.7\nAmmo: 225\nRegen: 4,544/s  |  Cooldown: 0.2s  |  Cost/Shot: 73\nVelocità Proiettile: 1,390 m/s  |  Portata: 3.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,550\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
