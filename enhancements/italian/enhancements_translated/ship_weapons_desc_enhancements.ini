item_DescTOAG_LaserGatling_S2=Produttore: Torral Aggregate\nTipo oggetto: Gatling laser\nDimensione: 2\n\nSperimenta l'avanguardia della tecnologia Xi'an con la gatling laser Thlilye, progettata da Torral Aggregate. Realizzata esclusivamente per la Mirai Pulse, questa gatling laser completamente automatica di dimensione 2 presenta un rateo di fuoco fulmineo, rendendola ideale per il combattimento a corto raggio.\n\n--- STATISTICHE ---\nPeso: 40.0 kg\nCadenza di Fuoco: 1,100 RPM\nFire Modalità: Auto\nDanno Alpha: 17.1 (Energy)  |  DPS: 313.5\nAmmo: 75\nRegen: 1,742/s  |  Cooldown: 1.0s  |  Cost/Shot: 19\nVelocità Proiettile: 1,346 m/s  |  Portata: 1.7 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 111  |  IR: 0\nTemp. Surriscaldamento: 450K
