item_DescBEHR_LaserCannon_S5=Produttore: Behring\nTipo di articolo: cannone laser\nTaglia: 5\n\nQuesto versatile cannone automatico a energia a lunga distanza è l'ultimo della serie M di Behring. L'M7A è progettato per agire come deterrente ad alto impatto efficace a medio e lungo raggio. Il nuovo sistema di lenti AC8 riduce al minimo la perdita di potenza d'arresto sulla distanza, rendendo ogni tiro ugualmente efficace a distanze più lunghe.\n\n--- STATISTICHE ---\nPeso: 5630.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 921.8 (Energy)  |  DPS: 1,536.3\nAmmo: 25\nRegen: 9,483/s  |  Cooldown: 1.5s  |  Cost/Shot: 569\nVelocità Proiettile: 1,112 m/s  |  Portata: 4.0 km\nConsumo Energia: 2 PU/s\nHP Componente: 2,500\nSignatures:  EM: 941  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_S6=Produttore: Behring\nTipo di articolo: cannone laser\nDimensione: 6\n\nIl cannone automatico laser M8A esemplifica la vasta storia di Behring nella progettazione e costruzione di armamenti navali. Il risultato è un'arma energetica affidabile ed efficace in grado di gestire grandi schermaglie o precise manovre difensive.\n\n--- STATISTICHE ---\nPeso: 14100.0 kg\nCadenza di Fuoco: 120 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 900.0 (Energy)  |  DPS: 1,800.0\nAmmo: 25\nRegen: 14,292/s  |  Cooldown: 1.5s  |  Cost/Shot: 854\nVelocità Proiettile: 1,080 m/s  |  Portata: 6.0 km\nConsumo Energia: 2 PU/s\nHP Componente: 4,224\nSignatures:  EM: 1,090  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_S7=Produttore: Behring\nTipo di oggetto: cannone laser\nDimensione: 7\n\nColpisci al cuore i tuoi nemici con l'impatto devastante del cannone automatico a energia M9A di Behring. Quando è completamente carica, l'enorme potere d'arresto di quest'arma laser ha il potenziale di fermare anche le navi capitali sul loro cammino.\n\n--- STATISTICHE ---\nPeso: 6870000.0 kg\nCadenza di Fuoco: 10 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 200,000.0 (Phys)  |  DPS: 33,333.3\nAmmo: 21\nVelocità Proiettile: 924 m/s  |  Portata: 12.0 km\nConsumo Energia: 6 PU/s\nHP Componente: 708,660\nSignatures:  EM: 3,020  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_SF7E_S7=Produttore: Behring\nTipo di articolo: cannone laser\nDimensione: 7\n\nGli ingegneri di Behring e Crusader hanno collaborato per rendere il cannone laser SF7E l'arma ideale per l'Ares Ion Star Fighter. Un guscio personalizzato consente all'enorme arma di integrarsi perfettamente nel corpo della nave. Ideale per gli scontri a lungo raggio che coinvolgono veicoli spaziali di grandi dimensioni e di classe capitale, l'impressionante precisione e l'elevato danno per round dell'SF7E lo rendono un'arma devastante nelle mani di un abile tiratore.\n\n--- STATISTICHE ---\nPeso: 35200.0 kg\nCadenza di Fuoco: 55 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 5,150.0 (Energy)  |  DPS: 4,720.8\nAmmo: 25\nRegen: 21,355/s  |  Cooldown: 1.9s  |  Cost/Shot: 1,200\nVelocità Proiettile: 1,048 m/s  |  Portata: 7.3 km\nConsumo Energia: 3 PU/s\nHP Componente: 6,750\nSignatures:  EM: 1,450  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_VNG_S2=Produttore: Behring\nTipo di elemento: Cannone laser\nDimensione: 2\n\nIl classico M4A è stato appositamente riorganizzato da Behring per creare il VS (Vanguard Special), un'arma laser progettata per soddisfare i requisiti unici di Aegis'. L'arma montata sul muso predefinita sul Vanguard Warden, l'MVSA può essere caricata solo su altre varianti Vanguard.\n\n--- STATISTICHE ---\nPeso: 360.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 273.0 (Energy)  |  DPS: 455.0\nAmmo: 25\nRegen: 2,808/s  |  Cooldown: 1.5s  |  Cost/Shot: 168\nVelocità Proiettile: 1,196 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 708  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserRepeater_PDC_S1=Tipo di Oggetto: Torretta Laser\nProduttore: Behring\n\nL'ultima generazione di tecnologia di difesa puntuale, la M2C "Swarm" utilizza software avanzato di ricerca, rilevamento e tracciamento per scatenare una rapida raffica di fuoco laser, proteggendo le navi da missili in arrivo, torpedo e altre minacce ad alta velocità.\n\n--- STATISTICHE ---\nPeso: 36.0 kg\nCadenza di Fuoco: 1,000 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 10.0 (Energy)  |  DPS: 166.7\nAmmo: 75\nRegen: 2,025/s  |  Cooldown: 0.6s  |  Cost/Shot: 32\nVelocità Proiettile: 1,500 m/s  |  Portata: 1.6 km\nConsumo Energia: 0 PU/s\nHP Componente: 800\nSignatures:  EM: 143  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserRepeater_VNG_S2=Produttore: Behring\nTipo di articolo: ripetitore laser\nDimensione: 2\n\nAegis ha commissionato a Behring la progettazione di un ripetitore laser appositamente per la loro linea Vanguard. Il risultato fu il GVSR, che soddisfaceva gli standard rigorosi della Aegis fornendo una cadenza di fuoco costante senza sovraccaricare la centrale elettrica della nave.\n\n--- STATISTICHE ---\nPeso: 90.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 99.7 (Energy)  |  DPS: 581.7\nAmmo: 75\nRegen: 3,232/s  |  Cooldown: 0.8s  |  Cost/Shot: 55\nVelocità Proiettile: 1,495 m/s  |  Portata: 1.7 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 289  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBOMB_S03_FSKI_Thunderball=Produttore: FireStorm Kinetics\nTipo di oggetto: bomba esplosiva\nDimensione: 3\n\nPrendi di mira le forze di terra da una distanza di sicurezza dall'alto con la Thunderball. Nonostante le dimensioni ridotte, queste bombe S3 racchiudono un potente carico utile, consentendo agli utenti di schierare più bombe per sopraffare un bersaglio fermo o di sganciarle a intervalli per colpire bersagli in movimento. Il Thunderball utilizza le pinne Atmo-Xact brevettate di FireStorm Kinetics che si aprono una volta caduto per fornire ulteriore guida lungo il percorso verso il bersaglio.\n\n--- STATISTICHE ---\nPeso: 252.0 kg\nHP Componente: 1,000\nTemp. Surriscaldamento: 450K
item_DescBOMB_S05_FSKI_Stormburst=Produttore: FireStorm Kinetics\nTipo di oggetto: bomba esplosiva\nDimensione: 5\n\nScatena il caos sulle forze di terra dai cieli sopra, con l'esplosione Storm. Progettate da FireStorm Kinetics per massimizzare l'impatto distruttivo con dimensioni più moderate, queste bombe S5 sono dotate di ordigni compositi misti per decimare bersagli corazzati. Il Stormburst utilizza anche le pinne Atmo-Xact brevettate di FireStorm Kinetics per garantire che il carico utile raggiunga il suo obiettivo.\n\n--- STATISTICHE ---\nPeso: 252.0 kg\nHP Componente: 1,000\nTemp. Surriscaldamento: 450K
item_DescBOMB_S10_FSKI_Colossus=Produttore: FireStorm Kinetics\nTipo di oggetto: Bomba esplosiva\nDimensione: 10\n\nI nemici qui sotto non avranno alcuna possibilità contro un Colosso. FireStorm Kinetics ha progettato questa enorme bomba S10 per devastare bersagli terrestri, siano essi veicoli o strutture. Pensato per essere lanciato da un'alta quota, il Colosso è dotato di pinne Atmo-Xact brevettate che si aprono per fornire ulteriore guida lungo il percorso verso il bersaglio.\n\n--- STATISTICHE ---\nPeso: 951.0 kg\nHP Componente: 1,000\nTemp. Surriscaldamento: 450K
item_DescESPR_BallisticCannon_S1=Produttore: Esperia\nTipo di oggetto: cannone balistico\nDimensione: 1\n\nDiffondi il terrore con il cannone balistico Deadbolt I. Temuta per la sua potenza di fuoco a corto raggio, questa famigerata arma Tevarin si guadagnò la sua reputazione intimidatoria durante la Prima Guerra Tevarin come parte del devastante arsenale della flotta Tevarin. Esperia ha ricreato scrupolosamente il Deadbolt I in segno di rispetto per l'arma originale e per i guerrieri che la usavano in modo così efficace.\n\n--- STATISTICHE ---\nPeso: 96.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 202.5 (Phys)  |  DPS: 337.5\nAmmo: 396\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.5 km\nConsumo Energia: 0 PU/s\nHP Componente: 550\nSignatures:  EM: 41  |  IR: 0\nTemp. Surriscaldamento: 450K
