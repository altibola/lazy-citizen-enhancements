item_DescGATS_BallisticCannon_S1=Produttore: Gallenson Tactical Systems\nTipo di articolo: cannone balistico\nDimensione: 1\n\nAlimentata dal sistema di munizioni a tamburo SpinGlide brevettato da Gallenson Tactical, la Tarantula GT-870 Mk1 può fornire in modo fluido e preciso un flusso costante di proiettili balistici. Anche se ha una cadenza di fuoco moderata, la sua durevolezza affidabile lo rende un'aggiunta affidabile a qualsiasi combattimento.\n\n--- STATISTICHE ---\nPeso: 144.0 kg\nCadenza di Fuoco: 200 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 60.8 (Phys)  |  DPS: 202.5\nAmmo: 330\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.5 km\nConsumo Energia: 0 PU/s\nHP Componente: 550\nSignatures:  EM: 50  |  IR: 0\nTemp. Surriscaldamento: 450K
