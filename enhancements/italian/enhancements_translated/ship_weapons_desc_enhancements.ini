item_DescBEHR_BallisticCannon_S4=Produttore: Behring\nTipo di elemento: Cannone balistico\nDimensione: 4\n\nScatenando proiettili di grosso calibro con velocità devastante, il cannone automatico balistico C-788 di Behring è stato costruito per perforare l'armatura della nave. Estremamente durevole con un'eccezionale resistenza al calore, la "Mietitrebbia" può gestire un carico di lavoro pesante che, anche con la cadenza di fuoco più lenta dell'arma, la rende la scelta ideale per affrontare bersagli più grandi e meno manovrabili.\n\n--- STATISTICHE ---\nPeso: 2250.0 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 325.0 (Phys)  |  DPS: 270.8\nAmmo: 270\nVelocità Proiettile: 1,152 m/s  |  Portata: 3.5 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,650\nSignatures:  EM: 50  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticCannon_S7_Tiburon=Produttore: Behring\nTipo Oggetto: Cannone Balistico\nDimensione: 7\n\nUn'arma dedicata anti-nave ammiraglia regolata per soddisfare le esigenze di combattimento del Tiburon, il Cannone Balistico C-07T offre una potenza offensiva schiacciante, dimostrando che la Behring continua a innovare in tutte le aree della tecnologia del campo di battaglia.\n\n--- STATISTICHE ---\nPeso: 115.0 kg\nCadenza di Fuoco: 35 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 4,600.0 (Phys)  |  DPS: 2,683.3\nAmmo: 800\nVelocità Proiettile: 1,048 m/s  |  Portata: 9.1 km\nConsumo Energia: 0 PU/s\nHP Componente: 6,750\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticCannon_VNG_S2=Produttore: Behring\nTipo di articolo: cannone balistico\nDimensione: 2\n\nBehring ha progettato il CVSA come variante del cannone balistico Vanguard. Quest'arma è caratterizzata da una cadenza di fuoco più lenta e offre colpi a velocità più elevata, ideali per infliggere gravi danni ai bersagli a medio e lungo raggio.\n\n--- STATISTICHE ---\nPeso: 360.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 162.0 (Phys)  |  DPS: 405.0\nAmmo: 327\nVelocità Proiettile: 1,196 m/s  |  Portata: 2.7 km\nConsumo Energia: 0 PU/s\nHP Componente: 550\nSignatures:  EM: 50  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticGatling_Hornet_Bespoke=Produttore: Behring\nTipo di articolo: Gatling balistico (x2)\nDimensioni: 5\n\nQuesti doppi gatling balistici sono stati progettati in collaborazione con Anvil Aerospace per l'uso sull'F7C Hornet Mk II e sono destinati al montaggio cardanico su una torretta sferica per un puntamento adattivo.\n\n--- STATISTICHE ---\nPeso: 200.0 kg\nCadenza di Fuoco: 1,050 RPM\nFire Modalità: Auto\nDanno Alpha: 52.7 (Phys)  |  DPS: 922.2\nAmmo: 5,250\nVelocità Proiettile: 1,346 m/s  |  Portata: 2.2 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,500\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticGatling_NOVA_S5=Tipo di Oggetto: Gatling Balistica\nProduttore: Behring\nTaglia: S5\n\nRompi i ranghi con la Gatling Balistica NV57 progettata per sostituire il cannone standard del carro armato Tumbril Nova. Preparati ad affrontare forze di terra soverchianti frontalmente usando quest'arma ad alta potenza con una potenza di danno superiore e una devastante cadenza di fuoco.\n\n--- STATISTICHE ---\nPeso: 380.0 kg\nCadenza di Fuoco: 1,200 RPM\nFire Modalità: Auto\nDanno Alpha: 162.5 (Phys)  |  DPS: 3,250.0\nAmmo: 9,600\nVelocità Proiettile: 1,251 m/s  |  Portata: 4.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 4,224\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticGatling_PDC_S1=Tipo Oggetto: Torretta Gatling Balistica\nProduttore: Behring\n\nL'ultima generazione di tecnologia di difesa di punto, la MRX "Torrent" utilizza software avanzati di ricerca, rilevamento e tracciamento per scatenare una rapida raffica di fuoco balistico, proteggendo le navi da missili in arrivo, torpedo e altre minacce ad alta velocità.\n\n--- STATISTICHE ---\nPeso: 115.0 kg\nCadenza di Fuoco: 1,200 RPM\nFire Modalità: Auto\nDanno Alpha: 18.0 (Phys)  |  DPS: 360.0\nAmmo: 15,000\nVelocità Proiettile: 1,350 m/s  |  Portata: 2.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticGatling_S4=Produttore: Behring\nTipo di articolo: Gatling balistico\nTaglia: 4\n\nL'AD4B, la versione di Behring del classico gatling balistico, include un meccanismo di sparo a ciclo di cristalli nel sistema rotante ad alta velocità per massimizzare l'efficienza per impegni prolungati con mancate accensioni minime. La prossima volta che un aggressore intensifica una situazione ostile, fagli rimpiangere la decisione attivando quest'arma travolgente ed efficace.\n\n--- STATISTICHE ---\nPeso: 375.0 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Auto\nDanno Alpha: 84.4 (Phys)  |  DPS: 1,266.0\nAmmo: 5,220\nVelocità Proiettile: 1,296 m/s  |  Portata: 2.8 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,650\nSignatures:  EM: 36  |  IR: 0\nTemp. Surriscaldamento: 450K
