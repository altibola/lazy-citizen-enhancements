item_DescHRST_Storm_LaserRepeater_S3=Produttore: Hurston Dynamics\nTipo di articolo: ripetitore laser\nDimensione: 3\n\nHurston Dynamics ha collaborato con Tumbril Land Systems per realizzare il potente ripetitore laser Reign-3 appositamente per la torretta del veicolo d'assalto Storm. Utilizzando la tecnologia a cascata proprietaria di Hurston Dynamics, il Reign-3 offre prestazioni migliorate e una maggiore produzione di energia mentre il ritmo frenetico del combattimento inizia a surriscaldarsi.\n\n--- STATISTICHE ---\nPeso: 150.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 350.0 (Energy)  |  DPS: 2,041.7\nAmmo: 75\nRegen: 4,853/s  |  Cooldown: 0.8s  |  Cost/Shot: 84\nVelocità Proiettile: 1,480 m/s  |  Portata: 1.9 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,024\nSignatures:  EM: 320  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescJOKR_DistortionCannon_S1=Produttore: Joker Engineering\nTipo di articolo: Cannone di distorsione\nTaglia: 1\n\nI geni di Joker lo hanno fatto di nuovo. Il cannone automatico Suckerpunch Distortion è un'arma a lungo raggio che consuma l'energia del tuo bersaglio invece di danneggiare il corpo fisico della nave, rendendolo ideale per le forze dell'ordine o altre applicazioni.\n\n--- STATISTICHE ---\nPeso: 96.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 81.0 (Distort)  |  DPS: 135.0\nAmmo: 25\nRegen: 750/s  |  Cooldown: 1.6s  |  Cost/Shot: 90\nVelocità Proiettile: 1,080 m/s  |  Portata: 1.5 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 408  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescJOKR_DistortionCannon_S2=Produttore: Joker Engineering\nTipo di oggetto: Cannone distorsivo\nDimensione: 2\n\nColpisci silenziosamente da lontano con il Suckerpunch. Il cannone di distorsione di dimensione due a lungo raggio di Joker prosciuga il sistema energetico di un bersaglio, lasciandolo incapace di difendersi da ciò che hai pianificato dopo. Una scelta ideale per le forze dell'ordine, i cacciatori di taglie e altre operazioni non letali.\n\n--- STATISTICHE ---\nPeso: 240.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 121.5 (Energy: 0.0 / Distort: 121.5)  |  DPS: 202.5\nAmmo: 25\nRegen: 1,125/s  |  Cooldown: 1.7s  |  Cost/Shot: 135\nVelocità Proiettile: 1,076 m/s  |  Portata: 1.6 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 545  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescJOKR_DistortionCannon_S3=Produttore: Joker Engineering\nTipo di elemento: Cannone a distorsione\nDimensione: 3\n\nQuando vuoi catturare la tua preda senza fare danni usa il Suckerpunch. Questo cannone a distorsione dimensione tre di Joker esaurisce il sistema energetico del bersaglio, rendendolo un'aggiunta eccellente ed efficace non letale al tuo arsenale.\n\n--- STATISTICHE ---\nPeso: 600.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 182.5 (Distort)  |  DPS: 304.2\nAmmo: 25\nRegen: 1,690/s  |  Cooldown: 1.8s  |  Cost/Shot: 203\nVelocità Proiettile: 1,066 m/s  |  Portata: 1.8 km\nConsumo Energia: 2 PU/s\nHP Componente: 1,024\nSignatures:  EM: 681  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKBAR_BallisticCannon_S1=Produttore: KnightBridge Arms\nTipo di elemento: Cannone balistico\nDimensione: 1\n\nIl cannone automatico entry level della linea KnightBridge Arms Sword, la spada lunga serie 9 spara un proiettile balistico progettato per l'uso contro una varietà di ostili corazzati consentendo ai piloti per mantenere una sana distanza dagli obiettivi.\n\n--- STATISTICHE ---\nPeso: 76.8 kg\nCadenza di Fuoco: 250 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 48.6 (Phys)  |  DPS: 202.5\nAmmo: 495\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.5 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 38  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKBAR_BallisticCannon_S2=Produttore: KnightBridge Arms\nTipo di articolo: cannone balistico\nTaglia: 2\n\nKnightBridge Arms sa che quando si tratta di battaglia, avere l'arma giusta può fare la differenza. Con i suoi potenti proiettili balistici, il versatile spadone della serie 10 di misura due ti accompagnerà fino alla fine del conflitto grazie alla sua lunga gittata e all'elevato potenziale di danno.\n\n--- STATISTICHE ---\nPeso: 192.0 kg\nCadenza di Fuoco: 250 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 73.0 (Phys)  |  DPS: 304.1\nAmmo: 492\nVelocità Proiettile: 1,196 m/s  |  Portata: 2.7 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 38  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKBAR_BallisticCannon_S3=Produttore: KnightBridge Arms\nTipo di articolo: cannone balistico\nTaglia: 3\n\nLo spadone serie 11 di KnightBridge Arms è la taglia tre a cui arrivano i piloti di cannone automatico balistico quando vogliono le 3 D: distanza, affidabilità e danno.\n\n--- STATISTICHE ---\nPeso: 480.0 kg\nCadenza di Fuoco: 250 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 109.3 (Phys)  |  DPS: 455.2\nAmmo: 489\nVelocità Proiettile: 1,184 m/s  |  Portata: 3.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 2,850\nSignatures:  EM: 38  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_LaserRepeater_S1=Produttore: Klaus & Werner\nTipo di articolo: Ripetitore laser\nDimensione: 1\n\nCaratterizzato da un design a fuoco sequenziale a tre canne, il ripetitore laser Klaus & Werner CF-117 Bulldog è in grado di fornire colpi di energia ad alta velocità mantenendo l'efficienza termica è uno dei preferiti tra i nuovi piloti che stanno equipaggiando la loro prima nave.\n\n--- STATISTICHE ---\nPeso: 24.0 kg\nCadenza di Fuoco: 750 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 11.3 (Energy)  |  DPS: 141.2\nAmmo: 70\nRegen: 1,355/s  |  Cooldown: 0.7s  |  Cost/Shot: 22\nVelocità Proiettile: 1,500 m/s  |  Portata: 1.6 km\nConsumo Energia: 0 PU/s\nHP Componente: 525\nSignatures:  EM: 152  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_LaserRepeater_S2=Produttore: Klaus & Werner\nTipo di articolo: ripetitore laser\nTaglia: 2\n\nIl CF-227 Badger è l'affidabile laser ripetitivo di dimensione due di Klaus & Werner. La sua maggiore potenza e l'elevata cadenza di fuoco lo rendono un solido contendente in qualsiasi combattimento.\n\n--- STATISTICHE ---\nPeso: 60.0 kg\nCadenza di Fuoco: 750 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 26.2 (Energy)  |  DPS: 328.1\nAmmo: 75\nRegen: 2,025/s  |  Cooldown: 0.8s  |  Cost/Shot: 32\nVelocità Proiettile: 1,495 m/s  |  Portata: 1.7 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 203  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_LaserRepeater_S3=Produttore: Klaus & Werner\nTipo di articolo: ripetitore laser\nTaglia: 3\n\nIl CF-337 Panther è il modello di taglia tre nella linea di ripetitori laser di Klaus & Werner. La Pantera è una vera arma spara-e-dimentica con un rispettabile rapporto consumo energetico-danno. I piloti che equipaggiano le loro navi con i Panther raramente rimpiangono la decisione.\n\n--- STATISTICHE ---\nPeso: 200.0 kg\nCadenza di Fuoco: 750 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 43.6 (Energy)  |  DPS: 545.6\nAmmo: 75\nRegen: 3,031/s  |  Cooldown: 0.7s  |  Cost/Shot: 48\nVelocità Proiettile: 1,480 m/s  |  Portata: 1.9 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,500\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_LaserRepeater_S4=Produttore: Klaus & Werner\nTipo di articolo: ripetitore laser\nDimensione: 4\n\nQuando una nave ti carica contro con un CF-447 Rhino agganciato, è un'esperienza che pochi piloti dimenticheranno mai. Questo formidabile ripetitore laser di taglia quattro di Klaus & Werner è adatto per gli scontri a medio raggio, ma sferra un colpo ravvicinato.\n\n--- STATISTICHE ---\nPeso: 375.0 kg\nCadenza di Fuoco: 750 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 65.4 (Energy)  |  DPS: 817.9\nAmmo: 75\nRegen: 4,544/s  |  Cooldown: 0.8s  |  Cost/Shot: 73\nVelocità Proiettile: 1,440 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,650\nSignatures:  EM: 304  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_LaserRepeater_S5=Produttore: Klaus & Werner\nTipo di articolo: Ripetitore laser\nTaglia: 5\n\nCon un morso temibile quanto il suo omonimo zannuto, il ripetitore laser Klaus & Werner CF-557 Galdereen è una scelta solida per un'ampia gamma di veicoli grazie a la sua elevata cadenza di fuoco e la sua efficacia costante.\n\n--- STATISTICHE ---\nPeso: 938.0 kg\nCadenza di Fuoco: 750 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 98.2 (Energy)  |  DPS: 1,227.4\nAmmo: 75\nRegen: 6,819/s  |  Cooldown: 0.9s  |  Cost/Shot: 109\nVelocità Proiettile: 1,390 m/s  |  Portata: 3.2 km\nConsumo Energia: 1 PU/s\nSignatures:  EM: 354  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_LaserRepeater_S6=Produttore: Klaus & Werner\nTipo di articolo: Ripetitore laser\nDimensione: 6\n\nQuesto bestiale ripetitore laser di Klaus & Werner è dotato di tre enormi barili che avvertono chiunque individui una nave che trasporta il CF-667 che potrebbe voler pensare di nuovo prima di impegnarsi.\n\n--- STATISTICHE ---\nPeso: 2340.0 kg\nCadenza di Fuoco: 750 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 147.3 (Energy)  |  DPS: 1,841.6\nAmmo: 75\nRegen: 10,231/s  |  Cooldown: 0.9s  |  Cost/Shot: 164\nVelocità Proiettile: 1,350 m/s  |  Portata: 4.8 km\nConsumo Energia: 1 PU/s\nHP Componente: 4,224\nSignatures:  EM: 405  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_MassDriver_S1=Produttore: Klaus & Werner\nTipo di elemento: Mass Driver Cannon\nDimensione: 1\n\nAbbatti bersagli distanti con il Mass Driver Cannon Sledge I. Klaus & Werner hanno utilizzato la tecnologia dei cannoni a rotaia per sparare con precisione proiettili balistici ad alto danno su lunghe distanze. Assicurati però di fare in modo che ogni colpo conti, poiché l'arma sacrifica la velocità di fuoco per danni grezzi e devastanti.\n\n--- STATISTICHE ---\nPeso: 192.0 kg\nCadenza di Fuoco: 30 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 225.0 (Phys)  |  DPS: 112.5\nAmmo: 105\nVelocità Proiettile: 1,155 m/s  |  Portata: 3.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,050\nSignatures:  EM: 540  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_MassDriver_S10=Produttore: Klaus & Werner\nTipo di Oggetto: Cannone a Massa\nTaglia: 10\n\nRealizzato per l'Aegis Idris utilizzando la tecnologia del cannone a rotaia per sparare con precisione proiettili balistici ad alto danno su lunghe distanze, il cannone a massa Destroyer di Klaus & Werner ha dimostrato la sua presenza sul campo di battaglia più e più volte con un impatto devastante.\n\n--- STATISTICHE ---\nPeso: 700.0 kg\nCadenza di Fuoco: 6 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 144,160.0 (Phys)  |  DPS: 14,416.0\nAmmo: 1,500\nVelocità Proiettile: 939 m/s  |  Portata: 12.0 km\nConsumo Energia: 5 PU/s\nHP Componente: 727,680\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_MassDriver_S2=Produttore: Klaus & Werner\nTipo di elemento: Mass Driver Cannon\nDimensione: 2\n\nIl Mass Driver Cannon Klaus & Werner Sledge II è un'arma balistica potente in grado di sparare più tipi di munizioni. Tuttavia, le maggiori capacità di penetrazione dello scudo di quest'arma hanno un costo. Lo spazio del caricatore è limitato, quindi le munizioni devono essere rifornite regolarmente. Poiché non utilizza proiettili a base di energia, il driver di massa K&W ha un costo energetico ridotto e quindi si traduce in una firma EM ridotta.\n\n--- STATISTICHE ---\nPeso: 480.0 kg\nCadenza di Fuoco: 30 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 525.0 (Phys)  |  DPS: 262.5\nAmmo: 105\nVelocità Proiettile: 1,151 m/s  |  Portata: 3.2 km\nConsumo Energia: 2 PU/s\nHP Componente: 2,050\nSignatures:  EM: 720  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKLWE_MassDriver_S3=Produttore: Klaus & Werner\nTipo di articolo: Mass Driver Cannon\nDimensione: 3\n\nLo Sledge III è la variante di taglia tre della popolare serie di cannoni Mass Driver di Klaus & Werner. Anche se lenta nel fuoco, l'arma fonde con successo la filosofia aziendale di design semplice con la tecnologia all'avanguardia dei cannoni a rotaia per sparare proiettili balistici con precisione chirurgica a distanza.\n\n--- STATISTICHE ---\nPeso: 1200.0 kg\nCadenza di Fuoco: 30 RPM\nFire Modalità: Charge / Semi-Auto\nDanno Alpha: 1,125.0 (Phys)  |  DPS: 562.5\nAmmo: 102\nVelocità Proiettile: 1,140 m/s  |  Portata: 3.6 km\nConsumo Energia: 2 PU/s\nHP Componente: 3,050\nSignatures:  EM: 900  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKRIG_BallisticGatling_S2=Produttore: Kruger Intergalactic\nTipo di articolo: Ballistic Gatling\nDimensione: 2\n\nUna variante personalizzata della linea di cannoni rotanti Tigerstrike di Kruger Intergalactic, questa potente pistola è stata progettata in collaborazione con il team che lavora sul P-52 Merlin per assicurati che si adatti perfettamente alle linee aggraziate dello scafo di un caccia leggero, pur continuando a fornire rapidamente colpi dopo colpi con l'affidabilità che ci si aspetta da un'arma Kruger.\n\n--- STATISTICHE ---\nPeso: 26.7 kg\nCadenza di Fuoco: 1,200 RPM\nFire Modalità: Auto\nDanno Alpha: 22.5 (Phys)  |  DPS: 450.0\nAmmo: 4,626\nVelocità Proiettile: 1,346 m/s  |  Portata: 2.2 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 27  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKRIG_LaserCannon_S3=Produttore: Kruger Intergalactic\nTipo di articolo: Cannone laser\nTaglia: 3\n\nRealizzato con parti di precisione forgiate con tolleranze estremamente strette, progettato per una gestione del calore di altissimo livello e assemblato per superare tutti gli standard del settore, il cannone laser automatico Quarreler è stato creato da Kruger Intergalactic per una vera affidabilità difensiva.\n\n--- STATISTICHE ---\nPeso: 400.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 218.7 (Energy)  |  DPS: 546.8\nAmmo: 25\nRegen: 3,375/s  |  Cooldown: 1.8s  |  Cost/Shot: 202\nVelocità Proiettile: 1,184 m/s  |  Portata: 2.4 km\nConsumo Energia: 2 PU/s\nHP Componente: 2,850\nSignatures:  EM: 649  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKRIG_Wolf_BallisticGatling_S4=Produttore: Kruger Intergalactic\nTipo: Gatling Balistica\nTaglia: 4\n\nI nemici si pentiranno d'essersi avvicinati al L-21 Wolf e alla sua speciale gatling Relentless L-21. La sapiente ingegneria della Kruger permette a questo cannone rotante di sparare proiettili a una velocità da capogiro con poche probabilità di inceppamento.\n\n--- STATISTICHE ---\nPeso: 380.0 kg\nCadenza di Fuoco: 950 RPM\nFire Modalità: Auto\nDanno Alpha: 63.0 (Phys)  |  DPS: 997.5\nAmmo: 4,200\nVelocità Proiettile: 1,296 m/s  |  Portata: 2.8 km\nConsumo Energia: 0 PU/s\nHP Componente: 2,000\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKRIG_Wolf_LaserRepeater_S4=Produttore: Kruger Intergalactic\nTipo Oggetto: Ripetitore Laser\nDimensione: 4\n\nIl design meticoloso rende l'Axiom L-22 un armamento ideale per la L-22 Alpha Wolf. Parti premium e produzione all'avanguardia hanno creato un ripetitore laser fatto per prosperare nel vivo della battaglia.\n\n--- STATISTICHE ---\nPeso: 280.0 kg\nCadenza di Fuoco: 750 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 85.0 (Energy)  |  DPS: 1,062.5\nAmmo: 75\nRegen: 4,544/s  |  Cooldown: 0.2s  |  Cost/Shot: 73\nVelocità Proiettile: 1,440 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,650\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKRON_LaserCannon_S1=Produttore: Kroneg\nTipo di elemento: cannone laser\nTaglia: 1\n\nInfliggi ingenti danni a distanza con la linea FL di cannoni laser di Kroneg. L'FL-11 potrebbe sparare lentamente ma fornisce una potenza di fuoco considerevole per un'arma di taglia uno.\n\n--- STATISTICHE ---\nPeso: 120.0 kg\nCadenza di Fuoco: 250 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 49.2 (Energy)  |  DPS: 205.2\nAmmo: 25\nRegen: 1,267/s  |  Cooldown: 1.6s  |  Cost/Shot: 52\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 408  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKRON_LaserCannon_S2=Produttore: Kroneg\nTipo di elemento: cannone laser\nDimensione: 2\n\nInfliggi ingenti danni a distanza con la linea FL di cannoni laser di Kroneg. L'FL-22 di taglia due brilla a medio e lungo raggio grazie a un design che riduce al minimo la riduzione dei danni.\n\n--- STATISTICHE ---\nPeso: 300.0 kg\nCadenza di Fuoco: 250 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 74.0 (Energy)  |  DPS: 308.5\nAmmo: 25\nRegen: 1,904/s  |  Cooldown: 1.7s  |  Cost/Shot: 79\nVelocità Proiettile: 1,196 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 545  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescKRON_LaserCannon_S3=Produttore: Kroneg\nTipo di elemento: cannone laser\nDimensione: 3\n\nInfliggi ingenti danni a distanza con la linea FL di cannoni laser di Kroneg. Incarnando la filosofia di progettazione pratica di Kroneg, l'FL-33 rimane uno dei cannoni laser di dimensione tre più affidabili e distruttivi attualmente disponibili.\n\n--- STATISTICHE ---\nPeso: 750.0 kg\nCadenza di Fuoco: 250 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 110.8 (Energy)  |  DPS: 461.7\nAmmo: 25\nRegen: 2,850/s  |  Cooldown: 1.8s  |  Cost/Shot: 118\nVelocità Proiettile: 1,184 m/s  |  Portata: 2.4 km\nConsumo Energia: 2 PU/s\nHP Componente: 1,024\nSignatures:  EM: 681  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescMISL_S01_CS_FSKI_Spark=Produttore: Firestorm Kinetics\nSegnale di tracciamento: sezione trasversale\nDimensione: 1\n\nColoro che credono che le dimensioni non contino farebbero bene a stare alla larga dalla Firestorm Kinetics Spark. Usando il targeting a sezione trasversale, questo leggero missile di prossimità ha una potenza considerevole.\n\n--- STATISTICHE ---\nPeso: 63.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S01_EM_BEHR_Pioneer=Produttore: Behring\nSegnale di tracciamento: elettromagnetico\nDimensione: 1\n\nBehring è orgoglioso dell'affidabilità e Pioneer non fa eccezione. Il sistema di tracciamento aggiornato Oracle EM si è dimostrato più volte efficace in numerosi rapporti di test condotti dai consumatori contro missili di prossimità di classe simile.\n\n--- STATISTICHE ---\nPeso: 51.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S01_EM_THCN_TaskForce=Produttore: Thermyte Concern\nSegnale di tracciamento: elettromagnetico\nDimensione: 1\n\nAvventurandosi nel mercato delle armi, Thermyte Concern ha unito la sua vasta conoscenza degli esplosivi da demolizione per creare la Task Force. Un leggero missile d'attacco con tracciamento EM con un sistema di propulsione di prima classe fornisce un'efficace combinazione di velocità e potenza di fuoco per stabilire il dominio sul campo di battaglia.\n\n--- STATISTICHE ---\nPeso: 25.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S01_IR_BEHR_Marksman=Produttore: Behring\nSegnale di tracciamento: infrarossi\nDimensione: 1\n\nLa serie di missili di prossimità Marksman di Behring si è guadagnata la stessa reputazione per la sua capacità di tracciare un'ampia gamma di tracce di calore così come per i suoi danni di prossimità ad effetto area.\n\n--- STATISTICHE ---\nPeso: 56.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S01_IR_VNCL_Arrow=Produttore: Vanduul\nSegnale di tracciamento: infrarossi\nDimensione: 1\n\nCommconosciuto solo con la sua designazione militare, il Arrow è un piccolo missile d'attacco a infrarossi che è diventato un pilastro dell'armeria Vanduul.\n\n--- STATISTICHE ---\nPeso: 70.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S02_CS_FSKI_Tempest=Produttore: Firestorm Kinetics\nSegnale di tracciamento: sezione trasversale\nDimensione: 2\n\nLa Tempesta è stata progettata pensando solo all'annientamento. Utilizzando la tecnologia di puntamento di FireStorm Kinetics, questo missile di prossimità si aggancia alla sezione trasversale del bersaglio per portare i conflitti a una rapida conclusione.\n\n--- STATISTICHE ---\nPeso: 121.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S02_CS_THCN_StrikeForce=Produttore: Thermyte Concern\nSegnale di tracciamento: sezione trasversale\nDimensione: 2\n\nLo StrikeForce è l'ultimo culmine dell'espansione di Thermyte Concern nel settore missilistico, mostrando notevoli miglioramenti nel design e nel targeting della sezione trasversale.\n\n--- STATISTICHE ---\nPeso: 72.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S02_EM_TALN_Dominator=Produttore: Talon\nSegnale di tracciamento: elettromagnetico\nDimensione: 2\n\nProgettato per tracciare la firma elettromagnetica di un avversario, il missile d'attacco Dominator è un pacchetto di ordigni di precisione progettato per stabilire il dominio tattico sul campo di battaglia.\n\n--- STATISTICHE ---\nPeso: 136.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S02_IR_FSKI_Ignite=Produttore: Firestorm Kinetics\nSegnale di tracciamento: infrarossi\nDimensione: 2\n\nL'Ignite è il marchio principale di Firestorm di missili d'attacco a ricerca di calore che è la definizione di Fire and Forget. Lascialo semplicemente volare e goditi lo spettacolo.\n\n--- STATISTICHE ---\nPeso: 113.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S02_IR_NOVP_Rattler=Produttore: Nova Pyrotechnica\nSegnale di tracciamento: infrarossi\nDimensione: 2\n\nIl Rattler è un missile a grappolo conveniente che piacerà senza dubbio a un'ampia varietà di piloti. Quando viene sparato, il Rattler traccia la firma IR dell'avversario e crea uno sbarramento iniziale che indebolisce l'armatura o gli scudi, lasciando il bersaglio vulnerabile all'intero carico utile che segue.\n\n--- STATISTICHE ---\nPeso: 133.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S02_IR_VNCL_Bullet=Produttore: Vanduul\nSegnale di tracciamento: infrarossi\nDimensione: 2\n\nI piloti della Marina hanno sviluppato un sano rispetto per questo missile d'attacco Vanduul con puntamento a infrarossi, formalmente designato Bullet.\n\n--- STATISTICHE ---\nPeso: 113.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S03_CS_FSKI_Arrester=Produttore: Firestorm Kinetics\nSegnale di tracciamento: sezione trasversale\nDimensione: 3\n\nUtilizzando il targeting della sezione trasversale per cacciare la preda, il missile di prossimità Firestorm Arrester elimina rapidamente i nemici intrappolati nel mirino.\n\n--- STATISTICHE ---\nPeso: 119.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S03_EM_FSKI_Thunderbolt=Produttore: Firestorm Kinetics\nSegnale di tracciamento: elettromagnetico\nDimensione: 3\n\nGrazie al telaio agile e al sistema di puntamento EM del Firestorm Thunderbolt, questo missile di prossimità è una scelta solida per un'ampia varietà di scenari di combattimento.\n\n--- STATISTICHE ---\nPeso: 119.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S03_IR_NOVP_Viper=Produttore: Nova Pyrotechnica\nSegnale di tracciamento: infrarossi\nDimensione: 3\n\nNova ha lavorato duramente per garantire che il suo missile d'attacco Viper con tracciamento a infrarossi fosse all'altezza del suo nome fornendo attacchi agili e letali contro obiettivi ostili.\n\n--- STATISTICHE ---\nPeso: 189.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S03_IR_VNCL_Chaos=Produttore: Vanduul\nSegnale di tracciamento: infrarossi\nDimensione: 3\n\nGli istruttori di volo navali spesso includono il missile d'attacco Chaos a ricerca di calore nelle simulazioni di attacco Vanduul citando che la sua velocità e forza danno alle nuove reclute il giusto rispetto per il nemico che saranno affrontare.\n\n--- STATISTICHE ---\nPeso: 171.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S04_CS_TALN_Assailant=Produttore: Talon\nSegnale di tracciamento: sezione trasversale\nDimensione: 4\n\nIl missile Assailant di Talon è un'arma perfetta per attacchi di precisione contro avversari motivati.\n\n--- STATISTICHE ---\nPeso: 224.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S04_EM_TALN_Raptor=Produttore: Talon\nSegnale di tracciamento: elettromagnetico\nDimensione: 4\n\nUtilizzando un tracciamento elettromagnetico avanzato e un volo di precisione bilanciato, il missile d'assalto Talon Raptor è una potente aggiunta all'arsenale di qualsiasi nave.\n\n--- STATISTICHE ---\nPeso: 221.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S04_IR_BEHR_Pathfinder=Produttore: Behring\nSegnale di tracciamento: infrarossi\nDimensione: 4\n\nIl missile di prossimità Pathfinder è stato un membro coerente del già robusto arsenale di Behring grazie al suo sistema di propulsione collaudato e testato e al sistema di guida a ricerca di calore.\n\n--- STATISTICHE ---\nPeso: 203.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S04_IR_VNCL_Dragon=Produttore: Vanduul\nSegnale di tracciamento: infrarossi\nDimensione: 4\n\nDesignato il Drago, questo missile d'attacco con tracciamento a infrarossi Vanduul ha una reputazione spaventosa guadagnata con il numero di navi navali distrutte attribuite al suo potere distruttivo.\n\n--- STATISTICHE ---\nPeso: 212.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescMISL_S05_CS_TALN_Stalker=Produttore: Talon\nSegnale di tracciamento: sezione trasversale\nDimensione: 5\n\nCon il tracciamento della sezione trasversale dedicato, il Talon Stalker ha resistito negli anni come siluro d'attacco di precisione con il massimo potere frenante.\n\n--- STATISTICHE ---\nPeso: 303.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescMISL_S05_EM_TALN_Reaper=Produttore: Talon\nSegnale di tracciamento: elettromagnetico\nDimensione: 5\n\nIl siluro d'attacco dei Razziatori è dotato di un favorevole rapporto resa/spesa distruttiva e di una collaudata suite di tracciamento EM Talon.\n\n--- STATISTICHE ---\nPeso: 326.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescMISL_S05_EM_TALN_Scimitar=Produttore: Talon\nSegnale di tracciamento: elettromagnetico\nDimensione: 5\n\nIl missile Scimitar traccia i bersagli tramite la loro firma EM per fornire un devastante carico utile di dimensione cinque.\n\n--- STATISTICHE ---\nPeso: 314.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescMISL_S05_IR_TALN_Valkyrie=Produttore: Talon\nSegnale di tracciamento: infrarossi\nDimensione: 5\n\nIl team di progettazione dei torpedo di Talon ha fatto tutto il possibile per il loro ultimo siluro d'attacco Valkyrie creando una soluzione di spinta multilivello con funzionalità di tracciamento a infrarossi all'avanguardia.\n\n--- STATISTICHE ---\nPeso: 314.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescMISL_S07_IR_TALN_Hellion=Produttore: Talon\nSegnale di tracciamento: infrarossi\nDimensione: 7\n\nTrasportando un carico utile considerevole e una suite avanzata di sensori a ricerca di calore, il missile Hellion di Talon può essere efficace contro aggressori di tutte le dimensioni.\n\n--- STATISTICHE ---\nPeso: 452.0 kg\nHP Componente: 200\nTemp. Surriscaldamento: 450K
item_DescMISL_S09_CS_TALN_Argos=Produttore: Talon\nSegnale di tracciamento: sezione trasversale\nDimensione: 9\n\nIl siluro d'attacco Talon Argos presenta un design classico e semplice che si basa su rigorosi standard di produzione e un classico sistema di mira a sezione trasversale.\n\n--- STATISTICHE ---\nPeso: 449.0 kg\nHP Componente: 1,000\nTemp. Surriscaldamento: 450K
item_DescMISL_S09_CS_TALN_Argos_2=item_NameMISL_S09_CS_TALN_Argos_2
item_DescMISL_S09_EM_TALN_Seeker=Produttore: Talon\nSegnale di tracciamento: elettromagnetico\nDimensione: 9\n\nIl siluro Seeker di Talon è un siluro di precisione con puntamento EM in grado di trasportare un enorme carico utile in modo rapido e accurato.\n\n--- STATISTICHE ---\nPeso: 447.0 kg\nHP Componente: 667\nTemp. Surriscaldamento: 450K
item_DescMISL_S09_IR_TALN_Typhoon=Produttore: Talon\nSegnale di tracciamento: infrarossi\nDimensione: 9\n\nProgettato da Talon, il siluro d'attacco a ricerca di calore Typhoon fornisce un carico utile pesante che sicuramente fungerà da deterrente contro qualsiasi ulteriore azione ostile.\n\n--- STATISTICHE ---\nPeso: 452.0 kg\nHP Componente: 667\nTemp. Surriscaldamento: 450K
item_DescMISL_S10_CS_BEHR_Executor=Produttore: Behring \n Segnale di tracciamento: sezione trasversale \n Dimensioni: 10 \n \n Behring è orgoglioso dell'ordinanza di creazione che è affidabile quanto potente e l'esecutore ex-t10 "non fa eccezione. Progettato come un'arma anti-nave e anti-installazione, gli ingegneri di Behring hanno lavorato instancabilmente per garantire che questo siluro fosse una dichiarazione strategica audace.\n\n--- STATISTICHE ---\nPeso: 855.0 kg\nHP Componente: 667\nTemp. Surriscaldamento: 450K
item_DescMISL_S10_CS_TALN_Vanquisher=Produttore: Talon \n Segnale di tracciamento: sezione trasversale \n Dimensioni: 10 \n \n Progettato da Talon, il calore di Vanquisher in cerca di Torpedo di Strike offre un pesante payload che fungerà da deterrente da eventuali ulteriori azioni ostili.\n\n--- STATISTICHE ---\nPeso: 905.0 kg\nHP Componente: 667\nTemp. Surriscaldamento: 450K
