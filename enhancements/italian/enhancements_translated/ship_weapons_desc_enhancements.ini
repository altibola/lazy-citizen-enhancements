item_DescBEHR_BallisticGatling_SF7B_S7=Produttore: Behring\nTipo di oggetto: Gatling balistico\nDimensione: 7\n\nColpiscilo con la grande astronave e distruggi rapidamente le navi più piccole con il Gatling balistico SF7B. Costruita appositamente per l'Ares Inferno Star Fighter, l'arma si integra perfettamente nel corpo della nave. L'impressionante cadenza di fuoco dell'arma scatena proiettili ad alta densità che squarciano armature e scudi, rendendola la scelta perfetta per le situazioni in cui la saturazione del bersaglio è fondamentale.\n\n--- STATISTICHE ---\nPeso: 5860.0 kg\nCadenza di Fuoco: 900 RPM\nFire Modalità: Auto\nDanno Alpha: 292.0 (Phys)  |  DPS: 4,380.0\nAmmo: 2,994\nVelocità Proiettile: 1,179 m/s  |  Portata: 7.3 km\nConsumo Energia: 0 PU/s\nHP Componente: 6,750\nSignatures:  EM: 36  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticRepeater_S1=Produttore: Behring\nTipo di articolo: ripetitore balistico\nDimensione: 1\n\nSparando da due canne, il "Buzzsaw" SW16BR1 può sopraffare gli aggressori a distanza medio-ravvicinata. La maestria artigianale di Behring consente all'arma di impegnarsi in scontri a fuoco prolungati prima di aver bisogno di un tempo di recupero, rendendolo un eccellente ripetitore balistico entry level.\n\n--- STATISTICHE ---\nPeso: 36.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 36.0 (Phys)  |  DPS: 300.0\nAmmo: 2,664\nVelocità Proiettile: 1,500 m/s  |  Portata: 2.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 525\nSignatures:  EM: 40  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticRepeater_S2=Produttore: Behring\nTipo di articolo: ripetitore balistico\nTaglia: 2\n\nIl Sawbuck SW16BR2 è il contributo di Behring al mercato in espansione dei ripetitori balistici. La sua configurazione a doppia canna a fuoco sequenziale offre un'efficace via di mezzo per gli operatori che cercano una cadenza di fuoco più elevata rispetto a un cannone, ma senza il timore di surriscaldamento che si otterrebbe con un gatling.\n\n--- STATISTICHE ---\nPeso: 90.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 54.0 (Phys)  |  DPS: 450.0\nAmmo: 2,637\nVelocità Proiettile: 1,495 m/s  |  Portata: 2.2 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 40  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticRepeater_S3=Produttore: Behring\nTipo di articolo: ripetitore balistico\nTaglia: 3\n\nFatti strada fuori dai guai con questo ripetitore balistico Behring taglia tre. Il "Shredder" SW16BR3 distribuisce il calore su entrambe le canne per mantenerlo attivo quando più necessario. Il raggruppamento dei colpi dell'arma e la riduzione del danno la rendono estremamente letale a distanza media o ravvicinata.\n\n--- STATISTICHE ---\nPeso: 225.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 81.0 (Phys)  |  DPS: 675.0\nAmmo: 2,589\nVelocità Proiettile: 1,480 m/s  |  Portata: 2.4 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,024\nSignatures:  EM: 40  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_BallisticRepeater_VNG_S2=Produttore: Behring\nTipo di articolo: ripetitore balistico\nDimensione: 2\n\nSolo i proprietari di Vanguard possono equipaggiare questa versione unica della linea di ripetitori balistici di Behring sul muso della loro nave. Il BRVS è attentamente calibrato in modo che la sua raffica balistica possa sparare abbastanza velocemente da fornire la massima saturazione del bersaglio, mentre il suo sistema di ventilazione migliorato riduce il frequente surriscaldamento.\n\n--- STATISTICHE ---\nPeso: 90.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 54.0 (Phys)  |  DPS: 450.0\nAmmo: 2,637\nVelocità Proiettile: 1,495 m/s  |  Portata: 2.2 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 40  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_DistortionCannon_VNG_S2=Produttore: Behring\nTipo di oggetto: Cannone a distorsione\nDimensione: 2\n\nDisabilita le navi senza danneggiare l'equipaggio o il carico con l'EVSD di Behring. Questo cannone distorsore presenta in gran parte la stessa tecnologia leader del settore utilizzata in altre armi Behring, ma è specificamente progettato per essere montato sul muso di un Aegis Vanguard.\n\n--- STATISTICHE ---\nPeso: 360.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 81.0 (Distort)  |  DPS: 202.5\nAmmo: 25\nRegen: 1,125/s  |  Cooldown: 1.4s  |  Cost/Shot: 90\nVelocità Proiettile: 1,076 m/s  |  Portata: 1.6 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 594  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_DistortionRepeater_VNG_S2=Produttore: Behring\nTipo di elemento: Ripetitore di distorsione\nDimensione: 2\n\nConfusione con l'impianto elettrico di un aggressore con l'ATVS di Behring. Questo ripetitore di distorsione dirompente e non letale è compatibile solo con il montaggio sul muso del Aegis Vanguard.\n\n--- STATISTICHE ---\nPeso: 90.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 27.0 (Distort)  |  DPS: 225.0\nAmmo: 75\nRegen: 1,125/s  |  Cooldown: 0.5s  |  Cost/Shot: 27\nVelocità Proiettile: 1,346 m/s  |  Portata: 1.3 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 243  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_S1=Produttore: Behring\nTipo di articolo: cannone laser\nDimensione: 1\n\nL'M3A è il cannone laser entry level di Behring. La configurazione del cannone automatico offre danni modesti per proiettile e una cadenza di fuoco piuttosto bassa. Essendo l'offerta più basilare nella gamma di armi di Behring, presenta un basso consumo energetico, ma una scarsa efficienza energetica. Compensa i suoi difetti essendo economico, una caratteristica che molti piloti cercano quando equipaggiano le loro navi con un budget limitato.\n\n--- STATISTICHE ---\nPeso: 144.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 182.2 (Energy)  |  DPS: 303.8\nAmmo: 25\nRegen: 1,867/s  |  Cooldown: 0.8s  |  Cost/Shot: 112\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 348  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_S1_CleanAir=Produttore: Behring\nTipo di Oggetto: Cannone Laser\nTaglia: 1\n\nL'M3A è l'autocannone laser entry-level di Behring. La configurazione autocannone offre un danno modesto per proiettile e un rateo di fuoco piuttosto basso. Come offerta base della linea di armi Behring, presenta un basso consumo energetico, ma una scarsa efficienza energetica. Recupera terreno per le sue carenze essendo economico, una caratteristica che molti piloti cercano quando equipaggiano le loro navi con un budget limitato.\n\nL'edizione Defense Division presenta una livrea mimetica urbana grigia ed è stata donata a coloro che hanno assistito la Defense Division di Alliance Aid durante il periodo di necessità di Levski.\n\n--- STATISTICHE ---\nPeso: 144.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 182.2 (Energy)  |  DPS: 303.8\nAmmo: 25\nRegen: 1,867/s  |  Cooldown: 0.8s  |  Cost/Shot: 112\nVelocità Proiettile: 1,200 m/s  |  Portata: 2.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 348  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_S2=Produttore: Behring\nTipo di articolo: cannone laser\nDimensione: 2\n\nL'M4A è il cannone automatico laser di secondo livello di Behring. Le sue dimensioni più grandi significano un maggiore consumo energetico in cambio di una potenza maggiore. La velocità di fuoco e l'efficienza energetica sono paragonabili al modello M3A.\n\n--- STATISTICHE ---\nPeso: 360.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 273.4 (Energy)  |  DPS: 455.6\nAmmo: 25\nRegen: 2,815/s  |  Cooldown: 0.8s  |  Cost/Shot: 168\nVelocità Proiettile: 1,196 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 495  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_S2_CleanAir=Produttore: Behring\nTipo di Oggetto: Cannone Laser\nTaglia: 2\n\nL'M4A è l'autocannone laser entry-level di Behring. La configurazione autocannone offre un danno modesto per proiettile e un rateo di fuoco piuttosto basso. Come offerta base della linea di armi Behring, presenta un basso consumo energetico, ma una scarsa efficienza energetica. Recupera terreno per le sue carenze essendo economico, una caratteristica che molti piloti cercano quando equipaggiano le loro navi con un budget limitato.\n\nL'edizione Defense Division presenta una livrea mimetica urbana grigia ed è stata donata a coloro che hanno assistito la Defense Division di Alliance Aid durante il periodo di necessità di Levski.\n\n--- STATISTICHE ---\nPeso: 360.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 273.4 (Energy)  |  DPS: 455.6\nAmmo: 25\nRegen: 2,815/s  |  Cooldown: 0.8s  |  Cost/Shot: 168\nVelocità Proiettile: 1,196 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 495  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescBEHR_LaserCannon_S3=Produttore: Behring\nTipo di elemento: Cannone laser\nDimensione: 3\n\nQuando vengono progettati cannoni automatici a energia, l'M5A di Behring fornisce lo standard rispetto al quale vengono misurati, grazie alla sua lunga portata di ingaggio e al basso danno causato.\n\n--- STATISTICHE ---\nPeso: 900.0 kg\nCadenza di Fuoco: 100 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 410.2 (Energy)  |  DPS: 683.6\nAmmo: 25\nRegen: 4,220/s  |  Cooldown: 1.3s  |  Cost/Shot: 253\nVelocità Proiettile: 1,184 m/s  |  Portata: 2.4 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,024\nSignatures:  EM: 644  |  IR: 0\nTemp. Surriscaldamento: 450K
