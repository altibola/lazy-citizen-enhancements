item_DescGATS_BallisticGatling_S1=Produttore: Gallenson Tactical Systems\nTipo di articolo: Ballistic Gatling\nTaglia: 1\n\nAnche se la GT-210 YellowJacket può essere piccola, racchiude una potente puntura. Quest'arma balistica ad alta velocità è perfetta per prendere di mira bersagli più piccoli e mobili e il suo sistema di rifornimento di munizioni DTX-8 elimina quasi completamente gli inceppamenti dell'arma dovuti a proiettili sbagliati.\n\n--- STATISTICHE ---\nPeso: 24.0 kg\nCadenza di Fuoco: 1,600 RPM\nFire Modalità: Auto\nDanno Alpha: 7.6 (Phys)  |  DPS: 201.6\nAmmo: 4,440\nVelocità Proiettile: 1,350 m/s  |  Portata: 2.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 550\nSignatures:  EM: 36  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGATS_BallisticGatling_S2=Produttore: Gallenson Tactical Systems\nTipo di articolo: Ballistic Gatling\nDimensione: 2\n\nLo Scorpion GT-215 è un cannone rotante di tipo Gatling ad azionamento idraulico progettato per fornire proiettili più piccoli a una velocità di fuoco molto elevata. Lo Scorpion è progettato per distruggere l'armatura su bersagli molto veloci, sacrificando la potenza per la saturazione assoluta dell'area bersaglio.\n\n--- STATISTICHE ---\nPeso: 60.0 kg\nCadenza di Fuoco: 1,600 RPM\nFire Modalità: Auto\nDanno Alpha: 12.7 (Phys)  |  DPS: 338.7\nAmmo: 4,410\nVelocità Proiettile: 1,346 m/s  |  Portata: 2.2 km\nConsumo Energia: 0 PU/s\nHP Componente: 850\nSignatures:  EM: 36  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGATS_BallisticGatling_S3=Produttore: Gallenson Tactical Systems\nTipo di elemento: Ballistic Gatling\nDimensione: 3\n\nIl Mantis GT-220 è un cannone rotante di tipo Gatling ad azionamento idraulico progettato per fornire proiettili più piccoli a una velocità di fuoco molto elevata. Il Mantis è progettato per distruggere l'armatura su bersagli molto veloci, sacrificando la potenza per la saturazione assoluta dell'area del bersaglio.\n\n--- STATISTICHE ---\nPeso: 150.0 kg\nCadenza di Fuoco: 1,600 RPM\nFire Modalità: Auto\nDanno Alpha: 19.0 (Phys)  |  DPS: 506.7\nAmmo: 4,314\nVelocità Proiettile: 1,332 m/s  |  Portata: 2.4 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,500\nSignatures:  EM: 36  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGLSN_BallisticGatling_S4=Produttore: Sconosciuto\nTipo oggetto: Gatling Balistico\nDimensione: 4\n\nMentre le esatte origini e il designer sono sconosciuti, il Breakneck è costruito su un gatling balistico esistente e poi modificato per causare più caos. Quando il Breakneck inizia a sparare, il divertimento ha inizio.\n\n--- STATISTICHE ---\nPeso: 350.0 kg\nCadenza di Fuoco: 1,100 RPM\nFire Modalità: Auto\nDanno Alpha: 52.0 (Phys)  |  DPS: 953.3\nAmmo: 10,500\nVelocità Proiettile: 1,296 m/s  |  Portata: 2.8 km\nConsumo Energia: 0 PU/s\nHP Componente: 1,800\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGLSN_LaserRepeater_S3=Produttore: Sconosciuto\nTipo oggetto: Laser Repeater\nDimensione: 3\n\nBrucia e incenerisci coloro che osano mettersi sulla tua strada con il Tormenter. Rielaborato da un Laser Repeater esistente, il Tormenter riesce in qualche modo a scatenare una vera e propria tempesta di fuoco senza fondere la canna dell'arma.\n\n--- STATISTICHE ---\nPeso: 200.0 kg\nCadenza di Fuoco: 850 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 39.5 (Energy)  |  DPS: 559.6\nAmmo: 75\nRegen: 3,031/s  |  Cooldown: 0.2s  |  Cost/Shot: 48\nVelocità Proiettile: 1,480 m/s  |  Portata: 1.9 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,200\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGMISL_S01_CS_FSKI_Spark=Produttore: Firestorm Kinetics \nSegnale di Tracciamento: Sezione Trasversale \nTaglia: 1 \n\nColoro che credono che le dimensioni non contino farebbero bene a stare lontani dal Firestorm Kinetics Spark. Utilizzando il puntamento a sezione trasversale, questo leggero missile di prossimità sferra un colpo considerevole. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 63.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S01_EM_BEHR_Pioneer=Produttore: Behring \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 1 \n\nBehring è orgogliosa della sua affidabilità e il Pioneer non fa eccezione. Il sistema di tracciamento EM Oracle aggiornato si è dimostrato valido più volte in numerosi rapporti di test dei consumatori contro missili di prossimità di classe simile. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 51.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S01_EM_THCN_TaskForce=Produttore: Thermyte Concern \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 1 \n\nAvventurandosi nel mercato delle armi, la Thermyte Concern ha messo a frutto la sua vasta conoscenza degli esplosivi da demolizione per creare il TaskForce. Un missile leggero a ricerca EM con un sistema di propulsione top di gamma fornisce un mix efficiente di velocità e potenza di fuoco per stabilire il dominio sul campo di battaglia. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 25.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S01_IR_BEHR_Marksman=Produttore: Behring \nSegnale di Tracciamento: Infrarosso \nTaglia: 1 \n\nLa serie di missili di prossimità Marksman di Behring si è guadagnata la reputazione sia per la sua capacità di tracciare una vasta gamma di firme termiche sia per il suo danno di prossimità ad effetto d'area. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 56.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S02_CS_FSKI_Tempest=Produttore: Firestorm Kinetics \nSegnale di Tracciamento: Sezione Trasversale \nTaglia: 2 \n\nIl Tempest è stato progettato pensando a nient'altro che all'annientamento. Utilizzando la tecnologia di puntamento di FireStorm Kinetics, questo missile di prossimità si aggancia alla sezione trasversale di un bersaglio per portare i conflitti a una rapida conclusione. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 121.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S02_CS_THCN_StrikeForce=Produttore: Thermyte Concern \nSegnale di Tracciamento: Sezione Trasversale \nTaglia: 2 \n\nLo StrikeForce è l'ultimo culmine dell'espansione di Thermyte Concern nell'industria missilistica, mettendo in mostra notevoli miglioramenti nel design e nel puntamento della sezione trasversale. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 72.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S02_EM_TALN_Dominator=Produttore: Talon \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 2 \n\nProgettato per tracciare la firma elettromagnetica di un avversario, il missile strike Dominator è un pacchetto di munizioni di precisione progettato per stabilire il dominio tattico sul campo di battaglia. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 136.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S02_IR_FSKI_Ignite=Produttore: Firestorm Kinetics \nSegnale di Tracciamento: Infrarosso \nTaglia: 2 \n\nL'Ignite è il marchio principale di missili strike a ricerca di calore di Firestorm, che rappresenta la definizione di "Lancia e Dimentica". Lascialo volare e goditi lo spettacolo. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 113.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S03_EM_FSKI_Thunderbolt=Produttore: Firestorm Kinetics \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 3 \n\nGrazie al telaio agile del Firestorm Thunderbolt e al sistema di puntamento EM, questo missile di prossimità è una scelta solida per un'ampia varietà di scenari di combattimento. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 449.0 kg\nHP Componente: 1,000\nTemp. Surriscaldamento: 450K
item_DescGMISL_S03_IR_NOVP_Viper=Produttore: Nova Pyrotechnica \nSegnale di Tracciamento: Infrarosso \nTaglia: 3 \n\nNova ha lavorato duramente per garantire che il suo missile strike Viper a ricerca infrarossa sia all'altezza del suo nome, sferrando attacchi agili e letali contro bersagli ostili. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 133.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S04_CS_TALN_Assailant=Produttore: Talon \nSegnale di Tracciamento: Sezione Trasversale \nTaglia: 4 \n\nIl missile Assailant della Talon è una soluzione d'arma perfetta per attacchi di precisione contro avversari motivati. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 224.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S04_IR_BEHR_Pathfinder=Produttore: Behring \nSegnale di Tracciamento: Infrarosso \nTaglia: 4 \n\nIl missile di prossimità Pathfinder è un membro costante del già robusto arsenale di Behring grazie al suo sistema di propulsione collaudato e alla sua serie di sensori a ricerca di calore. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 203.0 kg\nHP Componente: 25\nTemp. Surriscaldamento: 450K
item_DescGMISL_S05_CS_TALN_Stalker=Produttore: Talon \nSegnale di Tracciamento: Sezione Trasversale \nTaglia: 5 \n\nCon un tracciamento dedicato della sezione trasversale, il Talon Stalker ha resistito negli anni come siluro da attacco di precisione con il massimo potere d'arresto. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 303.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescGMISL_S05_EM_TALN_Reaper=Produttore: Talon \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 5 \n\nIl siluro strike Reaper presenta un favorevole rapporto tra resa distruttiva e costo, oltre a una comprovata suite di tracciamento EM Talon. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 326.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescGMISL_S05_EM_TALN_Scimitar=Produttore: Talon \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 5 \n\nIl missile Scimitar traccia i bersagli tramite la loro firma EM per consegnare un devastante carico utile di taglia cinque. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 314.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescGMISL_S05_IR_TALN_Valkyrie=Produttore: Talon \nSegnale di Tracciamento: Infrarosso \nTaglia: 5 \n\nIl team di progettazione siluri di Talon ha dato il massimo per il suo ultimo siluro strike Valkyrie, creando una soluzione di spinta a più livelli con capacità di tracciamento a infrarossi all'avanguardia. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 314.0 kg\nHP Componente: 50\nTemp. Surriscaldamento: 450K
item_DescGMISL_S07_IR_TALN_Hellion=Produttore: Talon \nSegnale di Tracciamento: Infrarosso \nTaglia: 7 \n\nTrasportando un carico utile considerevole e una suite avanzata di sensori a ricerca di calore, il missile Hellion di Talon può essere efficace contro aggressori di tutte le dimensioni. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 452.0 kg\nHP Componente: 200\nTemp. Surriscaldamento: 450K
item_DescGMISL_S09_CS_TALN_Argos=Produttore: Talon \nSegnale di Tracciamento: Sezione Trasversale \nTaglia: 9 \n\nIl siluro strike Talon Argos presenta un design classico e lineare che si affida a rigorosi standard di produzione e a un classico sistema di puntamento a sezione trasversale. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 449.0 kg\nHP Componente: 667\nTemp. Surriscaldamento: 450K
item_DescGMISL_S09_EM_TALN_Seeker=Produttore: Talon \nSegnale di Tracciamento: Elettromagnetico \nTaglia: 9 \n\nIl siluro Seeker di Talon è un siluro di precisione a puntamento EM in grado di consegnare un carico utile massiccio in modo rapido e accurato. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 447.0 kg\nHP Componente: 667\nTemp. Surriscaldamento: 450K
item_DescGMISL_S09_IR_TALN_Typhoon=Produttore: Talon \nSegnale di Tracciamento: Infrarosso \nTaglia: 9 \n\nProgettato da Talon, il siluro strike a ricerca termica Typhoon consegna un pesante carico utile che servirà sicuramente da deterrente per ulteriori azioni ostili. Nota: Questo missile può essere lanciato solo da veicoli terrestri.\n\n--- STATISTICHE ---\nPeso: 452.0 kg\nHP Componente: 667\nTemp. Surriscaldamento: 450K
item_DescGRIN_TractorBeam_002_shared=Produttore: Greycat Industrial\nTipo di articolo: Raggio traente\nAngolo massimo: 60°\nPortata massima: 150 m\nDistanza a piena resistenza: 75 m\n\nSupportato dalla garanzia Soft-Touch® certificata, il raggio traente SureGrip di Greycat, è un pilastro del suo catalogo prodotti grazie alla sua gamma e al suo controllo affidabili.\n\n--- STATISTICHE ---\nPeso: 100.0 kg\nFire Modalità: Tractor Beam\nAmmo: 0\nVelocità Proiettile: 0 m/s  |  Portata: 0 m\nConsumo Energia: 3 PU/s\nHP Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGRIN_TractorBeam_002_shared_UT1=Produttore: Greycat Industrial\nTipo di elemento: Raggio traente\nAngolo massimo: 60°\nPortata massima: 130 m\nDistanza a piena resistenza: 55 m\n\nQuesta variante per carichi pesanti del raggio traente SureGrip di Greycat sacrifica la portata in cambio di potenza aggiuntiva per gestire oggetti più grandi e pesanti. Di conseguenza, il dispositivo è più comunemente utilizzato in una varietà di applicazioni industriali dove la sua potenza aggiuntiva lo rende uno strumento essenziale.\n\n--- STATISTICHE ---\nPeso: 100.0 kg\nFire Modalità: Tractor Beam\nAmmo: 0\nVelocità Proiettile: 0 m/s  |  Portata: 0 m\nConsumo Energia: 3 PU/s\nHP Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGRIN_TractorBeam_002_shared_UT2=Produttore: Greycat Industrial\nAngolo massimo: 80°\nPortata massima: 130 m\nDistanza a piena forza: 55 m\n\nQuesta variante di precisione del raggio traente SureGrip di Greycat sacrifica parte della potenza e della portata del modello base in cambio per un angolo di manipolazione più ampio e una maggiore presa del cavo, rendendo molto più difficile perdere la presa di un oggetto. Questa precisione rende questo modello uno strumento essenziale per qualsiasi impresa che richieda un'attenta gestione.\n\n--- STATISTICHE ---\nPeso: 100.0 kg\nFire Modalità: Tractor Beam\nAmmo: 0\nVelocità Proiettile: 0 m/s  |  Portata: 0 m\nConsumo Energia: 3 PU/s\nHP Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGRIN_TractorBeam_003_shared=Produttore: Greycat Industrial\nTipo di elemento: Raggio traente\nAngolo massimo: 80°\nPortata massima: 135 m\nDistanza a piena resistenza: 50 m\n\nIl raggio traente ViseLock è un'evoluzione della tecnologia standard del settore Greycat, con aggiunti miglioramenti specificamente destinati ad aiutare le forze di sicurezza a contenere i loro obiettivi. Nel suo design, Greycat ha sacrificato parte della forza di tenuta a distanze maggiori per ottenere un legame più potente da cui è più difficile sfuggire.\n\n--- STATISTICHE ---\nPeso: 100.0 kg\nFire Modalità: Tractor Beam\nAmmo: 0\nVelocità Proiettile: 0 m/s  |  Portata: 0 m\nConsumo Energia: 3 PU/s\nHP Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGRIN_TractorBeam_004_S3=Produttore: Greycat Industrial\nTipo di articolo: Trave da traino\nAngolo massimo: 160°\nPortata massima: 250 m\nDistanza a piena resistenza: 200 m\n\nLa scelta sicura delle squadre di recupero in tutto l'impero, la trave da traino SafeTow di Greycat Industrial vanta forza, potenza e controllo sufficienti per trasportare sia carichi pesanti che interi veicoli attraverso l'universo.\n\n--- STATISTICHE ---\nPeso: 100.0 kg\nFire Modalità: Tractor Beam\nAmmo: 0\nVelocità Proiettile: 0 m/s  |  Portata: 0 m\nConsumo Energia: 3 PU/s\nHP Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescGRIN_TractorBeam_S1=Produttore: Greycat industriale\nTipo di articolo: raggio traente\n\nL'ultima aggiunta di Greycat alla linea di raggi traenti testata sul campo è un'aggiunta affidabile al loro catalogo. A parte un rapporto tiro/tiro più efficiente, l'ultimo modello fa ben poco per migliorare rispetto ai modelli precedenti. SureGrip dispone di impostazioni per mirare ed estrarre qualsiasi cosa, dai frammenti di asteroidi ai membri dell'equipaggio alla deriva, supportati dalla garanzia Soft-Touch® certificata di Greycat.\n\n--- STATISTICHE ---\nPeso: 200.0 kg\nFire Modalità: Tractor Beam\nAmmo: 0\nVelocità Proiettile: 0 m/s  |  Portata: 0 m\nConsumo Energia: 4 PU/s\nHP Componente: 1,050\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_BallisticCannon_S7=Tipo di Oggetto: Torretta con Cannone Balistico\nProduttore: Hurston Dynamics\nTaglia: 7\n\nPorta la tua conquista nei cieli usando il cannone balistico Conqueror-7 di Hurston Dynamics. Costruiti su misura per la torretta dorsale dell'Aegis Idris, questi cannoni sono in grado di ingaggiare navi più grandi a distanza, terminando i combattimenti prima ancora che inizino.\n\n--- STATISTICHE ---\nPeso: 115.0 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 4,000.0 (Phys)  |  DPS: 3,333.3\nAmmo: 800\nVelocità Proiettile: 1,048 m/s  |  Portata: 9.1 km\nConsumo Energia: 0 PU/s\nHP Componente: 6,750\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserBeam_S10_Bespoke=Produttore: Hurston Dynamics\nTipo: Raggio Laser\nTaglia: 10\n\nCostruita in collaborazione con gli ingegneri di Aegis, quest'arma a raggio laser su misura di Hurston Dynamics è altamente precisa, conferendo alla Idris-K un'arma devastante nel suo arsenale.\n\n--- STATISTICHE ---\nAmmo: 60\nRegen: 1,700/s  |  Cooldown: 5.0s  |  Cost/Shot: 43\nVelocità Proiettile: 1,200 m/s  |  Portata: 8.0 km\nConsumo Energia: 1 PU/s\nHP Componente: 750,000\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserRepeater_S1=Produttore: Hurston Dynamics\nTipo di articolo: ripetitore laser\nTaglia: 1\n\nIl ripetitore laser Attrition-1 è dotato dell'esclusiva tecnologia a cascata di Hurston Dynamics che fornisce prestazioni migliorate mantenendo il fuoco laser prolungato. Il risultato è un'arma di taglia uno che premia un operatore abile.\n\n--- STATISTICHE ---\nPeso: 24.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 34.0 (Energy)  |  DPS: 198.3\nAmmo: 75\nRegen: 2,155/s  |  Cooldown: 0.7s  |  Cost/Shot: 37\nVelocità Proiettile: 1,500 m/s  |  Portata: 1.6 km\nConsumo Energia: 0 PU/s\nHP Componente: 524\nSignatures:  EM: 167  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserRepeater_S2=Produttore: Hurston Dynamics\nTipo di articolo: ripetitore laser\nTaglia: 2\n\nQuando la battaglia si sta surriscaldando, è allora che la tecnologia laser a cascata di Hurston Dynamics brilla davvero. Con il ripetitore Attrition-2 di dimensione due, un operatore può utilizzare esplosioni prolungate di fuoco laser per convertire il calore in eccesso in maggiori prestazioni dell'arma.\n\n--- STATISTICHE ---\nPeso: 60.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 55.0 (Energy)  |  DPS: 320.8\nAmmo: 75\nRegen: 3,232/s  |  Cooldown: 0.7s  |  Cost/Shot: 55\nVelocità Proiettile: 1,495 m/s  |  Portata: 1.7 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 223  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserRepeater_S3=Produttore: Hurston Dynamics\nTipo di articolo: ripetitore laser\nDimensione: 3\n\nInvece di limitare le prestazioni dell'arma per aumentare la stabilità, la tecnologia a cascata di Hurston Dynamics consente all'operatore di decidere. Sebbene il surriscaldamento sia un rischio, periodi più lunghi di fuoco prolungato con il ripetitore laser Attrition-3 aumenteranno le prestazioni poiché il calore in eccesso si traduce in una maggiore produzione di energia.\n\n--- STATISTICHE ---\nPeso: 150.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 86.0 (Energy)  |  DPS: 501.7\nAmmo: 75\nRegen: 4,853/s  |  Cooldown: 0.7s  |  Cost/Shot: 84\nVelocità Proiettile: 1,480 m/s  |  Portata: 1.9 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,024\nSignatures:  EM: 278  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserRepeater_S4=Produttore: Hurston Dynamics\nTipo di articolo: ripetitore laser\nTaglia: 4\n\nHurston Dynamics ha completamente integrato la sua tecnologia laser a cascata nella linea di ripetitori Attrition. L'Attrition-4 di taglia quattro non fa eccezione, poiché funziona al massimo delle prestazioni quando è vicino alla sua capacità termica massima.\n\n--- STATISTICHE ---\nPeso: 375.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 150.0 (Energy)  |  DPS: 875.0\nAmmo: 75\nRegen: 3,000/s  |  Cooldown: 0.8s  |  Cost/Shot: 125\nVelocità Proiettile: 1,440 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,650\nSignatures:  EM: 334  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserRepeater_S5=Produttore: Hurston Dynamics\nTipo di articolo: Ripetitore laser\nDimensione: 5\n\nPiù di un semplice ripetitore laser di dimensione cinque, l'Attrition-5 di Hurston Dynamics è dotato di una tecnologia a cascata avanzata per consentire all'arma miglioramenti significativi delle prestazioni quanto più a lungo sostiene la sua energia produzione.\n\n--- STATISTICHE ---\nPeso: 938.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 150.0 (Energy)  |  DPS: 875.0\nAmmo: 75\nRegen: 10,914/s  |  Cooldown: 0.8s  |  Cost/Shot: 187\nVelocità Proiettile: 1,390 m/s  |  Portata: 3.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 2,640\nSignatures:  EM: 390  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserRepeater_S6=Produttore: Hurston Dynamics\nTipo di articolo: ripetitore laser\nTaglia: 6\n\nCon la tecnologia a cascata di Hurston Dynamics, il ripetitore laser Attrition-6 massimizza il suo potenziale di combattimento. E' normale che le armi si surriscaldino quando vengono utilizzate pesantemente in combattimento, ma ciò che distingue questo ripetitore di dimensione sei è che l'energia termica si traduce direttamente in una maggiore forza offensiva.\n\n--- STATISTICHE ---\nPeso: 2340.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 505.4 (Energy)  |  DPS: 2,947.9\nAmmo: 75\nRegen: 16,377/s  |  Cooldown: 0.8s  |  Cost/Shot: 281\nVelocità Proiettile: 1,350 m/s  |  Portata: 4.8 km\nConsumo Energia: 1 PU/s\nHP Componente: 4,224\nSignatures:  EM: 446  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserScattergun_S1=Produttore: Hurston Dynamics\nTipo di elemento: Pistola a dispersione laser\nTaglia: 1\n\nGrazie all'integrazione della tecnologia a cascata laser di Hurston Dynamics, la pistola a dispersione Dominance-1 è in grado di infliggere danni maggiori quanto più la dimensione operativa di un'arma si avvicina al suo massimo capacità termica sicura.\n\n--- STATISTICHE ---\nPeso: 48.0 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 504.0 x8 (Energy)  |  DPS: 420.0\nAmmo: 75\nRegen: 1,867/s  |  Cooldown: 0.3s  |  Cost/Shot: 70\nVelocità Proiettile: 900 m/s  |  Portata: 999 m\nConsumo Energia: 1 PU/s\nHP Componente: 1,550\nSignatures:  EM: 248  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserScattergun_S2=Produttore: Hurston Dynamics\nTipo di articolo: pistola a dispersione laser\nTaglia: 2\n\nPiù duro è il combattimento, più difficile funziona la pistola a dispersione Dominance-2. Man mano che i suoi livelli termici aumentano, l'arma di taglia due della Hurston Dynamics è in grado di utilizzare la tecnologia a cascata per trasformare quel potenziale termico in un attacco ravvicinato ancora più letale.\n\n--- STATISTICHE ---\nPeso: 120.0 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 792.0 x8 (Energy)  |  DPS: 660.0\nAmmo: 75\nRegen: 2,933/s  |  Cooldown: 0.3s  |  Cost/Shot: 110\nVelocità Proiettile: 897 m/s  |  Portata: 1.1 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,550\nSignatures:  EM: 330  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_LaserScattergun_S3=Produttore: Hurston Dynamics\nTipo di articolo: pistola a dispersione laser\nTaglia: 3\n\nLa pistola a dispersione Dominance-3 di Hurston Dynamics mette in mostra la tecnologia a cascata del produttore di armi. Più l'operatore continua a sparare con l'arma di taglia tre, più sarà in grado di convertire il calore generato in attacchi sempre più devastanti.\n\n--- STATISTICHE ---\nPeso: 300.0 kg\nCadenza di Fuoco: 50 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 1,116.0 x8 (Energy)  |  DPS: 930.0\nAmmo: 75\nRegen: 4,133/s  |  Cooldown: 0.4s  |  Cost/Shot: 155\nVelocità Proiettile: 888 m/s  |  Portata: 1.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,550\nSignatures:  EM: 413  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_Nova_BallisticCannon_S5=Produttore: Hurston Dynamics\nTipo di elemento: Cannone balistico\nDimensione: 5\n\nProgettato appositamente per il carro armato Nova, il cannone balistico Slayer di Hurston Dynamics si è guadagnato la sua illustre reputazione attraverso innumerevoli scontri sul campo di battaglia durante la Seconda Guerra Tevarin. Questa bestia da campo eccelle contro bersagli corazzati e postazioni fortificate sparando colpi di artiglieria di grosso calibro con sorprendente precisione e velocità. Hurston ha lavorato a stretto contatto con Tumbril quando il produttore di carri armati ha deciso di riportare in produzione il Nova. Sebbene abbiano scrupolosamente onorato il design originale dello Slayer, Hurston lo ha anche aggiornato per il 30° secolo migliorando la velocità di rotazione, la resistenza al calore e il software associato per fornire un'interfaccia utente per cannonieri all'avanguardia.\n\n--- STATISTICHE ---\nPeso: 7500.0 kg\nCadenza di Fuoco: 12 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 13,500.0 (Phys)  |  DPS: 2,700.0\nAmmo: 363\nVelocità Proiettile: 973 m/s  |  Portata: 6.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 20,000\nSignatures:  EM: 50  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescHRST_Pyro_LaserRepeater_S1=Produttore: Hurston Dynamics\nTipo di articolo: Ripetitore laser\nDimensioni: 1\n\nQuesto ripetitore laser Ardor-1 è stato recuperato nel sistema Pyro. Prodotta per la prima volta nel 2724, la serie Ardor è diventata popolare per il suo design a canna divisa che aiutava a mitigare il calore durante il fuoco. Alla fine Hurston ha smesso di produrre l'arma in favore della linea Attrition di ripetitori laser. Nonostante gli effetti del tempo e dell'uso costante, l'arma è ancora ricercata per le prestazioni costanti fornite dal design esperto e dalla solida costruzione di Hurston Dynamic.\n\n--- STATISTICHE ---\nPeso: 24.0 kg\nCadenza di Fuoco: 350 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 36.0 (Energy)  |  DPS: 210.0\nAmmo: 75\nRegen: 1,875/s  |  Cooldown: 0.7s  |  Cost/Shot: 64\nVelocità Proiettile: 1,500 m/s  |  Portata: 1.6 km\nConsumo Energia: 0 PU/s\nHP Componente: 524\nSignatures:  EM: 167  |  IR: 0\nTemp. Surriscaldamento: 450K
