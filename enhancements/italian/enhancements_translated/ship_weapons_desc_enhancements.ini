item_Desc_HRST_Tiburon_S10_laserbeam=Produttore: Hurston Dynamics\nTipo: Raggio Laser\nDimensione: 10\n\nSviluppato di concerto con gli specialisti di armi della Aegis per far parte del loadout dedicato anti-nave ammiraglia del Tiburon, il Supremacy-10T combina la precisione chirurgica con una potenza distruttiva devastante.\n\n--- STATISTICHE ---\nPeso: 170000.0 kg\nAmmo: 60\nRegen: 1,700/s  |  Cooldown: 5.0s  |  Cost/Shot: 43\nVelocità Proiettile: 1,220 m/s  |  Portata: 8.0 km\nConsumo Energia: 2 PU/s\nHP Componente: 750,000\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_Mining_MiningLaser_Drake_Default_S0_Desc=Produttore: Drake Interplanetary \n Tipo di articolo: laser minerario \n Dimensione: 1 \n \n Gamma ottimale: 40 m \n Range massimo: 45m \n Mining Laser Potenza: 3150 \n \n Slot moduli: 2 \n \n Resistenza: +25 %\n +35%\n Livello materiale inerte: -30%\n Tasso di finestra di carica ottimale: -40%\n \n su misura per il Drake Golem, questo laser minerario è stato progettato per coloro che iniziano una carriera nel mining. E' stato attentamente calibrato per garantire una facile esperienza dell'operatore e ridurre la probabilità di incidenti catastrofici.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 3,150  |  Portata: 40m→45m\n<EM4>Extraction:</EM4>  DPS: 1,295  |  Portata: 40m→45m\n<EM4>Modifiers:</EM4>  Instability: +35%  |  Optimal Charge Window: +40%  |  Resistance: +25%  |  Inert Filter: +40%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Greycat_1_S1_Desc=Produttore: Greycat Industrial\nTipo di elemento: Mining Laser \nDimensione: 1\n\nPortata ottimale: 30 m\nPortata massima: 90 m\n\nMining Laser Potenza: 504 - 2520\nPotenza laser di estrazione: 1850\n\nSlot modulo: 1\n\nInstabilità del laser: -10%\nTasso finestra di carica ottimale: +40%\nMateriali inerti: -30%\n\nDimensione finestra di carica ottimale: -60%\n\nGreycat classifica Lancet MH1 come supporto laser utilizzato al meglio durante l'estrazione con altri. Mentre la piccola dimensione ottimale della finestra di carica del laser minerario significa che la precisione è fondamentale, Lancet MH1 eccelle nel ridurre la quantità di materiali inerti raccolti dal laser di estrazione. Per le squadre minerarie, è un laser di supporto ideale da utilizzare insieme ad altri laser.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 2,520  |  Portata: 30m→90m\n<EM4>Extraction:</EM4>  DPS: 1,850  |  Portata: 30m→90m\n<EM4>Modifiers:</EM4>  Instability: -10%  |  Optimal Charge Window: -60%  |  Inert Filter: +30%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Greycat_1_S2_Desc=Produttore: Greycat Industrial\nTipo di elemento: Mining Laser \nDimensione: 2\n\nPortata ottimale: 45 m\nPortata massima: 135 m\n\nMining Laser Potenza: 900 - 3600\nPotenza laser di estrazione: 2590\n\nSlot modulo: 2\n\nInstabilità del laser: -10%\nTasso finestra di carica ottimale: +40%\nMateriali inerti: -40%\n\nDimensione finestra di carica ottimale: -60%\n\nGreycat classifica Lancet MH2 come supporto laser utilizzato al meglio durante l'estrazione con altri. Mentre la piccola dimensione ottimale della finestra di carica del laser minerario significa che la precisione è fondamentale, Lancet MH2 eccelle nel riempirla una volta trovata e nel ridurre la quantità di materiali inerti raccolti dal laser di estrazione. Per le squadre minerarie, è un laser di supporto ideale da utilizzare insieme ad altri laser.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 3,600  |  Portata: 45m→135m\n<EM4>Extraction:</EM4>  DPS: 2,590  |  Portata: 45m→135m\n<EM4>Modifiers:</EM4>  Instability: -10%  |  Optimal Charge Window: -60%  |  Inert Filter: +40%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Greycat_Default_S0_Desc=Produttore: Greycat Industrial\nTipo di elemento: Mining Laser \nDimensione: 0\n\nPortata ottimale: 15 m\nPortata massima: 20 m\nRendimento di raccolta: 0,01 SCU/s\nRaggio del punto di raccolta: 1 m\n\nL'Arbor è diventato il punto di raccolta dell'universo il laser da miniera più acclamato grazie agli standard rigorosi e all'abilità commerciale di Greycat Industrial. L'MHV prende lo stesso design classico e lo reinventa per un impianto minerario più compatto, pur offrendo le prestazioni solide e affidabili su cui i minatori hanno imparato a fare affidamento.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 1  |  Portata: 5m→15m\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Greycat_Default_S1_Desc=Produttore: Greycat Industrial\nTipo di elemento: Mining Laser \nDimensione: 1\n\nPortata ottimale: 60 m\nPortata massima: 180 m\n\nMining Laser Potenza: 189 - 1890\nPotenza laser di estrazione: 1850\n\nSlot modulo: 1\n\nInstabilità del laser: -35%\nDimensione finestra di carica ottimale: +40%\nMateriali inerti: -30%\n\nResistenza: +25%\n\nL'Arbor MH1 è diventato il laser minerario più acclamato dell'universo grazie alla Greycat Industries Gli standard rigorosi e l'abilità commerciale di Industrial. Il laser ha trovato favore tra le operazioni industriali e individuali per bilanciare velocità e sicurezza, presentando anche uno speciale sistema di filtraggio che riduce la quantità di materiale inerte raccolto. Greycat ha capitalizzato questa reputazione assicurandosi contratti esclusivi che hanno reso l'Arbor MH1 la testa laser standard sulla maggior parte delle navi minerarie.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 1,890  |  Portata: 60m→180m\n<EM4>Extraction:</EM4>  DPS: 1,850  |  Portata: 60m→180m\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Greycat_Default_S2_Desc=Produttore: Greycat Industrial\nTipo di elemento: Mining Laser \nDimensione: 2\n\nPortata ottimale: 90 m\nPortata massima: 270 m\n\nMining Laser Potenza: 480 - 2400\nPotenza laser di estrazione: 2590\n\nSlot modulo: 2\n\nInstabilità laser: -35%\nDimensione finestra di carica ottimale: +40%\nMateriali inerti: -40%\n\nResistenza: +25%\n\nL'Arbor MH2 è la versione di seconda dimensione dell'arbor annunciato di Greycat serie di laser minerari. Come la variante più piccola, il design solido e affidabile dell'Arbor MH2 ha trovato favore tra le operazioni industriali e individuali per bilanciare velocità e sicurezza, presentando anche uno speciale sistema di filtraggio che riduce la quantità di materiale inerte raccolto.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 2,400  |  Portata: 90m→270m\n<EM4>Extraction:</EM4>  DPS: 2,590  |  Portata: 90m→270m\n<EM4>Modifiers:</EM4>  Instability: -35%  |  Optimal Charge Window: +40%  |  Resistance: +25%  |  Inert Filter: +40%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Shubin_1_S1_Desc=Produttore: Shubin Interstellar\nTipo di elemento: Mining Laser \nDimensione: 1\n\nPortata ottimale: 45 m\nPortata massima: 135 m\n\nMining Laser Potenza: 105 - 2100\nPotenza laser di estrazione: 1295\n\nSlot modulo: 1 \n\nResistenza: -30%\nFinestra di carica ottimale: +20%\nMateriali inerti: -30%\n\nInstabilità laser: +10%\n\nL'Hofstede-S1 è stato progettato con una struttura a reticolo cristallino brevettata che smorza la resistenza naturale di un deposito durante l'estrazione e raccoglie meno materiali inerti durante l'estrazione. Più efficace a corto e medio raggio, un conseguente aumento di instabilità significa che il laser deve essere gestito con attenzione.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 2,100  |  Portata: 45m→135m\n<EM4>Extraction:</EM4>  DPS: 1,295  |  Portata: 45m→135m\n<EM4>Modifiers:</EM4>  Instability: +10%  |  Optimal Charge Window: +60%  |  Resistance: -30%  |  Inert Filter: +30%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Shubin_1_S2_Desc=Produttore: Shubin Interstellar\nTipo di elemento: Mining Laser \nDimensione: 2\n\nPortata ottimale: 60 m\nPortata massima: 180 m\n\nMining Laser Potenza: 336 - 3360\nPotenza laser di estrazione: 1295\n\nSlot modulo: 2 \n\nResistenza: -30%\nFinestra di carica ottimale: +20%\nMateriali inerti: -40%\n\nInstabilità laser: +10%\n\nL'Hofstede-S2 è stato progettato con una struttura a reticolo cristallino brevettata che smorza la resistenza naturale di un deposito durante l'estrazione e raccoglie meno materiali inerti durante l'estrazione. Più efficace a corto e medio raggio, un conseguente aumento di instabilità significa che il laser deve essere gestito con attenzione.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 3,360  |  Portata: 60m→180m\n<EM4>Extraction:</EM4>  DPS: 1,295  |  Portata: 60m→180m\n<EM4>Modifiers:</EM4>  Instability: +10%  |  Optimal Charge Window: +60%  |  Resistance: -30%  |  Inert Filter: +40%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Shubin_2_S1_Desc=Produttore: Shubin Interstellar\nTipo di elemento: Mining Laser \nDimensione: 1\n\nPortata ottimale: 45 m\nPortata massima: 135 m\n\nMining Laser Potenza: 378 - 2220\nPotenza laser di estrazione: 2220\n\nSlot modulo: 0 \n\nResistenza: -45%\nDimensione finestra di carica ottimale: +20%\nMateriali inerti: -30%\n\nInstabilità laser: +35%\n\nShubin ha progettato Klein-S1 per generare un potente laser che consente l'estrazione mineraria Più veloce. Questa potenza comporta rischi aggiuntivi aumentando l'instabilità del laser, ma se usato correttamente, il Klein-S1 può rapidamente raccogliere frutti per il minatore attento.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 2,520  |  Portata: 45m→135m\n<EM4>Extraction:</EM4>  DPS: 2,220  |  Portata: 45m→135m\n<EM4>Modifiers:</EM4>  Instability: +35%  |  Optimal Charge Window: +20%  |  Resistance: -45%  |  Inert Filter: +30%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Shubin_2_S2_Desc=Produttore: Shubin Interstellar\nTipo di elemento: Mining Laser \nDimensione: 2\n\nPortata ottimale: 60 m\nPortata massima: 180 m\n\nMining Laser Potenza: 720 - 3600\nPotenza laser di estrazione: 2775\n\nSlot modulo: 1 \n\nResistenza: -45%\nDimensione finestra di carica ottimale: +20%\nMateriali inerti: -40%\n\nInstabilità laser: +35%\n\nShubin ha progettato Klein-S2 per generare un potente laser che consente l'estrazione mineraria Più veloce. Questa potenza comporta rischi aggiuntivi aumentando l'instabilità del laser, ma se usato correttamente, il Klein-S2 può rapidamente raccogliere frutti per il minatore attento.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 3,600  |  Portata: 60m→180m\n<EM4>Extraction:</EM4>  DPS: 2,775  |  Portata: 60m→180m\n<EM4>Modifiers:</EM4>  Instability: +35%  |  Optimal Charge Window: +20%  |  Resistance: -45%  |  Inert Filter: +40%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Thermyte_1_S1_Desc=Produttore: Thermyte Concern\nTipo di elemento: Mining Laser \nDimensione: 1\n\nPortata ottimale: 45 m\nPortata massima: 135 m\n\nMining Laser Potenza: 420 - 2100\nPotenza laser di estrazione: 2775\n\nSlot modulo: 2 \n\nInstabilità laser: -10%\nDimensione finestra di carica ottimale: +20%\nMateriali inerti: -30%\n\nResistenza: +10%\nPercentuale finestra di carica ottimale: -40%\n\n\nImpatto I eccelle in una varietà di situazioni minerarie. Speciali lenti focalizzate facilitano la lavorazione del deposito stabilizzando il laser e aumentando la finestra di carica ottimale. Ci sono degli svantaggi, tra cui una maggiore resistenza ai depositi e una finestra di carica ottimale per il riempimento più lento, ma Thermyte Concern ha anche fornito due slot per moduli per consentire ai minatori di personalizzare meglio il laser in base al compito da svolgere.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 2,100  |  Portata: 45m→135m\n<EM4>Extraction:</EM4>  DPS: 2,775  |  Portata: 45m→135m\n<EM4>Modifiers:</EM4>  Instability: -10%  |  Optimal Charge Window: +20%  |  Resistance: +10%  |  Inert Filter: +30%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Thermyte_1_S2_Desc=Produttore: Thermyte Concern\nTipo di elemento: Mining Laser \nDimensione: 2\n\nPortata ottimale: 60 m\nPortata massima: 180 m\n\nMining Laser Potenza: 840 - 3360\nPotenza laser di estrazione: 3145\n\nSlot modulo: 3 \n\nInstabilità laser: -10%\nDimensione finestra di carica ottimale: +20%\nMateriali inerti: -40%\n\nResistenza: +10%\nPercentuale finestra di carica ottimale: -40%\n\nL'Impact II eccelle in una varietà di situazioni minerarie. Speciali lenti focalizzate facilitano la lavorazione del deposito stabilizzando il laser e aumentando la finestra di carica ottimale. Ci sono degli svantaggi, tra cui una maggiore resistenza ai depositi e una finestra di carica ottimale per il riempimento più lento, ma Thermyte Concern ha anche fornito tre slot per moduli per consentire ai minatori di personalizzare meglio il laser in base al compito da svolgere.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 3,360  |  Portata: 60m→180m\n<EM4>Extraction:</EM4>  DPS: 3,145  |  Portata: 60m→180m\n<EM4>Modifiers:</EM4>  Instability: -10%  |  Optimal Charge Window: +20%  |  Resistance: +10%  |  Inert Filter: +40%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Thermyte_2_S1_Desc=Produttore: Thermyte Concern\nTipo di elemento: Mining Laser \nDimensione: 1\n\nPortata ottimale: 15 m\nPortata massima: 45 m\n\nMining Laser Potenza: 630 - 3150\nPotenza laser di estrazione: 1850\n\nSlot modulo: 2 \n\nResistenza: -30%\nMateriali inerti: -30%\n\nDimensione finestra di carica ottimale: -40%\n\nPer alcuni, l'uso efficace dell'Helix I è diventato il segno di un vero professionista dell'estrazione mineraria. Thermyte Concern ha conferito al laser una potenza impressionante in grado di superare la resistenza di un deposito ma richiede anche una manipolazione precisa per raggiungere la finestra di carica ottimale. Utilizzato al meglio a distanza ravvicinata, Helix I è dotato di due slot per moduli in modo che i minatori possano personalizzare il laser a proprio piacimento.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 3,150  |  Portata: 15m→45m\n<EM4>Extraction:</EM4>  DPS: 1,850  |  Portata: 15m→45m\n<EM4>Modifiers:</EM4>  Optimal Charge Window: -40%  |  Resistance: -30%  |  Inert Filter: +30%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
item_Mining_MiningLaser_Thermyte_2_S2_Desc=Produttore: Thermyte Concern\nTipo di elemento: Mining Laser \nDimensione: 2\n\nPortata ottimale: 30 m\nPortata massima: 90 m\n\nMining Laser Potenza: 1020 - 4080\nPotenza laser di estrazione: 2590\n\nSlot modulo: 3 \n\nResistenza: -30%\nMateriali inerti: -30%\n\nDimensione finestra di carica ottimale: -40%\n\nPer alcuni, l'uso efficace dell'Helix II è diventato il segno di un vero professionista del settore minerario. Thermyte Concern ha conferito al laser una potenza impressionante in grado di superare la resistenza di un deposito ma richiede anche una manipolazione precisa per raggiungere la finestra di carica ottimale. Utilizzato al meglio a distanza ravvicinata, Helix II è dotato di tre slot per moduli in modo che i minatori possano personalizzare il laser a proprio piacimento.\n\n--- STATISTICHE ---\n<EM4>Fracture:</EM4>  DPS: 4,080  |  Portata: 30m→90m\n<EM4>Extraction:</EM4>  DPS: 2,590  |  Portata: 30m→90m\n<EM4>Modifiers:</EM4>  Optimal Charge Window: -40%  |  Resistance: -30%  |  Inert Filter: +40%\n<EM4>HP Componente:</EM4> 8,000\n<EM4>Max Distortion:</EM4> 500,000
