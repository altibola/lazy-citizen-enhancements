item_DescMXOX_EMP_Device=Produttore: MaxOx\nTipo di elemento: Generatore di raffiche\nDimensione: 1\nTipo di danno: EMP\n\nIl TroMag di MaxOx è un generatore di raffiche ben progettato e affidabile incentrato sull'EMP. La sua popolarità è aumentata nel corso degli anni man mano che i piloti cercano alternative al REP-8 di Behring. Il TroMag vanta un tempo di ricarica più veloce rispetto al suo principale concorrente ma ha un raggio effettivo più piccolo, lasciando ai piloti la possibilità di decidere se preferiscono la velocità o le dimensioni.\n\n--- STATISTICHE ---\nPeso: 10.0 kg\nConsumo Energia: 1 PU/s\nHP Componente: 150\nSignatures:  EM: 0  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescMXOX_NeutronCannon_S1=Produttore: MaxOx\nTipo di articolo: Cannone a neutroni\nTaglia: 1\n\nIl cannone a neutroni NN-13 di MaxOx offre un enorme carico energetico a scapito della velocità e dell'efficienza energetica. Si potrebbe sostenere che la velocità, la cadenza di fuoco e la distanza siano più importanti del danno, ma l'argomento diventa irrilevante se è necessario colpirli una sola volta.\n\n--- STATISTICHE ---\nPeso: 32.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 101.2 (Energy)  |  DPS: 253.0\nAmmo: 25\nRegen: 1,500/s  |  Cooldown: 0.5s  |  Cost/Shot: 90\nVelocità Proiettile: 765 m/s  |  Portata: 1.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 550\nSignatures:  EM: 205  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescMXOX_NeutronCannon_S2=Produttore: MaxOx\nTipo di elemento: Cannone a neutroni\nDimensione: 2\n\nBasato sulla tecnologia dell'NN-13, l'NN-14 di MaxOx offre un aumento significativo della potenza del cannone automatico a neutroni per dare a ogni colpo un pugno devastante . Con questo aumento del danno, tuttavia, arriva un'attrazione più pesante per la tua centrale elettrica.\n\n--- STATISTICHE ---\nPeso: 80.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 152.8 (Energy)  |  DPS: 382.0\nAmmo: 25\nRegen: 2,250/s  |  Cooldown: 0.4s  |  Cost/Shot: 135\nVelocità Proiettile: 762 m/s  |  Portata: 1.3 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 273  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescMXOX_NeutronCannon_S3=Produttore: MaxOx \nTipo di Oggetto: Cannone Neutronico \nTaglia: 3 \n\nBasandosi sulla tecnologia della fortunata serie NN, l'NN-15 di MaxOx offre un significativo aumento di potenza per l'autocannone neutronico per dare a ogni colpo un impatto devastante. Con questo aumento di danno, tuttavia, deriva un maggiore consumo per il tuo impianto energetico.\n\n--- STATISTICHE ---\nPeso: 200.0 kg\nCadenza di Fuoco: 150 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 220.7 (Energy)  |  DPS: 551.8\nAmmo: 25\nRegen: 3,375/s  |  Cooldown: 0.4s  |  Cost/Shot: 202\nVelocità Proiettile: 755 m/s  |  Portata: 1.5 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 341  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescMXOX_NeutronRepeater_S1=Produttore: MaxOx\nTipo di articolo: ripetitore di neutroni\nDimensione: 1\n\nL'NDB-26 utilizza un sistema a doppia canna per sparare proiettili di neutroni a una velocità rapida. Devastante a distanza ravvicinata, questo ripetitore di neutroni offre ancora abbastanza potenza a medio raggio da convincere qualsiasi attaccante a riconsiderare il proprio assalto.\n\n--- STATISTICHE ---\nPeso: 16.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 38.0 (Energy)  |  DPS: 316.5\nAmmo: 75\nRegen: 1,758/s  |  Cooldown: 0.7s  |  Cost/Shot: 32\nVelocità Proiettile: 1,275 m/s  |  Portata: 2.0 km\nConsumo Energia: 0 PU/s\nHP Componente: 525\nSignatures:  EM: 138  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescMXOX_NeutronRepeater_S2=Produttore: MaxOx\nTipo di articolo: ripetitore di neutroni\nTaglia: 2\n\nCaratterizzato da un design elegante e scientifico, MaxOx NDB-28 è il passo successivo verso un serio potere frenante. Le canne gemelle sovrappongono gli esplosivi per un fuoco neutronico prolungato che rimane efficace a corto e medio raggio.\n\n--- STATISTICHE ---\nPeso: 40.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 57.0 (Energy)  |  DPS: 474.8\nAmmo: 75\nRegen: 2,638/s  |  Cooldown: 0.8s  |  Cost/Shot: 48\nVelocità Proiettile: 1,271 m/s  |  Portata: 2.2 km\nConsumo Energia: 1 PU/s\nHP Componente: 850\nSignatures:  EM: 184  |  IR: 0\nTemp. Surriscaldamento: 450K
item_DescMXOX_NeutronRepeater_S3=Produttore: MaxOx\nTipo di articolo: ripetitore di neutroni\nDimensione: 3\n\nDecenni di lavoro di progettazione sono stati dedicati al perfezionamento della linea NDB di ripetitori di neutroni. L'S3 NDB-30 spara rapidamente proiettili di neutroni potenti e precisi che dissuaderanno rapidamente chiunque sia così stupido da avvicinarsi troppo.\n\n--- STATISTICHE ---\nPeso: 100.0 kg\nCadenza di Fuoco: 500 RPM\nFire Modalità: Semi-Auto\nDanno Alpha: 85.5 (Energy)  |  DPS: 712.5\nAmmo: 75\nRegen: 3,958/s  |  Cooldown: 0.8s  |  Cost/Shot: 71\nVelocità Proiettile: 1,258 m/s  |  Portata: 2.4 km\nConsumo Energia: 1 PU/s\nHP Componente: 1,024\nSignatures:  EM: 230  |  IR: 0\nTemp. Surriscaldamento: 450K
